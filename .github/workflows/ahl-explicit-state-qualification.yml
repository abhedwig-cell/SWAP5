name: AHL explicit-state paired qualification
on:
  pull_request:
    branches: [integration/f-ci-canonical]
permissions:
  contents: read
env:
  AHL_BASE: a8275101d91f0ab5b413290e9b00bb5666b11917
  AHL_CANDIDATE: 1354f5cad9a4db106db50e4e5d8d6a6ba141bca3
  PYTHONUTF8: '1'
jobs:
  paired:
    if: github.event.pull_request.number == 1626
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        probe: [contact-O0, contact-O2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run both exact sources on this runner
        env:
          PROBE: ${{ matrix.probe }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$AHL_BASE"
          git diff --exit-code "$AHL_CANDIDATE" HEAD -- src app reference tools tests
          mkdir -p "$RUNNER_TEMP/paired"
          git worktree add --detach "$RUNNER_TEMP/base" "$AHL_BASE"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$AHL_CANDIDATE"
          {
            cat /etc/os-release
            printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
            gfortran --version
            python3 --version
          } | tee "$RUNNER_TEMP/paired/environment.txt"
          for label in base candidate; do
            cd "$RUNNER_TEMP/$label"
            git rev-parse HEAD | tee "$RUNNER_TEMP/paired/$label.sha"
            out="$RUNNER_TEMP/paired/$label"
            mkdir -p "$out"
            code=0
            OMP_NUM_THREADS=1 python3 -B tests/dataqual15/qualify_nonlinear_native_contact.py --optimization "${PROBE#contact-}" \
              --output "$RUNNER_TEMP/contact-$label" > "$out/run.log" 2>&1 || code=$?
            if [[ $code -eq 0 ]]; then
              python3 -B tests/dataqual15/analyze_native_thermal_receipts.py \
                "$RUNNER_TEMP/contact-$label/actual-prefix/actual-thermal.csv" \
                --output "$out/THERMAL_ANALYSIS.json" >> "$out/run.log" 2>&1 || code=$?
            fi
            if [[ -d "$RUNNER_TEMP/contact-$label" ]]; then
              find "$RUNNER_TEMP/contact-$label" -type f \( -name RESULT.json -o -name '*.log' -o -name '*.stderr' -o -name '*.stdout' \) -print0 |
              while IFS= read -r -d '' file; do
                (cd "$RUNNER_TEMP/contact-$label" && cp --parents "${file#"$RUNNER_TEMP/contact-$label/"}" "$out")
              done
            fi
            printf '%s\n' "$code" > "$out/exit.txt"
            echo "$label $PROBE exit=$code"
            tail -n 40 "$out/run.log"
          done
          test "$(cat "$RUNNER_TEMP/paired/base/exit.txt")" = 0
          test "$(cat "$RUNNER_TEMP/paired/candidate/exit.txt")" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ahl-paired-${{ matrix.probe }}
          path: ${{ runner.temp }}/paired
