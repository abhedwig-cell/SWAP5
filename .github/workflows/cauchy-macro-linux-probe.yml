name: Grassgrowth trial cache oxygen controls
on:
  push:
    branches: [codex/cauchy-macro-linux-probe]
    paths: [.github/workflows/cauchy-macro-linux-probe.yml]
permissions:
  contents: read
jobs:
  oxygen:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 589c1d27536d2daf89c921f1bcabc780aec882bc
          sparse-checkout: |
            src
            tests/physics
      - name: Run original chain and exact cache checks
        shell: bash
        run: |
          gfortran --version
          for opt in O0 O2; do
            C3A_OPT="$opt" bash tests/physics/run_bartholomeus_active_chain.sh | tee "$opt.txt"
            grep -Fx WATERFILM_EXACT_TRIAL_CACHE=PASS "$opt.txt"
          done
          cmp O0.txt O2.txt
