name: AHL baseline numerical guard comparison
on:
  push:
    branches: [codex/cauchy-macro-linux-probe]
    paths: [.github/workflows/cauchy-macro-linux-probe.yml]
permissions:
  contents: read
jobs:
  canonical:
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        script:
          - tests/publication/run_pub_p2e01_e0_paired_pilot.sh
          - tests/publication/run_pub_p2e02_reference_uncertainty_pilot.sh
          - tests/publication/run_pub_p2e04_reference_bc_sweeps.sh
          - tests/fpe/run_fpe_elastic65.sh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8275101d91f0ab5b413290e9b00bb5666b11917
          fetch-depth: 0
      - name: Run unchanged guard on exact canonical base
        shell: bash
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          gfortran --version
          git rev-parse HEAD
          bash "$SCRIPT"
