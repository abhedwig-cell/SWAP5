name: Grassgrowth cache runtime preservation
on:
  push:
    branches: [codex/cauchy-macro-linux-probe]
    paths: [.github/workflows/cauchy-macro-linux-probe.yml]
permissions:
  contents: read
jobs:
  oxygen-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0e5d9e1dad0a92e3ecd4ea6f464ab55be7af80e
          sparse-checkout: |
            src
            tests/physics
            tests/fsi
      - name: Run production backend oxygen, rollback and restart fixture
        env:
          C3A_OPTS: ${{ matrix.optimization }}
        run: |
          gfortran --version
          git rev-parse HEAD
          C3A_TESTED_SHA="$(git rev-parse HEAD)" python3 -B tests/physics/run_bartholomeus_application.py
