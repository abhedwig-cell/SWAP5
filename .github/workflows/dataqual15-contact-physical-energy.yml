name: DATAQUAL15 contact constraint and conservative physical heat research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/dataqual15/*contact_physical_energy.py'
      - 'tests/dataqual15/research/**'
      - 'integration/dataqual15/CONTACT_PHYSICAL_ENERGY*'
      - '.github/workflows/dataqual15-contact-physical-energy.yml'
permissions:
  contents: read
jobs:
  bounded-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install mpmath==1.3.0
      - name: Verify source-bound Windows capsule and independent budgets
        run: python -B tests/dataqual15/verify_contact_physical_energy.py
      - name: Fresh checked Linux O0 and O2 experiments
        run: python -B tests/dataqual15/qualify_contact_physical_energy.py --output contact-physics-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-physical-heat-research
          path: contact-physics-ci
