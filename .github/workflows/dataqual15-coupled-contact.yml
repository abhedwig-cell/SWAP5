name: DATAQUAL15 full-column contact and transport donor evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/dataqual15/qualify_coupled_contact.py'
      - 'tests/dataqual15/verify_coupled_contact_evidence.py'
      - 'tests/dataqual15/qualify_transport_donors.py'
      - 'tests/dataqual15/analyze_transport_donors.py'
      - 'tests/dataqual15/research/coupled_*'
      - 'tests/dataqual15/research/liquid_donor_driver.f90'
      - 'integration/dataqual15/COUPLED_*'
      - '.github/workflows/dataqual15-coupled-contact.yml'
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  PYTHONUTF8: '1'
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify sealed Windows full-column/history and transport evidence
        run: python -B tests/dataqual15/verify_coupled_contact_evidence.py
      - name: Cold202-provider full native contact and transport observations
        run: python -B tests/dataqual15/qualify_coupled_contact.py --optimization ${{ matrix.optimization }} --output coupled-native-ci
      - name: Actual water ledger, endpoint donor scenarios and missing-data controls
        run: python -B tests/dataqual15/qualify_transport_donors.py coupled-native-ci/actual-prefix --output coupled-donors-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupled-${{ matrix.optimization }}
          path: |
            coupled-native-ci
            coupled-donors-ci
