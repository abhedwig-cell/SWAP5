name: DATAQUAL15 original Grassgrowth sprint
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/dataqual15-grass-sprint.yml
      - tests/dataqual15/**
      - tools/solute/build_grass_startup.py
      - tools/solute/build_grass_diagnostic.py
      - integration/dataqual15/STRESS_EVIDENCE*
permissions:
  contents: read
concurrency:
  group: dataqual15-grass-sprint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  stress-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify and export permanent scientific evidence, retaining failed gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; from pathlib import Path; assert json.loads(Path("integration/dataqual15/STRESS_EVIDENCE_MANIFEST.json").read_text())["has_native_thermal"]'
          python3 -B tests/dataqual15/stress_evidence.py --extract "$RUNNER_TEMP/study"
      - name: Rebuild paired real owners and execute the diagnostic adapter
        shell: bash
        run: |
          set -euo pipefail
          FC=$(command -v gfortran-13)
          python3 -B tests/dataqual15/qualify_stress.py --compiler "$FC" --output "$RUNNER_TEMP/stress" --paired-only --observations "$RUNNER_TEMP/study/observations/coarse/native"
          python3 -B tools/solute/build_grass_diagnostic.py --compiler "$FC" --input-archive "$RUNNER_TEMP/stress/original-O2/ttobj/libttutil.a" --output "$RUNNER_TEMP/stress/diagnostic-smoke" --optimization O2 --profile checked --driver "$RUNNER_TEMP/study/observations/coarse/observed_grass.f90" --provider-override "$RUNNER_TEMP/study/observations/observed_backend.f90" --end 1 --policy retained
          python3 -c 'import csv,json,sys; from pathlib import Path; b=Path(sys.argv[1]); old=Path(sys.argv[2]); r=json.loads((b/"BUILD.json").read_text()); assert r["native_returncode"]==0 and r["original_project_completed_days"]==1; rows=lambda p:list(csv.DictReader(p.open())); assert all(rows(b/"original-interval"/name)==rows(old/name)[:1]for name in ["budget.csv","crop.csv"])' "$RUNNER_TEMP/stress/diagnostic-smoke" "$RUNNER_TEMP/study/observations/coarse/native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataqual15-stress-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stress/
          retention-days: 30
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify inherited full original history and execute sealed recovery
        run: python3 -B tests/dataqual15/recover_grass_full.py --output "$RUNNER_TEMP/recovery"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataqual15-recovery-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/recovery/
          retention-days: 30
  preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Whole original mowing and existing runtime owners
        shell: bash
        run: |
          set -euo pipefail
          FC=$(command -v gfortran-13)
          python3 -B tests/dataqual15/qualify_mowing.py --compiler "$FC" --output "$RUNNER_TEMP/mowing"
          python3 -B tests/dataqual15/qualify_runtime.py --compiler "$FC" --output "$RUNNER_TEMP/runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataqual15-preservation-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/mowing/
            ${{ runner.temp }}/runtime/
          retention-days: 30
