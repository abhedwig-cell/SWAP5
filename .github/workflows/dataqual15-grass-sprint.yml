name: DATAQUAL15 original Grassgrowth sprint
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/dataqual15-grass-sprint.yml
      - tests/dataqual15/**
      - tools/solute/build_grass_startup.py
      - tools/solute/build_grass_diagnostic.py
permissions:
  contents: read
concurrency:
  group: dataqual15-grass-sprint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  stress-attribution:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41069788879
          name: dataqual15-stress-583ddd473a5392f53d672d043e87404eb7dca3dd
          path: ${{ runner.temp }}/prior-stress/
      - name: Paired real oxygen owners and timestep refinement
        shell: bash
        run: |
          set -euo pipefail
          FC=$(command -v gfortran-13)
          python3 -B tests/dataqual15/qualify_stress.py --compiler "$FC" --output "$RUNNER_TEMP/stress" --paired-only --observations "$RUNNER_TEMP/prior-stress/coarse/native"
          python3 -B tools/solute/build_grass_diagnostic.py --compiler "$FC" --input-archive "$RUNNER_TEMP/stress/original-O2/ttobj/libttutil.a" --output "$RUNNER_TEMP/stress/diagnostic-smoke" --optimization O2 --profile checked --driver "$RUNNER_TEMP/prior-stress/coarse/observed_grass.f90" --provider-override "$RUNNER_TEMP/prior-stress/observed_backend.f90" --end 1 --policy retained
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataqual15-stress-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stress/
          retention-days: 30
  donor-timestep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Authentic original donor with disclosed DTMAX refinement
        run: python3 -B tests/dataqual15/qualify_donor_timestep.py --output "$RUNNER_TEMP/donor-timestep" --profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataqual15-donor-timestep-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/donor-timestep/
          retention-days: 30
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify inherited full original history and execute sealed recovery
        run: python3 -B tests/dataqual15/recover_grass_full.py --output "$RUNNER_TEMP/recovery"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataqual15-recovery-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/recovery/
          retention-days: 30
  preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Whole original mowing and existing runtime owners
        shell: bash
        run: |
          set -euo pipefail
          FC=$(command -v gfortran-13)
          python3 -B tests/dataqual15/qualify_mowing.py --compiler "$FC" --output "$RUNNER_TEMP/mowing"
          python3 -B tests/dataqual15/qualify_runtime.py --compiler "$FC" --output "$RUNNER_TEMP/runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataqual15-preservation-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/mowing/
            ${{ runner.temp }}/runtime/
          retention-days: 30
