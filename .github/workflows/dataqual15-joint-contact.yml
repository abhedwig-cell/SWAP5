name: DATAQUAL15 bounded joint contact contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/solver/mod_reference_bordered_solver.f90'
      - 'src/solver/mod_reference_linear_solver.f90'
      - 'src/process/macropore/mod_macropore_standard_storage.f90'
      - 'tests/dataqual15/*empty_pocket*'
      - 'tests/dataqual15/*joint*'
      - 'tests/dataqual15/research/joint_*'
      - '.github/workflows/dataqual15-joint-contact.yml'
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Real border and entry/perched/ordinary contact O0/O2
        run: python -B tests/dataqual15/run_joint_entry_contracts.py --current-drainage --compiler /usr/bin/gfortran --output joint-contracts
      - name: Real positive-pocket candidate and vertical closure O0/O2
        run: python -B tests/dataqual15/run_empty_pocket_contract.py --compiler /usr/bin/gfortran --output pocket-contracts
      - name: Real current groundwater view O0/O2
        run: python -B tests/dataqual15/run_joint_current_view_contract.py --compiler /usr/bin/gfortran --output current-view-contracts
      - name: Scoped candidate source callback and refusal O0/O2
        run: python -B tests/dataqual15/run_joint_source_callback_contract.py --compiler /usr/bin/gfortran --output current-source-contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-contact-component
          path: |
            joint-contracts
            pocket-contracts
            current-view-contracts
            current-source-contracts
