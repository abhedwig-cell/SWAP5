name: DATAQUAL15 bounded joint contact contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/solver/mod_reference_bordered_solver.f90'
      - 'src/solver/mod_reference_linear_solver.f90'
      - 'tests/dataqual15/*joint*'
      - 'tests/dataqual15/research/joint_*'
      - '.github/workflows/dataqual15-joint-contact.yml'
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Real border and corrected entry/perched action O0/O2
        run: python -B tests/dataqual15/run_joint_entry_contracts.py --joint-contact --compiler /usr/bin/gfortran --output joint-contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-contact-component
          path: joint-contracts
