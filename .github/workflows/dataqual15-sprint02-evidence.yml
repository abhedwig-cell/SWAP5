name: DATAQUAL15 sprint02 portable evidence
on:
  push:
    branches: [codex/grassgrowth-sprint02]
    paths:
      - .github/workflows/dataqual15-sprint02-evidence.yml
      - tests/dataqual15/sprint02_evidence.py
      - integration/dataqual15/SPRINT02_EVIDENCE.tar.xz
      - integration/dataqual15/SPRINT02_EVIDENCE_MANIFEST.json
permissions:
  contents: read
jobs:
  portable-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify raw source-bound data without repeating model runs
        run: python3 -B tests/dataqual15/sprint02_evidence.py
