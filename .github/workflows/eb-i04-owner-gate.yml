name: EB-I04 owner qualification

on:
  push:
    branches:
      - work/eb-i04-liquid-water-sensible-enthalpy-contract
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard current canonical and frozen thermal context
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/f-ci-canonical
          CANONICAL=2a0db2524fba6e258316ce82630c60ea1c9c673a
          test "$(git rev-parse origin/integration/f-ci-canonical)" = "$CANONICAL"
          test "$(git rev-parse "$CANONICAL:src/process/mod_soil_temperature_contract.f90")" = "baa13df3975de2c699b0ec910477bcfa9b47f15e"
          test "$(git rev-parse "$CANONICAL:src/process/mod_restricted_soil_temperature.f90")" = "fa4e1d7b48d3515e6569c9080d497178c25c4e85"
          test "$(git rev-parse "HEAD:src/process/mod_soil_temperature_contract.f90")" = "baa13df3975de2c699b0ec910477bcfa9b47f15e"
          test "$(git rev-parse "HEAD:src/process/mod_restricted_soil_temperature.f90")" = "fa4e1d7b48d3515e6569c9080d497178c25c4e85"

      - name: Check EB-I04 delta
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL=2a0db2524fba6e258316ce82630c60ea1c9c673a
          git diff --name-only "$CANONICAL" HEAD | sort > changed.txt
          cat > allowed.txt <<'EOF'
          .github/workflows/eb-i04-owner-gate.yml
          src/process/mod_liquid_water_sensible_enthalpy.f90
          tests/test_eb_i04_liquid_water_sensible_enthalpy.f90
          EOF
          sort -o allowed.txt allowed.txt
          diff -u allowed.txt changed.txt
          ! grep -Eiq '(open\s*\(|read\s*\(|write\s*\(|\.swp|modflow)' src/process/mod_liquid_water_sensible_enthalpy.f90
          ! grep -Eiq 'mod_energy_conservation|mod_soil_thermal_energy_contract|mod_soil_water_phase_flux_view' \
              src/process/mod_liquid_water_sensible_enthalpy.f90

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Compile and run O0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-o0
          cd build-o0
          gfortran -std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -O0 \
            ../src/process/mod_liquid_water_sensible_enthalpy.f90 \
            ../tests/test_eb_i04_liquid_water_sensible_enthalpy.f90 \
            -o test-eb-i04
          ./test-eb-i04 | tee ../eb-i04-o0.txt

      - name: Compile and run O2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-o2
          cd build-o2
          gfortran -std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -O2 \
            ../src/process/mod_liquid_water_sensible_enthalpy.f90 \
            ../tests/test_eb_i04_liquid_water_sensible_enthalpy.f90 \
            -o test-eb-i04
          ./test-eb-i04 | tee ../eb-i04-o2.txt

      - name: Require optimization-invariant evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'EB-I04 liquid-water sensible enthalpy: PASS' eb-i04-o0.txt
          grep -Fx 'EB-I04 liquid-water sensible enthalpy: PASS' eb-i04-o2.txt
          cmp eb-i04-o0.txt eb-i04-o2.txt
