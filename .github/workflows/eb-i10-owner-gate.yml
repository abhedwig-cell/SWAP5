name: EB-I10 owner qualification

on:
  push:
    branches:
      - work/eb-i10-accepted-water-thermal-provenance-binding
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard current canonical and pinned transaction authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/f-ci-canonical
          CANONICAL=2a0db2524fba6e258316ce82630c60ea1c9c673a
          test "$(git rev-parse origin/integration/f-ci-canonical)" = "$CANONICAL"
          test "$(git rev-parse "$CANONICAL:src/transaction/mod_transaction_reference.f90")" = 834487df4e7a38c7c8ffd83805d98933714c6977
          test "$(git rev-parse "$CANONICAL:src/runtime/mod_canonical_contracts.f90")" = 3cbb81b25626e6574ae83416f088dc52882f91fc
          test "$(git rev-parse "$CANONICAL:src/runtime/mod_canonical_interval_runtime.f90")" = f41f725df4be883d277a8fd5afe5a6f1bc14ad1b
          test "$(git rev-parse "$CANONICAL:src/kernel/mod_kernel_transactions.f90")" = c7c5b7d3357e4e6739c8f647d6232baca45563e6
          test "$(git rev-parse "$CANONICAL:src/runtime/mod_fmr_accepted_commit_receipt.f90")" = 6798b3296b426950bf028814585c3f5de9be950b

      - name: Check EB-I10 technical delta
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL=2a0db2524fba6e258316ce82630c60ea1c9c673a
          git diff --name-only "$CANONICAL" HEAD | sort > changed.txt
          cat > allowed.txt <<'EOF'
          .github/workflows/eb-i10-owner-gate.yml
          src/runtime/mod_accepted_water_thermal_provenance.f90
          tests/test_eb_i10_accepted_water_thermal_provenance.f90
          EOF
          sort -o allowed.txt allowed.txt
          diff -u allowed.txt changed.txt
          ! grep -Eiq '(open\s*\(|read\s*\(|write\s*\(|\.swp|modflow)' src/runtime/mod_accepted_water_thermal_provenance.f90
          ! grep -Eiq '(rain|precipitation|irrigation|runon|runoff|drain|root|snow|macropore|groundwater)' src/runtime/mod_accepted_water_thermal_provenance.f90
          ! grep -Eiq '^[[:space:]]*use[[:space:]].*(soil_temperature|hydraulic|energy|enthalpy)' src/runtime/mod_accepted_water_thermal_provenance.f90
          ! grep -Eiq '^[[:space:]]*allocate[[:space:]]*\(' src/runtime/mod_accepted_water_thermal_provenance.f90

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Compile and run O0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-o0
          cd build-o0
          DEP='-std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -Wno-error=compare-reals -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow -O0'
          NEW='-std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow -O0'
          gfortran $DEP -c ../src/transaction/mod_transaction_reference.f90
          gfortran $DEP -c ../src/runtime/mod_canonical_contracts.f90
          gfortran $DEP -c ../src/runtime/mod_canonical_interval_runtime.f90
          gfortran $DEP -c ../src/kernel/mod_kernel_transactions.f90
          gfortran $DEP -c ../src/runtime/mod_fmr_accepted_commit_receipt.f90
          gfortran $NEW -c ../src/runtime/mod_accepted_water_thermal_provenance.f90
          gfortran $NEW -c ../tests/test_eb_i10_accepted_water_thermal_provenance.f90
          gfortran mod_transaction_reference.o mod_canonical_contracts.o mod_canonical_interval_runtime.o \
            mod_kernel_transactions.o mod_fmr_accepted_commit_receipt.o mod_accepted_water_thermal_provenance.o \
            test_eb_i10_accepted_water_thermal_provenance.o -o test-eb-i10
          ./test-eb-i10 | tee ../eb-i10-o0.txt

      - name: Compile and run O2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-o2
          cd build-o2
          DEP='-std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -Wno-error=compare-reals -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow -O2'
          NEW='-std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow -O2'
          gfortran $DEP -c ../src/transaction/mod_transaction_reference.f90
          gfortran $DEP -c ../src/runtime/mod_canonical_contracts.f90
          gfortran $DEP -c ../src/runtime/mod_canonical_interval_runtime.f90
          gfortran $DEP -c ../src/kernel/mod_kernel_transactions.f90
          gfortran $DEP -c ../src/runtime/mod_fmr_accepted_commit_receipt.f90
          gfortran $NEW -c ../src/runtime/mod_accepted_water_thermal_provenance.f90
          gfortran $NEW -c ../tests/test_eb_i10_accepted_water_thermal_provenance.f90
          gfortran mod_transaction_reference.o mod_canonical_contracts.o mod_canonical_interval_runtime.o \
            mod_kernel_transactions.o mod_fmr_accepted_commit_receipt.o mod_accepted_water_thermal_provenance.o \
            test_eb_i10_accepted_water_thermal_provenance.o -o test-eb-i10
          ./test-eb-i10 | tee ../eb-i10-o2.txt

      - name: Require optimization-invariant evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'EB-I10 accepted water thermal provenance: PASS' eb-i10-o0.txt
          grep -Fx 'EB-I10 accepted water thermal provenance: PASS' eb-i10-o2.txt
          cmp eb-i10-o0.txt eb-i10-o2.txt
