name: EB-I16 external donor contract

on:
  push:
    branches:
      - work/eb-i16-external-bottom-thermal-donor-contract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-eb-i16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tested head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EB_I16_TESTED_HEAD=${GITHUB_SHA}"
          echo "EB_I16_TESTED_TREE=$(git rev-parse HEAD^{tree})"

      - name: Compiler identity
        run: gfortran --version | head -n 1

      - name: EB-I16 external donor contract gate
        run: bash tests/eb/run_eb_i16_external_donor_contract_gate.sh

      - name: EB-I15 exact-base preservation
        shell: bash
        run: |
          set -euo pipefail
          BASE=0181b7b674cc89d729e361dafc1135b719e23a7d
          workdir="$(mktemp -d)"
          rmdir "$workdir"
          git worktree add --detach "$workdir" "$BASE"
          (
            cd "$workdir"
            bash tests/eb/run_eb_i15_bottom_sensible_energy_gate.sh
          )
          git worktree remove --force "$workdir"

      - name: Groundwater interface contract compile preservation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/eb_i16_gw
          mkdir -p build/eb_i16_gw
          gfortran -std=f2008 -Wall -Wextra -pedantic -fcheck=all \
            -J build/eb_i16_gw -c src/runtime/mod_groundwater_coupling_contract.f90 \
            -o build/eb_i16_gw/mod_groundwater_coupling_contract.o

      - name: Exact production tree preservation
        shell: bash
        run: |
          set -euo pipefail
          BASE=0181b7b674cc89d729e361dafc1135b719e23a7d
          test "$(git rev-parse ${BASE}:src)" = "$(git rev-parse HEAD:src)"
          echo 'EB_I16_EXACT_SRC_TREE_PRESERVED=PASS'

      - name: Scope whitespace check
        run: git diff --check 0181b7b674cc89d729e361dafc1135b719e23a7d...HEAD
