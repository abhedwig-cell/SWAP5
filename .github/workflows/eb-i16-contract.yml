name: EB-I16 external bottom donor thermal binding contract

on:
  push:
    branches:
      - work/eb-i16-external-bottom-donor-thermal-binding-contract
  workflow_dispatch:

jobs:
  qualify-eb-i16:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tested head identity
        run: |
          echo "EB_I16_TESTED_HEAD=${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: EB-I16 external bottom thermal binding contract gate
        run: bash tests/eb/run_eb_i16_external_bottom_thermal_binding_gate.sh
      - name: EB-I15 evaluator preservation
        run: bash tests/eb/run_eb_i15_bottom_sensible_energy_gate.sh
      - name: Scope whitespace check
        run: git diff --check 0181b7b674cc89d729e361dafc1135b719e23a7d..HEAD
