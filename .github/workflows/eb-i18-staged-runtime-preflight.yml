name: EB-I18 candidate-bound bottom energy qualification

on:
  push:
    branches:
      - work/eb-i18-candidate-bound-bottom-energy-publication
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eb-i18-candidate-bound-bottom-energy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tested head identity
        run: |
          echo "EB_I18_TESTED_HEAD=$(git rev-parse HEAD)"
          echo "EB_I18_TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Compiler identity
        run: gfortran --version
      - name: Qualify staged migration or committed production runtime
        run: bash tests/eb/run_eb_i18_staged_runtime_preflight.sh
      - name: Persist production runtime after qualified staged migration
        run: |
          if git diff --quiet -- src/runtime/mod_fmr_serialized_multiswap_runtime.f90 tests/eb/test_eb_i18_transaction_publication.f90; then
            echo 'EB_I18_EXACT_HEAD_PRODUCTION_QUALIFICATION=PASS'
            exit 0
          fi
          git diff --check -- src/runtime/mod_fmr_serialized_multiswap_runtime.f90 tests/eb/test_eb_i18_transaction_publication.f90
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/mod_fmr_serialized_multiswap_runtime.f90 tests/eb/test_eb_i18_transaction_publication.f90
          git commit -m 'feat(EB-I18): commit candidate-bound bottom energy publication'
          git push origin HEAD:work/eb-i18-candidate-bound-bottom-energy-publication
          echo 'EB_I18_PRODUCTION_RUNTIME_COMMITTED_AFTER_QUALIFIED_MIGRATION=PASS'
