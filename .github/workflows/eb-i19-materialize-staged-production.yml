name: EB-I19 one-shot staged production materialization

on:
  push:
    branches:
      - work/eb-i19-production-bottom-energy-publication-materialization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[eb-i19-materialized]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compiler identity
        run: gfortran --version

      - name: Pin current canonical and pre-materialization source
        run: |
          set -euo pipefail
          canonical=5e5e498dc56d1df1dd7ebebbf9901c946445a1ab
          owner=15184dd06c1d0f8accc0d306a12d25a3568f1f2e
          git fetch -q origin integration/f-ci-canonical
          test "$(git rev-parse origin/integration/f-ci-canonical)" = "$canonical"
          git merge-base --is-ancestor "$owner" HEAD
          test "$(git hash-object src/runtime/mod_fmr_serialized_reference_backend.f90)" = 21e0e4229f202f1a3a74c4da004aa32a2c855f03
          test "$(git hash-object src/runtime/mod_fmr_serialized_multiswap_runtime.f90)" = f06a2eef7b47880e449cf9b201342d7bd1e197e1
          echo 'EB_I19_PREMATERIALIZATION_LOCK=PASS'

      - name: Materialize previously qualified staged source
        run: |
          set -euo pipefail
          python3 tests/eb/_apply_eb_i18r_current_backend_patch.py
          python3 tests/eb/_apply_eb_i18r_runtime_patch.py
          python3 tests/eb/_normalize_eb_i18r_current_canonical_fixture.py
          python3 tests/eb/_strengthen_eb_i18r_hydrology_assertions.py

          changed="$(git diff --name-only | sort)"
          expected=$'src/runtime/mod_fmr_serialized_multiswap_runtime.f90\nsrc/runtime/mod_fmr_serialized_reference_backend.f90\ntests/eb/test_eb_i18_transaction_publication.f90'
          if test "$changed" != "$expected"; then
            printf 'Unexpected materialization delta:\n%s\n' "$changed" >&2
            exit 191
          fi
          git diff --check -- \
            src/runtime/mod_fmr_serialized_reference_backend.f90 \
            src/runtime/mod_fmr_serialized_multiswap_runtime.f90 \
            tests/eb/test_eb_i18_transaction_publication.f90
          echo 'EB_I19_EXACT_STAGED_MATERIALIZATION_DELTA=PASS'

      - name: Create local materialization commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/runtime/mod_fmr_serialized_reference_backend.f90 \
            src/runtime/mod_fmr_serialized_multiswap_runtime.f90 \
            tests/eb/test_eb_i18_transaction_publication.f90
          git commit -m 'feat(EB-I19): materialize bottom-energy publication in production runtime [eb-i19-materialized]'
          echo "EB_I19_LOCAL_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "EB_I19_LOCAL_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Qualify local materialized candidate before push
        run: bash tests/eb/run_eb_i19_production_materialization_gate.sh

      - name: Push only qualified materialization commit
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'EB_I19_QUALIFIED_MATERIALIZATION_PUSHED=PASS'
