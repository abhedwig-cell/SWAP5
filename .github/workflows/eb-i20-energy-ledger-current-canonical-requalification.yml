name: EB-I20 energy-ledger current-canonical requalification

on:
  push:
    branches:
      - work/eb-i20-energy-conservation-ledger-current-canonical-requalification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tested head identity
        run: |
          echo "EB_I20_TESTED_HEAD=$(git rev-parse HEAD)"
          echo "EB_I20_TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Compiler identity
        run: gfortran --version
      - name: Requalify immutable EB-I01 ledger on current canonical
        run: bash tests/eb/run_eb_i20_energy_ledger_current_canonical_requalification.sh
