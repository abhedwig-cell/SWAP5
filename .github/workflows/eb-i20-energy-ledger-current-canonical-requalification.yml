name: F-VQ81 independent energy-ledger qualification

on:
  push:
    branches:
      - qualification/f-vq81-eb-i20r-batch-safe-energy-ledger-independent-qualification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tested head identity
        run: |
          echo "FVQ81_WORKFLOW_HEAD=$(git rev-parse HEAD)"
          echo "FVQ81_WORKFLOW_TREE=$(git rev-parse HEAD^{tree})"
      - name: Compiler identity
        run: gfortran --version
      - name: Independent qualification
        run: bash tests/fvq/run_fvq81_energy_ledger_independent.sh
