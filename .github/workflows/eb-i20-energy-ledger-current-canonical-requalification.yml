name: EB-I20 energy-ledger qualification

on:
  push:
    branches:
      - work/eb-i20-energy-conservation-ledger-current-canonical-requalification
      - work/eb-i20r-batch-safe-energy-ledger-invariant-handling
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tested head identity
        run: |
          echo "EB_TESTED_HEAD=$(git rev-parse HEAD)"
          echo "EB_TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Compiler identity
        run: gfortran --version
      - name: Run branch-specific EB gate
        run: |
          if [[ "$GITHUB_REF_NAME" == "work/eb-i20r-batch-safe-energy-ledger-invariant-handling" ]]; then
            bash tests/eb/run_eb_i20r_batch_safe_energy_ledger_gate.sh
          else
            bash tests/eb/run_eb_i20_energy_ledger_current_canonical_requalification.sh
          fi
