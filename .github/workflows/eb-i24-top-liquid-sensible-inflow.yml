name: EB-I24 accepted top liquid sensible inflow

on:
  push:
    branches:
      - work/eb-i24-accepted-top-liquid-sensible-inflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run EB-I24 owner qualification
        shell: bash
        run: bash tests/eb/run_eb_i24_top_liquid_sensible_inflow_gate.sh
