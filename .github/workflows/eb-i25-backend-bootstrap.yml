name: EB-I25 backend bootstrap

on:
  push:
    branches:
      - work/eb-i25-accepted-multisubstep-sensible-boundary
    paths:
      - 'tools/eb_i25_patch_backend.py'
      - '.github/workflows/eb-i25-backend-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch-backend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/eb-i25-accepted-multisubstep-sensible-boundary
      - name: Apply exact bounded backend patch
        run: python3 tools/eb_i25_patch_backend.py
      - name: Persist production patch and remove bootstrap tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/eb_i25_patch_backend.py .github/workflows/eb-i25-backend-bootstrap.yml
          git add src/runtime/mod_fmr_serialized_reference_backend.f90
          test -n "$(git status --porcelain)"
          git commit -m 'EB-I25 bind top sensible boundary carrier to transaction rollback context'
          git push origin HEAD:work/eb-i25-accepted-multisubstep-sensible-boundary
