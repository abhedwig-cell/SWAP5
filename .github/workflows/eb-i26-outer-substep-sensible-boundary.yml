name: EB-I27 atomic materialization and owner qualification

on:
  push:
    branches:
      - work/eb-i27-accepted-outer-substep-sensible-boundary-aggregation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Materialize committed EB-I27 owner assets
        run: python3 tests/eb/materialize_eb_i27_owner_assets.py
      - name: Qualify materialized owner assets
        run: |
          chmod +x tests/eb/run_eb_i27_outer_substep_sensible_boundary_gate.sh
          git diff --check
          bash tests/eb/run_eb_i27_outer_substep_sensible_boundary_gate.sh
      - name: Persist atomic EB-I27 owner assets
        run: |
          git rm tests/eb/materialize_eb_i27_owner_assets.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "EB-I27 materialize accepted outer-substep aggregation owner assets"
          git push origin HEAD:work/eb-i27-accepted-outer-substep-sensible-boundary-aggregation
