name: EB-I27 outer-substep aggregation diagnostic continuation

on:
  push:
    branches:
      - work/eb-i27-accepted-outer-substep-sensible-boundary-aggregation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Inject runner-only F-KT10 qualified hydrologic fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/eb/test_eb_i26_outer_substep_sensible_boundary_aggregation.f90')
          s = p.read_text()
          replacements = {
            'real(real64), parameter :: dt_outer = 1.0e-4_real64':
              'real(real64), parameter :: dt_outer = 0.25_real64',
            '    parameters%bottom_mode = 2':
              '    parameters%bottom_mode = 5',
            '    parameters%max_iterations = 16; parameters%max_backtracking = 8':
              '    parameters%max_iterations = 8; parameters%max_backtracking = 4',
            '    parameters%min_step_duration = 1.0e-8_real64':
              '    parameters%min_step_duration = 1.0e-6_real64',
            '    config%transaction%max_retries = 8':
              '    config%transaction%max_retries = 0',
            '    config%max_committed_substeps = 32':
              '    config%max_committed_substeps = 4',
            "    heads(1) = initial_head\n    do i = 2, numnod\n      heads(i) = heads(i-1) + parameters%node_distance(i)\n    end do":
              '    heads = initial_head',
            '    forcing%bottom_flux = q\n    forcing%bottom_head = -321.0_real64':
              '    forcing%bottom_flux = 12345.678_real64\n    forcing%bottom_head = initial_head + 0.01_real64'
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'fixture replacement anchor missing: {old!r}')
            s=s.replace(old,new,1)

          old_decl = '    integer :: enthalpy_status\n\n    call initialize_parameters(parameters)\n    call initialize_committed_state(committed, parameters, t_start, dt_outer)\n    call initialize_forcing(parameters, forcing, q)'
          new_decl = '''    integer :: enthalpy_status
    type(b110_default_mvg_parameters_t), target :: fixture_hydraulics
    type(b110_default_mvg_provider_t) :: fixture_constitutive
    real(real64) :: fixture_heads(numnod), fixture_water(numnod), fixture_k(numnod), fixture_c(numnod), fixture_dkdh(numnod)

    call initialize_parameters(parameters)
    call initialize_b110_default_mvg_parameters(fixture_hydraulics, parameters%cofgen)
    call bind_b110_default_mvg_provider(fixture_constitutive, fixture_hydraulics, dt_outer)
    fixture_heads = initial_head
    call fixture_constitutive%evaluate(fixture_heads, fixture_water, fixture_k, fixture_c, fixture_dkdh)
    call initialize_committed_state(committed, parameters, t_start, dt_outer)
    call initialize_forcing(parameters, forcing, -fixture_k(1))'''
          if old_decl not in s:
            raise SystemExit('initialize_case fixture anchor missing')
          s=s.replace(old_decl,new_decl,1)
          p.write_text(s)
          PY
      - name: Inject runner-only kernel reject diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime/mod_fmr_serialized_multiswap_runtime.f90')
          s = p.read_text()
          needle = "    if (.not. kernel_result%completed) then\n"
          trace = """    if (.not. kernel_result%completed) then
              write(*,'(A,I0)') 'EB_I27_KERNEL_SOLVER_REJECTIONS=', kernel_diag%solver_rejections
              write(*,'(A,I0)') 'EB_I27_KERNEL_TEMPORAL_REJECTIONS=', kernel_diag%temporal_rejections
              write(*,'(A,I0)') 'EB_I27_KERNEL_TEMPORAL_CERT_UNAVAILABLE=', kernel_diag%temporal_certificate_unavailable_rejections
              write(*,'(A,I0)') 'EB_I27_KERNEL_MASS_REJECTIONS=', kernel_diag%mass_rejections
              write(*,'(A,I0)') 'EB_I27_KERNEL_ATTEMPTS=', kernel_diag%attempts
              write(*,'(A,I0)') 'EB_I27_KERNEL_RETRIES=', kernel_diag%retries
              write(*,'(A,I0)') 'EB_I27_KERNEL_NONLINEAR_ITERATIONS=', kernel_diag%nonlinear_iterations
              write(*,'(A,I0)') 'EB_I27_KERNEL_INTERNAL_RETRIES=', kernel_diag%internal_retries
              write(*,'(A,I0)') 'EB_I27_KERNEL_HEADCALC_CALLS=', kernel_diag%headcalc_calls
          """
          if needle not in s:
              raise SystemExit('kernel diagnostic anchor missing')
          p.write_text(s.replace(needle, trace, 1))
          PY
      - name: Run bounded outer-substep aggregation diagnostic qualification
        shell: bash
        run: bash tests/eb/run_eb_i26_outer_substep_sensible_boundary_gate.sh
