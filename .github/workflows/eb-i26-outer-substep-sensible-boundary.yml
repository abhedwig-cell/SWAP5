name: EB-I27 outer-substep aggregation diagnostic continuation

on:
  push:
    branches:
      - work/eb-i27-accepted-outer-substep-sensible-boundary-aggregation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run bounded outer-substep aggregation diagnostic qualification
        shell: bash
        run: |
          # Runner-local repair of one stale diagnostic anchor only. This does not
          # alter committed source or production semantics.
          sed -i "s/'    parameters%max_iterations = 16; parameters%max_backtracking = 8':/'parameters%max_iterations = 16; parameters%max_backtracking = 8':/" \
            tests/eb/run_eb_i26_outer_substep_sensible_boundary_gate.sh
          bash tests/eb/run_eb_i26_outer_substep_sensible_boundary_gate.sh
