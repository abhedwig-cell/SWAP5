name: F-AHL canonical admission gate

on:
  push:
    branches:
      - integration/f-ahl-canonical-admission
    paths:
      - 'src/solver/mod_b110_adaptive_hydraulic_builder.f90'
      - 'src/solver/mod_b110_adaptive_hydraulic_cache.f90'
      - 'src/solver/mod_b110_adaptive_hydraulic_provider.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fahl/**'
      - 'integration/f-ahl-admission/**'
      - '.github/workflows/f-ahl-canonical-admission.yml'
  workflow_dispatch:

jobs:
  bounded-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Production provider extraction
        run: bash tests/fahl/run_fahl27_production_provider_extract.sh

      - name: O05 dry-tail authority alignment
        run: bash tests/fahl/run_fahl27a_production_dry_tail.sh

      - name: Prescribed-head Richards matrix
        run: bash tests/fahl/run_fahl27_stage2_matrix.sh /tmp/fahl_admission_matrix.txt

      - name: Serialized seam structural audit
        run: |
          grep -Fq 'logical :: adaptive_hydraulics_active = .false.' src/runtime/mod_fmr_serialized_reference_backend.f90
          grep -Fq 'self%adaptive_hydraulics_active .and. effective_bottom_mode == 5' src/runtime/mod_fmr_serialized_reference_backend.f90
          grep -Fq 'request%evaluation%constitutive => self%adaptive_constitutive' src/runtime/mod_fmr_serialized_reference_backend.f90
          grep -Fq 'request%evaluation%constitutive => self%constitutive' src/runtime/mod_fmr_serialized_reference_backend.f90

      - name: Prescribed-qbot analytical fallback
        run: bash tests/fahl/run_fahl27_stage2_qbot_fallback_direct.sh

      - name: Same-key memoization regression
        run: bash tests/fahl/run_fahl28b_same_key_memoization.sh

      - name: Preserve matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: f-ahl-canonical-admission-${{ github.run_id }}
          path: |
            /tmp/fahl27_stage1.txt
            /tmp/fahl27a_dry_tail.txt
            /tmp/fahl_admission_matrix.txt
            /tmp/fahl28b_provider.txt
