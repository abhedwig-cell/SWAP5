name: F-AHL canonical admission gates

on:
  push:
    branches:
      - work/f-ahl-canonical-admission
  workflow_dispatch:

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production provider extraction
        run: bash tests/fahl/run_fahl27_production_provider_extract.sh
      - name: Prescribed-head qualification matrix
        run: bash tests/fahl/run_fahl27_stage2_matrix.sh
      - name: Dry-tail authority fallback
        run: bash tests/fahl/run_fahl27a_production_dry_tail.sh
      - name: Same-key memoization
        run: bash tests/fahl/run_fahl28b_same_key_memoization.sh
      - name: FMR opt-in runtime
        run: bash tests/fahl/run_fahl27_fmr_opt_in_runtime.sh
      - name: Prescribed-qbot analytical fallback
        run: bash tests/fahl/run_fahl27_stage2_qbot_fallback.sh
      - name: Existing FMR compile gate
        run: bash tests/fkt/run_fkt22_fmr_compile_gate.sh
      - name: Existing FMR runtime gate
        run: bash tests/fkt/run_fkt22_fmr_runtime_gate.sh
