name: F-AHL canonical candidate gate

on:
  push:
    branches:
      - review/f-ahl-policy-v4-candidate
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provider 12-case matrix
        run: |
          bash tests/fahl/run_fahl27_stage2_matrix.sh /tmp/fahl_candidate_matrix.txt

      - name: O09 dry policy-v4 regression
        run: |
          bash tests/fahl/run_ahl42_production_o09_dry.sh /tmp/fahl_candidate_o09.txt

      - name: Serialized Reference opt-in and default-off
        run: |
          bash tests/fahl/run_fahl27_fmr_opt_in_runtime.sh | tee /tmp/fahl_candidate_optin.txt

      - name: Prescribed-qbot analytical fallback
        run: |
          bash tests/fahl/run_fahl27_stage2_qbot_fallback.sh | tee /tmp/fahl_candidate_qbot.txt

      - name: Accepted-trajectory analytical fallback
        run: |
          bash tests/fahl/run_fahl27_stage2_trajectory_fallback.sh | tee /tmp/fahl_candidate_trajectory.txt

      - name: Heterogeneous-profile analytical fallback
        run: |
          bash tests/fahl/run_fahl_governance_heterogeneous_fallback.sh | tee /tmp/fahl_candidate_heterogeneous.txt

      - name: Preserve review evidence
        uses: actions/upload-artifact@v4
        with:
          name: f-ahl-canonical-candidate-${{ github.run_id }}
          path: |
            /tmp/fahl_candidate_matrix.txt
            /tmp/fahl_candidate_o09.txt
            /tmp/fahl_candidate_optin.txt
            /tmp/fahl_candidate_qbot.txt
            /tmp/fahl_candidate_trajectory.txt
            /tmp/fahl_candidate_heterogeneous.txt
