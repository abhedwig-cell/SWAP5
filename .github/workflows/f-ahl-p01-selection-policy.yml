name: F-AHL-P01 selection policy

on:
  push:
    branches:
      - work/f-ahl-production-admission
    paths:
      - 'src/runtime/mod_fmr_adaptive_hydraulic_policy.f90'
      - 'tests/fahl/test_fahl_p01_selection_policy.f90'
      - 'tests/fahl/run_fahl_p01_selection_policy.sh'
      - 'integration/f-ahl-prod/**'
      - '.github/workflows/f-ahl-p01-selection-policy.yml'
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed selection policy gate
        run: |
          bash tests/fahl/run_fahl_p01_selection_policy.sh
