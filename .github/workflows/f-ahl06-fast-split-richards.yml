name: F-AHL06 fast split Richards timing

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/mod_ahl06_split_provider.f90'
      - 'research/ahl/test_ahl06_fast_provider_timing.f90'
      - 'research/ahl/run_ahl06_fast_provider_timing.sh'
      - 'integration/f-ahl/F-AHL06_PREREGISTRATION.json'
      - '.github/workflows/f-ahl06-fast-split-richards.yml'
  workflow_dispatch:

jobs:
  fast-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fast split Richards timing
        run: |
          bash research/ahl/run_ahl06_fast_provider_timing.sh /tmp/ahl06_result.txt
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: f-ahl06-${{ github.run_id }}
          path: /tmp/ahl06_result.txt
