name: F-AHL06 split end-to-end

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/mod_ahl06_split_provider.f90'
      - 'research/ahl/test_ahl06_split_end_to_end.f90'
      - 'research/ahl/run_ahl06_split_end_to_end.sh'
      - 'integration/f-ahl/F-AHL06_PREREGISTRATION.json'
      - '.github/workflows/f-ahl06-split-end-to-end.yml'
  workflow_dispatch:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run optimized split Richards timing
        run: |
          bash research/ahl/run_ahl06_split_end_to_end.sh
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: f-ahl06-${{ github.run_id }}
          path: /tmp/ahl06_result.txt
