name: F-AHL07 convergence attribution

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl07_convergence_attribution.f90'
      - 'research/ahl/run_ahl07_convergence_attribution.sh'
      - 'integration/f-ahl/F-AHL07_PREREGISTRATION.json'
      - '.github/workflows/f-ahl07-convergence-attribution.yml'
  workflow_dispatch:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run convergence attribution
        run: |
          bash research/ahl/run_ahl07_convergence_attribution.sh /tmp/ahl07_result.txt
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: f-ahl07-${{ github.run_id }}
          path: /tmp/ahl07_result.txt
