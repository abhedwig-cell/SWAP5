name: F-AHL09T paired Richards timing

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl09t_timing.f90'
      - 'research/ahl/run_ahl09t_timing.sh'
      - 'research/ahl/mod_ahl09_dc_provider.f90'
      - 'research/ahl/ahl09_generate_fsi24.py'
      - 'integration/f-ahl/F-AHL09T_PREREGISTRATION.json'
      - '.github/workflows/f-ahl09t-paired-timing.yml'
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run paired derivative-consistent Richards timing
        run: |
          bash research/ahl/run_ahl09t_timing.sh /tmp/ahl09t_result.txt
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: f-ahl09t-${{ github.run_id }}
          path: /tmp/ahl09t_result.txt
