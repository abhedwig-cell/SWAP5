name: F-AHL10A failed-regime attribution

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/mod_ahl10a_attribution_provider.f90'
      - 'research/ahl/test_ahl10a_attribution.f90'
      - 'research/ahl/run_ahl10a_attribution.sh'
      - 'integration/f-ahl/F-AHL10A_PREREGISTRATION.json'
      - '.github/workflows/f-ahl10a-failed-regime-attribution.yml'
  workflow_dispatch:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run failed-regime attribution
        run: |
          bash research/ahl/run_ahl10a_attribution.sh /tmp/ahl10a_result.txt
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: f-ahl10a-${{ github.run_id }}
          path: /tmp/ahl10a_result.txt
