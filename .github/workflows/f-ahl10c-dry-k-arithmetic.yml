name: F-AHL10C dry conductivity arithmetic

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/ahl10c_dry_k_arithmetic.py'
      - 'integration/f-ahl/F-AHL10C_PREREGISTRATION.json'
      - '.github/workflows/f-ahl10c-dry-k-arithmetic.yml'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose standard versus stable Mualem arithmetic
        run: |
          PYTHONPATH=research/ahl python3 research/ahl/ahl10c_dry_k_arithmetic.py | tee /tmp/ahl10c_result.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ahl10c_result.json'))
          for mid,row in d['materials'].items():
              normal=[x['relative_difference'] for x in row['samples'] if x['h_cm'] >= -1e4]
              if max(normal) > 1e-6:
                  raise SystemExit(f'normal-domain divergence {mid}: {max(normal)}')
          o05=d['materials']['O05']['samples'][-1]['relative_difference']
          if o05 <= 1e-4:
              raise SystemExit(f'O05 dry-end cancellation not demonstrated: {o05}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl10c-${{ github.run_id }}
          path: /tmp/ahl10c_result.json
