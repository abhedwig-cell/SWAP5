name: F-AHL11 wet-dry attribution

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/ahl11_generate_variants.py'
      - 'research/ahl/run_ahl11_fidelity_attribution.sh'
      - 'integration/f-ahl/F-AHL11_PREREGISTRATION.json'
      - '.github/workflows/f-ahl11-wet-dry-attribution.yml'
  workflow_dispatch:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run wet-dry fidelity attribution
        run: |
          bash research/ahl/run_ahl11_fidelity_attribution.sh /tmp/ahl11_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl11-${{ github.run_id }}
          path: /tmp/ahl11_result.txt
