name: F-AHL11B full catalog Richards matrix

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl11b_full_catalog_matrix.f90'
      - 'research/ahl/run_ahl11b_full_catalog_matrix.sh'
      - 'integration/f-ahl/F-AHL11B_PREREGISTRATION.json'
      - '.github/workflows/f-ahl11b-full-catalog-matrix.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 108-case Richards falsification
        run: |
          bash research/ahl/run_ahl11b_full_catalog_matrix.sh /tmp/ahl11b_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl11b-${{ github.run_id }}
          path: /tmp/ahl11b_result.txt
