name: F-AHL11C paired matrix timing

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl11c_case_timing.f90'
      - 'research/ahl/run_ahl11c_paired_matrix_timing.sh'
      - 'integration/f-ahl/F-AHL11C_PREREGISTRATION.json'
      - '.github/workflows/f-ahl11c-paired-matrix-timing.yml'
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 12-case paired timing matrix
        run: |
          bash research/ahl/run_ahl11c_paired_matrix_timing.sh /tmp/ahl11c_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl11c-${{ github.run_id }}
          path: /tmp/ahl11c_result.txt
