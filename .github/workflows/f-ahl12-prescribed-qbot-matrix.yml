name: F-AHL12 prescribed-qbot matrix

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl12_prescribed_qbot_matrix.f90'
      - 'research/ahl/run_ahl12_prescribed_qbot_matrix.sh'
      - 'integration/f-ahl/F-AHL12_PREREGISTRATION.json'
      - '.github/workflows/f-ahl12-prescribed-qbot-matrix.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run prescribed-qbot Richards matrix
        run: |
          bash research/ahl/run_ahl12_prescribed_qbot_matrix.sh /tmp/ahl12_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl12-${{ github.run_id }}
          path: /tmp/ahl12_result.txt
