name: F-AHL12A qbot exact-K attribution

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl12a_qbot_exactk.f90'
      - 'research/ahl/run_ahl12a_qbot_exactk.sh'
      - 'research/ahl/mod_ahl11_decoupled_provider.f90'
      - 'integration/f-ahl/F-AHL12A_PREREGISTRATION.json'
      - '.github/workflows/f-ahl12a-qbot-exactk.yml'
  workflow_dispatch:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-K qbot attribution
        run: |
          bash research/ahl/run_ahl12a_qbot_exactk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl12a-${{ github.run_id }}
          path: /tmp/ahl12a_result.txt
