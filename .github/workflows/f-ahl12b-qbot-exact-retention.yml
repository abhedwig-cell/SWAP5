name: F-AHL12B qbot exact-retention attribution

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl12b_qbot_exact_retention.f90'
      - 'research/ahl/run_ahl12b_qbot_exact_retention.sh'
      - 'research/ahl/mod_ahl12b_exact_retention_klookup_provider.f90'
      - 'integration/f-ahl/F-AHL12B_PREREGISTRATION.json'
      - '.github/workflows/f-ahl12b-qbot-exact-retention.yml'
  workflow_dispatch:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-retention qbot attribution
        run: |
          bash research/ahl/run_ahl12b_qbot_exact_retention.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl12b-${{ github.run_id }}
          path: /tmp/ahl12b_result.txt
