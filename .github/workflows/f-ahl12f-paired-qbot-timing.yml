name: F-AHL12F paired qbot timing

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl12f_qbot_timing.f90'
      - 'research/ahl/run_ahl12f_qbot_timing.sh'
      - 'integration/f-ahl/F-AHL12F_PREREGISTRATION.json'
      - '.github/workflows/f-ahl12f-paired-qbot-timing.yml'
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run paired qbot timing
        run: |
          bash research/ahl/run_ahl12f_qbot_timing.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl12f-${{ github.run_id }}
          path: /tmp/ahl12f_result.txt
