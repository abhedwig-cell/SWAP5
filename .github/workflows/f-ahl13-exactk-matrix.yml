name: F-AHL13 exact-K matrix closure

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/run_ahl13_stage1.sh'
      - 'integration/f-ahl/F-AHL13_PREREGISTRATION.json'
      - '.github/workflows/f-ahl13-exactk-matrix.yml'
  workflow_dispatch:

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-K 12-case closure
        run: |
          bash research/ahl/run_ahl13_stage1.sh /tmp/ahl13_stage1.txt
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: f-ahl13-${{ github.run_id }}
          path: /tmp/ahl13_stage1.txt
