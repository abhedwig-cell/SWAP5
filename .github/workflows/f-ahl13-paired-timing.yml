name: F-AHL13 paired exact-K timing

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/mod_ahl13_dc_exactk_provider.f90'
      - 'research/ahl/test_ahl13r_timing_reconciliation.f90'
      - 'research/ahl/run_ahl13r_timing_reconciliation.sh'
      - '.github/workflows/f-ahl13-paired-timing.yml'
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run paired exact-K timing reconciliation
        run: |
          bash research/ahl/run_ahl13r_timing_reconciliation.sh /tmp/ahl13r_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl13r-${{ github.run_id }}
          path: /tmp/ahl13r_result.txt
