name: F-AHL14A B01 wet diagnosis

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl14a_b01wet.f90'
      - 'research/ahl/run_ahl14a_b01wet.sh'
      - 'integration/f-ahl/F-AHL14A_PREREGISTRATION.json'
      - '.github/workflows/f-ahl14a-b01wet-diagnosis.yml'
  workflow_dispatch:

jobs:
  diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run B01 wet diagnosis
        run: |
          bash research/ahl/run_ahl14a_b01wet.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl14a-${{ github.run_id }}
          path: /tmp/ahl14a_result.txt
