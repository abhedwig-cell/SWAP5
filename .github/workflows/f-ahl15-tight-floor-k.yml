name: F-AHL15 tight floor-scaled K matrix

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/ahl15_floor_scaled_k.py'
      - 'research/ahl/run_ahl15_matrix.sh'
      - 'integration/f-ahl/F-AHL15_PREREGISTRATION.json'
      - '.github/workflows/f-ahl15-tight-floor-k.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tight floor-scaled K matrix
        run: |
          bash research/ahl/run_ahl15_matrix.sh /tmp/ahl15_matrix.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl15-${{ github.run_id }}
          path: /tmp/ahl15_matrix.txt
