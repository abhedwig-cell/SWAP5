name: F-AHL16 cross-regime timing

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl16_case_timing.f90'
      - 'research/ahl/run_ahl16_cross_regime_timing.sh'
      - 'integration/f-ahl/F-AHL16_PREREGISTRATION.json'
      - '.github/workflows/f-ahl16-cross-regime-timing.yml'
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cross-regime paired timing
        run: |
          bash research/ahl/run_ahl16_cross_regime_timing.sh /tmp/ahl16_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl16-${{ github.run_id }}
          path: /tmp/ahl16_result.txt
