name: F-AHL19 amortization

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/ahl19_amortization.py'
      - 'integration/f-ahl/F-AHL19_PREREGISTRATION.json'
      - '.github/workflows/f-ahl19-amortization.yml'
  workflow_dispatch:

jobs:
  amortization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute conservative build/cache amortization
        run: |
          python3 research/ahl/ahl19_amortization.py | tee /tmp/ahl19_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl19-${{ github.run_id }}
          path: /tmp/ahl19_result.json
