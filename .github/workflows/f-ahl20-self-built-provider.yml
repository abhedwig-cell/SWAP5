name: F-AHL20 self-built cached provider

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/mod_ahl20_self_built_provider.f90'
      - 'research/ahl/test_ahl20_self_built_provider.f90'
      - 'research/ahl/run_ahl20_self_built_provider.sh'
      - 'integration/f-ahl/F-AHL20_PREREGISTRATION.json'
      - '.github/workflows/f-ahl20-self-built-provider.yml'
  workflow_dispatch:

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run self-built cached provider replay
        run: |
          bash research/ahl/run_ahl20_self_built_provider.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl20-stage1-${{ github.run_id }}
          path: /tmp/ahl20_stage1.txt
