name: F-AHL20 self-built Stage 2 matrix

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl20_stage2_matrix.f90'
      - 'research/ahl/run_ahl20_stage2_matrix.sh'
      - 'research/ahl/mod_ahl20_self_built_provider.f90'
      - '.github/workflows/f-ahl20-stage2-matrix.yml'
  workflow_dispatch:

jobs:
  stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run self-built 12-case matrix
        run: |
          bash research/ahl/run_ahl20_stage2_matrix.sh /tmp/ahl20_stage2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl20-stage2-${{ github.run_id }}
          path: /tmp/ahl20_stage2.txt
