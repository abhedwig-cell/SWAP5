name: F-AHL21B O05-dry qbot attribution
on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl21b_o05dry_attribution.f90'
      - 'research/ahl/run_ahl21b_o05dry_attribution.sh'
      - 'integration/f-ahl/F-AHL21B_PREREGISTRATION.json'
      - '.github/workflows/f-ahl21b-o05dry-attribution.yml'
  workflow_dispatch:
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash research/ahl/run_ahl21b_o05dry_attribution.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl21b-${{ github.run_id }}
          path: /tmp/ahl21b_result.txt
