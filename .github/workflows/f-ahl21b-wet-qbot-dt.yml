name: F-AHL21B wet qbot timestep envelope

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl21b_wet_dt_envelope.f90'
      - 'research/ahl/run_ahl21b_wet_dt_envelope.sh'
      - 'integration/f-ahl/F-AHL21B_PREREGISTRATION.json'
      - '.github/workflows/f-ahl21b-wet-qbot-dt.yml'
  workflow_dispatch:

jobs:
  envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run wet qbot timestep envelope
        run: |
          bash research/ahl/run_ahl21b_wet_dt_envelope.sh /tmp/ahl21b_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl21b-${{ github.run_id }}
          path: /tmp/ahl21b_result.txt
