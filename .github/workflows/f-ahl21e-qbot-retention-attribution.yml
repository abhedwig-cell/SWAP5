name: F-AHL21E qbot retention attribution

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl21e_exact_retention.f90'
      - 'research/ahl/run_ahl21e_retention_attribution.sh'
      - 'integration/f-ahl/F-AHL21E_PREREGISTRATION.json'
      - '.github/workflows/f-ahl21e-qbot-retention-attribution.yml'
  workflow_dispatch:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run O05 dry retention attribution
        run: |
          bash research/ahl/run_ahl21e_retention_attribution.sh /tmp/ahl21e_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl21e-${{ github.run_id }}
          path: /tmp/ahl21e_result.txt
