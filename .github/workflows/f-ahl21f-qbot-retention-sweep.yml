name: F-AHL21F qbot retention sweep

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/ahl21f_generate_retention_variants.py'
      - 'research/ahl/run_ahl21f_retention_sweep.sh'
      - 'integration/f-ahl/F-AHL21F_PREREGISTRATION.json'
      - '.github/workflows/f-ahl21f-qbot-retention-sweep.yml'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen-K retention sweep
        run: |
          bash research/ahl/run_ahl21f_retention_sweep.sh /tmp/ahl21f_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl21f-${{ github.run_id }}
          path: /tmp/ahl21f_result.txt
