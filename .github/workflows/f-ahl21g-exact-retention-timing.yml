name: F-AHL21G exact-retention qbot timing

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl21g_exact_retention_timing.f90'
      - 'research/ahl/run_ahl21g_exact_retention_timing.sh'
      - 'integration/f-ahl/F-AHL21G_PREREGISTRATION.json'
      - '.github/workflows/f-ahl21g-exact-retention-timing.yml'
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-retention qbot timing
        run: |
          bash research/ahl/run_ahl21g_exact_retention_timing.sh /tmp/ahl21g_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl21g-${{ github.run_id }}
          path: /tmp/ahl21g_result.txt
