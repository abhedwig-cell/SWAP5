name: F-AHL21H exact-retention qbot matrix

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/run_ahl21h_exact_retention_matrix.sh'
      - 'integration/f-ahl/F-AHL21H_PREREGISTRATION.json'
      - '.github/workflows/f-ahl21h-exact-retention-matrix.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-retention qbot matrix
        run: |
          bash research/ahl/run_ahl21h_exact_retention_matrix.sh /tmp/ahl21h_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl21h-${{ github.run_id }}
          path: /tmp/ahl21h_result.txt
