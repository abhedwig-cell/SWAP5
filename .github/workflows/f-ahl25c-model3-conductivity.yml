name: F-AHL25C model3 conductivity representation
on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/ahl25c_model3_conductivity.py'
      - 'research/ahl/run_ahl25c_model3_conductivity.sh'
      - 'integration/f-ahl/F-AHL25C_PREREGISTRATION.json'
      - '.github/workflows/f-ahl25c-model3-conductivity.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run model3 conductivity qualification
        run: bash research/ahl/run_ahl25c_model3_conductivity.sh /tmp/ahl25c_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-ahl25c-${{ github.run_id }}
          path: /tmp/ahl25c_result.json
