name: F-AHL25D model3 Richards falsification
on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/ahl25d_generate_tables.py'
      - 'research/ahl/mod_ahl25d_model3_analytical.f90'
      - 'research/ahl/mod_ahl25d_model3_lookup.f90'
      - 'research/ahl/test_ahl25d_model3_richards.f90'
      - 'research/ahl/run_ahl25d_model3_richards.sh'
      - 'integration/f-ahl/F-AHL25D_PREREGISTRATION.json'
      - '.github/workflows/f-ahl25d-model3-richards.yml'
  workflow_dispatch:
jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run model3 Richards matrix
        run: bash research/ahl/run_ahl25d_model3_richards.sh /tmp/ahl25d_result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-ahl25d-${{ github.run_id }}
          path: /tmp/ahl25d_result.txt
