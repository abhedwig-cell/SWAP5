name: F-AHL26E PDI NoVap conductivity
on:
  push:
    branches: [work/f-ahl01-adaptive-hydraulic-lookup]
    paths:
      - 'research/ahl/ahl26e_pdi_novap_k.py'
      - 'research/ahl/run_ahl26e_pdi_novap_k.sh'
      - 'integration/f-ahl/F-AHL26E_PREREGISTRATION.json'
      - '.github/workflows/f-ahl26e-pdi-novap-k.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash research/ahl/run_ahl26e_pdi_novap_k.sh /tmp/ahl26e.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-ahl26e-${{ github.run_id }}
          path: /tmp/ahl26e.json
