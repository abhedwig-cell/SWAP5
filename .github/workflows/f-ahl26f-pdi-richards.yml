name: F-AHL26F PDI NoVap Richards
on:
  push:
    branches: [work/f-ahl01-adaptive-hydraulic-lookup]
    paths:
      - 'research/ahl/ahl26f_generate_tables.py'
      - 'research/ahl/mod_ahl26f_pdi_analytical.f90'
      - 'research/ahl/mod_ahl26f_pdi_lookup.f90'
      - 'research/ahl/test_ahl26f_pdi_richards.f90'
      - 'research/ahl/run_ahl26f_pdi_richards.sh'
      - 'integration/f-ahl/F-AHL26F_PREREGISTRATION.json'
      - '.github/workflows/f-ahl26f-pdi-richards.yml'
  workflow_dispatch:
jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash research/ahl/run_ahl26f_pdi_richards.sh /tmp/ahl26f.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-ahl26f-${{ github.run_id }}
          path: /tmp/ahl26f.txt
