name: F-AHL27 production adaptive provider

on:
  push:
    branches:
      - work/f-ahl27-production-admission
    paths:
      - 'src/solver/mod_b110_adaptive_hydraulic_builder.f90'
      - 'src/runtime/mod_b110_adaptive_hydraulic_cache.f90'
      - 'src/solver/mod_b110_adaptive_mvg_provider.f90'
      - 'tests/ahl/**'
      - 'integration/f-ahl/F-AHL27_*.json'
      - '.github/workflows/f-ahl27-production-adaptive-provider.yml'
  workflow_dispatch:

jobs:
  port-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run production port-equivalence gate
        run: |
          bash tests/ahl/run_fahl27_adaptive_provider.sh
      - name: Verify fail-closed runtime policy
        run: |
          gfortran -std=f2008 -Wall -Wextra -Werror             src/runtime/mod_b110_adaptive_runtime_policy.f90             tests/ahl/test_fahl27_runtime_policy.f90             -o /tmp/fahl27_policy
          /tmp/fahl27_policy | tee /tmp/fahl27_policy.txt
          grep -Fq 'FAHL27_RUNTIME_POLICY=PASS' /tmp/fahl27_policy.txt
      - name: Compile serialized production backend
        run: |
          bash tests/fkt/run_fkt22_fmr_compile_gate.sh | tee /tmp/fahl27_backend_compile.txt
      - name: Run serialized production regression
        run: |
          bash tests/fkt/run_fkt22_fmr_runtime_gate.sh | tee /tmp/fahl27_backend_runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl27-${{ github.run_id }}
          path: |
            /tmp/fahl27_stage1.txt
            /tmp/fahl27_policy.txt
            /tmp/fahl27_backend_compile.txt
            /tmp/fahl27_backend_runtime.txt
