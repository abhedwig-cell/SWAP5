name: F-AHL30 over-capacity reuse

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl30_over_capacity_reuse.f90'
      - 'research/ahl/run_ahl30_over_capacity_reuse.sh'
      - 'integration/f-ahl/F-AHL30_PREREGISTRATION.json'
      - '.github/workflows/f-ahl30-over-capacity-reuse.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run over-capacity reuse benchmark
        run: |
          bash research/ahl/run_ahl30_over_capacity_reuse.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl30-${{ github.run_id }}
          path: /tmp/ahl30_result.txt
