name: F-AHL31 representation memory characterization

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl31_memory_build_characterization.f90'
      - 'research/ahl/run_ahl31_memory_build_characterization.sh'
      - 'integration/f-ahl/F-AHL31_PREREGISTRATION.json'
      - '.github/workflows/f-ahl31-memory-characterization.yml'
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run memory and build-cost characterization
        run: |
          bash research/ahl/run_ahl31_memory_build_characterization.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl31-${{ github.run_id }}
          path: /tmp/ahl31_result.txt
