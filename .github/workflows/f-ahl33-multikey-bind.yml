name: F-AHL33 multi-key bind characterization

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl33_multikey_bind.f90'
      - 'research/ahl/run_ahl33_multikey_bind.sh'
      - 'integration/f-ahl/F-AHL33_PREREGISTRATION.json'
      - '.github/workflows/f-ahl33-multikey-bind.yml'
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run multi-key bind characterization
        run: |
          bash research/ahl/run_ahl33_multikey_bind.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl33-${{ github.run_id }}
          path: /tmp/ahl33_result.txt
