name: F-AHL33 robust multi-key switching

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl33_multikey_switching.f90'
      - 'research/ahl/run_ahl33_multikey_switching.sh'
      - 'integration/f-ahl/F-AHL33_PREREGISTRATION.json'
      - '.github/workflows/f-ahl33-robust-multikey-switching.yml'
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run robust multi-key switching characterization
        run: |
          bash research/ahl/run_ahl33_multikey_switching.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl33-robust-${{ github.run_id }}
          path: /tmp/ahl33_result.txt
