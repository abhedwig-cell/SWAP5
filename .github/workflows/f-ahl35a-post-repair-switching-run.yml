name: F-AHL35A post-repair switching run

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - '.github/workflows/f-ahl35a-post-repair-switching-run.yml'
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-run multi-key switching characterization
        run: |
          bash research/ahl/run_ahl33_multikey_switching.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl35a-run-${{ github.run_id }}
          path: /tmp/ahl33_result.txt
