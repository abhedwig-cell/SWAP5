name: F-AHL36 post-repair multi-key switching

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl36_multikey_switching.f90'
      - 'research/ahl/run_ahl36_multikey_switching.sh'
      - 'integration/f-ahl/F-AHL36_PREREGISTRATION.json'
      - '.github/workflows/f-ahl36-postrepair-multikey-switching.yml'
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run post-repair multi-key switching characterization
        run: |
          bash research/ahl/run_ahl36_multikey_switching.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl36-${{ github.run_id }}
          path: /tmp/ahl36_result.txt
