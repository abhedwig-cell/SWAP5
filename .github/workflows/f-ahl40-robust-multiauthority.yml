name: F-AHL40 robust multi-authority timing

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl40_fmr_multiauthority_timing.f90'
      - 'research/ahl/run_ahl40_fmr_multiauthority_timing.sh'
      - 'integration/f-ahl/F-AHL40_PREREGISTRATION.json'
      - '.github/workflows/f-ahl40-robust-multiauthority.yml'
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run robust multi-authority timing reconciliation
        run: |
          bash research/ahl/run_ahl40_fmr_multiauthority_timing.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl40-${{ github.run_id }}
          path: /tmp/ahl40_result.txt
