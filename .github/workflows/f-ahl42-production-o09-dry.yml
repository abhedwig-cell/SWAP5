name: F-AHL42 production O09 dry reconciliation

on:
  push:
    branches:
      - work/f-ahl01-adaptive-hydraulic-lookup
    paths:
      - 'research/ahl/test_ahl42_production_o09_dry.f90'
      - 'research/ahl/run_ahl42_production_o09_dry.sh'
      - 'integration/f-ahl/F-AHL42_PREREGISTRATION.json'
      - '.github/workflows/f-ahl42-production-o09-dry.yml'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run production O09 dry reconciliation
        run: |
          bash research/ahl/run_ahl42_production_o09_dry.sh /tmp/ahl42_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-ahl42-${{ github.run_id }}
          path: /tmp/ahl42_result.txt
