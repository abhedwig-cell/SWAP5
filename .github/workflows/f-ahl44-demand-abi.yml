name: F-AHL44 demand ABI reconciliation

on:
  pull_request:
    paths:
      - 'src/solver/mod_b110_adaptive_hydraulic_builder.f90'
      - 'src/solver/mod_b110_adaptive_hydraulic_cache.f90'
      - 'src/solver/mod_b110_adaptive_hydraulic_provider.f90'
      - 'tests/fahl/test_fahl44_demand_abi.f90'
      - 'tests/fahl/run_fahl44_demand_abi.sh'
      - '.github/workflows/f-ahl44-demand-abi.yml'
  workflow_dispatch:

jobs:
  demand-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Qualify demand-aware adaptive provider
        run: |
          bash tests/fahl/run_fahl44_demand_abi.sh | tee fahl44-demand-abi.txt
          grep -Fq 'FAHL44_DEMAND_SEMANTICS=PASS' fahl44-demand-abi.txt
          grep -Fq 'FAHL44_DEMAND_TIMING=PASS' fahl44-demand-abi.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fahl44-demand-abi
          path: fahl44-demand-abi.txt
