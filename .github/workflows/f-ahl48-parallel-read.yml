name: F-AHL48 parallel frozen read

on:
  pull_request:
    paths:
      - 'research/ahl/mod_ahl48_shared_direct_retention_provider.f90'
      - 'research/ahl/test_fahl48_parallel_read.f90'
      - 'research/ahl/run_fahl48_parallel_read.sh'
      - '.github/workflows/f-ahl48-parallel-read.yml'
  workflow_dispatch:

jobs:
  parallel-read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Qualify frozen concurrent reads
        run: |
          bash research/ahl/run_fahl48_parallel_read.sh | tee fahl48-parallel-read.txt
          grep -Fq 'FAHL48_PARALLEL_READ=PASS' fahl48-parallel-read.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fahl48-parallel-read
          path: fahl48-parallel-read.txt
