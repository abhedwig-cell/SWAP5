name: F-APP07 Hupsel TCS1 DCS2 irrigation

concurrency:
  group: f-app07-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-app07-hupsel-tcs1-dcs2-irrigation
      - work/mc-irr01-management-cluster-20261007
    paths:
      - 'src/process/mod_tcs1_dcs2_sprinkling_irrigation_process.f90'
      - 'tests/f-app07/**'
      - 'tests/mc-irr01/**'
      - 'src/process/mod_irrigation_availability_policy.f90'
      - 'src/process/mod_irrigation_process.f90'
      - 'src/process/mod_irrigation_root_zone_summary.f90'
      - 'src/process/mod_scheduled_irrigation_management_policy.f90'
      - 'src/runtime/mod_fmr_scheduled_irrigation_application.f90'
      - 'src/runtime/mod_fmr_scheduled_irrigation_forcing_binding.f90'
      - 'src/runtime/mod_fmr_sensor_depth_irrigation_binding.f90'
      - 'src/runtime/mod_fmr_scheduled_management_irrigation_application.f90'
      - 'src/runtime/mod_fmr_scheduled_management_irrigation_routing.f90'
      - 'src/runtime/mod_fmr_irrigation_management_restart.f90'
      - 'integration/f-app/F-APP07_*'
      - '.github/workflows/f-app07-hupsel-tcs1-dcs2-irrigation.yml'
  pull_request:
    paths:
      - 'src/process/mod_tcs1_dcs2_sprinkling_irrigation_process.f90'
      - 'tests/f-app07/**'
      - 'tests/mc-irr01/**'
      - 'src/process/mod_irrigation_availability_policy.f90'
      - 'src/process/mod_irrigation_process.f90'
      - 'src/process/mod_irrigation_root_zone_summary.f90'
      - 'src/process/mod_scheduled_irrigation_management_policy.f90'
      - 'src/runtime/mod_fmr_scheduled_irrigation_application.f90'
      - 'src/runtime/mod_fmr_scheduled_irrigation_forcing_binding.f90'
      - 'src/runtime/mod_fmr_sensor_depth_irrigation_binding.f90'
      - 'src/runtime/mod_fmr_scheduled_management_irrigation_application.f90'
      - 'src/runtime/mod_fmr_scheduled_management_irrigation_routing.f90'
      - 'src/runtime/mod_fmr_irrigation_management_restart.f90'
      - 'integration/f-app/F-APP07_*'
      - '.github/workflows/f-app07-hupsel-tcs1-dcs2-irrigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Restricted Hupsel process qualification
        run: bash tests/f-app07/run_fapp07_tcs1_dcs2_process.sh
      - name: MC-IRR01 exact B1.11 source reconstruction
        run: bash tests/mc-irr01/run_mc_irr01_source_reconstruction.sh
      - name: MC-IRR01 shared management policy
        run: bash tests/mc-irr01/run_mc_irr01_management_policy.sh
      - name: MC-IRR01 exact literal management and TASK4 oracles
        run: |
          bash tests/mc-irr01/run_mc_irr01_literal_management.sh
          bash tests/mc-irr01/run_mc_irr01_literal_availability.sh
      - name: MC-IRR01 management real physical binding and rollback
        run: bash tests/f-app07/run_mc_irr01_management_physical_runtime.sh
      - name: MC-IRR01 sensor DCS1 multi-node physical and event restart
        run: bash tests/f-app07/run_mc_irr01_sensor_depth_runtime.sh
      - name: MC-IRR01 feasible real-depth source-onset refinement and root cluster
        run: bash tests/f-app07/run_mc_irr01_realistic_event.sh
      - name: MC-IRR01 retained-history real-depth source-off refinement
        run: bash tests/f-app07/run_mc_irr01_realistic_source_off.sh
      - name: MC-IRR01 real-depth sensor spatial event restart
        run: bash tests/f-app07/run_mc_irr01_realistic_sensor_restart.sh
      - name: MC-IRR01 common root salt source order and physical mass
        run: |
          bash tests/mc-irr01/run_mc_irr01_literal_root_salt.sh
          bash tests/f-app07/run_mc_irr01_root_salt_realistic.sh
