name: F-CI85 F-GC23 canonical admission

on:
  push:
    branches:
      - integration/f-ci85-fgc23-whole-window-response-tangent-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-fgc23-canonical-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checked-out run head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI85 canonical admission gate
        run: bash qualification/run_fci85_fgc23_canonical_admission.sh
