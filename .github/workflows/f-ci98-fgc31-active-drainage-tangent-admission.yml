name: F-CI98 F-GC31 active-drainage tangent admission

on:
  push:
    branches:
      - integration/f-ci98-fgc31-active-drainage-tangent-admission
    paths:
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'src/runtime/mod_fmr_drainage_qbot_directional_binding.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_modflow6_swap_predictor_tangent_adapter.f90'
      - 'src/solver/mod_b110_smooth_freatic_projection.f90'
      - 'src/solver/mod_soil_water_accepted_step_direction_contract.f90'
      - 'src/transaction/mod_accepted_trajectory_directional_publication.f90'
      - 'src/transaction/mod_accepted_trajectory_directional_sensitivity.f90'
      - 'qualification/F-VQ105_STATUS.json'
      - 'tests/fci/run_fci98_fgc31_active_drainage_tangent_admission.sh'
      - '.github/workflows/f-ci98-fgc31-active-drainage-tangent-admission.yml'
      - 'integration/f-ci/F-CI98_STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-admission-postimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checked-out admission head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI98 exact-source admission qualification
        run: bash tests/fci/run_fci98_fgc31_active_drainage_tangent_admission.sh
