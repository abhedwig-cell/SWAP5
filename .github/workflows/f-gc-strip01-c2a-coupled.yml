name: F-GC-STRIP01 C2a head-matched equilibrium control

on:
  push:
    branches: [work/f-gc-strip01-50m-swap-modflow-benchmark]
    paths:
      - 'tests/fgc/strip01/research_context_c2a.f90'
      - 'tests/fgc/strip01/run_c2a_window.py'
      - 'tools/build_f_gc_strip01_research_context.py'
      - 'integration/f-gc/strip01/F-GC-STRIP01_C2_PREREGISTRATION.json'
      - 'integration/f-gc/strip01/F-GC-STRIP01_C2_PREREGISTRATION_ADDENDUM.json'
      - '.github/workflows/f-gc-strip01-c2a-coupled.yml'

permissions:
  contents: read

jobs:
  c2a-equilibrium:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research work unit
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout exact current canonical source
        uses: actions/checkout@v4
        with:
          ref: e3bfcdca00ba89cfeea529cf9b648dcc803483ab
          path: canonical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned coupling dependencies
        run: python -m pip install numpy==2.3.5 flopy==3.9.5 xmipy
      - name: Materialize isolated research grid stub over canonical source
        run: |
          mkdir -p canonical/tests/fgc/strip01
          cp research/tests/fgc/strip01/research_grid_stubs_c1.f90 canonical/tests/fgc/strip01/
      - name: Fetch and verify MODFLOW 6.8.0
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from flopy.utils.get_modflow import run_main
          root = Path(os.environ["RUNNER_TEMP"])
          (root / "strip01-mf6").mkdir(parents=True, exist_ok=True)
          (root / "strip01-downloads").mkdir(parents=True, exist_ok=True)
          run_main(root / "strip01-mf6", owner="MODFLOW-ORG", repo="modflow6",
                   release_id="6.8.0", subset={"mf6", "libmf6.so"},
                   downloads_dir=root / "strip01-downloads", force=True, quiet=False)
          PY
          echo "33edf988b672a9f282d6773304c079d0f180541f6fe0c6555265d9c71841256e  ${RUNNER_TEMP}/strip01-downloads/modflow6-6.8.0-linux.zip" | sha256sum -c -
          "${RUNNER_TEMP}/strip01-mf6/mf6" -v
          mkdir -p strip01-results/engine
          cp "${RUNNER_TEMP}/strip01-mf6/mf6" "${RUNNER_TEMP}/strip01-mf6/libmf6.so" strip01-results/engine/
          sha256sum strip01-results/engine/* > strip01-results/engine/SHA256SUMS
      - name: Build C2a participant against exact canonical sources
        run: |
          python research/tools/build_f_gc_strip01_research_context.py --root canonical --profile C1 --build "${RUNNER_TEMP}/strip01-build-c2a" --context-override research/tests/fgc/strip01/research_context_c2a.f90
          cp "${RUNNER_TEMP}/strip01-build-c2a/source_git_blobs.json" strip01-results/C2a_source_git_blobs.json
          git -C canonical rev-parse HEAD > strip01-results/canonical_source_commit.txt
          git -C research rev-parse HEAD > strip01-results/research_source_commit.txt
      - name: Run C2a twice in fresh processes and require exact replay identity
        run: |
          set -euo pipefail
          for replay in 1 2; do
            python research/tests/fgc/strip01/run_c2a_window.py --profile C1 --root canonical --library "${RUNNER_TEMP}/strip01-build-c2a/libstrip01_research.so" --libmf6 "${RUNNER_TEMP}/strip01-mf6/libmf6.so" --output "strip01-results/C2a_run${replay}"
          done
          cmp strip01-results/C2a_run1/result.json strip01-results/C2a_run2/result.json
          cp strip01-results/C2a_run1/result.json strip01-results/C2a_result.json
          python - strip01-results/C2a_result.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r["initialization_status"] == 0
          assert r["state"] in {"FIRST_WINDOW_PUBLISHED", "FIRST_WINDOW_REJECTED"}, (r.get("state"), r.get("exception"))
          if r["state"] == "FIRST_WINDOW_PUBLISHED":
              assert r["final_revisions"] == [1] * 50
              assert r["modflow_calls"]["finalize_time_step"] == 1
              assert abs(r["mass_residual_m3"]) <= r["whole_domain_mass_tolerance_m3"]
          else:
              assert r["origin_profile_state_sha256"] == r["final_profile_state_sha256"]
              assert r["origin_revisions"] == r["final_revisions"]
              assert r["origin_ledger_counts"] == r["final_ledger_counts"] == [0] * 50
              assert r["accepted_xold_heads_m"] == r["final_xold_heads_m"]
          PY
      - name: Persist C2a control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F-GC-STRIP01-C2A-${{ github.run_id }}
          path: strip01-results/
          if-no-files-found: warn
          retention-days: 90
