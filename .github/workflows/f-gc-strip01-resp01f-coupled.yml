name: F-GC-STRIP01 RESP01F coupled window

on:
  push:
    branches: [work/f-gc-strip01-50m-swap-modflow-benchmark]
    paths:
      - 'tests/fgc/strip01/research_context_resp01f_*.f90'
      - 'tests/fgc/strip01/run_resp01f_window.py'
      - 'tools/build_f_gc_strip01_research_context.py'
      - 'integration/f-gc/strip01/F-GC-STRIP01_RESP01F_PREREGISTRATION.json'
      - 'integration/f-gc/strip01/F-GC-STRIP01_RESP01F_PREREGISTRATION_ADDENDUM.json'
      - '.github/workflows/f-gc-strip01-resp01f-coupled.yml'

permissions:
  contents: read

jobs:
  coupled-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research work unit
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout exact current-canonical source baseline
        uses: actions/checkout@v4
        with:
          ref: a6d88c394104dfcd780d5b68df4addcb6e819968
          path: canonical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned coupling dependencies
        run: python -m pip install numpy==2.3.5 flopy==3.9.5 xmipy
      - name: Materialize research grid stubs over exact canonical source
        run: |
          mkdir -p canonical/tests/fgc/strip01
          cp research/tests/fgc/strip01/research_grid_stubs.f90 canonical/tests/fgc/strip01/
          cp research/tests/fgc/strip01/research_grid_stubs_c1.f90 canonical/tests/fgc/strip01/
      - name: Fetch and verify MODFLOW6 6.8.0
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from flopy.utils.get_modflow import run_main
          root = Path(os.environ["RUNNER_TEMP"])
          (root / "strip01-mf6").mkdir(parents=True, exist_ok=True)
          (root / "strip01-downloads").mkdir(parents=True, exist_ok=True)
          run_main(root / "strip01-mf6", owner="MODFLOW-ORG", repo="modflow6",
                   release_id="6.8.0", subset={"mf6", "libmf6.so"},
                   downloads_dir=root / "strip01-downloads", force=True, quiet=False)
          PY
          echo "33edf988b672a9f282d6773304c079d0f180541f6fe0c6555265d9c71841256e  ${RUNNER_TEMP}/strip01-downloads/modflow6-6.8.0-linux.zip" | sha256sum -c -
          "${RUNNER_TEMP}/strip01-mf6/mf6" -v
          mkdir -p strip01-results/engine
          cp "${RUNNER_TEMP}/strip01-mf6/mf6" "${RUNNER_TEMP}/strip01-mf6/libmf6.so" strip01-results/engine/
          sha256sum strip01-results/engine/* > strip01-results/engine/SHA256SUMS
      - name: Build exact canonical C0/C1 research participants
        run: |
          python research/tools/build_f_gc_strip01_research_context.py --root canonical --profile C0 --build "${RUNNER_TEMP}/strip01-build-c0" --context-override research/tests/fgc/strip01/research_context_resp01f_c0.f90
          python research/tools/build_f_gc_strip01_research_context.py --root canonical --profile C1 --build "${RUNNER_TEMP}/strip01-build-c1" --context-override research/tests/fgc/strip01/research_context_resp01f_c1.f90
          cp "${RUNNER_TEMP}/strip01-build-c0/source_git_blobs.json" strip01-results/C0_source_git_blobs.json
          cp "${RUNNER_TEMP}/strip01-build-c1/source_git_blobs.json" strip01-results/C1_source_git_blobs.json
          git -C canonical rev-parse HEAD > strip01-results/canonical_source_commit.txt
          git -C research rev-parse HEAD > strip01-results/research_source_commit.txt
      - name: Run C0 and C1 windows in fresh processes and require replay identity
        run: |
          set -euo pipefail
          for profile in C0 C1; do
            if [ "$profile" = C0 ]; then build_dir="${RUNNER_TEMP}/strip01-build-c0"; else build_dir="${RUNNER_TEMP}/strip01-build-c1"; fi
            for replay in 1 2; do
              python research/tests/fgc/strip01/run_resp01f_window.py --profile "$profile" --root canonical --library "$build_dir/libstrip01_research.so" --libmf6 "${RUNNER_TEMP}/strip01-mf6/libmf6.so" --output "strip01-results/${profile}_run${replay}"
            done
            cmp "strip01-results/${profile}_run1/result.json" "strip01-results/${profile}_run2/result.json"
            cp "strip01-results/${profile}_run1/result.json" "strip01-results/${profile}_result.json"
            python - "$profile" "strip01-results/${profile}_result.json" <<'PY'
          import json, sys
          profile, path = sys.argv[1:]
          r = json.load(open(path))
          assert r.get("state") in {"FIRST_WINDOW_PUBLISHED", "FIRST_WINDOW_REJECTED"}, (profile, r.get("state"), r.get("exception"))
          assert r["initialization_status"] == 0
          if r["state"] == "FIRST_WINDOW_PUBLISHED":
              assert r["final_revisions"] == [1] * 50
              assert r["modflow_calls"]["finalize_time_step"] == 1
              assert abs(r["mass_residual_m3"]) <= r["whole_domain_mass_tolerance_m3"]
          else:
              assert r["origin_profile_state_sha256"] == r["final_profile_state_sha256"]
              assert r["origin_revisions"] == r["final_revisions"]
              assert r["origin_ledger_counts"] == r["final_ledger_counts"] == [0] * 50
              assert r["accepted_xold_heads_m"] == r["final_xold_heads_m"]
          PY
          done
      - name: Persist RESP01F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F-GC-STRIP01-RESP01F-${{ github.run_id }}
          path: strip01-results/
          if-no-files-found: warn
          retention-days: 90
