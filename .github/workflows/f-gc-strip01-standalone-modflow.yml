name: F-GC-STRIP01 standalone MODFLOW6 A/B

on:
  push:
    branches: [work/f-gc-strip01-50m-swap-modflow-benchmark]
    paths:
      - 'tests/fgc/strip01/**'
      - 'docs/integration/F-GC-STRIP01_ORACLE_EXECUTION_CONTRACT.md'
      - '.github/workflows/f-gc-strip01-standalone-modflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned current-canonical C2 source
        uses: actions/checkout@v4
        with:
          ref: e3bfcdca00ba89cfeea529cf9b648dcc803483ab
          path: canonical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.3.5 matplotlib==3.10.8 flopy==3.9.5 git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902
      - name: Fetch the pinned MODFLOW6 6.8.0 executable
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from flopy.utils.get_modflow import run_main
          root = Path(os.environ["RUNNER_TEMP"])
          (root / "strip01-mf6").mkdir(parents=True, exist_ok=True)
          (root / "strip01-downloads").mkdir(parents=True, exist_ok=True)
          run_main(root / "strip01-mf6", owner="MODFLOW-ORG", repo="modflow6",
                   release_id="6.8.0", subset={"mf6", "libmf6.so"},
                   downloads_dir=root / "strip01-downloads", force=True, quiet=False)
          PY
          echo "33edf988b672a9f282d6773304c079d0f180541f6fe0c6555265d9c71841256e  ${RUNNER_TEMP}/strip01-downloads/modflow6-6.8.0-linux.zip" | sha256sum -c -
          "${RUNNER_TEMP}/strip01-mf6/mf6" -v
          mkdir -p strip01-results/engine
          cp "${RUNNER_TEMP}/strip01-mf6/mf6" "${RUNNER_TEMP}/strip01-mf6/libmf6.so" strip01-results/engine/
          sha256sum strip01-results/engine/* > strip01-results/engine/SHA256SUMS
      - name: Reproduce independent oracle and native MODFLOW A/B
        run: |
          python tests/fgc/strip01/oracle.py --output strip01-results/oracle
          python tests/fgc/strip01/run_standalone.py --mf6 "${RUNNER_TEMP}/strip01-mf6/mf6" --output strip01-results/native
          git rev-parse HEAD > strip01-results/source_commit.txt
      - name: Qualify the preregistered confined zero-storage C0 component
        run: |
          python tests/fgc/strip01/domain_oracle.py --output strip01-results/domain_oracle.json
          python tests/fgc/strip01/run_domain_native.py --mf6 "${RUNNER_TEMP}/strip01-mf6/mf6" --output strip01-results/c0
      - name: Install native Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Materialize research C2 grid stub over canonical source
        run: |
          mkdir -p canonical/tests/fgc/strip01 strip01-results/c2a
          cp tests/fgc/strip01/research_grid_stubs_c1.f90 canonical/tests/fgc/strip01/
          git -C canonical rev-parse HEAD > strip01-results/c2a/canonical_source_commit.txt
      - name: Build matched-head C2 SWAP research fixture
        run: |
          python tools/build_f_gc_strip01_research_context.py --root canonical --profile C2 --context-override tests/fgc/strip01/research_context_c2.f90 --build "${RUNNER_TEMP}/strip01-c2-build"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          actual = json.loads((Path(os.environ["RUNNER_TEMP"]) / "strip01-c2-build/source_git_blobs.json").read_text())
          for path, sha in actual.items():
              if path.startswith("src/"):
                  expected = subprocess.check_output(["git", "-C", "canonical", "rev-parse", "HEAD:" + path], text=True).strip()
              elif path == "tests/fgc/strip01/research_grid_stubs_c1.f90":
                  expected = subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip()
              elif path == "research_override/research_context_c2.f90":
                  expected = subprocess.check_output(["git", "rev-parse", "HEAD:tests/fgc/strip01/research_context_c2.f90"], text=True).strip()
              else:
                  raise SystemExit("Unexpected C2 compiled dependency: " + path)
              if sha != expected:
                  raise SystemExit(f"C2 build blob mismatch for {path}: {sha} != {expected}")
          Path("strip01-results/c2a/source_git_blobs.json").write_text(json.dumps(actual, indent=2) + chr(10))
          Path("strip01-results/c2a/research_source_commit.txt").write_text(subprocess.check_output(["git", "rev-parse", "HEAD"], text=True))
          PY
      - name: Run matched-head C2a equilibrium window
        run: |
          python tests/fgc/strip01/run_research_window.py --profile C2 --root canonical \
            --library "${RUNNER_TEMP}/strip01-c2-build/libstrip01_research.so" \
            --libmf6 "${RUNNER_TEMP}/strip01-mf6/libmf6.so" \
            --output strip01-results/c2a
          git rev-parse HEAD > strip01-results/c2a/source_commit.txt
      - name: Persist research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F-GC-STRIP01-${{ github.run_id }}
          path: strip01-results/
          if-no-files-found: warn
          retention-days: 90
