name: F-GC-STRIP01 standalone MODFLOW6 A/B

on:
  push:
    branches: [work/f-gc-strip01-50m-swap-modflow-benchmark]
    paths:
      - 'tests/fgc/strip01/**'
      - 'docs/integration/F-GC-STRIP01_ORACLE_EXECUTION_CONTRACT.md'
      - '.github/workflows/f-gc-strip01-standalone-modflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLCONFIGDIR: ${{ runner.temp }}/mplconfig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.3.5 matplotlib==3.10.8 flopy==3.9.5
      - name: Fetch the pinned MODFLOW6 6.8.0 executable
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from flopy.utils.get_modflow import run_main
          root = Path(os.environ["RUNNER_TEMP"])
          (root / "strip01-mf6").mkdir(parents=True, exist_ok=True)
          (root / "strip01-downloads").mkdir(parents=True, exist_ok=True)
          run_main(root / "strip01-mf6", owner="MODFLOW-ORG", repo="modflow6",
                   release_id="6.8.0", subset={"mf6"},
                   downloads_dir=root / "strip01-downloads", force=True, quiet=False)
          PY
          echo "33edf988b672a9f282d6773304c079d0f180541f6fe0c6555265d9c71841256e  ${RUNNER_TEMP}/strip01-downloads/modflow6-6.8.0-linux.zip" | sha256sum -c -
          "${RUNNER_TEMP}/strip01-mf6/mf6" -v
      - name: Reproduce independent oracle and native MODFLOW A/B
        run: |
          python tests/fgc/strip01/oracle.py --output "${RUNNER_TEMP}/strip01-results/oracle"
          python tests/fgc/strip01/run_standalone.py --mf6 "${RUNNER_TEMP}/strip01-mf6/mf6" --output "${RUNNER_TEMP}/strip01-results/native"
          git rev-parse HEAD > "${RUNNER_TEMP}/strip01-results/source_commit.txt"
      - name: Persist research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F-GC-STRIP01-${{ github.run_id }}
          path: ${{ runner.temp }}/strip01-results/
          if-no-files-found: warn
          retention-days: 90
