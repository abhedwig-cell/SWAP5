name: F-GC30 MODFLOW6 predictor response

on:
  push:
    branches:
      - work/f-gc30-modflow6-tangent-coupling-contract
    paths:
      - 'src/runtime/mod_modflow6_swap_predictor_response.f90'
      - 'tests/fgc/test_fgc30_modflow6_predictor_response_contract.f90'
      - 'tests/fgc/run_fgc30_modflow6_predictor_response_contract.sh'
      - '.github/workflows/f-gc30-modflow6-predictor-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run F-GC30 predictor-response gate
        run: bash tests/fgc/run_fgc30_modflow6_predictor_response_contract.sh
