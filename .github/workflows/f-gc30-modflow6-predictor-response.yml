name: F-GC30 MODFLOW6 predictor response

on:
  push:
    branches:
      - work/f-gc30-modflow6-tangent-coupling-contract
    paths:
      - 'src/runtime/mod_modflow6_swap_predictor_response.f90'
      - 'src/runtime/mod_modflow6_swap_prescribed_qbot_bottom_face.f90'
      - 'src/runtime/mod_modflow6_swap_predictor_tangent_adapter.f90'
      - 'src/runtime/mod_modflow6_swap_predictor_origin.f90'
      - 'src/runtime/mod_modflow6_swap_predictor_candidate_assembler.f90'
      - 'tests/fgc/test_fgc30_modflow6_predictor_response_contract.f90'
      - 'tests/fgc/run_fgc30_modflow6_predictor_response_contract.sh'
      - 'tests/fgc/test_fgc30_prescribed_qbot_bottom_face.f90'
      - 'tests/fgc/run_fgc30_prescribed_qbot_bottom_face.sh'
      - 'tests/fgc/test_fgc30_predictor_tangent_adapter.f90'
      - 'tests/fgc/run_fgc30_predictor_tangent_adapter.sh'
      - 'tests/fgc/test_fgc30_predictor_origin.f90'
      - 'tests/fgc/run_fgc30_predictor_origin.sh'
      - 'tests/fgc/test_fgc30_production_predictor_tangent_endpoint.f90'
      - 'tests/fgc/run_fgc30_production_predictor_tangent_endpoint.sh'
      - '.github/workflows/f-gc30-modflow6-predictor-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run F-GC30 predictor-response gate
        run: bash tests/fgc/run_fgc30_modflow6_predictor_response_contract.sh
      - name: Run F-GC30 prescribed-qbot bottom-face gate
        run: bash tests/fgc/run_fgc30_prescribed_qbot_bottom_face.sh
      - name: Run F-GC30 accepted predictor tangent adapter gate
        run: bash tests/fgc/run_fgc30_predictor_tangent_adapter.sh
      - name: Run F-GC30 accepted SWAP predictor-origin gate
        run: bash tests/fgc/run_fgc30_predictor_origin.sh
      - name: Run F-GC30 production predictor tangent endpoint gate
        run: bash tests/fgc/run_fgc30_production_predictor_tangent_endpoint.sh
