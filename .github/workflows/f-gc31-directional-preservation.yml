name: F-GC31 directional preservation

on:
  push:
    branches:
      - work/f-gc31-active-drainage-derivative-closure
    paths:
      - 'src/solver/mod_soil_water_accepted_step_direction_contract.f90'
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'src/transaction/mod_accepted_trajectory_directional_sensitivity.f90'
      - 'tests/fgc/run_fgc31_directional_preservation.sh'
      - '.github/workflows/f-gc31-directional-preservation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directional-preservation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run F-SI37 and F-KT21 preservation replay
        run: bash tests/fgc/run_fgc31_directional_preservation.sh
