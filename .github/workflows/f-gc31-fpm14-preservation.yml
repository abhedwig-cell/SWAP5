name: F-GC31 F-PM14 preservation

on:
  push:
    branches:
      - work/f-gc31-active-drainage-derivative-closure
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_drainage_response_binding.f90'
      - 'src/runtime/mod_fmr_drainage_qbot_directional_binding.f90'
      - 'src/solver/mod_soil_water_accepted_step_direction_contract.f90'
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'tests/fgc/run_fgc31_fpm14_preservation.sh'
      - '.github/workflows/f-gc31-fpm14-preservation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fpm14-preservation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Replay independent F-VQ73 drainage runtime
        run: bash tests/fgc/run_fgc31_fpm14_preservation.sh
