name: F-GC31 smooth freatic projection

on:
  push:
    branches:
      - work/f-gc31-active-drainage-derivative-closure
    paths:
      - 'src/solver/mod_b110_smooth_freatic_projection.f90'
      - 'tests/fgc/test_fgc31_smooth_freatic_projection.f90'
      - 'tests/fgc/run_fgc31_smooth_freatic_projection.sh'
      - '.github/workflows/f-gc31-smooth-freatic-projection.yml'
      - 'integration/f-gc/F-GC31_CHECKPOINT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smooth-freatic-projection:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run F-GC31 smooth freatic projection gate
        run: bash tests/fgc/run_fgc31_smooth_freatic_projection.sh
