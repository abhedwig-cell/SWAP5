name: F-GC34 MODFLOW6 typed API binding

on:
  push:
    branches:
      - work/f-gc34-modflow6-api-binding-reconciled
    paths:
      - 'src/runtime/mod_modflow6_api_binding.f90'
      - 'src/runtime/mod_modflow6_linear_response_backend.f90'
      - 'tests/fgc/test_fgc34_modflow6_api_binding.f90'
      - 'tests/fgc/run_fgc34_modflow6_api_binding.sh'
      - 'docs/integration/F-GC34_MODFLOW6_TYPED_API_BINDING.md'
      - 'integration/f-gc/F-GC34_STATUS.json'
      - '.github/workflows/f-gc34-modflow6-api-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run F-GC34 typed API binding gate
        run: bash tests/fgc/run_fgc34_modflow6_api_binding.sh
