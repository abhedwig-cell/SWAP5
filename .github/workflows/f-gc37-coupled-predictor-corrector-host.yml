name: F-GC37 internal SWAP5-MODFLOW coupling service

on:
  push:
    branches:
      - work/f-gc37-coupled-predictor-corrector-host
    paths:
      - 'tests/fgc/support/fgc37_internal_coupling_service_harness.py'
      - 'tests/fgc/test_fgc37_coupled_predictor_corrector_host.py'
      - 'tests/fgc/run_fgc37_coupled_predictor_corrector_host.sh'
      - 'docs/integration/F-GC37_INTERNAL_SWAP_MODFLOW_COUPLING_SERVICE.md'
      - 'integration/f-gc/F-GC37_STATUS.json'
      - '.github/workflows/f-gc37-coupled-predictor-corrector-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run F-GC37 internal coupling-service contract gate
        run: bash tests/fgc/run_fgc37_coupled_predictor_corrector_host.sh
