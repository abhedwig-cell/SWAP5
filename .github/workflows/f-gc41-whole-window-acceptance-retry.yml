name: F-GC41 whole-window acceptance retry
on:
  push:
    branches: [work/f-gc41-whole-window-acceptance-retry]
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'src/adapter/modflow6_prepared_solve_session.py'
      - 'tests/fgc/support/fgc41_whole_window_acceptance_harness.py'
      - 'tests/fgc/test_fgc41_whole_window_acceptance_retry.py'
      - 'tests/fgc/test_fgc38_live_prepared_solve.py'
      - 'tests/fgc/run_fgc41_whole_window_acceptance_retry.sh'
      - '.github/workflows/f-gc41-whole-window-acceptance-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest numpy
      - run: bash tests/fgc/run_fgc41_whole_window_acceptance_retry.sh
  live-modflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned MODFLOW Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run live MODFLOW publication-seam qualification
        run: bash tests/fgc/run_fgc38_live_prepared_solve.sh
