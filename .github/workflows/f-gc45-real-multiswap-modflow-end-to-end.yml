name: F-GC45 real MultiSWAP MODFLOW6 end-to-end
on:
  push:
    branches: [work/f-gc45-real-multiswap-modflow6-end-to-end]
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'tests/fgc/support/mod_fgc45_real_multiswap_c_bridge.f90'
      - 'tests/fgc/support/fgc45_real_multiswap_ctypes.py'
      - 'tests/fgc/test_fgc45_real_multiswap_modflow_end_to_end.py'
      - 'tests/fgc/run_fgc45_real_multiswap_modflow_end_to_end.sh'
      - 'docs/integration/F-GC45_REAL_MULTISWAP_MODFLOW6_END_TO_END.md'
      - '.github/workflows/f-gc45-real-multiswap-modflow-end-to-end.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-n1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned MODFLOW Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run real MultiSWAP plus live MODFLOW6 N:1 gate
        run: bash tests/fgc/run_fgc45_real_multiswap_modflow_end_to_end.sh
