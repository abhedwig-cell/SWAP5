name: F-GC49B FMR participant registry
on:
  push:
    branches: [work/f-gc49b-fmr-participant-registry]
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'src/runtime/mod_fmr_groundwater_participant_registry.f90'
      - 'tests/fgc/test_fgc49b_fmr_participant_registry.f90'
      - 'tests/fgc/run_fgc49b_fmr_participant_registry.sh'
      - 'docs/integration/F-GC49B_FMR_PARTICIPANT_REGISTRY.md'
      - 'integration/f-gc/F-GC49_STATUS.json'
      - '.github/workflows/f-gc49b-fmr-participant-registry.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: bash tests/fgc/run_fgc49b_fmr_participant_registry.sh
