name: F-HYDROFIT01 research tests

on:
  push:
    branches:
      - research/f-hydrofit01-modern-hydraulic-estimation
    paths:
      - 'research/hydrofit/**'
      - 'tests/research/test_hydrofit.py'
      - 'tests/research/test_hydrofit_swap_probe.f90'
      - 'tests/research/run_hydrofit_swap_probe.sh'
      - '.github/workflows/f-hydrofit01-research.yml'
  workflow_dispatch:

jobs:
  hydrofit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest -q tests/research/test_hydrofit.py
      - run: bash tests/research/run_hydrofit_swap_probe.sh
