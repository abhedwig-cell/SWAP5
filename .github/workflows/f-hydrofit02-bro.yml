name: F-HYDROFIT02 BRO acquisition probe

on:
  push:
    branches:
      - research/f-hydrofit02-bro-acquisition
    paths:
      - 'research/hydrofit/bro_bhrp_fetch.py'
      - '.github/workflows/f-hydrofit02-bro.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official BHR-P base
        run: |
          mkdir -p "$RUNNER_TEMP/bro"
          python research/hydrofit/bro_bhrp_fetch.py \
            --output "$RUNNER_TEMP/bro/base.response" \
            --manifest "$RUNNER_TEMP/bro/base.manifest.json"
      - name: Show bounded response prefix
        run: |
          python - <<'PY'
          import os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/base.response"
          b=p.read_bytes()
          print("BRO_BASE_PREFIX="+repr(b[:2000]))
          PY
      - name: Probe API specifications
        run: |
          for p in swagger.json v3/api-docs openapi.json api-docs; do
            safe="$(echo "$p" | tr '/' '_')"
            python research/hydrofit/bro_bhrp_fetch.py --path "$p" \
              --output "$RUNNER_TEMP/bro/$safe.response" \
              --manifest "$RUNNER_TEMP/bro/$safe.manifest.json" || true
          done
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"bro"
          for m in sorted(root.glob("*.manifest.json")):
              d=json.loads(m.read_text())
              print(f"BRO_SPEC_CANDIDATE|FILE={m.name}|STATUS={d['http_status']}|TYPE={d['content_type']}|SIZE={d['size_bytes']}")
          PY
      - name: Inspect official OpenAPI paths
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/openapi.json.response"
          d=json.loads(p.read_text())
          for path,item in d.get("paths",{}).items():
              print("BRO_OPENAPI_PATH|PATH="+path+"|METHODS="+",".join(sorted(item)))
          PY
      - name: Inspect bro-ids contract
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/openapi.json.response"
          d=json.loads(p.read_text())
          op=d["paths"]["/sr/bhrp/v2/bro-ids"]["get"]
          print("BRO_IDS_OPERATION="+json.dumps(op,sort_keys=True))
          PY
      - name: Inspect characteristics search contract
        run: |
          python - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/openapi.json.response").read_text())
          op=d["paths"]["/sr/bhrp/v2/characteristics/searches"]["post"]
          print("BRO_SEARCH_OPERATION="+json.dumps(op,sort_keys=True))
          refs={}
          def walk(x):
              if isinstance(x,dict):
                  if "$ref" in x: refs[x["$ref"]]=1
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(op)
          for ref in refs:
              name=ref.rsplit("/",1)[-1]
              schema=d.get("components",{}).get("schemas",{}).get(name)
              print("BRO_SEARCH_SCHEMA|NAME="+name+"|SCHEMA="+json.dumps(schema,sort_keys=True))
          PY
      - name: Inspect area and official example
        run: |
          python - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/openapi.json.response").read_text())
          for name in ["Area","BoundingBox","DatePeriod","YesNoEnumeration"]:
              print("BRO_SCHEMA|NAME="+name+"|SCHEMA="+json.dumps(d.get("components",{}).get("schemas",{}).get(name),sort_keys=True))
          print("BRO_EXAMPLE_SIMPLE="+json.dumps(d.get("components",{}).get("examples",{}).get("SIMPLE_CRITERIA"),sort_keys=True))
          PY
      - name: Enumerate official BHR-P ids
        run: |
          python research/hydrofit/bro_bhrp_fetch.py --path bro-ids \
            --output "$RUNNER_TEMP/bro/bro-ids.response" \
            --manifest "$RUNNER_TEMP/bro/bro-ids.manifest.json"
          python - <<'PY'
          import json, os, pathlib, re
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/bro-ids.response"
          b=p.read_bytes()
          print("BRO_IDS_PREFIX="+repr(b[:1000]))
          try:
              d=json.loads(b)
              if isinstance(d,list):
                  ids=d
              elif isinstance(d,dict):
                  ids=next((v for k,v in d.items() if isinstance(v,list)),[])
              else: ids=[]
              print(f"BRO_IDS_JSON|COUNT={len(ids)}|FIRST={ids[:5]}")
          except Exception as e:
              txt=b.decode("utf-8","replace")
              ids=re.findall(r'BHRP[0-9A-Za-z_-]+',txt)
              print(f"BRO_IDS_TEXT|MATCHES={len(ids)}|FIRST={ids[:5]}|PARSE={type(e).__name__}")
          PY
      - name: Execute official example characteristics search
        run: |
          cat > "$RUNNER_TEMP/bro/example-search.json" <<'JSON'
          {
            "registrationPeriod": {"beginDate":"2017-02-01","endDate":"2021-02-01"},
            "area": {"enclosingCircle":{"center":{"lat":52.038297852,"lon":5.31447958948},"radius":0.5}}
          }
          JSON
          python research/hydrofit/bro_bhrp_fetch.py \
            --path characteristics/searches --method POST --json-body "$RUNNER_TEMP/bro/example-search.json" \
            --output "$RUNNER_TEMP/bro/example-search.response" \
            --manifest "$RUNNER_TEMP/bro/example-search.manifest.json" --require-success
          python - <<'PY'
          import os,pathlib,re
          b=(pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/example-search.response").read_bytes()
          txt=b.decode("utf-8","replace")
          ids=sorted(set(re.findall(r'BHRP[0-9A-Za-z_-]+',txt)))
          print(f"BRO_EXAMPLE_SEARCH|SIZE={len(b)}|IDS={len(ids)}|FIRST={ids[:10]}")
          print("BRO_EXAMPLE_PREFIX="+repr(b[:1500]))
          PY
      - name: Inspect response characteristic field names
        run: |
          python - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/openapi.json.response").read_text())
          for name,schema in sorted(d.get("components",{}).get("schemas",{}).items()):
              props=set((schema or {}).get("properties",{}))
              if {"broId","deliveryAccountableParty"} & props or "broId" in name.lower():
                  print("BRO_COMPONENT|NAME="+name+"|SCHEMA="+json.dumps(schema,sort_keys=True))
          PY
      - name: Broad bounded BHR-P discovery
        run: |
          cat > "$RUNNER_TEMP/bro/broad-search.json" <<'JSON'
          {
            "area": {
              "enclosingCircle": {
                "center": {"lat": 52.15, "lon": 5.35},
                "radius": 80.0
              }
            },
            "boreholeSamplesAnalyzed": "JA"
          }
          JSON
          python research/hydrofit/bro_bhrp_fetch.py \
            --path characteristics/searches --method POST --json-body "$RUNNER_TEMP/bro/broad-search.json" \
            --output "$RUNNER_TEMP/bro/broad-search.response" \
            --manifest "$RUNNER_TEMP/bro/broad-search.manifest.json" --require-success
          python - <<'PY'
          import os,pathlib,re,xml.etree.ElementTree as ET
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"bro/broad-search.response"
          b=p.read_bytes(); root=ET.fromstring(b)
          def local(tag): return tag.rsplit('}',1)[-1]
          vals=[]
          for e in root.iter():
              if e.text and e.text.strip():
                  vals.append((local(e.tag),e.text.strip()))
          ids=[v for k,v in vals if k.lower() in ("broid","bro-id","bro_id") or re.fullmatch(r"BHRP[0-9A-Za-z_-]+",v)]
          print(f"BRO_BROAD_SEARCH|SIZE={len(b)}|IDS={len(ids)}|FIRST={ids[:10]}")
          for k,v in vals[:80]:
              print(f"BRO_XML_FIELD|{k}={v}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f-hydrofit02-bro-probe
          path: ${{ runner.temp }}/bro
          if-no-files-found: error
