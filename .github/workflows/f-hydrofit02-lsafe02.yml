name: F-HYDROFIT02 external gated-lambda validation

on:
  push:
    branches:
      - research/f-hydrofit02-bro-acquisition
    paths:
      - 'research/hydrofit/acquire_lsafe02_external_corpus.py'
      - 'research/hydrofit/validate_lsafe02_external.py'
      - '.github/workflows/f-hydrofit02-lsafe02.yml'
  workflow_dispatch:

concurrency:
  group: f-hydrofit02-lsafe02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Prepare output
        run: mkdir -p "$RUNNER_TEMP/lsafe02"
      - name: Acquire independent BRO corpus
        run: |
          set -o pipefail
          PYTHONPATH=research/hydrofit python research/hydrofit/acquire_lsafe02_external_corpus.py \
            --training-corpus integration/research/data/F-HYDROFIT02_FROZEN_SPATIAL_LAMBDA_CORPUS_IDENTITY.json \
            --out "$RUNNER_TEMP/lsafe02/external-corpus.json" \
            | tee "$RUNNER_TEMP/lsafe02/acquisition.txt"
      - name: Validate frozen gated estimator
        run: |
          set -o pipefail
          PYTHONPATH=research/hydrofit python research/hydrofit/validate_lsafe02_external.py \
            --corpus "$RUNNER_TEMP/lsafe02/external-corpus.json" \
            | tee "$RUNNER_TEMP/lsafe02/validation.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: f-hydrofit02-lsafe02
          path: ${{ runner.temp }}/lsafe02
          if-no-files-found: error
