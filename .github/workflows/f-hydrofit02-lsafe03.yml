name: F-HYDROFIT02 content-defined external validation

on:
  push:
    branches:
      - research/f-hydrofit02-bro-acquisition
    paths:
      - 'research/hydrofit/acquire_lsafe03_content_corpus.py'
      - 'research/hydrofit/validate_lsafe03_content_external.py'
      - '.github/workflows/f-hydrofit02-lsafe03.yml'
  workflow_dispatch:

concurrency:
  group: f-hydrofit02-lsafe03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Prepare output
        run: mkdir -p "$RUNNER_TEMP/lsafe03"
      - name: Acquire content-defined independent corpus
        run: |
          set -o pipefail
          PYTHONPATH=research/hydrofit python research/hydrofit/acquire_lsafe03_content_corpus.py \
            --ids integration/research/data/F-HYDROFIT02_LSAFE02_INDEPENDENT_BRO_IDS.json \
            --out "$RUNNER_TEMP/lsafe03/content-corpus.json" \
            | tee "$RUNNER_TEMP/lsafe03/acquisition.txt"
      - name: Validate frozen gated estimator
        run: |
          set -o pipefail
          PYTHONPATH=research/hydrofit python research/hydrofit/validate_lsafe03_content_external.py \
            --corpus "$RUNNER_TEMP/lsafe03/content-corpus.json" \
            | tee "$RUNNER_TEMP/lsafe03/validation.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: f-hydrofit02-lsafe03
          path: ${{ runner.temp }}/lsafe03
          if-no-files-found: error
