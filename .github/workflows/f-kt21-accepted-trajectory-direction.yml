name: F-KT21 Accepted Trajectory Direction

on:
  push:
    branches:
      - work/f-kt21-accepted-trajectory-directional-sensitivity-composition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run F-KT21 qualification
        run: bash tests/fkt/run_fkt21_qualification.sh
