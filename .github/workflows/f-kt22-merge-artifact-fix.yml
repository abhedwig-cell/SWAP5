name: F-KT22 merge artifact fix

on:
  push:
    branches:
      - work/f-kt22-current-canonical-recomposition
    paths:
      - '.github/workflows/f-kt22-merge-artifact-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-kt22-current-canonical-recomposition
          fetch-depth: 0
      - name: Restore merge block closure
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/runtime/mod_fmr_serialized_reference_backend.f90
          test "$(grep -Fc 'call record_top_sensible_boundary_sample(self, t0, t1, solve_result%top_flux * step_duration)' "$FILE")" -eq 1
          sed -i '/call record_top_sensible_boundary_sample(self, t0, t1, solve_result%top_flux \* step_duration)/a\    end if' "$FILE"
          git diff --check -- "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'fix(F-KT22): restore EB-I25 carrier block closure'
          git push origin HEAD:work/f-kt22-current-canonical-recomposition
