name: F-MACRO-TRACER01-D2A forward comparison
on:
  push:
    branches:
      - research/f-macro-tracer01-reference-kernel
    paths:
      - '.github/workflows/f-macro-tracer01d2a.yml'
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run coupled RFM matrix-IC grid
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tracer01d2a"
          mkdir -p "$BUILD" artifacts
          python3 tests/rom/materialize_f_rom0_headcalc_stubs.py --source tests/fsi/fsi04_real_headcalc_stubs.f90 --output "$BUILD/stub.f90" --nodes 10 --dz-cm 10
          python3 tests/rom/compile_f_rom0_fortran_closure.py --root "$GITHUB_WORKSPACE" --stub "$BUILD/stub.f90" --target tools/research/fortran/test_macro_tracer01d2a_spechtacker_rfm_ic.f90 --external-source tools/research/fortran/mod_rfm_surface_sorptivity.f90 --external-source tools/research/fortran/mod_rfm_research_adapter.f90 --external-source src/legacy/b1_10_port/headcalc.f90 --build "$BUILD/compile" --opt 2
          for S in 0.10 0.20 0.30 0.40 0.50 0.60 0.70 0.80 0.90 1.00 1.20 1.40 1.60 1.80 2.00; do
            TAG=$(echo "$S" | tr '.' 'p')
            "$BUILD/compile/rom0_test" "artifacts/d2a_trajectory_${TAG}.csv" "$S" | tee "artifacts/d2a_runner_${TAG}.log"
          done
          set +e
          python3 tools/research/macropore_tracer01d2a_forward_compare.py artifacts/d2a_trajectory_*.csv | tee artifacts/d2a_summary.json
          CMP=${PIPESTATUS[0]}
          set -e
          echo "D2A_COMPARATOR_EXIT=${CMP}" | tee artifacts/d2a_comparator_exit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-macro-tracer01d2a-forward
          path: artifacts/
