name: F-MIG431 LOW03-A DEP01 qualification
on:
  push:
    branches: [work/f-mig431-low03-a-dep01-serialized-context-mode3]
    paths:
      - 'src/adapter/mod_b110_serialized_context_binding.f90'
      - 'tests/fmig431/test_low03a_dep01_serialized_context.f90'
      - 'tests/fmig431/run_low03a_dep01_qualification.py'
      - 'tests/fmig431/support/low03a_dep01_baseline_serialized_context_binding.txt'
      - '.github/workflows/f-mig431-low03a-dep01-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Paired current-canonical shared-context preservation
        env:
          LOW03A_DEP01_RESULT: low03a_dep01_result.json
          LOW03A_DEP01_TESTED_SHA: ${{ github.sha }}
        run: python3 tests/fmig431/run_low03a_dep01_qualification.py
      - name: Preserve admitted LOW03-P0 typed solver
        run: python3 tests/fmig431/run_low03_solver_qualification.py
      - name: Persist exact prerequisite evidence
        uses: actions/upload-artifact@v4
        with:
          name: F-MIG431-LOW03-A-DEP01-qualification
          path: |
            low03a_dep01_result.json
            low03_solver_qualification_result.json
          if-no-files-found: error
