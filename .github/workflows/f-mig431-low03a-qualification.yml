name: F-MIG431 LOW03-A qualification
on:
  push:
    branches: [work/f-mig431-low03-a-implicit-cauchy-application]
    paths:
      - 'src/runtime/mod_fmr_legacy_cauchy_bottom_boundary_provider.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_production_application_bootstrap.f90'
      - 'src/adapter/mod_b110_serialized_context_binding.f90'
      - 'tests/fmig431/test_low03a_*.f90'
      - 'tests/fmig431/run_low03a_*.py'
      - '.github/workflows/f-mig431-low03a-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Frozen corrected-B1.11 source law oracles
        run: python3 tests/fmig431/run_low03a_source_oracles.py
      - name: Bounded application and preservation O0/O2
        env:
          LOW03A_RESULT: low03a_qualification_result.json
          LOW03A_TESTED_SHA: ${{ github.sha }}
        run: python3 tests/fmig431/run_low03a_qualification.py
      - name: Preserve existing LOW03-P0 direct typed solver qualification
        run: python3 tests/fmig431/run_low03_solver_qualification.py
      - name: Preserve admitted LOW05-A application qualification
        run: python3 tests/fmig431/run_low05a_qualification.py
      - name: Persist exact-postimage evidence
        uses: actions/upload-artifact@v4
        with:
          name: F-MIG431-LOW03-A-qualification
          path: low03a_qualification_result.json
          if-no-files-found: error
