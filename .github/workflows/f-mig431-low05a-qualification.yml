name: F-MIG431 LOW05-A qualification
on:
  push:
    branches: [work/f-mig431-low05a-prescribed-head-application]
    paths:
      - '.github/workflows/f-mig431-low05a-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exact-source, progress, rollback, restart and preservation O0/O2
        env:
          LOW05A_RESULT: low05a_qualification_result.json
        run: python3 tests/fmig431/run_low05a_qualification.py
      - name: Persist exact-postimage qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: F-MIG431-LOW05A-qualification
          path: low05a_qualification_result.json
          if-no-files-found: error
