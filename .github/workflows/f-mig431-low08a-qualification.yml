name: F-MIG431 LOW08-A qualification
on:
  pull_request:
    branches: [integration/f-ci-canonical]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: O0 O2 qualification
        id: qualify
        continue-on-error: true
        env:
          LOW08A_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LOW08A_RESULT: low08a_qualification_result.json
        run: |
          set -o pipefail
          python3 tests/fmig431/run_low08a_qualification.py 2>&1 | tee low08a_qualification.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: F-MIG431-LOW08-A-qualification
          path: |
            low08a_qualification_result.json
            low08a_qualification.log
          if-no-files-found: warn
      - name: Persist qualification evidence
        if: steps.qualify.outputs.exit_code == '0' && github.event_name == 'push'
        run: |
          cp low08a_qualification_result.json integration/audits/F-MIG431-LOW08-A_QUALIFICATION.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/audits/F-MIG431-LOW08-A_QUALIFICATION.json
          git diff --cached --quiet && exit 0
          git commit -m "evidence(LOW08-A): persist bounded qualification"
          git push
      - name: Enforce qualification result
        if: always() && steps.qualify.outputs.exit_code != '0'
        run: exit 1
