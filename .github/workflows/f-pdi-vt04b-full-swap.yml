name: F-PDI-VT04B finite-control full model
on:
  push:
    branches: [work/f-pdi-vapor-temperature-audit]
    paths:
      - 'research/pdi_vt/f_pdi_vt04b_case.py'
      - 'research/pdi_vt/run_f_pdi_vt04b.sh'
      - 'integration/f-pdi-vt/F-PDI-VT04B_PREREGISTRATION.json'
      - '.github/workflows/f-pdi-vt04b-full-swap.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash research/pdi_vt/run_f_pdi_vt04b.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-pdi-vt04b-${{ github.run_id }}
          path: |
            /tmp/f_pdi_vt04b_base.json
            /tmp/f_pdi_vt04b_finite.json
            /tmp/control-vap.bfo
            /tmp/candidate-vap.bfo
            /tmp/control-novap.bfo
            /tmp/candidate-novap.bfo
            /tmp/control_vap.log
            /tmp/candidate_vap.log
            /tmp/control_novap.log
            /tmp/candidate_novap.log
