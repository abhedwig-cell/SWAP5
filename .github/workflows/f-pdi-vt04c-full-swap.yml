name: F-PDI-VT04C heat-bound full model
on:
  push:
    branches: [work/f-pdi-vapor-temperature-audit]
    paths:
      - 'research/pdi_vt/f_pdi_vt04c_case.py'
      - 'research/pdi_vt/run_f_pdi_vt04c.sh'
      - 'integration/f-pdi-vt/F-PDI-VT04C_PREREGISTRATION.json'
      - '.github/workflows/f-pdi-vt04c-full-swap.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash research/pdi_vt/run_f_pdi_vt04c.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-pdi-vt04c-${{ github.run_id }}
          path: |
            /tmp/f_pdi_vt04c_base.json
            /tmp/f_pdi_vt04c_finite.json
            /tmp/control-vap.bfo
            /tmp/candidate-vap.bfo
            /tmp/control-novap.bfo
            /tmp/candidate-novap.bfo
            /tmp/control-vap.vap
            /tmp/candidate-vap.vap
            /tmp/control-novap.vap
            /tmp/candidate-novap.vap
            /tmp/control-vap.wba
            /tmp/candidate-vap.wba
            /tmp/control-novap.wba
            /tmp/candidate-novap.wba
            /tmp/control-vap.inc
            /tmp/candidate-vap.inc
            /tmp/control-novap.inc
            /tmp/candidate-novap.inc
            /tmp/control_vap.log
            /tmp/candidate_vap.log
            /tmp/control_novap.log
            /tmp/candidate_novap.log
