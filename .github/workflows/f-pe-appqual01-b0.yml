name: F-PE-APPQUAL01 B0 live coupled benchmark

on:
  pull_request:
    paths:
      - 'tests/fgc/test_fgc47_mixed_topology_live_modflow.py'
      - 'tests/performance/appqual01_*'
      - 'docs/performance/F-PE-APPQUAL01_PREREGISTRATION.md'
      - '.github/workflows/f-pe-appqual01-b0.yml'
  workflow_dispatch:

jobs:
  b0-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark schema and B1 topology generator
        run: |
          python3 tests/performance/validate_appqual01_manifest.py
          python3 tests/performance/test_appqual01_b1_generator.py
          python3 tests/performance/generate_appqual01_b1.py --workload B1-S10000 --output appqual01-b1-s10000.json
      - name: Install Python coupling dependencies
        run: python3 -m pip install --disable-pip-version-check numpy flopy xmipy
      - name: Run real mixed-topology SWAP5 + MODFLOW6 seed
        run: |
          bash tests/fgc/run_fgc47_mixed_topology_live_modflow.sh | tee appqual01-b0.txt
          python3 tests/performance/collect_appqual01_b0.py appqual01-b0.txt "$GITHUB_SHA" appqual01-b0.json
          cat appqual01-b0.json
      - uses: actions/upload-artifact@v4
        with:
          name: appqual01-b0-metrics
          path: |
            appqual01-b0.txt
            appqual01-b0.json
            appqual01-b1-s10000.json
