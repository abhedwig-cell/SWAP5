name: F-PE-APPQUAL01 B1 Reference scaling

on:
  pull_request:
    paths:
      - 'src/runtime/**'
      - 'src/solver/**'
      - 'src/adapter/**'
      - 'src/kernel/**'
      - 'src/transaction/**'
      - 'src/process/**'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'tests/performance/test_appqual01_b1_reference.f90'
      - 'tests/performance/run_appqual01_b1_reference.sh'
      - 'tests/performance/appqual01_workloads.json'
      - '.github/workflows/f-pe-appqual01-b1-reference.yml'
  workflow_dispatch:

jobs:
  reference-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Run S100 S1000 S10000 cleaned Reference baseline
        run: |
          bash tests/performance/run_appqual01_b1_reference.sh | tee appqual01-b1-reference.txt
          test "$(grep -c '^APPQUAL01_B1_REFERENCE=PASS$' appqual01-b1-reference.txt)" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: appqual01-b1-reference
          path: appqual01-b1-reference.txt
