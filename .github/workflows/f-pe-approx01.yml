name: F-PE-APPROX01 tangent cadence research

on:
  pull_request:
    paths:
      - 'tests/fpe/test_fpe_approx01_tangent_sequence.f90'
      - 'tests/fpe/run_fpe_approx01_tangent_sweep.sh'
      - 'tests/fpe/run_fpe_approx01_cadence_timing.sh'
      - 'tests/fpe/test_fpe_approx01_cadence_timing.f90'
      - 'tests/fpe/test_fpe_approx01_tangent_matrix.f90'
      - 'tests/fpe/run_fpe_approx01_tangent_matrix.sh'
      - 'tests/fpe/run_fpe_approx01_amplitude_frontier.sh'
      - 'tests/fpe/run_fpe_approx01_a1_participant_experiment.sh'
      - 'tests/fpe/run_fpe_approx01_a1_default_off_identity.sh'
      - 'src/runtime/mod_fmr_groundwater_swap_participant.f90'
      - 'src/runtime/mod_groundwater_swap_transaction_participant.f90'
      - 'docs/performance/F-PE-APPROX01_*.md'
      - '.github/workflows/f-pe-approx01.yml'
  workflow_dispatch:

jobs:
  tangent-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx01_tangent_sweep.sh

  cadence-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx01_cadence_timing.sh

  tangent-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx01_tangent_matrix.sh

  amplitude-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx01_amplitude_frontier.sh

  a1-participant:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx01_a1_participant_experiment.sh

  fgc44-default-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fgc/run_fgc44_real_fmr_participant.sh

  a1-default-off-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tests/fpe/run_fpe_approx01_a1_default_off_identity.sh
