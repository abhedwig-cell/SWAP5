name: F-PE-APPROX01 tangent cadence research

on:
  pull_request:
    paths:
      - 'tests/fpe/test_fpe_approx01_tangent_sequence.f90'
      - 'tests/fpe/run_fpe_approx01_tangent_sweep.sh'
      - 'tests/fpe/run_fpe_approx01_cadence_timing.sh'
      - 'tests/fpe/test_fpe_approx01_cadence_timing.f90'
      - 'docs/performance/F-PE-APPROX01_*.md'
      - '.github/workflows/f-pe-approx01.yml'
  workflow_dispatch:

jobs:
  tangent-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx01_tangent_sweep.sh

  cadence-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx01_cadence_timing.sh
