name: F-PE-APPROX02 A2C production qualification

on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpe/run_fpe_approx02_a2_application_sequence.sh'
      - 'tests/fpe/run_fpe_approx02_a2c_production_binding.sh'
      - 'tests/fgc/run_fgc44_real_fmr_participant.sh'
      - 'tests/fpe/run_fpe_approx02_a2_modflow_e2e.sh'
      - 'tests/fpe/test_fpe_approx02_a2_application_sequence.f90'
      - 'tests/fpe/run_fpe_approx02_a2_multistep.sh'
      - 'tests/fpe/test_fpe_approx02_a2_multistep.f90'
      - 'tests/fpe/test_fpe_approx02_r1_transaction.f90'
      - 'docs/performance/F-PE-APPROX02_A2_*.md'
      - 'docs/performance/F-PE-APPROX02_A2B_*.md'
      - 'docs/performance/F-PE-APPROX02_A2C_*.md'
      - '.github/workflows/f-pe-approx02.yml'
  workflow_dispatch:

jobs:
  a2c-multistep:
    runs-on: ubuntu-latest
    env:
      APPROX02_CANDIDATE_TOL: 1e-8
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_a2_multistep.sh

  a2c-application-sequence:
    runs-on: ubuntu-latest
    env:
      APPROX02_CANDIDATE_TOL: 1e-8
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_a2_application_sequence.sh

  a2c-modflow-e2e:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-24.04
    env:
      APPROX02_CANDIDATE_TOL: 1e-8
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned MODFLOW Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_approx02_a2_modflow_e2e.sh

  a2c-production-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_a2c_production_binding.sh

  fgc44-default-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fgc/run_fgc44_real_fmr_participant.sh
