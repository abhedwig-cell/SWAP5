name: F-PE-APPROX02 Richards effort research

on:
  pull_request:
    paths:
      - 'tests/fpe/test_fpe_approx02_richards_effort.f90'
      - 'tests/fpe/run_fpe_approx02_workload_discovery.sh'
      - 'tests/fpe/run_fpe_approx02_tolerance_sweep.sh'
      - 'tests/fpe/run_fpe_approx02_balance_sweep.sh'
      - 'tests/fpe/run_fpe_approx02_combined_convergence_sweep.sh'
      - 'tests/fpe/run_fpe_approx02_candidate_matrix.sh'
      - 'docs/performance/F-PE-APPROX02_*.md'
      - '.github/workflows/f-pe-approx02.yml'
  workflow_dispatch:

jobs:
  workload-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_workload_discovery.sh

  tolerance-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_tolerance_sweep.sh

  balance-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_balance_sweep.sh

  combined-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_combined_convergence_sweep.sh

  candidate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_candidate_matrix.sh
