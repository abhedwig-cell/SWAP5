name: F-PE-APPROX02 A2 production qualification

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_approx02_a2_transaction.sh'
      - 'tests/fpe/run_fpe_approx02_a2_multistep.sh'
      - 'tests/fpe/test_fpe_approx02_a2_multistep.f90'
      - 'tests/fpe/test_fpe_approx02_r1_transaction.f90'
      - 'docs/performance/F-PE-APPROX02_A2_*.md'
      - '.github/workflows/f-pe-approx02.yml'
  workflow_dispatch:

jobs:
  a2-multistep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_a2_multistep.sh

  a2-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_a2_transaction.sh
