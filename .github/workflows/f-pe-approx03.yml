name: F-PE-APPROX03 temporal effort research

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_approx03_temporal_discovery.sh'
      - 'tests/fpe/run_fpe_approx03_certificate_discovery.sh'
      - 'tests/fpe/run_fpe_approx03_t1_budget_frontier.sh'
      - 'tests/fpe/run_fpe_approx03_t2_mode5_discovery.sh'
      - 'docs/performance/F-PE-APPROX03_*.md'
      - '.github/workflows/f-pe-approx03.yml'
  workflow_dispatch:

jobs:
  certificate-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx03_certificate_discovery.sh

  t1-budget-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx03_t1_budget_frontier.sh

  t2-mode5-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx03_t2_mode5_discovery.sh
