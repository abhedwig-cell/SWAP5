name: F-PE-BASE01 base q-state decomposition

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_base01_*.sh'
      - 'tests/fpe/test_fpe_base01_*.py'
      - 'docs/performance/F-PE-BASE01_*.md'
      - '.github/workflows/f-pe-base01.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-base01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p0-participant-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler and pinned live coupling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run current-canonical participant/backend boundary
        run: |
          bash tests/fpe/run_fpe_base01_p0_participant_boundary.sh | tee base01-p0.txt
          grep -Fq 'FPE_BASE01_P0=PASS' base01-p0.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-pe-base01-p0
          path: base01-p0.txt


  p1-backend-internal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler and pinned live coupling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run backend internal decomposition
        run: |
          bash tests/fpe/run_fpe_base01_p1_backend.sh | tee base01-p1.txt
          grep -Fq 'FPE_BASE01_P1=PASS' base01-p1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-pe-base01-p1
          path: base01-p1.txt
