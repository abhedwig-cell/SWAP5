name: F-PE-BOFEK00 frozen wet trajectory

on:
  push:
    branches:
      - work/f-pe-bofek00-correction-candidate
    paths:
      - 'tests/verification/test_bofek00_frozen_wet_trajectory.f90'
      - 'tests/verification/run_bofek00_frozen_trajectory_gate.sh'
      - '.github/workflows/f-pe-bofek00-frozen-trajectory.yml'
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/solver/mod_b110_dynamic_top_boundary_provider.f90'
      - 'src/adapter/mod_b110_dynamic_top_boundary_solver_adapter.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
  workflow_dispatch:

jobs:
  frozen-trajectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run fixed-timestep old-vs-corrected wet trajectory
        run: bash tests/verification/run_bofek00_frozen_trajectory_gate.sh
