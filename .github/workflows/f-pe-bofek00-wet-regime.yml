name: F-PE-BOFEK00 wet-regime correction qualification

on:
  push:
    branches:
      - work/f-pe-bofek00-wet-regime-authority
    paths:
      - 'docs/verification/F-PE-BOFEK00_PREREGISTRATION.md'
      - 'tests/verification/test_bofek00_dynamic_top_correction.f90'
      - 'tests/verification/run_bofek00_correction_gate.sh'
      - 'tests/verification/test_bofek00_frozen_wet_trajectory.f90'
      - 'tests/verification/run_bofek00_frozen_comparison.sh'
      - 'docs/verification/F-PE-BOFEK00_ADAPTIVE_PREREGISTRATION.md'
      - 'tests/verification/test_bofek00_adaptive_wet_trajectory.f90'
      - 'tests/verification/run_bofek00_adaptive_comparison.sh'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part04.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part05.inc'
      - '.github/workflows/f-pe-bofek00-wet-regime.yml'
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/solver/mod_b110_dynamic_top_boundary_provider.f90'
      - 'src/adapter/mod_b110_dynamic_top_boundary_solver_adapter.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-wet-regime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute corrected wet-regime gate
        run: bash tests/verification/run_bofek00_correction_gate.sh
      - name: Compare frozen baseline and corrected Reference
        run: bash tests/verification/run_bofek00_frozen_comparison.sh
      - name: Compare adaptive TimeControl interaction
        run: bash tests/verification/run_bofek00_adaptive_comparison.sh
      - name: Preserve TEMPORAL08 runtime chain
        run: bash tests/fpe/run_fpe_temporal08_p0_policy.sh
