name: F-PE-DIR01 active repair qualification

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_dir01_repair05_experiment.sh'
      - 'tests/fpe/run_fpe_dir01_repair05_equivalence.sh'
      - 'docs/performance/F-PE-DIR01_REPAIR05_*.md'
      - 'src/solver/mod_b110_default_mvg_provider.f90'
      - 'src/solver/mod_b110_default_mvg_directional_provider.f90'
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - '.github/workflows/f-pe-dir01.yml'
  workflow_dispatch:

jobs:
  repair05-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_dir01_repair05_experiment.sh

  repair05-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_dir01_repair05_equivalence.sh

  fkt22-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fkt/run_fkt22_fmr_compile_gate.sh

  fkt22-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fkt/run_fkt22_fmr_runtime_gate.sh
