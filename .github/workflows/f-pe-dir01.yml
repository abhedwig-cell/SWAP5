name: F-PE-DIR01 active repair qualification

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_dir01_repair03_experiment.sh'
      - 'tests/fpe/run_fpe_dir01_repair03_heap.sh'
      - 'docs/performance/F-PE-DIR01_REPAIR03_*.md'
      - 'src/transaction/mod_accepted_trajectory_directional_sensitivity.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - '.github/workflows/f-pe-dir01.yml'
  workflow_dispatch:

jobs:
  repair03-experiment:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_dir01_repair03_experiment.sh

  repair03-heap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_dir01_repair03_heap.sh
