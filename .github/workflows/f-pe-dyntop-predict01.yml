name: F-PE-DYNTOP-PREDICT01 boundary classifier

on:
  push:
    branches:
      - work/f-pe-dyntop-predict01-boundary-classifier
    paths:
      - 'docs/performance/F-PE-DYNTOP-PREDICT01_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_dyntop_predict01.f90'
      - 'tests/fpe/run_fpe_dyntop_predict01.py'
      - 'tests/fpe/run_fpe_dyntop_predict01.sh'
      - '.github/workflows/f-pe-dyntop-predict01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered origin-frozen classifier
        run: bash tests/fpe/run_fpe_dyntop_predict01.sh
