name: F-PE-ELASTIC08 runtime materialization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'docs/performance/F-PE-ELASTIC08_RUNTIME_MATERIALIZATION_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_elastic08_prepare.f90'
      - 'tests/fpe/run_fpe_elastic08_prepare.py'
      - 'tests/fpe/run_fpe_elastic08.sh'
      - '.github/workflows/f-pe-elastic08.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Qualify ELASTIC08 preparation/materialization
        run: bash tests/fpe/run_fpe_elastic08.sh
      - name: Preserve default-off serialized runtime
        run: bash tests/fkt/run_fkt22_fmr_runtime_gate.sh
