name: F-PE-ELASTIC09 application bootstrap

concurrency:
  group: f-pe-elastic09-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_production_application_bootstrap.f90'
      - 'docs/performance/F-PE-ELASTIC09_APPLICATION_BOOTSTRAP_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_elastic09_application.f90'
      - 'tests/fpe/run_fpe_elastic09.sh'
      - '.github/workflows/f-pe-elastic09.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Qualify ELASTIC09 application bootstrap
        run: bash tests/fpe/run_fpe_elastic09.sh
