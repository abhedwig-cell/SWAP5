name: F-PE-ELASTIC10C BHR-GT 10-km settlement pilot

concurrency:
  group: f-pe-elastic10c-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic01-soil-storage
    paths:
      - 'research/elastic/run_bhrgt_settlement_pilot10.py'
      - 'docs/performance/F-PE-ELASTIC10C_PILOT_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic10c-bhrgt-pilot.yml'
  workflow_dispatch:

jobs:
  bounded-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run preregistered service-valid 10-km pilot
        run: |
          mkdir -p "$RUNNER_TEMP/bhrgt-pilot10"
          python research/elastic/run_bhrgt_settlement_pilot10.py "$RUNNER_TEMP/bhrgt-pilot10"
      - name: Upload bounded pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-pe-elastic10c-bhrgt-pilot
          path: ${{ runner.temp }}/bhrgt-pilot10
