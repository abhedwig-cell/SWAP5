name: F-PE-ELASTIC12A2 soilphysics profile-id probe

concurrency:
  group: f-pe-elastic12a2-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic12-bofek-transfer
    paths:
      - 'research/elastic/soilphysics_profile_id_probe.py'
      - 'docs/performance/F-PE-ELASTIC12A2_PROFILE_SERVICE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic12a2.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe direct profile-ID routes
        run: |
          mkdir -p "$RUNNER_TEMP/elastic12a2"
          python research/elastic/soilphysics_profile_id_probe.py \
            --output "$RUNNER_TEMP/elastic12a2/profile-id-probe.json"
      - name: Upload bounded probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: f-pe-elastic12a2-profile-id-probe
          path: ${{ runner.temp }}/elastic12a2
