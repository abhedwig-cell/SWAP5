name: F-PE-ELASTIC12A3 soilphysics SMU probe

concurrency:
  group: f-pe-elastic12a3-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic12-bofek-transfer
    paths:
      - 'research/elastic/soilphysics_smu_probe.py'
      - 'docs/performance/F-PE-ELASTIC12A3_SMU_ROUTE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic12a3.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe direct soil-map-unit routes
        run: |
          mkdir -p "$RUNNER_TEMP/elastic12a3"
          python research/elastic/soilphysics_smu_probe.py \
            --output "$RUNNER_TEMP/elastic12a3/smu-probe.json"
      - name: Upload bounded probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: f-pe-elastic12a3-smu-probe
          path: ${{ runner.temp }}/elastic12a3
