name: F-PE-ELASTIC12A5 BOFEK layer transfer

concurrency:
  group: f-pe-elastic12a5-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic12-bofek-transfer
    paths:
      - 'research/elastic/bofek_elas_transfer.py'
      - 'docs/performance/F-PE-ELASTIC12A5_RELATIONAL_BRIDGE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic12a5.yml'
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen BOFEK/Staringreeks source artifact
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12-source-audit
          path: ${{ runner.temp }}/elastic12-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36549054287

      - name: Download frozen PDOK GeoPackage artifact
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic12-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840

      - name: Evaluate exact profile bridge and frozen state grid
        run: |
          python research/elastic/bofek_elas_transfer.py \
            --source-artifact-dir "$RUNNER_TEMP/elastic12-source" \
            --pdok-artifact-dir "$RUNNER_TEMP/elastic12-pdok" \
            --output "$RUNNER_TEMP/elastic12a5/transfer-result.json"

      - name: Upload bounded transfer evidence
        uses: actions/upload-artifact@v4
        with:
          name: f-pe-elastic12a5-transfer
          path: ${{ runner.temp }}/elastic12a5/transfer-result.json
