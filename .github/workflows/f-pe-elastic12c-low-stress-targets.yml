name: F-PE-ELASTIC12C low-stress target extraction

concurrency:
  group: f-pe-elastic12c-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic01-soil-storage
    paths:
      - 'research/elastic/extract_bhrgt_low_stress_targets.py'
      - 'docs/performance/evidence/F-PE-ELASTIC12C_FROZEN_CANDIDATES.json'
      - 'docs/performance/F-PE-ELASTIC12C_LOW_STRESS_TARGET_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic12c-low-stress-targets.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen ELASTIC12B source artifact
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12b-low-stress-coverage
          path: ${{ runner.temp }}/elastic12b-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36538267535

      - name: Extract frozen low-stress mechanical targets
        run: |
          mkdir -p "$RUNNER_TEMP/elastic12c"
          python research/elastic/extract_bhrgt_low_stress_targets.py \
            --source "$RUNNER_TEMP/elastic12b-source" \
            --candidates docs/performance/evidence/F-PE-ELASTIC12C_FROZEN_CANDIDATES.json \
            --out "$RUNNER_TEMP/elastic12c"

      - name: Show target summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/elastic12c/summary.json" ]; then
            cat "$RUNNER_TEMP/elastic12c/summary.json"
          fi
          if [ -f "$RUNNER_TEMP/elastic12c/targets.json" ]; then
            cat "$RUNNER_TEMP/elastic12c/targets.json"
          fi

      - name: Upload low-stress target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-pe-elastic12c-low-stress-targets
          path: ${{ runner.temp }}/elastic12c
