name: F-PE-ELASTIC12D frozen low-stress M5 falsification

concurrency:
  group: f-pe-elastic12d-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic01-soil-storage
    paths:
      - 'research/elastic/extract_low_stress_m5_predictors.py'
      - 'research/elastic/evaluate_m5_low_stress_falsification.py'
      - 'docs/performance/F-PE-ELASTIC12D_M5_LOW_STRESS_FALSIFICATION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic12d-m5-falsification.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen ELASTIC12B object authority
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12b-low-stress-coverage
          path: ${{ runner.temp }}/elastic12b-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36538267535

      - name: Download frozen ELASTIC12C target authority
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12c-low-stress-targets
          path: ${{ runner.temp }}/elastic12c-targets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36539242031

      - name: Extract target-blind predictors twice
        run: |
          for rep in 1 2; do
            mkdir -p "$RUNNER_TEMP/elastic12d-predictors-$rep"
            python research/elastic/extract_low_stress_m5_predictors.py \
              --objects "$RUNNER_TEMP/elastic12b-source/objects" \
              --candidates docs/performance/evidence/F-PE-ELASTIC12C_FROZEN_CANDIDATES.json \
              --targets "$RUNNER_TEMP/elastic12c-targets/targets.json" \
              --out "$RUNNER_TEMP/elastic12d-predictors-$rep"
          done
          cmp "$RUNNER_TEMP/elastic12d-predictors-1/predictors.json" \
              "$RUNNER_TEMP/elastic12d-predictors-2/predictors.json"
          cmp "$RUNNER_TEMP/elastic12d-predictors-1/identity_projection.json" \
              "$RUNNER_TEMP/elastic12d-predictors-2/identity_projection.json"
          echo "F_PE_ELASTIC12D_PREDICTOR_DETERMINISM=PASS"

      - name: Evaluate frozen M5 twice
        run: |
          for rep in 1 2; do
            mkdir -p "$RUNNER_TEMP/elastic12d-eval-$rep"
            python research/elastic/evaluate_m5_low_stress_falsification.py \
              --predictors "$RUNNER_TEMP/elastic12d-predictors-1/predictors.json" \
              --targets "$RUNNER_TEMP/elastic12c-targets/targets.json" \
              --out "$RUNNER_TEMP/elastic12d-eval-$rep"
          done
          cmp "$RUNNER_TEMP/elastic12d-eval-1/evaluation.json" \
              "$RUNNER_TEMP/elastic12d-eval-2/evaluation.json"
          cmp "$RUNNER_TEMP/elastic12d-eval-1/summary.json" \
              "$RUNNER_TEMP/elastic12d-eval-2/summary.json"
          echo "F_PE_ELASTIC12D_EVALUATION_DETERMINISM=PASS"

      - name: Show falsification evidence
        run: |
          cat "$RUNNER_TEMP/elastic12d-predictors-1/predictors.json"
          cat "$RUNNER_TEMP/elastic12d-eval-1/evaluation.json"
          cat "$RUNNER_TEMP/elastic12d-eval-1/summary.json"

      - name: Assemble scientific postimage
        run: |
          mkdir -p "$RUNNER_TEMP/elastic12d"
          cp "$RUNNER_TEMP/elastic12d-predictors-1/predictors.json" "$RUNNER_TEMP/elastic12d/"
          cp "$RUNNER_TEMP/elastic12d-predictors-1/identity_projection.json" "$RUNNER_TEMP/elastic12d/"
          cp "$RUNNER_TEMP/elastic12d-eval-1/evaluation.json" "$RUNNER_TEMP/elastic12d/"
          cp "$RUNNER_TEMP/elastic12d-eval-1/summary.json" "$RUNNER_TEMP/elastic12d/"

      - name: Upload falsification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-pe-elastic12d-m5-low-stress
          path: ${{ runner.temp }}/elastic12d
