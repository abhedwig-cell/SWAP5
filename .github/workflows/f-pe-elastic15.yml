name: F-PE-ELASTIC15 explicit prior binding

concurrency:
  group: f-pe-elastic15-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic15-explicit-prior-binding
    paths:
      - 'src/runtime/mod_fmr_elastic_storage_prior_application_binding.f90'
      - 'tests/fpe/test_fpe_elastic15_binding.f90'
      - 'tests/fpe/run_fpe_elastic15.sh'
      - 'docs/performance/F-PE-ELASTIC15_EXPLICIT_PRIOR_BINDING_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic15.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify explicit generated-prior binding
        run: bash tests/fpe/run_fpe_elastic15.sh
