name: F-PE-ELASTIC18 grid normalization

concurrency:
  group: f-pe-elastic18-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic18-grid-normalization
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_swap_grid_normalization.f90'
      - 'tests/fpe/test_fpe_elastic18_grid_normalization.f90'
      - 'tests/fpe/run_fpe_elastic18.sh'
      - 'docs/performance/F-PE-ELASTIC18_GRID_NORMALIZATION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic18.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify SWAP grid normalization
        run: bash tests/fpe/run_fpe_elastic18.sh
