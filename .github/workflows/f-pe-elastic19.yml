name: F-PE-ELASTIC19 horizon descriptors

concurrency:
  group: f-pe-elastic19-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic19-horizon-descriptor-materialization
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_horizon_descriptor_materializer.f90'
      - 'tests/fpe/test_fpe_elastic19_horizon_descriptor.f90'
      - 'tests/fpe/run_fpe_elastic19.sh'
      - 'docs/performance/F-PE-ELASTIC19_HORIZON_DESCRIPTOR_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic19.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify horizon descriptor materialization
        run: bash tests/fpe/run_fpe_elastic19.sh
