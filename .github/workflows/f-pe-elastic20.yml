name: F-PE-ELASTIC20 Staringreeks catalog

concurrency:
  group: f-pe-elastic20-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic20-staringreeks-catalog
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_staringreeks_catalog.f90'
      - 'tests/fpe/test_fpe_elastic20_staringreeks_catalog.f90'
      - 'tests/fpe/run_fpe_elastic20.sh'
      - 'docs/performance/F-PE-ELASTIC20_STARINGREEKS_CATALOG_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic20.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify immutable Staringreeks catalog
        run: bash tests/fpe/run_fpe_elastic20.sh
