name: F-PE-ELASTIC22 explicit BRO profile retrieval

concurrency:
  group: f-pe-elastic22-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic22-current-clean-admission
    paths:
      - 'tools/fpe_elastic22_profile_retrieval.py'
      - 'tests/fpe/run_fpe_elastic22.py'
      - 'tests/fpe/run_fpe_elastic22.sh'
      - 'docs/performance/F-PE-ELASTIC22_PROFILE_RETRIEVAL_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic22.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical

      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic22-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840

      - name: Qualify explicit profile retrieval
        run: bash tests/fpe/run_fpe_elastic22.sh "$RUNNER_TEMP/elastic22-pdok"
