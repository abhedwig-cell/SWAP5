name: F-PE-ELASTIC22 explicit profile source

concurrency:
  group: f-pe-elastic22-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic22-clean-admission
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_explicit_profile_source.f90'
      - 'tests/fpe/test_fpe_elastic22_explicit_profile_source.f90'
      - 'tests/fpe/run_fpe_elastic22.sh'
      - 'docs/performance/F-PE-ELASTIC22_EXPLICIT_PROFILE_SOURCE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic22.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify explicit profile source
        run: bash tests/fpe/run_fpe_elastic22.sh
