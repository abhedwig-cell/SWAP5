name: F-PE-ELASTIC23 maparea profile association

concurrency:
  group: f-pe-elastic23-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic23-maparea-profile-association
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_maparea_profile_association.f90'
      - 'tests/fpe/test_fpe_elastic23_maparea_profile.f90'
      - 'tests/fpe/run_fpe_elastic23.sh'
      - 'docs/performance/F-PE-ELASTIC23_MAPAREA_PROFILE_ASSOCIATION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic23.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify maparea profile association
        run: bash tests/fpe/run_fpe_elastic23.sh
