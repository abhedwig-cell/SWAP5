name: F-PE-ELASTIC24 offline BRO profile retrieval

concurrency:
  group: f-pe-elastic24-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic24-clean-admission
    paths:
      - 'tools/fpe_elastic24_profile_retrieval.py'
      - 'tests/fpe/run_fpe_elastic24.py'
      - 'tests/fpe/run_fpe_elastic24.sh'
      - 'docs/performance/F-PE-ELASTIC24_PROFILE_RETRIEVAL_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic24.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical

      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic24-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840

      - name: Qualify offline profile retrieval
        run: bash tests/fpe/run_fpe_elastic24.sh "$RUNNER_TEMP/elastic24-pdok"
