name: F-PE-ELASTIC25 explicit generated-prior application request

concurrency:
  group: f-pe-elastic25-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic25-current-clean-admission
    paths:
      - 'src/runtime/mod_fmr_elastic_storage_application_config.f90'
      - 'tests/fpe/test_fpe_elastic25_application_request.f90'
      - 'tests/fpe/run_fpe_elastic25.sh'
      - 'docs/performance/F-PE-ELASTIC25_APPLICATION_REQUEST_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic25.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify explicit generated-prior request
        run: bash tests/fpe/run_fpe_elastic25.sh
