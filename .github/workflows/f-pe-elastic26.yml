name: F-PE-ELASTIC26 application request file adapter

concurrency:
  group: f-pe-elastic26-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic26-config-file-adapter
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_application_config_file_adapter.f90'
      - 'tests/fpe/test_fpe_elastic26_config_file_adapter.f90'
      - 'tests/fpe/run_fpe_elastic26.sh'
      - 'docs/performance/F-PE-ELASTIC26_CONFIG_FILE_ADAPTER_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic26.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify bounded config file adapter
        run: bash tests/fpe/run_fpe_elastic26.sh
