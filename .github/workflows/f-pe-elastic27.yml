name: F-PE-ELASTIC27 explicit application request loader

concurrency:
  group: f-pe-elastic27-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic27-application-request-loader
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_application_request_loader.f90'
      - 'tests/fpe/test_fpe_elastic27_application_request_loader.f90'
      - 'tests/fpe/run_fpe_elastic27.sh'
      - 'docs/performance/F-PE-ELASTIC27_APPLICATION_REQUEST_LOADER_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic27.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify explicit request loader
        run: bash tests/fpe/run_fpe_elastic27.sh
