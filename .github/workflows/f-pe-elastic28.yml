name: F-PE-ELASTIC28 request source arbitration

concurrency:
  group: f-pe-elastic28-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic28-request-source-arbitration
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_request_source_arbitration.f90'
      - 'tests/fpe/test_fpe_elastic28_request_source_arbitration.f90'
      - 'tests/fpe/run_fpe_elastic28.sh'
      - 'docs/performance/F-PE-ELASTIC28_REQUEST_SOURCE_ARBITRATION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic28.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify request source arbitration
        run: bash tests/fpe/run_fpe_elastic28.sh
