name: F-PE-ELASTIC29 environment config-path source

concurrency:
  group: f-pe-elastic29-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic29-environment-source
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_environment_source.f90'
      - 'tests/fpe/test_fpe_elastic29_environment_source.f90'
      - 'tests/fpe/run_fpe_elastic29.sh'
      - 'docs/performance/F-PE-ELASTIC29_ENVIRONMENT_SOURCE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic29.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify environment config-path source
        run: bash tests/fpe/run_fpe_elastic29.sh
