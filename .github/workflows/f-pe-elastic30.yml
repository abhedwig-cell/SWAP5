name: F-PE-ELASTIC30 CLI config-path source

concurrency:
  group: f-pe-elastic30-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic30-cli-source
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_cli_source.f90'
      - 'tests/fpe/test_fpe_elastic30_cli_source.f90'
      - 'tests/fpe/run_fpe_elastic30.sh'
      - 'docs/performance/F-PE-ELASTIC30_CLI_SOURCE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic30.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify CLI config-path source
        run: bash tests/fpe/run_fpe_elastic30.sh
