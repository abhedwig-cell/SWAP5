name: F-PE-ELASTIC33 profile row interchange

concurrency:
  group: f-pe-elastic33-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic33-profile-row-interchange
    paths:
      - 'tools/fpe_elastic33_profile_row_interchange.py'
      - 'tests/fpe/run_fpe_elastic33.py'
      - 'tests/fpe/run_fpe_elastic33.sh'
      - 'docs/performance/F-PE-ELASTIC33_PROFILE_ROW_INTERCHANGE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic33.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic33-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Qualify profile-row interchange
        run: bash tests/fpe/run_fpe_elastic33.sh "$RUNNER_TEMP/elastic33-pdok"
