name: F-PE-ELASTIC34 RD point maparea selection

concurrency:
  group: f-pe-elastic34-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic34-rd-point-maparea
    paths:
      - 'tools/fpe_elastic34_rd_point_maparea.py'
      - 'tests/fpe/run_fpe_elastic34.py'
      - 'tests/fpe/run_fpe_elastic34.sh'
      - 'docs/performance/F-PE-ELASTIC34_RD_POINT_MAPAREA_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic34.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic34-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Qualify RD point maparea selection
        run: bash tests/fpe/run_fpe_elastic34.sh "$RUNNER_TEMP/elastic34-pdok"
