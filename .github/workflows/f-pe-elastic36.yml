name: F-PE-ELASTIC36 RD point profile interchange

concurrency:
  group: f-pe-elastic36-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic36-rd-point-profile-interchange
    paths:
      - 'tools/fpe_elastic36_rd_point_profile_interchange.py'
      - 'tests/fpe/run_fpe_elastic36.py'
      - 'tests/fpe/run_fpe_elastic36.sh'
      - 'docs/performance/F-PE-ELASTIC36_RD_POINT_PROFILE_INTERCHANGE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic36.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic36-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Qualify RD point profile interchange
        run: bash tests/fpe/run_fpe_elastic36.sh "$RUNNER_TEMP/elastic36-pdok"
