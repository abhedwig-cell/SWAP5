name: F-PE-ELASTIC37 row to application binding

concurrency:
  group: f-pe-elastic37-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic37-row-to-application-binding
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_row_application_binding.f90'
      - 'tests/fpe/test_fpe_elastic37_row_application_binding.f90'
      - 'tests/fpe/run_fpe_elastic37.sh'
      - 'docs/performance/F-PE-ELASTIC37_ROW_TO_APPLICATION_BINDING_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic37.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify row-to-application binding
        run: bash tests/fpe/run_fpe_elastic37.sh
