name: F-PE-ELASTIC38 CRS capability audit

concurrency:
  group: f-pe-elastic38-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic38-crs-capability-audit
    paths:
      - 'tests/fpe/run_fpe_elastic38_crs_capability.py'
      - 'tests/fpe/run_fpe_elastic38.sh'
      - 'docs/performance/F-PE-ELASTIC38_CRS_CAPABILITY_AUDIT_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic38.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Audit CRS capability
        run: bash tests/fpe/run_fpe_elastic38.sh
