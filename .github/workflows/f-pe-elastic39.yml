name: F-PE-ELASTIC39 PROJ CLI CRS audit

concurrency:
  group: f-pe-elastic39-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic39-proj-cli-audit
    paths:
      - 'tests/fpe/run_fpe_elastic39_proj_cli.py'
      - 'tests/fpe/run_fpe_elastic39.sh'
      - 'docs/performance/F-PE-ELASTIC39_PROJ_CLI_AUDIT_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic39.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Audit PROJ CLI capability
        run: bash tests/fpe/run_fpe_elastic39.sh
