name: F-PE-ELASTIC44 application host binding

concurrency:
  group: f-pe-elastic44-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic44-application-host-binding
    paths:
      - 'src/adapter/mod_fmr_elastic_storage_application_host_binding.f90'
      - 'tests/fpe/test_fpe_elastic44_application_host_binding.f90'
      - 'tests/fpe/run_fpe_elastic44.sh'
      - 'docs/performance/F-PE-ELASTIC44_APPLICATION_HOST_BINDING_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic44.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Qualify application-host binding
        run: bash tests/fpe/run_fpe_elastic44.sh
