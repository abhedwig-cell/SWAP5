name: F-PE-ELASTIC46 production-shaped ELAS characterization

concurrency:
  group: f-pe-elastic46-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic46-production-effect
    paths:
      - 'tests/fpe/prepare_fpe_elastic46.py'
      - 'tests/fpe/run_fpe_elastic46.sh'
      - 'docs/performance/F-PE-ELASTIC46_PRODUCTION_EFFECT_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic46.yml'
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic46-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Characterize ELAS numerical and runtime effect
        run: bash tests/fpe/run_fpe_elastic46.sh "$RUNNER_TEMP/elastic46-pdok"
