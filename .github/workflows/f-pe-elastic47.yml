name: F-PE-ELASTIC47 ELAS timestep interaction

concurrency:
  group: f-pe-elastic47-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic47-timestep-interaction
    paths:
      - 'tests/fpe/prepare_fpe_elastic47.py'
      - 'tests/fpe/run_fpe_elastic47.py'
      - 'tests/fpe/run_fpe_elastic47.sh'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC47_TIMESTEP_INTERACTION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic47.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic47-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run ELAS timestep interaction qualification
        run: bash tests/fpe/run_fpe_elastic47.sh "$RUNNER_TEMP/elastic47-pdok"
