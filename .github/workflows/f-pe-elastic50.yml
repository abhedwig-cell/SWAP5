name: F-PE-ELASTIC50 full-half discrepancy characterization

concurrency:
  group: f-pe-elastic50-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic50-full-half-discrepancy
    paths:
      - 'tests/fpe/prepare_fpe_elastic50.py'
      - 'tests/fpe/run_fpe_elastic50.sh'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC50_FULL_HALF_DISCREPANCY_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic50.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic50-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run full-half discrepancy characterization
        run: bash tests/fpe/run_fpe_elastic50.sh "$RUNNER_TEMP/elastic50-pdok"
