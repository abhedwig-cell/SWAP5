name: F-PE-ELASTIC51 candidate temporal metrics

concurrency:
  group: f-pe-elastic51-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic51-candidate-temporal-metrics
    paths:
      - 'tests/fpe/prepare_fpe_elastic51.py'
      - 'tests/fpe/run_fpe_elastic51.sh'
      - 'tests/fpe/prepare_fpe_elastic50.py'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC51_CANDIDATE_TEMPORAL_METRICS_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic51.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic51-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run candidate temporal metric characterization
        run: bash tests/fpe/run_fpe_elastic51.sh "$RUNNER_TEMP/elastic51-pdok"
