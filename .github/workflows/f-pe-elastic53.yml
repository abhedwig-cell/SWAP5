name: F-PE-ELASTIC53 mode7 defect indicator

concurrency:
  group: f-pe-elastic53-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic53-mode7-defect-indicator
    paths:
      - 'tests/fpe/materialize_fpe_elastic53_mode7_indicator.py'
      - 'tests/fpe/prepare_fpe_elastic53.py'
      - 'tests/fpe/run_fpe_elastic53.sh'
      - 'tests/fpe/prepare_fpe_elastic50.py'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC53_MODE7_DEFECT_INDICATOR_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic53.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic53-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run mode7 defect-indicator qualification
        run: bash tests/fpe/run_fpe_elastic53.sh "$RUNNER_TEMP/elastic53-pdok"
