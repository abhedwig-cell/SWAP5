name: F-PE-ELASTIC55 multi-profile holdout

concurrency:
  group: f-pe-elastic55-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic55-multiprofile-holdout
    paths:
      - 'tests/fpe/prepare_fpe_elastic55.py'
      - 'tests/fpe/run_fpe_elastic55_profile.py'
      - 'tests/fpe/run_fpe_elastic55.sh'
      - 'tests/fpe/prepare_fpe_elastic53.py'
      - 'tests/fpe/materialize_fpe_elastic53_mode7_indicator.py'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC55_MULTIPROFILE_HOLDOUT_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic55.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic55-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run multi-profile holdout
        run: bash tests/fpe/run_fpe_elastic55.sh "$RUNNER_TEMP/elastic55-pdok"
