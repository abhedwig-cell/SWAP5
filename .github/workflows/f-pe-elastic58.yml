name: F-PE-ELASTIC58 independent budget bridge

concurrency:
  group: f-pe-elastic58-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic58-independent-budget-bridge
    paths:
      - 'tests/fpe/materialize_fpe_elastic58_p2e08_indicator.py'
      - 'tests/fpe/run_fpe_elastic58.sh'
      - 'docs/performance/F-PE-ELASTIC58_INDEPENDENT_BUDGET_BRIDGE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic58.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Run independent budget bridge
        run: bash tests/fpe/run_fpe_elastic58.sh
