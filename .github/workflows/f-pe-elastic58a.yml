name: F-PE-ELASTIC58A oracle solvability attribution

concurrency:
  group: f-pe-elastic58a-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic58a-oracle-solvability
    paths:
      - 'tests/fpe/prepare_fpe_elastic58.py'
      - 'tests/fpe/run_fpe_elastic58a_profile.py'
      - 'tests/fpe/run_fpe_elastic58a.sh'
      - 'tests/fpe/prepare_fpe_elastic55.py'
      - 'tests/fpe/materialize_fpe_elastic53_mode7_indicator.py'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC58A_ORACLE_SOLVABILITY_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic58a.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic58a-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run oracle solvability attribution
        run: bash tests/fpe/run_fpe_elastic58a.sh "$RUNNER_TEMP/elastic58a-pdok"
