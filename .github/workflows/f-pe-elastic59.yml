name: F-PE-ELASTIC59 real-history budget bridge

concurrency:
  group: f-pe-elastic59-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic59-real-history-budget-bridge
    paths:
      - 'tests/fpe/materialize_fpe_elastic59_history.py'
      - 'tests/fpe/run_fpe_elastic59.sh'
      - 'docs/performance/F-PE-ELASTIC59_REAL_HISTORY_BUDGET_BRIDGE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic59.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Run real-history budget bridge attribution
        run: bash tests/fpe/run_fpe_elastic59.sh
