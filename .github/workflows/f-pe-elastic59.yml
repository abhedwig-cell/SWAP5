name: F-PE-ELASTIC59 mode7 typed mass publication

concurrency:
  group: f-pe-elastic59-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic59-mode7-typed-mass
    paths:
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'tests/fpe/test_fpe_elastic59_mode7_typed_mass.f90'
      - 'tests/fpe/run_fpe_elastic59.sh'
      - 'docs/performance/F-PE-ELASTIC59_MODE7_TYPED_MASS_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic59.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Run mode7 typed mass qualification
        run: bash tests/fpe/run_fpe_elastic59.sh
