name: F-PE-ELASTIC59 external budget normalization

concurrency:
  group: f-pe-elastic59-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic59-external-budget-normalization
    paths:
      - 'tests/fpe/run_fpe_elastic59_profile.py'
      - 'tests/fpe/run_fpe_elastic59.sh'
      - 'tests/fpe/prepare_fpe_elastic58.py'
      - 'tests/fpe/prepare_fpe_elastic55.py'
      - 'tests/fpe/prepare_fpe_elastic53.py'
      - 'tests/fpe/materialize_fpe_elastic53_mode7_indicator.py'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC59_EXTERNAL_BUDGET_NORMALIZATION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic59.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic59-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run external budget normalization qualification
        run: bash tests/fpe/run_fpe_elastic59.sh "$RUNNER_TEMP/elastic59-pdok"
