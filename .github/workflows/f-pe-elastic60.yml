name: F-PE-ELASTIC60 mode7 indicator admission

concurrency:
  group: f-pe-elastic60-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic60-mode7-indicator-admission
    paths:
      - 'src/solver/mod_reference_richards_temporal_indicator.f90'
      - 'tests/fpe/materialize_fpe_elastic60_mode7_oracle.py'
      - 'tests/fpe/run_fpe_elastic60.sh'
      - 'docs/performance/F-PE-ELASTIC60_MODE7_INDICATOR_ADMISSION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic60.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Run admission qualification
        run: bash tests/fpe/run_fpe_elastic60.sh
