name: F-PE-ELASTIC60 independent-budget C-SAFE compatibility

concurrency:
  group: f-pe-elastic60-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic60-budget-controller-compatibility
    paths:
      - 'tests/fpe/materialize_fpe_elastic53_mode7_indicator.py'
      - 'tests/fpe/materialize_fpe_elastic60_budget_controller.py'
      - 'tests/fpe/run_fpe_elastic60.sh'
      - 'docs/performance/F-PE-ELASTIC60_BUDGET_CONTROLLER_COMPATIBILITY_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic60.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Run independent-budget controller compatibility
        run: bash tests/fpe/run_fpe_elastic60.sh
