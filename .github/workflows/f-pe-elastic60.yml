name: F-PE-ELASTIC60 transaction composition

concurrency:
  group: f-pe-elastic60-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic60-transaction-composition
    paths:
      - 'tests/fpe/prepare_fpe_elastic60.py'
      - 'tests/fpe/run_fpe_elastic60.sh'
      - 'tests/fpe/materialize_fpe_elastic53_mode7_indicator.py'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC60_TRANSACTION_COMPOSITION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic60.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic60-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run transaction composition qualification
        run: bash tests/fpe/run_fpe_elastic60.sh "$RUNNER_TEMP/elastic60-pdok"

# ELASTIC60 qualification trigger
