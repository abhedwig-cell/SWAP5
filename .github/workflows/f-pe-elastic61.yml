name: F-PE-ELASTIC61 direct defect head inf

concurrency:
  group: f-pe-elastic61-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic61-direct-defect-head-inf
    paths:
      - 'tests/fpe/materialize_fpe_elastic61_direct_defect.py'
      - 'tests/fpe/run_fpe_elastic61.sh'
      - 'docs/performance/F-PE-ELASTIC61_DIRECT_DEFECT_HEAD_INF_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic61.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Run direct defect head-inf qualification
        run: bash tests/fpe/run_fpe_elastic61.sh
