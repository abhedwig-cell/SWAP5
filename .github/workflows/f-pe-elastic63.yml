name: F-PE-ELASTIC63 total-floor aggregation

concurrency:
  group: f-pe-elastic63-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic63-total-floor-aggregation
    paths:
      - 'tests/fpe/prepare_fpe_elastic63.py'
      - 'tests/fpe/run_fpe_elastic63.sh'
      - 'tests/fpe/prepare_fpe_elastic55.py'
      - 'tests/fpe/materialize_fpe_elastic53_mode7_indicator.py'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC63_TOTAL_FLOOR_AGGREGATION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic63.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic63-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run total-floor aggregation study
        run: bash tests/fpe/run_fpe_elastic63.sh "$RUNNER_TEMP/elastic63-pdok"
