name: F-PE-ELASTIC65 mode7 C-SAFE binding

concurrency:
  group: f-pe-elastic65-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic65-mode7-csafe-binding
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpe/test_fpe_elastic65_mode7_csafe_binding.f90'
      - 'tests/fpe/run_fpe_elastic65.sh'
      - 'docs/performance/F-PE-ELASTIC65_MODE7_CSAFE_BINDING_PREREGISTRATION.md'
      - 'docs/performance/F-PE-ELASTIC65_RESULT.md'
      - '.github/workflows/f-pe-elastic65.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpe/test_fpe_elastic65_mode7_csafe_binding.f90'
      - 'tests/fpe/run_fpe_elastic65.sh'
      - 'docs/performance/F-PE-ELASTIC65_MODE7_CSAFE_BINDING_PREREGISTRATION.md'
      - 'docs/performance/F-PE-ELASTIC65_RESULT.md'
      - '.github/workflows/f-pe-elastic65.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Run ELASTIC65 qualification
        run: bash tests/fpe/run_fpe_elastic65.sh
