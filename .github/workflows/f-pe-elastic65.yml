name: F-PE-ELASTIC65 mode7 C-SAFE binding

concurrency:
  group: f-pe-elastic65-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/f-pe-elastic65-mode7-csafe-binding
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpe/test_fpe_elastic65_mode7_csafe_binding.f90'
      - 'tests/fpe/run_fpe_elastic65.sh'
      - 'docs/performance/F-PE-ELASTIC65_MODE7_CSAFE_BINDING_PREREGISTRATION.md'
      - 'docs/performance/F-PE-ELASTIC65_RESULT.md'
      - 'tests/fkt/run_fkt22_fmr_compile_gate.sh'
      - 'tests/fkt/run_fkt22_fmr_runtime_gate.sh'
      - 'tests/fkt/run_fkt22_eb_i25_preservation_gate.sh'
      - 'tests/fpe/run_fpe_elastic65_ebi25_differential.sh'
      - 'tests/fpe/run_fpe_elastic65_p2e05_differential.sh'
      - 'docs/performance/F-PE-ELASTIC65_EBI25_ADMISSION_RECONCILIATION.md'
      - 'docs/performance/F-PE-ELASTIC65_P2E05_ADMISSION_RECONCILIATION.md'
      - 'tests/ross/run_ross12_serialized_production_wiring.sh'
      - '.github/workflows/f-pe-elastic65.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpe/test_fpe_elastic65_mode7_csafe_binding.f90'
      - 'tests/fpe/run_fpe_elastic65.sh'
      - 'docs/performance/F-PE-ELASTIC65_MODE7_CSAFE_BINDING_PREREGISTRATION.md'
      - 'docs/performance/F-PE-ELASTIC65_RESULT.md'
      - 'tests/fkt/run_fkt22_fmr_compile_gate.sh'
      - 'tests/fkt/run_fkt22_fmr_runtime_gate.sh'
      - 'tests/fkt/run_fkt22_eb_i25_preservation_gate.sh'
      - 'tests/fpe/run_fpe_elastic65_p2e05_differential.sh'
      - 'docs/performance/F-PE-ELASTIC65_P2E05_ADMISSION_RECONCILIATION.md'
      - 'tests/ross/run_ross12_serialized_production_wiring.sh'
      - '.github/workflows/f-pe-elastic65.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Run ELASTIC65 qualification
        run: bash tests/fpe/run_fpe_elastic65.sh
      - name: Preserve F-KT22 serialized compile closure
        run: bash tests/fkt/run_fkt22_fmr_compile_gate.sh
      - name: Preserve F-KT22 serialized runtime closure
        run: bash tests/fkt/run_fkt22_fmr_runtime_gate.sh
      - name: Reconcile EB-I25 current-canonical baseline
        run: bash tests/fpe/run_fpe_elastic65_ebi25_differential.sh
      - name: Reconcile P2E05 current-canonical baseline
        run: bash tests/fpe/run_fpe_elastic65_p2e05_differential.sh
