name: F-PE-ELASTIC66 no-pair oracle attribution

on:
  push:
    branches:
      - research/f-pe-elastic66-no-pair-oracle-attribution
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen BRO artifact
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic66-pdok
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
          github-token: ${{ github.token }}
      - name: Run attribution
        run: bash tests/fpe/run_fpe_elastic66.sh "$RUNNER_TEMP/elastic66-pdok"
