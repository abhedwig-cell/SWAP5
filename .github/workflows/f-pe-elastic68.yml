name: F-PE-ELASTIC68 practical mode7 budget scan

concurrency:
  group: f-pe-elastic68-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic68-practical-budget-scan
    paths:
      - 'tests/fpe/run_fpe_elastic68_profile.py'
      - 'tests/fpe/run_fpe_elastic68.sh'
      - 'tests/fpe/prepare_fpe_elastic55.py'
      - 'tests/fpe/prepare_fpe_elastic53.py'
      - 'tests/fpe/materialize_fpe_elastic53_mode7_indicator.py'
      - 'tests/fpe/materialize_fpe_elastic46_headcalc_stubs.py'
      - 'docs/performance/F-PE-ELASTIC68_PRACTICAL_BUDGET_SCAN_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic68.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic68-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run practical mode7 budget scan
        run: bash tests/fpe/run_fpe_elastic68.sh "$RUNNER_TEMP/elastic68-pdok"
