name: F-PE-ELASTIC71 population MultiSWAP performance

concurrency:
  group: f-pe-elastic71-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-elastic71-population-multiswap-performance
    paths:
      - 'tests/fpe/prepare_fpe_elastic71_population.py'
      - 'tests/fpe/materialize_fpe_elastic71_headcalc_stubs.py'
      - 'tests/fpe/test_fpe_elastic71_population_profile.f90'
      - 'tests/fpe/run_fpe_elastic71_population.py'
      - 'tests/fpe/run_fpe_elastic71.sh'
      - 'docs/performance/F-PE-ELASTIC71_POPULATION_MULTISWAP_PERFORMANCE_PREREGISTRATION.md'
      - '.github/workflows/f-pe-elastic71.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/elastic71-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run population benchmark
        run: bash tests/fpe/run_fpe_elastic71.sh "$RUNNER_TEMP/elastic71-pdok"
