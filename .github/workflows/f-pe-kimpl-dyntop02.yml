name: F-PE-KIMPL-DYNTOP02 MAXIT sensitivity

on:
  push:
    branches:
      - work/f-pe-kimpl-dyntop02-maxit-sensitivity
    paths:
      - 'docs/performance/F-PE-KIMPL-DYNTOP02_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_kimpl_dyntop02_maxit.f90'
      - 'tests/fpe/run_fpe_kimpl_dyntop02.py'
      - 'tests/fpe/run_fpe_kimpl_dyntop02.sh'
      - '.github/workflows/f-pe-kimpl-dyntop02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maxit-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run MAXIT sensitivity
        run: bash tests/fpe/run_fpe_kimpl_dyntop02.sh
