name: F-PE-MIQUAL03 fixed-flux forcing diversity

on:
  push:
    branches:
      - research/f-pe-miqual03-fixed-flux-forcing-diversity
    paths:
      - 'docs/performance/F-PE-MIQUAL03_PREREGISTRATION.md'
      - 'tests/fpe/materialize_fpe_miqual03_forcing.py'
      - 'tests/fpe/run_fpe_miqual03.py'
      - 'tests/fpe/run_fpe_miqual03.sh'
      - '.github/workflows/f-pe-miqual03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_miqual03.sh
