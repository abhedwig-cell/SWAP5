name: F-PE-MIQUAL05 dynamic-top event-window qualification

on:
  push:
    branches:
      - research/f-pe-miqual05-dynamic-top-event-window
    paths:
      - 'docs/performance/F-PE-MIQUAL05_PREREGISTRATION.md'
      - 'tests/fpe/materialize_fpe_miqual05_window.py'
      - 'tests/fpe/run_fpe_miqual05.py'
      - 'tests/fpe/run_fpe_miqual05.sh'
      - '.github/workflows/f-pe-miqual05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_miqual05.sh
