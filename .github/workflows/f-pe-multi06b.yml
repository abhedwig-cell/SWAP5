name: F-PE-MULTI06B population in-process scaling

concurrency:
  group: f-pe-multi06b-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-multi06b-population-inprocess-scaling
    paths:
      - 'tests/fpe/prepare_fpe_multi06b_population.py'
      - 'tests/fpe/materialize_fpe_multi06b_headcalc_stubs.py'
      - 'tests/fpe/test_fpe_multi06b_population_profile.f90'
      - 'tests/fpe/run_fpe_multi06b_population_inprocess.sh'
      - 'docs/performance/F-PE-MULTI06B_POPULATION_INPROCESS_SCALING_PREREGISTRATION.md'
      - '.github/workflows/f-pe-multi06b.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/multi06b-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run in-process population scaling
        run: bash tests/fpe/run_fpe_multi06b_population_inprocess.sh "$RUNNER_TEMP/multi06b-pdok"
