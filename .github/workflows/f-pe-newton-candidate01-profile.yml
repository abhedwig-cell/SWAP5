name: F-PE-NEWTON-CANDIDATE01 easy-hard profile

on:
  pull_request:
    paths:
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'src/solver/**'
      - 'tests/fpe/test_fpe_newton_candidate01_profile.f90'
      - 'tests/fpe/run_fpe_newton_candidate01_profile.sh'
      - 'docs/performance/F-PE-NEWTON-CANDIDATE01_PREREGISTRATION.md'
      - '.github/workflows/f-pe-newton-candidate01-profile.yml'
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tool identity
        run: |
          gfortran --version
          gprof --version
      - name: Profile easy and hard frozen cases
        run: |
          bash tests/fpe/run_fpe_newton_candidate01_profile.sh | tee newton-candidate01-profile.txt
          grep -Fq 'NEWTON_CANDIDATE01_PROFILE=PASS' newton-candidate01-profile.txt
      - uses: actions/upload-artifact@v4
        with:
          name: newton-candidate01-profile
          path: |
            newton-candidate01-profile.txt
            ${{ runner.temp }}/swap5-newton-candidate01-*/easy.gprof.txt
            ${{ runner.temp }}/swap5-newton-candidate01-*/hard.gprof.txt
