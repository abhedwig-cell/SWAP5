name: F-PE-NLGLOB01 state-scaling attribution

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB01*.md'
      - 'tests/fpe/materialize_fpe_nlglob01*.py'
      - 'tests/fpe/run_fpe_nlglob01*.py'
      - 'tests/fpe/run_fpe_nlglob01*.sh'
      - '.github/workflows/f-pe-nlglob01.yml'
  push:
    branches:
      - research/f-pe-nlglob01-state-scaling
    paths:
      - 'docs/performance/F-PE-NLGLOB01*.md'
      - 'tests/fpe/materialize_fpe_nlglob01*.py'
      - 'tests/fpe/run_fpe_nlglob01*.py'
      - 'tests/fpe/run_fpe_nlglob01*.sh'
      - '.github/workflows/f-pe-nlglob01.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob01-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  state-scaling-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run NLGLOB01 state-scaling attribution
        run: bash tests/fpe/run_fpe_nlglob01.sh
