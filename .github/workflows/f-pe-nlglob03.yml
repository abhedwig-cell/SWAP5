name: F-PE-NLGLOB03 floor-aware convergence attribution

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB03*.md'
      - 'tests/fpe/materialize_fpe_nlglob03*.py'
      - 'tests/fpe/run_fpe_nlglob03*.py'
      - 'tests/fpe/run_fpe_nlglob03*.sh'
      - '.github/workflows/f-pe-nlglob03.yml'
  push:
    branches:
      - research/f-pe-nlglob03-floor-aware-convergence
    paths:
      - 'docs/performance/F-PE-NLGLOB03*.md'
      - 'tests/fpe/materialize_fpe_nlglob03*.py'
      - 'tests/fpe/run_fpe_nlglob03*.py'
      - 'tests/fpe/run_fpe_nlglob03*.sh'
      - '.github/workflows/f-pe-nlglob03.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob03-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  residual-floor-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run NLGLOB03 residual-floor attribution
        run: bash tests/fpe/run_fpe_nlglob03.sh
