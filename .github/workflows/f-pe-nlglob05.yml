name: F-PE-NLGLOB05 strict floor certificate

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB05*.md'
      - 'tests/fpe/run_fpe_nlglob05.py'
      - 'tests/fpe/run_fpe_nlglob05.sh'
      - '.github/workflows/f-pe-nlglob05.yml'
  push:
    branches:
      - research/f-pe-nlglob05-floor-certificate
    paths:
      - 'docs/performance/F-PE-NLGLOB05*.md'
      - 'tests/fpe/run_fpe_nlglob05.py'
      - 'tests/fpe/run_fpe_nlglob05.sh'
      - '.github/workflows/f-pe-nlglob05.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob05-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-c0-discrimination:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered strict C0 discrimination
        run: bash tests/fpe/run_fpe_nlglob05.sh
