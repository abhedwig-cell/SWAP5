name: F-PE-NLGLOB05A floor-aware convergence certificate

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB05A*.md'
      - 'tests/fpe/materialize_fpe_nlglob05*.py'
      - 'tests/fpe/run_fpe_nlglob05a*.py'
      - 'tests/fpe/run_fpe_nlglob05a*.sh'
      - '.github/workflows/f-pe-nlglob05a.yml'
  push:
    branches:
      - research/f-pe-nlglob05-floor-certificate
    paths:
      - 'docs/performance/F-PE-NLGLOB05A*.md'
      - 'tests/fpe/materialize_fpe_nlglob05*.py'
      - 'tests/fpe/run_fpe_nlglob05a*.py'
      - 'tests/fpe/run_fpe_nlglob05a*.sh'
      - '.github/workflows/f-pe-nlglob05a.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob05a-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certificate-discrimination:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run NLGLOB05A certificate discrimination
        run: bash tests/fpe/run_fpe_nlglob05a.sh
