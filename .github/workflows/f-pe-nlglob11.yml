name: F-PE-NLGLOB11 TG saturated coefficient stage

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB11*.md'
      - 'tests/fpe/materialize_fpe_nlglob11*.py'
      - 'tests/fpe/run_fpe_nlglob11*.py'
      - 'tests/fpe/run_fpe_nlglob11*.sh'
      - '.github/workflows/f-pe-nlglob11.yml'
  push:
    branches:
      - research/f-pe-nlglob11-tg-predictor-admissibility
    paths:
      - 'docs/performance/F-PE-NLGLOB11*.md'
      - 'tests/fpe/materialize_fpe_nlglob11*.py'
      - 'tests/fpe/run_fpe_nlglob11*.py'
      - 'tests/fpe/run_fpe_nlglob11*.sh'
      - '.github/workflows/f-pe-nlglob11.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob11-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tg-saturation-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run saturated-stage qualification
        run: bash tests/fpe/run_fpe_nlglob11.sh
