name: F-PE-NLGLOB11A head-space TG predictor

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB11A*.md'
      - 'tests/fpe/materialize_fpe_nlglob11a*.py'
      - 'tests/fpe/run_fpe_nlglob11a*.py'
      - 'tests/fpe/run_fpe_nlglob11a*.sh'
      - '.github/workflows/f-pe-nlglob11a.yml'
  push:
    branches:
      - research/f-pe-nlglob11a-headspace-predictor
    paths:
      - 'docs/performance/F-PE-NLGLOB11A*.md'
      - 'tests/fpe/materialize_fpe_nlglob11a*.py'
      - 'tests/fpe/run_fpe_nlglob11a*.py'
      - 'tests/fpe/run_fpe_nlglob11a*.sh'
      - '.github/workflows/f-pe-nlglob11a.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob11a-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  headspace-predictor-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered head-space predictor qualification
        run: bash tests/fpe/run_fpe_nlglob11a.sh
