name: F-PE-NLGLOB12 above-floor endpoint attribution

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB12*.md'
      - 'tests/fpe/run_fpe_nlglob12*.py'
      - 'tests/fpe/run_fpe_nlglob12*.sh'
      - '.github/workflows/f-pe-nlglob12.yml'
  push:
    branches:
      - research/f-pe-nlglob12-above-floor-endpoint
    paths:
      - 'docs/performance/F-PE-NLGLOB12*.md'
      - 'tests/fpe/run_fpe_nlglob12*.py'
      - 'tests/fpe/run_fpe_nlglob12*.sh'
      - '.github/workflows/f-pe-nlglob12.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob12-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  above-floor-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered above-floor attribution
        run: bash tests/fpe/run_fpe_nlglob12.sh
