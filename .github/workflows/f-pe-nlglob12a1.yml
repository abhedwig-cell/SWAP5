name: F-PE-NLGLOB12A1 representation-aware replay

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB12A1*.md'
      - 'tests/fpe/materialize_fpe_nlglob12a1*.py'
      - 'tests/fpe/run_fpe_nlglob12a1*.py'
      - 'tests/fpe/run_fpe_nlglob12a1*.sh'
      - '.github/workflows/f-pe-nlglob12a1.yml'
  push:
    branches:
      - research/f-pe-nlglob12a1-representation-certificate
    paths:
      - 'docs/performance/F-PE-NLGLOB12A1*.md'
      - 'tests/fpe/materialize_fpe_nlglob12a1*.py'
      - 'tests/fpe/run_fpe_nlglob12a1*.py'
      - 'tests/fpe/run_fpe_nlglob12a1*.sh'
      - '.github/workflows/f-pe-nlglob12a1.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob12a1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  representation-aware-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run representation-aware endpoint replay
        run: bash tests/fpe/run_fpe_nlglob12a1.sh
