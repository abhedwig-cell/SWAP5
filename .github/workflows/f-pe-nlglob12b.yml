name: F-PE-NLGLOB12B bounded extra-iteration falsification

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB12B*.md'
      - 'tests/fpe/materialize_fpe_nlglob12b*.py'
      - 'tests/fpe/run_fpe_nlglob12b*.py'
      - 'tests/fpe/run_fpe_nlglob12b*.sh'
      - '.github/workflows/f-pe-nlglob12b.yml'
  push:
    branches:
      - research/f-pe-nlglob12b-extra-iteration-falsification
    paths:
      - 'docs/performance/F-PE-NLGLOB12B*.md'
      - 'tests/fpe/materialize_fpe_nlglob12b*.py'
      - 'tests/fpe/run_fpe_nlglob12b*.py'
      - 'tests/fpe/run_fpe_nlglob12b*.sh'
      - '.github/workflows/f-pe-nlglob12b.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob12b-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extra-iteration-falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered MAXIT16 falsification
        run: bash tests/fpe/run_fpe_nlglob12b.sh
