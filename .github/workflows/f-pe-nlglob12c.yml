name: F-PE-NLGLOB12C representation-aware endpoint replay

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB12C*.md'
      - 'tests/fpe/materialize_fpe_nlglob12c*.py'
      - 'tests/fpe/run_fpe_nlglob12c*.py'
      - 'tests/fpe/run_fpe_nlglob12c*.sh'
      - '.github/workflows/f-pe-nlglob12c.yml'
  push:
    branches:
      - research/f-pe-nlglob12c-representation-replay
    paths:
      - 'docs/performance/F-PE-NLGLOB12C*.md'
      - 'tests/fpe/materialize_fpe_nlglob12c*.py'
      - 'tests/fpe/run_fpe_nlglob12c*.py'
      - 'tests/fpe/run_fpe_nlglob12c*.sh'
      - '.github/workflows/f-pe-nlglob12c.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob12c-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  representation-aware-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered representation-aware replay
        run: bash tests/fpe/run_fpe_nlglob12c.sh
