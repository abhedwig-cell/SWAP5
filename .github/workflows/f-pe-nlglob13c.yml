name: F-PE-NLGLOB13C overshoot scaling

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB13C*.md'
      - 'tests/fpe/materialize_fpe_nlglob13c*.py'
      - 'tests/fpe/run_fpe_nlglob13c*.py'
      - 'tests/fpe/run_fpe_nlglob13c*.sh'
      - '.github/workflows/f-pe-nlglob13c.yml'
  push:
    branches:
      - research/f-pe-nlglob13c-overshoot-scaling
    paths:
      - 'docs/performance/F-PE-NLGLOB13C*.md'
      - 'tests/fpe/materialize_fpe_nlglob13c*.py'
      - 'tests/fpe/run_fpe_nlglob13c*.py'
      - 'tests/fpe/run_fpe_nlglob13c*.sh'
      - '.github/workflows/f-pe-nlglob13c.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob13c-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overshoot-scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered overshoot-scaling attribution
        run: bash tests/fpe/run_fpe_nlglob13c.sh
