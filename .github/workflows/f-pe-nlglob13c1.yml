name: F-PE-NLGLOB13C1 pre-state identity

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB13C1*.md'
      - 'tests/fpe/materialize_fpe_nlglob13c1*.py'
      - 'tests/fpe/run_fpe_nlglob13c1*.py'
      - 'tests/fpe/run_fpe_nlglob13c1*.sh'
      - '.github/workflows/f-pe-nlglob13c1.yml'
  push:
    branches:
      - research/f-pe-nlglob13c1-prestate-identity
    paths:
      - 'docs/performance/F-PE-NLGLOB13C1*.md'
      - 'tests/fpe/materialize_fpe_nlglob13c1*.py'
      - 'tests/fpe/run_fpe_nlglob13c1*.py'
      - 'tests/fpe/run_fpe_nlglob13c1*.sh'
      - '.github/workflows/f-pe-nlglob13c1.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob13c1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prestate-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered pre-state identity reconciliation
        run: bash tests/fpe/run_fpe_nlglob13c1.sh
