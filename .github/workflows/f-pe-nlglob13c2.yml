name: F-PE-NLGLOB13C2 same-origin h4 admissibility

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB13C2*.md'
      - 'tests/fpe/materialize_fpe_nlglob13c2*.py'
      - 'tests/fpe/run_fpe_nlglob13c2*.py'
      - 'tests/fpe/run_fpe_nlglob13c2*.sh'
      - '.github/workflows/f-pe-nlglob13c2.yml'
  push:
    branches:
      - research/f-pe-nlglob13c2-same-origin-quarter
    paths:
      - 'docs/performance/F-PE-NLGLOB13C2*.md'
      - 'tests/fpe/materialize_fpe_nlglob13c2*.py'
      - 'tests/fpe/run_fpe_nlglob13c2*.py'
      - 'tests/fpe/run_fpe_nlglob13c2*.sh'
      - '.github/workflows/f-pe-nlglob13c2.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob13c2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  same-origin-h4-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered same-origin h4 probe
        run: bash tests/fpe/run_fpe_nlglob13c2.sh
