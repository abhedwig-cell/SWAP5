name: F-PE-NLGLOB14 saturation event localization

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14*.md'
      - 'tests/fpe/materialize_fpe_nlglob14*.py'
      - 'tests/fpe/run_fpe_nlglob14*.py'
      - 'tests/fpe/run_fpe_nlglob14*.sh'
      - '.github/workflows/f-pe-nlglob14.yml'
  push:
    branches:
      - research/f-pe-nlglob14-saturation-event
    paths:
      - 'docs/performance/F-PE-NLGLOB14*.md'
      - 'tests/fpe/materialize_fpe_nlglob14*.py'
      - 'tests/fpe/run_fpe_nlglob14*.py'
      - 'tests/fpe/run_fpe_nlglob14*.sh'
      - '.github/workflows/f-pe-nlglob14.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  saturation-event-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered saturation-event localization
        run: bash tests/fpe/run_fpe_nlglob14.sh
