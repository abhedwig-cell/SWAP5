name: F-PE-NLGLOB14A saturation root localization

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14A*.md'
      - 'tests/fpe/materialize_fpe_nlglob14a*.py'
      - 'tests/fpe/run_fpe_nlglob14a*.py'
      - 'tests/fpe/run_fpe_nlglob14a*.sh'
      - '.github/workflows/f-pe-nlglob14a.yml'
  push:
    branches:
      - research/f-pe-nlglob14a-saturation-root
    paths:
      - 'docs/performance/F-PE-NLGLOB14A*.md'
      - 'tests/fpe/materialize_fpe_nlglob14a*.py'
      - 'tests/fpe/run_fpe_nlglob14a*.py'
      - 'tests/fpe/run_fpe_nlglob14a*.sh'
      - '.github/workflows/f-pe-nlglob14a.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14a-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  saturation-root-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered saturation root localization
        run: bash tests/fpe/run_fpe_nlglob14a.sh
