name: F-PE-NLGLOB14B conservative saturation event split

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14B*.md'
      - 'tests/fpe/materialize_fpe_nlglob14b*.py'
      - 'tests/fpe/run_fpe_nlglob14b*.py'
      - 'tests/fpe/run_fpe_nlglob14b*.sh'
      - '.github/workflows/f-pe-nlglob14b.yml'
  push:
    branches:
      - research/f-pe-nlglob14b-event-split
    paths:
      - 'docs/performance/F-PE-NLGLOB14B*.md'
      - 'tests/fpe/materialize_fpe_nlglob14b*.py'
      - 'tests/fpe/run_fpe_nlglob14b*.py'
      - 'tests/fpe/run_fpe_nlglob14b*.sh'
      - '.github/workflows/f-pe-nlglob14b.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14b-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conservative-event-split:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered conservative event split
        run: bash tests/fpe/run_fpe_nlglob14b.sh
