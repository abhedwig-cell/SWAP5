name: F-PE-NLGLOB14C saturated remainder regime switch

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14C*.md'
      - 'tests/fpe/materialize_fpe_nlglob14c*.py'
      - 'tests/fpe/run_fpe_nlglob14c*.py'
      - 'tests/fpe/run_fpe_nlglob14c*.sh'
      - '.github/workflows/f-pe-nlglob14c.yml'
  push:
    branches:
      - research/f-pe-nlglob14c-saturated-remainder
    paths:
      - 'docs/performance/F-PE-NLGLOB14C*.md'
      - 'tests/fpe/materialize_fpe_nlglob14c*.py'
      - 'tests/fpe/run_fpe_nlglob14c*.py'
      - 'tests/fpe/run_fpe_nlglob14c*.sh'
      - '.github/workflows/f-pe-nlglob14c.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14c-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  saturated-remainder-regime-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered saturated-remainder regime switch
        run: bash tests/fpe/run_fpe_nlglob14c.sh
