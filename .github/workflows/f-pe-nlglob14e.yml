name: F-PE-NLGLOB14E full dynamic-top policy

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14E*.md'
      - 'tests/fpe/run_fpe_nlglob14e*.py'
      - 'tests/fpe/run_fpe_nlglob14e*.sh'
      - '.github/workflows/f-pe-nlglob14e.yml'
  push:
    branches:
      - research/f-pe-nlglob14e-full-dynamic-policy
    paths:
      - 'docs/performance/F-PE-NLGLOB14E*.md'
      - 'tests/fpe/run_fpe_nlglob14e*.py'
      - 'tests/fpe/run_fpe_nlglob14e*.sh'
      - '.github/workflows/f-pe-nlglob14e.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-dynamic-policy-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered full dynamic-top policy qualification
        run: bash tests/fpe/run_fpe_nlglob14e.sh
