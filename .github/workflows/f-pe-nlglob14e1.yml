name: F-PE-NLGLOB14E1 root observability correction

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14E1*.md'
      - 'tests/fpe/materialize_fpe_nlglob14e1*.py'
      - 'tests/fpe/run_fpe_nlglob14e1*.py'
      - 'tests/fpe/run_fpe_nlglob14e1*.sh'
      - '.github/workflows/f-pe-nlglob14e1.yml'
  push:
    branches:
      - research/f-pe-nlglob14e1-root-observability
    paths:
      - 'docs/performance/F-PE-NLGLOB14E1*.md'
      - 'tests/fpe/materialize_fpe_nlglob14e1*.py'
      - 'tests/fpe/run_fpe_nlglob14e1*.py'
      - 'tests/fpe/run_fpe_nlglob14e1*.sh'
      - '.github/workflows/f-pe-nlglob14e1.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14e1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corrected-root-observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run corrected full-bank observability qualification
        run: bash tests/fpe/run_fpe_nlglob14e1.sh
