name: F-PE-NLGLOB14F desaturation attribution

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14F*.md'
      - 'tests/fpe/materialize_fpe_nlglob14f*.py'
      - 'tests/fpe/run_fpe_nlglob14f*.py'
      - 'tests/fpe/run_fpe_nlglob14f*.sh'
      - '.github/workflows/f-pe-nlglob14f.yml'
  push:
    branches:
      - research/f-pe-nlglob14f-desaturation-attribution
    paths:
      - 'docs/performance/F-PE-NLGLOB14F*.md'
      - 'tests/fpe/materialize_fpe_nlglob14f*.py'
      - 'tests/fpe/run_fpe_nlglob14f*.py'
      - 'tests/fpe/run_fpe_nlglob14f*.sh'
      - '.github/workflows/f-pe-nlglob14f.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14f-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desaturation-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered desaturation attribution
        run: bash tests/fpe/run_fpe_nlglob14f.sh
