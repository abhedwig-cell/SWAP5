name: F-PE-NLGLOB14G forcing reversal desaturation

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14G*.md'
      - 'tests/fpe/materialize_fpe_nlglob14g*.py'
      - 'tests/fpe/run_fpe_nlglob14g*.py'
      - 'tests/fpe/run_fpe_nlglob14g*.sh'
      - '.github/workflows/f-pe-nlglob14g.yml'
  push:
    branches:
      - research/f-pe-nlglob14g-forcing-reversal
    paths:
      - 'docs/performance/F-PE-NLGLOB14G*.md'
      - 'tests/fpe/materialize_fpe_nlglob14g*.py'
      - 'tests/fpe/run_fpe_nlglob14g*.py'
      - 'tests/fpe/run_fpe_nlglob14g*.sh'
      - '.github/workflows/f-pe-nlglob14g.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14g-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forcing-reversal-release-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered forcing-reversal attribution
        run: bash tests/fpe/run_fpe_nlglob14g.sh
