name: F-PE-NLGLOB14H dry manifold drift

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14H*.md'
      - 'tests/fpe/run_fpe_nlglob14h*.py'
      - 'tests/fpe/run_fpe_nlglob14h*.sh'
      - '.github/workflows/f-pe-nlglob14h.yml'
  push:
    branches:
      - research/f-pe-nlglob14h-dry-manifold-drift
    paths:
      - 'docs/performance/F-PE-NLGLOB14H*.md'
      - 'tests/fpe/run_fpe_nlglob14h*.py'
      - 'tests/fpe/run_fpe_nlglob14h*.sh'
      - '.github/workflows/f-pe-nlglob14h.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14h-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-manifold-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered dry-manifold drift attribution
        run: bash tests/fpe/run_fpe_nlglob14h.sh
