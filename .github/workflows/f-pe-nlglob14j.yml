name: F-PE-NLGLOB14J lower-block redistribution attribution

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14J*.md'
      - 'tests/fpe/run_fpe_nlglob14j*.py'
      - 'tests/fpe/run_fpe_nlglob14j*.sh'
      - '.github/workflows/f-pe-nlglob14j.yml'
  push:
    branches:
      - research/f-pe-nlglob14j-block-redistribution-r2
    paths:
      - 'docs/performance/F-PE-NLGLOB14J*.md'
      - 'tests/fpe/run_fpe_nlglob14j*.py'
      - 'tests/fpe/run_fpe_nlglob14j*.sh'
      - '.github/workflows/f-pe-nlglob14j.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14j-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block-redistribution-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered redistribution attribution
        run: bash tests/fpe/run_fpe_nlglob14j.sh
