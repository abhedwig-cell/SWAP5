name: F-PE-NLGLOB14K mixed-profile mode ownership

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14K*.md'
      - 'tests/fpe/run_fpe_nlglob14k*.py'
      - 'tests/fpe/run_fpe_nlglob14k*.sh'
      - '.github/workflows/f-pe-nlglob14k.yml'
  push:
    branches:
      - research/f-pe-nlglob14k-mixed-profile-mode-ownership
    paths:
      - 'docs/performance/F-PE-NLGLOB14K*.md'
      - 'tests/fpe/run_fpe_nlglob14k*.py'
      - 'tests/fpe/run_fpe_nlglob14k*.sh'
      - '.github/workflows/f-pe-nlglob14k.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14k-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mixed-profile-mode-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered mixed-profile ownership attribution
        run: bash tests/fpe/run_fpe_nlglob14k.sh
