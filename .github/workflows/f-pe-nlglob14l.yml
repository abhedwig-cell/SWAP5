name: F-PE-NLGLOB14L extended dry horizon

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14L*.md'
      - 'tests/fpe/run_fpe_nlglob14l*.py'
      - 'tests/fpe/run_fpe_nlglob14l*.sh'
      - '.github/workflows/f-pe-nlglob14l.yml'
  push:
    branches:
      - research/f-pe-nlglob14l-extended-dry-horizon
    paths:
      - 'docs/performance/F-PE-NLGLOB14L*.md'
      - 'tests/fpe/run_fpe_nlglob14l*.py'
      - 'tests/fpe/run_fpe_nlglob14l*.sh'
      - '.github/workflows/f-pe-nlglob14l.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14l-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extended-dry-horizon:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered extended dry-horizon attribution
        run: bash tests/fpe/run_fpe_nlglob14l.sh
