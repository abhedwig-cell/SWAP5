name: F-PE-NLGLOB14N refined retreat convergence

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14N*.md'
      - 'tests/fpe/run_fpe_nlglob14n*.py'
      - 'tests/fpe/run_fpe_nlglob14n*.sh'
      - '.github/workflows/f-pe-nlglob14n.yml'
  push:
    branches:
      - research/f-pe-nlglob14n-refined-retreat-convergence-r2
    paths:
      - 'docs/performance/F-PE-NLGLOB14N*.md'
      - 'tests/fpe/run_fpe_nlglob14n*.py'
      - 'tests/fpe/run_fpe_nlglob14n*.sh'
      - '.github/workflows/f-pe-nlglob14n.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14n-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refined-retreat-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered refined retreat convergence
        run: bash tests/fpe/run_fpe_nlglob14n.sh
