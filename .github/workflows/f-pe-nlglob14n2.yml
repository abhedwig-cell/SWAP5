name: F-PE-NLGLOB14N2 root-trial solver decomposition

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14N2*.md'
      - 'tests/fpe/materialize_fpe_nlglob14n2*.py'
      - 'tests/fpe/run_fpe_nlglob14n2*.py'
      - 'tests/fpe/run_fpe_nlglob14n2*.sh'
      - '.github/workflows/f-pe-nlglob14n2.yml'
  push:
    branches:
      - research/f-pe-nlglob14n2-root-trial-solver-decomposition
    paths:
      - 'docs/performance/F-PE-NLGLOB14N2*.md'
      - 'tests/fpe/materialize_fpe_nlglob14n2*.py'
      - 'tests/fpe/run_fpe_nlglob14n2*.py'
      - 'tests/fpe/run_fpe_nlglob14n2*.sh'
      - '.github/workflows/f-pe-nlglob14n2.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14n2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root-trial-solver-decomposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered solver decomposition
        run: bash tests/fpe/run_fpe_nlglob14n2.sh
