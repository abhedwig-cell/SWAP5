name: F-PE-NLGLOB14O first-retreat TG handoff admissibility

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14O*.md'
      - 'tests/fpe/materialize_fpe_nlglob14o*.py'
      - 'tests/fpe/run_fpe_nlglob14o*.py'
      - 'tests/fpe/run_fpe_nlglob14o*.sh'
      - '.github/workflows/f-pe-nlglob14o.yml'
  push:
    branches:
      - research/f-pe-nlglob14o-first-retreat-shadow-handoff
    paths:
      - 'docs/performance/F-PE-NLGLOB14O*.md'
      - 'tests/fpe/materialize_fpe_nlglob14o*.py'
      - 'tests/fpe/run_fpe_nlglob14o*.py'
      - 'tests/fpe/run_fpe_nlglob14o*.sh'
      - '.github/workflows/f-pe-nlglob14o.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14o-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  handoff-admissibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered first-retreat handoff admissibility
        run: bash tests/fpe/run_fpe_nlglob14o.sh
