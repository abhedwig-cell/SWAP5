name: F-PE-NLGLOB14P full-column TG predictor admissibility

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14P*.md'
      - 'tests/fpe/run_fpe_nlglob14p*.py'
      - 'tests/fpe/run_fpe_nlglob14p*.sh'
      - '.github/workflows/f-pe-nlglob14p.yml'
  push:
    branches:
      - research/f-pe-nlglob14p-full-column-tg-predictor
    paths:
      - 'docs/performance/F-PE-NLGLOB14P*.md'
      - 'tests/fpe/run_fpe_nlglob14p*.py'
      - 'tests/fpe/run_fpe_nlglob14p*.sh'
      - '.github/workflows/f-pe-nlglob14p.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14p-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-column-predictor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered full-column predictor admissibility
        run: bash tests/fpe/run_fpe_nlglob14p.sh
