name: F-PE-NLGLOB14Q first-retreat transactional shadow TG

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14Q*.md'
      - 'tests/fpe/materialize_fpe_nlglob14q*.py'
      - 'tests/fpe/run_fpe_nlglob14q*.py'
      - 'tests/fpe/run_fpe_nlglob14q*.sh'
      - '.github/workflows/f-pe-nlglob14q.yml'
  push:
    branches:
      - research/f-pe-nlglob14q-retreat-shadow-tg-solve
    paths:
      - 'docs/performance/F-PE-NLGLOB14Q*.md'
      - 'tests/fpe/materialize_fpe_nlglob14q*.py'
      - 'tests/fpe/run_fpe_nlglob14q*.py'
      - 'tests/fpe/run_fpe_nlglob14q*.sh'
      - '.github/workflows/f-pe-nlglob14q.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14q-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transactional-shadow-tg:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered transactional shadow TG solve
        run: bash tests/fpe/run_fpe_nlglob14q.sh
