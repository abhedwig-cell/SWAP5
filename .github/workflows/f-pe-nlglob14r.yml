name: F-PE-NLGLOB14R accepted TG handoff persistence

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14R*.md'
      - 'tests/fpe/materialize_fpe_nlglob14r*.py'
      - 'tests/fpe/run_fpe_nlglob14r*.py'
      - 'tests/fpe/run_fpe_nlglob14r*.sh'
      - '.github/workflows/f-pe-nlglob14r.yml'
  push:
    branches:
      - research/f-pe-nlglob14r-accepted-tg-handoff-persistence
    paths:
      - 'docs/performance/F-PE-NLGLOB14R*.md'
      - 'tests/fpe/materialize_fpe_nlglob14r*.py'
      - 'tests/fpe/run_fpe_nlglob14r*.py'
      - 'tests/fpe/run_fpe_nlglob14r*.sh'
      - '.github/workflows/f-pe-nlglob14r.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14r-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accepted-handoff-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered accepted handoff persistence falsification
        run: bash tests/fpe/run_fpe_nlglob14r.sh
