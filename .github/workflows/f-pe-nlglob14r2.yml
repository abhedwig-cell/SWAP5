name: F-PE-NLGLOB14R2 transaction retry recovery

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14R2*.md'
      - 'tests/fpe/materialize_fpe_nlglob14r2*.py'
      - 'tests/fpe/run_fpe_nlglob14r2*.py'
      - 'tests/fpe/run_fpe_nlglob14r2*.sh'
      - '.github/workflows/f-pe-nlglob14r2.yml'
  push:
    branches:
      - research/f-pe-nlglob14r2-transaction-retry-recovery
    paths:
      - 'docs/performance/F-PE-NLGLOB14R2*.md'
      - 'tests/fpe/materialize_fpe_nlglob14r2*.py'
      - 'tests/fpe/run_fpe_nlglob14r2*.py'
      - 'tests/fpe/run_fpe_nlglob14r2*.sh'
      - '.github/workflows/f-pe-nlglob14r2.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14r2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transaction-retry-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered transaction retry recovery
        run: bash tests/fpe/run_fpe_nlglob14r2.sh
