name: F-PE-NLGLOB14R4 invalid bracket attribution

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14R4*.md'
      - 'tests/fpe/materialize_fpe_nlglob14r4*.py'
      - 'tests/fpe/run_fpe_nlglob14r4*.py'
      - 'tests/fpe/run_fpe_nlglob14r4*.sh'
      - '.github/workflows/f-pe-nlglob14r4.yml'
  push:
    branches:
      - research/f-pe-nlglob14r4-invalid-bracket-attribution
    paths:
      - 'docs/performance/F-PE-NLGLOB14R4*.md'
      - 'tests/fpe/materialize_fpe_nlglob14r4*.py'
      - 'tests/fpe/run_fpe_nlglob14r4*.py'
      - 'tests/fpe/run_fpe_nlglob14r4*.sh'
      - '.github/workflows/f-pe-nlglob14r4.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14r4-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invalid-bracket-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered invalid-bracket attribution
        run: bash tests/fpe/run_fpe_nlglob14r4.sh
