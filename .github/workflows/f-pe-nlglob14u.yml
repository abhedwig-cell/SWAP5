name: F-PE-NLGLOB14U moving-interface accepted state
on:
  push:
    branches: [research/f-pe-nlglob14u-moving-interface-accepted-state]
    paths:
      - 'docs/performance/F-PE-NLGLOB14U*.md'
      - 'tests/fpe/run_fpe_nlglob14u*.py'
      - 'tests/fpe/run_fpe_nlglob14u*.sh'
      - '.github/workflows/f-pe-nlglob14u.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moving-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14u.sh
