name: F-PE-NLGLOB14U accepted moving-interface evolution

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/performance/F-PE-NLGLOB14U*.md'
      - 'tests/fpe/run_fpe_nlglob14u*.py'
      - 'tests/fpe/run_fpe_nlglob14u*.sh'
      - '.github/workflows/f-pe-nlglob14u.yml'
  push:
    branches:
      - research/f-pe-nlglob14u-accepted-moving-interface
    paths:
      - 'docs/performance/F-PE-NLGLOB14U*.md'
      - 'tests/fpe/run_fpe_nlglob14u*.py'
      - 'tests/fpe/run_fpe_nlglob14u*.sh'
      - '.github/workflows/f-pe-nlglob14u.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-nlglob14u-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accepted-moving-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered accepted moving-interface evolution
        run: bash tests/fpe/run_fpe_nlglob14u.sh
