name: F-PE-NLGLOB14V second-retreat exposure
on:
  push:
    branches: [research/f-pe-nlglob14v-second-retreat-exposure]
    paths:
      - 'docs/performance/F-PE-NLGLOB14V*.md'
      - 'tests/fpe/run_fpe_nlglob14v*.py'
      - 'tests/fpe/run_fpe_nlglob14v*.sh'
      - '.github/workflows/f-pe-nlglob14v.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  second-retreat-exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14v.sh
