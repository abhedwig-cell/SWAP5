name: F-PE-NLGLOB14W split second-retreat transition
on:
  push:
    branches: [research/f-pe-nlglob14w-split-second-retreat-transition]
    paths:
      - 'docs/performance/F-PE-NLGLOB14W*.md'
      - 'tests/fpe/run_fpe_nlglob14w*.py'
      - 'tests/fpe/run_fpe_nlglob14w*.sh'
      - '.github/workflows/f-pe-nlglob14w.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  split-second-retreat:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14w.sh
