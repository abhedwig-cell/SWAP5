name: F-PE-NLGLOB14X further retreat exposure

on:
  push:
    branches:
      - research/f-pe-nlglob14x-further-retreat-exposure
    paths:
      - 'docs/performance/F-PE-NLGLOB14X*.md'
      - 'tests/fpe/run_fpe_nlglob14x*.py'
      - 'tests/fpe/run_fpe_nlglob14x*.sh'
      - '.github/workflows/f-pe-nlglob14x.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  further-retreat-exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14x.sh
