name: F-PE-NLGLOB14Y multi-retreat split ownership

on:
  push:
    branches:
      - research/f-pe-nlglob14y-multi-retreat-split
    paths:
      - 'docs/performance/F-PE-NLGLOB14Y*.md'
      - 'tests/fpe/run_fpe_nlglob14y*.py'
      - 'tests/fpe/run_fpe_nlglob14y*.sh'
      - '.github/workflows/f-pe-nlglob14y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-retreat-split:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14y.sh
