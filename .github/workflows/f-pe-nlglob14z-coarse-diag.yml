name: F-PE-NLGLOB14Z coarse attribution

on:
  push:
    branches:
      - research/f-pe-nlglob14z-disappearance-exposure
    paths:
      - 'tests/fpe/run_fpe_nlglob14z_coarse_diag*.py'
      - 'tests/fpe/run_fpe_nlglob14z_coarse_diag*.sh'
      - '.github/workflows/f-pe-nlglob14z-coarse-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coarse-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z_coarse_diag.sh
