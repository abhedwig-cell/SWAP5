name: F-PE-NLGLOB14Z disappearance exposure

on:
  push:
    branches:
      - research/f-pe-nlglob14z-disappearance-exposure
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z*.md'
      - 'tests/fpe/run_fpe_nlglob14z*.py'
      - 'tests/fpe/run_fpe_nlglob14z*.sh'
      - '.github/workflows/f-pe-nlglob14z.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disappearance-exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z.sh
