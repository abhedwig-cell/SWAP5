name: F-PE-NLGLOB14Z1 late retreat refinement

on:
  push:
    branches:
      - research/f-pe-nlglob14z1-late-retreat-refinement
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z1*.md'
      - 'tests/fpe/run_fpe_nlglob14z1*.py'
      - 'tests/fpe/run_fpe_nlglob14z1*.sh'
      - '.github/workflows/f-pe-nlglob14z1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  late-retreat-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z1.sh
