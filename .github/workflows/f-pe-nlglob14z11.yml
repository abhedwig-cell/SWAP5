name: F-PE-NLGLOB14Z11 split retreat 10:16 to 11:16

on:
  push:
    branches:
      - research/f-pe-nlglob14z11-split-retreat-10-11
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z11*.md'
      - 'tests/fpe/run_fpe_nlglob14z11_segment.py'
      - 'tests/fpe/run_fpe_nlglob14z11_segment.sh'
      - '.github/workflows/f-pe-nlglob14z11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segment-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: HEAD
            dt: "0.000125"
            key: head-coarse
          - route: HEAD
            dt: "0.0000625"
            key: head-fine
          - route: RUNOFF
            dt: "0.000125"
            key: runoff-coarse
          - route: RUNOFF
            dt: "0.0000625"
            key: runoff-fine
    name: segment A ${{ matrix.route }} dt=${{ matrix.dt }}
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z11_segment.sh "${{ matrix.route }}" "${{ matrix.dt }}" first "30.0" "z11-${{ matrix.key }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: z11-${{ matrix.key }}-checkpoint
          path: z11-${{ matrix.key }}.json
          if-no-files-found: error

  segment-b:
    needs: segment-a
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: HEAD
            dt: "0.000125"
            key: head-coarse
          - route: HEAD
            dt: "0.0000625"
            key: head-fine
          - route: RUNOFF
            dt: "0.000125"
            key: runoff-coarse
          - route: RUNOFF
            dt: "0.0000625"
            key: runoff-fine
    name: segment B ${{ matrix.route }} dt=${{ matrix.dt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: z11-${{ matrix.key }}-checkpoint
          path: .
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z11_segment.sh "${{ matrix.route }}" "${{ matrix.dt }}" resume "60.0" "z11-${{ matrix.key }}.json"
