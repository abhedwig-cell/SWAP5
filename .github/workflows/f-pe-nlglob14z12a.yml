name: F-PE-NLGLOB14Z12A fine RUNOFF failure attribution

on:
  push:
    branches:
      - research/f-pe-nlglob14z12a-fine-runoff-attribution
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z12A*.md'
      - 'tests/fpe/materialize_fpe_nlglob14z12a*.py'
      - 'tests/fpe/run_fpe_nlglob14z12a*.py'
      - 'tests/fpe/run_fpe_nlglob14z12a*.sh'
      - '.github/workflows/f-pe-nlglob14z12a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fine-runoff-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z12a.sh
