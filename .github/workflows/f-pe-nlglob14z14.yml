name: F-PE-NLGLOB14Z14 control beyond 12:16

on:
  push:
    branches:
      - research/f-pe-nlglob14z14-control-beyond-12
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z14*.md'
      - 'tests/fpe/run_fpe_nlglob14z14*.py'
      - 'tests/fpe/run_fpe_nlglob14z14*.sh'
      - '.github/workflows/f-pe-nlglob14z14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-beyond-12:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z14.sh
