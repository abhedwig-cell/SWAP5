name: F-PE-NLGLOB14Z14A pre-event failure attribution

on:
  push:
    branches:
      - research/f-pe-nlglob14z14a-pre-event-attribution
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z14A*.md'
      - 'tests/fpe/materialize_fpe_nlglob14z14a*.py'
      - 'tests/fpe/run_fpe_nlglob14z14a*.py'
      - 'tests/fpe/run_fpe_nlglob14z14a*.sh'
      - '.github/workflows/f-pe-nlglob14z14a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-event-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z14a.sh
