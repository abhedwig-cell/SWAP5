name: F-PE-NLGLOB14Z14B three-fixture local recovery

on:
  push:
    branches:
      - research/f-pe-nlglob14z14b-three-fixture-local-recovery
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z14B*.md'
      - 'tests/fpe/materialize_fpe_nlglob14z14b*.py'
      - 'tests/fpe/run_fpe_nlglob14z14b*.py'
      - 'tests/fpe/run_fpe_nlglob14z14b*.sh'
      - '.github/workflows/f-pe-nlglob14z14b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-fixture-local-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z14b.sh
