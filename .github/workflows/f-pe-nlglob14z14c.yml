name: F-PE-NLGLOB14Z14C repaired retreat 12:16 to 13:16

on:
  push:
    branches:
      - research/f-pe-nlglob14z14c-repaired-event-continuation
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z14C*.md'
      - 'tests/fpe/run_fpe_nlglob14z14c*.py'
      - 'tests/fpe/run_fpe_nlglob14z14c*.sh'
      - '.github/workflows/f-pe-nlglob14z14c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repaired-event-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z14c.sh
