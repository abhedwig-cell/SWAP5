name: F-PE-NLGLOB14Z17 control beyond 13:16

on:
  push:
    branches:
      - research/f-pe-nlglob14z17-control-beyond-13
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z17*.md'
      - 'tests/fpe/run_fpe_nlglob14z17*.py'
      - 'tests/fpe/run_fpe_nlglob14z17*.sh'
      - '.github/workflows/f-pe-nlglob14z17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-beyond-13:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: HEAD
            dt: "0.000125"
          - route: HEAD
            dt: "0.0000625"
          - route: RUNOFF
            dt: "0.000125"
          - route: RUNOFF
            dt: "0.0000625"
    name: control-beyond-13 ${{ matrix.route }} dt=${{ matrix.dt }}
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z17.sh "${{ matrix.route }}" "${{ matrix.dt }}"
