name: F-PE-NLGLOB14Z17D second retry attribution

on:
  push:
    branches:
      - research/f-pe-nlglob14z17d-second-retry-attribution
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z17D*.md'
      - 'tests/fpe/run_fpe_nlglob14z17d*.py'
      - 'tests/fpe/run_fpe_nlglob14z17d*.sh'
      - '.github/workflows/f-pe-nlglob14z17d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  second-retry-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z17d.sh
