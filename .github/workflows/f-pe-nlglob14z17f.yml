name: F-PE-NLGLOB14Z17F two-recovery event continuation

on:
  push:
    branches:
      - research/f-pe-nlglob14z17f-two-recovery-event-continuation
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z17F*.md'
      - 'tests/fpe/run_fpe_nlglob14z17f*.py'
      - 'tests/fpe/run_fpe_nlglob14z17f*.sh'
      - '.github/workflows/f-pe-nlglob14z17f.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-recovery-event-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z17f.sh
