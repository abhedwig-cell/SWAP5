name: F-PE-NLGLOB14Z27 solve-dimension audit

on:
  push:
    branches:
      - research/f-pe-nlglob14z27-block-normalized-work
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z27*.md'
      - 'tests/fpe/run_fpe_nlglob14z27.py'
      - 'tests/fpe/run_fpe_nlglob14z26_segment.py'
      - '.github/workflows/f-pe-nlglob14z27.yml'
  workflow_dispatch:

permissions:
