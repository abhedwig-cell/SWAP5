name: F-PE-NLGLOB14Z28 variable-dimension manager bootstrap

on:
  push:
    branches:
      - research/f-pe-nlglob14z28-variable-dimension-manager
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z28*.md'
      - 'tests/fpe/mod_fpe_nlglob14z28_workspace_contract_stub.f90'
      - 'tests/fpe/test_fpe_nlglob14z28_variable_dimension.f90'
      - 'tests/fpe/run_fpe_nlglob14z28.sh'
      - '.github/workflows/f-pe-nlglob14z28.yml'
      - 'src/solver/mod_reference_linear_solver.f90'
      - 'src/solver/mod_reference_richards_workspace.f90'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variable-dimension-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z28.sh
