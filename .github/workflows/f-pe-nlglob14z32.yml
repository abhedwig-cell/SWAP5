name: F-PE-NLGLOB14Z32 stable n13 interface attribution

on:
  push:
    branches:
      - research/f-pe-nlglob14z32-n13-interface-attribution
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z32*.md'
      - 'tests/fpe/run_fpe_nlglob14z32_attribution.py'
      - 'tests/fpe/run_fpe_nlglob14z32.sh'
      - '.github/workflows/f-pe-nlglob14z32.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        route: [HEAD, RUNOFF]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: z31-${{ matrix.route }}-checkpoint
          path: .
          repository: abhedwig-cell/SWAP5
          run-id: 36757619753
          github-token: ${{ github.token }}
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z32.sh "${{ matrix.route }}" "0.0000625" "z31-${{ matrix.route }}.json"
