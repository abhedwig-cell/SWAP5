name: F-PE-NLGLOB14Z34 manager prototype seam smoke

on:
  push:
    branches:
      - research/f-pe-nlglob14z34-manager-prototype-seam
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z34*.md'
      - 'src/runtime/mod_moving_interface_manager.f90'
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/solver/mod_reference_richards_workspace.f90'
      - 'tests/fpe/test_fpe_nlglob14z34_manager_seam.f90'
      - 'tests/fpe/run_fpe_nlglob14z34.sh'
      - '.github/workflows/f-pe-nlglob14z34.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seam-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z34.sh
