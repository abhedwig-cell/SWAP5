name: F-PE-NLGLOB14Z35 manager physical binding smoke

on:
  push:
    branches:
      - research/f-pe-nlglob14z35-manager-physical-binding-smoke
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z35*.md'
      - 'src/runtime/mod_moving_interface_manager.f90'
      - 'tests/fpe/materialize_fpe_nlglob14z35_physical_fixture.py'
      - 'tests/fpe/test_fpe_nlglob14z35_manager_physical_binding.f90'
      - 'tests/fpe/run_fpe_nlglob14z35.sh'
      - '.github/workflows/f-pe-nlglob14z35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager-physical-binding-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z35.sh
