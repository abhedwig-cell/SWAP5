name: F-PE-NLGLOB14Z38 persistent manager timing

on:
  push:
    branches:
      - research/f-pe-nlglob14z38-persistent-manager-fast-path
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z38*.md'
      - 'src/runtime/mod_moving_interface_manager.f90'
      - 'tests/fpe/test_fpe_nlglob14z38_fortran_timing.f90'
      - 'tests/fpe/run_fpe_nlglob14z38.sh'
      - '.github/workflows/f-pe-nlglob14z38.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z38.sh
