name: F-PE-NLGLOB14Z39 Richards amortization timing

on:
  push:
    branches:
      - research/f-pe-nlglob14z39-richards-amortization
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z39*.md'
      - 'tests/fpe/test_fpe_nlglob14z39_richards_timing.f90'
      - 'tests/fpe/run_fpe_nlglob14z39.py'
      - 'tests/fpe/run_fpe_nlglob14z39.sh'
      - '.github/workflows/f-pe-nlglob14z39.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  richards-amortization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z39.sh
