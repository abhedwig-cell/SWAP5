name: F-PE-NLGLOB14Z40 real reduced Richards A/B

on:
  push:
    branches:
      - research/f-pe-nlglob14z40-real-reduced-richards-ab
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z40*.md'
      - 'tests/fpe/test_fpe_nlglob14z40_real_reduced_richards.f90'
      - 'tests/fpe/run_fpe_nlglob14z40.py'
      - 'tests/fpe/run_fpe_nlglob14z40.sh'
      - '.github/workflows/f-pe-nlglob14z40.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-reduced-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z40.sh
