name: F-PE-NLGLOB14Z42 larger-profile trajectory timing

on:
  push:
    branches:
      - research/f-pe-nlglob14z42-large-profile-trajectory
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z42*.md'
      - 'tests/fpe/test_fpe_nlglob14z42_large_profile_trajectory.f90'
      - 'tests/fpe/run_fpe_nlglob14z42.py'
      - 'tests/fpe/run_fpe_nlglob14z42.sh'
      - '.github/workflows/f-pe-nlglob14z42.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-profile-trajectory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z42.sh
