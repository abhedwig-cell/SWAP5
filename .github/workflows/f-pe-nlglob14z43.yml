name: F-PE-NLGLOB14Z43 admission candidate holdout

on:
  push:
    branches:
      - research/f-pe-nlglob14z43-admission-candidate
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z43*.md'
      - 'src/runtime/mod_fmr_moving_interface_application_config.f90'
      - 'tests/fpe/test_fpe_nlglob14z43_config.f90'
      - 'tests/fpe/test_fpe_nlglob14z42_large_profile_trajectory.f90'
      - 'tests/fpe/run_fpe_nlglob14z43.py'
      - 'tests/fpe/run_fpe_nlglob14z43.sh'
      - '.github/workflows/f-pe-nlglob14z43.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-admission-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z43.sh
