name: F-PE-NLGLOB14Z43A holdout reference solvability

on:
  push:
    branches:
      - research/f-pe-nlglob14z43a-holdout-reference-solvability
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z43A*.md'
      - 'tests/fpe/test_fpe_nlglob14z43a_reference_solvability.f90'
      - 'tests/fpe/run_fpe_nlglob14z43a.py'
      - 'tests/fpe/run_fpe_nlglob14z43a.sh'
      - '.github/workflows/f-pe-nlglob14z43a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-solvability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z43a.sh
