name: F-PE-NLGLOB14Z43D reference-only holdout replacement

on:
  push:
    branches:
      - research/f-pe-nlglob14z43d-reference-holdout-replacement
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z43D*.md'
      - 'tests/fpe/run_fpe_nlglob14z43d.py'
      - 'tests/fpe/run_fpe_nlglob14z43d.sh'
      - '.github/workflows/f-pe-nlglob14z43d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-replacement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z43d.sh
