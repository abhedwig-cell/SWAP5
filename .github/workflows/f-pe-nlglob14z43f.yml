name: F-PE-NLGLOB14Z43F canonical admission smoke

on:
  push:
    branches:
      - work/f-pe-nlglob14z43f-canonical-admission-v2
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z43F*.md'
      - 'src/runtime/mod_moving_interface_manager.f90'
      - 'src/runtime/mod_timestep_numerical_profile.f90'
      - 'tests/fpe/test_fpe_nlglob14z43f_manager_admission.f90'
      - 'tests/fpe/test_fpe_nlglob14z43f_profile.f90'
      - 'tests/fpe/run_fpe_nlglob14z43f.sh'
      - '.github/workflows/f-pe-nlglob14z43f.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z43f.sh
