name: F-PE-NLGLOB14Z44A canonical admission

on:
  push:
    branches:
      - work/f-pe-nlglob14z44a-canonical-admission
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z44A*.md'
      - 'src/runtime/mod_moving_interface_manager.f90'
      - 'src/runtime/mod_timestep_numerical_profile.f90'
      - 'tests/fpe/test_fpe_nlglob14z44a_*.f90'
      - 'tests/fpe/run_fpe_nlglob14z44a.sh'
      - '.github/workflows/f-pe-nlglob14z44a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z44a.sh
