name: F-PE-NLGLOB14Z6 split next late retreat ownership

on:
  push:
    branches:
      - research/f-pe-nlglob14z6-split-next-late-retreat
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z6*.md'
      - 'tests/fpe/run_fpe_nlglob14z6*.py'
      - 'tests/fpe/run_fpe_nlglob14z6*.sh'
      - '.github/workflows/f-pe-nlglob14z6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-next-late-retreat:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z6.sh
