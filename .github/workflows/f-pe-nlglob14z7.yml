name: F-PE-NLGLOB14Z7 control beyond 9:16

on:
  push:
    branches:
      - research/f-pe-nlglob14z7-control-beyond-9
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z7*.md'
      - 'tests/fpe/run_fpe_nlglob14z7*.py'
      - 'tests/fpe/run_fpe_nlglob14z7*.sh'
      - '.github/workflows/f-pe-nlglob14z7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-beyond-9:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z7.sh
