name: F-PE-NLGLOB14Z8 split beyond 9:16

on:
  push:
    branches:
      - research/f-pe-nlglob14z8-split-beyond-9
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z8*.md'
      - 'tests/fpe/run_fpe_nlglob14z8*.py'
      - 'tests/fpe/run_fpe_nlglob14z8*.sh'
      - '.github/workflows/f-pe-nlglob14z8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-beyond-9:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z8.sh
