name: F-PE-NLGLOB14Z9 control beyond 10:16

on:
  push:
    branches:
      - research/f-pe-nlglob14z9-control-beyond-10
    paths:
      - 'docs/performance/F-PE-NLGLOB14Z9*.md'
      - 'tests/fpe/run_fpe_nlglob14z9*.py'
      - 'tests/fpe/run_fpe_nlglob14z9*.sh'
      - '.github/workflows/f-pe-nlglob14z9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-beyond-10:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fpe/run_fpe_nlglob14z9.sh
