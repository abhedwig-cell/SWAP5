name: F-PE-ORCH01 hot-loop orchestration decomposition

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_orch01_*.sh'
      - 'docs/performance/F-PE-ORCH01_*.md'
      - '.github/workflows/f-pe-orch01.yml'
  workflow_dispatch:

jobs:
  decompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        n: [1000, 10000, 40000]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hot-loop orchestration decomposition
        env:
          ORCH01_N: '${{ matrix.n }}'
          ORCH01_REPS: '5'
        run: bash tests/fpe/run_fpe_orch01_decomposition.sh
