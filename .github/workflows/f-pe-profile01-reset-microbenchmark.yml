name: F-PE-PROFILE01 reset microbenchmark

on:
  push:
    branches:
      - work/f-pe-profile01
    paths:
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/solver/mod_reference_richards_workspace.f90'
      - 'tests/fpe/test_fpe_profile01_workspace_reset_timing.f90'
      - 'tests/fpe/run_fpe_profile01_workspace_reset_timing.sh'
      - '.github/workflows/f-pe-profile01-reset-microbenchmark.yml'
  pull_request:
    paths:
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/solver/mod_reference_richards_workspace.f90'
      - 'tests/fpe/test_fpe_profile01_workspace_reset_timing.f90'
      - 'tests/fpe/run_fpe_profile01_workspace_reset_timing.sh'
      - '.github/workflows/f-pe-profile01-reset-microbenchmark.yml'
  workflow_dispatch:

jobs:
  reset-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Measure reference workspace reset cost
        run: bash tests/fpe/run_fpe_profile01_workspace_reset_timing.sh
