name: F-PE-PROFILE02 post-zero-waste scale baseline

on:
  pull_request:
    paths:
      - 'src/runtime/**'
      - 'src/solver/**'
      - 'src/adapter/**'
      - 'src/kernel/**'
      - 'src/transaction/**'
      - 'src/process/**'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'tests/fpe/test_fpe_profile02_scale_baseline.f90'
      - 'tests/fpe/run_fpe_profile02_scale_baseline.sh'
      - 'docs/performance/F-PE-PROFILE02_PREREGISTRATION.md'
      - '.github/workflows/f-pe-profile02-scale-baseline.yml'
  workflow_dispatch:

jobs:
  scale-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Run PROFILE02 baseline
        run: |
          bash tests/fpe/run_fpe_profile02_scale_baseline.sh | tee profile02-scale-baseline.txt
          test "$(grep -c '^PROFILE02_SCALE=PASS$' profile02-scale-baseline.txt)" -eq 12
      - uses: actions/upload-artifact@v4
        with:
          name: profile02-scale-baseline
          path: profile02-scale-baseline.txt
