name: F-PE-PROFILE03 H03 E2 route binding

on:
  push:
    branches:
      - work/f-pe-profile03-h03-e2e
    paths:
      - 'src/legacy/b1_10_port/soilwater.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'src/adapter/mod_b110_production_soil_water_task2.f90'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'tests/fpe/check_fpe_profile03_h03_e2_binding.py'
      - '.github/workflows/f-pe-profile03-h03-e2-binding.yml'
  workflow_dispatch:

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/fpe/check_fpe_profile03_h03_e2_binding.py
