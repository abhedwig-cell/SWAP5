name: F-PE-PROFILE04 end-to-end rebaseline

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_profile04_end_to_end_rebaseline.sh'
      - 'tests/fpe/run_fpe_profile04_repeated_decomposition.sh'
      - 'tests/fpe/run_fpe_profile04_kernel_costs.sh'
      - 'tests/fpe/run_fpe_profile04_ahl_application_runtime.sh'
      - 'docs/performance/F-PE-PROFILE04_PREREGISTRATION.md'
      - '.github/workflows/f-pe-profile04.yml'
  workflow_dispatch:

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tests/fpe/run_fpe_profile04_end_to_end_rebaseline.sh

  ahl-application-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_profile04_ahl_application_runtime.sh

  kernel-costs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_profile04_kernel_costs.sh

  repeated-decomposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_profile04_repeated_decomposition.sh

  ahl-repeated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_profile04_ahl_repeated.sh
