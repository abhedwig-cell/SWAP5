name: F-PE-PROFILE05 practical-stack rebaseline

on:
  pull_request:
    paths:
      - 'docs/performance/F-PE-PROFILE05_*.md'
      - '.github/workflows/f-pe-profile05.yml'
  workflow_dispatch:

jobs:
  repeated-decomposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_profile04_repeated_decomposition.sh

  reference-repeated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: TIMING_MODE=reference bash tests/fpe/run_fpe_zero_waste01_paired_runtime.sh

  directional-repeated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: TIMING_MODE=directional bash tests/fpe/run_fpe_zero_waste01_paired_runtime.sh

  a2c-application-sequence:
    runs-on: ubuntu-latest
    env:
      APPROX02_CANDIDATE_TOL: 1E-08
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_a2_application_sequence.sh

  a1-modflow-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_approx01_a1_modflow_e2e.sh

    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    env:
      APPROX02_CANDIDATE_TOL: 1E-08
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_approx02_a2_modflow_e2e.sh

  a2c-failure-attribution:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    env:
      APPROX02_CANDIDATE_TOL: 1E-08
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_profile05_a2c_failure_attribution.sh
