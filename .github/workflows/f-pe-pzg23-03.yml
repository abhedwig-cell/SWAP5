name: F-PE-PZG23-03 rejection-channel attribution

concurrency:
  group: f-pe-pzg23-03-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-pzg23-03-rejection-channel-attribution
    paths:
      - 'tests/fpe/prepare_fpe_pzg23_03.py'
      - 'tests/fpe/test_fpe_pzg23_03_rejection_channel_attribution.f90'
      - 'tests/fpe/run_fpe_pzg23_03_rejection_channel_attribution.sh'
      - 'docs/performance/F-PE-PZG23-03_REJECTION_CHANNEL_ATTRIBUTION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-pzg23-03.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/pzg23-03-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run rejection-channel attribution
        run: bash tests/fpe/run_fpe_pzg23_03_rejection_channel_attribution.sh "$RUNNER_TEMP/pzg23-03-pdok"
