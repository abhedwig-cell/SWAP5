name: F-PE-PZG23-05 backtracking descent instrumentation

concurrency:
  group: f-pe-pzg23-05-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-pzg23-05-backtracking-descent-instrumentation
    paths:
      - 'tests/fpe/prepare_fpe_pzg23_05.py'
      - 'tests/fpe/test_fpe_pzg23_05_backtracking_instrumentation.f90'
      - 'tests/fpe/materialize_fpe_pzg23_05_headcalc.py'
      - 'tests/fpe/run_fpe_pzg23_05_backtracking_descent.sh'
      - 'docs/performance/F-PE-PZG23-05_BACKTRACKING_DESCENT_INSTRUMENTATION_PREREGISTRATION.md'
      - '.github/workflows/f-pe-pzg23-05.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/pzg23-05-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run instrumented backtracking attribution
        run: bash tests/fpe/run_fpe_pzg23_05_backtracking_descent.sh "$RUNNER_TEMP/pzg23-05-pdok"
