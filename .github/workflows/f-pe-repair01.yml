name: F-PE-REPAIR01 root-sink qbot ownership

on:
  pull_request:
    paths:
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'tests/fpe/run_fpe_repair01_*.sh'
      - 'docs/performance/F-PE-REPAIR01_*.md'
      - '.github/workflows/f-pe-repair01.yml'
  workflow_dispatch:

jobs:
  inactive-root-poison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_repro01_d8_provider_singletons.sh

  exact-first-corrector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_repro01_d1_first_corrector.sh

  root-active-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_repair01_root_active_parity.sh

  fixed-build-live:
    runs-on: ubuntu-latest
    env:
      APPROX02_CANDIDATE_TOL: 1E-08
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_profile05_fixed_build_repeatability.sh

  a1-live-control:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_approx01_a1_modflow_e2e.sh

  a2c-live:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    env:
      APPROX02_CANDIDATE_TOL: 1E-08
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_approx02_a2_modflow_e2e.sh

  a2c-application:
    runs-on: ubuntu-latest
    env:
      APPROX02_CANDIDATE_TOL: 1E-08
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_approx02_a2_application_sequence.sh
