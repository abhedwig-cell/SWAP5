name: F-PE-REPRO02 difficult-origin admissibility

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_repro02_*.sh'
      - 'docs/performance/F-PE-REPRO02_*.md'
      - '.github/workflows/f-pe-repro02.yml'
  workflow_dispatch:

jobs:
  r1-acceptance-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_repro02_r1_acceptance_signature.sh

  r2-solver-caps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
