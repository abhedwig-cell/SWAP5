name: F-PE-SCHED02 lagged worker selector

concurrency:
  group: f-pe-sched02-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/f-pe-sched02-lagged-work-selector
    paths:
      - 'tests/fpe/prepare_fpe_sched02_profiles.py'
      - 'tests/fpe/materialize_fpe_sched02_headcalc_stubs.py'
      - 'tests/fpe/test_fpe_sched02_lagged_work_selector.f90'
      - 'tests/fpe/run_fpe_sched02_lagged_work_selector.sh'
      - 'docs/performance/F-PE-SCHED02_LAGGED_WORK_SELECTOR_PREREGISTRATION.md'
      - '.github/workflows/f-pe-sched02.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical authority
        run: git fetch origin integration/f-ci-canonical
      - name: Download frozen PDOK BRO Bodemkaart GeoPackage
        uses: actions/download-artifact@v4
        with:
          name: f-pe-elastic12a4-pdok-atom
          path: ${{ runner.temp }}/sched02-pdok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhedwig-cell/SWAP5
          run-id: 36550782840
      - name: Run lagged worker selector benchmark
        run: bash tests/fpe/run_fpe_sched02_lagged_work_selector.sh "$RUNNER_TEMP/sched02-pdok"
