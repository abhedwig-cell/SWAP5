name: F-PE-SHORTSTEP01 Reference Richards short-duration pathology

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_shortstep01_*.sh'
      - 'docs/performance/F-PE-SHORTSTEP01_*.md'
      - '.github/workflows/f-pe-shortstep01.yml'
  workflow_dispatch:

jobs:
  p0-duration-ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_shortstep01_p0_duration_ladder.sh

  p1-newton-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_shortstep01_p1_newton_trace.sh

  p2-gate-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_shortstep01_p2_gate_attribution.sh
