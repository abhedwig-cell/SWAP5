name: F-PE-SOLVE01 EF upper bound

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_solve01_ef_upper_bound.sh'
      - 'tests/fpe/run_fpe_solve01_p0b_refresh_frontier.sh'
      - 'docs/performance/F-PE-SOLVE01_*.md'
      - '.github/workflows/f-pe-solve01.yml'
  workflow_dispatch:

jobs:
  ef-upper-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Run aggressive discarded-trial solve-elimination upper bound
        run: |
          bash tests/fpe/run_fpe_solve01_ef_upper_bound.sh | tee solve01-ef.txt
          grep -Fq 'FPE_SOLVE01_EF=PASS' solve01-ef.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-pe-solve01-ef
          path: solve01-ef.txt

  p0b-refresh-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Run bounded discarded-trial refresh frontier
        run: |
          bash tests/fpe/run_fpe_solve01_p0b_refresh_frontier.sh | tee solve01-p0b.txt
          grep -Fq 'FPE_SOLVE01_P0B=PASS' solve01-p0b.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f-pe-solve01-p0b
          path: solve01-p0b.txt
