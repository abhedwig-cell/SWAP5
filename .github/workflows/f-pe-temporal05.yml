name: F-PE-TEMPORAL05 blinded temporal Pareto frontier

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_temporal05_*.sh'
      - 'docs/performance/F-PE-TEMPORAL05_*.md'
      - '.github/workflows/f-pe-temporal05.yml'
  workflow_dispatch:

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_temporal05_calibration.sh

  blind-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_temporal05_holdout.sh
