name: F-PE-TEMPORAL07 c0.65 coupling admission

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_temporal07_*.sh'
      - 'docs/performance/F-PE-TEMPORAL07_*.md'
      - '.github/workflows/f-pe-temporal07.yml'
  workflow_dispatch:

jobs:
  p0-linear-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_temporal07_p0_linear_response.sh

  p1-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/fpe/run_fpe_temporal07_p1_cache.sh

  p2-live-modflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned MODFLOW Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_temporal07_p2_live_modflow.sh
