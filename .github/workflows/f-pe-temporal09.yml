name: F-PE-TEMPORAL09 temporal service decomposition

on:
  pull_request:
    paths:
      - 'tests/fpe/run_fpe_temporal09_*.sh'
      - 'docs/performance/F-PE-TEMPORAL09_*.md'
      - '.github/workflows/f-pe-temporal09.yml'
  workflow_dispatch:

jobs:
  decompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        n: [1000, 10000, 40000]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run temporal-service decomposition
        env:
          TEMPORAL09_N: '${{ matrix.n }}'
          TEMPORAL09_REPS: '5'
        run: bash tests/fpe/run_fpe_temporal09_service_decomposition.sh
