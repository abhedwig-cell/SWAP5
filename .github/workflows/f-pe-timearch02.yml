name: F-PE-TIMEARCH02 timestep decision contracts

on:
  push:
    branches:
      - work/f-pe-timearch02-decision-contracts
    paths:
      - 'docs/performance/F-PE-TIMEARCH02_PREREGISTRATION.md'
      - 'tests/fpe/mod_fpe_timearch02_contract.f90'
      - 'tests/fpe/test_fpe_timearch02_contract.f90'
      - 'tests/fpe/guard_fpe_timearch02_source.py'
      - 'tests/fpe/run_fpe_timearch02.sh'
      - '.github/workflows/f-pe-timearch02.yml'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part02.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part03.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part04.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part05.inc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run executable timestep contracts
        run: bash tests/fpe/run_fpe_timearch02.sh
