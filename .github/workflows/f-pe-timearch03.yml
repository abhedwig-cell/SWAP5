name: F-PE-TIMEARCH03 timestep attribution

on:
  push:
    branches:
      - work/f-pe-timearch03-shadow-attribution
    paths:
      - 'docs/performance/F-PE-TIMEARCH03_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timearch03_trace.f90'
      - 'tests/fpe/run_fpe_timearch03_attribution.py'
      - 'tests/fpe/run_fpe_timearch03_attribution.sh'
      - '.github/workflows/f-pe-timearch03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run paired attribution and shadow trace
        run: bash tests/fpe/run_fpe_timearch03_attribution.sh
