name: F-PE-TIMEARCH03 timestep attribution

on:
  push:
    branches:
      - work/f-pe-timearch03-shadow-attribution-r2
    paths:
      - 'docs/performance/F-PE-TIMEARCH03_PREREGISTRATION.md'
      - 'docs/performance/F-PE-TIMEARCH03_EVENT_REGISTRY.json'
      - 'tests/fpe/test_fpe_timearch03_trace.f90'
      - 'tests/fpe/run_fpe_timearch03_trace.py'
      - 'tests/fpe/guard_fpe_timearch03_events.py'
      - 'tests/fpe/run_fpe_timearch03.sh'
      - '.github/workflows/f-pe-timearch03.yml'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part02.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part03.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part04.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part05.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part06.inc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run timestep attribution and shadow observation
        run: bash tests/fpe/run_fpe_timearch03.sh
