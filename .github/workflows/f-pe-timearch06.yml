name: F-PE-TIMEARCH06 production decision services

on:
  push:
    branches:
      - work/f-pe-timearch06-production-decision-services
    paths:
      - 'docs/performance/F-PE-TIMEARCH06_PREREGISTRATION.md'
      - 'src/legacy/b1_10_fci11_port/mod_b1_10_timestep_decision_service.f90'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part01.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part04.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part05.inc'
      - 'tests/fpe/test_fpe_timearch06_service.f90'
      - 'tests/fpe/guard_fpe_timearch06_source.py'
      - 'tests/fpe/run_fpe_timearch06.sh'
      - '.github/workflows/f-pe-timearch06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run production decision-service gate
        run: bash tests/fpe/run_fpe_timearch06.sh
