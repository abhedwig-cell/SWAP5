name: F-PE-TIMEARCH07 production timestep decision trace

on:
  push:
    branches:
      - work/f-pe-timearch07-production-decision-trace
    paths:
      - 'docs/performance/F-PE-TIMEARCH07_PREREGISTRATION.md'
      - 'src/runtime/mod_a23bu_worker_execution_context.f90'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part01.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part04.inc'
      - 'src/legacy/b1_10_fci11_port/timecontrol_part05.inc'
      - 'src/legacy/b1_10_fci11_port/swap_part03.inc'
      - 'src/legacy/b1_10_fci11_port/swap_part06.inc'
      - 'tests/runtime/test_a23bu_worker_context.f90'
      - 'tests/fpe/run_fpe_timearch06.sh'
      - 'tests/fpe/guard_fpe_timearch07_source.py'
      - 'tests/fpe/run_fpe_timearch07.sh'
      - '.github/workflows/f-pe-timearch07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run production timestep trace gate
        run: bash tests/fpe/run_fpe_timearch07.sh
