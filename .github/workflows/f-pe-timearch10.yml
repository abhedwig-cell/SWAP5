name: F-PE-TIMEARCH10 numerical profile configuration

on:
  push:
    branches:
      - work/f-pe-timearch10-numerical-profile-config
    paths:
      - 'docs/performance/F-PE-TIMEARCH10_PREREGISTRATION.md'
      - 'src/runtime/mod_timestep_numerical_profile.f90'
      - 'tests/fpe/test_fpe_timearch10_profile.f90'
      - 'tests/fpe/guard_fpe_timearch10_source.py'
      - 'tests/fpe/run_fpe_timearch10.sh'
      - '.github/workflows/f-pe-timearch10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run numerical profile gate
        run: bash tests/fpe/run_fpe_timearch10.sh
