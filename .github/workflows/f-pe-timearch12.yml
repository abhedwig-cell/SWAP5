name: F-PE-TIMEARCH12 H0 automatic controller application

on:
  push:
    branches:
      - work/f-pe-timearch12-auto-controller-selection
    paths:
      - 'docs/performance/F-PE-TIMEARCH12_PREREGISTRATION.md'
      - 'docs/performance/F-PE-TIMEARCH12_VALIDATION_BANK.json'
      - 'tests/fpe/test_fpe_timearch12_h0_application.f90'
      - 'tests/fpe/run_fpe_timearch12.py'
      - 'tests/fpe/run_fpe_timearch12.sh'
      - '.github/workflows/f-pe-timearch12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h0-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered H0 controller validation
        run: bash tests/fpe/run_fpe_timearch12.sh
