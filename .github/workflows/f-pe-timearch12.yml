name: F-PE-TIMEARCH12 AUTO_REFERENCE discovery

on:
  push:
    branches:
      - work/f-pe-timearch12-auto-controller-discovery
    paths:
      - 'docs/performance/F-PE-TIMEARCH12_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timearch12_auto_controller.f90'
      - 'tests/fpe/run_fpe_timearch12.py'
      - 'tests/fpe/run_fpe_timearch12.sh'
      - '.github/workflows/f-pe-timearch12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered AUTO_REFERENCE discovery
        run: bash tests/fpe/run_fpe_timearch12.sh
