name: F-PE-TIMEARCH13 state-boundary AUTO_REFERENCE

on:
  push:
    branches:
      - work/f-pe-timearch13-state-boundary-auto
    paths:
      - 'docs/performance/F-PE-TIMEARCH13_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timearch13_auto_controller.f90'
      - 'tests/fpe/run_fpe_timearch13.py'
      - 'tests/fpe/run_fpe_timearch13.sh'
      - '.github/workflows/f-pe-timearch13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered TIMEARCH13 discovery
        run: bash tests/fpe/run_fpe_timearch13.sh
