name: F-PE-TIMEARCH14 trial-detected boundary events

on:
  push:
    branches:
      - work/f-pe-timearch14-trial-detected-boundary-events
    paths:
      - 'docs/performance/F-PE-TIMEARCH14_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timearch14_boundary_events.f90'
      - 'tests/fpe/run_fpe_timearch14.py'
      - 'tests/fpe/run_fpe_timearch14.sh'
      - '.github/workflows/f-pe-timearch14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered trial-detected boundary-event discovery
        run: bash tests/fpe/run_fpe_timearch14.sh
