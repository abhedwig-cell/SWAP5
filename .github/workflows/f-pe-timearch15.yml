name: F-PE-TIMEARCH15 flux AUTO fallback

on:
  push:
    branches:
      - work/f-pe-timearch15-flux-auto-fallback
    paths:
      - 'docs/performance/F-PE-TIMEARCH15_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timearch15_flux_fallback.f90'
      - 'tests/fpe/run_fpe_timearch15.py'
      - 'tests/fpe/run_fpe_timearch15.sh'
      - '.github/workflows/f-pe-timearch15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered flux AUTO fallback discovery
        run: bash tests/fpe/run_fpe_timearch15.sh
