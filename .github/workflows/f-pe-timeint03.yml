name: F-PE-TIMEINT03 implicit operator

on:
  push:
    branches:
      - work/f-pe-timeint03-implicit-operator
    paths:
      - 'docs/performance/F-PE-TIMEINT03_PREREGISTRATION.md'
      - 'tests/fpe/materialize_fpe_timeint03_binding.py'
      - 'tests/fpe/compile_fpe_timeint03_closure.py'
      - 'tests/fpe/test_fpe_timeint03_be.f90'
      - 'tests/fpe/run_fpe_timeint03_p0.py'
      - 'tests/fpe/run_fpe_timeint03_p0.sh'
      - '.github/workflows/f-pe-timeint03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  implicit-be:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered implicit BE qualification
        run: bash tests/fpe/run_fpe_timeint03_p0.sh
