name: F-PE-TIMEINT03 mixed-state LTE mechanism

on:
  push:
    branches:
      - work/f-pe-timeint01-temporal-integrator-reconstruction
    paths:
      - 'docs/performance/F-PE-TIMEINT03_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint03_mixed_lte.f90'
      - 'tests/fpe/run_fpe_timeint03.py'
      - 'tests/fpe/run_fpe_timeint03.sh'
      - '.github/workflows/f-pe-timeint03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-lte:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered mixed-state LTE mechanism
        run: bash tests/fpe/run_fpe_timeint03.sh
