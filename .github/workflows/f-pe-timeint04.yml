name: F-PE-TIMEINT04 nonlinear path trace

on:
  push:
    branches:
      - work/f-pe-timeint04-nonlinear-path
    paths:
      - 'docs/performance/F-PE-TIMEINT04_PREREGISTRATION.md'
      - 'docs/performance/F-PE-TIMEINT04A_PREREGISTRATION.md'
      - 'tests/fpe/materialize_fpe_timeint04_trace.py'
      - 'tests/fpe/test_fpe_timeint04_trace.f90'
      - 'tests/fpe/run_fpe_timeint04_trace.py'
      - 'tests/fpe/run_fpe_timeint04_trace.sh'
      - 'tests/fpe/materialize_fpe_timeint04a_floor.py'
      - 'tests/fpe/run_fpe_timeint04a_floor.py'
      - 'tests/fpe/run_fpe_timeint04a_floor.sh'
      - '.github/workflows/f-pe-timeint04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered nonlinear trace
        run: bash tests/fpe/run_fpe_timeint04_trace.sh

  bdf2-balance-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered BDF2 balance-floor diagnostic
        run: bash tests/fpe/run_fpe_timeint04a_floor.sh
