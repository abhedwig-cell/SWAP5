name: F-PE-TIMEINT04 adaptive backward Euler calibration

on:
  push:
    branches:
      - work/f-pe-timeint01-temporal-integrator-reconstruction
    paths:
      - 'docs/performance/F-PE-TIMEINT04_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint04_adaptive_be.f90'
      - 'tests/fpe/run_fpe_timeint04.py'
      - 'tests/fpe/run_fpe_timeint04.sh'
      - '.github/workflows/f-pe-timeint04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-be:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered adaptive BE calibration
        run: bash tests/fpe/run_fpe_timeint04.sh
