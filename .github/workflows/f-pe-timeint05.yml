name: F-PE-TIMEINT05 variable-step BDF2

on:
  push:
    branches:
      - work/f-pe-timeint05-variable-bdf2
    paths:
      - 'docs/performance/F-PE-TIMEINT05_PREREGISTRATION.md'
      - 'tests/fpe/materialize_fpe_timeint05_variable_bdf2.py'
      - 'tests/fpe/test_fpe_timeint05_variable_bdf2.f90'
      - 'tests/fpe/run_fpe_timeint05.py'
      - 'tests/fpe/run_fpe_timeint05.sh'
      - '.github/workflows/f-pe-timeint05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered variable-step BDF2 qualification
        run: bash tests/fpe/run_fpe_timeint05.sh
