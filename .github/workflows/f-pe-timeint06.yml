name: F-PE-TIMEINT06 BDF2 error estimator

on:
  push:
    branches:
      - work/f-pe-timeint06-bdf2-error-estimator
    paths:
      - 'docs/performance/F-PE-TIMEINT06_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint06_error_estimator.f90'
      - 'tests/fpe/run_fpe_timeint06.py'
      - 'tests/fpe/run_fpe_timeint06.sh'
      - '.github/workflows/f-pe-timeint06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered estimator characterization
        run: bash tests/fpe/run_fpe_timeint06.sh
