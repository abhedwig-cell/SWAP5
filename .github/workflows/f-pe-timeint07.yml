name: F-PE-TIMEINT07 third-difference BDF2 LTE

on:
  push:
    branches:
      - work/f-pe-timeint07-third-difference-lte
    paths:
      - 'docs/performance/F-PE-TIMEINT07_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint07_third_difference.f90'
      - 'tests/fpe/run_fpe_timeint07.py'
      - 'tests/fpe/run_fpe_timeint07.sh'
      - '.github/workflows/f-pe-timeint07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered third-difference LTE study
        run: bash tests/fpe/run_fpe_timeint07.sh
