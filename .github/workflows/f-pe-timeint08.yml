name: F-PE-TIMEINT08 linearized BDF2 LTE response

on:
  push:
    branches:
      - work/f-pe-timeint08-linearized-lte-response
    paths:
      - 'docs/performance/F-PE-TIMEINT08_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint08_linearized_response.f90'
      - 'tests/fpe/run_fpe_timeint08.py'
      - 'tests/fpe/run_fpe_timeint08.sh'
      - '.github/workflows/f-pe-timeint08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered linearized response estimator
        run: bash tests/fpe/run_fpe_timeint08.sh
