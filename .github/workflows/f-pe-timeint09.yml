name: F-PE-TIMEINT09 final-Newton BDF2 response

on:
  push:
    branches:
      - work/f-pe-timeint09-final-newton-response
    paths:
      - 'docs/performance/F-PE-TIMEINT09_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint09_final_newton_response.f90'
      - 'tests/fpe/run_fpe_timeint09.py'
      - 'tests/fpe/run_fpe_timeint09.sh'
      - '.github/workflows/f-pe-timeint09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run preregistered final-Newton response estimator
        run: bash tests/fpe/run_fpe_timeint09.sh
