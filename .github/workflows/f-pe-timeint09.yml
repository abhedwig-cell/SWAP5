name: F-PE-TIMEINT09 exact Newton response

on:
  push:
    branches:
      - work/f-pe-timeint09-exact-newton-response
    paths:
      - 'docs/performance/F-PE-TIMEINT09_PREREGISTRATION.md'
      - 'docs/performance/F-PE-TIMEINT09_RESULT.md'
      - 'docs/performance/F-PE-TIMEINT09A_PREREGISTRATION.md'
      - 'tests/fpe/materialize_fpe_timeint09_binding.py'
      - 'tests/fpe/test_fpe_timeint09_exact_newton_response.f90'
      - 'tests/fpe/run_fpe_timeint09.py'
      - 'tests/fpe/run_fpe_timeint09.sh'
      - '.github/workflows/f-pe-timeint09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run exact Newton response calibration
        run: bash tests/fpe/run_fpe_timeint09.sh p0

  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run exact Newton response blind holdout
        run: bash tests/fpe/run_fpe_timeint09.sh holdout
