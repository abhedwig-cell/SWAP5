name: F-PE-TIMEINT12 dynamic-top BDF2 fallback

on:
  push:
    branches:
      - work/f-pe-timeint12-dyntop-bdf2-fallback
    paths:
      - 'docs/performance/F-PE-TIMEINT12_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint12_dyntop_bdf2.f90'
      - 'tests/fpe/run_fpe_timeint12.py'
      - 'tests/fpe/run_fpe_timeint12.sh'
      - '.github/workflows/f-pe-timeint12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run dynamic-top BDF2 transition fallback study
        run: bash tests/fpe/run_fpe_timeint12.sh
