name: F-PE-TIMEINT13 extrapolated-K BDF2

on:
  push:
    branches:
      - work/f-pe-timeint13-extrapolated-k-bdf2
    paths:
      - 'docs/performance/F-PE-TIMEINT13_PREREGISTRATION.md'
      - 'tests/fpe/materialize_fpe_timeint13_kpred.py'
      - 'tests/fpe/test_fpe_timeint13_kpred_bdf2.f90'
      - 'tests/fpe/run_fpe_timeint13.py'
      - 'tests/fpe/run_fpe_timeint13.sh'
      - '.github/workflows/f-pe-timeint13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smooth-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run smooth predicted-K BDF2 order study
        run: bash tests/fpe/run_fpe_timeint13.sh
