name: F-PE-TIMEINT15 conservative trapezoidal one-step

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
  push:
    branches:
      - work/f-pe-timeint15-conservative-trapezoidal
    paths:
      - 'docs/performance/F-PE-TIMEINT15_PREREGISTRATION.md'
      - 'docs/performance/F-PE-TIMEINT15_LITERATURE.md'
      - 'tests/fpe/materialize_fpe_timeint15_trapezoid.py'
      - 'tests/fpe/test_fpe_timeint15_trapezoid.f90'
      - 'tests/fpe/run_fpe_timeint15.py'
      - 'tests/fpe/run_fpe_timeint15.sh'
      - '.github/workflows/f-pe-timeint15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smooth-mechanism:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run conservative trapezoidal qualification
        run: bash tests/fpe/run_fpe_timeint15.sh
