name: F-PE-TIMEINT16 moisture Thomas-Gladwell

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
  push:
    branches:
      - work/f-pe-timeint16-thomas-gladwell
    paths:
      - 'docs/performance/F-PE-TIMEINT16_PREREGISTRATION.md'
      - 'tests/fpe/materialize_fpe_timeint16_origin_capture.py'
      - 'tests/fpe/test_fpe_timeint16_inverse.f90'
      - 'tests/fpe/run_fpe_timeint16_inverse.py'
      - 'tests/fpe/run_fpe_timeint16_inverse.sh'
      - 'tests/fpe/test_fpe_timeint16_thomas_gladwell.f90'
      - 'tests/fpe/run_fpe_timeint16.py'
      - 'tests/fpe/run_fpe_timeint16.sh'
      - 'docs/performance/F-PE-TIMEINT16B_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint16b_startup.f90'
      - 'tests/fpe/run_fpe_timeint16b.py'
      - 'tests/fpe/run_fpe_timeint16b.sh'
      - 'docs/performance/F-PE-TIMEINT16C_PREREGISTRATION.md'
      - 'tests/fpe/test_fpe_timeint16c_kpred_stage.f90'
      - 'tests/fpe/run_fpe_timeint16c.py'
      - 'tests/fpe/run_fpe_timeint16c.sh'
      - '.github/workflows/f-pe-timeint16.yml'
  workflow_dispatch:

concurrency:
  group: f-pe-timeint16-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inverse-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Qualify exact test-bank retention inverse
        run: bash tests/fpe/run_fpe_timeint16_inverse.sh

  smooth-mechanism:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run moisture Thomas-Gladwell qualification
        run: bash tests/fpe/run_fpe_timeint16.sh

  startup-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run TG event-startup attribution
        run: bash tests/fpe/run_fpe_timeint16b.sh

  provider-consistent-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run provider-consistent TG staging qualification
        run: bash tests/fpe/run_fpe_timeint16c.sh
