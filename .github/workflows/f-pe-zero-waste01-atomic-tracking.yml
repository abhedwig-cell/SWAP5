name: F-PE-ZERO-WASTE01 atomic tracking

on:
  pull_request:
    paths:
      - 'tests/fpe/test_fpe_zero_waste01_atomic_tracking.f90'
      - 'tests/fpe/run_fpe_zero_waste01_atomic_tracking.sh'
      - '.github/workflows/f-pe-zero-waste01-atomic-tracking.yml'
  workflow_dispatch:

jobs:
  atomic-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Measure serialized concurrency counter overhead
        run: bash tests/fpe/run_fpe_zero_waste01_atomic_tracking.sh
