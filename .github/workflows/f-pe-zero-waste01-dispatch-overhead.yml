name: F-PE-ZERO-WASTE01 dispatch overhead

on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_runtime_core.f90'
      - 'src/runtime/mod_fmr_serialized_multiswap_runtime.f90'
      - 'tests/fpe/test_fpe_zero_waste01_dispatch_overhead.f90'
      - 'tests/fpe/run_fpe_zero_waste01_dispatch_overhead.sh'
      - '.github/workflows/f-pe-zero-waste01-dispatch-overhead.yml'
  workflow_dispatch:

jobs:
  dispatch-overhead:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: gfortran --version
      - name: Profile serialized MultiSWAP metadata overhead
        run: bash tests/fpe/run_fpe_zero_waste01_dispatch_overhead.sh
