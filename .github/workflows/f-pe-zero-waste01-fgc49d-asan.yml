name: F-PE-ZERO-WASTE01 FGC49D ASan diagnosis

on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_groundwater_application_context.f90'
      - 'src/runtime/mod_fmr_groundwater_participant_registry.f90'
      - 'src/runtime/mod_fmr_groundwater_swap_participant.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/adapter/mod_fmr_groundwater_application_c_api.f90'
      - 'src/adapter/fmr_groundwater_application_runtime.py'
      - 'tests/fgc/run_fgc49d_production_application_context.sh'
      - 'tests/fgc/test_fgc49d_production_application_context.py'
      - 'tests/fpe/run_fpe_zero_waste01_fgc49d_asan.sh'
      - '.github/workflows/f-pe-zero-waste01-fgc49d-asan.yml'
  workflow_dispatch:

jobs:
  asan-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy
      - name: Run FGC49D with ASan/UBSan
        run: bash tests/fpe/run_fpe_zero_waste01_fgc49d_asan.sh
