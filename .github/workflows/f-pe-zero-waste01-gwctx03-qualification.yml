name: F-PE-ZERO-WASTE01 GWCTX03 qualification

on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_groundwater_application_context.f90'
      - 'tests/fpe/test_fpe_zero_waste01_gwplan01.f90'
      - '.github/workflows/f-pe-zero-waste01-gwctx03-qualification.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy
      - name: F-GC49D production application context
        run: bash tests/fgc/run_fgc49d_production_application_context.sh
      - name: PPA-WU01 production bootstrap
        run: bash tests/fapp/run_ppa_wu01_production_application_bootstrap.sh
      - name: GWCTX03 compact cell measurement
        run: bash tests/fpe/run_fpe_zero_waste01_gwplan01.sh
