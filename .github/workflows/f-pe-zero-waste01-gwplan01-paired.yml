name: F-PE-ZERO-WASTE01 GWPLAN01 isolated paired

on:
  pull_request:
    paths:
      - 'src/runtime/mod_groundwater_application_plan.f90'
      - 'tests/fgc/test_fgc49a_groundwater_application_plan.f90'
      - 'tests/fpe/test_fpe_zero_waste01_gwplan01.f90'
      - 'tests/fpe/run_fpe_zero_waste01_gwplan01.sh'
      - 'tests/fpe/run_fpe_zero_waste01_gwplan01_paired.sh'
      - '.github/workflows/f-pe-zero-waste01-gwplan01-paired.yml'
  workflow_dispatch:

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Qualify F-GC49A application plan semantics
        run: bash tests/fgc/run_fgc49a_groundwater_application_plan.sh
      - name: Compare exact parent and candidate on one runner
        run: bash tests/fpe/run_fpe_zero_waste01_gwplan01_paired.sh
