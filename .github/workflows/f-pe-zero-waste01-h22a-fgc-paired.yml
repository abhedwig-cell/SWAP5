name: F-PE-ZERO-WASTE01 H22A FGC paired diagnosis

on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_groundwater_swap_participant.f90'
      - 'src/runtime/mod_fmr_groundwater_participant_registry.f90'
      - 'src/runtime/mod_fmr_production_application_bootstrap.f90'
      - 'tests/fgc/run_fgc49d_production_application_context.sh'
      - 'tests/fgc/test_fgc49d_production_application_context.py'
      - 'tests/fpe/run_fpe_zero_waste01_h22a_fgc_paired.sh'
      - '.github/workflows/f-pe-zero-waste01-h22a-fgc-paired.yml'
  workflow_dispatch:

jobs:
  paired-fgc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python dependency
        run: python3 -m pip install numpy
      - name: Compare pre-H22A and current FGC49D
        run: bash tests/fpe/run_fpe_zero_waste01_h22a_fgc_paired.sh
