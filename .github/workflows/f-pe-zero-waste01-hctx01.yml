name: F-PE-ZERO-WASTE01 H-CTX01 transaction context

on:
  pull_request:
    paths:
      - 'src/transaction/mod_transaction_reference.f90'
      - 'tests/transaction/test_transaction_attempt_context.f90'
      - 'tests/fpe/run_fpe_zero_waste01_hctx01.sh'
      - '.github/workflows/f-pe-zero-waste01-hctx01.yml'
  workflow_dispatch:

jobs:
  transaction-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qualify H-CTX01 transaction context
        run: bash tests/fpe/run_fpe_zero_waste01_hctx01.sh
