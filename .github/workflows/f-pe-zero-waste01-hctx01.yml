name: F-PE-ZERO-WASTE01 H-CTX01 transaction context

on:
  pull_request:
    paths:
      - 'src/transaction/mod_transaction_reference.f90'
      - 'tests/transaction/test_transaction_attempt_context.f90'
      - 'tests/fci/run_fci08_gate.sh'
      - '.github/workflows/f-pe-zero-waste01-hctx01.yml'
  workflow_dispatch:

jobs:
  transaction-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qualify F-CI08 transaction context
        run: bash tests/fci/run_fci08_gate.sh
