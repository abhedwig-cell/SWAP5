name: F-PE-ZERO-WASTE01 HDIR03A conductivity demand

on:
  pull_request:
    paths:
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'tests/fpe/run_fpe_zero_waste01_hdir03a.sh'
      - '.github/workflows/f-pe-zero-waste01-hdir03a.yml'
  workflow_dispatch:

jobs:
  paired-directional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pair base-state K-only directional service
        run: bash tests/fpe/run_fpe_zero_waste01_hdir03a.sh
