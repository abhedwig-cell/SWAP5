name: F-PE-ZERO-WASTE01 HDIR04 ownership transfer

on:
  pull_request:
    paths:
      - 'src/transaction/mod_accepted_trajectory_directional_sensitivity.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpe/test_fpe_zero_waste01_hdir04_consuming_stage.f90'
      - 'tests/fpe/run_fpe_zero_waste01_hdir04.sh'
      - '.github/workflows/f-pe-zero-waste01-hdir04.yml'
  workflow_dispatch:

jobs:
  ownership-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Qualify and time consuming trajectory ownership
        run: bash tests/fpe/run_fpe_zero_waste01_hdir04.sh
