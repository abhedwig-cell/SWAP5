name: F-PE-ZERO-WASTE01 HDIR05 isolated paired

on:
  pull_request:
    paths:
      - 'src/solver/mod_b110_default_mvg_directional_provider.f90'
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'tests/fpe/run_fpe_zero_waste01_hdir05_paired.sh'
      - 'tests/fpe/run_fpe_zero_waste01_paired_runtime.sh'
      - '.github/workflows/f-pe-zero-waste01-hdir05-paired.yml'
  workflow_dispatch:

jobs:
  hdir05-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolate HDIR05 accepted-state theta-only effect
        run: bash tests/fpe/run_fpe_zero_waste01_hdir05_paired.sh
