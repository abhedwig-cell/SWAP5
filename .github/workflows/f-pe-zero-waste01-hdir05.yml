name: F-PE-ZERO-WASTE01 HDIR05 theta-only prototype

on:
  pull_request:
    paths:
      - 'src/solver/mod_b110_default_mvg_directional_provider.f90'
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'tests/fpe/test_fpe_zero_waste01_hdir05_theta_only.f90'
      - 'tests/fpe/run_fpe_zero_waste01_hdir05_theta_only.sh'
      - '.github/workflows/f-pe-zero-waste01-hdir05.yml'
  workflow_dispatch:

jobs:
  theta-only-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Falsify accepted-state theta-only directional path
        run: bash tests/fpe/run_fpe_zero_waste01_hdir05_theta_only.sh
