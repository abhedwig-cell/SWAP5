name: F-PE-ZERO-WASTE01 parameter preprocessing

on:
  pull_request:
    paths:
      - 'src/solver/mod_b110_default_mvg_provider.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpe/test_fpe_zero_waste01_parameter_preprocess.f90'
      - 'tests/fpe/run_fpe_zero_waste01_parameter_preprocess.sh'
      - '.github/workflows/f-pe-zero-waste01-parameter-preprocess.yml'
  workflow_dispatch:

jobs:
  parameter-preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Measure immutable parameter preprocessing
        run: bash tests/fpe/run_fpe_zero_waste01_parameter_preprocess.sh
