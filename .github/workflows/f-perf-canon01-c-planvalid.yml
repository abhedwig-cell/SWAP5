name: F-PERF-CANON01 C PLANVALID01

on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_runtime_core.f90'
      - 'tests/fpe/run_fpe_planvalid01_*.sh'
      - 'tests/fpe/test_fpe_planvalid01_*.f90'
      - '.github/workflows/f-perf-canon01-c-planvalid.yml'
  workflow_dispatch:

jobs:
  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_planvalid01_qualification.sh
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fpe/run_fpe_planvalid01_baseline.sh
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tests/fpe/run_fpe_planvalid01_application_timing.sh
