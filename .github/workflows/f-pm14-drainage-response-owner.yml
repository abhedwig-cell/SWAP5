name: F-PM14 drainage response owner

on:
  push:
    branches:
      - work/f-pm14-drainage-response-runtime-closure
  pull_request:
    paths:
      - 'src/process/mod_drainage*.f90'
      - 'src/runtime/mod_fmr_drainage_response_binding.f90'
      - 'tests/fpm/*fpm14*'
      - '.github/workflows/f-pm14-drainage-response-owner.yml'

jobs:
  response-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run F-PM14 owner response gate
        run: bash tests/fpm/run_fpm14_drainage_response_binding_owner.sh
