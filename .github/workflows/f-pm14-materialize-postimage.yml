name: F-PM14 materialize backend postimage

on:
  push:
    branches:
      - work/f-pm14-drainage-response-runtime-closure

permissions:
  contents: write

concurrency:
  group: f-pm14-materialize-postimage
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact checked backend transform
        run: |
          set -euo pipefail
          python3 tools/fpm14/apply_backend_drainage_response_patch.py
          python3 tools/fpm14/refine_backend_drainage_response_patch.py
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'FPM14_BACKEND_POSTIMAGE_ALREADY_MATERIALIZED=PASS'
            exit 0
          fi
          test "$changed" = 'src/runtime/mod_fmr_serialized_reference_backend.f90'
          git diff --check
      - name: Commit exact backend postimage
        run: |
          set -euo pipefail
          if git diff --quiet -- src/runtime/mod_fmr_serialized_reference_backend.f90; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/mod_fmr_serialized_reference_backend.f90
          test "$(git diff --cached --name-only)" = 'src/runtime/mod_fmr_serialized_reference_backend.f90'
          git commit -m 'feat(F-PM14): materialize qualified drainage response backend postimage'
          git push origin "HEAD:${GITHUB_REF_NAME}"
