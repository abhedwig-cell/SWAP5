name: F-RB01 restricted production baseline v1 release qualification

on:
  push:
    branches:
      - release/f-rb01-restricted-production-baseline-v1
    paths:
      - .github/workflows/f-rb01-release-qualification.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  authority-scope-and-architecture-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Freeze exact scientific source candidate and release-only delta
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=0aeb0a2ed4096e1f9493d3dabc70962ea5270182
          TREE=c77ac75aea522ac20a60da012595af9166efcff6
          SRC=8ceeb70a64012631ebba295f5c045ea908b0681f
          REF=9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          test "$(git rev-parse ${CANDIDATE}^{tree})" = "$TREE"
          test "$(git rev-parse ${CANDIDATE}:src)" = "$SRC"
          test "$(git rev-parse ${CANDIDATE}:reference)" = "$REF"
          test "$(git rev-parse HEAD:src)" = "$SRC"
          test "$(git rev-parse HEAD:reference)" = "$REF"
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          while IFS= read -r path; do
            case "$path" in
              release/f-rb01/*|.github/workflows/f-rb01-release-qualification.yml) ;;
              *) echo "FRB01_RELEASE_DELTA_FAIL unexpected post-freeze path: $path" >&2; exit 101 ;;
            esac
          done < <(git diff --name-only "$CANDIDATE"..HEAD)
          echo FRB01_EXACT_SOURCE_CANDIDATE_LOCK=PASS
          echo FRB01_RELEASE_ONLY_POSTFREEZE_DELTA=PASS
      - name: Validate frozen denominator and all-30 audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          scope=json.loads(Path('release/f-rb01/RESTRICTED_PRODUCTION_BASELINE_V1_SCOPE.json').read_text())
          matrix=json.loads(Path('release/f-rb01/RB1_CAPABILITY_EVIDENCE_MATRIX.json').read_text())
          audit=json.loads(Path('release/f-rb01/RB1_ARCHITECTURE_INVARIANT_AUDIT.json').read_text())
          cand=json.loads(Path('release/f-rb01/RB1_RELEASE_CANDIDATE.json').read_text())
          assert scope['scope_frozen'] is True
          assert scope['required_capability_denominator']==15
          assert len(scope['required_capabilities'])==15
          assert matrix['required_summary']['denominator']==15
          assert matrix['required_summary']['required_gap']==0
          assert matrix['required_summary']['required_pass']==15
          assert audit['summary']['total']==30
          assert audit['summary']['pass']==23
          assert audit['summary']['not_applicable_to_rb1']==7
          assert audit['summary']['fail']==0
          assert cand['candidate_frozen'] is True
          assert cand['RB1_RELEASE_CANDIDATE_SHA']=='0aeb0a2ed4096e1f9493d3dabc70962ea5270182'
          print('FRB01_FIXED_DENOMINATOR=15_PASS')
          print('FRB01_ARCHITECTURE_INVARIANTS=30_AUDITED_0_FAIL_PASS')
          PY
      - name: Bind prior canonical preservation run to exact RB1 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          run=34558475585
          req=urllib.request.Request(
              f'https://api.github.com/repos/abhedwig-cell/SWAP5/actions/runs/{run}',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(req) as response:
              data=json.load(response)
          assert data['head_sha']=='0aeb0a2ed4096e1f9493d3dabc70962ea5270182'
          assert data['conclusion']=='success'
          assert data['name']=='F-CI canonical qualification'
          print('FRB01_EXACT_CANDIDATE_CANONICAL_PRESERVATION_RUN=34558475585_PASS')
          PY

  frozen-core-and-temporal-authorities:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1eceed967b12396b8bbc832f897376378463adce
          fetch-depth: 0
      - name: Replay exact F-CI03 through F-CI18 core authority
        shell: bash
        run: |
          set -euo pipefail
          gfortran --version
          bash tests/fci/run_fci03_gate.sh
          bash tests/fci/run_fci04_gate.sh
          python tools/fci/fci05_b1_10_physical_preimage_gate.py
          bash tests/fci/run_fci06_gate.sh
          bash tests/fci/run_fci07_gate.sh
          bash tests/fci/run_fci08_gate.sh
          bash tests/fci/run_fci09_gate.sh
          bash tests/fci/run_fci10_gate.sh
          bash tests/fci/run_fci11_gate.sh
          bash tests/fci/run_fci12_gate.sh
          bash tests/fci/run_fci13_gate.sh
          bash tests/fci/run_fci14_gate.sh
          bash tests/fci/run_fci15_gate.sh
          bash tests/fci/run_fci16_gate.sh
          bash tests/fci/run_fci17_gate.sh
          bash tests/fci/run_fci18_gate.sh
          echo FRB01_FROZEN_CORE_AUTHORITY_REPLAY=PASS
      - name: Replay frozen restricted temporal authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -f 697755068253cfb5a2f838c63894e1609a85ff51
          gfortran --version
          bash tests/fci/run_fci21_si25_scientific_replay.sh
          bash tests/fci/run_fci21_vq30_heldout_replay.sh
          bash tests/fci/run_fci21_vq31_transaction_history_replay.sh
          bash tests/fci/run_fci21_vq32_head_budget_normalization_replay.sh
          bash tests/fci/run_fci21_vq34_remediated_certificate_replay.sh
          echo FRB01_FROZEN_TEMPORAL_AUTHORITY_REPLAY=PASS

  frozen-process-authorities:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e900e6115a6bf8b65af8460eb3e336257be4d1bf
          fetch-depth: 0
      - name: Replay exact serialized ET and root attribution authority
        shell: bash
        run: |
          set -euo pipefail
          gfortran --version
          bash tests/fci/run_fci34_fmr31_root_attribution_canonical_admission.sh
          echo FRB01_FROZEN_SERIAL_ET_ROOT_AUTHORITY=PASS
      - name: Replay exact final parallel root uptake authority
        env:
          FCI37_EVIDENCE_DIR: _frb01_fci37_frozen_evidence
        shell: bash
        run: |
          set -euo pipefail
          git checkout -f 85e17bb7ca26d2df070f99b2bf16ecf0abebec19
          bash tests/fci/run_fci37_fmr35_parallel_root_uptake_canonical_admission.sh
          echo FRB01_FROZEN_PARALLEL_ROOT_AUTHORITY=PASS
      - name: Replay exact effective forcing executor authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -f d81ef430ebaa601469a165dfc5b9866b813b71aa
          bash tests/fci/run_fci40_fmr38_effective_forcing_executor_canonical_admission_v2.sh
          echo FRB01_FROZEN_EFFECTIVE_FORCING_AUTHORITY=PASS

  current-candidate-integrated-replays:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind worktree to exact frozen source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 8ceeb70a64012631ebba295f5c045ea908b0681f
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          gfortran --version
          echo FRB01_CURRENT_CANDIDATE_SOURCE_BINDING=PASS
      - name: Current surface evaporation O0 O2 determinism and immutability
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fpe/run_fpe11_surface_evaporation_allocation_qualification.sh
          echo FRB01_CURRENT_SURFACE_EVAPORATION_REPLAY=PASS
      - name: Current parallel committed-boundary restart attack
        shell: bash
        run: |
          set -euo pipefail
          QUAL=5ea88d81a63e6c706c87e99ac360f91f08711fc1
          mkdir -p integration/f-mq
          git show "$QUAL:integration/f-mq/F-MQ29_CANDIDATE_LOCK.json" > integration/f-mq/F-MQ29_CANDIDATE_LOCK.json
          git show "$QUAL:integration/f-mq/F-MQ29_QUALIFICATION_MATRIX.json" > integration/f-mq/F-MQ29_QUALIFICATION_MATRIX.json
          git show "$QUAL:tests/fmq/run_fmq29_parallel_committed_restart_qualification.sh" > /tmp/frb01-fmq29-current.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/frb01-fmq29-current.sh')
          s=p.read_text()
          def one(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'FRB01 FMQ29 adapter {label}: expected 1, found {n}')
              s=s.replace(old,new,1)
          one('ROOT="$(cd "$(dirname "$0")/../.." && pwd)"','ROOT="$(pwd)"','root')
          one("git diff --quiet \"$BASE\"..HEAD -- src reference || fail 'F-MQ29 qualification mutated production/reference source'","test \"$(git rev-parse HEAD:src)\" = 8ceeb70a64012631ebba295f5c045ea908b0681f || fail 'RB1 current src tree drift'","source lock")
          one('check_blob src/runtime/mod_fmr_serialized_multiswap_runtime.f90 fe5a06c9af59308cdad86c5126379f413591b0cd','check_blob src/runtime/mod_fmr_serialized_multiswap_runtime.f90 f06a2eef7b47880e449cf9b201342d7bd1e197e1','effective forcing blob')
          p.write_text(s)
          PY
          chmod +x /tmp/frb01-fmq29-current.sh
          /tmp/frb01-fmq29-current.sh
          rm -rf integration/f-mq /tmp/frb01-fmq29-current.sh
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo FRB01_CURRENT_PARALLEL_RESTART_REPLAY=PASS
      - name: Current root-active serialized versus 2 and 4 worker attack
        shell: bash
        run: |
          set -euo pipefail
          QUAL=48ee2841d783ee023c29391a7ea1e5d7ee0d20e0
          mkdir -p integration/f-mq
          git show "$QUAL:integration/f-mq/F-MQ30_CANDIDATE_LOCK.json" > integration/f-mq/F-MQ30_CANDIDATE_LOCK.json
          git show "$QUAL:integration/f-mq/F-MQ30_QUALIFICATION_MATRIX.json" > integration/f-mq/F-MQ30_QUALIFICATION_MATRIX.json
          git show "$QUAL:tests/fmq/run_fmq30_parallel_root_uptake_qualification.sh" > /tmp/frb01-fmq30-current.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/frb01-fmq30-current.sh')
          s=p.read_text()
          def one(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'FRB01 FMQ30 adapter {label}: expected 1, found {n}')
              s=s.replace(old,new,1)
          one('ROOT="$(cd "$(dirname "$0")/../.." && pwd)"','ROOT="$(pwd)"','root')
          lines=s.splitlines()
          idx=next(i for i,line in enumerate(lines) if line.startswith('[[ ${#src_delta[@]} -eq 1'))
          assert lines[idx+1].lstrip().startswith('fail "unexpected qualification source delta:')
          lines[idx:idx+2]=[
              '[[ "$(git rev-parse HEAD:src)" == "8ceeb70a64012631ebba295f5c045ea908b0681f" ]] || fail "RB1 current src tree drift"',
              "echo 'FRB01_FMQ30_CURRENT_SOURCE_TREE_LOCK=PASS'"
          ]
          s='\n'.join(lines)+'\n'
          one('check_blob src/runtime/mod_fmr_serialized_multiswap_runtime.f90 fe5a06c9af59308cdad86c5126379f413591b0cd','check_blob src/runtime/mod_fmr_serialized_multiswap_runtime.f90 f06a2eef7b47880e449cf9b201342d7bd1e197e1','effective forcing blob')
          lines=s.splitlines()
          idx=next(i for i,line in enumerate(lines) if "one('program test_fmq26_parallel_v1_admission'" in line)
          assert "one('end program test_fmq26_parallel_v1_admission'" in lines[idx+1]
          lines[idx],lines[idx+1]=lines[idx+1],lines[idx]
          s='\n'.join(lines)+'\n'
          p.write_text(s)
          PY
          chmod +x /tmp/frb01-fmq30-current.sh
          /tmp/frb01-fmq30-current.sh
          rm -rf integration/f-mq /tmp/frb01-fmq30-current.sh
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo FRB01_CURRENT_ROOT_ACTIVE_SERIAL_PARALLEL_REPLAY=PASS
      - name: Clean current-candidate release composition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 8ceeb70a64012631ebba295f5c045ea908b0681f
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          test -z "$(git status --porcelain)"
          echo FRB01_CURRENT_CANDIDATE_INTEGRATED_REPLAYS=PASS

  decisive-release-gate:
    needs:
      - authority-scope-and-architecture-lock
      - frozen-core-and-temporal-authorities
      - frozen-process-authorities
      - current-candidate-integrated-replays
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final fixed-denominator release gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 8ceeb70a64012631ebba295f5c045ea908b0681f
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          python3 - <<'PY'
          import json
          from pathlib import Path
          matrix=json.loads(Path('release/f-rb01/RB1_CAPABILITY_EVIDENCE_MATRIX.json').read_text())
          audit=json.loads(Path('release/f-rb01/RB1_ARCHITECTURE_INVARIANT_AUDIT.json').read_text())
          assert matrix['required_summary']['denominator']==15
          assert matrix['required_summary']['required_pass']==15
          assert matrix['required_summary']['required_gap']==0
          assert audit['summary']['fail']==0
          PY
          echo FRB01_HARD_MASS=PASS_BY_DECISIVE_REPLAYS
          echo FRB01_TRANSACTIONALITY=PASS_BY_DECISIVE_REPLAYS
          echo FRB01_RESTART=PASS_BY_CURRENT_CANDIDATE_FMQ29_REPLAY
          echo FRB01_STANDALONE_SERIAL_PARALLEL_EQUIVALENCE=PASS_BY_FROZEN_AND_CURRENT_REPLAYS
          echo FRB01_NEGATIVE_FAIL_CLOSED=PASS_BY_CURRENT_CANDIDATE_FMQ29_FMQ30_REPLAYS
          echo FRB01_O0_O2=PASS_BY_TEMPORAL_SURFACE_RESTART_ROOT_REPLAYS
          echo FRB01_FIXED_DENOMINATOR_REQUIRED_CAPABILITIES=15_OF_15_PASS
          echo FRB01_DECISIVE_RELEASE_QUALIFICATION=PASS
