name: F-ROM-LARE BC1 prescribed-head reduced dynamics

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC1_STAGE_B_PREREGISTRATION.json'
      - 'tests/rom/run_lare_bc1_stage_b.py'
      - '.github/workflows/f-rom-lare-bc1-stage-b.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover qualified RS1-GW Stage-A Reference trajectories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc1-b
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10585316225/zip" > /tmp/lare-bc1-b/stage-a.zip
          echo "a62963c801ffa325d1f12a4314dd703c766f7db4669a33c1ef62f9da6eac45c0  /tmp/lare-bc1-b/stage-a.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc1-b/stage-a.zip -d /tmp/lare-bc1-b/stage-a
          echo "7d92c4524d16836a25200851ce560b041971d05f65256785e8cf1ef59ae0b345  /tmp/lare-bc1-b/stage-a/o0.txt" | sha256sum -c -

      - name: Execute no-fit prescribed-head D3/D4 dynamics
        run: |
          python3 tests/rom/run_lare_bc1_stage_b.py \
            --reference /tmp/lare-bc1-b/stage-a/o0.txt \
            --prereg integration/f-rom/LARE_BC1_STAGE_B_PREREGISTRATION.json \
            --output /tmp/lare-bc1-b/LARE_BC1_STAGE_B_RESULT.json \
            | tee /tmp/lare-bc1-b/analyzer.txt
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lare-bc1-b/LARE_BC1_STAGE_B_RESULT.json'))
          assert r['decision'] in {
            'BC1_CURRENT_LAYER_RELATIVE_SUPPORT',
            'BC1_BOUNDARY_FACE_RELATIVE_SUPPORT',
            'BC1_MIXED_NO_RELATIVE_SELECTION',
            'BC1_BOTH_DYNAMICS_BLOCKED',
            'BC1_REFERENCE_OR_DOMAIN_INSUFFICIENT',
          }
          assert r['application_acceptance_adjudicated'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC1_STAGE_B_FIREWALL=PASS')
          PY
          sha256sum /tmp/lare-bc1-b/LARE_BC1_STAGE_B_RESULT.json /tmp/lare-bc1-b/analyzer.txt > /tmp/lare-bc1-b/sha256.txt

      - name: Upload BC1-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc1-stage-b
          path: /tmp/lare-bc1-b/
          if-no-files-found: warn
