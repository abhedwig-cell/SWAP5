name: F-ROM-LARE BC2-B9 enriched-state internal flux

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_B9_PREREGISTRATION.json'
      - 'integration/f-rom/LARE_BC2_B8_RESULT.json'
      - 'tests/rom/analyze_lare_bc2_b9_internal_flux.py'
      - '.github/workflows/f-rom-lare-bc2-b9.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Recover qualified BC2-A2 Reference geometry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-b9/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-b9/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-b9/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-b9/a2.zip -d /tmp/lare-bc2-b9/a2
          cmp /tmp/lare-bc2-b9/a2/o0.txt /tmp/lare-bc2-b9/a2/o2.txt
      - name: Execute enriched-state internal-flux diagnostic
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_B9_EVIDENCE
          python3 tests/rom/analyze_lare_bc2_b9_internal_flux.py \
            --reference /tmp/lare-bc2-b9/a2/o0.txt \
            --prereg integration/f-rom/LARE_BC2_B9_PREREGISTRATION.json \
            --b7-result integration/f-rom/LARE_BC2_B7_RESULT.json \
            --b8-result integration/f-rom/LARE_BC2_B8_RESULT.json \
            --output LARE_BC2_B9_EVIDENCE/LARE_BC2_B9_RESULT.json \
            | tee LARE_BC2_B9_EVIDENCE/analyzer.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_B9_EVIDENCE/LARE_BC2_B9_RESULT.json'))
          assert r['decision'] in {
              'BC2_B9_ENRICHED_STATE_QI_CLOSURE_SUPPORTED',
              'BC2_B9_ENRICHED_STATE_QI_CLOSURE_SUPPORTED_OPERATOR_OR_WIDTH_UNRESOLVED',
              'BC2_B9_ENRICHED_STATE_QI_DIRECTION_DEPENDENT',
              'BC2_B9_ENRICHED_STATE_QI_NOT_SUPPORTED',
              'BC2_B9_ENRICHED_STATE_QI_DIAGNOSTIC_BLOCKED',
          }
          assert r['propagated_dynamics_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_B9_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_B9_EVIDENCE/* > LARE_BC2_B9_EVIDENCE/sha256.txt
      - name: Upload BC2-B9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-b9
          path: LARE_BC2_B9_EVIDENCE/
          if-no-files-found: warn
