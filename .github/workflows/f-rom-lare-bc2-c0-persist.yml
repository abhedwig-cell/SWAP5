name: F-ROM-LARE persist BC2-C0 result

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c0-persist.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover qualified C0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c0
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587324672/zip" > /tmp/lare-bc2-c0/c0.zip
          echo "4f9608cbbe147a17c989b32c74e56d7399e461e86758c930ff4d31a085f756fc  /tmp/lare-bc2-c0/c0.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c0/c0.zip -d /tmp/lare-bc2-c0
          echo "94e28ab6546bbb4f7cfc0d903bf6cef9041f83742499b19ee8e9b0eef5e0545d  /tmp/lare-bc2-c0/LARE_BC2_C0_RESULT.json" | sha256sum -c -

      - name: Validate C0 scientific disposition
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lare-bc2-c0/LARE_BC2_C0_RESULT.json'))
          assert r['decision']=='BC2_C0_ENRICHED_DYNAMICS_MIXED_RESPONSE'
          assert r['hard_checks']['all_primary_histories_qualified'] is True
          assert r['hard_checks']['max_abs_physical_moving_ledger_residual_cm'] <= 1e-10
          assert r['supported_widths_cm']==[]
          assert r['groundwater_feedback_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C0_RESULT_VALIDATION=PASS')
          PY

      - name: Persist exact C0 result
        run: |
          set -euo pipefail
          cp /tmp/lare-bc2-c0/LARE_BC2_C0_RESULT.json integration/f-rom/LARE_BC2_C0_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C0_RESULT.json
          git diff --cached --check
          git commit -m "F-ROM-LARE: persist BC2-C0 enriched dynamics result"
          git push origin HEAD:work/f-rom-lare-rs1
