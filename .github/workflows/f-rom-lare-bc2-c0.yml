name: F-ROM-LARE BC2-C0 enriched prescribed-H dynamics

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C0_PREREGISTRATION.json'
      - 'integration/f-rom/LARE_BC2_B9_RESULT.json'
      - 'tests/rom/run_lare_bc2_c0_enriched_dynamics.py'
      - '.github/workflows/f-rom-lare-bc2-c0.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Recover qualified BC2-A2 Reference geometry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c0/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c0/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c0/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c0/a2.zip -d /tmp/lare-bc2-c0/a2
          cmp /tmp/lare-bc2-c0/a2/o0.txt /tmp/lare-bc2-c0/a2/o2.txt
      - name: Execute enriched prescribed-H dynamics
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C0_EVIDENCE
          python3 tests/rom/run_lare_bc2_c0_enriched_dynamics.py \
            --reference /tmp/lare-bc2-c0/a2/o0.txt \
            --prereg integration/f-rom/LARE_BC2_C0_PREREGISTRATION.json \
            --b0-result integration/f-rom/LARE_BC2_B0_RESULT.json \
            --b7-result integration/f-rom/LARE_BC2_B7_RESULT.json \
            --b8-result integration/f-rom/LARE_BC2_B8_RESULT.json \
            --b9-result integration/f-rom/LARE_BC2_B9_RESULT.json \
            --output LARE_BC2_C0_EVIDENCE/LARE_BC2_C0_RESULT.json \
            | tee LARE_BC2_C0_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C0_EVIDENCE/LARE_BC2_C0_RESULT.json'))
          assert r['decision'] in {
              'BC2_C0_ENRICHED_PRESCRIBED_H_DYNAMICS_SUPPORTED',
              'BC2_C0_ENRICHED_PRESCRIBED_H_DYNAMICS_SUPPORTED_WIDTH_UNRESOLVED',
              'BC2_C0_ENRICHED_DYNAMICS_MIXED_RESPONSE',
              'BC2_C0_ENRICHED_DYNAMICS_OUTSIDE_DOMAIN',
              'BC2_C0_ENRICHED_DYNAMICS_NUMERICALLY_BLOCKED',
          }
          assert r['groundwater_feedback_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C0_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C0_EVIDENCE/* > LARE_BC2_C0_EVIDENCE/sha256.txt
      - name: Upload BC2-C0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c0
          path: LARE_BC2_C0_EVIDENCE/
          if-no-files-found: warn
