name: F-ROM-LARE BC2-C1 adjudicate completed shards

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c1-adjudicate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover completed C1 case artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35455937057
          pattern: lare-bc2-c1-case-*
          path: /tmp/lare-bc2-c1-cases
          merge-multiple: true

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c1-adjudicate/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c1-adjudicate/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c1-adjudicate/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c1-adjudicate/a2.zip -d /tmp/lare-bc2-c1-adjudicate/a2
          cmp /tmp/lare-bc2-c1-adjudicate/a2/o0.txt /tmp/lare-bc2-c1-adjudicate/a2/o2.txt

      - name: Aggregate completed C1 cases
        run: |
          set +e
          mkdir -p LARE_BC2_C1_EVIDENCE
          python3 tests/rom/aggregate_lare_bc2_c1_cases.py \
            --cases-dir /tmp/lare-bc2-c1-cases \
            --reference /tmp/lare-bc2-c1-adjudicate/a2/o0.txt \
            --prereg integration/f-rom/LARE_BC2_C1_PREREGISTRATION.json \
            --c0-result integration/f-rom/LARE_BC2_C0_RESULT.json \
            --output LARE_BC2_C1_EVIDENCE/LARE_BC2_C1_RESULT.json \
            | tee LARE_BC2_C1_EVIDENCE/runner.txt
          rc=${PIPESTATUS[0]}
          set -e
          [[ "$rc" -eq 2 ]] || { echo "expected preregistered diagnostic-blocked exit 2, got $rc" >&2; exit 1; }

          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C1_EVIDENCE/LARE_BC2_C1_RESULT.json'))
          assert r['decision']=='BC2_C1_DIAGNOSTIC_BLOCKED'
          h=r['hard_checks']
          assert h['all_primary_and_cross_routes_qualified'] is False
          assert h['all_primary_and_cross_routes_hard_gated'] is True
          assert h['all_reference_projections_finite'] is True
          assert h['failure_count']==1
          assert h['max_additive_or_ledger_residual_across_primary_and_cross'] <= h['gate']
          failures=r['failures']
          assert len(failures)==1
          key,msg=next(iter(failures.items()))
          assert key=='2.5:WT_CYCLE:0.00010000', (key,msg)
          assert 'OUTSIDE_QUALIFIED_DOMAIN' in msg, msg
          # The cross route remains scientifically interpretable but cannot
          # replace the preregistered primary route inside C1.
          row=r['cases']['2.5']['WT_CYCLE']
          assert '0.00005000' in row and '0.00010000' not in row
          assert r['next_model_change_authorized'] is False
          assert r['groundwater_feedback_authorized'] is False
          assert r['application_acceptance_adjudicated'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C1_BLOCKED_ADJUDICATION=PASS')
          PY
          sha256sum LARE_BC2_C1_EVIDENCE/* > LARE_BC2_C1_EVIDENCE/sha256.txt

      - name: Upload adjudicated C1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c1-adjudicated
          path: LARE_BC2_C1_EVIDENCE/
          if-no-files-found: error
