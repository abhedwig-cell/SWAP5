name: F-ROM-LARE persist blocked C1 result

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c1-result-persist.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover blocked C1 adjudication artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c1-result
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10588038312/zip" > /tmp/lare-bc2-c1-result/result.zip
          echo "712b406ae8edf1ea9dce63fbcd30a323246a28f0d98b2c3fc1ff5a1d1a612af0  /tmp/lare-bc2-c1-result/result.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c1-result/result.zip -d /tmp/lare-bc2-c1-result

      - name: Validate negative C1 authority
        run: |
          python3 - <<'PY'
          import json
          p='/tmp/lare-bc2-c1-result/LARE_BC2_C1_RESULT.json'
          r=json.load(open(p))
          assert r['decision']=='BC2_C1_DIAGNOSTIC_BLOCKED'
          assert r['complete'] is False
          assert r['hard_checks']['all_reference_projections_finite'] is True
          assert r['hard_checks']['failure_count']==1
          assert r['hard_checks']['max_additive_or_ledger_residual_across_primary_and_cross'] <= 1e-10
          assert r['failures']=={
              '2.5:WT_CYCLE:0.00010000':
              'OUTSIDE_QUALIFIED_DOMAIN Se=[0.4725465153356722,1.0000110667249589]'
          }
          assert r['next_model_change_authorized'] is False
          assert r['groundwater_feedback_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C1_BLOCKED_AUTHORITY=PASS')
          PY

      - name: Persist negative C1 result
        run: |
          set -euo pipefail
          cp /tmp/lare-bc2-c1-result/LARE_BC2_C1_RESULT.json integration/f-rom/LARE_BC2_C1_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C1_RESULT.json
          git diff --cached --check
          git commit -m "F-ROM-LARE: persist original C1 diagnostic blocker"
          git push origin HEAD:work/f-rom-lare-rs1
