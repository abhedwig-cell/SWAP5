name: F-ROM-LARE BC2-C1R cross-only recovery

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C1R_PREREGISTRATION.json'
      - 'tests/rom/run_lare_bc2_c1r_cross_only.py'
      - '.github/workflows/f-rom-lare-bc2-c1r-cross-only.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-cross-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c1r-x/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c1r-x/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c1r-x/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c1r-x/a2.zip -d /tmp/lare-bc2-c1r-x/a2
          cmp /tmp/lare-bc2-c1r-x/a2/o0.txt /tmp/lare-bc2-c1r-x/a2/o2.txt

      - name: Execute cross-only recovery
        run: |
          set -euo pipefail
          test -f integration/f-rom/LARE_BC2_C1_RESULT.json
          mkdir -p LARE_BC2_C1R_CROSS_ONLY_EVIDENCE
          python3 tests/rom/run_lare_bc2_c1r_cross_only.py             --reference /tmp/lare-bc2-c1r-x/a2/o0.txt             --prereg integration/f-rom/LARE_BC2_C1R_PREREGISTRATION.json             --c1-result integration/f-rom/LARE_BC2_C1_RESULT.json             --output LARE_BC2_C1R_CROSS_ONLY_EVIDENCE/LARE_BC2_C1R_RESULT.json             | tee LARE_BC2_C1R_CROSS_ONLY_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C1R_CROSS_ONLY_EVIDENCE/LARE_BC2_C1R_RESULT.json'))
          assert r['decision']=='BC2_C1R_NUMERICAL_QUALIFICATION_RECOVERED'
          assert r['complete'] is True
          assert r['execution_route']=='PERSISTED_C1_PRIMARY_PLUS_NEW_CROSS_ONLY'
          assert r['original_C1_primary_failure_retained'] is True
          assert r['hard_checks']['both_routes_qualified'] is True
          assert r['hard_checks']['failure_count']==0
          assert r['hard_checks']['max_additive_or_ledger_residual'] <= r['hard_checks']['gate']
          assert all(r['hard_checks']['classification_match'].values())
          assert r['next_model_change_authorized'] is False
          assert r['groundwater_feedback_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C1R_CROSS_ONLY_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C1R_CROSS_ONLY_EVIDENCE/* > LARE_BC2_C1R_CROSS_ONLY_EVIDENCE/sha256.txt

      - name: Upload cross-only recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c1r-cross-only
          path: LARE_BC2_C1R_CROSS_ONLY_EVIDENCE/
          if-no-files-found: error
