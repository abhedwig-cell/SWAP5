name: F-ROM-LARE BC2-C2A actual drift gain

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C2A_AUTHORITY_BINDING.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  c2a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c2a/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c2a/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c2a/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c2a/a2.zip -d /tmp/lare-bc2-c2a/a2
          cmp /tmp/lare-bc2-c2a/a2/o0.txt /tmp/lare-bc2-c2a/a2/o2.txt

      - name: Execute frozen actual-drift gain diagnostic
        run: |
          set -euo pipefail
          test -f integration/f-rom/LARE_BC2_C1R_RESULT.json
          mkdir -p LARE_BC2_C2A_EVIDENCE
          python3 tests/rom/analyze_lare_bc2_c2a_actual_drift_gain.py \
            --reference /tmp/lare-bc2-c2a/a2/o0.txt \
            --prereg integration/f-rom/LARE_BC2_C2_PREREGISTRATION.json \
            --c1r-result integration/f-rom/LARE_BC2_C1R_RESULT.json \
            --binding integration/f-rom/LARE_BC2_C2A_AUTHORITY_BINDING.json \
            --output LARE_BC2_C2A_EVIDENCE/LARE_BC2_C2A_RESULT.json \
            | tee LARE_BC2_C2A_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C2A_EVIDENCE/LARE_BC2_C2A_RESULT.json'))
          assert r['decision']=='BC2_C2A_ACTUAL_DRIFT_GAIN_MAPPED'
          assert r['complete'] is True
          assert r['diagnostic_B_authorized'] is True
          assert r['next_model_change_authorized'] is False
          assert r['groundwater_feedback_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C2A_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C2A_EVIDENCE/* > LARE_BC2_C2A_EVIDENCE/sha256.txt

      - name: Upload C2A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c2a
          path: LARE_BC2_C2A_EVIDENCE/
          if-no-files-found: error
