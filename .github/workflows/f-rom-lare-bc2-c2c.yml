name: F-ROM-LARE BC2-C2C manifold adjudication

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C2C_AUTHORITY_BINDING.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adjudicate frozen C2 diagnostics
        run: |
          set -euo pipefail
          test -f integration/f-rom/LARE_BC2_C2A_RESULT.json
          test -f integration/f-rom/LARE_BC2_C2B_RESULT.json
          mkdir -p LARE_BC2_C2C_EVIDENCE
          python3 tests/rom/adjudicate_lare_bc2_c2.py \
            --prereg integration/f-rom/LARE_BC2_C2_PREREGISTRATION.json \
            --c2a integration/f-rom/LARE_BC2_C2A_RESULT.json \
            --c2b integration/f-rom/LARE_BC2_C2B_RESULT.json \
            --binding integration/f-rom/LARE_BC2_C2C_AUTHORITY_BINDING.json \
            --output LARE_BC2_C2C_EVIDENCE/LARE_BC2_C2C_RESULT.json \
            | tee LARE_BC2_C2C_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C2C_EVIDENCE/LARE_BC2_C2C_RESULT.json'))
          assert r['decision'] in {
            'MANIFOLD_AMPLIFICATION_SUPPORTED',
            'BIAS_ACCUMULATION_DOMINANT',
            'MIXED_STATE_DYNAMICS',
          }
          assert r['complete'] is True
          assert r['next_model_change_authorized'] is False
          assert r['groundwater_feedback_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C2C_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C2C_EVIDENCE/* > LARE_BC2_C2C_EVIDENCE/sha256.txt

      - name: Upload C2C evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c2c
          path: LARE_BC2_C2C_EVIDENCE/
          if-no-files-found: error
