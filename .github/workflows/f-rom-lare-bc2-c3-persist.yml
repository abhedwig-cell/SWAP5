name: F-ROM-LARE persist BC2-C3 and adjudicate C3A

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c3-persist.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover exact qualified C3 aggregate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c3-persist
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10589232188/zip" > /tmp/lare-bc2-c3-persist/c3.zip
          echo "cfb6a22d82ae094e7d8384b6ea2117cc0ea88aac3aa66b99da86c7d6b63b2b5a  /tmp/lare-bc2-c3-persist/c3.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c3-persist/c3.zip -d /tmp/lare-bc2-c3-persist
          echo "12d99184df2ce8c968a5c9d6894b39bfc41cf1592c271f34c7194abec5f07db0  /tmp/lare-bc2-c3-persist/LARE_BC2_C3_RESULT.json" | sha256sum -c -

      - name: Validate qualified C3 authority
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lare-bc2-c3-persist/LARE_BC2_C3_RESULT.json'))
          assert r['decision']=='BC2_C3_SIGNED_LOCAL_BIAS_LEDGER_MAPPED'
          assert r['complete'] is True
          assert r['hard_checks']['failure_count']==0
          assert r['hard_checks']['all_case_primary_and_cross_routes_qualified'] is True
          assert r['hard_checks']['maximum_recorded_hard_residual_or_identity_error'] <= r['hard_checks']['gate']
          assert r['dynamic_primary_top_family_counts']=={'QH':2,'QI':4}
          assert r['unanimous_dynamic_top_family'] is None
          assert r['next_model_change_authorized'] is False
          assert r['groundwater_feedback_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C3_QUALIFIED_ARTIFACT=PASS')
          PY

      - name: Apply prospectively frozen C3A rule
        run: |
          set -euo pipefail
          python3 tests/rom/adjudicate_lare_bc2_c3.py \
            --c3 /tmp/lare-bc2-c3-persist/LARE_BC2_C3_RESULT.json \
            --prereg integration/f-rom/LARE_BC2_C3_ADJUDICATION_PREREGISTRATION.json \
            --output /tmp/lare-bc2-c3-persist/LARE_BC2_C3A_RESULT.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lare-bc2-c3-persist/LARE_BC2_C3A_RESULT.json'))
          assert r['decision']=='REGIME_DEPENDENT_BIAS_INJECTION'
          assert r['complete'] is True
          assert r['selected_global_family'] is None
          assert r['c4_authority']=='NO_GLOBAL_CLOSURE_CHANGE_NEW_REGIME_PREREGISTRATION_REQUIRED'
          assert r['next_model_change_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C3A_FROZEN_RULE=PASS')
          PY

      - name: Persist C3 and C3A
        run: |
          set -euo pipefail
          cp /tmp/lare-bc2-c3-persist/LARE_BC2_C3_RESULT.json integration/f-rom/LARE_BC2_C3_RESULT.json
          cp /tmp/lare-bc2-c3-persist/LARE_BC2_C3A_RESULT.json integration/f-rom/LARE_BC2_C3A_RESULT.json
          cat > integration/f-rom/LARE_BC2_C3_AUTHORITY_BINDING.json <<'JSON'
          {
            "schema": "swap5.lare.bc2.c3.authority-binding.v1",
            "workstream": "F-ROM-LARE",
            "work_unit": "LARE-BC2-C3",
            "source_workflow_run": 35459217586,
            "source_executed_head": "811fffc9ffb4505b88cbd13ea566999dfd5b8c0b",
            "aggregate_artifact_id": 10589232188,
            "aggregate_artifact_digest": "sha256:cfb6a22d82ae094e7d8384b6ea2117cc0ea88aac3aa66b99da86c7d6b63b2b5a",
            "result_sha256": "12d99184df2ce8c968a5c9d6894b39bfc41cf1592c271f34c7194abec5f07db0",
            "required_decision": "BC2_C3_SIGNED_LOCAL_BIAS_LEDGER_MAPPED",
            "c3a_rule_source": "integration/f-rom/LARE_BC2_C3_ADJUDICATION_PREREGISTRATION.json",
            "c3a_decision": "REGIME_DEPENDENT_BIAS_INJECTION",
            "scientific_effect": "Persists qualified C3 evidence and applies only the prospectively frozen C3A unanimity rule. No model change."
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C3_RESULT.json integration/f-rom/LARE_BC2_C3A_RESULT.json integration/f-rom/LARE_BC2_C3_AUTHORITY_BINDING.json
          git diff --cached --check
          git commit -m "F-ROM-LARE: persist C3 and regime-dependent C3A adjudication"
          git push origin HEAD:work/f-rom-lare-rs1