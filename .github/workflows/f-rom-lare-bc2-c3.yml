name: F-ROM-LARE BC2-C3 signed bias ledger

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C3_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_bc2_c3_signed_bias_case.py'
      - 'tests/rom/aggregate_lare_bc2_c3_cases.py'
      - '.github/workflows/f-rom-lare-bc2-c3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: w2p5_hold, width: 2.5, history: WT_HOLD}
          - {tag: w2p5_rise, width: 2.5, history: WT_RISE}
          - {tag: w2p5_fall, width: 2.5, history: WT_FALL}
          - {tag: w2p5_cycle, width: 2.5, history: WT_CYCLE}
          - {tag: w5_hold, width: 5.0, history: WT_HOLD}
          - {tag: w5_rise, width: 5.0, history: WT_RISE}
          - {tag: w5_fall, width: 5.0, history: WT_FALL}
          - {tag: w5_cycle, width: 5.0, history: WT_CYCLE}
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c3/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c3/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c3/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c3/a2.zip -d /tmp/lare-bc2-c3/a2
          cmp /tmp/lare-bc2-c3/a2/o0.txt /tmp/lare-bc2-c3/a2/o2.txt

      - name: Execute exact signed bias-ledger case
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C3_CASE
          python3 tests/rom/analyze_lare_bc2_c3_signed_bias_case.py \
            --reference /tmp/lare-bc2-c3/a2/o0.txt \
            --prereg integration/f-rom/LARE_BC2_C3_PREREGISTRATION.json \
            --c2-closeout integration/f-rom/LARE_BC2_C2_CLOSEOUT.json \
            --width "${{ matrix.width }}" \
            --history "${{ matrix.history }}" \
            --output "LARE_BC2_C3_CASE/case_${{ matrix.tag }}.json" \
            | tee "LARE_BC2_C3_CASE/runner_${{ matrix.tag }}.txt"

      - name: Upload case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c3-case-${{ matrix.tag }}
          path: LARE_BC2_C3_CASE/
          if-no-files-found: error

  aggregate:
    needs: case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover all C3 cases
        uses: actions/download-artifact@v4
        with:
          pattern: lare-bc2-c3-case-*
          path: /tmp/lare-bc2-c3-cases
          merge-multiple: true

      - name: Aggregate and hard-gate
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C3_EVIDENCE
          python3 tests/rom/aggregate_lare_bc2_c3_cases.py \
            --case-dir /tmp/lare-bc2-c3-cases \
            --output LARE_BC2_C3_EVIDENCE/LARE_BC2_C3_RESULT.json \
            | tee LARE_BC2_C3_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C3_EVIDENCE/LARE_BC2_C3_RESULT.json'))
          assert r['decision']=='BC2_C3_SIGNED_LOCAL_BIAS_LEDGER_MAPPED'
          assert r['complete'] is True
          assert r['hard_checks']['maximum_recorded_hard_residual_or_identity_error'] <= 1.0e-10
          assert r['next_model_change_authorized'] is False
          assert r['groundwater_feedback_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C3_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C3_EVIDENCE/* > LARE_BC2_C3_EVIDENCE/sha256.txt

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c3
          path: LARE_BC2_C3_EVIDENCE/
          if-no-files-found: error
