name: F-ROM-LARE persist C3B and C4D mechanism closeout

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c3b-c4d-persist.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover exact C3B and C4D aggregate authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-mech/c3b /tmp/lare-mech/c4d

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10589522717/zip" > /tmp/lare-mech/c3b.zip
          echo "8efc8579a8ba4ce107b66674727e9300635ecb4b6517b80520452728ef2979ee  /tmp/lare-mech/c3b.zip" | sha256sum -c -
          unzip -q /tmp/lare-mech/c3b.zip -d /tmp/lare-mech/c3b
          echo "6e7b79733639768d09820924d3ca8a2bdb7a79ceb498e6fdb0a33c4a3c6565dd  /tmp/lare-mech/c3b/LARE_BC2_C3B_RESULT.json" | sha256sum -c -

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10589288088/zip" > /tmp/lare-mech/c4d.zip
          echo "162849c85ce46e73c68999d5e79dcfc1aff3409e66c95f6102e4168b30df421c  /tmp/lare-mech/c4d.zip" | sha256sum -c -
          unzip -q /tmp/lare-mech/c4d.zip -d /tmp/lare-mech/c4d
          echo "0ff71e4e6649c8968a0fec2ce63fd0a8a41b52da73a39cc62fec4b87410a34ee  /tmp/lare-mech/c4d/LARE_BC2_C4D_RESULT.json" | sha256sum -c -

      - name: Validate independent mechanism results
        run: |
          python3 - <<'PY'
          import json
          c3=json.load(open('/tmp/lare-mech/c3b/LARE_BC2_C3B_RESULT.json'))
          c4=json.load(open('/tmp/lare-mech/c4d/LARE_BC2_C4D_RESULT.json'))

          assert c3['decision']=='DIRECTION_PARTITION_EXPLAINS_CYCLE_RANK_SHIFT'
          assert c3['complete'] is True
          assert c3['hard_checks']['maximum_recorded_hard_residual_or_identity_error'] <= 1e-10
          assert set(c3['width_decisions'].values())=={'DIRECTION_PARTITION_EXPLAINS_CYCLE_RANK_SHIFT'}
          assert c3['model_changed'] is False
          assert c3['oracle_counterfactual_executed'] is False
          assert c3['production_rom_authorized'] is False

          assert c4['decision']=='BC2_C4D_PHASE_RESOLVED_MECHANISM_MAPPED'
          assert c4['complete'] is True
          assert c4['hard_checks']['maximum_recorded_hard_residual_or_identity_error'] <= 1e-10
          assert c4['mechanisms']['H_CANCELLATION']['supported'] is True
          assert c4['mechanisms']['H_QH_PHASE']['supported'] is False
          assert c4['mechanisms']['H_REVERSAL_LOCAL']['supported'] is False
          assert c4['primary_cross_rank_mismatch_segments']==[]
          assert c4['next_authority']==['QI_TEACHER_ORACLE_ON_MONOTONE_PHASES_MAY_BE_PREREGISTERED_AS_CAUSAL_DIAGNOSTIC']
          assert c4['model_changed'] is False
          assert c4['production_rom_authorized'] is False
          print('LARE_BC2_MECHANISM_CROSSCHECK=PASS')
          PY

      - name: Build combined mechanism authority
        run: |
          python3 - <<'PY'
          import json
          c3=json.load(open('/tmp/lare-mech/c3b/LARE_BC2_C3B_RESULT.json'))
          c4=json.load(open('/tmp/lare-mech/c4d/LARE_BC2_C4D_RESULT.json'))
          out={
            'schema':'swap5.lare.bc2.mechanism-closeout.v1',
            'workstream':'F-ROM-LARE',
            'status':'CLOSED_MECHANISM_MAPPED_NO_MODEL_CHANGE',
            'authorities':{
              'C3B':{
                'workflow_run':35459488910,
                'executed_head':'98db4934b41e055aff64e8f5a945b25e01daff56',
                'artifact_id':10589522717,
                'artifact_digest':'sha256:8efc8579a8ba4ce107b66674727e9300635ecb4b6517b80520452728ef2979ee',
                'result_sha256':'6e7b79733639768d09820924d3ca8a2bdb7a79ceb498e6fdb0a33c4a3c6565dd',
                'decision':c3['decision'],
              },
              'C4D':{
                'workflow_run':35459567540,
                'executed_head':'65f5940dbdc6640e86edcf710ffb13c148145151',
                'artifact_id':10589288088,
                'artifact_digest':'sha256:162849c85ce46e73c68999d5e79dcfc1aff3409e66c95f6102e4168b30df421c',
                'result_sha256':'0ff71e4e6649c8968a0fec2ce63fd0a8a41b52da73a39cc62fec4b87410a34ee',
                'decision':c4['decision'],
              },
            },
            'mechanism':{
              'local_monotone_and_phase_rank1_family':'QI',
              'all_phase_and_nonreversal_tail_QI_both_widths_routes':True,
              'signed_QI_cancellation_supported':True,
              'QI_directional_cancellation_ratio_range':[
                min(c4['cancellation'][w][r]['QI']['directional_cancellation_ratio'] for w in ('2.5','5.0') for r in ('0.00005000','0.00002500')),
                max(c4['cancellation'][w][r]['QI']['directional_cancellation_ratio'] for w in ('2.5','5.0') for r in ('0.00005000','0.00002500')),
              ],
              'whole_cycle_QH_rank_interpretation':'AGGREGATION_CANCELLATION_EFFECT_NOT_SUSTAINED_LOCAL_QH_DOMINANCE',
              'sustained_QH_phase_supported':False,
              'width_general_reversal_QH_supported':False,
              'exact_reversal_note':'reversal rank is geometry-dependent; 5 cm is GEOMETRY_GI at both reversals, while 2.5 cm has GEOMETRY_GI at step 257 and QH at step 513; therefore no width-general QH reversal mechanism is admitted.',
            },
            'blocked_intervention_context':{
              'C4B_closeout':'integration/f-rom/LARE_BC2_C4B_CLOSEOUT.json',
              'meaning':'full interval-average oracle substitution is not a generally admissible causal intervention because required core variants can leave the constitutive domain or fail the frozen corrector; this does not invalidate the additive teacher-state mechanism mapping.'
            },
            'next_authority':'PREREGISTER_QI_FOCUSED_TEACHER_STATE_DIAGNOSTIC_FOR_MONOTONE_H_MOTION',
            'next_model_change_authorized':False,
            'groundwater_feedback_authorized':False,
            'application_acceptance_adjudicated':False,
            'production_rom_authorized':False,
          }
          open('integration/f-rom/LARE_BC2_MECHANISM_CLOSEOUT.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Persist exact result bytes and closeout
        run: |
          set -euo pipefail
          cp /tmp/lare-mech/c3b/LARE_BC2_C3B_RESULT.json integration/f-rom/LARE_BC2_C3B_RESULT.json
          cp /tmp/lare-mech/c4d/LARE_BC2_C4D_RESULT.json integration/f-rom/LARE_BC2_C4D_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             integration/f-rom/LARE_BC2_C3B_RESULT.json             integration/f-rom/LARE_BC2_C4D_RESULT.json             integration/f-rom/LARE_BC2_MECHANISM_CLOSEOUT.json
          git diff --cached --check
          git commit -m "F-ROM-LARE: persist QI cancellation mechanism closeout"
          git push origin HEAD:work/f-rom-lare-rs1
