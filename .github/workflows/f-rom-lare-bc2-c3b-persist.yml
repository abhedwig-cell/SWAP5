name: F-ROM-LARE persist BC2-C3B result

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c3b-persist.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover qualified C3B aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c3b-persist
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10589522717/zip" > /tmp/lare-bc2-c3b-persist/c3b.zip
          echo "8efc8579a8ba4ce107b66674727e9300635ecb4b6517b80520452728ef2979ee  /tmp/lare-bc2-c3b-persist/c3b.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c3b-persist/c3b.zip -d /tmp/lare-bc2-c3b-persist
          echo "6e7b79733639768d09820924d3ca8a2bdb7a79ceb498e6fdb0a33c4a3c6565dd  /tmp/lare-bc2-c3b-persist/LARE_BC2_C3B_RESULT.json" | sha256sum -c -

      - name: Validate frozen C3B decision
        run: |
          python3 - <<'PY'
          import json
          p='/tmp/lare-bc2-c3b-persist/LARE_BC2_C3B_RESULT.json'
          r=json.load(open(p))
          assert r['decision']=='DIRECTION_PARTITION_EXPLAINS_CYCLE_RANK_SHIFT'
          assert r['complete'] is True
          assert r['hard_checks']['all_widths_both_routes_qualified'] is True
          assert r['hard_checks']['maximum_recorded_hard_residual_or_identity_error'] <= 1e-10
          assert r['width_decisions']=={
              '2.5':'DIRECTION_PARTITION_EXPLAINS_CYCLE_RANK_SHIFT',
              '5.0':'DIRECTION_PARTITION_EXPLAINS_CYCLE_RANK_SHIFT',
          }
          for width in ('2.5','5.0'):
              for route in ('0.00005000','0.00002500'):
                  tops=[b['family_rank_by_cumulative_shape_injection'][0]
                        for b in r['cases'][width]['routes'][route]['blocks']]
                  assert tops==['QI','QI','QI']
          assert r['model_changed'] is False
          assert r['oracle_counterfactual_executed'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C3B_PERSIST_VALIDATION=PASS')
          PY

      - name: Persist result and authority binding
        run: |
          set -euo pipefail
          cp /tmp/lare-bc2-c3b-persist/LARE_BC2_C3B_RESULT.json integration/f-rom/LARE_BC2_C3B_RESULT.json
          cat > integration/f-rom/LARE_BC2_C3B_AUTHORITY_BINDING.json <<'JSON'
          {
            "schema": "swap5.lare.bc2.c3b.authority-binding.v1",
            "workstream": "F-ROM-LARE",
            "work_unit": "LARE-BC2-C3B",
            "source_workflow_run": 35459488910,
            "source_executed_head": "98db4934b41e055aff64e8f5a945b25e01daff56",
            "aggregate_artifact_id": 10589522717,
            "aggregate_artifact_digest": "sha256:8efc8579a8ba4ce107b66674727e9300635ecb4b6517b80520452728ef2979ee",
            "result_sha256": "6e7b79733639768d09820924d3ca8a2bdb7a79ceb498e6fdb0a33c4a3c6565dd",
            "required_decision": "DIRECTION_PARTITION_EXPLAINS_CYCLE_RANK_SHIFT",
            "scientific_effect": "Persists the qualified response-independent Hdot-sign direction-block audit. No model change."
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C3B_RESULT.json integration/f-rom/LARE_BC2_C3B_AUTHORITY_BINDING.json
          git diff --cached --check
          git commit -m "F-ROM-LARE: persist BC2-C3B direction-block result"
          git push origin HEAD:work/f-rom-lare-rs1