name: F-ROM-LARE BC2-C3B direction blocks

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C3B_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_bc2_c3b_direction_blocks.py'
      - 'tests/rom/aggregate_lare_bc2_c3b.py'
      - '.github/workflows/f-rom-lare-bc2-c3b.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c3b-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: w2p5, width: 2.5}
          - {tag: w5, width: 5.0}
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c3b/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c3b/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c3b/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c3b/a2.zip -d /tmp/lare-bc2-c3b/a2
          cmp /tmp/lare-bc2-c3b/a2/o0.txt /tmp/lare-bc2-c3b/a2/o2.txt

      - name: Execute threshold-free direction-block audit
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C3B_CASE
          python3 tests/rom/analyze_lare_bc2_c3b_direction_blocks.py \
            --reference /tmp/lare-bc2-c3b/a2/o0.txt \
            --prereg integration/f-rom/LARE_BC2_C3B_PREREGISTRATION.json \
            --c3 integration/f-rom/LARE_BC2_C3_RESULT.json \
            --c3a integration/f-rom/LARE_BC2_C3A_RESULT.json \
            --width "${{ matrix.width }}" \
            --output "LARE_BC2_C3B_CASE/case_${{ matrix.tag }}.json" \
            | tee "LARE_BC2_C3B_CASE/runner_${{ matrix.tag }}.txt"

      - name: Upload case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c3b-case-${{ matrix.tag }}
          path: LARE_BC2_C3B_CASE/
          if-no-files-found: error

  aggregate:
    needs: case
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Recover C3B cases
        uses: actions/download-artifact@v4
        with:
          pattern: lare-bc2-c3b-case-*
          path: /tmp/lare-bc2-c3b-cases
          merge-multiple: true

      - name: Aggregate and adjudicate
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C3B_EVIDENCE
          python3 tests/rom/aggregate_lare_bc2_c3b.py \
            --case-dir /tmp/lare-bc2-c3b-cases \
            --output LARE_BC2_C3B_EVIDENCE/LARE_BC2_C3B_RESULT.json \
            | tee LARE_BC2_C3B_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C3B_EVIDENCE/LARE_BC2_C3B_RESULT.json'))
          assert r['complete'] is True
          assert r['decision'] in (
              'DIRECTION_PARTITION_EXPLAINS_CYCLE_RANK_SHIFT',
              'WITHIN_DIRECTION_REGIME_DEPENDENCE_REMAINS'
          )
          assert r['hard_checks']['maximum_recorded_hard_residual_or_identity_error'] <= 1.0e-10
          assert r['model_changed'] is False
          assert r['oracle_counterfactual_executed'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C3B_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C3B_EVIDENCE/* > LARE_BC2_C3B_EVIDENCE/sha256.txt

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c3b
          path: LARE_BC2_C3B_EVIDENCE/
          if-no-files-found: error