name: F-ROM-LARE BC2-C4B causal oracle diagnostic

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C4B_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_bc2_c4b_oracle_case.py'
      - 'tests/rom/aggregate_lare_bc2_c4b_cases.py'
      - '.github/workflows/f-rom-lare-bc2-c4b.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: w2p5_hold, width: 2.5, history: WT_HOLD}
          - {tag: w2p5_rise, width: 2.5, history: WT_RISE}
          - {tag: w2p5_fall, width: 2.5, history: WT_FALL}
          - {tag: w2p5_cycle, width: 2.5, history: WT_CYCLE}
          - {tag: w5_hold, width: 5.0, history: WT_HOLD}
          - {tag: w5_rise, width: 5.0, history: WT_RISE}
          - {tag: w5_fall, width: 5.0, history: WT_FALL}
          - {tag: w5_cycle, width: 5.0, history: WT_CYCLE}
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c4b/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c4b/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c4b/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c4b/a2.zip -d /tmp/lare-bc2-c4b/a2
          cmp /tmp/lare-bc2-c4b/a2/o0.txt /tmp/lare-bc2-c4b/a2/o2.txt

      - name: Execute causal oracle case
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4B_CASE
          python3 tests/rom/analyze_lare_bc2_c4b_oracle_case.py \
            --reference /tmp/lare-bc2-c4b/a2/o0.txt \
            --prereg integration/f-rom/LARE_BC2_C4B_PREREGISTRATION.json \
            --c3a integration/f-rom/LARE_BC2_C3A_RESULT.json \
            --width "${{ matrix.width }}" \
            --history "${{ matrix.history }}" \
            --output "LARE_BC2_C4B_CASE/case_${{ matrix.tag }}.json" \
            | tee "LARE_BC2_C4B_CASE/runner_${{ matrix.tag }}.txt"

      - name: Upload case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4b-case-${{ matrix.tag }}
          path: LARE_BC2_C4B_CASE/
          if-no-files-found: error

  aggregate:
    needs: case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover all C4B cases
        uses: actions/download-artifact@v4
        with:
          pattern: lare-bc2-c4b-case-*
          path: /tmp/lare-bc2-c4b-cases
          merge-multiple: true

      - name: Aggregate and adjudicate frozen causal hypotheses
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4B_EVIDENCE
          python3 tests/rom/aggregate_lare_bc2_c4b_cases.py \
            --case-dir /tmp/lare-bc2-c4b-cases \
            --prereg integration/f-rom/LARE_BC2_C4B_PREREGISTRATION.json \
            --output LARE_BC2_C4B_EVIDENCE/LARE_BC2_C4B_RESULT.json \
            | tee LARE_BC2_C4B_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C4B_EVIDENCE/LARE_BC2_C4B_RESULT.json'))
          assert r['complete'] is True
          assert r['hard_checks']['maximum_recorded_hard_residual_or_identity_error'] <= 1e-10
          assert r['model_candidate_tested'] is False
          assert r['next_model_change_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C4B_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C4B_EVIDENCE/* > LARE_BC2_C4B_EVIDENCE/sha256.txt

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4b
          path: LARE_BC2_C4B_EVIDENCE/
          if-no-files-found: error
