name: F-ROM-LARE BC2-C4E local QI causal diagnostic

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C4E_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_bc2_c4e_local_qi_causal.py'
      - 'tests/rom/aggregate_lare_bc2_c4e.py'
      - '.github/workflows/f-rom-lare-bc2-c4e.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c4e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: w2p5-rise, width: 2.5, history: WT_RISE}
          - {tag: w2p5-fall, width: 2.5, history: WT_FALL}
          - {tag: w5-rise, width: 5.0, history: WT_RISE}
          - {tag: w5-fall, width: 5.0, history: WT_FALL}
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c4e/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c4e/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c4e/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c4e/a2.zip -d /tmp/lare-bc2-c4e/a2
          cmp /tmp/lare-bc2-c4e/a2/o0.txt /tmp/lare-bc2-c4e/a2/o2.txt

      - name: Execute local QI causal counterfactual
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4E_CASE
          python3 tests/rom/analyze_lare_bc2_c4e_local_qi_causal.py \
            --reference /tmp/lare-bc2-c4e/a2/o0.txt \
            --prereg integration/f-rom/LARE_BC2_C4E_PREREGISTRATION.json \
            --c3b integration/f-rom/LARE_BC2_C3B_RESULT.json \
            --c4d integration/f-rom/LARE_BC2_C4D_RESULT.json \
            --c4b-closeout integration/f-rom/LARE_BC2_C4B_CLOSEOUT.json \
            --width "${{ matrix.width }}" \
            --history "${{ matrix.history }}" \
            --output "LARE_BC2_C4E_CASE/case_${{ matrix.tag }}.json" \
            | tee "LARE_BC2_C4E_CASE/runner_${{ matrix.tag }}.txt"

      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4e-case-${{ matrix.tag }}
          path: LARE_BC2_C4E_CASE/
          if-no-files-found: error

  aggregate:
    needs: case
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Recover C4E cases
        uses: actions/download-artifact@v4
        with:
          pattern: lare-bc2-c4e-case-*
          path: /tmp/lare-bc2-c4e-cases
          merge-multiple: true

      - name: Aggregate C4E
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4E_EVIDENCE
          python3 tests/rom/aggregate_lare_bc2_c4e.py \
            --case-dir /tmp/lare-bc2-c4e-cases \
            --prereg integration/f-rom/LARE_BC2_C4E_PREREGISTRATION.json \
            --output LARE_BC2_C4E_EVIDENCE/LARE_BC2_C4E_RESULT.json \
            | tee LARE_BC2_C4E_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C4E_EVIDENCE/LARE_BC2_C4E_RESULT.json'))
          assert r['decision'] in (
              'QI_LOCAL_CAUSAL_SUPPORT',
              'QI_LOCAL_CAUSAL_MIXED',
              'QI_LOCAL_CAUSAL_NOT_SUPPORTED',
              'QI_LOCAL_CAUSAL_DIAGNOSTIC_BLOCKED'
          )
          assert r['model_changed'] is False
          assert r['counterfactual_propagated'] is False
          assert r['next_model_change_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C4E_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C4E_EVIDENCE/* > LARE_BC2_C4E_EVIDENCE/sha256.txt

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4e
          path: LARE_BC2_C4E_EVIDENCE/
          if-no-files-found: error
