name: F-ROM-LARE BC2-C4F vector interference diagnostic

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C4F_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_bc2_c4f_vector_interference.py'
      - 'tests/rom/aggregate_lare_bc2_c4f.py'
      - '.github/workflows/f-rom-lare-bc2-c4f.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c4f-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: w2p5-rise, width: 2.5, history: WT_RISE}
          - {tag: w2p5-fall, width: 2.5, history: WT_FALL}
          - {tag: w5-rise, width: 5.0, history: WT_RISE}
          - {tag: w5-fall, width: 5.0, history: WT_FALL}
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c4f/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c4f/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c4f/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c4f/a2.zip -d /tmp/lare-bc2-c4f/a2
          cmp /tmp/lare-bc2-c4f/a2/o0.txt /tmp/lare-bc2-c4f/a2/o2.txt

      - name: Execute vector interference diagnostic
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4F_CASE
          python3 tests/rom/analyze_lare_bc2_c4f_vector_interference.py             --reference /tmp/lare-bc2-c4f/a2/o0.txt             --prereg integration/f-rom/LARE_BC2_C4F_PREREGISTRATION.json             --c4e-closeout integration/f-rom/LARE_BC2_C4E_CLOSEOUT.json             --width "${{ matrix.width }}"             --history "${{ matrix.history }}"             --output "LARE_BC2_C4F_CASE/case_${{ matrix.tag }}.json"             | tee "LARE_BC2_C4F_CASE/runner_${{ matrix.tag }}.txt"

      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4f-case-${{ matrix.tag }}
          path: LARE_BC2_C4F_CASE/
          if-no-files-found: error

  aggregate:
    needs: case
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Recover C4F cases
        uses: actions/download-artifact@v4
        with:
          pattern: lare-bc2-c4f-case-*
          path: /tmp/lare-bc2-c4f-cases
          merge-multiple: true

      - name: Aggregate and adjudicate C4F
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4F_EVIDENCE
          python3 tests/rom/aggregate_lare_bc2_c4f.py             --case-dir /tmp/lare-bc2-c4f-cases             --prereg integration/f-rom/LARE_BC2_C4F_PREREGISTRATION.json             --c4e-result integration/f-rom/LARE_BC2_C4E_RESULT.json             --output LARE_BC2_C4F_EVIDENCE/LARE_BC2_C4F_RESULT.json             | tee LARE_BC2_C4F_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C4F_EVIDENCE/LARE_BC2_C4F_RESULT.json'))
          assert r['decision'] in (
            'VECTOR_INTERFERENCE_PLUS_WIDTH_MARGIN_EXPLAINS_C4E',
            'VECTOR_INTERFERENCE_EXPLAINS_C4E',
            'C4E_MECHANISM_PARTIAL'
          )
          assert r['next_model_change_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C4F_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C4F_EVIDENCE/* > LARE_BC2_C4F_EVIDENCE/sha256.txt

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4f
          path: LARE_BC2_C4F_EVIDENCE/
          if-no-files-found: error
