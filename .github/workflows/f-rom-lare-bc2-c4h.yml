name: F-ROM-LARE BC2-C4H terminal qi factorisation

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C4H_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_bc2_c4h_terminal_qi_factorisation.py'
      - '.github/workflows/f-rom-lare-bc2-c4h.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c4h-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c4h/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c4h/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c4h/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c4h/a2.zip -d /tmp/lare-bc2-c4h/a2
          cmp /tmp/lare-bc2-c4h/a2/o0.txt /tmp/lare-bc2-c4h/a2/o2.txt

      - name: Execute terminal qi factorisation
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4H_EVIDENCE
          python3 tests/rom/analyze_lare_bc2_c4h_terminal_qi_factorisation.py             --reference /tmp/lare-bc2-c4h/a2/o0.txt             --prereg integration/f-rom/LARE_BC2_C4H_PREREGISTRATION.json             --b8-result integration/f-rom/LARE_BC2_B8_RESULT.json             --b9-result integration/f-rom/LARE_BC2_B9_RESULT.json             --c4g-closeout integration/f-rom/LARE_BC2_C4G_CLOSEOUT.json             --output LARE_BC2_C4H_EVIDENCE/LARE_BC2_C4H_RESULT.json             | tee LARE_BC2_C4H_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C4H_EVIDENCE/LARE_BC2_C4H_RESULT.json'))
          assert r['decision'] in (
            'TERMINAL_QI_GRADIENT_RECONSTRUCTION_TARGET_SUPPORTED',
            'TERMINAL_QI_CONDUCTIVITY_RECONSTRUCTION_TARGET_SUPPORTED',
            'TERMINAL_QI_FACTORISATION_MIXED'
          )
          assert r['hard_checks']['max_abs_B8_qi_bulk_minus_terminal_cm_per_day'] <= 1e-10
          assert r['hard_checks']['max_abs_symmetric_factorisation_residual_cm_per_day'] <= 1e-12
          assert r['next_model_change_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C4H_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C4H_EVIDENCE/* > LARE_BC2_C4H_EVIDENCE/sha256.txt

      - name: Upload C4H evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4h
          path: LARE_BC2_C4H_EVIDENCE/
          if-no-files-found: error
