name: F-ROM-LARE persist C4J mechanism closeout

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c4j-persist.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover exact C4J authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c4j
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10591757425/zip" > /tmp/c4j.zip
          echo "7fa179f0efcef03faf5316108eb0c32b4d5190546a209b9fe9eaa1f4ebcbe451  /tmp/c4j.zip" | sha256sum -c -
          unzip -q /tmp/c4j.zip -d /tmp/c4j
          echo "d0320f6008ccc7e83f3efdca8394974e58189273310242a2d8fa2a00e79f8f7a  /tmp/c4j/LARE_BC2_C4J_RESULT.json" | sha256sum -c -

      - name: Validate C4J
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/c4j/LARE_BC2_C4J_RESULT.json'))
          assert r['decision']=='C4J_DIAGNOSTIC_BLOCKED'
          assert r['diagnostic_A']['supported'] is False
          assert r['diagnostic_B']['supported'] is True
          assert r['diagnostic_A']['root_map']['WT_HOLD']['quadrature']['64']['distinct_cluster_count']==2
          assert r['diagnostic_A']['root_map']['WT_HOLD']['quadrature']['128']['distinct_cluster_count']==1
          assert r['next_model_change_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C4J_VALIDATION=PASS')
          PY

      - name: Build closeout
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/c4j/LARE_BC2_C4J_RESULT.json'))
          g=r['diagnostic_B']['geometry']
          out={
            'schema':'swap5.lare.bc2.c4j.closeout.v1',
            'workstream':'F-ROM-LARE',
            'work_unit':'LARE-BC2-C4J',
            'status':'CLOSED_ROOT_MULTIPLICITY_NOT_SUPPORTED_DIRECTION_GEOMETRY_SUPPORTED',
            'decision':r['decision'],
            'authority':{
              'workflow_run':35467219446,
              'execution_head':'390d04da4cd59c4a1137ca8acded2a7f7107dbb6',
              'artifact_id':10591757425,
              'artifact_digest':'sha256:7fa179f0efcef03faf5316108eb0c32b4d5190546a209b9fe9eaa1f4ebcbe451',
              'result_sha256':'d0320f6008ccc7e83f3efdca8394974e58189273310242a2d8fa2a00e79f8f7a'
            },
            'root_multiplicity':{
              'supported':False,
              'cluster_count_64':2,
              'cluster_count_128':1,
              'max_qi_spread_64_cm_per_day':r['diagnostic_A']['root_map']['WT_HOLD']['quadrature']['64']['flux_spread']['qi_cm_per_day'],
              'max_qH_spread_64_cm_per_day':r['diagnostic_A']['root_map']['WT_HOLD']['quadrature']['64']['flux_spread']['qH_cm_per_day'],
              'interpretation':'The apparent 64-point root split is not cross-quadrature stable and is classified as numerical root-resolution sensitivity, not physical non-identifiability.'
            },
            'direction_geometry':{
              'supported':True,
              'WT_FALL_interface_rms_base':g['WT_FALL']['interface_slope_error']['BASE']['rms'],
              'WT_FALL_interface_rms_quadratic':g['WT_FALL']['interface_slope_error']['QUADRATIC']['rms'],
              'WT_FALL_water_table_rms_base':g['WT_FALL']['water_table_slope_error']['BASE']['rms'],
              'WT_FALL_water_table_rms_quadratic':g['WT_FALL']['water_table_slope_error']['QUADRATIC']['rms'],
              'WT_RISE_interface_rms_base':g['WT_RISE']['interface_slope_error']['BASE']['rms'],
              'WT_RISE_interface_rms_quadratic':g['WT_RISE']['interface_slope_error']['QUADRATIC']['rms'],
              'WT_RISE_water_table_rms_base':g['WT_RISE']['water_table_slope_error']['BASE']['rms'],
              'WT_RISE_water_table_rms_quadratic':g['WT_RISE']['water_table_slope_error']['QUADRATIC']['rms'],
              'WT_HOLD_interface_rms_base':g['WT_HOLD']['interface_slope_error']['BASE']['rms'],
              'WT_HOLD_interface_rms_quadratic':g['WT_HOLD']['interface_slope_error']['QUADRATIC']['rms']
            },
            'scientific_interpretation':[
              'C4J withdraws the stronger C4I inference that the 2.5 cm quadratic family is physically multi-valued; that split does not survive quadrature refinement.',
              'The 5 cm direction dependence is independently supported in effective-gradient space: the quadratic profile improves both slope targets in FALL, worsens both in RISE, and damages the HOLD hydrostatic state.',
              'The next question is therefore state sufficiency for the local gradient itself, not root selection within the quadratic family.'
            ],
            'next_authority':'TEST_REFERENCE_LOCAL_GRADIENT_STATE_SUFFICIENCY_BEFORE_ANY_NEW_MEMORYLESS_CLOSURE',
            'model_changed':False,
            'next_model_change_authorized':False,
            'groundwater_feedback_authorized':False,
            'application_acceptance_adjudicated':False,
            'speed_claim_authorized':False,
            'production_rom_authorized':False
          }
          open('integration/f-rom/LARE_BC2_C4J_CLOSEOUT.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

          cat > docs/science/F-ROM_LARE_BC2_C4J_CLOSEOUT.md <<'MD'
          # F-ROM-LARE BC2-C4J closeout

          C4J closes with a split result. The formal aggregate decision remains C4J_DIAGNOSTIC_BLOCKED because the preregistered root-multiplicity cross-quadrature gate fails, but the independent 5 cm direction-geometry diagnostic is supported.

          The apparent second 2.5 cm root at 64-point quadrature is not reproduced at 128 points. At 64 points the two clusters differ by only about 4.10e-7 cm/d in qi and 6.90e-7 cm/d in qH. At 128 points all four frozen starts collapse to one cluster. This is treated as numerical root-resolution sensitivity, not evidence that Wb/Wt/H physically admit two distinct quadratic profiles.

          The 5 cm direction result is robust. Under WT_FALL the quadratic reconstruction reduces interface-slope RMS from about 0.0221 to 0.0138 and water-table-slope RMS from about 0.0329 to 0.0256. Under WT_RISE it increases those RMS errors from about 0.0342 to 0.0631 and from about 0.0472 to 0.0642, respectively. Under WT_HOLD the baseline slope error is essentially numerical zero while the quadratic profile introduces finite slope error.

          Thus the transferable finding is direction-dependent gradient geometry, not quadratic branch multiplicity. No branch selector, direction switch or replacement closure is authorized.
          MD

      - name: Persist C4J authority
        run: |
          set -euo pipefail
          cp /tmp/c4j/LARE_BC2_C4J_RESULT.json integration/f-rom/LARE_BC2_C4J_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C4J_RESULT.json integration/f-rom/LARE_BC2_C4J_CLOSEOUT.json docs/science/F-ROM_LARE_BC2_C4J_CLOSEOUT.md
          git diff --cached --check
          git commit -m "F-ROM-LARE: close C4J direction geometry diagnostic"
          git push origin HEAD:work/f-rom-lare-rs1
