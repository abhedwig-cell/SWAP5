name: F-ROM-LARE BC2-C4J root and direction geometry

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C4J_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_bc2_c4j_root_direction_geometry.py'
      - '.github/workflows/f-rom-lare-bc2-c4j.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c4j-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c4j/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c4j/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c4j/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c4j/a2.zip -d /tmp/lare-bc2-c4j/a2
          cmp /tmp/lare-bc2-c4j/a2/o0.txt /tmp/lare-bc2-c4j/a2/o2.txt

      - name: Execute C4J mechanism diagnostic
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4J_EVIDENCE
          python3 tests/rom/analyze_lare_bc2_c4j_root_direction_geometry.py             --reference /tmp/lare-bc2-c4j/a2/o0.txt             --prereg integration/f-rom/LARE_BC2_C4J_PREREGISTRATION.json             --c4i-closeout integration/f-rom/LARE_BC2_C4I_CLOSEOUT.json             --c4h-closeout integration/f-rom/LARE_BC2_C4H_CLOSEOUT.json             --b8-result integration/f-rom/LARE_BC2_B8_RESULT.json             --b9-result integration/f-rom/LARE_BC2_B9_RESULT.json             --output LARE_BC2_C4J_EVIDENCE/LARE_BC2_C4J_RESULT.json             | tee LARE_BC2_C4J_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C4J_EVIDENCE/LARE_BC2_C4J_RESULT.json'))
          assert r['decision'] in (
            'QUADRATIC_MULTIVALUED_AND_DIRECTION_GEOMETRY_CONFIRMED',
            'QUADRATIC_ROOT_MULTIPLICITY_ONLY',
            'QUADRATIC_DIRECTION_GEOMETRY_ONLY',
            'C4J_MECHANISM_PARTIAL',
            'C4J_DIAGNOSTIC_BLOCKED'
          )
          assert r['next_model_change_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C4J_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C4J_EVIDENCE/* > LARE_BC2_C4J_EVIDENCE/sha256.txt

      - name: Upload C4J evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4j
          path: LARE_BC2_C4J_EVIDENCE/
          if-no-files-found: error
