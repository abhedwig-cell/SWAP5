name: F-ROM-LARE BC2-C4L qH-preserving cubic

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C4L_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_bc2_c4l_qh_preserving_cubic.py'
      - 'tests/rom/aggregate_lare_bc2_c4l.py'
      - '.github/workflows/f-rom-lare-bc2-c4l.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c4l-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: w2p5-hold, width: 2.5, history: WT_HOLD}
          - {tag: w2p5-rise, width: 2.5, history: WT_RISE}
          - {tag: w2p5-fall, width: 2.5, history: WT_FALL}
          - {tag: w5-hold, width: 5.0, history: WT_HOLD}
          - {tag: w5-rise, width: 5.0, history: WT_RISE}
          - {tag: w5-fall, width: 5.0, history: WT_FALL}
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Recover immutable A2 Reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-bc2-c4l/a2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10587360597/zip" > /tmp/lare-bc2-c4l/a2.zip
          echo "86a7922e540a64e168835c23868fea3f67fc49d820c28901db7ba62ec3daa278  /tmp/lare-bc2-c4l/a2.zip" | sha256sum -c -
          unzip -q /tmp/lare-bc2-c4l/a2.zip -d /tmp/lare-bc2-c4l/a2
          cmp /tmp/lare-bc2-c4l/a2/o0.txt /tmp/lare-bc2-c4l/a2/o2.txt

      - name: Execute cubic case
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4L_CASE
          python3 tests/rom/analyze_lare_bc2_c4l_qh_preserving_cubic.py             --reference /tmp/lare-bc2-c4l/a2/o0.txt             --prereg integration/f-rom/LARE_BC2_C4L_PREREGISTRATION.json             --c4k-closeout integration/f-rom/LARE_BC2_C4K_CLOSEOUT.json             --c4h-closeout integration/f-rom/LARE_BC2_C4H_CLOSEOUT.json             --b7-result integration/f-rom/LARE_BC2_B7_RESULT.json             --b8-result integration/f-rom/LARE_BC2_B8_RESULT.json             --b9-result integration/f-rom/LARE_BC2_B9_RESULT.json             --width "${{ matrix.width }}"             --history "${{ matrix.history }}"             --output "LARE_BC2_C4L_CASE/case_${{ matrix.tag }}.json"             | tee "LARE_BC2_C4L_CASE/runner_${{ matrix.tag }}.txt"

      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4l-case-${{ matrix.tag }}
          path: LARE_BC2_C4L_CASE/
          if-no-files-found: error

  aggregate:
    needs: case
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Recover C4L cases
        uses: actions/download-artifact@v4
        with:
          pattern: lare-bc2-c4l-case-*
          path: /tmp/lare-bc2-c4l-cases
          merge-multiple: true

      - name: Aggregate C4L
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C4L_EVIDENCE
          python3 tests/rom/aggregate_lare_bc2_c4l.py             --case-dir /tmp/lare-bc2-c4l-cases             --prereg integration/f-rom/LARE_BC2_C4L_PREREGISTRATION.json             --output LARE_BC2_C4L_EVIDENCE/LARE_BC2_C4L_RESULT.json             | tee LARE_BC2_C4L_EVIDENCE/runner.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C4L_EVIDENCE/LARE_BC2_C4L_RESULT.json'))
          assert r['decision'] in (
            'QH_PRESERVING_CUBIC_QI_SUPPORTED',
            'QH_PRESERVING_CUBIC_MOVING_ONLY',
            'QH_PRESERVING_CUBIC_MIXED',
            'C4L_RECONSTRUCTION_BLOCKED'
          )
          assert r['propagated_dynamics_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C4L_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C4L_EVIDENCE/* > LARE_BC2_C4L_EVIDENCE/sha256.txt

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c4l
          path: LARE_BC2_C4L_EVIDENCE/
          if-no-files-found: error
