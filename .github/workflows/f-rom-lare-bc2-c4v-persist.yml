name: F-ROM-LARE persist C4V one-day closeout

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c4v-persist.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover exact C4V authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c4v
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10599921961/zip" > /tmp/c4v.zip
          echo "cd15afd49f198199644895dd783bdf390f86835624f83578cb5fdd610b952365  /tmp/c4v.zip" | sha256sum -c -
          unzip -q /tmp/c4v.zip -d /tmp/c4v
          echo "58453f537bdc3d6b47e2738cd5b3050fed1b18fad0d2734744b3fd9853ec3be3  /tmp/c4v/LARE_BC2_C4V_RESULT.json" | sha256sum -c -

      - name: Validate frozen C4V decision
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/c4v/LARE_BC2_C4V_RESULT.json'))
          assert r['decision']=='C4V_HIGHER_DIMENSION_GW_FRONTIER_PERSISTS'
          assert r['integrity']['pass'] is True
          assert r['integrity']['prefix_C4R_ordering_pass'] is True
          assert r['integrity']['fmc_D13_reproduction_pass'] is True
          assert r['integrity']['fmc_one_day_pre_reference_preflight_pass'] is True
          assert r['persistent_crossing']['both_comparators']==['R8','R12']
          assert r['persistent_crossing']['minimum_both_dimension']==8
          assert r['hypotheses']['H_GW_R4_PERSISTS'] is False
          assert r['application_acceptance_adjudicated'] is False
          assert r['performance_comparison_authorized'] is False
          assert r['speed_claim_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LARE_BC2_C4V_VALIDATION=PASS')
          PY

      - name: Build C4V closeout and update status
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/c4v/LARE_BC2_C4V_RESULT.json'))
          def route(name,cp='1024'):
              s=r['summaries'][name][cp]
              return {
                'storage_RMSE_cm':s['storage_rmse_cm'],
                'cumulative_bottom_RMSE_cm':s['cumulative_bottom_rmse_cm'],
                'bottom_flux_RMSE_cm_per_day':s['bottom_flux_rmse_cm_per_day'],
                'bottom_flux_sign_errors':s['bottom_flux_sign_errors'],
                'abs_mean_signed_bottom_flux_error_cm_per_day':s['abs_mean_signed_bottom_flux_error_cm_per_day'],
                'max_abs_final_cumulative_bottom_error_cm':s['max_abs_final_cumulative_bottom_error_cm'],
                'mapped_theta_RMSE':s['mapped_theta_rmse']
              }
          out={
            'schema':'swap5.lare.bc2.c4v.closeout.v1',
            'workstream':'F-ROM-LARE',
            'work_unit':'LARE-BC2-C4V',
            'status':'CLOSED_ONE_DAY_GW_FRONTIER_PERSISTS_FROM_R8_APPLICATION_ACCEPTANCE_BLOCKED',
            'decision':r['decision'],
            'authority':{
              'workflow_run':35493542460,
              'execution_head':'2b9c83a17d6584b1c7aa9d27a3a585f06019d448',
              'artifact_id':10599921961,
              'artifact_digest':'sha256:cd15afd49f198199644895dd783bdf390f86835624f83578cb5fdd610b952365',
              'result_sha256':'58453f537bdc3d6b47e2738cd5b3050fed1b18fad0d2734744b3fd9853ec3be3',
              'R16_one_day_sha256':'e8951a67acac3dc73562f0ae80b1d7ca78bfab4aca6e2ad76115afc9d2fea654',
              'R2_one_day_sha256':'5edfae08848eb554743fa6832acaf54a3d22bbb77ef33eb6e201817e50934e12'
            },
            'integrity':r['integrity'],
            'prospective_checkpoints_day':{'128':0.128,'256':0.256,'512':0.512,'1024':1.024},
            'persistent_crossing':r['persistent_crossing'],
            'development_hypothesis':{
              'H_GW_R4_PERSISTS':False,
              'result':'FALSIFIED_WITHIN_BOUNDED_ONE_DAY_LABORATORY'
            },
            'one_day_metrics':{
              'R2':route('R2'),
              'FMC':route('FMC'),
              'LARE_R4':route('LARE_R4'),
              'LARE_R5':route('LARE_R5'),
              'LARE_R6':route('LARE_R6'),
              'LARE_R8':route('LARE_R8'),
              'LARE_R12':route('LARE_R12'),
              'LARE_R16_control':route('LARE_R16')
            },
            'scientific_interpretation':[
              'The blind C4R short-horizon minimum R4 does not persist prospectively to the one-day horizon under the preregistered six-component groundwater vector.',
              'R8 and R12 are the only reduced LARE members that cross both R2 and FMC at every prospective checkpoint 0.128, 0.256, 0.512 and 1.024 day.',
              'R5 crosses both comparators at 0.128 and 0.256 day but not at 0.512 or 1.024 day; R6 survives through 0.512 day but not 1.024 day.',
              'The increasing state requirement is driven by accumulated flux-direction and systematic-bias behavior, not by mass-balance failure or loss of numerical qualification.',
              'R8 therefore becomes the minimum demonstrated reduced LARE state dimension for this bounded one-day fixed-water-table groundwater-response purpose.',
              'Mapped profile fidelity still improves materially from R8 to R12/R16, preserving the earlier purpose-dependent distinction between groundwater-output and profile/process state requirements.',
              'This is comparator-relative horizon evidence only. It is not an application acceptance decision, coupled-groundwater authority, portable speedup claim or production ROM admission.'
            ],
            'external_application_accuracy_blocker':'integration/f-rom/LARE_BC2_C4U_GW_ACCEPTANCE_AUTHORITY.json',
            'next_authority':'INDEPENDENT_MATERIAL_OR_BOUNDARY_TRANSFER_AXIS_WHILE_C4U_EXTERNAL_APPLICATION_ACCURACY_REMAINS_BLOCKED',
            'model_changed':False,
            'application_acceptance_adjudicated':False,
            'performance_comparison_authorized':False,
            'speed_claim_authorized':False,
            'production_rom_authorized':False
          }
          open('integration/f-rom/LARE_BC2_C4V_CLOSEOUT.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')

          status=json.load(open('integration/f-rom/LARE_RS1_STATUS.json'))
          status['schema']='swap5.lare.rs1.status.v5'
          status['state']='C4V_CLOSED_ONE_DAY_GW_MINIMUM_R8_C4U_EXTERNAL_APPLICATION_ACCURACY_BLOCKER'
          dyn=status.setdefault('downstream_dynamics_and_closure',{})
          dyn['bc2_c4v']={
            'closeout':'integration/f-rom/LARE_BC2_C4V_CLOSEOUT.json',
            'decision':r['decision'],
            'status':out['status'],
            'workflow_run':35493542460,
            'artifact_id':10599921961,
            'artifact_digest':'sha256:cd15afd49f198199644895dd783bdf390f86835624f83578cb5fdd610b952365',
            'interpretation':'Prospective horizon extension falsifies persistence of the R4 groundwater frontier and raises the minimum reduced comparator-relative one-day state dimension to R8; application acceptance remains externally blocked.'
          }
          status['next_authority']={
            'state':'EXTERNAL_APPLICATION_BLOCKER_PLUS_OPEN_INDEPENDENT_TRANSFER_AXES',
            'required_for_application_acceptance':[
              'externally governed groundwater head/drawdown application prediction-error requirement H_app',
              'independently governed temporal allocation A_temporal or direct temporal head-error budget',
              'verified immutable provenance/source digest for both claims'
            ],
            'research_allowed_while_blocked':[
              'independently preregistered material/constitutive transfer',
              'independently preregistered lower-boundary/coupling-semantics transfer that does not alter production coupling',
              'additional purpose/horizon characterization without converting comparator-relative errors into application acceptance'
            ],
            'prohibited':'No post-hoc closure retuning, application acceptance, portable speedup or production ROM claim.'
          }
          open('integration/f-rom/LARE_RS1_STATUS.json','w').write(json.dumps(status,indent=2,sort_keys=True)+'\n')
          PY

          cat > docs/science/F-ROM_LARE_BC2_C4V_CLOSEOUT.md <<'MD'
          # F-ROM-LARE BC2-C4V closeout

          Formal decision: **C4V_HIGHER_DIMENSION_GW_FRONTIER_PERSISTS**.

          C4V extends the already blind C4R fixed-water-table histories prospectively from 0.064 day to 1.024 day. All prefix, provenance, D13-FMC reproduction, pre-Reference FMC-domain, transaction-mass and fail-closed gates pass.

          The short-horizon R4 result does not persist. Using the preregistered six-component groundwater vector, R8 and R12 are the only reduced LARE members that remain no worse than both R2 and FMC at every prospective checkpoint 0.128, 0.256, 0.512 and 1.024 day. R5 loses the frontier after 0.256 day; R6 loses it at the 1.024-day checkpoint.

          At 1.024 day, pooled LARE R8 errors are about 0.00921 cm for storage and cumulative bottom exchange, 0.0375 cm/d for terminal bottom flux, one sign error, 0.0205 cm/d absolute mean signed bottom-flux bias, and 0.0327 cm maximum absolute final cumulative-exchange error. R12 is closer again, with about 0.00237 cm storage/cumulative RMSE and 0.0238 cm/d bottom-flux RMSE.

          The state requirement is therefore horizon dependent. R4 is sufficient only for the demonstrated short C4R comparator-relative GW frontier; R8 is the minimum demonstrated member for the one-day C4V frontier. This shift is caused by accumulated direction/bias behavior, not by mass-balance failure or numerical invalidity.

          Profile/process fidelity remains a different purpose. R8 mapped-theta RMSE at 1.024 day is about 0.00810, while R12 is about 0.00137 and the R16 LARE operator control about 3.44e-5. More groundwater fidelity therefore does not erase the purpose-dependent profile-information requirement.

          C4V does not resolve the C4U blocker. There is still no externally governed real-project `H_app` or temporal allocation, so no LARE member is admitted for an actual groundwater application. C4V also makes no new cost measurement, portable speedup claim or production-ROM claim.
          MD

      - name: Persist exact C4V result and closeout
        run: |
          set -euo pipefail
          cp /tmp/c4v/LARE_BC2_C4V_RESULT.json integration/f-rom/LARE_BC2_C4V_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C4V_RESULT.json integration/f-rom/LARE_BC2_C4V_CLOSEOUT.json integration/f-rom/LARE_RS1_STATUS.json docs/science/F-ROM_LARE_BC2_C4V_CLOSEOUT.md
          git diff --cached --check
          git commit -m "F-ROM-LARE: close C4V one-day GW persistence"
          git push origin HEAD:work/f-rom-lare-rs1
