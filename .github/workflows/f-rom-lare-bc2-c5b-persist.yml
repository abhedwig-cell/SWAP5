name: F-ROM-LARE persist C5B mechanism audit

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c5b-persist.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-rom-lare-rs1
          fetch-depth: 0

      - name: Recover authoritative C5B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5b
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10601569696" > /tmp/c5b/artifact.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/c5b/artifact.json'))
          assert a['id']==10601569696
          assert a['digest']=='sha256:09dbf124ff36002ff4310c71af3eba30f51a21c46eea579cbcdf2ad598b14f96'
          assert a['workflow_run']['id']==35499374653
          assert a['workflow_run']['head_sha']=='e5cba46834e4e7178aaac30d9795fa479aa6681f'
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10601569696/zip" > /tmp/c5b.zip
          echo "09dbf124ff36002ff4310c71af3eba30f51a21c46eea579cbcdf2ad598b14f96  /tmp/c5b.zip" | sha256sum -c -
          unzip -q /tmp/c5b.zip -d /tmp/c5b/evidence
          echo "f6710fcf081320ea4aa654a8bf0c3f02a42b251d2cdc8cadfd7096a66bce6668  /tmp/c5b/evidence/LARE_BC2_C5B_RESULT.json" | sha256sum -c -

      - name: Persist result and build C5B closeout
        run: |
          set -euo pipefail
          cp /tmp/c5b/evidence/LARE_BC2_C5B_RESULT.json integration/f-rom/LARE_BC2_C5B_RESULT.json
          python3 - <<'PY'
          import json,pathlib
          r=json.load(open('integration/f-rom/LARE_BC2_C5B_RESULT.json'))
          ratios=r['effect_sizes']['ratios_to_current_reference_residual']
          labels=r['effect_sizes']['ratio_labels']
          rich=r['timestep_signed_bias_convergence']
          cur=r['runs']['R16_CURRENT_DT25']['signed_flux']
          bnd=r['runs']['R16_BOUNDARY_DT25']['signed_flux']
          hold_max=max(
            row['HOLD']['rmse_cm_per_day']
            for row in cur['by_phase'].values()
          )
          dynamic_phase_rmse=max(
            row[p]['rmse_cm_per_day']
            for row in cur['by_phase'].values()
            for p in ('PHASE1','PHASE2')
          )
          closeout={
            'schema':'swap5.lare.bc2.c5b.closeout.v1',
            'workstream':'F-ROM-LARE',
            'work_unit':'LARE-BC2-C5B',
            'status':'CLOSED_TIME_AND_UPPER_STATE_PLATEAU_PRESCRIBED_HEAD_BOUNDARY_RESPONSE_LOCALIZED',
            'role':'ZERO_FIT_MECHANISTIC_RECONCILIATION',
            'authority':{
              'preregistration':'integration/f-rom/LARE_BC2_C5B_PREREGISTRATION.json',
              'workflow_run':35499374653,
              'job_id':106048267545,
              'execution_head':'e5cba46834e4e7178aaac30d9795fa479aa6681f',
              'artifact_id':10601569696,
              'artifact_digest':'sha256:09dbf124ff36002ff4310c71af3eba30f51a21c46eea579cbcdf2ad598b14f96',
              'result_sha256':'f6710fcf081320ea4aa654a8bf0c3f02a42b251d2cdc8cadfd7096a66bce6668',
              'source_C5A_result_sha256':'50ac095f50f47370c6d201a18c11522f765f608ea1970eca50df0ced65a560dc'
            },
            'formal_C5A_decision_retained':r['formal_C5A_decision_retained'],
            'baseline_identity_to_C5A_R16':r['baseline_identity_to_C5A_R16'],
            'mechanism_evidence':{
              'R2_cancellation_ratio':r['R2_signed_flux_decomposition']['cancellation_ratio'],
              'integration_shift_over_residual':ratios['integration_shift_over_current_residual'],
              'state_R5_to_R16_shift_over_residual':ratios['state_R5_to_R16_shift_over_current_residual'],
              'state_R8_to_R16_shift_over_residual':ratios['state_R8_to_R16_shift_over_current_residual'],
              'boundary_face_counterfactual_shift_over_residual':ratios['closure_shift_over_current_residual'],
              'labels':labels,
              'current_face_dt25_signed_bias_cm_per_day':cur['pooled_signed_mean_cm_per_day'],
              'current_face_dt25_flux_rmse_cm_per_day':cur['pooled_rmse_cm_per_day'],
              'boundary_face_dt25_signed_bias_cm_per_day':bnd['pooled_signed_mean_cm_per_day'],
              'boundary_face_dt25_flux_rmse_cm_per_day':bnd['pooled_rmse_cm_per_day'],
              'max_HOLD_phase_rmse_cm_per_day':hold_max,
              'max_dynamic_phase_rmse_cm_per_day':dynamic_phase_rmse,
              'timestep_convergence':rich
            },
            'adjudication':{
              'R2_AGGREGATION_CANCELLATION_STRONG':True,
              'TIME_INTEGRATION_SENSITIVE':False,
              'UPPER_OR_MID_COLUMN_STATE_RESOLUTION_SENSITIVE':False,
              'PRESCRIBED_HEAD_BOUNDARY_FORMULATION_SENSITIVE':True,
              'BOUNDARY_FACE_IS_BETTER':False,
              'CURRENT_LAYER_FACE_REMAINS_ACCEPTED_CLOSURE':True,
              'BOTTOM_ADJACENT_SPATIAL_RESOLUTION_UNRESOLVED':True
            },
            'scientific_interpretation':[
              'The C5A blocking signed-flux residual is not a timestep-integration floor. The dt=1e-4 to 2.5e-5 bottom-flux shift is about 4.68e-6 of the remaining current-face Reference residual, and the signed bias converges with estimated second order to approximately -4.23448e-6 cm/d.',
              'Adding lower-zone states upward from R5 to R16 does not affect the mechanism materially. R8 and R16 are exactly identical in the diagnostic bottom-flux series at dt=2.5e-5; R5-to-R16 differences are also about 5.86e-6 of the Reference residual.',
              'The residual is active only during prescribed-head phases. During HOLD the current-face R16 flux error is effectively machine zero.',
              'The pre-existing BOUNDARY_FACE counterfactual is highly sensitive but much worse, changing the flux series by more than 337 times the current-face residual and increasing pooled RMSE from about 2.97e-5 to about 1.00e-2 cm/d.',
              'Therefore C5B does not justify replacing CURRENT_LAYER_FACE. It localizes the remaining discrepancy to the prescribed-head boundary response while leaving one unresolved spatial question: every tested lower-zone ladder retained a 10-cm bottom-adjacent layer.',
              'A bottom-cell-thickness refinement test is required before attributing the residual to the closure algebra itself.'
            ],
            'next_authority':{
              'state':'BOUNDARY_ADJACENT_SPATIAL_REFINEMENT_AUTHORIZED',
              'target':'LARE-BC2-C5C',
              'question':'Does the current-face prescribed-head residual converge as the bottom-adjacent layer thickness is reduced below 10 cm while the rest of the C5A workload and closure remain fixed?',
              'constraints':[
                'reuse exact C5A B14 histories and R16 Reference',
                'retain CURRENT_LAYER_FACE and dt=2.5e-5',
                'change only bottom-adjacent spatial discretization in a preregistered nested refinement family',
                'do not reinterpret C5A acceptance',
                'BOUNDARY_FACE remains counterfactual-only and is not retuned',
                'no application, performance, speed or production claim'
              ]
            },
            'scientific_firewall':r['scientific_firewall']
          }
          pathlib.Path('integration/f-rom/LARE_BC2_C5B_CLOSEOUT.json').write_text(json.dumps(closeout,indent=2,sort_keys=True)+'\n')
          PY
          cat > docs/science/F-ROM_LARE_BC2_C5B_CLOSEOUT.md <<'MD'
          # F-ROM-LARE BC2-C5B closeout

          C5B diagnoses the single component that blocked the matched B14 dynamic-head C5A frontier. It does not change the C5A result or acceptance vector.

          The authoritative run is 35499374653 at execution head e5cba46834e4e7178aaac30d9795fa479aa6681f. The exact C5B result SHA-256 is f6710fcf081320ea4aa654a8bf0c3f02a42b251d2cdc8cadfd7096a66bce6668.

          The timestep explanation is effectively eliminated. Refining iterative Heun from dt=1e-4 to 5e-5 to 2.5e-5 changes the R16 current-face bottom-flux trajectory by only about 4.68e-6 of its remaining Reference RMSE. The pooled signed error converges with estimated order 2.00 to about -4.23448e-6 cm/d.

          The ordinary lower-zone state-count explanation is also eliminated within the tested representation family. At dt=2.5e-5, R8 and R16 produce exactly the same bottom-flux series. R5 differs from R16 by only about 5.86e-6 of the current-face Reference residual. Adding layers upward therefore does not remove the C5A blocker.

          The error is localized to prescribed-head operation. In every history, HOLD-phase bottom-flux error for current-face R16 is essentially machine zero. The residual appears only in PHASE1 and PHASE2, when the prescribed lower-boundary head is active.

          Boundary formulation matters strongly, but the pre-existing BOUNDARY_FACE alternative is not the solution. At R16 and dt=2.5e-5 its flux-series difference from CURRENT_LAYER_FACE is more than 337 times the current-face Reference residual, and its pooled RMSE grows from about 2.97e-5 to about 1.00e-2 cm/d. CURRENT_LAYER_FACE therefore remains the supported BC1 closure of the two existing alternatives.

          One spatial mechanism remains unresolved. R5, R8 and R16 all retain the same 10-cm bottom-adjacent layer. C5B can therefore reject insufficient refinement farther up the column, but it cannot distinguish a current-face closure-algebra floor from a boundary-adjacent spatial-discretization floor.

          The next experiment is C5C: nested refinement of only the bottom 10 cm, with the exact C5A histories, B14 material, CURRENT_LAYER_FACE closure and fine diagnostic timestep held fixed.
          MD

      - name: Advance representation-selection authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('integration/f-rom/LARE_REPRESENTATION_SELECTION_CLOSEOUT.json')
          j=json.loads(p.read_text())
          j['schema']='swap5.lare.representation-selection.closeout.v7'
          j['status']='CLOSED_THROUGH_C5B_PRESCRIBED_HEAD_RESIDUAL_LOCALIZED_BOTTOM_CELL_REFINEMENT_NEXT'
          j.setdefault('authorities',{}).update({
            'C5B_signed_flux_mechanism':'integration/f-rom/LARE_BC2_C5B_CLOSEOUT.json'
          })
          j.setdefault('additional_reconciled_findings',{}).update({
            'C5B':'Timestep convergence and added lower-zone state above the boundary cell are negligible relative to the C5A residual. Error is confined to prescribed-head phases. BOUNDARY_FACE is strongly sensitive but substantially worse. The unresolved axis is bottom-adjacent spatial thickness under CURRENT_LAYER_FACE.'
          })
          j['decision']='PREREGISTER_C5C_BOTTOM_ADJACENT_SPATIAL_REFINEMENT_BEFORE_ANY_NEW_CLOSURE_FORMULATION'
          j['next_authority']='LARE-BC2-C5C'
          j['next_family_authority']={
            'family':'C5C_BOTTOM_ADJACENT_SPATIAL_REFINEMENT',
            'state':'AUTHORIZED_FOR_PROSPECTIVE_DIAGNOSTIC_PREREGISTRATION',
            'repository_basis':[
              'integration/f-rom/LARE_BC2_C5B_CLOSEOUT.json',
              'integration/f-rom/LARE_BC2_C5A_CLOSEOUT.json'
            ],
            'purpose':'Determine whether the prescribed-head current-face residual is a 10-cm boundary-cell discretization effect before inventing or fitting a new closure.',
            'application_acceptance_blocker':'integration/f-rom/LARE_BC2_C4U_GW_ACCEPTANCE_AUTHORITY.json',
            'new_closure_authorized':False,
            'implementation_authorized':True
          }
          j['application_acceptance_adjudicated']=False
          j['performance_comparison_authorized']=False
          j['speed_claim_authorized']=False
          j['production_rom_authorized']=False
          p.write_text(json.dumps(j,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit C5B closeout
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C5B_RESULT.json                   integration/f-rom/LARE_BC2_C5B_CLOSEOUT.json                   integration/f-rom/LARE_REPRESENTATION_SELECTION_CLOSEOUT.json                   docs/science/F-ROM_LARE_BC2_C5B_CLOSEOUT.md
          git diff --cached --check
          git commit -m "F-ROM-LARE: close C5B mechanism audit"
          git push origin HEAD:work/f-rom-lare-rs1
