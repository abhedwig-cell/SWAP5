name: F-ROM-LARE BC2-C5C bottom-cell and Reference refinement

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C5C_PREREGISTRATION.json'
      - 'integration/f-rom/LARE_BC2_C5C_EXECUTION_BINDING_RECONCILIATION.json'
      - 'tests/rom/materialize_lare_bc2_c5c_reference_refinement.py'
      - 'tests/rom/analyze_lare_bc2_c5c_bottom_refinement.py'
      - '.github/workflows/f-rom-lare-bc2-c5c.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c5c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen C5A Reference backend
        uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Verify C5C authority and implementation binding
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5c_reference_refinement.py)" = "b3529057034ee5d964a74048e1d5bcde165275e7"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c5c_bottom_refinement.py)" = "8a672eea451b2f9e2799b80428e7b01f3824d6f8"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5a_b14_dynamic_head.py)" = "f4f666d3504568d084d1d5ca3f90008ab6af2df9"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c4z_dynamic_head.py)" = "105e75b93425780f565c714de1be1cb7ae0ee767"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c5b_signed_flux_mechanism.py)" = "b51b4b60fd229786ec566948f400eb69771d0c56"
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C5C_PREREGISTRATION.json'))
          c=json.load(open('integration/f-rom/LARE_BC2_C5B_CLOSEOUT.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C5C_R32_R64_RESPONSE'
          assert c['status']=='CLOSED_TIME_AND_UPPER_STATE_PLATEAU_PRESCRIBED_HEAD_BOUNDARY_RESPONSE_LOCALIZED'
          assert p['authority']['new_closure_authorized'] is False
          assert p['scientific_firewall']['C5A_formal_decision_changed'] is False
          r=json.load(open('integration/f-rom/LARE_BC2_C5C_EXECUTION_BINDING_RECONCILIATION.json'))
          assert r['status']=='TECHNICAL_REFERENCE_PARSER_REPAIRED_BEFORE_ANY_LARE_REFINEMENT_METRICS'
          assert r['repair']['new_analyzer_blob']=='8a672eea451b2f9e2799b80428e7b01f3824d6f8'
          assert r['repair']['scientific_effect']=='NONE'
          assert r['response_use']['R32_R64_hydrological_values_used_for_repair'] is False
          print('LARE_BC2_C5C_AUTHORITY_LOCK=PASS')
          PY

      - name: Recover exact C5A R16 anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5c/c5a /tmp/c5c/reference LARE_BC2_C5C_EVIDENCE
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10600184543/zip" > /tmp/c5c/c5a.zip
          echo "272756bb6942b7bea0cd0b3e058dbe374e9172c28963fae184f0a101c646c46f  /tmp/c5c/c5a.zip" | sha256sum -c -
          unzip -q /tmp/c5c/c5a.zip -d /tmp/c5c/c5a
          echo "16c641a0f7d306ce423f9127e6769c0d76ba117da3d61d6d8e6651d53c99bd8b  /tmp/c5c/c5a/R16_o0.txt" | sha256sum -c -
          cp /tmp/c5c/c5a/R16_o0.txt /tmp/c5c/reference/R16_o0.txt
          echo "LARE_BC2_C5C_R16_ANCHOR=PASS"

      - name: Materialize C5C fine Reference harness
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c5c_reference_refinement.py             --c5a-materializer tests/rom/materialize_lare_bc2_c5a_b14_dynamic_head.py             --c4z-materializer tests/rom/materialize_lare_bc2_c4z_dynamic_head.py             --source tests/rom/test_lare_rs1_gw_library.f90             --output canonical/tests/rom/test_lare_bc2_c5c_reference.f90             --manifest LARE_BC2_C5C_EVIDENCE/materialization.json

      - name: Generate R32 and R64 current-canonical trajectories
        run: |
          set -euo pipefail
          for spec in "R32 32 5" "R64 64 2.5"; do
            read -r id n dz <<<"$spec"
            stub="canonical/c5c_${id}_stubs.f90"
            python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py               --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90               --output "$stub" --nodes "$n" --dz-cm "$dz"
            for opt in 0 2; do
              build="/tmp/c5c/build_${id}_o${opt}"
              python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py                 --root canonical                 --stub "c5c_${id}_stubs.f90"                 --target tests/rom/test_lare_bc2_c5c_reference.f90                 --external-source src/legacy/b1_10_port/headcalc.f90                 --build "$build" --opt "$opt"
              log="/tmp/c5c/reference/${id}_o${opt}.txt"
              set +e
              "$build/rom0_test" > "$log" 2>&1
              rc=$?
              set -e
              if [[ "$rc" -ne 0 ]]; then
                cp "$log" "LARE_BC2_C5C_EVIDENCE/${id}_o${opt}_FAILED.txt"
                echo "LARE_BC2_C5C_REFERENCE_EXECUTION_FAILURE|${id}|O${opt}|RC=${rc}"
                cat "$log"
                exit "$rc"
              fi
              grep -Fq 'LAREGW1_EXECUTION_COMPLETE=PASS' "$log"
              grep -Fq 'LAREGW1_C5C_B14_REFERENCE_REFINEMENT_GENERATED=TRUE' "$log"
              test "$(grep -c 'LAREGW1_STATE|' "$log")" -eq 4096
              test "$(grep -c 'LAREGW1_HISTORY_PASS|' "$log")" -eq 4
              python3 - "$log" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREGW1_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None
          assert abs(float(m.group(1))) <= 1e-12
          PY
            done
            cmp "/tmp/c5c/reference/${id}_o0.txt" "/tmp/c5c/reference/${id}_o2.txt"
            cp "/tmp/c5c/reference/${id}_o0.txt" LARE_BC2_C5C_EVIDENCE/
          done
          git -C canonical diff --quiet -- src reference
          echo "LARE_BC2_C5C_REFERENCE_REFINEMENT=PASS"

      - name: Execute C5C bottom-cell refinement
        run: |
          set -euo pipefail
          python3 tests/rom/analyze_lare_bc2_c5c_bottom_refinement.py             --r16 /tmp/c5c/reference/R16_o0.txt             --r32 /tmp/c5c/reference/R32_o0.txt             --r64 /tmp/c5c/reference/R64_o0.txt             --c5b-result integration/f-rom/LARE_BC2_C5B_RESULT.json             --c5b-closeout integration/f-rom/LARE_BC2_C5B_CLOSEOUT.json             --prereg integration/f-rom/LARE_BC2_C5C_PREREGISTRATION.json             --output LARE_BC2_C5C_EVIDENCE/LARE_BC2_C5C_RESULT.json             | tee LARE_BC2_C5C_EVIDENCE/runner.txt

      - name: Validate C5C firewall
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C5C_EVIDENCE/LARE_BC2_C5C_RESULT.json'))
          assert r['formal_C5A_decision_retained']=='C5A_DYNAMIC_HEAD_REDUCED_FRONTIER_NOT_PRESERVED'
          assert all(r['baseline_identity_to_C5B'].values())
          f=r['scientific_firewall']
          assert f['C5A_formal_decision_changed'] is False
          assert f['C5B_current_face_closure_changed'] is False
          assert f['new_closure_fit'] is False
          assert f['application_acceptance_adjudicated'] is False
          for row in r['lare_bottom_refinement'].values():
            assert row['max_abs_water_ledger_cm'] <= 1e-10
          print('LARE_BC2_C5C_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C5C_EVIDENCE/* > LARE_BC2_C5C_EVIDENCE/sha256.txt

      - name: Upload C5C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c5c
          path: LARE_BC2_C5C_EVIDENCE/
          if-no-files-found: error
