name: F-ROM-LARE BC2-C5E high-resolution Reference extension

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C5E_PREREGISTRATION.json'
      - 'tests/rom/materialize_lare_bc2_c5e_reference_extension.py'
      - 'tests/rom/analyze_lare_bc2_c5e_reference_extension.py'
      - '.github/workflows/f-rom-lare-bc2-c5e.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c5e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen Reference backend
        uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Verify C5E authority and implementation binding
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5e_reference_extension.py)" = "cec7bb4f2917f064cc3e6e1ec671d16634a60d37"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c5e_reference_extension.py)" = "501be4e4c287c5ef8015199a2312225bb41b534b"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5d_reference_extension.py)" = "3a43427ae46480d01c430c2299c6cc36e728ed46"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5c_reference_refinement.py)" = "b3529057034ee5d964a74048e1d5bcde165275e7"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5a_b14_dynamic_head.py)" = "f4f666d3504568d084d1d5ca3f90008ab6af2df9"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c4z_dynamic_head.py)" = "105e75b93425780f565c714de1be1cb7ae0ee767"
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C5E_PREREGISTRATION.json'))
          c=json.load(open('integration/f-rom/LARE_BC2_C5D_CLOSEOUT.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C5E_R512_RESPONSE'
          assert c['status']=='CLOSED_REFERENCE_REFINEMENT_WEAKLY_PROGRESSING_THROUGH_R256_NOT_ASYMPTOTIC'
          assert c['authority']['result_sha256']=='34082ec971a2461a43dae87faa885579b60a37241fff337ccc2c948b21345a50'
          assert p['reference_hierarchy']['primary_new']['id']=='R512'
          assert p['reference_hierarchy']['secondary_new']['id']=='R1024'
          assert p['scientific_firewall']['new_lare_run'] is False
          print('LARE_BC2_C5E_AUTHORITY_LOCK=PASS')
          PY

      - name: Recover frozen R64 R128 R256 anchors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5e/anchors /tmp/c5e/reference LARE_BC2_C5E_EVIDENCE

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10602125716/zip" > /tmp/c5e/c5c.zip
          echo "ef24d9268e6758a6bb0440aa3c8bcc35c2785d0ae79912a526374250069ca86a  /tmp/c5e/c5c.zip" | sha256sum -c -
          unzip -q /tmp/c5e/c5c.zip -d /tmp/c5e/anchors/c5c
          echo "dc358f0862c01b8953c29b4a3f17cccdba99b1b8713dfd0f9d8fe359e3f844c1  /tmp/c5e/anchors/c5c/R64_o0.txt" | sha256sum -c -
          cp /tmp/c5e/anchors/c5c/R64_o0.txt /tmp/c5e/reference/R64_o0.txt

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10600714885/zip" > /tmp/c5e/c5d.zip
          echo "d08ceaf2d6dea6464ebca829bb91e15a3857ad669b573a74a2a67b09c15451eb  /tmp/c5e/c5d.zip" | sha256sum -c -
          unzip -q /tmp/c5e/c5d.zip -d /tmp/c5e/anchors/c5d
          echo "22b02d59bda0fba30e90a76c589fc4b4e4ce6618d3bd77d76d191fb8e2eb29fe  /tmp/c5e/anchors/c5d/R128_o0.txt" | sha256sum -c -
          echo "684567f5965e78f84e17c9dab98de35c877fbbee49bcd3dba6dfd5e9de7e0961  /tmp/c5e/anchors/c5d/R256_o0.txt" | sha256sum -c -
          cp /tmp/c5e/anchors/c5d/R128_o0.txt /tmp/c5e/reference/R128_o0.txt
          cp /tmp/c5e/anchors/c5d/R256_o0.txt /tmp/c5e/reference/R256_o0.txt
          echo "LARE_BC2_C5E_FROZEN_ANCHORS=PASS"

      - name: Materialize C5E Reference-only harness
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c5e_reference_extension.py             --c5d-materializer tests/rom/materialize_lare_bc2_c5d_reference_extension.py             --c5c-materializer tests/rom/materialize_lare_bc2_c5c_reference_refinement.py             --c5a-materializer tests/rom/materialize_lare_bc2_c5a_b14_dynamic_head.py             --c4z-materializer tests/rom/materialize_lare_bc2_c4z_dynamic_head.py             --source tests/rom/test_lare_rs1_gw_library.f90             --output canonical/tests/rom/test_lare_bc2_c5e_reference.f90             --manifest LARE_BC2_C5E_EVIDENCE/materialization.json

      - name: Generate required R512 Reference
        run: |
          set -euo pipefail
          id=R512
          n=512
          dz=0.3125
          stub="canonical/c5e_${id}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes "$n" --dz-cm "$dz"
          for opt in 0 2; do
            build="/tmp/c5e/build_${id}_o${opt}"
            python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py               --root canonical               --stub "c5e_${id}_stubs.f90"               --target tests/rom/test_lare_bc2_c5e_reference.f90               --external-source src/legacy/b1_10_port/headcalc.f90               --build "$build" --opt "$opt"
            log="/tmp/c5e/reference/${id}_o${opt}.txt"
            "$build/rom0_test" > "$log" 2>&1
            grep -Fq 'LAREGW1_EXECUTION_COMPLETE=PASS' "$log"
            grep -Fq 'LAREGW1_C5E_B14_REFERENCE_EXTENSION_GENERATED=TRUE' "$log"
            test "$(grep -c 'LAREGW1_STATE|' "$log")" -eq 4096
            test "$(grep -c 'LAREGW1_HISTORY_PASS|' "$log")" -eq 4
            test "$(grep -c 'LAREGW1_NODE|' "$log")" -eq 0
            python3 - "$log" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREGW1_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None
          assert abs(float(m.group(1))) <= 1e-12
          PY
          done
          cmp /tmp/c5e/reference/R512_o0.txt /tmp/c5e/reference/R512_o2.txt
          cp /tmp/c5e/reference/R512_o0.txt LARE_BC2_C5E_EVIDENCE/
          echo "LARE_BC2_C5E_R512=PASS"

      - name: Attempt optional R1024 without retuning
        id: r1024
        run: |
          set -uo pipefail
          id=R1024
          n=1024
          dz=0.15625
          stub="canonical/c5e_${id}_stubs.f90"
          status=PASS
          reason=""
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes "$n" --dz-cm "$dz"             > LARE_BC2_C5E_EVIDENCE/R1024_materialize.log 2>&1 || { status=FAIL; reason=MATERIALIZE; }

          if [[ "$status" == "PASS" ]]; then
            for opt in 0 2; do
              build="/tmp/c5e/build_${id}_o${opt}"
              python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py                 --root canonical                 --stub "c5e_${id}_stubs.f90"                 --target tests/rom/test_lare_bc2_c5e_reference.f90                 --external-source src/legacy/b1_10_port/headcalc.f90                 --build "$build" --opt "$opt"                 > "LARE_BC2_C5E_EVIDENCE/R1024_compile_o${opt}.log" 2>&1 || { status=FAIL; reason="COMPILE_O${opt}"; break; }

              log="/tmp/c5e/reference/${id}_o${opt}.txt"
              "$build/rom0_test" > "$log" 2>&1 || { cp "$log" "LARE_BC2_C5E_EVIDENCE/R1024_o${opt}_FAILED.txt"; status=FAIL; reason="EXECUTE_O${opt}"; break; }
              grep -Fq 'LAREGW1_EXECUTION_COMPLETE=PASS' "$log" || { status=FAIL; reason="COMPLETION_O${opt}"; break; }
              grep -Fq 'LAREGW1_C5E_B14_REFERENCE_EXTENSION_GENERATED=TRUE' "$log" || { status=FAIL; reason="MARKER_O${opt}"; break; }
              [[ "$(grep -c 'LAREGW1_STATE|' "$log")" -eq 4096 ]] || { status=FAIL; reason="STATE_COUNT_O${opt}"; break; }
              [[ "$(grep -c 'LAREGW1_HISTORY_PASS|' "$log")" -eq 4 ]] || { status=FAIL; reason="HISTORY_COUNT_O${opt}"; break; }
              [[ "$(grep -c 'LAREGW1_NODE|' "$log")" -eq 0 ]] || { status=FAIL; reason="NODE_OUTPUT_O${opt}"; break; }
              python3 - "$log" <<'PY' || { status=FAIL; reason="MASS"; break; }
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREGW1_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None
          assert abs(float(m.group(1))) <= 1e-12
          PY
            done
          fi

          if [[ "$status" == "PASS" ]]; then
            cmp /tmp/c5e/reference/R1024_o0.txt /tmp/c5e/reference/R1024_o2.txt || { status=FAIL; reason=O0_O2_IDENTITY; }
          fi

          if [[ "$status" == "PASS" ]]; then
            cp /tmp/c5e/reference/R1024_o0.txt LARE_BC2_C5E_EVIDENCE/
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "LARE_BC2_C5E_R1024=PASS"
          else
            cat > LARE_BC2_C5E_EVIDENCE/R1024_STATUS.json <<EOF
          {"available":false,"status":"QUALIFICATION_BLOCKED","reason":"${reason}","retuned":false}
          EOF
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "LARE_BC2_C5E_R1024=QUALIFICATION_BLOCKED|${reason}"
          fi
          exit 0

      - name: Execute C5E high-resolution analysis
        run: |
          set -euo pipefail
          args=(
            --r64 /tmp/c5e/reference/R64_o0.txt
            --r128 /tmp/c5e/reference/R128_o0.txt
            --r256 /tmp/c5e/reference/R256_o0.txt
            --r512 /tmp/c5e/reference/R512_o0.txt
            --c5d-result integration/f-rom/LARE_BC2_C5D_RESULT.json
            --c5d-closeout integration/f-rom/LARE_BC2_C5D_CLOSEOUT.json
            --prereg integration/f-rom/LARE_BC2_C5E_PREREGISTRATION.json
            --output LARE_BC2_C5E_EVIDENCE/LARE_BC2_C5E_RESULT.json
          )
          if [[ "${{ steps.r1024.outputs.available }}" == "true" ]]; then
            args+=(--r1024 /tmp/c5e/reference/R1024_o0.txt)
          fi
          python3 tests/rom/analyze_lare_bc2_c5e_reference_extension.py "${args[@]}"             | tee LARE_BC2_C5E_EVIDENCE/runner.txt

      - name: Validate C5E firewall
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C5E_EVIDENCE/LARE_BC2_C5E_RESULT.json'))
          assert r['formal_C5A_decision_retained']=='C5A_DYNAMIC_HEAD_REDUCED_FRONTIER_NOT_PRESERVED'
          assert all(r['baseline_identity_to_C5D'].values())
          f=r['scientific_firewall']
          assert f['new_lare_run'] is False
          assert f['new_closure_fit'] is False
          assert f['C5A_formal_decision_changed'] is False
          assert f['application_acceptance_adjudicated'] is False
          assert f['performance_comparison_authorized'] is False
          assert f['speed_claim_authorized'] is False
          assert f['production_rom_authorized'] is False
          print('LARE_BC2_C5E_FIREWALL=PASS')
          PY
          git -C canonical diff --quiet -- src reference
          sha256sum LARE_BC2_C5E_EVIDENCE/* > LARE_BC2_C5E_EVIDENCE/sha256.txt

      - name: Upload C5E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c5e
          path: LARE_BC2_C5E_EVIDENCE/
          if-no-files-found: error
