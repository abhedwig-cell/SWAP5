name: F-ROM-LARE BC2-C5F space-time Reference audit

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C5F_PREREGISTRATION.json'
      - 'tests/rom/materialize_lare_bc2_c5f_spatiotemporal.py'
      - 'tests/rom/analyze_lare_bc2_c5f_spatiotemporal.py'
      - '.github/workflows/f-rom-lare-bc2-c5f.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c5f-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen Reference backend
        uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Verify C5F authority and implementation binding
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5f_spatiotemporal.py)" = "2bc5b00b924aa018fb14a1ab108180f380a6ae5e"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c5f_spatiotemporal.py)" = "3eeb6e8909735f56badaf94a1ba03a864cf92c25"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5e_reference_extension.py)" = "cec7bb4f2917f064cc3e6e1ec671d16634a60d37"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5d_reference_extension.py)" = "3a43427ae46480d01c430c2299c6cc36e728ed46"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5c_reference_refinement.py)" = "b3529057034ee5d964a74048e1d5bcde165275e7"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5a_b14_dynamic_head.py)" = "f4f666d3504568d084d1d5ca3f90008ab6af2df9"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c4z_dynamic_head.py)" = "105e75b93425780f565c714de1be1cb7ae0ee767"
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C5F_PREREGISTRATION.json'))
          c=json.load(open('integration/f-rom/LARE_BC2_C5E_CLOSEOUT.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C5F_REFINED_TIME_RESPONSE'
          assert c['status']=='CLOSED_REFERENCE_REFINEMENT_STRONGLY_IMPROVING_THROUGH_R1024_SPATIOTEMPORAL_RECONCILIATION_NEXT'
          assert c['authority']['result_sha256']=='80288f4dbc6d7fce59aef7c92226de702a8506810c3c49debf486abcf906e75a'
          assert p['temporal_routes']['T2']['main_transaction_dt_day']==0.0004
          assert p['temporal_routes']['T4']['main_transaction_dt_day']==0.0002
          assert p['scientific_firewall']['new_lare_run'] is False
          print('LARE_BC2_C5F_AUTHORITY_LOCK=PASS')
          PY

      - name: Recover frozen C5E T1 anchors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5f/t1 /tmp/c5f/t2 /tmp/c5f/t4 LARE_BC2_C5F_EVIDENCE
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10602206315/zip" > /tmp/c5f/c5e.zip
          echo "08afdd428dfd5b394982af16b0cbf5acff98e20d1931e33150a3532696d4cd4c  /tmp/c5f/c5e.zip" | sha256sum -c -
          unzip -q /tmp/c5f/c5e.zip -d /tmp/c5f/t1
          echo "b17e218573e0e1d121c7a35a3e68e9ad7748ce8b38408c4b3d22915ab8a6648c  /tmp/c5f/t1/R512_o0.txt" | sha256sum -c -
          echo "e52b1bf20f5e353b59c289ab4b7778a48cb9c167a8b7cdaf70d3b0b0d3990505  /tmp/c5f/t1/R1024_o0.txt" | sha256sum -c -
          echo "80288f4dbc6d7fce59aef7c92226de702a8506810c3c49debf486abcf906e75a  /tmp/c5f/t1/LARE_BC2_C5E_RESULT.json" | sha256sum -c -
          echo "LARE_BC2_C5F_T1_ANCHORS=PASS"

      - name: Materialize T2 and T4 matched physical histories
        run: |
          set -euo pipefail
          for factor in 2 4; do
            python3 tests/rom/materialize_lare_bc2_c5f_spatiotemporal.py               --c5e-materializer tests/rom/materialize_lare_bc2_c5e_reference_extension.py               --c5d-materializer tests/rom/materialize_lare_bc2_c5d_reference_extension.py               --c5c-materializer tests/rom/materialize_lare_bc2_c5c_reference_refinement.py               --c5a-materializer tests/rom/materialize_lare_bc2_c5a_b14_dynamic_head.py               --c4z-materializer tests/rom/materialize_lare_bc2_c4z_dynamic_head.py               --source tests/rom/test_lare_rs1_gw_library.f90               --temporal-factor "$factor"               --output "canonical/tests/rom/test_lare_bc2_c5f_t${factor}.f90"               --manifest "LARE_BC2_C5F_EVIDENCE/materialization_t${factor}.json"
          done

      - name: Generate required T2 R512 and R1024
        run: |
          set -euo pipefail
          for spec in "R512 512 0.3125" "R1024 1024 0.15625"; do
            read -r id n dz <<<"$spec"
            stub="canonical/c5f_t2_${id}_stubs.f90"
            python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py               --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90               --output "$stub" --nodes "$n" --dz-cm "$dz"
            for opt in 0 2; do
              build="/tmp/c5f/build_t2_${id}_o${opt}"
              python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py                 --root canonical                 --stub "c5f_t2_${id}_stubs.f90"                 --target tests/rom/test_lare_bc2_c5f_t2.f90                 --external-source src/legacy/b1_10_port/headcalc.f90                 --build "$build" --opt "$opt"
              log="/tmp/c5f/t2/${id}_o${opt}.txt"
              "$build/rom0_test" > "$log" 2>&1
              grep -Fq 'LAREGW1_EXECUTION_COMPLETE=PASS' "$log"
              grep -Fq 'LAREGW1_C5F_B14_SPATIOTEMPORAL_GENERATED=TRUE' "$log"
              test "$(grep -c 'LAREGW1_STATE|' "$log")" -eq 8192
              test "$(grep -c 'LAREGW1_HISTORY_PASS|' "$log")" -eq 4
              test "$(grep -c 'LAREGW1_NODE|' "$log")" -eq 0
              python3 - "$log" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREGW1_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None
          assert abs(float(m.group(1))) <= 1e-12
          PY
            done
            cmp "/tmp/c5f/t2/${id}_o0.txt" "/tmp/c5f/t2/${id}_o2.txt"
            cp "/tmp/c5f/t2/${id}_o0.txt" "LARE_BC2_C5F_EVIDENCE/${id}_T2_o0.txt"
          done
          echo "LARE_BC2_C5F_T2=PASS"

      - name: Attempt optional R1024 T4 without retuning
        id: t4
        run: |
          set -uo pipefail
          id=R1024
          n=1024
          dz=0.15625
          stub="canonical/c5f_t4_${id}_stubs.f90"
          status=PASS
          reason=""
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes "$n" --dz-cm "$dz"             > LARE_BC2_C5F_EVIDENCE/R1024_T4_materialize.log 2>&1 || { status=FAIL; reason=MATERIALIZE; }

          if [[ "$status" == "PASS" ]]; then
            for opt in 0 2; do
              build="/tmp/c5f/build_t4_${id}_o${opt}"
              python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py                 --root canonical                 --stub "c5f_t4_${id}_stubs.f90"                 --target tests/rom/test_lare_bc2_c5f_t4.f90                 --external-source src/legacy/b1_10_port/headcalc.f90                 --build "$build" --opt "$opt"                 > "LARE_BC2_C5F_EVIDENCE/R1024_T4_compile_o${opt}.log" 2>&1 || { status=FAIL; reason="COMPILE_O${opt}"; break; }
              log="/tmp/c5f/t4/${id}_o${opt}.txt"
              "$build/rom0_test" > "$log" 2>&1 || { cp "$log" "LARE_BC2_C5F_EVIDENCE/R1024_T4_o${opt}_FAILED.txt"; status=FAIL; reason="EXECUTE_O${opt}"; break; }
              grep -Fq 'LAREGW1_EXECUTION_COMPLETE=PASS' "$log" || { status=FAIL; reason="COMPLETION_O${opt}"; break; }
              grep -Fq 'LAREGW1_C5F_B14_SPATIOTEMPORAL_GENERATED=TRUE' "$log" || { status=FAIL; reason="MARKER_O${opt}"; break; }
              [[ "$(grep -c 'LAREGW1_STATE|' "$log")" -eq 16384 ]] || { status=FAIL; reason="STATE_COUNT_O${opt}"; break; }
              [[ "$(grep -c 'LAREGW1_HISTORY_PASS|' "$log")" -eq 4 ]] || { status=FAIL; reason="HISTORY_COUNT_O${opt}"; break; }
              [[ "$(grep -c 'LAREGW1_NODE|' "$log")" -eq 0 ]] || { status=FAIL; reason="NODE_OUTPUT_O${opt}"; break; }
              python3 - "$log" <<'PY' || { status=FAIL; reason="MASS"; break; }
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREGW1_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None
          assert abs(float(m.group(1))) <= 1e-12
          PY
            done
          fi

          if [[ "$status" == "PASS" ]]; then
            cmp /tmp/c5f/t4/R1024_o0.txt /tmp/c5f/t4/R1024_o2.txt || { status=FAIL; reason=O0_O2_IDENTITY; }
          fi

          if [[ "$status" == "PASS" ]]; then
            cp /tmp/c5f/t4/R1024_o0.txt LARE_BC2_C5F_EVIDENCE/R1024_T4_o0.txt
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "LARE_BC2_C5F_R1024_T4=PASS"
          else
            cat > LARE_BC2_C5F_EVIDENCE/R1024_T4_STATUS.json <<EOF
          {"available":false,"status":"QUALIFICATION_BLOCKED","reason":"${reason}","retuned":false}
          EOF
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "LARE_BC2_C5F_R1024_T4=QUALIFICATION_BLOCKED|${reason}"
          fi
          exit 0

      - name: Execute C5F space-time analysis
        run: |
          set -euo pipefail
          args=(
            --r512-t1 /tmp/c5f/t1/R512_o0.txt
            --r1024-t1 /tmp/c5f/t1/R1024_o0.txt
            --r512-t2 /tmp/c5f/t2/R512_o0.txt
            --r1024-t2 /tmp/c5f/t2/R1024_o0.txt
            --c5e-result /tmp/c5f/t1/LARE_BC2_C5E_RESULT.json
            --c5e-closeout integration/f-rom/LARE_BC2_C5E_CLOSEOUT.json
            --prereg integration/f-rom/LARE_BC2_C5F_PREREGISTRATION.json
            --output LARE_BC2_C5F_EVIDENCE/LARE_BC2_C5F_RESULT.json
          )
          if [[ "${{ steps.t4.outputs.available }}" == "true" ]]; then
            args+=(--r1024-t4 /tmp/c5f/t4/R1024_o0.txt)
          fi
          python3 tests/rom/analyze_lare_bc2_c5f_spatiotemporal.py "${args[@]}"             | tee LARE_BC2_C5F_EVIDENCE/runner.txt

      - name: Validate C5F firewall
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C5F_EVIDENCE/LARE_BC2_C5F_RESULT.json'))
          assert r['formal_C5A_decision_retained']=='C5A_DYNAMIC_HEAD_REDUCED_FRONTIER_NOT_PRESERVED'
          assert all(r['baseline_identity_to_C5E'].values())
          f=r['scientific_firewall']
          assert f['new_lare_run'] is False
          assert f['new_closure_fit'] is False
          assert f['physical_history_changed'] is False
          assert f['C5A_formal_decision_changed'] is False
          assert f['application_acceptance_adjudicated'] is False
          assert f['performance_comparison_authorized'] is False
          assert f['speed_claim_authorized'] is False
          assert f['production_rom_authorized'] is False
          print('LARE_BC2_C5F_FIREWALL=PASS')
          PY
          git -C canonical diff --quiet -- src reference
          sha256sum LARE_BC2_C5F_EVIDENCE/* > LARE_BC2_C5F_EVIDENCE/sha256.txt

      - name: Upload C5F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c5f
          path: LARE_BC2_C5F_EVIDENCE/
          if-no-files-found: error
