name: F-ROM-LARE BC2-C5I matched T16 Reference extension

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C5I_PREREGISTRATION.json'
      - 'integration/f-rom/LARE_BC2_C5I_EXECUTION_BINDING_RECONCILIATION.json'
      - 'tests/rom/materialize_lare_bc2_c5i_t16.py'
      - 'tests/rom/analyze_lare_bc2_c5i_t16.py'
      - '.github/workflows/f-rom-lare-bc2-c5i.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c5i-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  route:
    name: route-${{ matrix.id }}-o${{ matrix.opt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: R512
            nodes: 512
            dz: 0.3125
            opt: 0
          - id: R512
            nodes: 512
            dz: 0.3125
            opt: 2
          - id: R1024
            nodes: 1024
            dz: 0.15625
            opt: 0
          - id: R1024
            nodes: 1024
            dz: 0.15625
            opt: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen Reference backend
        uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Verify C5I authority and execution repair
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5i_t16.py)" = "371af1c7fcca243d04d84fca92a028746ba0ac5c"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c5i_t16.py)" = "9748f03b5659ddc0cee1722380ee0bc683dc3430"
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C5I_PREREGISTRATION.json'))
          c=json.load(open('integration/f-rom/LARE_BC2_C5H_CLOSEOUT.json'))
          e=json.load(open('integration/f-rom/LARE_BC2_C5I_EXECUTION_BINDING_RECONCILIATION.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C5I_T16_RESPONSE'
          assert c['status']=='CLOSED_T8_TEMPORAL_PROGRESS_SPATIAL_GAP_STILL_INCREASING_T16_REQUIRED'
          assert c['authority']['result_sha256']=='2af0756ec31ec62bd6348404d656a969d5b5005c262c72ed0318cf950723c75e'
          assert e['status']=='TECHNICAL_EXECUTION_TOPOLOGY_REPAIR_AFTER_REPEATED_EXTERNAL_RUNNER_SHUTDOWN'
          assert e['repair']['scientific_effect']=='NONE'
          assert e['repair']['materializer_blob_unchanged']=='371af1c7fcca243d04d84fca92a028746ba0ac5c'
          assert e['repair']['analyzer_blob_unchanged']=='9748f03b5659ddc0cee1722380ee0bc683dc3430'
          assert e['response_use']['T16_hydrological_metrics_used_for_repair'] is False
          print('LARE_BC2_C5I_EXECUTION_REPAIR_LOCK=PASS')
          PY

      - name: Materialize exact T16 physical history
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c5i_t16.py             --c5e-materializer tests/rom/materialize_lare_bc2_c5e_reference_extension.py             --c5d-materializer tests/rom/materialize_lare_bc2_c5d_reference_extension.py             --c5c-materializer tests/rom/materialize_lare_bc2_c5c_reference_refinement.py             --c5a-materializer tests/rom/materialize_lare_bc2_c5a_b14_dynamic_head.py             --c4z-materializer tests/rom/materialize_lare_bc2_c4z_dynamic_head.py             --source tests/rom/test_lare_rs1_gw_library.f90             --output canonical/tests/rom/test_lare_bc2_c5i_t16.f90             --manifest /tmp/c5i_materialization.json

      - name: Execute frozen T16 route
        run: |
          set -euo pipefail
          id="${{ matrix.id }}"
          n="${{ matrix.nodes }}"
          dz="${{ matrix.dz }}"
          opt="${{ matrix.opt }}"
          mkdir -p route_evidence
          stub="canonical/c5i_t16_${id}_o${opt}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes "$n" --dz-cm "$dz"
          build="/tmp/c5i/build_t16_${id}_o${opt}"
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "c5i_t16_${id}_o${opt}_stubs.f90"             --target tests/rom/test_lare_bc2_c5i_t16.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt "$opt"
          log="route_evidence/${id}_o${opt}.txt"
          "$build/rom0_test" > "$log" 2>&1
          grep -Fq 'LAREGW1_EXECUTION_COMPLETE=PASS' "$log"
          grep -Fq 'LAREGW1_C5I_B14_T16_GENERATED=TRUE' "$log"
          test "$(grep -c 'LAREGW1_STATE|' "$log")" -eq 65536
          test "$(grep -c 'LAREGW1_HISTORY_PASS|' "$log")" -eq 4
          test "$(grep -c 'LAREGW1_NODE|' "$log")" -eq 0
          python3 - "$log" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREGW1_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None
          assert abs(float(m.group(1))) <= 1e-12
          PY
          cp /tmp/c5i_materialization.json "route_evidence/materialization_${id}_o${opt}.json"
          sha256sum route_evidence/* > route_evidence/sha256.txt
          git -C canonical diff --quiet -- src reference
          echo "LARE_BC2_C5I_ROUTE=PASS|${id}|O${opt}"

      - name: Upload route evidence
        uses: actions/upload-artifact@v4
        with:
          name: c5i-route-${{ matrix.id }}-o${{ matrix.opt }}
          path: route_evidence/
          if-no-files-found: error

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: route
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover frozen T4 and T8 anchors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5i/t4 /tmp/c5i/t8 /tmp/c5i/t16 LARE_BC2_C5I_EVIDENCE

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10602317061/zip" > /tmp/c5i/c5f.zip
          echo "1ba8d90b08c99955d76c8b2ee60bae16bd40f68667ecda889cafc002627f43bb  /tmp/c5i/c5f.zip" | sha256sum -c -
          unzip -q /tmp/c5i/c5f.zip -d /tmp/c5i/t4/c5f
          echo "e0e600d44fdc56d849e2b04759971ea5702d3207b4f1b3b827e3a6ca69a9afe3  /tmp/c5i/t4/c5f/R1024_T4_o0.txt" | sha256sum -c -

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10602317291/zip" > /tmp/c5i/c5g.zip
          echo "3f55f9d5c7b659fa1abf18c11ecb1b5238d38a8a179730bd2013858544071ee7  /tmp/c5i/c5g.zip" | sha256sum -c -
          unzip -q /tmp/c5i/c5g.zip -d /tmp/c5i/t4/c5g
          echo "3acc08e4a04b8be0d4a095fbc38998fea48d9605e46f231ebf0b9a62354f8105  /tmp/c5i/t4/c5g/R512_T4_o0.txt" | sha256sum -c -

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10602232995/zip" > /tmp/c5i/c5h.zip
          echo "55331b6a8b0e5fb3a72c6a7a2ac05b607dcaedd7d53b48fb5a7d773fa9aed2b4  /tmp/c5i/c5h.zip" | sha256sum -c -
          unzip -q /tmp/c5i/c5h.zip -d /tmp/c5i/t8
          echo "aea94e7936317da738d9fb7d17a221cf0d8a3c85852fe82d76f738bad7a16c88  /tmp/c5i/t8/R512_T8_o0.txt" | sha256sum -c -
          echo "8f119c72af9111ad5d5b867a4893d69cf2bf33962baf07a308aa1086f97f43d6  /tmp/c5i/t8/R1024_T8_o0.txt" | sha256sum -c -

      - name: Download split T16 routes
        uses: actions/download-artifact@v4
        with:
          pattern: c5i-route-*
          path: /tmp/c5i/t16
          merge-multiple: true

      - name: Reconcile split-route identity
        run: |
          set -euo pipefail
          for f in R512_o0.txt R512_o2.txt R1024_o0.txt R1024_o2.txt; do
            test -s "/tmp/c5i/t16/$f"
            test "$(grep -c 'LAREGW1_STATE|' "/tmp/c5i/t16/$f")" -eq 65536
            test "$(grep -c 'LAREGW1_HISTORY_PASS|' "/tmp/c5i/t16/$f")" -eq 4
          done
          cmp /tmp/c5i/t16/R512_o0.txt /tmp/c5i/t16/R512_o2.txt
          cmp /tmp/c5i/t16/R1024_o0.txt /tmp/c5i/t16/R1024_o2.txt
          cp /tmp/c5i/t16/R512_o0.txt LARE_BC2_C5I_EVIDENCE/R512_T16_o0.txt
          cp /tmp/c5i/t16/R1024_o0.txt LARE_BC2_C5I_EVIDENCE/R1024_T16_o0.txt
          echo "LARE_BC2_C5I_SPLIT_ROUTE_IDENTITY=PASS"

      - name: Execute C5I T16 analysis
        run: |
          set -euo pipefail
          python3 tests/rom/analyze_lare_bc2_c5i_t16.py             --r512-t4 /tmp/c5i/t4/c5g/R512_T4_o0.txt             --r512-t8 /tmp/c5i/t8/R512_T8_o0.txt             --r512-t16 /tmp/c5i/t16/R512_o0.txt             --r1024-t4 /tmp/c5i/t4/c5f/R1024_T4_o0.txt             --r1024-t8 /tmp/c5i/t8/R1024_T8_o0.txt             --r1024-t16 /tmp/c5i/t16/R1024_o0.txt             --c5h-result integration/f-rom/LARE_BC2_C5H_RESULT.json             --c5h-closeout integration/f-rom/LARE_BC2_C5H_CLOSEOUT.json             --prereg integration/f-rom/LARE_BC2_C5I_PREREGISTRATION.json             --output LARE_BC2_C5I_EVIDENCE/LARE_BC2_C5I_RESULT.json             | tee LARE_BC2_C5I_EVIDENCE/runner.txt

      - name: Validate C5I firewall
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C5I_EVIDENCE/LARE_BC2_C5I_RESULT.json'))
          assert r['status'] in (
            'T16_TEMPORAL_PROGRESS_SPATIAL_GAP_NUMERICALLY_STABLE',
            'T16_TEMPORAL_PROGRESS_SPATIAL_GAP_REVERSES',
            'T16_TEMPORAL_PROGRESS_SPATIAL_GAP_CONTINUES_INCREASING',
            'T16_SPACE_TIME_PATTERN_MIXED_OR_TEMPORAL_PROGRESS_BLOCKED'
          )
          assert all(r['baseline_identity_to_C5H'].values())
          f=r['scientific_firewall']
          assert f['new_lare_run'] is False
          assert f['new_closure_fit'] is False
          assert f['physical_history_changed'] is False
          assert f['numerical_policy_changed'] is False
          assert f['C5A_formal_decision_changed'] is False
          assert f['application_acceptance_adjudicated'] is False
          assert f['performance_comparison_authorized'] is False
          assert f['speed_claim_authorized'] is False
          assert f['production_rom_authorized'] is False
          print('LARE_BC2_C5I_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C5I_EVIDENCE/* > LARE_BC2_C5I_EVIDENCE/sha256.txt

      - name: Upload C5I evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c5i
          path: LARE_BC2_C5I_EVIDENCE/
          if-no-files-found: error
