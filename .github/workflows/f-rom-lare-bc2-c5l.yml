name: F-ROM-LARE BC2-C5L R2048 T16 Reference extension

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C5L_PREREGISTRATION.json'
      - 'tests/rom/materialize_lare_bc2_c5l_r2048_t16.py'
      - 'tests/rom/materialize_lare_bc2_c5l_history_slice.py'
      - 'tests/rom/analyze_lare_bc2_c5l_r2048_t16.py'
      - '.github/workflows/f-rom-lare-bc2-c5l.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c5l-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  slice:
    name: slice-R2048-o${{ matrix.opt }}-h${{ matrix.history }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        opt: [0, 2]
        history: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen Reference backend
        uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Verify C5L authority and binding
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5l_r2048_t16.py)" = "3a0bca5ca87bfc0d29b8c4cee85309afd32b424d"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c5l_history_slice.py)" = "cb45cb52c9772ed768ee8babdfa0c80315e19d14"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c5l_r2048_t16.py)" = "528d43093f40dfd1971939b492127b1e1f3b84df"
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C5L_PREREGISTRATION.json'))
          c=json.load(open('integration/f-rom/LARE_BC2_C5K_CLOSEOUT.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C5L_R2048_RESPONSE'
          assert p['implementation_binding']['state']=='BOUND_BEFORE_EXECUTION'
          assert p['implementation_binding']['response_based_design'] is False
          assert c['status']=='CLOSED_LOCAL_HALF_CELL_THEORY_DOES_NOT_SUPPORT_NEW_DYNAMIC_BOUNDARY_OPERATOR_CURRENT_REFERENCE_SPATIAL_EXTENSION_NEXT'
          assert c['adjudication']['CURRENT_REFERENCE_R2048_T16_EXTENSION_AUTHORIZED'] is True
          assert c['adjudication']['DYNAMIC_THEORY_DERIVED_BOUNDARY_COUNTERFACTUAL_AUTHORIZED'] is False
          assert p['authority']['frozen_scientific_basis_rebased'] is False
          print('LARE_BC2_C5L_AUTHORITY_LOCK=PASS')
          PY

      - name: Materialize exact R2048 T16 history slice
        run: |
          set -euo pipefail
          h="${{ matrix.history }}"
          python3 tests/rom/materialize_lare_bc2_c5l_history_slice.py             --c5l-materializer tests/rom/materialize_lare_bc2_c5l_r2048_t16.py             --c5i-materializer tests/rom/materialize_lare_bc2_c5i_t16.py             --c5e-materializer tests/rom/materialize_lare_bc2_c5e_reference_extension.py             --c5d-materializer tests/rom/materialize_lare_bc2_c5d_reference_extension.py             --c5c-materializer tests/rom/materialize_lare_bc2_c5c_reference_refinement.py             --c5a-materializer tests/rom/materialize_lare_bc2_c5a_b14_dynamic_head.py             --c4z-materializer tests/rom/materialize_lare_bc2_c4z_dynamic_head.py             --source tests/rom/test_lare_rs1_gw_library.f90             --history-index "$h"             --output canonical/tests/rom/test_lare_bc2_c5l_slice.f90             --manifest /tmp/c5l_manifest.json

      - name: Execute unchanged Reference R2048 T16 slice
        run: |
          set -euo pipefail
          opt="${{ matrix.opt }}"
          h="${{ matrix.history }}"
          expected=$(printf 'Z%02d' "$h")
          mkdir -p slice_evidence
          stub="canonical/c5l_R2048_o${opt}_h${h}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes 2048 --dz-cm 0.078125
          build="/tmp/c5l/build_R2048_o${opt}_h${h}"
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "c5l_R2048_o${opt}_h${h}_stubs.f90"             --target tests/rom/test_lare_bc2_c5l_slice.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt "$opt"
          log="slice_evidence/R2048_o${opt}_h${h}.txt"
          "$build/rom0_test" > "$log" 2>&1
          grep -Fq 'LAREGW1_EXECUTION_COMPLETE=PASS' "$log"
          grep -Fq 'LAREGW1_C5L_B14_R2048_T16_GENERATED=TRUE' "$log"
          test "$(grep -c '^LAREGW1_STATE|' "$log")" -eq 16384
          test "$(grep -c '^LAREGW1_HISTORY_PASS|' "$log")" -eq 1
          test "$(grep -c '^LAREGW1_NODE|' "$log")" -eq 0
          test "$(grep -c "^LAREGW1_STATE|.*|HISTORY=${expected}|" "$log")" -eq 16384
          python3 - "$log" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREGW1_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None
          assert abs(float(m.group(1))) <= 1e-12
          PY
          cp /tmp/c5l_manifest.json slice_evidence/
          sha256sum slice_evidence/* > slice_evidence/sha256.txt
          git -C canonical diff --quiet -- src reference
          echo "LARE_BC2_C5L_SLICE=PASS|R2048|O${opt}|H${h}"

      - name: Upload R2048 T16 slice
        uses: actions/upload-artifact@v4
        with:
          name: c5l-slice-R2048-o${{ matrix.opt }}-h${{ matrix.history }}
          path: slice_evidence/
          if-no-files-found: error

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: slice
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable C5I R512/R1024 T16 anchors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5l/base /tmp/c5l/r2048 LARE_BC2_C5L_EVIDENCE
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10602539613/zip" > /tmp/c5l/c5i.zip
          echo "8d7d4be3b428bbc30a7c48c2e81a448318c252d80b053caa748b7df7580a1664  /tmp/c5l/c5i.zip" | sha256sum -c -
          unzip -q /tmp/c5l/c5i.zip -d /tmp/c5l/base
          echo "bd60f230d1123d97ab5a0599d9dd6eeaf89a654f4d899e82e22d2b124fe2b8c7  /tmp/c5l/base/R512_T16_o0.txt" | sha256sum -c -
          echo "1f643b43ea4ea1f7972601a586b9cb2bc51773f4a2473859e3965b78d54fe6c6  /tmp/c5l/base/R1024_T16_o0.txt" | sha256sum -c -
          echo "865339e6bd85eb86d5b905de1af9a7e87321878d3ae47e6f2e7ee9b70a08b302  /tmp/c5l/base/LARE_BC2_C5I_RESULT.json" | sha256sum -c -

      - name: Download R2048 T16 slices
        uses: actions/download-artifact@v4
        with:
          pattern: c5l-slice-R2048-*
          path: /tmp/c5l/slices
          merge-multiple: false

      - name: Reconstruct R2048 and require O0 O2 identity
        run: |
          set -euo pipefail
          for opt in 0 2; do
            full="/tmp/c5l/r2048/R2048_o${opt}.txt"
            : > "$full"
            for h in 1 2 3 4; do
              part="/tmp/c5l/slices/c5l-slice-R2048-o${opt}-h${h}/R2048_o${opt}_h${h}.txt"
              test -s "$part"
              cat "$part" >> "$full"
            done
            test "$(grep -c '^LAREGW1_STATE|' "$full")" -eq 65536
            test "$(grep -c '^LAREGW1_HISTORY_PASS|' "$full")" -eq 4
          done
          cmp /tmp/c5l/r2048/R2048_o0.txt /tmp/c5l/r2048/R2048_o2.txt
          cp /tmp/c5l/r2048/R2048_o0.txt LARE_BC2_C5L_EVIDENCE/R2048_T16_o0.txt
          cp /tmp/c5l/r2048/R2048_o2.txt LARE_BC2_C5L_EVIDENCE/R2048_T16_o2.txt
          echo "LARE_BC2_C5L_R2048_O0_O2_IDENTITY=PASS"

      - name: Execute prebound C5L spatial analysis
        run: |
          set -euo pipefail
          test "$(git hash-object tests/rom/analyze_lare_bc2_c5l_r2048_t16.py)" = "528d43093f40dfd1971939b492127b1e1f3b84df"
          python3 tests/rom/analyze_lare_bc2_c5l_r2048_t16.py             --r512 /tmp/c5l/base/R512_T16_o0.txt             --r1024 /tmp/c5l/base/R1024_T16_o0.txt             --r2048 /tmp/c5l/r2048/R2048_o0.txt             --c5i-result integration/f-rom/LARE_BC2_C5I_RESULT.json             --c5k-closeout integration/f-rom/LARE_BC2_C5K_CLOSEOUT.json             --prereg integration/f-rom/LARE_BC2_C5L_PREREGISTRATION.json             --output LARE_BC2_C5L_EVIDENCE/LARE_BC2_C5L_RESULT.json             | tee LARE_BC2_C5L_EVIDENCE/runner.txt
          cp integration/f-rom/LARE_BC2_C5L_PREREGISTRATION.json LARE_BC2_C5L_EVIDENCE/

      - name: Validate C5L firewall
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C5L_EVIDENCE/LARE_BC2_C5L_RESULT.json'))
          assert r['status'] in (
            'SPATIAL_REFINEMENT_PROGRESSING_AT_R2048',
            'SPATIAL_REFINEMENT_NOT_PROGRESSING_AT_R2048',
            'SPATIAL_ADJACENT_GAP_NUMERICALLY_UNCHANGED_AT_R2048'
          )
          assert r['baseline_identity_to_C5I_T16'] is True
          f=r['scientific_firewall']
          assert f['production_reference_changed'] is False
          assert f['boundary_counterfactual_executed'] is False
          assert f['new_reference_physics_admitted'] is False
          assert f['T32_executed'] is False
          assert f['R4096_executed'] is False
          assert f['new_lare_run'] is False
          assert f['new_lare_closure'] is False
          assert f['C5A_formal_decision_changed'] is False
          assert f['application_acceptance_adjudicated'] is False
          assert f['performance_comparison_authorized'] is False
          assert f['speed_claim_authorized'] is False
          assert f['production_rom_authorized'] is False
          print('LARE_BC2_C5L_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C5L_EVIDENCE/* > LARE_BC2_C5L_EVIDENCE/sha256.txt

      - name: Upload authoritative C5L evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c5l
          path: LARE_BC2_C5L_EVIDENCE/
          if-no-files-found: error
