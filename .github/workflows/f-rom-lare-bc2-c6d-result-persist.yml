name: F-ROM-LARE BC2-C6D result persist

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c6d-result-persist.yml'

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover exact C6D authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c6d
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/35524491529 --jq '.status + ":" + .conclusion + ":" + .head_sha')" = "completed:success:7176cb5741028a328bc7500097f2ab971e36a8a7"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10608379760 --jq '.digest')" = "sha256:9e18ae4154de9d40b61a4088136d6af226f6cc6d9f5fefc6082205a3a317afe0"
          gh run download 35524491529 -n lare-bc2-c6d -D /tmp/c6d
          echo "d2558aff10e287d7dd496dd41908916e63f8e4e0a23a4a03d02c132ff095d128  /tmp/c6d/LARE_BC2_C6D_RESULT.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/c6d/LARE_BC2_C6D_RESULT.json'))
          assert r['status']=='C6D_BEMR_SUPPORTED_FOR_BOUNDARY_EXTENSION_QUALIFICATION'
          assert r['instrumentation_identity_pass'] is True
          assert r['moving_observation_count']==2304
          assert r['strict_state_moment_realizable_count']==2304
          assert r['numerically_qualified_observation_count']==2304
          assert r['numerical_qualification_pass'] is True
          assert all(r['adjudication'].values())
          assert r['scientific_firewall']['candidate_feedback'] is False
          assert r['scientific_firewall']['production_rom_authorized'] is False
          print('C6D_AUTHORITY=PASS')
          PY
          cp /tmp/c6d/LARE_BC2_C6D_RESULT.json integration/f-rom/LARE_BC2_C6D_RESULT.json

      - name: Commit exact C6D result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C6D_RESULT.json
          git diff --cached --check
          git commit -m "F-ROM-LARE: persist exact C6D BEMR flux result"
          git push origin HEAD:work/f-rom-lare-rs1
