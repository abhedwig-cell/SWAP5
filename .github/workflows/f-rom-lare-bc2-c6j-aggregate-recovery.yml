name: F-ROM-LARE BC2-C6J aggregation-only recovery

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C6J_AGGREGATION_BINDING.json'

concurrency:
  group: f-rom-lare-bc2-c6j-aggregate-recovery-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install aggregation dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Verify aggregation-only recovery binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object tests/rom/merge_lare_bc2_c6j_femo_shards.py)" = "33e9c4ff1218d6b64024205af8705384601ed502"
          python3 - <<'PY'
          import json
          b=json.load(open('integration/f-rom/LARE_BC2_C6J_AGGREGATION_BINDING.json'))
          assert b['status']=='BOUND_AGGREGATION_ONLY_RECOVERY_NO_SCIENTIFIC_CHANGE'
          assert b['source_run']['workflow_run']==35530325107
          assert b['source_run']['execution_head']=='14e333ef35e5dbbb2c71c1da0386f07863b3572e'
          assert b['source_run']['qualifier_blob']=='d3da358fff311dd7610b8e00fa03512e9c50dba1'
          assert b['repaired_aggregator']['blob']=='33e9c4ff1218d6b64024205af8705384601ed502'
          assert b['scientific_design_changed'] is False
          assert b['workflow']['state']=='BOUND_BEFORE_AGGREGATION'
          print('C6J_AGGREGATION_RECOVERY_LOCK=PASS')
          PY
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/35530325107 --jq '.head_sha')" = "14e333ef35e5dbbb2c71c1da0386f07863b3572e"
          gh api repos/$GITHUB_REPOSITORY/actions/runs/35530325107/artifacts > /tmp/c6j-artifacts.json
          python3 - <<'PY'
          import json
          rec=json.load(open('integration/f-rom/LARE_BC2_C6J_AGGREGATION_RECONCILIATION.json'))
          live=json.load(open('/tmp/c6j-artifacts.json'))
          expected={(int(x['id']),x['name'],x['digest']) for x in rec['immutable_shard_artifacts']}
          actual={(int(x['id']),x['name'],x['digest']) for x in live['artifacts'] if x['name'].startswith('lare-bc2-c6j-shard-')}
          assert actual==expected, (actual,expected)
          print('C6J_IMMUTABLE_SHARDS=PASS')
          PY

      - name: Recover immutable scientific shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c6j-shards
          gh run download 35530325107 -p 'lare-bc2-c6j-shard-*' -D /tmp/c6j-shards
          test "$(find /tmp/c6j-shards -name 'LARE_BC2_C6J_SHARD_*.json' | wc -l)" -eq 9

      - name: Aggregate frozen C6J evidence
        run: |
          set -euo pipefail
          mkdir -p LARE_BC2_C6J_EVIDENCE
          python3 tests/rom/merge_lare_bc2_c6j_femo_shards.py \
            --shard-dir /tmp/c6j-shards \
            --output LARE_BC2_C6J_EVIDENCE/LARE_BC2_C6J_RESULT.json \
            | tee LARE_BC2_C6J_EVIDENCE/runner.txt
          cp integration/f-rom/LARE_BC2_C6J_PREREGISTRATION.json LARE_BC2_C6J_EVIDENCE/
          cp integration/f-rom/LARE_BC2_C6I_RECONCILIATION.json LARE_BC2_C6J_EVIDENCE/
          cp integration/f-rom/LARE_BC2_C6J_AGGREGATION_RECONCILIATION.json LARE_BC2_C6J_EVIDENCE/
          cp integration/f-rom/LARE_BC2_C6J_AGGREGATION_BINDING.json LARE_BC2_C6J_EVIDENCE/
          python3 - <<'PY'
          import json
          r=json.load(open('LARE_BC2_C6J_EVIDENCE/LARE_BC2_C6J_RESULT.json'))
          assert r['state_case_count']==126
          assert r['expected_head_operator_case_count']==168
          assert r['expected_flux_operator_case_count']==126
          assert r['status'] in (
            'C6J_FEMO_MATHEMATICALLY_QUALIFIED',
            'C6J_FEMO_LOCAL_MANIFOLD_NOT_QUALIFIED',
            'C6J_FEMO_ONSAGER_OPERATOR_NOT_QUALIFIED'
          )
          f=r['scientific_firewall']
          assert f['hydrological_response_used'] is False
          assert f['model_run_executed'] is False
          assert f['BEMR_reopened'] is False
          assert f['free_running_FEMO_implemented'] is False
          assert f['production_rom_authorized'] is False
          print('C6J_AGGREGATED_FIREWALL=PASS')
          PY
          sha256sum LARE_BC2_C6J_EVIDENCE/* > LARE_BC2_C6J_EVIDENCE/sha256.txt

      - name: Upload authoritative C6J aggregate
        uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c6j-aggregate-recovery
          path: LARE_BC2_C6J_EVIDENCE/
          if-no-files-found: error
