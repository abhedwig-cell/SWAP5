name: F-ROM-LARE BC2-C6J result persist

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c6j-result-persist.yml'

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover exact C6J authority aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c6j
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/35530564614 --jq '.status + ":" + .conclusion + ":" + .head_sha')" = "completed:success:b76fb1c4e8f2283e8f86ea749adb2dbecc1e2d32"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10611380500 --jq '.digest')" = "sha256:f73990eed27a0e6e7341d263cbf63deb2de4ba3e9531a5296cc107fb9bff12d1"
          gh run download 35530564614 -n lare-bc2-c6j-aggregate-recovery -D /tmp/c6j
          echo "5c0682fc3fde0318331727d34e7613faa2c70598ed79c3684b3f4a8445dee88d  /tmp/c6j/LARE_BC2_C6J_RESULT.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/c6j/LARE_BC2_C6J_RESULT.json'))
          assert r['status']=='C6J_FEMO_LOCAL_MANIFOLD_NOT_QUALIFIED'
          assert r['state_case_count']==126
          assert r['gates']['G1_FROZEN_STATE_MOMENT_REALIZABILITY'] is True
          assert r['gates']['G10_NO_RESPONSE_DATA'] is True
          assert r['gates']['G2_LOCAL_PROFILE_CONVERGENCE'] is False
          assert r['gates']['G3_LOCAL_PROFILE_UNIQUENESS'] is False
          assert r['gates']['G4_INTERIOR_BOUNDED_PROFILE'] is False
          assert r['gates']['G5_STATE_RECOVERY'] is False
          assert r['gates']['G6_LOCAL_MOMENT_JACOBIAN'] is False
          assert r['scientific_firewall']['hydrological_response_used'] is False
          assert r['scientific_firewall']['production_rom_authorized'] is False
          print('C6J_NEGATIVE_AUTHORITY=PASS')
          PY
          cp /tmp/c6j/LARE_BC2_C6J_RESULT.json integration/f-rom/LARE_BC2_C6J_RESULT.json

      - name: Commit exact C6J result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C6J_RESULT.json
          git diff --cached --check
          git commit -m "F-ROM-LARE: persist exact negative C6J FEMO result"
          git push origin HEAD:work/f-rom-lare-rs1
