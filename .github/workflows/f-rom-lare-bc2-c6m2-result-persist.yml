name: F-ROM-LARE BC2-C6M2 result persist

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c6m2-result-persist.yml'

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-rom-lare-rs1

      - name: Recover exact C6M2 authority result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c6m2
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/35532270427 --jq '.status + ":" + .conclusion + ":" + .head_sha')" = "completed:success:92eba276bf350314107b688747eaff2b67e5bb0b"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10612270980 --jq '.digest')" = "sha256:5a6384a5c93aac24e68918f3dfe56ccfe30c6630aa55ba169ea25821643ba5cd"
          gh run download 35532270427 -n lare-bc2-c6m2 -D /tmp/c6m2
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/c6m2/LARE_BC2_C6M2_RESULT.json')
          r=json.load(open(p))
          assert r['status']=='C6M2_SURFACE_FIXED_FLUX_REFERENCE_NUMERICAL_QUALITY_BLOCKED'
          assert r['decision']=='STOP_BEFORE_LAYER_ROM_RESPONSE'
          assert r['integrity_pass'] is True
          assert r['materials']['B01']['reference_quality_pass'] is False
          assert r['materials']['B14']['reference_quality_pass'] is False
          assert r['scientific_firewall']['candidate_response_generated'] is False
          print(hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          cp /tmp/c6m2/LARE_BC2_C6M2_RESULT.json integration/f-rom/LARE_BC2_C6M2_RESULT.json

      - name: Commit exact result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/LARE_BC2_C6M2_RESULT.json
          git diff --cached --check
          git commit -m "F-ROM-LARE: persist exact C6M2 Reference result"
          git push origin HEAD:work/f-rom-lare-rs1
