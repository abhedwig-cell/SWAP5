name: F-ROM-LARE BC2-C6N1 three-level Reference uncertainty

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C6N1_PREREGISTRATION.json'

concurrency:
  group: f-rom-lare-bc2-c6n1-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  t32:
    name: t32-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-${{ matrix.history }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        material: [B01, B14]
        route: [R512_T32, R1024_T32, R2048_T32]
        opt: [0, 2]
        history: [U01, U02, U03, U04]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Verify frozen C6N1 authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6n1_surface_fixed_flux_reference.py)" = "5dc33b6d4a1db8bc8e8e3d43f7170c1fcff2e96a"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c6n1_reference_uncertainty.py)" = "15c4c0bc0c3f7be1df1394a812b509512b2a7049"
          python3 -m py_compile tests/rom/materialize_lare_bc2_c6n1_surface_fixed_flux_reference.py
          python3 -m py_compile tests/rom/analyze_lare_bc2_c6n1_reference_uncertainty.py
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C6N1_PREREGISTRATION.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C6N1_T32_REFERENCE_RESPONSE'
          assert p['implementation_binding']['state']=='BOUND_BEFORE_EXECUTION'
          assert p['implementation_binding']['execution_binding_complete'] is True
          assert p['scientific_firewall']['candidate_response_generated'] is False
          print('C6N1_AUTHORITY_LOCK=PASS')
          PY

      - name: Resolve route and material
        id: cfg
        run: |
          case "${{ matrix.route }}" in
            R512_T32)  echo "nodes=512" >> "$GITHUB_OUTPUT"; echo "dz=0.3125" >> "$GITHUB_OUTPUT" ;;
            R1024_T32) echo "nodes=1024" >> "$GITHUB_OUTPUT"; echo "dz=0.15625" >> "$GITHUB_OUTPUT" ;;
            R2048_T32) echo "nodes=2048" >> "$GITHUB_OUTPUT"; echo "dz=0.078125" >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac
          if [[ "${{ matrix.material }}" == "B01" ]]; then
            echo "source=tests/rom/test_lare_dyn0a_reference.f90" >> "$GITHUB_OUTPUT"
          else
            echo "source=tests/rom/test_lare_dyn0a_b14_reference.f90" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize exact T32 history
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c6n1_surface_fixed_flux_reference.py \
            --source "${{ steps.cfg.outputs.source }}" \
            --material "${{ matrix.material }}" \
            --temporal-factor 32 \
            --output canonical/tests/rom/test_lare_bc2_c6n1_surface_fixed_flux_reference.f90 \
            --manifest /tmp/c6n1_manifest.json

      - name: Execute frozen T32 Reference slice
        env:
          LARE_DYN0A_CASE_FILTER: ${{ matrix.history }}
        run: |
          set -euo pipefail
          material="${{ matrix.material }}"; route="${{ matrix.route }}"; opt="${{ matrix.opt }}"; history="${{ matrix.history }}"
          n="${{ steps.cfg.outputs.nodes }}"; dz="${{ steps.cfg.outputs.dz }}"
          mkdir -p slice
          stub="canonical/c6n1_${material}_${route}_o${opt}_${history}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py \
            --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90 \
            --output "$stub" --nodes "$n" --dz-cm "$dz"
          build="/tmp/c6n1_${material}_${route}_o${opt}_${history}"
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py \
            --root canonical \
            --stub "c6n1_${material}_${route}_o${opt}_${history}_stubs.f90" \
            --target tests/rom/test_lare_bc2_c6n1_surface_fixed_flux_reference.f90 \
            --external-source src/legacy/b1_10_port/headcalc.f90 \
            --build "$build" --opt "$opt"
          log="slice/${material}_${route}_o${opt}_${history}.txt"
          "$build/rom0_test" > "$log" 2>&1
          grep -Fq 'LAREDYN0R_C6N1_SURFACE_FIXED_FLUX_REFERENCE_GENERATED=TRUE' "$log"
          grep -Fq 'LAREDYN0R_EXECUTION_COMPLETE=PASS' "$log"
          grep -Fq '|BOTTOM=FIXED_FLUX' "$log"
          test "$(grep -c '^LAREDYN0R_STATE|' "$log")" -eq 32768
          test "$(grep -c '^LAREDYN0R_PROFILE|' "$log")" -eq 16384
          test "$(grep -c '^LAREDYN0R_HISTORY_PASS|' "$log")" -eq 1
          test "$(grep -c '^LAREDYN0R_NODE|' "$log")" -eq 0
          cp /tmp/c6n1_manifest.json slice/
          sha256sum slice/* > slice/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: c6n1-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-${{ matrix.history }}
          path: slice/
          if-no-files-found: error

  analyze:
    needs: t32
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: python3 -m pip install --disable-pip-version-check numpy

      - name: Download C6N1 T32 slices
        uses: actions/download-artifact@v4
        with:
          pattern: c6n1-*
          path: /tmp/c6n1
          merge-multiple: false

      - name: Download frozen C6M2 T8/T16 authority
        uses: actions/download-artifact@v4
        with:
          pattern: c6m2-*
          path: /tmp/c6m2
          merge-multiple: false
          repository: abhedwig-cell/SWAP5
          run-id: 35532270427
          github-token: ${{ github.token }}

      - name: Reconstruct three-level ladders
        run: |
          set -euo pipefail
          mkdir -p /tmp/routes C6N1_EVIDENCE
          for material in B01 B14; do
            for route in R512_T32 R1024_T32 R2048_T32; do
              for opt in 0 2; do
                full="/tmp/routes/${material}_${route}_o${opt}.txt"; : > "$full"
                for history in U01 U02 U03 U04; do
                  part="/tmp/c6n1/c6n1-${material}-${route}-o${opt}-${history}/${material}_${route}_o${opt}_${history}.txt"
                  test -s "$part"; cat "$part" >> "$full"
                done
              done
              cmp "/tmp/routes/${material}_${route}_o0.txt" "/tmp/routes/${material}_${route}_o2.txt"
            done

            for route in R2048_T16 R2048_T8; do
              for opt in 0 2; do
                full="/tmp/routes/${material}_${route}_o${opt}.txt"; : > "$full"
                for history in U01 U02 U03 U04; do
                  part="/tmp/c6m2/c6m2-${material}-${route}-o${opt}-${history}/${material}_${route}_o${opt}_${history}.txt"
                  test -s "$part"; cat "$part" >> "$full"
                done
              done
              cmp "/tmp/routes/${material}_${route}_o0.txt" "/tmp/routes/${material}_${route}_o2.txt"
            done
          done
          echo C6N1_O0_O2_IDENTITY=PASS

      - name: Execute frozen C6N1 uncertainty analysis
        run: |
          set -euo pipefail
          python3 tests/rom/analyze_lare_bc2_c6n1_reference_uncertainty.py \
            --prereg integration/f-rom/LARE_BC2_C6N1_PREREGISTRATION.json \
            --b01-r512-t32 /tmp/routes/B01_R512_T32_o0.txt \
            --b01-r1024-t32 /tmp/routes/B01_R1024_T32_o0.txt \
            --b01-r2048-t32 /tmp/routes/B01_R2048_T32_o0.txt \
            --b01-r2048-t16 /tmp/routes/B01_R2048_T16_o0.txt \
            --b01-r2048-t8 /tmp/routes/B01_R2048_T8_o0.txt \
            --b14-r512-t32 /tmp/routes/B14_R512_T32_o0.txt \
            --b14-r1024-t32 /tmp/routes/B14_R1024_T32_o0.txt \
            --b14-r2048-t32 /tmp/routes/B14_R2048_T32_o0.txt \
            --b14-r2048-t16 /tmp/routes/B14_R2048_T16_o0.txt \
            --b14-r2048-t8 /tmp/routes/B14_R2048_T8_o0.txt \
            --output C6N1_EVIDENCE/LARE_BC2_C6N1_RESULT.json \
            | tee C6N1_EVIDENCE/runner.txt
          cp integration/f-rom/LARE_BC2_C6N1_PREREGISTRATION.json C6N1_EVIDENCE/
          sha256sum C6N1_EVIDENCE/* > C6N1_EVIDENCE/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c6n1
          path: C6N1_EVIDENCE/
          if-no-files-found: error
