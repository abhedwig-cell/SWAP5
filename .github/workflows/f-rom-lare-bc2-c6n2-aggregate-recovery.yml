name: F-ROM-LARE BC2-C6N2 aggregation-only recovery

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_BC2_C6N2_AGGREGATION_BINDING.json'

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Verify aggregation-only C6N2 authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/LARE_BC2_C6N2_AGGREGATION_BINDING.json'))
          def blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          assert b['status']=='BOUND_AGGREGATION_ONLY_AFTER_VALID_CANDIDATE_EXECUTION'
          assert blob('integration/f-rom/LARE_BC2_C6N2_PREREGISTRATION.json') == b['scientific_authority']['preregistration_blob']
          assert blob('tests/rom/analyze_lare_bc2_c6n2_surface_candidates.py') == b['scientific_authority']['analyzer_blob']
          assert blob('integration/f-rom/LARE_BC2_C6N1_RESULT.json') == b['scientific_authority']['C6N1_result_blob']
          assert blob('integration/f-rom/LARE_BC2_C6N1_CLOSEOUT.json') == b['scientific_authority']['C6N1_closeout_blob']
          assert blob('.github/workflows/f-rom-lare-bc2-c6n2-aggregate-recovery.yml') == b['scientific_authority']['recovery_workflow_blob']
          assert b['scientific_authority']['source_candidate_run']==35537872450
          assert b['scientific_authority']['source_candidate_head']=='540c0e4e5a70a197ffbdcf017f2bebd60269e182'
          print('C6N2_AGGREGATION_AUTHORITY_LOCK=PASS')
          PY
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/35537872450 --jq .head_sha)" = "540c0e4e5a70a197ffbdcf017f2bebd60269e182"
          test "$(gh api 'repos/'$GITHUB_REPOSITORY'/actions/runs/35537872450/jobs?per_page=100' --jq '[.jobs[] | select(.name|startswith("candidate")) | select(.conclusion=="success")] | length')" = "20"
          test "$(gh api 'repos/'$GITHUB_REPOSITORY'/actions/runs/35537872450/artifacts?per_page=100' --jq '[.artifacts[] | select(.name|startswith("c6n2-"))] | length')" = "20"

      - name: Recover immutable C6N2 candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-candidates /tmp/c6n2
          gh run download 35537872450 -p 'c6n2-*' -D /tmp/source-candidates
          find /tmp/source-candidates -type f -name '*.json' -exec cp {} /tmp/c6n2/ \;
          test "$(find /tmp/c6n2 -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 20
          for material in B01 B14; do
            for member in R3 R4 R5 R6 R8 R12 R16 P4_TOP_LOWER U4 U8; do
              test -s "/tmp/c6n2/${material}_${member}.json"
            done
          done

      - name: Recover exact C6N1 R2048 T32 Reference slices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runid="$(python3 - <<'PY'
          import json
          print(json.load(open('integration/f-rom/LARE_BC2_C6N2_EXECUTION_BINDING.json'))['scientific_authority']['C6N1_authority_run'])
          PY
          )"
          test "$runid" = "35534785660"
          mkdir -p /tmp/c6n1 /tmp/reference
          gh run download "$runid" -p 'c6n1s*' -D /tmp/c6n1
          for material in B01 B14; do
            full="/tmp/reference/${material}_R2048_T32_o0.txt"
            : > "$full"
            for history in U01 U02 U03 U04; do
              hist="/tmp/reference/${material}_${history}_R2048_T32_o0.txt"
              : > "$hist"
              for seg in 1 2 3 4; do
                part="$(find /tmp/c6n1 -type f -path "*c6n1s${seg}-${material}-${history}*" -name 'segment_o0.txt' -print -quit)"
                test -n "$part"
                cat "$part" >> "$hist"
              done
              test "$(grep -c '^LAREDYN0R_STATE|' "$hist")" -eq 32768
              test "$(grep -c '^LAREDYN0R_PROFILE|' "$hist")" -eq 16384
              cat "$hist" >> "$full"
            done
            test "$(grep -c '^LAREDYN0R_STATE|' "$full")" -eq 131072
            test "$(grep -c '^LAREDYN0R_PROFILE|' "$full")" -eq 65536
          done

      - name: Execute frozen C6N2 classification only
        run: |
          set -euo pipefail
          mkdir -p C6N2_EVIDENCE
          python3 tests/rom/analyze_lare_bc2_c6n2_surface_candidates.py \
            --prereg integration/f-rom/LARE_BC2_C6N2_PREREGISTRATION.json \
            --c6n1-result integration/f-rom/LARE_BC2_C6N1_RESULT.json \
            --b01-reference /tmp/reference/B01_R2048_T32_o0.txt \
            --b14-reference /tmp/reference/B14_R2048_T32_o0.txt \
            --candidate-dir /tmp/c6n2 \
            --output C6N2_EVIDENCE/LARE_BC2_C6N2_RESULT.json \
            | tee C6N2_EVIDENCE/runner.txt
          cp integration/f-rom/LARE_BC2_C6N2_PREREGISTRATION.json C6N2_EVIDENCE/
          cp integration/f-rom/LARE_BC2_C6N2_AGGREGATION_BINDING.json C6N2_EVIDENCE/
          cp integration/f-rom/LARE_BC2_C6N1_RESULT.json C6N2_EVIDENCE/
          cp integration/f-rom/LARE_BC2_C6N1_CLOSEOUT.json C6N2_EVIDENCE/
          python3 - <<'PY'
          import json
          r=json.load(open('C6N2_EVIDENCE/LARE_BC2_C6N2_RESULT.json'))
          assert r['status'] in ('C6N2_NUMERICALLY_UNRESOLVED_REDUCED_FRONTIER','C6N2_RESOLVED_REDUCED_DIFFERENCES_ONLY')
          assert r['integrity']['all_candidates_attempted'] is True
          assert r['scientific_firewall']['candidate_response_generated'] is True
          assert r['scientific_firewall']['application_acceptance_adjudicated'] is False
          assert r['scientific_firewall']['performance_comparison_authorized'] is False
          assert r['scientific_firewall']['production_rom_authorized'] is False
          print('C6N2_AGGREGATION_FIREWALL=PASS')
          PY
          sha256sum C6N2_EVIDENCE/* > C6N2_EVIDENCE/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c6n2-recovered
          path: C6N2_EVIDENCE/
          if-no-files-found: error
