name: F-ROM-LARE BC2-C6R R1 queue release

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-bc2-c6r-r1-queue-release.yml'
  workflow_dispatch:

concurrency:
  group: f-rom-lare-bc2-c6r-r1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "C6R_R1_QUEUE_RELEASE=PASS"
          echo "No scientific execution; this run only releases the superseded R1 concurrency group."
