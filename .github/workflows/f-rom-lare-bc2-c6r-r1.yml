    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        material: [B01, B14]
        opt: [0, 2]
        history: [V01, V02, V03, V04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Verify C6R segmented binding
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/LARE_BC2_C6R_REPAIR_BINDING.json'))
          assert b['state']=='BOUND_BEFORE_REPAIRED_REFERENCE_EXECUTION'
          assert b['scientific_semantics_changed'] is False
          assert b['candidate_response_generated'] is False
          checks={
