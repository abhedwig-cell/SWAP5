          }
          for path,expected in checks.items():
            got=subprocess.check_output(['git','hash-object',path],text=True).strip()
            assert got==expected,(path,got,expected)
          PY
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_root_active_reference.py)" = "4f1d330a51cf0829816c64e140b0a5fd806b09d1"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_segmented_reference.py)" = "7b0654958b19a071649405da87f300c1fe86a0c7"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py)" = "bf17f616240d4830ea9ef7bed21b3f57ad9b404a"
          test "$(git hash-object canonical/src/process/mod_root_water_uptake_process.f90)" = "e6134587cf3c0164bbe09f2f4c87aef6886aaeb3"
          test "$(git hash-object canonical/src/solver/mod_b110_root_sink_provider.f90)" = "ef2d2fd883d116c314b98e8f0f14330150b4778a"

