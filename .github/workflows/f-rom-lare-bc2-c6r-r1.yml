          test "$(git hash-object tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py)" = "bf17f616240d4830ea9ef7bed21b3f57ad9b404a"
          test "$(git hash-object canonical/src/process/mod_root_water_uptake_process.f90)" = "e6134587cf3c0164bbe09f2f4c87aef6886aaeb3"
          test "$(git hash-object canonical/src/solver/mod_b110_root_sink_provider.f90)" = "ef2d2fd883d116c314b98e8f0f14330150b4778a"

          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C6R_REFERENCE_RESPONSE'
          assert p['implementation_binding']['response_based_design'] is False
          assert p['scientific_firewall']['reduced_candidate_response_generated'] is False
          PY

      - name: Resolve material source
        id: cfg
        run: |
          if [[ "${{ matrix.material }}" == "B01" ]]; then
            echo "source=tests/rom/test_lare_dyn0a_reference.f90" >> "$GITHUB_OUTPUT"
          else
            echo "source=tests/rom/test_lare_dyn0a_b14_reference.f90" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize R2048 T32 segment 3
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c6r_segmented_reference.py             --base-materializer tests/rom/materialize_lare_bc2_c6r_root_active_reference.py             --source "${{ steps.cfg.outputs.source }}"             --material "${{ matrix.material }}"             --segment-start 16385 --segment-end 24576             --output canonical/tests/rom/test_lare_bc2_c6r_segment.f90             --manifest /tmp/c6r_manifest.json

      - name: Execute R2048 T32 segment 3
        env:
          LARE_DYN0A_CASE_FILTER: ${{ matrix.history }}
          C6R_CHECKPOINT_IN: /tmp/c6r_prev/checkpoint.bin
          C6R_CHECKPOINT_OUT: /tmp/c6r_checkpoint.bin
        run: |
          set -euo pipefail
          mkdir -p seg
          stub="canonical/c6r_seg3_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes 2048 --dz-cm 0.078125
          build="/tmp/c6r_seg3_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}"
          python3 tests/rom/materialize_lare_bc2_c6r_reference_floor_repair.py \
            --path canonical/src/runtime/mod_fmr_serialized_reference_backend.f90 \
            --manifest /tmp/c6r_reference_floor_repair.json
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "c6r_seg3_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"             --target tests/rom/test_lare_bc2_c6r_segment.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt "${{ matrix.opt }}"
          log="seg/${{ matrix.material }}_R2048_T32_o${{ matrix.opt }}_${{ matrix.history }}_seg3.txt"
          set +e
          "$build/rom0_test" > "$log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            cat "$log"
            exit "$rc"
          fi
          grep -Fq 'LAREDYN0R_C6R_SEGMENTED_ROOT_ACTIVE_REFERENCE_GENERATED=TRUE' "$log"
          grep -Fq 'LAREDYN0R_EXECUTION_COMPLETE=PASS' "$log"
          test "$(grep -c '^LAREDYN0R_STATE|' "$log")" -eq 8192
          test "$(grep -c '^LAREDYN0R_PROFILE|' "$log")" -eq 4096
          test "$(grep -c '^LAREDYN0R_ROOT|' "$log")" -eq 256
          test "$(grep -c '^LAREDYN0R_FALLBACK|' "$log")" -eq 0
          test -s /tmp/c6r_checkpoint.bin
          python3 - "$log" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREDYN0R_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None and abs(float(m.group(1))) <= 1e-12
          PY
          cp /tmp/c6r_checkpoint.bin seg/checkpoint.bin
          cp /tmp/c6r_manifest.json seg/
          sha256sum seg/* > seg/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: c6r-seg3-${{ matrix.material }}-o${{ matrix.opt }}-${{ matrix.history }}
          path: seg/
          if-no-files-found: error


