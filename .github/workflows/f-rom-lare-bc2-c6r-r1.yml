          test "$(grep -c '^LAREDYN0R_PROFILE|' "$log")" -eq 4096
          test "$(grep -c '^LAREDYN0R_ROOT|' "$log")" -eq 256
          test "$(grep -c '^LAREDYN0R_FALLBACK|' "$log")" -eq 0
          test -s /tmp/c6r_checkpoint.bin
          python3 - "$log" <<'PY'
