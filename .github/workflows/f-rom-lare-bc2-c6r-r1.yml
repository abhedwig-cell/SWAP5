          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "c6r_seg1_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"             --target tests/rom/test_lare_bc2_c6r_segment.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt "${{ matrix.opt }}"
          log="seg/${{ matrix.material }}_R2048_T32_o${{ matrix.opt }}_${{ matrix.history }}_seg1.txt"
          set +e
