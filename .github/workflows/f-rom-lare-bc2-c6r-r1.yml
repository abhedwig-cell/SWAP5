          assert blob==p['implementation_binding']['workflow_blob']
          assert p['scientific_firewall']['reduced_candidate_response_generated'] is False
          PY

      - name: Resolve material source
        id: cfg
        run: |
          if [[ "${{ matrix.material }}" == "B01" ]]; then
            echo "source=tests/rom/test_lare_dyn0a_reference.f90" >> "$GITHUB_OUTPUT"
          else
            echo "source=tests/rom/test_lare_dyn0a_b14_reference.f90" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize R2048 T32 segment 1
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c6r_segmented_reference.py             --base-materializer tests/rom/materialize_lare_bc2_c6r_root_active_reference.py             --source "${{ steps.cfg.outputs.source }}"             --material "${{ matrix.material }}"             --segment-start 1 --segment-end 8192             --output canonical/tests/rom/test_lare_bc2_c6r_segment.f90             --manifest /tmp/c6r_manifest.json

      - name: Execute R2048 T32 segment 1
        env:
          LARE_DYN0A_CASE_FILTER: ${{ matrix.history }}
          C6R_CHECKPOINT_OUT: /tmp/c6r_checkpoint.bin
        run: |
          set -euo pipefail
          mkdir -p seg
          stub="canonical/c6r_seg1_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes 2048 --dz-cm 0.078125
