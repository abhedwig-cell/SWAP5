  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [base, seg4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check numpy

      - name: Download base routes
        uses: actions/download-artifact@v4
        with:
          pattern: c6r-base-*
          path: /tmp/c6r/base
          merge-multiple: false

      - name: Download R2048 T32 segments
        uses: actions/download-artifact@v4
        with:
          pattern: c6r-seg*
          path: /tmp/c6r/segments
          merge-multiple: false

      - name: Reconstruct all routes and require O0 O2 identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/c6r/routes C6R_EVIDENCE
          for material in B01 B14; do
            for route in R512_T32 R1024_T32 R2048_T16 R2048_T8; do
              for opt in 0 2; do
                full="/tmp/c6r/routes/${material}_${route}_o${opt}.txt"; : > "$full"
                for history in V01 V02 V03 V04; do
                  part="/tmp/c6r/base/c6r-base-${material}-${route}-o${opt}-${history}/${material}_${route}_o${opt}_${history}.txt"
                  test -s "$part"; cat "$part" >> "$full"
                done
              done
              cmp "/tmp/c6r/routes/${material}_${route}_o0.txt" "/tmp/c6r/routes/${material}_${route}_o2.txt"
            done

            for opt in 0 2; do
              full="/tmp/c6r/routes/${material}_R2048_T32_o${opt}.txt"; : > "$full"
              for history in V01 V02 V03 V04; do
                for seg in 1 2 3 4; do
                  part="/tmp/c6r/segments/c6r-seg${seg}-${material}-o${opt}-${history}/${material}_R2048_T32_o${opt}_${history}_seg${seg}.txt"
                  test -s "$part"; cat "$part" >> "$full"
                done
              done
            done
            cmp "/tmp/c6r/routes/${material}_R2048_T32_o0.txt" "/tmp/c6r/routes/${material}_R2048_T32_o2.txt"

            for route in R512_T32 R1024_T32 R2048_T32 R2048_T16 R2048_T8; do
              cp "/tmp/c6r/routes/${material}_${route}_o0.txt" "C6R_EVIDENCE/${material}_${route}_o0.txt"
            done
          done
          echo C6R_O0_O2_IDENTITY=PASS

      - name: Execute frozen C6R uncertainty analysis
        run: |
          set -euo pipefail
          test "$(git hash-object tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py)" = "bf17f616240d4830ea9ef7bed21b3f57ad9b404a"
          python3 tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py             --prereg integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json             --b01-r512-t32 /tmp/c6r/routes/B01_R512_T32_o0.txt             --b01-r1024-t32 /tmp/c6r/routes/B01_R1024_T32_o0.txt             --b01-r2048-t32 /tmp/c6r/routes/B01_R2048_T32_o0.txt             --b01-r2048-t16 /tmp/c6r/routes/B01_R2048_T16_o0.txt             --b01-r2048-t8 /tmp/c6r/routes/B01_R2048_T8_o0.txt             --b14-r512-t32 /tmp/c6r/routes/B14_R512_T32_o0.txt             --b14-r1024-t32 /tmp/c6r/routes/B14_R1024_T32_o0.txt             --b14-r2048-t32 /tmp/c6r/routes/B14_R2048_T32_o0.txt             --b14-r2048-t16 /tmp/c6r/routes/B14_R2048_T16_o0.txt             --b14-r2048-t8 /tmp/c6r/routes/B14_R2048_T8_o0.txt             --output C6R_EVIDENCE/LARE_BC2_C6R_RESULT.json             | tee C6R_EVIDENCE/runner.txt
          cp integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json C6R_EVIDENCE/

      - name: Validate C6R firewall
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('C6R_EVIDENCE/LARE_BC2_C6R_RESULT.json'))
          assert r['status'] in (
            'C6R_ROOT_ACTIVE_R2048_T32_REFERENCE_UNCERTAINTY_QUALIFIED',
            'C6R_ROOT_ACTIVE_REFERENCE_UNCERTAINTY_NOT_QUALIFIED'
          )
          f=r['scientific_firewall']
          assert f['reduced_candidate_response_generated'] is False
          assert f['root_active_fallback_extended'] is False
          assert f['new_root_state_selected'] is False
          assert f['application_acceptance_adjudicated'] is False
          assert f['performance_comparison_authorized'] is False
          assert f['production_rom_authorized'] is False
          print('C6R_FIREWALL=PASS')
          PY
          sha256sum C6R_EVIDENCE/* > C6R_EVIDENCE/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lare-bc2-c6r
          path: C6R_EVIDENCE/
          if-no-files-found: error
