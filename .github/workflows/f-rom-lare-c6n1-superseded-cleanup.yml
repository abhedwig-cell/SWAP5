name: F-ROM-LARE C6N1 superseded run cleanup

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - '.github/workflows/f-rom-lare-c6n1-superseded-cleanup.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel explicitly superseded C6N1 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in             35532934940             35532939703             35533578181             35533878028             35534062401             35534704278             35534785619
          do
            echo "Cancelling superseded run $run"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run/cancel" || true
          done
          echo "C6N1_SUPERSEDED_RUN_CLEANUP=PASS"
