name: F-ROM-LARE DYN0A fixed-flux comparison

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'tests/rom/analyze_lare_dyn0a_fx_comparison.py'
      - 'integration/f-rom/LARE_DYN0A_PREREGISTRATION.json'
      - '.github/workflows/f-rom-lare-dyn0a-fx-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recover frozen ODE and Richards evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-dyn0a/ode /tmp/lare-dyn0a/ref
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10586375452/zip" > /tmp/lare-dyn0a/ode.zip
          echo "fc7720c4d2ee44b62fc5b62e8b43bbae17d424766c9a4630bd0367c96cd1d9fd  /tmp/lare-dyn0a/ode.zip" | sha256sum -c -
          unzip -q /tmp/lare-dyn0a/ode.zip -d /tmp/lare-dyn0a/ode

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10586020583/zip" > /tmp/lare-dyn0a/ref.zip
          echo "beb7b2a6209087b5e647521e565a04b7ec9f0d5313a219807db40384d03b59bc  /tmp/lare-dyn0a/ref.zip" | sha256sum -c -
          unzip -q /tmp/lare-dyn0a/ref.zip -d /tmp/lare-dyn0a/ref

      - name: Verify frozen comparison authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_DYN0A_PREREGISTRATION.json'))
          f=p['pre_successful_comparison_freeze']
          assert f['before_first_successful_lare_vs_richards_hydrological_comparison'] is True
          assert 'layer-storage' in ' '.join(f['fixed_flux_discriminating_outputs'])
          ode=json.load(open('/tmp/lare-dyn0a/ode/LARE_DYN0A_ODE_REFERENCE.json'))
          ref=json.load(open('/tmp/lare-dyn0a/ref/LARE_DYN0A_FX_REFERENCE_STATUS.json'))
          assert ode['decision']=='LARE_DYN0A_HEUN_REFINEMENT_CHARACTERIZED'
          assert ode['fixed_flux_numerical_blocked_count']==0
          assert ref['decision']=='LARE_DYN0A_FX_REFERENCE_CASES_CHARACTERIZED'
          print('LARE_DYN0A_FX_COMPARISON_AUTHORITY=PASS')
          PY

      - name: Analyze common qualified fixed-flux cohort
        run: |
          mkdir -p LARE_DYN0A_FX_COMPARISON_EVIDENCE
          python3 tests/rom/analyze_lare_dyn0a_fx_comparison.py \
            --ode /tmp/lare-dyn0a/ode/LARE_DYN0A_ODE_REFERENCE.json \
            --reference-dir /tmp/lare-dyn0a/ref \
            --reference-status /tmp/lare-dyn0a/ref/LARE_DYN0A_FX_REFERENCE_STATUS.json \
            --output LARE_DYN0A_FX_COMPARISON_EVIDENCE/LARE_DYN0A_FX_COMPARISON_RESULT.json \
            | tee LARE_DYN0A_FX_COMPARISON_EVIDENCE/analyzer.txt

      - name: Validate comparison firewalls
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('LARE_DYN0A_FX_COMPARISON_EVIDENCE/LARE_DYN0A_FX_COMPARISON_RESULT.json'))
          assert p['decision']=='LARE_DYN0A_FX_COMMON_COHORT_COMPARISON_MAPPED'
          assert p['absolute_application_acceptance_adjudicated'] is False
          assert p['speed_claim'] is False
          assert p['D4_executed'] is False
          assert p['production_rom_authorized'] is False
          assert p['partitions']['D3']['common_qualified_case_count'] > 0
          assert p['partitions']['D2']['common_qualified_case_count'] > 0
          print('LARE_DYN0A_FX_COMPARISON_FIREWALL=PASS')
          PY
          sha256sum LARE_DYN0A_FX_COMPARISON_EVIDENCE/* > LARE_DYN0A_FX_COMPARISON_EVIDENCE/sha256.txt

      - name: Upload comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-dyn0a-fx-comparison
          path: LARE_DYN0A_FX_COMPARISON_EVIDENCE/
