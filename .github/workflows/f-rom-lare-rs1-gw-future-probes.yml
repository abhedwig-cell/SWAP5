name: F-ROM-LARE RS1 groundwater future probes

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'tests/rom/test_lare_rs1_gw_future_probe.f90'
      - 'tests/rom/analyze_lare_rs1_gw_future_probe.py'
      - 'tests/rom/run_lare_rs1_gw_future_probe.sh'
      - 'integration/f-rom/LARE_RS1_GW_PAIR_PREREGISTRATION.json'
      - '.github/workflows/f-rom-lare-rs1-gw-future-probes.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  future-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover qualified Stage-A Reference library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-rs1-gw-reference
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10585316225/zip" > /tmp/lare-rs1-gw-reference.zip
          unzip -q /tmp/lare-rs1-gw-reference.zip -d /tmp/lare-rs1-gw-reference
          echo "7d92c4524d16836a25200851ce560b041971d05f65256785e8cf1ef59ae0b345  /tmp/lare-rs1-gw-reference/o2.txt" | sha256sum -c -

      - name: Execute frozen two-layer collision future probes
        env:
          LARE_RS1_GW_REFERENCE_FILE: /tmp/lare-rs1-gw-reference/o2.txt
        run: bash tests/rom/run_lare_rs1_gw_future_probe.sh

      - name: Upload future-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-rs1-gw-future-probes
          path: LARE_RS1_GW_PROBE_EVIDENCE/
          if-no-files-found: warn
