name: F-ROM-LARE RS1 groundwater P1 exact-fast

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'tests/rom/analyze_lare_rs1_gw_p1_exact_fast.py'
      - 'integration/f-rom/LARE_RS1_GW_P1_PREREGISTRATION.json'
      - '.github/workflows/f-rom-lare-rs1-gw-p1-exact-fast.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Recover qualified Stage-A artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-rs1-gw-p1-fast
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10585316225/zip" > /tmp/lare-rs1-gw-p1-fast/stage-a.zip
          echo "a62963c801ffa325d1f12a4314dd703c766f7db4669a33c1ef62f9da6eac45c0  /tmp/lare-rs1-gw-p1-fast/stage-a.zip" | sha256sum -c -
          unzip -q /tmp/lare-rs1-gw-p1-fast/stage-a.zip -d /tmp/lare-rs1-gw-p1-fast/stage-a
          echo "7d92c4524d16836a25200851ce560b041971d05f65256785e8cf1ef59ae0b345  /tmp/lare-rs1-gw-p1-fast/stage-a/o0.txt" | sha256sum -c -

      - name: Execute exact response-blind P1
        run: |
          python3 tests/rom/analyze_lare_rs1_gw_p1_exact_fast.py \
            --input /tmp/lare-rs1-gw-p1-fast/stage-a/o0.txt \
            --prereg integration/f-rom/LARE_RS1_GW_P1_PREREGISTRATION.json \
            --workers 2 \
            --output /tmp/lare-rs1-gw-p1-fast/LARE_RS1_GW_P1_RESULT.json

      - name: Upload P1 result
        uses: actions/upload-artifact@v4
        with:
          name: lare-rs1-gw-p1-exact-fast
          path: /tmp/lare-rs1-gw-p1-fast/LARE_RS1_GW_P1_RESULT.json
