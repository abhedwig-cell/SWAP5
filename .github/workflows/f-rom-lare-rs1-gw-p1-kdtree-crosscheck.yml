name: F-ROM-LARE RS1 groundwater P1 KD-tree cross-check

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'tests/rom/analyze_lare_rs1_gw_p1_kdtree_crosscheck.py'
      - 'integration/f-rom/LARE_RS1_GW_P1_PREREGISTRATION.json'
      - '.github/workflows/f-rom-lare-rs1-gw-p1-kdtree-crosscheck.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Recover qualified RS1-GW Stage-A artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-rs1-gw-kd
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10585316225/zip" > /tmp/lare-rs1-gw-kd/stage-a.zip
          echo "a62963c801ffa325d1f12a4314dd703c766f7db4669a33c1ef62f9da6eac45c0  /tmp/lare-rs1-gw-kd/stage-a.zip" | sha256sum -c -
          unzip -q /tmp/lare-rs1-gw-kd/stage-a.zip -d /tmp/lare-rs1-gw-kd/stage-a
          echo "7d92c4524d16836a25200851ce560b041971d05f65256785e8cf1ef59ae0b345  /tmp/lare-rs1-gw-kd/stage-a/o0.txt" | sha256sum -c -

      - name: Execute independent exact KD-tree cross-check
        run: |
          python3 tests/rom/analyze_lare_rs1_gw_p1_kdtree_crosscheck.py \
            --input /tmp/lare-rs1-gw-kd/stage-a/o0.txt \
            --prereg integration/f-rom/LARE_RS1_GW_P1_PREREGISTRATION.json \
            --workers 2 \
            --output /tmp/lare-rs1-gw-kd/LARE_RS1_GW_P1_KDTREE_CROSSCHECK.json

      - name: Upload cross-check evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-rs1-gw-p1-kdtree-crosscheck
          path: /tmp/lare-rs1-gw-kd/LARE_RS1_GW_P1_KDTREE_CROSSCHECK.json
