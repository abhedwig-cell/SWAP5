name: F-ROM-LARE RS1 groundwater P2 purpose ambiguity

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_RS1_GW_P1_RESULT.json'
      - 'integration/f-rom/LARE_RS1_GW_P2_PREREGISTRATION.json'
      - 'tests/rom/prepare_lare_rs1_gw_p2_selection.py'
      - 'tests/rom/test_lare_rs1_gw_p2_future_probe.f90'
      - 'tests/rom/analyze_lare_rs1_gw_p2_future_response.py'
      - 'tests/rom/run_lare_rs1_gw_p2.sh'
      - '.github/workflows/f-rom-lare-rs1-gw-p2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  p2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover qualified Stage-A Reference library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-rs1-gw-p2-reference
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10585316225/zip" > /tmp/lare-rs1-gw-p2-reference.zip
          echo "a62963c801ffa325d1f12a4314dd703c766f7db4669a33c1ef62f9da6eac45c0  /tmp/lare-rs1-gw-p2-reference.zip" | sha256sum -c -
          unzip -q /tmp/lare-rs1-gw-p2-reference.zip -d /tmp/lare-rs1-gw-p2-reference
          echo "7d92c4524d16836a25200851ce560b041971d05f65256785e8cf1ef59ae0b345  /tmp/lare-rs1-gw-p2-reference/o0.txt" | sha256sum -c -

      - name: Execute formal P2 future-response ambiguity map
        env:
          LARE_RS1_GW_REFERENCE_FILE: /tmp/lare-rs1-gw-p2-reference/o0.txt
        run: bash tests/rom/run_lare_rs1_gw_p2.sh

      - name: Upload P2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-rs1-gw-p2
          path: LARE_RS1_GW_P2_EVIDENCE/
          if-no-files-found: warn