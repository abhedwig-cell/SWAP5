name: F-ROM-LARE RS1 groundwater P2C common cohort

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/LARE_RS1_GW_P2C_PREREGISTRATION.json'
      - 'tests/rom/analyze_lare_rs1_gw_p2c_common_cohort.py'
      - '.github/workflows/f-rom-lare-rs1-gw-p2c.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  common-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover exact Stage-A and P2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lare-rs1-p2c/stage-a /tmp/lare-rs1-p2c/p2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10585316225/zip" > /tmp/lare-rs1-p2c/stage-a.zip
          echo "a62963c801ffa325d1f12a4314dd703c766f7db4669a33c1ef62f9da6eac45c0  /tmp/lare-rs1-p2c/stage-a.zip" | sha256sum -c -
          unzip -q /tmp/lare-rs1-p2c/stage-a.zip -d /tmp/lare-rs1-p2c/stage-a
          echo "7d92c4524d16836a25200851ce560b041971d05f65256785e8cf1ef59ae0b345  /tmp/lare-rs1-p2c/stage-a/o0.txt" | sha256sum -c -

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10584843824/zip" > /tmp/lare-rs1-p2c/p2.zip
          echo "56f9b9c732becdbfd5a0c11da21bc2b90f5bed04ab15f7b9c984a199251ded3c  /tmp/lare-rs1-p2c/p2.zip" | sha256sum -c -
          unzip -q /tmp/lare-rs1-p2c/p2.zip -d /tmp/lare-rs1-p2c/p2

      - name: Map common-cohort reduction-induced ambiguity
        run: |
          set -euo pipefail
          python3 tests/rom/analyze_lare_rs1_gw_p2c_common_cohort.py \
            --stage-a /tmp/lare-rs1-p2c/stage-a/o0.txt \
            --p2-output /tmp/lare-rs1-p2c/p2/o2.txt \
            --p2-selection integration/f-rom/LARE_RS1_GW_P2_SELECTION.json \
            --p1-result integration/f-rom/LARE_RS1_GW_P1_RESULT.json \
            --prereg integration/f-rom/LARE_RS1_GW_P2C_PREREGISTRATION.json \
            --output /tmp/lare-rs1-p2c/LARE_RS1_GW_P2C_RESULT.json

      - name: Upload P2C evidence
        uses: actions/upload-artifact@v4
        with:
          name: lare-rs1-gw-p2c
          path: /tmp/lare-rs1-p2c/LARE_RS1_GW_P2C_RESULT.json
