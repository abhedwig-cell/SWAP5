name: F-ROM-LARE RS1 groundwater stage A

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'tests/rom/test_lare_rs1_gw_library.f90'
      - 'tests/rom/analyze_lare_rs1_gw_library.py'
      - 'tests/rom/run_lare_rs1_gw_library.sh'
      - 'integration/f-rom/LARE_RS1_GW_*'
      - '.github/workflows/f-rom-lare-rs1-gw-stage-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and qualify preregistered RS1-GW Reference library
        run: bash tests/rom/run_lare_rs1_gw_library.sh
      - name: Upload RS1-GW evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lare-rs1-gw-stage-a
          path: LARE_RS1_GW_EVIDENCE/
          if-no-files-found: warn
