name: F-ROM Layer-ROM A1 state sufficiency

on:
  push:
    branches:
      - work/f-rom-layer-a
    paths:
      - 'integration/f-rom/LAYER_ROM_A0_AUTHORITY_BINDING.json'
      - 'integration/f-rom/LAYER_ROM_A1_PREREGISTRATION.json'
      - 'integration/f-rom/LAYER_ROM_STATUS.json'
      - 'tests/rom/analyze_layer_rom_a1_state_sufficiency.py'
      - '.github/workflows/f-rom-layer-a1-state-sufficiency.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  state-response-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert research-only source freeze
        run: |
          set -euo pipefail
          git diff --quiet b3dc66cd85bcebe2bfca4d46f9ee92cb06d3137d...HEAD -- src reference
          echo "LAYER_ROM_A1_SOURCE_FREEZE=PASS"

      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Recover immutable Reference and future-probe evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/layer-rom-a1/stage-a /tmp/layer-rom-a1/p2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10585316225/zip" > /tmp/layer-rom-a1/stage-a.zip
          echo "a62963c801ffa325d1f12a4314dd703c766f7db4669a33c1ef62f9da6eac45c0  /tmp/layer-rom-a1/stage-a.zip" | sha256sum -c -
          unzip -q /tmp/layer-rom-a1/stage-a.zip -d /tmp/layer-rom-a1/stage-a
          echo "7d92c4524d16836a25200851ce560b041971d05f65256785e8cf1ef59ae0b345  /tmp/layer-rom-a1/stage-a/o0.txt" | sha256sum -c -

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10584843824/zip" > /tmp/layer-rom-a1/p2.zip
          echo "56f9b9c732becdbfd5a0c11da21bc2b90f5bed04ab15f7b9c984a199251ded3c  /tmp/layer-rom-a1/p2.zip" | sha256sum -c -
          unzip -q /tmp/layer-rom-a1/p2.zip -d /tmp/layer-rom-a1/p2
          test -f /tmp/layer-rom-a1/p2/LARE_RS1_GW_P2_SELECTION.json
          test -f /tmp/layer-rom-a1/p2/o2.txt

      - name: Validate preregistration and inherited cohort authority
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("integration/f-rom/LAYER_ROM_A1_PREREGISTRATION.json"))
          s=json.load(open("/tmp/layer-rom-a1/p2/LARE_RS1_GW_P2_SELECTION.json"))
          assert p["phase"]=="PREREGISTERED_BEFORE_LAYER_RESPONSE_REPLAY"
          assert p["pre_execution_amendment"]["before_first_layer_response_replay"] is True
          assert [r["id"] for r in p["representations"]]==["T1","L2","U2","L3","U3","L4","U4","L6","U6"]
          assert s["future_response_used"] is False
          assert s["pair_reselection"] is False
          assert s["unique_start_state_count"]==41
          print("LAYER_ROM_A1_AUTHORITY_LOCK=PASS")
          PY

      - name: Execute closure-free future-response replay
        run: |
          set -euo pipefail
          mkdir -p LAYER_ROM_A1_EVIDENCE
          python3 tests/rom/analyze_layer_rom_a1_state_sufficiency.py             --stage-a /tmp/layer-rom-a1/stage-a/o0.txt             --probe-output /tmp/layer-rom-a1/p2/o2.txt             --selection /tmp/layer-rom-a1/p2/LARE_RS1_GW_P2_SELECTION.json             --prereg integration/f-rom/LAYER_ROM_A1_PREREGISTRATION.json             --output LAYER_ROM_A1_EVIDENCE/LAYER_ROM_A1_STATE_SUFFICIENCY_RESULT.json             | tee LAYER_ROM_A1_EVIDENCE/analyzer.txt
          sha256sum LAYER_ROM_A1_EVIDENCE/* > LAYER_ROM_A1_EVIDENCE/sha256.txt
          git diff --check b3dc66cd85bcebe2bfca4d46f9ee92cb06d3137d...HEAD
          echo "LAYER_ROM_A1_STATE_RESPONSE_REPLAY=PASS"

      - name: Upload Layer-ROM A1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-rom-a1-state-sufficiency
          path: LAYER_ROM_A1_EVIDENCE/
          if-no-files-found: error
