name: F-ROM Layer-ROM A2B quasi-steady closure audit

on:
  push:
    branches:
      - work/f-rom-layer-a
    paths:
      - 'integration/f-rom/LAYER_ROM_A2B_PREREGISTRATION.json'
      - 'tests/rom/analyze_layer_rom_a2b_closure_audit.py'
      - '.github/workflows/f-rom-layer-a2b-closure-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert research-only source freeze
        run: |
          set -euo pipefail
          git diff --quiet b3dc66cd85bcebe2bfca4d46f9ee92cb06d3137d...HEAD -- src reference
          echo "LAYER_ROM_A2B_SOURCE_FREEZE=PASS"

      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Recover immutable DYN0A fine Reference evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/layer-rom-a2b/ref
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10586020583/zip" > /tmp/layer-rom-a2b/ref.zip
          echo "beb7b2a6209087b5e647521e565a04b7ec9f0d5313a219807db40384d03b59bc  /tmp/layer-rom-a2b/ref.zip" | sha256sum -c -
          unzip -q /tmp/layer-rom-a2b/ref.zip -d /tmp/layer-rom-a2b/ref
          test -f /tmp/layer-rom-a2b/ref/fine-S2_B1_F2-o2.txt
          test -f /tmp/layer-rom-a2b/ref/fine-S3_B1_F3-o2.txt

      - name: Lock A2B preregistration
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("integration/f-rom/LAYER_ROM_A2B_PREREGISTRATION.json"))
          assert p["phase"]=="PREREGISTERED_BEFORE_QUASI_STEADY_CLOSURE_RESULTS"
          assert p["pre_execution_numerical_amendment"]["before_first_A2B_result"] is True
          assert p["pre_execution_numerical_amendment"]["observation_set"].startswith("all 1024")
          assert [c["id"] for c in p["closures"]]==[
              "C_LARE_TAYLOR",
              "C_INT_CENTROID_LONG_ONLY",
              "C_QS_STORAGE_LONG_ONLY",
          ]
          assert "NO_REDUCED_PROPAGATION" in p["firewalls"]
          print("LAYER_ROM_A2B_AUTHORITY_LOCK=PASS")
          PY

      - name: Execute A2B closure audit
        run: |
          set -euo pipefail
          mkdir -p LAYER_ROM_A2B_EVIDENCE
          python3 tests/rom/analyze_layer_rom_a2b_closure_audit.py             --reference-dir /tmp/layer-rom-a2b/ref             --prereg integration/f-rom/LAYER_ROM_A2B_PREREGISTRATION.json             --output LAYER_ROM_A2B_EVIDENCE/LAYER_ROM_A2B_RESULT.json             | tee LAYER_ROM_A2B_EVIDENCE/analyzer.txt
          sha256sum LAYER_ROM_A2B_EVIDENCE/* > LAYER_ROM_A2B_EVIDENCE/sha256.txt
          git diff --check b3dc66cd85bcebe2bfca4d46f9ee92cb06d3137d...HEAD
          echo "LAYER_ROM_A2B_CLOSURE_AUDIT=PASS"

      - name: Upload A2B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-rom-a2b-closure-audit
          path: LAYER_ROM_A2B_EVIDENCE/
          if-no-files-found: error
