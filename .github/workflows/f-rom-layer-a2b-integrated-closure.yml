name: F-ROM Layer-ROM A2B integrated closure audit

on:
  push:
    branches:
      - work/f-rom-layer-a
    paths:
      - 'integration/f-rom/LAYER_ROM_A2B_PREREGISTRATION.json'
      - 'tests/rom/analyze_layer_rom_a2b_integrated_closures.py'
      - '.github/workflows/f-rom-layer-a2b-integrated-closure.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrated-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert research-only source freeze
        run: |
          set -euo pipefail
          git diff --quiet b3dc66cd85bcebe2bfca4d46f9ee92cb06d3137d...HEAD -- src reference
          echo "LAYER_ROM_A2B_SOURCE_FREEZE=PASS"

      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Recover immutable DYN0A fine Reference evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/layer-rom-a2b/ref
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10586020583/zip" > /tmp/layer-rom-a2b/ref.zip
          echo "beb7b2a6209087b5e647521e565a04b7ec9f0d5313a219807db40384d03b59bc  /tmp/layer-rom-a2b/ref.zip" | sha256sum -c -
          unzip -q /tmp/layer-rom-a2b/ref.zip -d /tmp/layer-rom-a2b/ref
          for case in S2_B1_F2 S2_B1_F3 S2_B1_F4 S3_B1_F3; do
            test -f "/tmp/layer-rom-a2b/ref/fine-${case}-o2.txt"
          done

      - name: Lock A2B preregistration
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LAYER_ROM_A2B_PREREGISTRATION.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_QUASI_STEADY_CLOSURE_RESULTS'
          assert [c['id'] for c in p['closures']]==[
            'C_LARE_TAYLOR','C_INT_CENTROID_LONG_ONLY','C_QS_STORAGE_LONG_ONLY'
          ]
          f=p['pre_execution_numerical_freeze']
          a=p['pre_execution_numerical_amendment']
          assert f['before_first_official_A2B_result'] is True
          assert a['before_first_A2B_result'] is True
          assert a['observation_set']=='all 1024 accepted Reference observations for each of the four frozen primary cases'
          assert a['solve_ivp']['method']=='DOP853'
          assert a['solve_ivp']['rtol']==2e-10
          assert a['solve_ivp']['atol_psi']==1e-10
          assert a['solve_ivp']['atol_theta_integral']==1e-11
          assert a['least_squares']['xtol']==1e-12
          assert a['least_squares']['ftol']==1e-12
          assert a['least_squares']['gtol']==1e-12
          assert a['least_squares']['max_nfev']==40
          print('LAYER_ROM_A2B_AUTHORITY_LOCK=PASS')
          PY

      - name: Execute integrated storage-only closure audit
        run: |
          set -euo pipefail
          mkdir -p LAYER_ROM_A2B_EVIDENCE
          python3 tests/rom/analyze_layer_rom_a2b_integrated_closures.py             --reference-dir /tmp/layer-rom-a2b/ref             --prereg integration/f-rom/LAYER_ROM_A2B_PREREGISTRATION.json             --output LAYER_ROM_A2B_EVIDENCE/LAYER_ROM_A2B_RESULT.json             | tee LAYER_ROM_A2B_EVIDENCE/analyzer.txt

      - name: Validate A2B result gates
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('LAYER_ROM_A2B_EVIDENCE/LAYER_ROM_A2B_RESULT.json'))
          assert p['decision'] in {'A2B_STORAGE_ONLY_CLOSURE_SUPPORTED','A2B_NO_STORAGE_ONLY_CLOSURE_SUPPORTED'}
          assert p['reduced_state_propagated'] is False
          assert p['application_acceptance'] is False
          assert p['production_rom_authorized'] is False
          assert p['numerical']['max_qs_storage_residual_theta'] <= 1e-10
          print('LAYER_ROM_A2B_RESULT_GATE=PASS')
          PY
          sha256sum LAYER_ROM_A2B_EVIDENCE/* > LAYER_ROM_A2B_EVIDENCE/sha256.txt
          git diff --check b3dc66cd85bcebe2bfca4d46f9ee92cb06d3137d...HEAD
          echo "LAYER_ROM_A2B_INTEGRATED_CLOSURE=PASS"

      - name: Upload A2B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-rom-a2b-integrated-closure
          path: LAYER_ROM_A2B_EVIDENCE/
          if-no-files-found: error
