name: F-ROM Layer-ROM A3 first-moment audit

on:
  push:
    branches:
      - work/f-rom-layer-a
    paths:
      - 'integration/f-rom/LAYER_ROM_A3_PREREGISTRATION.json'
      - 'tests/rom/analyze_layer_rom_a3_moment_state.py'
      - '.github/workflows/f-rom-layer-a3-moment-state.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  moment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert research-only source freeze
        run: |
          set -euo pipefail
          git diff --quiet b3dc66cd85bcebe2bfca4d46f9ee92cb06d3137d...HEAD -- src reference
          echo "LAYER_ROM_A3_SOURCE_FREEZE=PASS"

      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Recover immutable DYN0A fine Reference evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/layer-rom-a3/ref
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10586020583/zip" > /tmp/layer-rom-a3/ref.zip
          echo "beb7b2a6209087b5e647521e565a04b7ec9f0d5313a219807db40384d03b59bc  /tmp/layer-rom-a3/ref.zip" | sha256sum -c -
          unzip -q /tmp/layer-rom-a3/ref.zip -d /tmp/layer-rom-a3/ref
          for case in S2_B1_F2 S2_B1_F3 S2_B1_F4 S3_B1_F3; do
            test -f "/tmp/layer-rom-a3/ref/fine-${case}-o2.txt"
          done

      - name: Lock A3 preregistration
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LAYER_ROM_A3_PREREGISTRATION.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_FIRST_MOMENT_STATE_RESULT'
          assert p['state_candidates']['L3_M1']['dimension']==4
          assert p['state_candidates']['L4']['dimension']==4
          assert [c['id'] for c in p['moment_closures']]==['C_M1_LINEAR_THETA','C_M1_LINEAR_PSI']
          n=p['pre_execution_numerical_freeze']
          assert n['before_first_A3_execution'] is True
          assert n['quadrature_orders']==[64,128]
          assert n['least_squares']['xtol']==1e-12
          assert n['least_squares']['max_nfev']==80
          print('LAYER_ROM_A3_AUTHORITY_LOCK=PASS')
          PY

      - name: Execute teacher-forced moment-state audit
        run: |
          set -euo pipefail
          mkdir -p LAYER_ROM_A3_EVIDENCE
          python3 tests/rom/analyze_layer_rom_a3_moment_state.py             --reference-dir /tmp/layer-rom-a3/ref             --prereg integration/f-rom/LAYER_ROM_A3_PREREGISTRATION.json             --output LAYER_ROM_A3_EVIDENCE/LAYER_ROM_A3_RESULT.json             | tee LAYER_ROM_A3_EVIDENCE/analyzer.txt
          python3 - <<'PY'
          import json
          r=json.load(open('LAYER_ROM_A3_EVIDENCE/LAYER_ROM_A3_RESULT.json'))
          assert r['decision'] in {'A3_FIRST_MOMENT_INFORMATION_SUPPORTED','A3_FIRST_MOMENT_INFORMATION_NOT_SUPPORTED'}
          assert r['reduced_state_propagated'] is False
          assert r['application_acceptance'] is False
          assert r['production_rom_authorized'] is False
          print('LAYER_ROM_A3_RESULT_GATE=PASS')
          PY
          sha256sum LAYER_ROM_A3_EVIDENCE/* > LAYER_ROM_A3_EVIDENCE/sha256.txt
          git diff --check b3dc66cd85bcebe2bfca4d46f9ee92cb06d3137d...HEAD
          echo "LAYER_ROM_A3_MOMENT_AUDIT=PASS"

      - name: Upload A3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-rom-a3-moment-state
          path: LAYER_ROM_A3_EVIDENCE/
          if-no-files-found: error
