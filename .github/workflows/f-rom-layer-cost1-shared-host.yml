name: F-ROM Layer-ROM COST1 shared-host cost screen

on:
  push:
    branches: [work/f-rom-layer-a]
    paths:
      - integration/f-rom/LAYER_ROM_COST1_PREREGISTRATION.json
      - integration/f-rom/LAYER_ROM_PHASE_B_DIMENSION_STATE_CLOSURE_FIDELITY_CURVE.json
      - integration/f-rom/LAYER_ROM_B1HCP_RESULT.json
      - tests/rom/materialize_layer_rom_cost1_lare.py
      - tests/rom/validate_layer_rom_cost1_lare.py
      - tests/rom/materialize_layer_rom_cost1_benchmark_mode.py
      - tests/rom/run_layer_rom_cost1_timing.py
      - tests/rom/aggregate_layer_rom_cost1.py
      - .github/workflows/f-rom-layer-cost1-shared-host.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: f-rom-layer-cost1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  material:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {material: B02, cn_id: 10603836176, cn_digest: 'bdb676eef7c1a120738edce4ed36b94764daf97199cb11d781d4b64cdb025a98', cl_id: 10603208865, cl_digest: 'd0e4971839ee9d27e80359855784b7d6bd95175fe088fc94e95ce028b1d9ae7d'}
          - {material: B05, cn_id: 10603304734, cn_digest: 'e69255eb66e4ba2c8ae8c08a6840de58a8348758490da8bfab7c84e0eaf27510', cl_id: 10602989491, cl_digest: 'f5bfdcb0fe34d32a1d8a412c474bcf39c858fc217a4a9a589f4db7312e9ff32c'}
          - {material: B06, cn_id: 10604270319, cn_digest: 'ee163877dd4deab3108203fe5529f6d5a6685c0a30f0feec64c6732b213b0904', cl_id: 10603760794, cl_digest: 'fee06409ee7bdfcf77ec3a2bb92b790c15585ba10783c904bdfbb5803f313212'}
          - {material: B11, cn_id: 10603693882, cn_digest: 'ffa3604eac5ca5efd8d948c12972a2e3ff2f9a4f123c5dcfe4dd73c08cc2aa25', cl_id: 10603223814, cl_digest: '97a3ce162c4a1f0b42359d2871779c43a3727d0f895ecfaeb374179201c6b17c'}
          - {material: B12, cn_id: 10603723399, cn_digest: '820a761ce8484ef95f3715fedd654c072c4eb3f3fa387d8d55b446bedffaedb5', cl_id: 10603770562, cl_digest: '68110523e84b1691abfa7cfc32d2df204d61b30cf56054f65b4a0d385231c5b6'}
          - {material: B16, cn_id: 10603624076, cn_digest: 'b8511c3aa238ce4d0499cc1c451880944d9f7129afe61d52db4f2e243121e8ba', cl_id: 10603433546, cl_digest: 'd6ddb83994bd9090107eb855f62711fb173a37ad8d296ced802e073453e6d1ae'}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Lock COST1 authority and research-only source freeze
        run: |
          set -euo pipefail
          git diff --quiet 1caa431002d5c128c73cfcfbd31af4cc39ee9f12...HEAD -- src reference
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LAYER_ROM_COST1_PREREGISTRATION.json'))
          f=json.load(open('integration/f-rom/LAYER_ROM_PHASE_B_DIMENSION_STATE_CLOSURE_FIDELITY_CURVE.json'))
          assert p['phase']=='PREREGISTERED_AFTER_PHASE_B_FIDELITY_FREEZE_BEFORE_NEW_TIMING_EXPOSURE'
          assert f['fidelity_freeze_for_cost_screen']['candidates']==['L4','L6','R8']
          assert f['fidelity_freeze_for_cost_screen']['material_panel']==['B02','B05','B06','B11','B12','B16']
          assert p['timing_protocol']['measured_rounds']==20
          assert p['timing_protocol']['warmups_per_route']==2
          assert p['timing_protocol']['route_count']==10
          assert p['performance_class']=='SHARED_HOST_SCREENING_ONLY'
          assert p['production_rom_authorized'] is False
          print('LAYER_ROM_COST1_AUTHORITY_LOCK=PASS')
          PY
          python3 -m py_compile             tests/rom/materialize_layer_rom_cost1_lare.py             tests/rom/validate_layer_rom_cost1_lare.py             tests/rom/materialize_layer_rom_cost1_benchmark_mode.py             tests/rom/run_layer_rom_cost1_timing.py             tests/rom/aggregate_layer_rom_cost1.py

      - name: Recover pinned source and immutable temporal evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cost1/cn /tmp/cost1/cl /tmp/cost1/basis /tmp/cost1/co_l6 /tmp/cost1/co_r8
          git fetch --no-tags origin             4f938b040d92ee46646e3397278c78a46942944c             9d66a3e8a7fda6d1e456188cfc87cf9f884075a4             e3b11802e88316dcd57147569e985153be99e215
          git show 4f938b040d92ee46646e3397278c78a46942944c:tests/rom/test_lare_bc2_c4t_lare_compiled.f90 > /tmp/cost1/lare_base.f90
          test "$(git hash-object /tmp/cost1/lare_base.f90)" = "97d7aca98326f6f1e91a8a1c9af537a5f0056419"
          git show 9d66a3e8a7fda6d1e456188cfc87cf9f884075a4:tests/rom/test_f_romv2_d13_groundwater_comparators.f90 > /tmp/cost1/d13_base.f90
          test "$(git hash-object /tmp/cost1/d13_base.f90)" = "23ba278a37e142dc4c21e605af51dbf8f100ce92"
          git show e3b11802e88316dcd57147569e985153be99e215:tests/rom/analyze_lare_bc2_c4v_one_day.py > /tmp/cost1/basis/analyze_lare_bc2_c4v_one_day.py
          git show e3b11802e88316dcd57147569e985153be99e215:tests/rom/run_lare_bc1_stage_b.py > /tmp/cost1/basis/run_lare_bc1_stage_b.py
          test "$(git hash-object /tmp/cost1/basis/analyze_lare_bc2_c4v_one_day.py)" = "e7d22818d935bedddeb2f2cdf2cec58e95814f93"
          test "$(git hash-object /tmp/cost1/basis/run_lare_bc1_stage_b.py)" = "33a68fc51d5c1905b9f377e2d14626aeebe27f98"

          fetch_artifact () {
            local id="$1" digest="$2" zip="$3" out="$4"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > "$zip"
            echo "$digest  $zip" | sha256sum -c -
            unzip -q "$zip" -d "$out"
          }
          fetch_artifact "${{ matrix.cn_id }}" "${{ matrix.cn_digest }}" /tmp/cost1/cn.zip /tmp/cost1/cn
          fetch_artifact "${{ matrix.cl_id }}" "${{ matrix.cl_digest }}" /tmp/cost1/cl.zip /tmp/cost1/cl

          if [ "${{ matrix.material }}" = "B05" ]; then
            fetch_artifact 10604095931 f316da4f474cb9a7c57576c243c64c4cf56f313d0e7ef1e813003aa2b1bc1fbb /tmp/cost1/co_l6.zip /tmp/cost1/co_l6
            fetch_artifact 10603419858 a9cf48023575fef3fd1ec16c85859a0ff666396bd30d6674a9fb156ea4f4cca1 /tmp/cost1/co_r8.zip /tmp/cost1/co_r8
          fi

          test -f "/tmp/cost1/cl/R16_${{ matrix.material }}_ultra.txt"
          for member in L4 L6 R8; do
            for hist in X01 X02 X03 X04; do
              test -f "/tmp/cost1/cn/fine/COR_FINE_${member}_${hist}.txt"
            done
          done
          if [ "${{ matrix.material }}" = "B05" ]; then
            for hist in X01 X02 X03 X04; do
              test -f "/tmp/cost1/co_l6/ultra/COR_ULTRA_L6_${hist}.txt"
              test -f "/tmp/cost1/co_r8/ultra/COR_ULTRA_R8_${hist}.txt"
            done
          fi
          echo 'LAYER_ROM_COST1_IMMUTABLE_EVIDENCE=PASS'

      - name: Materialize Layer-ROM BASE and FINE binaries
        run: |
          set -euo pipefail
          mkdir -p COST1_EVIDENCE/equivalence
          for variant in BASE FINE; do
            dt=0.0001
            [ "$variant" = "FINE" ] && dt=0.000025
            python3 tests/rom/materialize_layer_rom_cost1_lare.py               --base-fortran /tmp/cost1/lare_base.f90               --panel integration/f-rom/LAYER_ROM_B0_TRANSFER_PANEL_PREREGISTRATION.json               --b1h-prereg integration/f-rom/LAYER_ROM_B1H_PREREGISTRATION.json               --cost-prereg integration/f-rom/LAYER_ROM_COST1_PREREGISTRATION.json               --material "${{ matrix.material }}" --dt-day "$dt" --variant "$variant"               --output "/tmp/cost1/lr_${variant}.f90"               --manifest "COST1_EVIDENCE/equivalence/LR_${variant}_MATERIALIZATION.json"
          done
          COMMON="-std=f2008 -ffree-line-length-none -Wall -Wextra -fcheck=all -fbacktrace -fopenmp -ffpe-trap=invalid,zero,overflow"
          for variant in BASE FINE; do
            for opt in 0 2; do
              gfortran $COMMON -O$opt "/tmp/cost1/lr_${variant}.f90" -o "/tmp/cost1/lr_${variant}_o${opt}"
            done
          done
          echo 'LAYER_ROM_COST1_LR_BUILD=PASS'

      - name: Validate compiled Layer-ROM scientific equivalence
        run: |
          set -euo pipefail
          for variant in BASE FINE; do
            for member in L4 L6 R8; do
              route="LR${member#L}_${variant}"
              for opt in 0 2; do
                "/tmp/cost1/lr_${variant}_o${opt}" "$route" validate > "/tmp/cost1/${route}_o${opt}.txt"
              done
              cmp "/tmp/cost1/${route}_o0.txt" "/tmp/cost1/${route}_o2.txt"
              python3 tests/rom/validate_layer_rom_cost1_lare.py                 --compiled-o0 "/tmp/cost1/${route}_o0.txt"                 --compiled-o2 "/tmp/cost1/${route}_o2.txt"                 --reference "/tmp/cost1/cl/R16_${{ matrix.material }}_ultra.txt"                 --basis-dir /tmp/cost1/basis                 --panel integration/f-rom/LAYER_ROM_B0_TRANSFER_PANEL_PREREGISTRATION.json                 --b1h-prereg integration/f-rom/LAYER_ROM_B1H_PREREGISTRATION.json                 --cost-prereg integration/f-rom/LAYER_ROM_COST1_PREREGISTRATION.json                 --material "${{ matrix.material }}" --member "$member" --variant "$variant"                 --output "COST1_EVIDENCE/equivalence/${route}.json"
            done
          done
          echo 'LAYER_ROM_COST1_LR_EQUIVALENCE=PASS'

      - name: Materialize benchmark-capable CoRichards and R16 sources
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_layer_rom_b1h_material.py             --base-fortran /tmp/cost1/d13_base.f90             --panel integration/f-rom/LAYER_ROM_B0_TRANSFER_PANEL_PREREGISTRATION.json             --prereg integration/f-rom/LAYER_ROM_B1H_PREREGISTRATION.json             --material "${{ matrix.material }}"             --output /tmp/cost1/b1h_material.f90             --manifest COST1_EVIDENCE/equivalence/B1H_MATERIALIZATION.json

          python3 tests/rom/materialize_layer_rom_b1hcq_corichards_harness.py             --b1h-source /tmp/cost1/b1h_material.f90             --output /tmp/cost1/cor_base.f90             --manifest COST1_EVIDENCE/equivalence/COR_BASE_MATERIALIZATION.json

          python3 tests/rom/materialize_layer_rom_b1hcn_corichards_temporal.py             --base-harness /tmp/cost1/cor_base.f90 --dt-day 0.00025             --output /tmp/cost1/cor_fine_raw.f90             --manifest COST1_EVIDENCE/equivalence/COR_FINE_MATERIALIZATION.json
          python3 tests/rom/materialize_layer_rom_b1hco_corichards_ultra.py             --base-harness /tmp/cost1/cor_base.f90             --output /tmp/cost1/cor_ultra_raw.f90             --manifest COST1_EVIDENCE/equivalence/COR_ULTRA_MATERIALIZATION.json

          python3 tests/rom/materialize_layer_rom_cost1_benchmark_mode.py             --source /tmp/cost1/cor_fine_raw.f90             --output /tmp/cost1/cor_fine.f90             --manifest COST1_EVIDENCE/equivalence/COR_FINE_BENCHMARK_MATERIALIZATION.json
          python3 tests/rom/materialize_layer_rom_cost1_benchmark_mode.py             --source /tmp/cost1/cor_ultra_raw.f90             --output /tmp/cost1/cor_ultra.f90             --manifest COST1_EVIDENCE/equivalence/COR_ULTRA_BENCHMARK_MATERIALIZATION.json
          echo 'LAYER_ROM_COST1_RICHARDS_MATERIALIZATION=PASS'

      - name: Build CoRichards and R16 routes
        run: |
          set -euo pipefail
          build_route () {
            local route="$1" thickness="$2" source="$3"
            local stub="canonical/cost1_${route}_stubs.f90"
            local target="tests/rom/test_cost1_${route}.f90"
            python3 tests/rom/materialize_layer_rom_variable_grid_stubs.py               --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90               --output "$stub" --layer-thickness-cm "$thickness"
            cp "$source" "canonical/$target"
            for opt in 0 2; do
              python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py                 --root canonical --stub "cost1_${route}_stubs.f90"                 --target "$target" --external-source src/legacy/b1_10_port/headcalc.f90                 --build "/tmp/cost1/build_${route}_o${opt}" --opt "$opt"
            done
          }

          build_route COR4 "130,10,10,10" /tmp/cost1/cor_fine.f90
          if [ "${{ matrix.material }}" = "B05" ]; then
            build_route COR6 "110,10,10,10,10,10" /tmp/cost1/cor_ultra.f90
            build_route COR8 "90,10,10,10,10,10,10,10" /tmp/cost1/cor_ultra.f90
          else
            build_route COR6 "110,10,10,10,10,10" /tmp/cost1/cor_fine.f90
            build_route COR8 "90,10,10,10,10,10,10,10" /tmp/cost1/cor_fine.f90
          fi
          build_route R16 "10,10,10,10,10,10,10,10,10,10,10,10,10,10,10,10" /tmp/cost1/cor_ultra.f90
          echo 'LAYER_ROM_COST1_RICHARDS_BUILD=PASS'

      - name: Prove Richards validation identity before timing
        run: |
          set -euo pipefail
          for route in COR4 COR6 COR8; do
            member="L${route#COR}"
            [ "$route" = "COR8" ] && member="R8"
            for hist in X01 X02 X03 X04; do
              for opt in 0 2; do
                log="/tmp/cost1/${route}_${hist}_o${opt}.txt"
                B1HC_HISTORY_FILTER="$hist" "/tmp/cost1/build_${route}_o${opt}/rom0_test" > "$log" 2>&1
                grep -Fq 'F_ROMV2_D13_REF_EXECUTION_COMPLETE=PASS' "$log"
              done
              cmp "/tmp/cost1/${route}_${hist}_o0.txt" "/tmp/cost1/${route}_${hist}_o2.txt"
              if [ "${{ matrix.material }}" = "B05" ] && [ "$route" = "COR6" ]; then
                cmp "/tmp/cost1/${route}_${hist}_o0.txt" "/tmp/cost1/co_l6/ultra/COR_ULTRA_L6_${hist}.txt"
              elif [ "${{ matrix.material }}" = "B05" ] && [ "$route" = "COR8" ]; then
                cmp "/tmp/cost1/${route}_${hist}_o0.txt" "/tmp/cost1/co_r8/ultra/COR_ULTRA_R8_${hist}.txt"
              else
                cmp "/tmp/cost1/${route}_${hist}_o0.txt" "/tmp/cost1/cn/fine/COR_FINE_${member}_${hist}.txt"
              fi
            done
          done

          for opt in 0 2; do
            "/tmp/cost1/build_R16_o${opt}/rom0_test" > "/tmp/cost1/R16_o${opt}.txt" 2>&1
            grep -Fq 'F_ROMV2_D13_REF_EXECUTION_COMPLETE=PASS' "/tmp/cost1/R16_o${opt}.txt"
          done
          cmp /tmp/cost1/R16_o0.txt /tmp/cost1/R16_o2.txt
          cmp /tmp/cost1/R16_o0.txt "/tmp/cost1/cl/R16_${{ matrix.material }}_ultra.txt"

          python3 - <<'PY'
          import glob,json
          eq=glob.glob('COST1_EVIDENCE/equivalence/LR*_*.json')
          assert len(eq)==6,eq
          for p in eq:
              r=json.load(open(p)); assert r['pass'] is True and r['timing_authorized_for_route'] is True
              assert r['max_abs_water_ledger_cm']<=1e-10
          mats=glob.glob('COST1_EVIDENCE/equivalence/*BENCHMARK_MATERIALIZATION.json')
          assert len(mats)==2
          for p in mats:
              r=json.load(open(p))
              assert r['solver_or_physics_changed'] is False
              assert r['numerical_policy_changed'] is False
              assert r['validation_semantics_changed'] is False
          out={
            'schema':'swap5.layer-rom.cost1.equivalence-aggregate.v1',
            'material':'${{ matrix.material }}',
            'pass':True,
            'layer_rom_routes':6,
            'corichards_validation_identity':True,
            'R16_validation_identity':True,
            'timing_authorized':True,
            'production_rom_authorized':False
          }
          json.dump(out,open('COST1_EVIDENCE/LAYER_ROM_COST1_EQUIVALENCE.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          PY
          git -C canonical diff --quiet -- src reference
          echo 'LAYER_ROM_COST1_EQUIVALENCE_GATE=PASS'

      - name: Build frozen 10-route timing map
        run: |
          python3 - <<'PY'
          import json
          base=['LR4_BASE','LR6_BASE','LR8_BASE','LR4_FINE','LR6_FINE','LR8_FINE','COR4','COR6','COR8','R16']
          routes={}
          for r in base:
              if r.startswith('LR'):
                  variant='BASE' if r.endswith('_BASE') else 'FINE'
                  routes[r]={
                    'command':[f'/tmp/cost1/lr_{variant}_o2',r,'bench','{repeats}'],
                    'emitted_route':r
                  }
              else:
                  routes[r]={
                    'command':[f'/tmp/cost1/build_{r}_o2/rom0_test','bench','{repeats}',r],
                    'emitted_route':r
                  }
          json.dump({'base_order':base,'routes':routes},open('/tmp/cost1/routes.json','w'),indent=2,sort_keys=True)
          PY

      - name: Execute preregistered shared-host timing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          e=json.load(open('COST1_EVIDENCE/LAYER_ROM_COST1_EQUIVALENCE.json'))
          assert e['pass'] is True and e['timing_authorized'] is True
          print('LAYER_ROM_COST1_TIMING_GATE=PASS')
          PY
          python3 tests/rom/run_layer_rom_cost1_timing.py             --routes-json /tmp/cost1/routes.json             --output COST1_EVIDENCE/LAYER_ROM_COST1_TIMING.json             | tee COST1_EVIDENCE/timing.txt

      - name: Persist material result and evidence integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          material='${{ matrix.material }}'
          t=json.load(open('COST1_EVIDENCE/LAYER_ROM_COST1_TIMING.json'))
          e=json.load(open('COST1_EVIDENCE/LAYER_ROM_COST1_EQUIVALENCE.json'))
          assert t['decision']=='COST1_MATERIAL_SHARED_HOST_TIMING_COMPLETE'
          assert e['pass'] is True
          out=dict(t)
          out['schema']='swap5.layer-rom.cost1.material-result.v1'
          out['material']=material
          out['integrity']=e
          out['application_acceptance_adjudicated']=False
          out['formal_performance_claim']=False
          out['speed_claim_authorized']=False
          out['production_rom_authorized']=False
          json.dump(out,open(f'COST1_EVIDENCE/LAYER_ROM_COST1_{material}_RESULT.json','w'),indent=2,sort_keys=True)
          print(json.dumps({'material':material,'decision':out['decision'],'cost_ratios':out['cost_ratios']},sort_keys=True))
          PY
          sha256sum $(find COST1_EVIDENCE -type f | sort) > COST1_EVIDENCE/sha256.txt
          git diff --check 1caa431002d5c128c73cfcfbd31af4cc39ee9f12...HEAD
          echo 'LAYER_ROM_COST1_MATERIAL=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: layer-rom-cost1-${{ matrix.material }}
          path: COST1_EVIDENCE/
          if-no-files-found: error

  aggregate:
    needs: material
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: layer-rom-cost1-B*
          path: /tmp/cost1-results
          merge-multiple: false

      - name: Aggregate six-material shared-host screen
        run: |
          set -euo pipefail
          mkdir -p COST1_AGGREGATE
          python3 tests/rom/aggregate_layer_rom_cost1.py             --input-dir /tmp/cost1-results             --prereg integration/f-rom/LAYER_ROM_COST1_PREREGISTRATION.json             --fidelity integration/f-rom/LAYER_ROM_B1HCP_RESULT.json             --output COST1_AGGREGATE/LAYER_ROM_COST1_RESULT.json             | tee COST1_AGGREGATE/analyzer.txt
          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LAYER_ROM_COST1_PREREGISTRATION.json'))
          r=json.load(open('COST1_AGGREGATE/LAYER_ROM_COST1_RESULT.json'))
          assert r['decision']==p['decisions']['complete']
          assert r['application_acceptance_adjudicated'] is False
          assert r['formal_performance_claim'] is False
          assert r['speed_claim_authorized'] is False
          assert r['production_rom_authorized'] is False
          print('LAYER_ROM_COST1_AGGREGATE_GATE=PASS')
          PY
          sha256sum COST1_AGGREGATE/* > COST1_AGGREGATE/sha256.txt
          echo 'LAYER_ROM_COST1=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: layer-rom-cost1-aggregate
          path: COST1_AGGREGATE/
          if-no-files-found: error
