name: F-ROM Layer-ROM Phase A independent Reference

on:
  push:
    branches:
      - work/f-rom-layer-phase-a
    paths:
      - 'tests/rom/test_layer_rom_phase_a_reference.f90'
      - 'tests/rom/analyze_layer_rom_phase_a_reference.py'
      - 'tests/rom/analyze_layer_rom_phase_a_independent_state.py'
      - 'tests/rom/freeze_layer_rom_phase_a_pairs.py'
      - 'tests/rom/run_layer_rom_phase_a_reference.sh'
      - 'integration/f-rom/LAYER_ROM_PHASE_A_REFERENCE_*'
      - 'integration/f-rom/LAYER_ROM_PHASE_A_PREREGISTRATION.json'
      - 'integration/f-rom/LAYER_ROM_PHASE_A_STATE_RESPONSE_PREREGISTRATION.json'
      - '.github/workflows/f-rom-layer-phase-a-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install frozen state-analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Build and qualify preregistered independent Reference library
        run: bash tests/rom/run_layer_rom_phase_a_reference.sh
      - name: Upload Layer-ROM Phase A Reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-rom-phase-a-reference
          path: LAYER_ROM_PHASE_A_REFERENCE_EVIDENCE/
          if-no-files-found: warn
