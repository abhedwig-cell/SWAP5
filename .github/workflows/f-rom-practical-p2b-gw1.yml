name: F-ROM Practical P2B GW1 G6 challenge
on:
  push:
    branches: [work/f-rom-practical]
    paths:
      - integration/f-rom/ROM_PRACTICAL_P2B_GW1_PREREGISTRATION.json
      - tools/rom/run_rom_practical_p2b_gw_candidate.py
      - tools/rom/analyze_rom_practical_p2b_gw1.py
      - tools/rom/aggregate_rom_practical_p2b_gw1.py
      - .github/workflows/f-rom-practical-p2b-gw1.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: f-rom-practical-p2b-gw1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  material:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        material: [B02, B05, B06, B11, B12, B16]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Recover frozen purpose harnesses
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-rom-purpose
          mkdir -p ext evidence
          git show FETCH_HEAD:tests/rom/rom_purpose_p1_gw_source.f90 > ext/rom_purpose_p1_gw_source.f90
          git show FETCH_HEAD:tests/rom/materialize_rom_purpose_p3_gw_reference.py > ext/materialize_rom_purpose_p3_gw_reference.py
          git show FETCH_HEAD:tests/rom/rom_purpose_p1_base_b14_materializer.py > ext/rom_purpose_p1_base_b14_materializer.py
          git show FETCH_HEAD:tests/rom/rom_purpose_p1_base_c4z_materializer.py > ext/rom_purpose_p1_base_c4z_materializer.py
          git show FETCH_HEAD:tests/rom/rom_purpose_p1_layer_base.py > ext/rom_purpose_p1_layer_base.py
          test "$(git hash-object ext/rom_purpose_p1_gw_source.f90)" = "98b05fcf13fc470689295d511766f2393a712e46"
          test "$(git hash-object ext/materialize_rom_purpose_p3_gw_reference.py)" = "83dbec28cd92b76bc1e2a4ac704103622a5cab28"
          test "$(git hash-object ext/rom_purpose_p1_base_b14_materializer.py)" = "f4f666d3504568d084d1d5ca3f90008ab6af2df9"
          test "$(git hash-object ext/rom_purpose_p1_base_c4z_materializer.py)" = "105e75b93425780f565c714de1be1cb7ae0ee767"
          test "$(git hash-object ext/rom_purpose_p1_layer_base.py)" = "33a68fc51d5c1905b9f377e2d14626aeebe27f98"
          python3 -m pip install --disable-pip-version-check numpy
      - name: Run G6 candidate
        run: |
          python3 tools/rom/run_rom_practical_p2b_gw_candidate.py --purpose GW_LB --material "${{ matrix.material }}" --member G6 --materials integration/f-rom/ROM_PRACTICAL_P2A_MATERIALS.json --base ext/rom_purpose_p1_layer_base.py --output evidence/candidate.json
      - name: Materialize Reference
        run: |
          python3 tools/rom/materialize_rom_practical_p2a_reference.py --purpose GW_LB --material "${{ matrix.material }}" --materials integration/f-rom/ROM_PRACTICAL_P2A_MATERIALS.json --gw-source ext/rom_purpose_p1_gw_source.f90 --gw-materializer ext/materialize_rom_purpose_p3_gw_reference.py --c5a-materializer ext/rom_purpose_p1_base_b14_materializer.py --c4z-materializer ext/rom_purpose_p1_base_c4z_materializer.py --output canonical/tests/rom/test_p2b_ref.f90 --manifest evidence/reference_materialization.json
      - name: Build and run Reference
        run: |
          set -euo pipefail
          for nodes in 128 256; do
            dz="$(python3 -c "print(160.0/$nodes)")"
            stub="p2b_r${nodes}_o2_stubs.f90"
            python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90 --output "canonical/$stub" --nodes "$nodes" --dz-cm "$dz"
            python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py --root canonical --stub "$stub" --target tests/rom/test_p2b_ref.f90 --external-source src/legacy/b1_10_port/headcalc.f90 --build "/tmp/p2b_r${nodes}_o2" --opt 2
          done
          /tmp/p2b_r128_o2/rom0_test > evidence/r128.txt 2>&1
          /usr/bin/time -f '{"wall":"%e","user":"%U","sys":"%S"}' -o evidence/r256_timing.json /tmp/p2b_r256_o2/rom0_test > evidence/r256.txt 2>&1
      - name: Analyze G6 against Reference and G4
        run: |
          python3 tools/rom/analyze_rom_practical_p2a.py --purpose GW_LB --material "${{ matrix.material }}" --candidate evidence/candidate.json --r128 evidence/r128.txt --r256 evidence/r256.txt --r256-timing evidence/r256_timing.json --output evidence/g6_case.json
          python3 tools/rom/analyze_rom_practical_p2b_gw1.py --material "${{ matrix.material }}" --g6-case evidence/g6_case.json --p2a-result integration/f-rom/ROM_PRACTICAL_P2A_RESULT.json --output evidence/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rom-practical-p2b-gw1-${{ matrix.material }}
          path: evidence/result.json
          if-no-files-found: error
  aggregate:
    needs: material
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: rom-practical-p2b-gw1-*
          path: /tmp/gw1
          merge-multiple: false
      - run: python3 tools/rom/aggregate_rom_practical_p2b_gw1.py --input-dir /tmp/gw1 --output integration/f-rom/ROM_PRACTICAL_P2B_GW1_RESULT.json
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/ROM_PRACTICAL_P2B_GW1_RESULT.json
          git commit -m "ROM-PRACTICAL P2B-GW1: persist G6 challenge" || exit 0
          git push origin HEAD:work/f-rom-practical
