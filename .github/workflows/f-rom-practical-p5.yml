name: F-ROM Practical P5 robust fast policy
on:
  push:
    branches: [work/f-rom-practical]
    paths:
      - integration/f-rom/ROM_PRACTICAL_P5_PREREGISTRATION.json
      - tools/rom/qualify_rom_practical_p5.py
      - .github/workflows/f-rom-practical-p5.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rom-practical-p5-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  case:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        purpose: [SURF_P, GW_LB]
        material: [B02, B05, B06, B11, B12, B16]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 1
      - name: Bind frozen authority sources
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-rom-purpose
          mkdir -p ext evidence
          while read -r blob name; do
            git cat-file blob "$blob" > "ext/$name"
            test "$(git hash-object "ext/$name")" = "$blob"
          done <<'BLOBS'
          b2df7793d3f56f5d8d1d121636d2eb1a0952e271 rom_purpose_p1_surface_b01_source.f90
          98b05fcf13fc470689295d511766f2393a712e46 rom_purpose_p1_gw_source.f90
          31060946d233ba80e88ca42e43c90f512dc890de materialize_rom_purpose_p3_surface_reference.py
          83dbec28cd92b76bc1e2a4ac704103622a5cab28 materialize_rom_purpose_p3_gw_reference.py
          f4f666d3504568d084d1d5ca3f90008ab6af2df9 rom_purpose_p1_base_b14_materializer.py
          105e75b93425780f565c714de1be1cb7ae0ee767 rom_purpose_p1_base_c4z_materializer.py
          33a68fc51d5c1905b9f377e2d14626aeebe27f98 rom_purpose_p1_layer_base.py
          BLOBS
          test "$(git hash-object integration/f-rom/ROM_PRACTICAL_P2A_MATERIALS.json)" = b2d8885a9bb01b078a3510086c70945207ab0882
          test "$(git hash-object tools/rom/run_rom_practical_p3_candidate.py)" = 0021329e9aae426720adf87a1461311d764efab8
          test "$(git hash-object tools/rom/prepare_rom_practical_p3_reference.py)" = 548505a02ed74b61f9cbee4fd63812d7f9356cc5
          test "$(git hash-object tools/rom/rom_practical_p4_rk4.f90)" = 5f8f96300523fb8a1534b3cc2f1c159921c95a05
          test "$(git hash-object tools/rom/qualify_rom_practical_p4.py)" = 170f73c28ddc71b619757d1675aaedf4180410cf
          test "$(git hash-object tools/rom/qualify_rom_practical_p5.py)" = f2845eb8db5510a0a840c0def4211f0ee7eae296
          python3 -m pip install --disable-pip-version-check 'numpy==2.5.3'
      - name: Build frozen reduced implementation
        run: |
          gfortran -O2 -std=f2008 -Wall -Wextra -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow tools/rom/rom_practical_p4_rk4.f90 -o /tmp/p5_rk4
      - name: Materialize unchanged P3 Richards reference
        run: |
          set -euo pipefail
          python3 tools/rom/materialize_rom_practical_p2a_reference.py --purpose '${{ matrix.purpose }}' --material '${{ matrix.material }}' --materials integration/f-rom/ROM_PRACTICAL_P2A_MATERIALS.json --surface-source ext/rom_purpose_p1_surface_b01_source.f90 --surface-materializer ext/materialize_rom_purpose_p3_surface_reference.py --gw-source ext/rom_purpose_p1_gw_source.f90 --gw-materializer ext/materialize_rom_purpose_p3_gw_reference.py --c5a-materializer ext/rom_purpose_p1_base_b14_materializer.py --c4z-materializer ext/rom_purpose_p1_base_c4z_materializer.py --output /tmp/p5_base.f90 --manifest evidence/reference_materialization.json
          python3 tools/rom/prepare_rom_practical_p3_reference.py --purpose '${{ matrix.purpose }}' --source /tmp/p5_base.f90 --output canonical/tests/rom/test_p5_reference.f90
          for nodes in 64 128; do
            dz="$(python3 -c "print(160.0/$nodes)")"
            stub="p5_r${nodes}_stubs.f90"
            python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90 --output "canonical/$stub" --nodes "$nodes" --dz-cm "$dz"
            python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py --root canonical --stub "$stub" --target tests/rom/test_p5_reference.f90 --external-source src/legacy/b1_10_port/headcalc.f90 --build "/tmp/p5_r${nodes}" --opt 2
          done
      - name: Qualify P5 primary policy
        run: |
          python3 tools/rom/qualify_rom_practical_p5.py case --p4-qualifier tools/rom/qualify_rom_practical_p4.py --exe /tmp/p5_rk4 --reference64 /tmp/p5_r64/rom0_test --reference128 /tmp/p5_r128/rom0_test --materials integration/f-rom/ROM_PRACTICAL_P2A_MATERIALS.json --base ext/rom_purpose_p1_layer_base.py --p3-runner tools/rom/run_rom_practical_p3_candidate.py --p3-analyzer tools/rom/analyze_rom_practical_p3.py --purpose '${{ matrix.purpose }}' --material '${{ matrix.material }}' --outdir evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-practical-p5-${{ matrix.purpose }}-${{ matrix.material }}
          path: evidence/
          if-no-files-found: error
  aggregate:
    needs: case
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: rom-practical-p5-*
          path: /tmp/p5
      - name: Aggregate six-material primary policy
        run: |
          python3 tools/rom/qualify_rom_practical_p5.py aggregate --input-dir /tmp/p5 --output integration/f-rom/ROM_PRACTICAL_P5_RESULT.json
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration/f-rom/ROM_PRACTICAL_P5_RESULT.json
          git commit -m 'ROM-PRACTICAL P5: persist robust fast policy result' || exit 0
          git push origin HEAD:work/f-rom-practical
