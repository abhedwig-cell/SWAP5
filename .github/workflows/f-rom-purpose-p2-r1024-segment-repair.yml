      - name: Download completed authoritative source-run artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/original/full /tmp/original/s1 /tmp/original/s2 /tmp/original/s3 /tmp/original/s4
          gh run download "$SOURCE_RUN" --repo abhedwig-cell/SWAP5 -p 'p2full-*' -D /tmp/original/full
          gh run download "$SOURCE_RUN" --repo abhedwig-cell/SWAP5 -p 'p2seg1-*' -D /tmp/original/s1
          gh run download "$SOURCE_RUN" --repo abhedwig-cell/SWAP5 -p 'p2seg2-*' -D /tmp/original/s2
          gh run download "$SOURCE_RUN" --repo abhedwig-cell/SWAP5 -p 'p2seg3-*' -D /tmp/original/s3
          gh run download "$SOURCE_RUN" --repo abhedwig-cell/SWAP5 -p 'p2seg4-*' -D /tmp/original/s4
      - name: Assemble complete P2 route set with qualified R1024 repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/witness/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json'))
          assert w['qualified'] is True
          assert w['segmented_matches_full_scientific_output_exactly'] is True
          PY
          mkdir -p routes
          cat /tmp/t1/segment.txt /tmp/t2/segment.txt /tmp/t3/segment.txt /tmp/t4/segment.txt > /tmp/repaired_s05.txt
          test "$(grep -c '^LAREDYN0R_STATE|' /tmp/repaired_s05.txt)" -eq 32768
          test "$(grep -c '^LAREDYN0R_PROFILE|' /tmp/repaired_s05.txt)" -eq 16384
          for material in B01 B14; do
            for route in R512_T32 R1024_T32; do
              for opt in 0 2; do
                out="routes/surface_${material}_${route}_o${opt}.txt"; : > "$out"
                for i in 1 2 3 4; do
                  if [[ "$material" == B01 && "$route" == R1024_T32 && "$i" == 1 ]]; then
                    cat /tmp/repaired_s05.txt >> "$out"
                  else
                    src="$(find /tmp/original/full -type f -name "surface_${material}_${route}_o${opt}_h${i}.txt" -print -quit)"
                    test -n "$src"; cat "$src" >> "$out"
                  fi
                done
              done
            done
            for route in R2048_T32 R2048_T16 R2048_T8; do
              out0="routes/surface_${material}_${route}_o0.txt"; : > "$out0"
              for i in 1 2 3 4; do
                src="$(find /tmp/original/s1 -type f -path "*/p2seg1-${material}-${route}-h${i}/segment.txt" -print -quit)"
                test -n "$src"; cat "$src" >> "$out0"
                if [[ "$route" != R2048_T8 ]]; then
                  src="$(find /tmp/original/s2 -type f -path "*/p2seg2-${material}-${route}-h${i}/segment.txt" -print -quit)"
                  test -n "$src"; cat "$src" >> "$out0"
                fi
                if [[ "$route" == R2048_T32 ]]; then
                  src="$(find /tmp/original/s3 -type f -path "*/p2seg3-${material}-R2048_T32-h${i}/segment.txt" -print -quit)"
                  test -n "$src"; cat "$src" >> "$out0"
                  src="$(find /tmp/original/s4 -type f -path "*/p2seg4-${material}-R2048_T32-h${i}/segment.txt" -print -quit)"
                  test -n "$src"; cat "$src" >> "$out0"
                fi
              done
              cp "$out0" "routes/surface_${material}_${route}_o2.txt"
            done
            for route in R512_T32 R1024_T32 R2048_T32 R2048_T16 R2048_T8; do
              cmp "routes/surface_${material}_${route}_o0.txt" "routes/surface_${material}_${route}_o2.txt"
              case "$route" in *_T32) factor=32;; *_T16) factor=16;; *) factor=8;; esac
              test "$(grep -c '^LAREDYN0R_STATE|' "routes/surface_${material}_${route}_o0.txt")" -eq $((4*1024*factor))
              test "$(grep -c '^LAREDYN0R_PROFILE|' "routes/surface_${material}_${route}_o0.txt")" -eq $((4*1024*16))
            done
          done
          sha256sum routes/* > routes/sha256.txt
      - name: Apply unchanged frozen P2 Reference analyzer
        run: |
          set -euo pipefail
          mkdir -p P2_REFERENCE_EVIDENCE
          set +e
          python3 tests/rom/analyze_rom_purpose_p2_reference.py             --prereg integration/f-rom/ROM_PURPOSE_P2_PREREGISTRATION.json             --p1-reference integration/f-rom/ROM_PURPOSE_P1_REFERENCE_RESULT.json             --root routes             --output P2_REFERENCE_EVIDENCE/ROM_PURPOSE_P2_REFERENCE_RESULT.json             | tee P2_REFERENCE_EVIDENCE/runner.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 3
          cp /tmp/witness/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json P2_REFERENCE_EVIDENCE/
          cp integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_REPAIR_PREREGISTRATION.json P2_REFERENCE_EVIDENCE/
          cp integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_REPAIR_BINDING.json P2_REFERENCE_EVIDENCE/
          cp routes/sha256.txt P2_REFERENCE_EVIDENCE/routes-sha256.txt
          sha256sum P2_REFERENCE_EVIDENCE/* > P2_REFERENCE_EVIDENCE/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rom-purpose-p2-reference-r1024-repair
          path: P2_REFERENCE_EVIDENCE/
          if-no-files-found: error

  persist:
    needs: analyze
    runs-on: ubuntu-latest
    env:
      REPAIR_RUN: ${{ github.run_id }}
      REPAIR_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: work/f-rom-purpose, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: rom-purpose-p2-reference-r1024-repair, path: /tmp/evidence}
      - name: Persist P2 Reference decision
        run: |
          set -euo pipefail
          git pull --ff-only origin work/f-rom-purpose
          cp /tmp/evidence/ROM_PURPOSE_P2_REFERENCE_RESULT.json integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json
          cp /tmp/evidence/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json
          python3 - <<'PY'
          import json,os,pathlib
          r=json.load(open('integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json'))
          e=json.load(open('integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json'))
          assert e['qualified'] is True
          q=bool(r['candidate_response_authorized'])
          s=json.load(open('integration/f-rom/ROM_PURPOSE_P2_STATUS.json'))
          s.update({
            'tested':True,
            'qualified':q,
            'phase':'P2_REFERENCE_QUALIFIED' if q else 'P2_REFERENCE_SCIENTIFICALLY_NOT_QUALIFIED',
            'fresh_surface_reference_status':r['status'],
            'candidate_response_authorized':q,
            'candidate_response_generated':False,
            'blockers':[] if q else ['P2_FRESH_SURFACE_REFERENCE_QUALIFICATION_FAILED'],
            'next_action':'BIND_P2_FROZEN_CANDIDATE_MATRIX' if q else 'STOP_BEFORE_CANDIDATES_P2_REFERENCE_BLOCKER',
            'recovery_point':'integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json',
            'source_workflow_run':int(os.environ['REPAIR_RUN']),
            'last_execution_sha':os.environ['REPAIR_SHA'],
            'reference_execution_repair':'R1024_SEGMENT_EQUIVALENCE_WITNESS_THEN_S05_SEGMENT_REPAIR'
          })
          s['scientific_firewall']['any_P2_reference_response_seen']=True
          pathlib.Path('integration/f-rom/ROM_PURPOSE_P2_STATUS.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          a=json.load(open('integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RUN_AUTHORITY.json'))
          a['authoritative_execution'].update({
            'status':'CLOSED_BY_QUALIFIED_R1024_SEGMENT_REPAIR',
            'segment_repair_run':int(os.environ['REPAIR_RUN']),
            'segment_repair_execution_head':os.environ['REPAIR_SHA']
          })
          a['r1024_segment_repair']={
            'source_run':35821534912,
            'witness_case':'B01/R1024_T32/S06',
            'target_case':'B01/R1024_T32/S05',
            'equivalence_qualified':True,
            'scientific_change':False,
            'equivalence_record':'integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json'
          }
          pathlib.Path('integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RUN_AUTHORITY.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          lines=[
            '# ROM-PURPOSE P2 Reference closeout','',
            'P1 remains fail-closed and is not reclassified.','',
            f"**{r['status']}**",'',
            f"Candidate response authorized: **{str(q).lower()}**.",'',
            'The blocked B01/R1024_T32/S05 monolithic route was recovered only after an independent S06 witness proved exact hydrologic equivalence between full and four-segment R1024 execution. Only local REV bookkeeping was excluded from the equality comparison.','',
            'The frozen P2 observability analyzer was not changed by the repair.'
          ]
          pathlib.Path('docs/science/F-ROM_PURPOSE_P2_REFERENCE_CLOSEOUT.md').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json                   integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json                   integration/f-rom/ROM_PURPOSE_P2_STATUS.json                   integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RUN_AUTHORITY.json                   docs/science/F-ROM_PURPOSE_P2_REFERENCE_CLOSEOUT.md
          git commit -m "ROM-PURPOSE P2: persist R1024-repaired Reference qualification" || exit 0
          git push origin HEAD:work/f-rom-purpose
