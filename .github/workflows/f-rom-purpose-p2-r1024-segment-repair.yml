      - uses: actions/download-artifact@v4
        with: {name: p2-r1024-witness-s4, path: /tmp/w4}
      - name: Fetch full S06 witness and prove exact scientific equivalence
        run: |
          set -euo pipefail
          mkdir -p /tmp/full-o0 /tmp/full-o2 evidence
          gh run download "$SOURCE_RUN" --repo abhedwig-cell/SWAP5             -n p2full-B01-R1024_T32-o0-h2 -D /tmp/full-o0
          gh run download "$SOURCE_RUN" --repo abhedwig-cell/SWAP5             -n p2full-B01-R1024_T32-o2-h2 -D /tmp/full-o2
          python3 tests/rom/verify_rom_purpose_p2_r1024_segment_equivalence.py             --full-o0 /tmp/full-o0/surface_B01_R1024_T32_o0_h2.txt             --full-o2 /tmp/full-o2/surface_B01_R1024_T32_o2_h2.txt             --segments /tmp/w1/segment.txt /tmp/w2/segment.txt /tmp/w3/segment.txt /tmp/w4/segment.txt             --output evidence/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json
          python3 - <<'PY'
          import json
          r=json.load(open('evidence/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json'))
          assert r['qualified'] is True
          assert r['segmented_matches_full_scientific_output_exactly'] is True
          assert r['full_O0_O2_raw_byte_identity'] is True
          PY
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with: {name: p2-r1024-equivalence-witness, path: evidence/, if-no-files-found: error}

