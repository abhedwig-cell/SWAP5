  verify_witness:
    needs: witness_s4
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: p2-r1024-witness-s1, path: /tmp/w1}
      - uses: actions/download-artifact@v4
        with: {name: p2-r1024-witness-s2, path: /tmp/w2}
      - uses: actions/download-artifact@v4
