            python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py               --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90               --output "$stub" --nodes 1024 --dz-cm 0.15625
            build="/tmp/p2r1024_w2_o${opt}"
            python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py               --root canonical --stub "p2r1024_w2_o${opt}_stubs.f90"               --target tests/rom/test_p2seg.f90               --external-source src/legacy/b1_10_port/headcalc.f90 --build "$build" --opt "$opt"
            ROMPURP_P2_CHECKPOINT_IN=previous/checkpoint.bin               ROMPURP_P2_CHECKPOINT_OUT="evidence/checkpoint_o${opt}.bin"               LARE_DYN0A_CASE_FILTER=S06 "$build/rom0_test" > "evidence/segment_o${opt}.txt" 2>&1
          done
          cmp evidence/segment_o0.txt evidence/segment_o2.txt
          cmp evidence/checkpoint_o0.bin evidence/checkpoint_o2.bin
          mv evidence/segment_o0.txt evidence/segment.txt
          mv evidence/checkpoint_o0.bin evidence/checkpoint.bin
          rm evidence/segment_o2.txt evidence/checkpoint_o2.bin
          cp /tmp/manifest.json evidence/
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
