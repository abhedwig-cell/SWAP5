name: F-ROM-PURPOSE P2 R1024 segmented recovery

on:
  push:
    branches:
      - work/f-rom-purpose
    paths:
      - 'integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENTED_RECOVERY_BINDING.json'

concurrency:
  group: f-rom-purpose-p2-r1024-segmented-recovery
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Verify segmented recovery authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5"
          python3 -m py_compile             tests/rom/materialize_rom_purpose_p2_surface_reference.py             tests/rom/materialize_rom_purpose_p2_surface_reference_segment.py             tests/rom/verify_rom_purpose_p2_r1024_segment_equivalence.py             tests/rom/analyze_rom_purpose_p2_reference.py
          python3 - <<'PY'
          import json,subprocess,pathlib
          b=json.load(open('integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENTED_RECOVERY_BINDING.json'))
          assert b['status']=='BOUND_BEFORE_SEGMENTED_WITNESS_RESPONSE'
          assert b['source_run']==35821534912
          assert b['witness_history']=='S06'
          assert b['target_history']=='S05'
          assert b['segment_model_steps']==8192
          assert b['scientific_change'] is False
          assert not pathlib.Path('integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json').exists()
          for path,expected in b['blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY

  witness_s1:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Witness S06 segment 1
        run: |
          set -euo pipefail
          target=canonical/tests/rom/test_p2seg.f90
          python3 tests/rom/materialize_rom_purpose_p2_surface_reference_segment.py             --base-materializer tests/rom/materialize_rom_purpose_p2_surface_reference.py             --source tests/rom/rom_purpose_p1_surface_b01_source.f90             --material B01 --temporal-factor 32 --segment-start 1 --segment-end 8192             --output "$target" --manifest /tmp/manifest.json
          mkdir -p evidence
          for opt in 0 2; do
            stub="canonical/p2r1024_w1_o${opt}_stubs.f90"
            python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py               --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90               --output "$stub" --nodes 1024 --dz-cm 0.15625
            build="/tmp/p2r1024_w1_o${opt}"
            python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py               --root canonical --stub "p2r1024_w1_o${opt}_stubs.f90"               --target tests/rom/test_p2seg.f90               --external-source src/legacy/b1_10_port/headcalc.f90               --build "$build" --opt "$opt"
            ROMPURP_P2_CHECKPOINT_OUT="evidence/checkpoint_o${opt}.bin"               LARE_DYN0A_CASE_FILTER=S06 "$build/rom0_test" > "evidence/segment_o${opt}.txt" 2>&1
          done
          cmp evidence/segment_o0.txt evidence/segment_o2.txt
          cmp evidence/checkpoint_o0.bin evidence/checkpoint_o2.bin
          mv evidence/segment_o0.txt evidence/segment.txt
          mv evidence/checkpoint_o0.bin evidence/checkpoint.bin
          rm evidence/segment_o2.txt evidence/checkpoint_o2.bin
          cp /tmp/manifest.json evidence/
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p2r1024-witness-s1
          path: evidence/
          if-no-files-found: error

  witness_s2:
    needs: witness_s1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
