  assemble_analyze:
    needs: target_s4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 -m pip install --disable-pip-version-check numpy
      - uses: actions/download-artifact@v4
        with: {name: p2r1024-target-s1, path: /tmp/t1}
      - uses: actions/download-artifact@v4
        with: {name: p2r1024-target-s2, path: /tmp/t2}
      - uses: actions/download-artifact@v4
