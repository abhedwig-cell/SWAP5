      - name: Download completed authoritative source artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/src/full /tmp/src/s1 /tmp/src/s2 /tmp/src/s3 /tmp/src/s4
          gh run download 35821534912 --repo abhedwig-cell/SWAP5 -p 'p2full-*' -D /tmp/src/full
          gh run download 35821534912 --repo abhedwig-cell/SWAP5 -p 'p2seg1-*' -D /tmp/src/s1
          gh run download 35821534912 --repo abhedwig-cell/SWAP5 -p 'p2seg2-*' -D /tmp/src/s2
          gh run download 35821534912 --repo abhedwig-cell/SWAP5 -p 'p2seg3-*' -D /tmp/src/s3
          gh run download 35821534912 --repo abhedwig-cell/SWAP5 -p 'p2seg4-*' -D /tmp/src/s4
      - name: Assemble complete P2 Reference routes
        run: |
          set -euo pipefail
          cat /tmp/t1/segment.txt /tmp/t2/segment.txt /tmp/t3/segment.txt /tmp/t4/segment.txt > /tmp/s05_segmented.txt
          test "$(grep -c '^LAREDYN0R_STATE|' /tmp/s05_segmented.txt)" -eq 32768
          test "$(grep -c '^LAREDYN0R_PROFILE|' /tmp/s05_segmented.txt)" -eq 16384
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/witness/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json'))
          assert w['qualified'] is True
          assert w['segmented_matches_full_scientific_output_exactly'] is True
          PY
          mkdir -p routes
          for material in B01 B14; do
            for route in R512_T32 R1024_T32; do
              for opt in 0 2; do
                out="routes/surface_${material}_${route}_o${opt}.txt"; : > "$out"
                for i in 1 2 3 4; do
                  if [[ "$material" == B01 && "$route" == R1024_T32 && "$i" == 1 ]]; then
                    cat /tmp/s05_segmented.txt >> "$out"
                  else
                    src="$(find /tmp/src/full -type f -name "surface_${material}_${route}_o${opt}_h${i}.txt" -print -quit)"
                    test -n "$src"; cat "$src" >> "$out"
                  fi
                done
              done
            done
            for route in R2048_T32 R2048_T16 R2048_T8; do
              out0="routes/surface_${material}_${route}_o0.txt"; : > "$out0"
              for i in 1 2 3 4; do
                src="$(find /tmp/src/s1 -type f -path "*/p2seg1-${material}-${route}-h${i}/segment.txt" -print -quit)"
                test -n "$src"; cat "$src" >> "$out0"
                if [[ "$route" != R2048_T8 ]]; then
                  src="$(find /tmp/src/s2 -type f -path "*/p2seg2-${material}-${route}-h${i}/segment.txt" -print -quit)"
                  test -n "$src"; cat "$src" >> "$out0"
                fi
                if [[ "$route" == R2048_T32 ]]; then
                  src="$(find /tmp/src/s3 -type f -path "*/p2seg3-${material}-R2048_T32-h${i}/segment.txt" -print -quit)"
                  test -n "$src"; cat "$src" >> "$out0"
                  src="$(find /tmp/src/s4 -type f -path "*/p2seg4-${material}-R2048_T32-h${i}/segment.txt" -print -quit)"
                  test -n "$src"; cat "$src" >> "$out0"
                fi
              done
              cp "$out0" "routes/surface_${material}_${route}_o2.txt"
            done
            for route in R512_T32 R1024_T32 R2048_T32 R2048_T16 R2048_T8; do
              cmp "routes/surface_${material}_${route}_o0.txt" "routes/surface_${material}_${route}_o2.txt"
              case "$route" in *_T32) factor=32;; *_T16) factor=16;; *) factor=8;; esac
              test "$(grep -c '^LAREDYN0R_STATE|' "routes/surface_${material}_${route}_o0.txt")" -eq $((4*1024*factor))
              test "$(grep -c '^LAREDYN0R_PROFILE|' "routes/surface_${material}_${route}_o0.txt")" -eq $((4*1024*16))
            done
          done
          sha256sum routes/* > routes/sha256.txt
      - name: Execute unchanged frozen P2 analyzer
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          python3 tests/rom/analyze_rom_purpose_p2_reference.py             --prereg integration/f-rom/ROM_PURPOSE_P2_PREREGISTRATION.json             --p1-reference integration/f-rom/ROM_PURPOSE_P1_REFERENCE_RESULT.json             --root routes             --output evidence/ROM_PURPOSE_P2_REFERENCE_RESULT.json             | tee evidence/runner.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 3
          cp /tmp/witness/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json evidence/
          cp integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENTED_RECOVERY_BINDING.json evidence/
          cp routes/sha256.txt evidence/routes-sha256.txt
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rom-purpose-p2-reference-segmented-recovery
          path: evidence/
          if-no-files-found: error

  persist:
    needs: assemble_analyze
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN: ${{ github.run_id }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-rom-purpose
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rom-purpose-p2-reference-segmented-recovery
          path: /tmp/evidence
      - name: Persist segmented-recovery Reference result
        run: |
          set -euo pipefail
          git pull --ff-only origin work/f-rom-purpose
          cp /tmp/evidence/ROM_PURPOSE_P2_REFERENCE_RESULT.json integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json
          cp /tmp/evidence/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json
          python3 - <<'PY'
          import json,os,pathlib
          r=json.load(open('integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json'))
          w=json.load(open('integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json'))
          assert w['qualified'] is True
          q=bool(r['candidate_response_authorized'])
          s=json.load(open('integration/f-rom/ROM_PURPOSE_P2_STATUS.json'))
          s.update({
            'tested':True,
            'qualified':q,
            'phase':'P2_REFERENCE_QUALIFIED' if q else 'P2_REFERENCE_SCIENTIFICALLY_NOT_QUALIFIED',
            'fresh_surface_reference_status':r['status'],
            'candidate_response_authorized':q,
            'candidate_response_generated':False,
            'blockers':[] if q else ['P2_FRESH_SURFACE_REFERENCE_QUALIFICATION_FAILED'],
            'next_action':'BIND_P2_FROZEN_CANDIDATE_MATRIX' if q else 'STOP_BEFORE_CANDIDATES_P2_REFERENCE_BLOCKER',
            'recovery_point':'integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json',
            'source_workflow_run':int(os.environ['SOURCE_RUN']),
            'last_execution_sha':os.environ['SOURCE_SHA'],
            'R1024_S05_execution_topology':'SEGMENTED_AFTER_EXACT_S06_EQUIVALENCE_WITNESS'
          })
          s['scientific_firewall']['any_P2_reference_response_seen']=True
          pathlib.Path('integration/f-rom/ROM_PURPOSE_P2_STATUS.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          a=json.load(open('integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RUN_AUTHORITY.json'))
          a['authoritative_execution'].update({
            'status':'CLOSED_BY_QUALIFIED_R1024_SEGMENTED_RECOVERY',
            'segmented_recovery_run':int(os.environ['SOURCE_RUN']),
            'segmented_recovery_execution_head':os.environ['SOURCE_SHA']
          })
          a['R1024_segmented_recovery']={
            'source_run':35821534912,
            'failed_complete_history_jobs':['B01/R1024_T32/S05/O0','B01/R1024_T32/S05/O2'],
            'failure_class':'HOSTED_RUNNER_SHUTDOWN_EXIT_143',
            'witness':'B01/R1024_T32/S06',
            'witness_exact_scientific_equivalence':True,
            'ignored_nonhydrologic_field':['REV'],
            'segment_model_steps':8192,
            'scientific_change':False
          }
          pathlib.Path('integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RUN_AUTHORITY.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RESULT.json                   integration/f-rom/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json                   integration/f-rom/ROM_PURPOSE_P2_STATUS.json                   integration/f-rom/ROM_PURPOSE_P2_REFERENCE_RUN_AUTHORITY.json
          git commit -m "ROM-PURPOSE P2: persist segmented-recovery Reference qualification" || exit 0
          git push origin HEAD:work/f-rom-purpose
