          set -euo pipefail
          mkdir -p witness
          python3 tests/rom/verify_rom_purpose_p2_r1024_segment_equivalence.py             --full-o0 /tmp/full_o0/surface_B01_R1024_T32_o0_h2.txt             --full-o2 /tmp/full_o2/surface_B01_R1024_T32_o2_h2.txt             --segments /tmp/w1/segment.txt /tmp/w2/segment.txt /tmp/w3/segment.txt /tmp/w4/segment.txt             --output witness/ROM_PURPOSE_P2_R1024_SEGMENT_EQUIVALENCE.json
