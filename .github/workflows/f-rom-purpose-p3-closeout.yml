name: F-ROM-PURPOSE P3 deterministic closeout

on:
  push:
    branches: [work/f-rom-purpose]
    paths:
      - 'integration/f-rom/ROM_PURPOSE_P3_CLOSEOUT_EXECUTION_BINDING.json'

concurrency:
  group: f-rom-purpose-p3-closeout
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify closeout authority
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rom/build_rom_purpose_p3_closeout.py
          python3 - <<'PY'
          import json,subprocess,pathlib
          b=json.load(open('integration/f-rom/ROM_PURPOSE_P3_CLOSEOUT_EXECUTION_BINDING.json'))
          s=json.load(open('integration/f-rom/ROM_PURPOSE_P3_STATE_COUNT_RESULT.json'))
          assert b['status']=='BOUND_AFTER_P3_SCIENTIFIC_DECISIONS'
          if s['same_partition_richards_triggers']:
              assert pathlib.Path('integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_RESULT.json').exists()
          for path,expected in b['blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY
      - name: Build frozen P3 purpose map and closeout
        run: |
          set -euo pipefail
          same_arg=()
          if python3 - <<'PY'
          import json,sys
          s=json.load(open('integration/f-rom/ROM_PURPOSE_P3_STATE_COUNT_RESULT.json'))
          sys.exit(0 if s['same_partition_richards_triggers'] else 1)
          PY
          then
            same_arg=(--same-partition-result integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_RESULT.json)
          fi
          python3 tests/rom/build_rom_purpose_p3_closeout.py             --prereg integration/f-rom/ROM_PURPOSE_P3_PREREGISTRATION.json             --state-count-result integration/f-rom/ROM_PURPOSE_P3_STATE_COUNT_RESULT.json             "${same_arg[@]}"             --purpose-map-output integration/f-rom/ROM_PURPOSE_P3_PURPOSE_MAP.json             --closeout-output integration/f-rom/ROM_PURPOSE_P3_CLOSEOUT.json             --markdown-output docs/science/F-ROM_PURPOSE_P3_CLOSEOUT.md
      - name: Persist closeout
        env:
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git pull --ff-only origin work/f-rom-purpose
          python3 - <<'PY'
          import json,os,pathlib
          close=json.load(open('integration/f-rom/ROM_PURPOSE_P3_CLOSEOUT.json'))
          p=pathlib.Path('integration/f-rom/ROM_PURPOSE_P3_STATUS.json')
          s=json.load(open(p))
          s.update({
            'status':close['status'],
            'current_gate':'P3_CLOSED',
            'purpose_map':'integration/f-rom/ROM_PURPOSE_P3_PURPOSE_MAP.json',
            'closeout':'integration/f-rom/ROM_PURPOSE_P3_CLOSEOUT.json',
            'closeout_source_workflow_run':int(os.environ['SOURCE_RUN']),
            'closeout_execution_sha':os.environ['SOURCE_SHA'],
            'candidate_response_authorized':False,
            'next_actions':[]
          })
          s['scientific_firewall']['closure_research_open']=False
          s['scientific_firewall']['new_closure_family_authorized']=False
          s['scientific_firewall']['production_rom_authorized']=False
          p.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/ROM_PURPOSE_P3_PURPOSE_MAP.json                   integration/f-rom/ROM_PURPOSE_P3_CLOSEOUT.json                   integration/f-rom/ROM_PURPOSE_P3_STATUS.json                   docs/science/F-ROM_PURPOSE_P3_CLOSEOUT.md
          git commit -m "ROM-PURPOSE P3: persist purpose map and closeout" || exit 0
          git push origin HEAD:work/f-rom-purpose
