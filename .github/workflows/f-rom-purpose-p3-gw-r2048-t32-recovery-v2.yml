name: F-ROM-PURPOSE P3 GW R2048 T32 recovery v2

on:
  push:
    branches: [work/f-rom-purpose]
    paths:
      - 'integration/f-rom/ROM_PURPOSE_P3_GW_R2048_T32_RECOVERY_V2_BINDING.json'

concurrency:
  group: f-rom-purpose-p3-gw-r2048-t32-recovery-v2
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Verify v2 recovery authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5"
          python3 -m py_compile             tests/rom/materialize_rom_purpose_p1_gw_reference_segment.py             tests/rom/run_rom_purpose_p3_gw_r2048_t32_segment.py             tests/rom/assemble_rom_purpose_p3_gw_r2048_t32_recovery_v2.py
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/ROM_PURPOSE_P3_GW_R2048_T32_RECOVERY_V2_BINDING.json'))
          r=json.load(open('integration/f-rom/ROM_PURPOSE_P3_GW_R2048_T32_EXECUTION_REPAIR.json'))
          assert b['status']=='BOUND_PROVEN_8192_STEP_SEGMENT_TOPOLOGY'
          assert r['scientific_effect']=='NONE'
          assert b['segment_steps']==8192
          for path,expected in b['blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY

  segment1:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        material: [B01, B14]
        opt: [0, 2]
        history: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Execute segment 1
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p3_gw_r2048_t32_segment.py             --material "${{ matrix.material }}" --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}" --segment 1             --canonical-root canonical --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3gwt32seg1-${{ matrix.material }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  segment2:
    needs: segment1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        material: [B01, B14]
        opt: [0, 2]
        history: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: p3gwt32seg1-${{ matrix.material }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: previous
      - name: Execute segment 2
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p3_gw_r2048_t32_segment.py             --material "${{ matrix.material }}" --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}" --segment 2             --checkpoint-in previous/checkpoint.bin             --canonical-root canonical --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3gwt32seg2-${{ matrix.material }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  segment3:
    needs: segment2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        material: [B01, B14]
        opt: [0, 2]
        history: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: p3gwt32seg2-${{ matrix.material }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: previous
      - name: Execute segment 3
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p3_gw_r2048_t32_segment.py             --material "${{ matrix.material }}" --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}" --segment 3             --checkpoint-in previous/checkpoint.bin             --canonical-root canonical --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3gwt32seg3-${{ matrix.material }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  segment4:
    needs: segment3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        material: [B01, B14]
        opt: [0, 2]
        history: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: p3gwt32seg3-${{ matrix.material }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: previous
      - name: Execute segment 4
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p3_gw_r2048_t32_segment.py             --material "${{ matrix.material }}" --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}" --segment 4             --checkpoint-in previous/checkpoint.bin             --canonical-root canonical --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3gwt32seg4-${{ matrix.material }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  assemble:
    needs: segment4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: p3gwt32seg1-*
          path: /tmp/s1
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: p3gwt32seg2-*
          path: /tmp/s2
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: p3gwt32seg3-*
          path: /tmp/s3
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: p3gwt32seg4-*
          path: /tmp/s4
          merge-multiple: false
      - name: Assemble authoritative R2048 T32 routes
        run: |
          set -euo pipefail
          mkdir -p routes
          python3 tests/rom/assemble_rom_purpose_p3_gw_r2048_t32_recovery_v2.py             --segment1-root /tmp/s1 --segment2-root /tmp/s2             --segment3-root /tmp/s3 --segment4-root /tmp/s4             --output-dir routes
          sha256sum routes/* > routes/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3gw-r2048-t32-routes
          path: routes/
          if-no-files-found: error
