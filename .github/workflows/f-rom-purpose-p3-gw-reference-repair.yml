name: F-ROM-PURPOSE P3 repaired groundwater Reference

on:
  push:
    branches: [work/f-rom-purpose]
    paths:
      - 'integration/f-rom/ROM_PURPOSE_P3_GW_REFERENCE_REPAIR_BINDING.json'

concurrency:
  group: f-rom-purpose-p3-gw-reference-repair
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Verify frozen repair authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5"
          python3 -m py_compile             tests/rom/materialize_rom_purpose_p3_gw_reference.py             tests/rom/materialize_rom_purpose_p1_gw_reference_slice.py             tests/rom/run_rom_purpose_p3_gw_reference_slice.py             tests/rom/assemble_rom_purpose_p3_gw_reference_slices.py
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/ROM_PURPOSE_P3_GW_REFERENCE_REPAIR_BINDING.json'))
          p=json.load(open('integration/f-rom/ROM_PURPOSE_P3_PREREGISTRATION.json'))
          repair=json.load(open('integration/f-rom/ROM_PURPOSE_P3_REFERENCE_TECHNICAL_REPAIR.json'))
          assert b['status']=='BOUND_HISTORY_SLICE_REPAIR_AFTER_FAILED_RUN'
          assert p['phase']=='PREREGISTERED_BEFORE_ANY_NEW_P3_REFERENCE_OR_CANDIDATE_RESPONSE'
          assert repair['repair']['GW_LB']['scientific_effect']=='NONE'
          for path,expected in b['blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY

  slices:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        material: [B01, B14]
        route: [R512_T32, R1024_T32, R2048_T32, R2048_T16, R2048_T8]
        opt: [0, 2]
        history: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Execute one independent history
        run: |
          set -euo pipefail
          mkdir -p slice
          python3 tests/rom/run_rom_purpose_p3_gw_reference_slice.py             --material "${{ matrix.material }}"             --route "${{ matrix.route }}"             --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}"             --canonical-root canonical             --output-dir slice
          sha256sum slice/* > slice/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3gwfix-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: slice/
          if-no-files-found: error

  assemble:
    needs: slices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: p3gwfix-*
          path: /tmp/all
          merge-multiple: false
      - name: Assemble O0/O2-identical groundwater routes
        run: |
          set -euo pipefail
          mkdir -p routes
          python3 tests/rom/assemble_rom_purpose_p3_gw_reference_slices.py             --root /tmp/all             --output-dir routes
          sha256sum routes/* > routes/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3ref-gw-routes
          path: routes/
          if-no-files-found: error
