name: F-ROM-PURPOSE P3 terminal same-partition Richards

on:
  push:
    branches: [work/f-rom-purpose]
    paths:
      - 'integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_EXECUTION_BINDING.json'

concurrency:
  group: f-rom-purpose-p3-same-partition
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Verify frozen diagnostic authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5"
          python3 -m py_compile             tests/rom/materialize_rom_purpose_p3_same_partition_richards.py             tests/rom/run_rom_purpose_p3_same_partition_route.py             tests/rom/analyze_rom_purpose_p3_same_partition_richards.py
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_EXECUTION_BINDING.json'))
          s=json.load(open('integration/f-rom/ROM_PURPOSE_P3_STATE_COUNT_RESULT.json'))
          assert b['status']=='BOUND_AFTER_P3_STATE_COUNT_TRIGGER'
          assert len(s['same_partition_richards_triggers'])>0
          for path,expected in b['blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY

  routes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        purpose: [SURF_P, GW_LB]
        material: [B01, B14]
        factor: [8, 16, 32]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0
      - name: Execute route if triggered
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p3_same_partition_route.py             --purpose "${{ matrix.purpose }}"             --material "${{ matrix.material }}"             --factor "${{ matrix.factor }}"             --state-count-result integration/f-rom/ROM_PURPOSE_P3_STATE_COUNT_RESULT.json             --representation-ladder integration/f-rom/ROM_PURPOSE_P3_REPRESENTATION_LADDER.json             --canonical-root canonical             --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3same-${{ matrix.purpose }}-${{ matrix.material }}-T${{ matrix.factor }}
          path: evidence/
          if-no-files-found: error

  analyze:
    needs: routes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 -m pip install --disable-pip-version-check numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: p3same-*
          path: /tmp/same
          merge-multiple: true
      - name: Download frozen P3 Reference routes
        run: |
          set -euo pipefail
          surface_run="$(python3 -c "import json;print(json.load(open('integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_EXECUTION_BINDING.json'))['reference_runs']['SURF_P'])")"
          gw_run="$(python3 -c "import json;print(json.load(open('integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_EXECUTION_BINDING.json'))['reference_runs']['GW_LB'])")"
          mkdir -p /tmp/surface /tmp/gw /tmp/reference
          gh run download "$surface_run" --repo abhedwig-cell/SWAP5 -n p3ref-surface-routes -D /tmp/surface
          gh run download "$gw_run" --repo abhedwig-cell/SWAP5 -n p3ref-gw-routes -D /tmp/gw
          cp /tmp/surface/surface_* /tmp/reference/
          cp /tmp/gw/gw_* /tmp/reference/
      - name: Analyze frozen terminal diagnostic
        run: |
          set -euo pipefail
          mkdir -p result
          python3 tests/rom/analyze_rom_purpose_p3_same_partition_richards.py             --prereg integration/f-rom/ROM_PURPOSE_P3_PREREGISTRATION.json             --state-count-result integration/f-rom/ROM_PURPOSE_P3_STATE_COUNT_RESULT.json             --metric-contract integration/f-rom/ROM_PURPOSE_P1_METRIC_CONTRACT.json             --route-root /tmp/same             --reference-root /tmp/reference             --output result/ROM_PURPOSE_P3_SAME_PARTITION_RESULT.json             | tee result/runner.txt
          cp integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_EXECUTION_BINDING.json result/
          sha256sum result/* > result/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rom-purpose-p3-same-partition-result
          path: result/
          if-no-files-found: error

  persist:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-rom-purpose
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rom-purpose-p3-same-partition-result
          path: /tmp/result
      - name: Persist diagnostic
        env:
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git pull --ff-only origin work/f-rom-purpose
          cp /tmp/result/ROM_PURPOSE_P3_SAME_PARTITION_RESULT.json integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_RESULT.json
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('integration/f-rom/ROM_PURPOSE_P3_STATUS.json')
          s=json.load(open(p))
          s.update({
            'status':'P3_SAME_PARTITION_DIAGNOSTIC_COMPLETE',
            'current_gate':'P3_CLOSEOUT',
            'same_partition_result':'integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_RESULT.json',
            'same_partition_source_workflow_run':int(os.environ['SOURCE_RUN']),
            'same_partition_execution_sha':os.environ['SOURCE_SHA'],
            'next_actions':['Bind deterministic P3 closeout generation.']
          })
          s['scientific_firewall']['closure_research_open']=False
          s['scientific_firewall']['new_closure_family_authorized']=False
          p.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-rom/ROM_PURPOSE_P3_SAME_PARTITION_RESULT.json integration/f-rom/ROM_PURPOSE_P3_STATUS.json
          git commit -m "ROM-PURPOSE P3: persist terminal same-partition diagnostic" || exit 0
          git push origin HEAD:work/f-rom-purpose
