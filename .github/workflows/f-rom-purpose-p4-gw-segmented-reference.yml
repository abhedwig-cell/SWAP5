name: F-ROM-PURPOSE P4 segmented groundwater Reference

on:
  push:
    branches: [work/f-rom-purpose]
    paths:
      - 'integration/f-rom/ROM_PURPOSE_P4_GW_SEGMENTED_REFERENCE_BINDING.json'

concurrency:
  group: f-rom-purpose-p4-gw-segmented-reference
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5, path: canonical, fetch-depth: 0}
      - name: Verify P4 segmented GW authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5"
          python3 -m py_compile tests/rom/run_rom_purpose_p4_gw_segment.py tests/rom/assemble_rom_purpose_p4_gw_segmented_routes.py
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/ROM_PURPOSE_P4_GW_SEGMENTED_REFERENCE_BINDING.json'))
          p=json.load(open('integration/f-rom/ROM_PURPOSE_P4_PREREGISTRATION.json'))
          assert b['status']=='BOUND_TECHNICAL_TOPOLOGY_SUPERSESSION_BEFORE_REFERENCE_ADJUDICATION'
          assert p['phase']=='PREREGISTERED_BEFORE_ANY_P4_REFERENCE_LAYER_ROM_OR_MATCHED_RICHARDS_RESPONSE'
          for path,expected in b['blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY

  segment1:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        material: [B01,B14]
        route: [R512_T32,R1024_T32,R2048_T16,R2048_T8]
        opt: [0,2]
        history: [1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5, path: canonical, fetch-depth: 0}
      - run: |
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p4_gw_segment.py             --material "${{ matrix.material }}" --route "${{ matrix.route }}" --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}" --segment 1 --canonical-root canonical --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4gwseg1-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  segment2:
    needs: segment1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        material: [B01,B14]
        route: [R512_T32,R1024_T32,R2048_T16]
        opt: [0,2]
        history: [1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5, path: canonical, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: p4gwseg1-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: previous
      - run: |
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p4_gw_segment.py             --material "${{ matrix.material }}" --route "${{ matrix.route }}" --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}" --segment 2 --checkpoint-in previous/checkpoint.bin             --canonical-root canonical --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4gwseg2-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  segment3:
    needs: segment2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        material: [B01,B14]
        route: [R512_T32,R1024_T32]
        opt: [0,2]
        history: [1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5, path: canonical, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: p4gwseg2-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: previous
      - run: |
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p4_gw_segment.py             --material "${{ matrix.material }}" --route "${{ matrix.route }}" --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}" --segment 3 --checkpoint-in previous/checkpoint.bin             --canonical-root canonical --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4gwseg3-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  segment4:
    needs: segment3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        material: [B01,B14]
        route: [R512_T32,R1024_T32]
        opt: [0,2]
        history: [1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5, path: canonical, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: p4gwseg3-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: previous
      - run: |
          mkdir -p evidence
          python3 tests/rom/run_rom_purpose_p4_gw_segment.py             --material "${{ matrix.material }}" --route "${{ matrix.route }}" --opt "${{ matrix.opt }}"             --history "${{ matrix.history }}" --segment 4 --checkpoint-in previous/checkpoint.bin             --canonical-root canonical --output-dir evidence
          sha256sum evidence/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4gwseg4-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-h${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  assemble:
    needs: [segment1,segment2,segment3,segment4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: 'p4gwseg1-*', path: /tmp/s1, merge-multiple: false}
      - uses: actions/download-artifact@v4
        with: {pattern: 'p4gwseg2-*', path: /tmp/s2, merge-multiple: false}
      - uses: actions/download-artifact@v4
        with: {pattern: 'p4gwseg3-*', path: /tmp/s3, merge-multiple: false}
      - uses: actions/download-artifact@v4
        with: {pattern: 'p4gwseg4-*', path: /tmp/s4, merge-multiple: false}
      - run: |
          mkdir -p routes
          python3 tests/rom/assemble_rom_purpose_p4_gw_segmented_routes.py             --segment1-root /tmp/s1 --segment2-root /tmp/s2 --segment3-root /tmp/s3 --segment4-root /tmp/s4             --output-dir routes
          sha256sum routes/* > routes/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4ref-gw-segmented-routes
          path: routes/
          if-no-files-found: error
