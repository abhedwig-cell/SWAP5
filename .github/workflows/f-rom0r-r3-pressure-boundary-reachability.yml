name: F-ROM0R R3 prescribed-head reachability

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/F-ROM0R_R3_*'
      - 'integration/f-rom/F-ROM0TA4_STATUS.json'
      - 'integration/f-rom/F-ROM0TA5_STATUS.json'
      - 'tests/rom/test_f_rom0r_r3_pressure_boundary_reachability.f90'
      - 'tests/rom/analyze_f_rom0r_r3_pressure_boundary_reachability.py'
      - 'tests/rom/run_f_rom0r_r3_pressure_boundary_reachability.sh'
      - '.github/workflows/f-rom0r-r3-pressure-boundary-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f-rom0r-r3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute preregistered R3 pressure-boundary matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p F-ROM0R_R3_EVIDENCE
          F_ROM0R_R3_EVIDENCE_DIR="$PWD/F-ROM0R_R3_EVIDENCE"             bash tests/rom/run_f_rom0r_r3_pressure_boundary_reachability.sh | tee F-ROM0R_R3_EVIDENCE/gate.txt
      - name: Preserve R3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-rom0r-r3-${{ github.run_id }}
          path: F-ROM0R_R3_EVIDENCE
          if-no-files-found: warn
