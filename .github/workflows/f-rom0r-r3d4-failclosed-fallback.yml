name: F-ROM0R R3D4 fail-closed fallback

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/F-ROM0R_R3D4_*'
      - 'integration/f-rom/F-ROM0R_R3D3_STATUS.json'
      - 'docs/science/F-ROM0R_R3D4_*'
      - 'tests/rom/test_f_rom0r_r3d4_failclosed_fallback.f90'
      - 'tests/rom/analyze_f_rom0r_r3d4_failclosed_fallback.py'
      - 'tests/rom/run_f_rom0r_r3d4_failclosed_fallback.sh'
      - '.github/workflows/f-rom0r-r3d4-failclosed-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f-rom0r-r3d4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gfortran --version
      - name: Execute R3D4 fail-closed fallback qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p F-ROM0R_R3D4_EVIDENCE
          F_ROM0R_R3D4_EVIDENCE_DIR="$PWD/F-ROM0R_R3D4_EVIDENCE"             bash tests/rom/run_f_rom0r_r3d4_failclosed_fallback.sh | tee F-ROM0R_R3D4_EVIDENCE/gate.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-rom0r-r3d4-${{ github.run_id }}
          path: F-ROM0R_R3D4_EVIDENCE
          if-no-files-found: warn
