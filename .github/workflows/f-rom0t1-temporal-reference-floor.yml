name: F-ROM0T1 exact temporal Reference floor

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/F-ROM0T1_*'
      - 'integration/f-rom/F-ROM0V1_STATUS.json'
      - 'docs/science/F-ROM0T1_*'
      - 'tests/rom/test_f_rom0t1_temporal_reference_floor.f90'
      - 'tests/rom/analyze_f_rom0t1_temporal_reference_floor.py'
      - 'tests/rom/run_f_rom0t1_temporal_reference_floor.sh'
      - '.github/workflows/f-rom0t1-temporal-reference-floor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f-rom0t1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gfortran --version
      - name: Execute exact original temporal Reference-floor diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p F-ROM0T1_EVIDENCE
          F_ROM0T1_EVIDENCE_DIR="$PWD/F-ROM0T1_EVIDENCE" \
            bash tests/rom/run_f_rom0t1_temporal_reference_floor.sh | tee F-ROM0T1_EVIDENCE/gate.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-rom0t1-${{ github.run_id }}
          path: F-ROM0T1_EVIDENCE
          if-no-files-found: warn
