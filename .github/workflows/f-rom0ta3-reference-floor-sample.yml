name: F-ROM0TA3 Reference-floor sample qualification

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/F-ROM0TA3_*'
      - 'docs/science/F-ROM0TA3_*'
      - 'src/kernel/mod_kernel_transactions.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/rom/test_f_rom0ta3_reference_floor_sample.f90'
      - 'tests/rom/analyze_f_rom0ta3_reference_floor_sample.py'
      - 'tests/rom/run_f_rom0ta3_reference_floor_sample.sh'
      - 'tests/rom/compile_f_rom0_fortran_closure.py'
      - 'tests/rom/materialize_f_rom0_headcalc_stubs.py'
      - '.github/workflows/f-rom0ta3-reference-floor-sample.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROM0TA3_*'
      - 'docs/science/F-ROM0TA3_*'
      - 'src/kernel/mod_kernel_transactions.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/rom/**'
      - '.github/workflows/f-rom0ta3-reference-floor-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f-rom0ta3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute preregistered fixed-resolution qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p F-ROM0TA3_EVIDENCE
          F_ROM0TA3_EVIDENCE_DIR="$PWD/F-ROM0TA3_EVIDENCE" \
            bash tests/rom/run_f_rom0ta3_reference_floor_sample.sh | tee F-ROM0TA3_EVIDENCE/gate.txt
      - name: Preserve TA3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-rom0ta3-${{ github.run_id }}
          path: F-ROM0TA3_EVIDENCE
          if-no-files-found: warn
