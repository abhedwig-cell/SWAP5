name: F-ROMV2 D10 faithful He two-layer comparator

on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D10_PREREGISTRATION.json'
      - 'tests/rom/test_f_romv2_d10_zero_head_comparators.f90'
      - 'tests/rom/analyze_f_romv2_d10_he_two_layer.py'
      - 'tests/rom/run_f_romv2_d10_he_two_layer.sh'
      - '.github/workflows/f-romv2-d10-he-two-layer.yml'

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute preregistered D10 comparator
        env:
          F_ROMV2_D10_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D10-EVIDENCE
        run: bash tests/rom/run_f_romv2_d10_he_two_layer.sh
      - name: Upload D10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d10-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D10-EVIDENCE
          if-no-files-found: error
          retention-days: 90
