name: F-ROMV2 D13 FMC groundwater comparator

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROMV2_D13_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d13_fmc_groundwater.py'
      - 'tests/rom/test_f_romv2_d13_groundwater_comparators.f90'
      - 'tests/rom/analyze_f_romv2_d13_fmc_groundwater.py'
      - 'tests/rom/run_f_romv2_d13_fmc_groundwater.sh'
      - '.github/workflows/f-romv2-d13-fmc-groundwater-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute frozen D13 preflight and comparator
        env:
          F_ROMV2_D13_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D13-EVIDENCE
        run: bash tests/rom/run_f_romv2_d13_fmc_groundwater.sh
      - name: Upload D13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d13-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D13-EVIDENCE
          if-no-files-found: error
          retention-days: 90
