name: F-ROMV2 D14 FMC surface kinematics preflight

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROMV2_D14_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d14_surface_kinematics.py'
      - '.github/workflows/f-romv2-d14-surface-kinematics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute frozen D14 surface kinematics preflight
        run: |
          mkdir -p "${{ runner.temp }}/F-ROMV2-D14-EVIDENCE"
          python3 tests/rom/preflight_f_romv2_d14_surface_kinematics.py \
            --prereg integration/f-rom/F-ROMV2_D14_PREREGISTRATION.json \
            --output "${{ runner.temp }}/F-ROMV2-D14-EVIDENCE/F-ROMV2_D14_PREFLIGHT_RESULT.json" \
            | tee "${{ runner.temp }}/F-ROMV2-D14-EVIDENCE/preflight.txt"
          sha256sum "${{ runner.temp }}/F-ROMV2-D14-EVIDENCE/"* > "${{ runner.temp }}/F-ROMV2-D14-EVIDENCE/sha256.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d14-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D14-EVIDENCE
          if-no-files-found: error
          retention-days: 90
