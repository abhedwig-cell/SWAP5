name: F-ROMV2 D15 FMC surface accounting preflight
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D15_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d15_surface_accounting.py'
      - '.github/workflows/f-romv2-d15-surface-accounting.yml'
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute frozen D15 surface-accounting preflight
        run: |
          mkdir -p "${{ runner.temp }}/F-ROMV2-D15-EVIDENCE"
          python3 tests/rom/preflight_f_romv2_d15_surface_accounting.py \
            --prereg integration/f-rom/F-ROMV2_D15_PREREGISTRATION.json \
            --output "${{ runner.temp }}/F-ROMV2-D15-EVIDENCE/F-ROMV2_D15_PREFLIGHT_RESULT.json" \
            | tee "${{ runner.temp }}/F-ROMV2-D15-EVIDENCE/preflight.txt"
          sha256sum "${{ runner.temp }}/F-ROMV2-D15-EVIDENCE/"* > "${{ runner.temp }}/F-ROMV2-D15-EVIDENCE/sha256.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d15-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D15-EVIDENCE
          if-no-files-found: error
          retention-days: 90
