name: F-ROMV2 D16 FMC surface preflight
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D16_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d16_fmc_surface.py'
      - '.github/workflows/f-romv2-d16-fmc-surface.yml'
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute frozen D16 FMC-only preflight
        run: |
          mkdir -p "${{ runner.temp }}/F-ROMV2-D16-EVIDENCE"
          python3 tests/rom/preflight_f_romv2_d16_fmc_surface.py \
            --prereg integration/f-rom/F-ROMV2_D16_PREREGISTRATION.json \
            --output "${{ runner.temp }}/F-ROMV2-D16-EVIDENCE/F-ROMV2_D16_PREFLIGHT_RESULT.json" \
            | tee "${{ runner.temp }}/F-ROMV2-D16-EVIDENCE/preflight.txt"
          sha256sum "${{ runner.temp }}/F-ROMV2-D16-EVIDENCE/"* > "${{ runner.temp }}/F-ROMV2-D16-EVIDENCE/sha256.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d16-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D16-EVIDENCE
          if-no-files-found: error
          retention-days: 90
