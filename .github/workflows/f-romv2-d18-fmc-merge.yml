name: F-ROMV2 D18 FMC slug-groundwater merge comparator

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROMV2_D18_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d18_fmc_slug_groundwater_merge.py'
      - 'tests/rom/test_f_romv2_d18_merge_comparators.f90'
      - 'tests/rom/analyze_f_romv2_d18_merge.py'
      - 'tests/rom/run_f_romv2_d18_merge.sh'
      - '.github/workflows/f-romv2-d18-fmc-merge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute frozen D18 preflight then comparator
        env:
          F_ROMV2_D18_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D18-EVIDENCE
        run: bash tests/rom/run_f_romv2_d18_merge.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d18-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D18-EVIDENCE
          if-no-files-found: error
          retention-days: 90
