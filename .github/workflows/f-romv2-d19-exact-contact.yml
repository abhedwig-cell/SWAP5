name: F-ROMV2 D19 exact-contact merge comparator

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROMV2_D19_*'
      - 'tests/rom/preflight_f_romv2_d19_exact_contact_merge.py'
      - 'tests/rom/test_f_romv2_d19_exact_contact_comparators.f90'
      - 'tests/rom/analyze_f_romv2_d19_exact_contact.py'
      - 'tests/rom/run_f_romv2_d19_exact_contact.sh'
      - '.github/workflows/f-romv2-d19-exact-contact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute frozen D19 Stage-2 comparator
        env:
          F_ROMV2_D19_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D19-EVIDENCE
        run: bash tests/rom/run_f_romv2_d19_exact_contact.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d19-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D19-EVIDENCE
          if-no-files-found: error
          retention-days: 90
