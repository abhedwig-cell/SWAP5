name: F-ROMV2 D20 one-hour FMC preflight
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D20_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d20_hourly_persistence.py'
      - '.github/workflows/f-romv2-d20-hourly-preflight.yml'
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute frozen D20 FMC-only preflight
        run: |
          mkdir -p "${{ runner.temp }}/F-ROMV2-D20-EVIDENCE"
          python3 tests/rom/preflight_f_romv2_d20_hourly_persistence.py \
            --prereg integration/f-rom/F-ROMV2_D20_PREREGISTRATION.json \
            --output "${{ runner.temp }}/F-ROMV2-D20-EVIDENCE/F-ROMV2_D20_PREFLIGHT_RESULT.json" \
            | tee "${{ runner.temp }}/F-ROMV2-D20-EVIDENCE/preflight.txt"
          sha256sum "${{ runner.temp }}/F-ROMV2-D20-EVIDENCE/"* > "${{ runner.temp }}/F-ROMV2-D20-EVIDENCE/sha256.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d20-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D20-EVIDENCE
          if-no-files-found: error
          retention-days: 90
