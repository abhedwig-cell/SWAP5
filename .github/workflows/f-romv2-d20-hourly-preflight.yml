name: F-ROMV2 D20 one-hour FMC persistence

on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D20_PREREGISTRATION.json'
      - 'integration/f-rom/F-ROMV2_D20_STAGE2_AUTHORIZATION.json'
      - 'tests/rom/preflight_f_romv2_d20_hourly_persistence.py'
      - 'tests/rom/test_f_romv2_d20_hourly_persistence_comparators.f90'
      - 'tests/rom/analyze_f_romv2_d20_hourly_persistence.py'
      - 'tests/rom/run_f_romv2_d20_hourly_persistence.sh'
      - '.github/workflows/f-romv2-d20-hourly-preflight.yml'

permissions:
  contents: read

jobs:
  persistence-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute frozen D20 Stage-2 comparator
        env:
          F_ROMV2_D20_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D20-EVIDENCE
        run: bash tests/rom/run_f_romv2_d20_hourly_persistence.sh
      - name: Upload D20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d20-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D20-EVIDENCE
          if-no-files-found: error
          retention-days: 90
