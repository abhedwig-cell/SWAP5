name: F-ROMV2 D21 rainfall ponding runoff preflight

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROMV2_D21_PREREGISTRATION.json'
      - 'tests/rom/test_f_romv2_d21_dynamic_top_provider_preflight.f90'
      - 'tests/rom/analyze_f_romv2_d21_boundary_preflight.py'
      - 'tests/rom/run_f_romv2_d21_boundary_preflight.sh'
      - '.github/workflows/f-romv2-d21-rain-ponding-runoff-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute frozen D21 Stage-1 boundary preflight
        env:
          F_ROMV2_D21_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D21-EVIDENCE
        run: bash tests/rom/run_f_romv2_d21_boundary_preflight.sh
      - name: Upload D21 Stage-1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d21-stage1-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D21-EVIDENCE
          if-no-files-found: error
          retention-days: 90
