name: F-ROMV2 D24 native rainfall groundwater comparator

on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D24_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d24_native_rain_gw.py'
      - 'tests/rom/test_f_romv2_d24_native_rain_gw_comparators.f90'
      - 'tests/rom/analyze_f_romv2_d24_native_rain_gw.py'
      - 'tests/rom/run_f_romv2_d24_native_rain_gw.sh'
      - '.github/workflows/f-romv2-d24-native-rain-gw.yml'

permissions:
  contents: read

jobs:
  trajectory:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute frozen D24 preflight then trajectories
        env:
          F_ROMV2_D24_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D24-EVIDENCE
        run: bash tests/rom/run_f_romv2_d24_native_rain_gw.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d24-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D24-EVIDENCE
          if-no-files-found: error
          retention-days: 90
