name: F-ROMV2 D24 FMC native rain-groundwater preflight

on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D24_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d24_native_rain_gw.py'
      - '.github/workflows/f-romv2-d24-native-rain-gw.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute frozen D24 FMC-only preflight
        run: |
          mkdir -p "${{ runner.temp }}/F-ROMV2-D24-EVIDENCE"
          python3 tests/rom/preflight_f_romv2_d24_native_rain_gw.py             --prereg integration/f-rom/F-ROMV2_D24_PREREGISTRATION.json             --output "${{ runner.temp }}/F-ROMV2-D24-EVIDENCE/F-ROMV2_D24_PREFLIGHT.json"             | tee "${{ runner.temp }}/F-ROMV2-D24-EVIDENCE/preflight.txt"
          sha256sum "${{ runner.temp }}/F-ROMV2-D24-EVIDENCE/"* > "${{ runner.temp }}/F-ROMV2-D24-EVIDENCE/sha256.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d24-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D24-EVIDENCE
          if-no-files-found: error
          retention-days: 90
