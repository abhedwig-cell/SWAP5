name: F-ROMV2 D29 one-day hydraulic preflight

on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D29_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d29_one_day_hydraulic.py'
      - '.github/workflows/f-romv2-d29-one-day-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute frozen FMC-only one-day preflight
        run: |
          mkdir -p "${{ runner.temp }}/F-ROMV2-D29-EVIDENCE"
          python3 tests/rom/preflight_f_romv2_d29_one_day_hydraulic.py \
            --prereg integration/f-rom/F-ROMV2_D29_PREREGISTRATION.json \
            --output "${{ runner.temp }}/F-ROMV2-D29-EVIDENCE/F-ROMV2_D29_PREFLIGHT.json" \
            | tee "${{ runner.temp }}/F-ROMV2-D29-EVIDENCE/preflight.txt"
          sha256sum "${{ runner.temp }}/F-ROMV2-D29-EVIDENCE/"* > "${{ runner.temp }}/F-ROMV2-D29-EVIDENCE/sha256.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d29-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D29-EVIDENCE
          if-no-files-found: error
          retention-days: 90
