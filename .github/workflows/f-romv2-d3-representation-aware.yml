name: F-ROMV2 D3 representation-aware coarse Richards

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROMV2_D3_PREREGISTRATION.json'
      - 'tests/rom/test_f_romv2_d3_representation_aware_coarse_richards.f90'
      - 'tests/rom/analyze_f_romv2_d3_representation_aware_coarse_richards.py'
      - 'tests/rom/run_f_romv2_d3_representation_aware_coarse_richards.sh'
      - '.github/workflows/f-romv2-d3-representation-aware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representation-aware-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute preregistered D3 screen
        env:
          F_ROMV2_D3_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D3-EVIDENCE
        run: bash tests/rom/run_f_romv2_d3_representation_aware_coarse_richards.sh
      - name: Upload D3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d3-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D3-EVIDENCE
          if-no-files-found: error
          retention-days: 90
