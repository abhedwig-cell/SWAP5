name: F-ROMV2 D4 integrated water-depth coarse Richards

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROMV2_D4_PREREGISTRATION.json'
      - 'tests/rom/test_f_romv2_d4_integrated_residual_coarse_richards.f90'
      - 'tests/rom/analyze_f_romv2_d4_integrated_residual_coarse_richards.py'
      - 'tests/rom/run_f_romv2_d4_integrated_residual_coarse_richards.sh'
      - '.github/workflows/f-romv2-d4-integrated-residual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-residual-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute preregistered D4 screen
        env:
          F_ROMV2_D4_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D4-EVIDENCE
        run: bash tests/rom/run_f_romv2_d4_integrated_residual_coarse_richards.sh
      - name: Upload D4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d4-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D4-EVIDENCE
          if-no-files-found: error
          retention-days: 90
