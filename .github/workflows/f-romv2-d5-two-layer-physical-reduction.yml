name: F-ROMV2 D5 two-layer physical reduction

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-rom/F-ROMV2_D5_PREREGISTRATION.json'
      - 'tests/rom/test_f_romv2_d5_r16_reference.f90'
      - 'tests/rom/analyze_f_romv2_d5_two_layer_physical_reduction.py'
      - 'tests/rom/run_f_romv2_d5_two_layer_physical_reduction.sh'
      - '.github/workflows/f-romv2-d5-two-layer-physical-reduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-discriminator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute preregistered D5 discriminator
        env:
          F_ROMV2_D5_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D5-EVIDENCE
        run: bash tests/rom/run_f_romv2_d5_two_layer_physical_reduction.sh
      - name: Upload D5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d5-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D5-EVIDENCE
          if-no-files-found: error
          retention-days: 90
