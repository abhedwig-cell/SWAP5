name: F-ROMV2 D7 finite-domain manifold discriminator
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'integration/f-rom/F-ROMV2_D7_PREREGISTRATION.json'
      - 'tests/rom/preflight_f_romv2_d7_finite_domain_manifold.py'
      - 'tests/rom/test_f_romv2_d7_r16_reference.f90'
      - 'tests/rom/analyze_f_romv2_d7_quasi_steady_manifold.py'
      - 'tests/rom/run_f_romv2_d7_quasi_steady_manifold.sh'
      - '.github/workflows/f-romv2-d7-manifold-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discriminator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Execute frozen D7 preflight and dynamic discriminator
        env:
          F_ROMV2_D7_EVIDENCE_DIR: ${{ runner.temp }}/F-ROMV2-D7-EVIDENCE
        run: bash tests/rom/run_f_romv2_d7_quasi_steady_manifold.sh
      - name: Upload D7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-romv2-d7-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROMV2-D7-EVIDENCE
          if-no-files-found: error
          retention-days: 90
