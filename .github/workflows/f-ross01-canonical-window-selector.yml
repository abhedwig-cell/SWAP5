name: F-ROSS01 Canonical Window Selector

on:
  push:
    branches: [work/f-ross01-k-runtime-production-window-selector]
    paths:
      - 'src/runtime/mod_canonical_contracts.f90'
      - 'src/runtime/mod_canonical_interval_runtime.f90'
      - 'src/transaction/mod_transaction_reference.f90'
      - 'tests/runtime/test_f_ross01_transaction_window_selector.f90'
      - 'tests/runtime/run_f_ross01_transaction_window_selector.sh'
      - '.github/workflows/f-ross01-canonical-window-selector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and qualify default and bounded window selection
        run: bash tests/runtime/run_f_ross01_transaction_window_selector.sh
