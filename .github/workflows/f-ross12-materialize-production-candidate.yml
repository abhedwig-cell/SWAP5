name: F-ROSS12 materialize qualified production candidate

on:
  push:
    branches:
      - work/f-ross12-production-solver-selection
    paths:
      - 'integration/f-ross/F-ROSS12_MATERIALIZE_REQUEST.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-ross12-production-solver-selection
          fetch-depth: 0
      - name: Materialize exactly the qualified RossFast production candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 tests/ross/_apply_ross12_serialized_production_candidate.py
          git diff --check -- src/runtime/mod_fmr_serialized_reference_backend.f90
          changed="$(git diff --name-only -- src | sort)"
          test "$changed" = 'src/runtime/mod_fmr_serialized_reference_backend.f90'
          grep -Fq 'rossfast-model-certificate' src/runtime/mod_fmr_serialized_reference_backend.f90
          grep -Fq 'fmr_serialized_rossfast_preflight' src/runtime/mod_fmr_serialized_reference_backend.f90
          grep -Fq 'if (self%soil_water_selection%uses_rossfast()) then' src/runtime/mod_fmr_serialized_reference_backend.f90
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/mod_fmr_serialized_reference_backend.f90
          git commit -m 'feat(ross12): wire qualified RossFast production solver selection'
          git push origin HEAD:work/f-ross12-production-solver-selection
