name: F-ROSS25 batch WETTING qualification

on:
  push:
    branches:
      - work/f-ross25-tiered-wetting-seam-qualification
    paths:
      - 'tests/ross/run_ross25_batch_qualification.sh'
      - '.github/workflows/f-ross25-batch-wetting-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin F-ROSS01 research authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-ross01-fast-mfp-feasibility
          test "$(git rev-parse FETCH_HEAD)" = 04807fdcf45453a59b7f6c99fe97f1286c172833
          git worktree add --detach "$RUNNER_TEMP/f-ross01-research" FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json)" = 76596a00296318b871a9109ed6187bb86ccfae32

      - name: Install oracle dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema

      - name: Compiler identity
        run: gfortran --version

      - name: Execute all 36 materials on one runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ross25-batch-evidence"
          bash tests/ross/run_ross25_batch_qualification.sh             "$RUNNER_TEMP/f-ross01-research"             "$RUNNER_TEMP/ross25-batch-evidence"             | tee "$RUNNER_TEMP/F-ROSS25_BATCH_LOG.txt"

      - name: Upload aggregate and material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross25-batch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ross25-batch-evidence
            ${{ runner.temp }}/F-ROSS25_BATCH_LOG.txt
          if-no-files-found: error
