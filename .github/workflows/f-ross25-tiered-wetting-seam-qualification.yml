name: F-ROSS25 tiered WETTING seam qualification

on:
  push:
    branches:
      - work/f-ross25-tiered-wetting-seam-qualification
    paths:
      - 'integration/f-ross/F-ROSS25_*'
      - 'tests/ross/generate_ross25_wetting_oracle.py'
      - 'tests/ross/test_ross25_tiered_wetting_kernel.f90'
      - 'tests/ross/run_ross25_wetting_material_qualification.sh'
      - 'tests/ross/aggregate_ross25_wetting_qualification.py'
      - '.github/workflows/f-ross25-tiered-wetting-seam-qualification.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-ross/F-ROSS25_*'
      - 'tests/ross/generate_ross25_wetting_oracle.py'
      - 'tests/ross/test_ross25_tiered_wetting_kernel.f90'
      - 'tests/ross/run_ross25_wetting_material_qualification.sh'
      - 'tests/ross/aggregate_ross25_wetting_qualification.py'
      - '.github/workflows/f-ross25-tiered-wetting-seam-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-material:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        material:
          - B01
          - B02
          - B03
          - B04
          - B05
          - B06
          - B07
          - B08
          - B09
          - B10
          - B11
          - B12
          - B13
          - B14
          - B15
          - B16
          - B17
          - B18
          - O01
          - O02
          - O03
          - O04
          - O05
          - O06
          - O07
          - O08
          - O09
          - O10
          - O11
          - O12
          - O13
          - O14
          - O15
          - O16
          - O17
          - O18
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin F-ROSS01 research authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-ross01-fast-mfp-feasibility
          test "$(git rev-parse FETCH_HEAD)" = 04807fdcf45453a59b7f6c99fe97f1286c172833
          git worktree add --detach "$RUNNER_TEMP/f-ross01-research" FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json)" = 76596a00296318b871a9109ed6187bb86ccfae32

      - name: Install oracle dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema

      - name: Generate independent WETTING reference and seam diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ross25-${{ matrix.material }}"
          python3 tests/ross/generate_ross25_wetting_oracle.py \
            --research-root "$RUNNER_TEMP/f-ross01-research" \
            --contract integration/f-ross/F-ROSS25_TIERED_WETTING_SEAM_QUALIFICATION_CONTRACT.json \
            --fingerprint-authority integration/f-ross/F-ROSS13_36_MATERIAL_N241_FINGERPRINT_AUTHORITY.json \
            --material "${{ matrix.material }}" \
            --fixture-out "$RUNNER_TEMP/ross25-${{ matrix.material }}/fixture-${{ matrix.material }}.txt" \
            --metadata-out "$RUNNER_TEMP/ross25-${{ matrix.material }}/metadata-${{ matrix.material }}.json"

      - name: Compiler identity
        run: gfortran --version

      - name: Qualify current admitted tiered kernel
        shell: bash
        run: |
          set -euo pipefail
          bash tests/ross/run_ross25_wetting_material_qualification.sh \
            "${{ matrix.material }}" \
            "$RUNNER_TEMP/ross25-${{ matrix.material }}/fixture-${{ matrix.material }}.txt" \
            "$RUNNER_TEMP/ross25-${{ matrix.material }}/metadata-${{ matrix.material }}.json" \
            | tee "$RUNNER_TEMP/ross25-${{ matrix.material }}/fortran-${{ matrix.material }}.txt"

      - name: Upload material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross25-${{ matrix.material }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ross25-${{ matrix.material }}/metadata-${{ matrix.material }}.json
            ${{ runner.temp }}/ross25-${{ matrix.material }}/fortran-${{ matrix.material }}.txt
          if-no-files-found: warn

  aggregate:
    needs: qualify-material
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require complete material qualification
        run: test '${{ needs.qualify-material.result }}' = success

      - name: Download material evidence
        uses: actions/download-artifact@v4
        with:
          pattern: f-ross25-*-${{ github.run_id }}
          path: ${{ runner.temp }}/ross25-all
          merge-multiple: false

      - name: Aggregate F-ROSS25 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ross/aggregate_ross25_wetting_qualification.py \
            --input-root "$RUNNER_TEMP/ross25-all" \
            --contract integration/f-ross/F-ROSS25_TIERED_WETTING_SEAM_QUALIFICATION_CONTRACT.json \
            --output "$RUNNER_TEMP/F-ROSS25_TIERED_WETTING_SEAM_QUALIFICATION_RESULT.json"
          cat "$RUNNER_TEMP/F-ROSS25_TIERED_WETTING_SEAM_QUALIFICATION_RESULT.json"

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross25-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROSS25_TIERED_WETTING_SEAM_QUALIFICATION_RESULT.json
          if-no-files-found: error
