name: F-SI19 materialize reference linear solver

on:
  push:
    branches:
      - work/f-si19-reference-linear-solver-seam

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'materialize reference linear solver seam') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/f-si19-reference-linear-solver-seam
          fetch-depth: 0
      - name: Materialize exact owner-approved seam
        run: python3 tools/fsi/materialize_fsi19_reference_linear_solver.py
      - name: Guard changed production scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/legacy/b1_10_port/headcalc.f90\nsrc/solver/mod_reference_richards_workspace.f90'
      - name: Persist production postimage before tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/legacy/b1_10_port/headcalc.f90 src/solver/mod_reference_richards_workspace.f90
          git commit -m 'feat(F-SI19): materialize reference linear solver seam'
          git push origin HEAD:work/f-si19-reference-linear-solver-seam
          echo 'FSI19_MATERIALIZED_POSTIMAGE PASS'
