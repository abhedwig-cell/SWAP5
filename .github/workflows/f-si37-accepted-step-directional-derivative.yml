name: F-SI37 accepted-step directional derivative

on:
  push:
    branches:
      - work/f-si37-accepted-step-directional-derivative-seam
    paths:
      - 'src/solver/mod_soil_water_accepted_step_direction_contract.f90'
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'tests/fsi/test_fsi37_accepted_step_directional_derivative.f90'
      - 'tests/fsi/run_fsi37_qualification.sh'
      - '.github/workflows/f-si37-accepted-step-directional-derivative.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Prepare diagnostic build
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/swap5-fsi37"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          mkdir -p "$BUILD/o0"
          [[ "$(git rev-parse HEAD:src/solver/mod_soil_water_solver_contract.f90)" == 276941d76ba951a89c43899e61fd0532418d8230 ]]
          [[ "$(git rev-parse HEAD:src/solver/mod_reference_linear_solver.f90)" == 5b6ecd2341b315967bcfac6b879c3afe227fb245 ]]
          [[ "$(git rev-parse HEAD:src/solver/mod_reference_richards_workspace.f90)" == 74f99556005ae39614f9df678467b1e19097bae2 ]]
          [[ "$(git rev-parse HEAD:src/legacy/b1_10_port/headcalc.f90)" == 3ff8d5cfd6963dfb7dafb33ec454fbc0df938a55 ]]
          [[ "$(git rev-parse HEAD:src/adapter/mod_reference_richards_legacy_binding.f90)" == 03a64b6d09fd804242bcf76f7cb5277f59a6230a ]]
          python3 tests/fsi/fsi18_make_reference_tridag_stubs.py tests/fsi/fsi04_real_headcalc_stubs.f90 "$BUILD/reference_tridag_stubs.f90"
      - name: Compile accepted-step contract
        run: |
          set -euo pipefail
          C=(-std=f2008 -ffree-line-length-none -Wall -Wextra -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow -O0 -J "$BUILD/o0" -I "$BUILD/o0")
          gfortran "${C[@]}" -c src/solver/mod_soil_water_accepted_step_direction_contract.f90 -o "$BUILD/o0/mod_soil_water_accepted_step_direction_contract.o"
      - name: Compile audited Reference stack
        run: |
          set -euo pipefail
          C=(-std=f2008 -ffree-line-length-none -Wall -Wextra -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow -O0 -J "$BUILD/o0" -I "$BUILD/o0")
          SRC=(
            "$BUILD/reference_tridag_stubs.f90"
            src/runtime/mod_a23bu_worker_execution_context.f90
            src/solver/mod_soil_water_solver_contract.f90
            src/solver/mod_process_hydraulic_view.f90
            src/solver/mod_reference_linear_solver.f90
            src/solver/mod_reference_richards_workspace.f90
            src/solver/mod_reference_richards_state_binding.f90
            src/solver/mod_b110_default_mvg_provider.f90
            src/solver/mod_b110_source_sink_provider.f90
            src/solver/mod_fixed_flux_top_boundary_provider.f90
            src/solver/mod_reference_richards_temporal_indicator.f90
            src/legacy/b1_10_port/headcalc.f90
            src/adapter/mod_reference_richards_legacy_binding.f90
            tests/fmr/mod_fmr04_fixed_top_provider.f90
          )
          for src in "${SRC[@]}"; do
            obj="$BUILD/o0/$(basename "${src%.*}").o"
            gfortran "${C[@]}" -c "$src" -o "$obj"
          done
      - name: Compile accepted-step Reference service
        run: |
          set -euo pipefail
          C=(-std=f2008 -ffree-line-length-none -Wall -Wextra -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow -O0 -J "$BUILD/o0" -I "$BUILD/o0")
          gfortran "${C[@]}" -c src/adapter/mod_reference_richards_accepted_step_directional_service.f90 -o "$BUILD/o0/mod_reference_richards_accepted_step_directional_service.o"
      - name: Compile F-SI37 oracle
        run: |
          set -euo pipefail
          C=(-std=f2008 -ffree-line-length-none -Wall -Wextra -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow -O0 -J "$BUILD/o0" -I "$BUILD/o0")
          gfortran "${C[@]}" -c tests/fsi/test_fsi37_accepted_step_directional_derivative.f90 -o "$BUILD/o0/test_fsi37.o"
      - name: Run O0 oracle
        run: |
          set -euo pipefail
          gfortran -O0 "$BUILD/o0"/*.o -o "$BUILD/o0/test_fsi37"
          timeout 120s "$BUILD/o0/test_fsi37" | tee "$BUILD/o0/output.txt"
          grep -Fq 'FSI37_ACCEPTED_STEP_DIRECTIONAL_DERIVATIVE PASS' "$BUILD/o0/output.txt"
      - name: Run complete O0 O2 gate
        run: bash tests/fsi/run_fsi37_qualification.sh
