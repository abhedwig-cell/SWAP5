name: F-TAB02 generated K0 provider

on:
  push:
    branches:
      - work/f-tab02-generated-k0-provider
    paths:
      - 'src/solver/mod_b110_generated_mvg_tspack.f90'
      - 'src/solver/mod_b110_generated_mvg_table_state.f90'
      - 'src/solver/mod_b110_generated_mvg_provider.f90'
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/solver/mod_b110_default_mvg_provider.f90'
      - 'src/solver/mod_reference_richards_temporal_indicator.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fsi/test_ftab02a_generated_mvg_table_state.f90'
      - 'tests/fsi/run_ftab02a_generated_mvg_table_state.sh'
      - 'tests/fsi/test_ftab02b_generated_mvg_provider.f90'
      - 'tests/fsi/run_ftab02b_generated_mvg_provider.sh'
      - 'tests/fsi/fixtures/ftab02_staring1994_mvg.dat'
      - 'tests/fsi/test_ftab02c_serialized_generated_provider.f90'
      - 'tests/fsi/run_ftab02c_serialized_generated_provider.sh'
      - 'tests/fsi/test_ftab02d_constitutive_context_capability.f90'
      - 'tests/fsi/run_ftab02d_constitutive_context_capability.sh'
      - 'tests/fsi/test_ftab02d_generated_temporal_certificate.f90'
      - 'tests/fsi/run_ftab02d_generated_temporal_certificate.sh'
      - 'tests/fsi/test_ftab02e_provider_richards_performance.f90'
      - 'tests/fsi/test_ftab02e_serialized_runtime_performance.f90'
      - 'tests/fsi/run_ftab02e_generated_provider_performance.sh'
      - 'integration/f-tab/F-TAB02_PREREGISTRATION.json'
      - '.github/workflows/f-tab02-generated-k0-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run F-TAB02-A qualification
        shell: bash
        run: bash tests/fsi/run_ftab02a_generated_mvg_table_state.sh | tee F-TAB02-A_GATE.log
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "work_unit=F-TAB02-A"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "compiler=$(gfortran --version | head -n1 || true)"
            grep -E '^F_TAB02_A_|^F-TAB02-A ' F-TAB02-A_GATE.log || true
          } > F-TAB02-A_EVIDENCE.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-tab02-a-evidence
          path: |
            F-TAB02-A_EVIDENCE.txt
            F-TAB02-A_GATE.log
          if-no-files-found: error

  slice-b:
    needs: slice-a
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run F-TAB02-B qualification
        shell: bash
        run: bash tests/fsi/run_ftab02b_generated_mvg_provider.sh | tee F-TAB02-B_GATE.log
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "work_unit=F-TAB02-B"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "compiler=$(gfortran --version | head -n1 || true)"
            grep -E '^F_TAB02_B_|^F-TAB02-B ' F-TAB02-B_GATE.log || true
          } > F-TAB02-B_EVIDENCE.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-tab02-b-evidence
          path: |
            F-TAB02-B_EVIDENCE.txt
            F-TAB02-B_GATE.log
          if-no-files-found: error

  slice-c:
    needs: slice-b
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run F-TAB02-C qualification
        shell: bash
        run: bash tests/fsi/run_ftab02c_serialized_generated_provider.sh | tee F-TAB02-C_GATE.log
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "work_unit=F-TAB02-C"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "compiler=$(gfortran --version | head -n1 || true)"
            grep -E '^F_TAB02_C_|^F-TAB02-C ' F-TAB02-C_GATE.log || true
          } > F-TAB02-C_EVIDENCE.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-tab02-c-evidence
          path: |
            F-TAB02-C_EVIDENCE.txt
            F-TAB02-C_GATE.log
          if-no-files-found: error

  slice-d:
    needs: slice-c
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run F-TAB02-D qualification
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fsi/run_ftab02d_constitutive_context_capability.sh | tee F-TAB02-D_GATE.log
          bash tests/fsi/run_ftab02d_generated_temporal_certificate.sh | tee -a F-TAB02-D_GATE.log
      - name: Run F-TAB02-D FMR44R authority cross-check
        shell: bash
        run: bash tests/fsi/run_ftab02d_dynamic_transaction.sh | tee F-TAB02-D_DYNAMIC_GATE.log
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "work_unit=F-TAB02-D"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "compiler=$(gfortran --version | head -n1 || true)"
            grep -E '^F_TAB02_D_|^F-TAB02-D ' F-TAB02-D_GATE.log || true
            grep -E '^F_TAB02_D_|^F-TAB02-D |^FMR44R_POSITIVE_QBOT_|^FMR44R_.*PASS' F-TAB02-D_DYNAMIC_GATE.log || true
          } > F-TAB02-D_EVIDENCE.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-tab02-d-evidence
          path: |
            F-TAB02-D_EVIDENCE.txt
            F-TAB02-D_GATE.log
            F-TAB02-D_DYNAMIC_GATE.log
          if-no-files-found: error


  slice-e:
    needs: slice-d
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run F-TAB02-E performance qualification
        shell: bash
        run: bash tests/fsi/run_ftab02e_generated_provider_performance.sh | tee F-TAB02-E_GATE.log
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "work_unit=F-TAB02-E"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "compiler=$(gfortran --version | head -n1 || true)"
            grep -E '^F_TAB02_E_|^F-TAB02-E ' F-TAB02-E_GATE.log || true
          } > F-TAB02-E_EVIDENCE.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-tab02-e-evidence
          path: |
            F-TAB02-E_EVIDENCE.txt
            F-TAB02-E_GATE.log
            F-TAB02-E_SUMMARY.tsv
            F-TAB02-E_PROVIDER_RICHARDS.log
            F-TAB02-E_SERIALIZED.log
          if-no-files-found: warn
