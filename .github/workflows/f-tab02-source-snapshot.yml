name: F-TAB02 source snapshot handoff

on:
  workflow_dispatch:
  push:
    branches:
      - work/f-tab02-generated-k0-provider
    paths:
      - '.github/workflows/f-tab02-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact postimage
        run: |
          set -euo pipefail
          mkdir -p build/ftab02-source
          git rev-parse HEAD > build/ftab02-source/HEAD.txt
          git rev-parse HEAD^{tree} > build/ftab02-source/TREE.txt
          git archive --format=tar.gz --prefix=SWAP5/ HEAD > build/ftab02-source/SWAP5-source.tar.gz
          sha256sum build/ftab02-source/SWAP5-source.tar.gz > build/ftab02-source/SWAP5-source.tar.gz.sha256
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: f-tab02-source-snapshot
          path: build/ftab02-source/
          if-no-files-found: error
