name: F-TAB02-G bounded Hupsel F-SI39 extension

on:
  push:
    branches:
      - work/f-tab02-generated-k0-provider
    paths:
      - 'src/solver/mod_b110_generated_mvg_table_state.f90'
      - 'src/solver/mod_b110_generated_mvg_provider.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fsi/test_ftab02g_bounded_ksatexm_generated_provider.f90'
      - 'tests/fsi/run_ftab02g_bounded_ksatexm_generated_provider.sh'
      - 'tests/fsi/test_ftab02g_reference_richards_ksatexm.f90'
      - 'tests/fsi/run_ftab02g_reference_richards_ksatexm.sh'
      - 'tests/fsi/test_ftab02g_serialized_ksatexm_selection.f90'
      - 'tests/fsi/run_ftab02g_serialized_ksatexm_selection.sh'
      - 'integration/f-tab/F-TAB02_G_PREREGISTRATION.json'
      - '.github/workflows/f-tab02g-bounded-ksatexm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run F-TAB02-G bounded F-SI39 qualification
        shell: bash
        run: bash tests/fsi/run_ftab02g_bounded_ksatexm_generated_provider.sh | tee F-TAB02-G_GATE.log
      - name: Run F-TAB02-G Reference Richards qualification
        shell: bash
        run: bash tests/fsi/run_ftab02g_reference_richards_ksatexm.sh | tee F-TAB02-G_RICHARDS_GATE.log
      - name: Run F-TAB02-G serialized selection qualification
        shell: bash
        run: bash tests/fsi/run_ftab02g_serialized_ksatexm_selection.sh | tee F-TAB02-G_SERIALIZED_GATE.log
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "work_unit=F-TAB02-G"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "compiler=$(gfortran --version | head -n1 || true)"
            grep -E '^F_TAB02_G_|^F-TAB02-G ' F-TAB02-G_GATE.log || true
            grep -E '^F_TAB02_G_|^F-TAB02-G ' F-TAB02-G_RICHARDS_GATE.log || true
            grep -E '^F_TAB02_G_|^F-TAB02-G ' F-TAB02-G_SERIALIZED_GATE.log || true
          } > F-TAB02-G_EVIDENCE.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-tab02-g-evidence
          path: |
            F-TAB02-G_EVIDENCE.txt
            F-TAB02-G_GATE.log
            F-TAB02-G_RICHARDS_GATE.log
            F-TAB02-G_SERIALIZED_GATE.log
          if-no-files-found: error
