name: F-VQ101 F-APP01 independent qualification

on:
  push:
    branches:
      - qualification/f-vq101-fapp01-minimal-application-host-independent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run independent F-VQ101 qualification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/fvq/run_fvq101_fapp01_independent.sh
          tests/fvq/run_fvq101_fapp01_independent.sh | tee F-VQ101_GATE.log
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "work_unit=F-VQ101"
            echo "owner_work_unit=F-APP01"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "compiler=$(gfortran --version | head -n1 || true)"
            echo "host_blob=$(git rev-parse HEAD:src/runtime/mod_fmr_soil_water_application_host.f90 || true)"
            grep -E 'FVQ101_' F-VQ101_GATE.log || true
          } > F-VQ101_EVIDENCE.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-vq101-evidence
          path: F-VQ101_EVIDENCE.txt
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-vq101-diagnostics
          path: F-VQ101_GATE.log
          if-no-files-found: warn
