name: F-VQ110 F-GC36 independent live qualification

on:
  push:
    branches:
      - qualification/f-vq110-fgc36-live-bridge-independent
    paths:
      - 'tests/fvq/test_fvq110_fgc36_live_bridge_independent.py'
      - 'tests/fvq/run_fvq110_fgc36_live_bridge_independent.sh'
      - 'qualification/F-VQ110_STATUS.json'
      - '.github/workflows/f-vq110-fgc36-live-bridge-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compiler and pinned Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install             git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902             git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Independent live F-GC36 qualification
        run: bash tests/fvq/run_fvq110_fgc36_live_bridge_independent.sh
