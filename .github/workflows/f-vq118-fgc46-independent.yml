name: F-VQ118 F-GC46 independent qualification
on:
  push:
    branches: [work/f-gc46-real-multicell-live-modflow]
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'tests/fgc/support/mod_fgc46_real_multicell_c_bridge.f90'
      - 'tests/fgc/test_fgc46_real_multicell_live_modflow.py'
      - 'docs/integration/F-GC46_REAL_MULTICELL_LIVE_MODFLOW.md'
      - 'tests/fvq/test_fvq118_fgc46_independent.py'
      - 'tests/fvq/run_fvq118_fgc46_independent.sh'
      - '.github/workflows/f-vq118-fgc46-independent.yml'
permissions: {contents: read}
jobs:
  independent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fvq/run_fvq118_fgc46_independent.sh
