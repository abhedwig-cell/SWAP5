name: F-VQ119 F-GC47 independent qualification
on:
  push:
    branches: [work/f-gc47-mixed-topology-live-modflow]
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'tests/fgc/support/mod_fgc47_mixed_topology_c_bridge.f90'
      - 'tests/fgc/test_fgc47_mixed_topology_live_modflow.py'
      - 'docs/integration/F-GC47_MIXED_TOPOLOGY_LIVE_MODFLOW.md'
      - 'tests/fvq/test_fvq119_fgc47_independent.py'
      - 'tests/fvq/run_fvq119_fgc47_independent.sh'
      - '.github/workflows/f-vq119-fgc47-independent.yml'
permissions: {contents: read}
jobs:
  independent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fvq/run_fvq119_fgc47_independent.sh
