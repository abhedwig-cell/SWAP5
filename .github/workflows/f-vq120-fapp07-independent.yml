name: F-VQ120 F-APP07 independent

on:
  push:
    branches:
      - qualification/f-vq120-fapp07-hupsel-tcs1-dcs2-independent
    paths:
      - 'tests/fvq/test_fvq120_fapp07_tcs1_dcs2_independent.f90'
      - 'tests/fvq/run_fvq120_fapp07_tcs1_dcs2_independent.sh'
      - '.github/workflows/f-vq120-fapp07-independent.yml'
      - 'integration/f-vq/F-VQ120_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Independent F-APP07 qualification
        run: bash tests/fvq/run_fvq120_fapp07_tcs1_dcs2_independent.sh
