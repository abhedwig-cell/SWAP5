name: F-VQ128 M1-C3 independent qualification

on:
  push:
    branches:
      - work/m1-c3-final-legacy-file-typed-adapter
    paths:
      - 'src/solver/mod_b110_dynamic_top_boundary_provider.f90'
      - 'src/adapter/mod_b110_dynamic_top_boundary_solver_adapter.f90'
      - 'src/adapter/mod_b110_production_soil_water_task2.f90'
      - 'tests/m1/**'
      - 'integration/m1/M1_C3_FINAL_WHOLE_HUPSEL_QUALIFICATION.json'
      - '.github/workflows/f-vq128-m1-c3-independent.yml'
  pull_request:
    paths:
      - 'src/solver/mod_b110_dynamic_top_boundary_provider.f90'
      - 'src/adapter/mod_b110_dynamic_top_boundary_solver_adapter.f90'
      - 'src/adapter/mod_b110_production_soil_water_task2.f90'
      - 'tests/m1/**'
      - 'integration/m1/M1_C3_FINAL_WHOLE_HUPSEL_QUALIFICATION.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Independent M1-C3 evidence and semantic qualification
        run: tests/m1/run_fvq128_m1_c3_independent.sh
