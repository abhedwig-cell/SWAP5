name: F-VQ95 independent F-GC23 qualification

on:
  push:
    branches:
      - qualification/f-vq95-fgc23-whole-window-response-tangent-independent-qualification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-qualify-fgc23:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checked-out run head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-VQ95 independent qualification
        run: bash qualification/run_fvq95_fgc23_whole_window_response_tangent.sh
