name: F-VQ96 F-GC26 independent qualification

on:
  push:
    branches:
      - qualification/f-vq96-fgc26-external-groundwater-adapter-independent
  pull_request:
    paths:
      - 'src/adapter/mod_groundwater_external_gateway.f90'
      - 'src/runtime/mod_groundwater_*'
      - 'tests/fvq/test_fvq96_fgc26_external_gateway_independent.f90'
      - 'tests/fvq/run_fvq96_fgc26_external_gateway_independent.sh'
      - '.github/workflows/f-vq96-fgc26-independent.yml'

permissions:
  contents: read

jobs:
  independent-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compiler provenance
        run: gfortran --version
      - name: Run independent F-GC26 oracle and architecture guards
        run: bash tests/fvq/run_fvq96_fgc26_external_gateway_independent.sh
