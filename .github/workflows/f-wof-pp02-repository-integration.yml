name: F-WOF-PP02 repository integration

on:
  push:
    branches:
      - work/f-wof-pp02-wofost81-migration-preservation
    paths:
      - 'src/crop/mod_wofost81_*.f90'
      - 'tests/fwof/pp02/**'
      - '.github/workflows/f-wof-pp02-repository-integration.yml'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: gfortran --version
      - name: WOFOST81 repository integration gate
        run: bash tests/fwof/pp02/run_wofost81_one_day_candidate_integration.sh
      - name: WOFOST81 case001 full-season preservation gate
        run: bash tests/fwof/pp02/run_wofost81_case001_fullseason_gate.sh
      - name: WOFOST81 case002 full-season preservation gate
        run: bash tests/fwof/pp02/run_wofost81_case002_fullseason_gate.sh
      - name: Build reusable qualified replay binaries
        run: bash tests/fwof/pp02/build_wofost81_fullseason_replay_binaries.sh
      - name: Upload qualified replay binaries
        uses: actions/upload-artifact@v4
        with:
          name: f-wof-pp02-replay-binaries
          path: .pp02-artifacts/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
