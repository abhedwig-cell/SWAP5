name: F-CI canonical qualification

on:
  push:
    branches:
      - integration/f-ci-canonical
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'integration/f-ci/**'
      - 'reference/swap-4.3.1/**'
      - '.github/workflows/fci-canonical.yml'

jobs:
  historical-fci03-through-fci18:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1eceed967b12396b8bbc832f897376378463adce
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Replay exact qualified F-CI18 gate-promotion chain
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fci/run_fci03_gate.sh
          bash tests/fci/run_fci04_gate.sh
          python tools/fci/fci05_b1_10_physical_preimage_gate.py
          bash tests/fci/run_fci06_gate.sh
          bash tests/fci/run_fci07_gate.sh
          bash tests/fci/run_fci08_gate.sh
          bash tests/fci/run_fci09_gate.sh
          bash tests/fci/run_fci10_gate.sh
          bash tests/fci/run_fci11_gate.sh
          bash tests/fci/run_fci12_gate.sh
          bash tests/fci/run_fci13_gate.sh
          bash tests/fci/run_fci14_gate.sh
          bash tests/fci/run_fci15_gate.sh
          bash tests/fci/run_fci16_gate.sh
          bash tests/fci/run_fci17_gate.sh
          bash tests/fci/run_fci18_gate.sh
          echo 'FCI_CANONICAL_HISTORICAL_FCI03_THROUGH_FCI18=PASS'

  frozen-fci19-candidate-preservation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d5ece58b2b8e053a270992ded52377dd524f9c4
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Replay frozen F-CI19 Candidate A composition preservation
        run: bash tests/fci/run_fci19_candidate_a_preservation_gate_v2.sh

  frozen-fci19-source-lineage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e06e3af07efd72a893e860b5d90ccd85efc3c643
          fetch-depth: 0
      - name: Replay frozen F-CI19 source lineage and reachability
        run: bash tests/fci/run_fci19_source_lineage_reachability_gate.sh

  current-restricted-canonical-postimage:
    needs:
      - historical-fci03-through-fci18
      - frozen-fci19-candidate-preservation
      - frozen-fci19-source-lineage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Current lineage authority gate
        run: python tools/fci/fci23_current_lineage_authority_gate.py
      - name: Reexecute current F-CI21 closeout semantics
        run: bash tests/fci/run_fci21_closeout_readiness_gate.sh
      - name: Final exact postimage and authority recheck
        shell: bash
        run: |
          set -euo pipefail
          python tools/fci/fci23_current_lineage_authority_gate.py
          test "$(git rev-parse HEAD:src)" = 3446aa1d0d80861b22f7e74c7ad51bcedef4f479
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo 'FCI_CANONICAL_LINEAGE_AWARE_GATE PASS'
