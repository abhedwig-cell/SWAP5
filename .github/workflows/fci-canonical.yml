name: F-CI canonical qualification

on:
  push:
    branches:
      - integration/f-ci-canonical
  pull_request:
    paths:
      - 'src/transaction/**'
      - 'src/runtime/**'
      - 'src/adapter/**'
      - 'src/legacy/**'
      - 'tests/transaction/**'
      - 'tests/runtime/**'
      - 'tests/fci/**'
      - 'tools/fci/**'
      - 'integration/f-ci/**'
      - 'reference/swap-4.3.1/**'
      - '.github/workflows/fci-canonical.yml'

jobs:
  fci03-transaction-substrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI03 transaction and worker gate
        run: bash tests/fci/run_fci03_gate.sh

  fci04-canonical-runtime:
    needs: fci03-transaction-substrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI04 canonical runtime and seam gate
        run: bash tests/fci/run_fci04_gate.sh

  fci05-b1-10-physical-preimage:
    needs: fci04-canonical-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: F-CI05 static B1.10 physical preimage gate
        run: python tools/fci/fci05_b1_10_physical_preimage_gate.py

  fci06-controlled-source-port:
    needs: fci05-b1-10-physical-preimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI06 controlled source-port and checkpoint gate
        run: bash tests/fci/run_fci06_gate.sh

  fci07-legacy-trial-capsule:
    needs: fci06-controlled-source-port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI07 worker-local legacy trial capsule gate
        run: bash tests/fci/run_fci07_gate.sh

  fci08-transaction-attempt-context:
    needs: fci07-legacy-trial-capsule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI08 transaction attempt-context gate
        run: bash tests/fci/run_fci08_gate.sh

  fci09-b1-10-transaction-binding:
    needs: fci08-transaction-attempt-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI09 B1.10 transaction binding gate
        run: bash tests/fci/run_fci09_gate.sh

  fci10-time-mass-seam:
    needs: fci09-b1-10-transaction-binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI10 time and mass seam gate
        run: bash tests/fci/run_fci10_gate.sh
