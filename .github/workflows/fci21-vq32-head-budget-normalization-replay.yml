name: F-CI21 VQ32 head-budget normalization postimage replay

on:
  workflow_dispatch:
  push:
    branches:
      - integration/f-ci21-temporal-certificate-materialization
    paths:
      - 'tests/fci/run_fci21_vq32_head_budget_normalization_replay.sh'
      - '.github/workflows/fci21-vq32-head-budget-normalization-replay.yml'

jobs:
  independent-semantic-algebra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay exact-linear and budget semantics on materialized postimage
        run: bash tests/fci/run_fci21_vq32_head_budget_normalization_replay.sh semantic

  fresh-nonlinear-production-normalization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Replay fresh 12-case production normalization on materialized postimage
        run: bash tests/fci/run_fci21_vq32_head_budget_normalization_replay.sh nonlinear
