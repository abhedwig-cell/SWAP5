name: F-CI24 F-PM06A reference ET canonical admission

on:
  push:
    branches:
      - qualification/f-ci24-fpm06a-reference-et-canonical-admission

permissions:
  contents: read

jobs:
  replay-pre-admission-canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df435824de175e3f868b680aab2cd0a395aa19ff
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Replay exact F-CI23 canonical baseline authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/fci/fci23_current_lineage_authority_gate.py
          bash tests/fci/run_fci21_closeout_readiness_gate.sh
          test "$(git rev-parse HEAD:src)" = 3446aa1d0d80861b22f7e74c7ad51bcedef4f479
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo 'FCI24_PRE_ADMISSION_CANONICAL_BASELINE=PASS'

  qualify-reference-et-postimage:
    needs: replay-pre-admission-canonical
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI24 forward-lineage admission gate
        run: python tools/fci/fci24_reference_et_canonical_gate.py --mode admission
      - name: Reexecute F-PM06A structural candidate gate
        run: bash tests/fpm/run_fpm06a_reference_et_demand_candidate_gate.sh
      - name: Reexecute F-VQ35 independent scientific gate
        run: bash tests/fvq/run_fvq35_reference_et_demand_qualification.sh
      - name: Final exact postimage check
        shell: bash
        run: |
          set -euo pipefail
          python tools/fci/fci24_reference_et_canonical_gate.py --mode admission
          test "$(git rev-parse HEAD:src)" = 3f701f4b9e04eaf96f5ac44bba22b8e9879ebcba
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo 'FCI24_CANONICAL_ADMISSION_GATE PASS_FPM06A_REFERENCE_ET_POSTIMAGE_READY_FOR_FAST_FORWARD_DECISION'
