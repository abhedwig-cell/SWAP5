name: F-CI26 canonical admission readiness

on:
  push:
    branches:
      - qualification/f-ci26-fmr21-restart-canonical-requalification
  workflow_dispatch:

jobs:
  frozen-fci24-preservation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f49e17c6627717d5dea181808a122f2e35960739
          fetch-depth: 0
      - name: Replay F-CI24 authority and ET qualification
        shell: bash
        run: |
          set -euo pipefail
          python tools/fci/fci24_reference_et_canonical_gate.py --mode canonical
          bash tests/fpm/run_fpm06a_reference_et_demand_candidate_gate.sh
          bash tests/fvq/run_fvq35_reference_et_demand_qualification.sh
          test "$(git rev-parse HEAD:src)" = 3f701f4b9e04eaf96f5ac44bba22b8e9879ebcba
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo 'FCI26_READINESS_FCI24_PRESERVATION=PASS'

  current-fci26-postimage:
    needs: frozen-fci24-preservation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Requalify restart on current postimage
        run: bash tests/fci/run_fci26_restart_canonical_requalification.sh
      - name: Requalify preserved current ET behavior
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fpm/run_fpm06a_reference_et_demand_candidate_gate.sh
          bash tests/fvq/run_fvq35_reference_et_demand_qualification.sh
      - name: Verify future canonical workflow and exact postimage
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'frozen-fci24-reference-et-admission:' .github/workflows/fci-canonical.yml
          grep -Fq 'bash tests/fci/run_fci26_restart_canonical_requalification.sh' .github/workflows/fci-canonical.yml
          grep -Fq 'test "$(git rev-parse HEAD:src)" = c52fb60f61091ee40897b30d0e257110d1ecacc5' .github/workflows/fci-canonical.yml
          test "$(git rev-parse HEAD:src)" = c52fb60f61091ee40897b30d0e257110d1ecacc5
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo 'FCI26_CANONICAL_ADMISSION_READINESS=PASS'
