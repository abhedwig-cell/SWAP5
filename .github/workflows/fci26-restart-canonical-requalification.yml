name: F-CI26 current-canonical restart requalification

on:
  push:
    branches:
      - qualification/f-ci26-fmr21-restart-canonical-requalification
  workflow_dispatch:

jobs:
  restart-canonical-requalification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler provenance
        run: gfortran --version
      - name: Run F-CI26 current-canonical restart gate
        run: bash tests/fci/run_fci26_restart_canonical_requalification.sh
