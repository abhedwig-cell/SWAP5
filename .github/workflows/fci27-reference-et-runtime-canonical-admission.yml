name: F-CI27 F-MR23 reference ET runtime canonical admission

on:
  push:
    branches:
      - qualification/f-ci27-fmr23-reference-et-runtime-canonical-admission

permissions:
  contents: read

jobs:
  replay-pre-admission-canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f49e17c6627717d5dea181808a122f2e35960739
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Replay exact F-CI24 canonical baseline authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/fci/fci24_reference_et_canonical_gate.py --mode canonical
          bash tests/fpm/run_fpm06a_reference_et_demand_candidate_gate.sh
          bash tests/fvq/run_fvq35_reference_et_demand_qualification.sh
          test "$(git rev-parse HEAD:src)" = 3f701f4b9e04eaf96f5ac44bba22b8e9879ebcba
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo 'FCI27_PRE_ADMISSION_CANONICAL_BASELINE=PASS'

  qualify-reference-et-runtime-postimage:
    needs: replay-pre-admission-canonical
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-CI27 forward-lineage admission gate
        run: python tools/fci/fci27_reference_et_runtime_canonical_gate.py --mode admission
      - name: Reexecute F-MR23 owner runtime gate
        run: bash tests/fmr/run_fmr23_reference_et_runtime_binding_gate.sh
      - name: Reexecute F-VQ36 independent runtime qualification
        run: bash tests/fvq/run_fvq36_fmr23_reference_et_runtime_qualification.sh
      - name: Final exact postimage check
        shell: bash
        run: |
          set -euo pipefail
          python tools/fci/fci27_reference_et_runtime_canonical_gate.py --mode admission
          test "$(git rev-parse HEAD:src)" = 4121255813971a360949efc3fb17ab6c8f87a799
          test "$(git rev-parse HEAD:reference)" = 9d08625217d7c0a7385df9da6a04183bcd9cb9e6
          echo 'FCI27_CANONICAL_ADMISSION_GATE PASS_FMR23_REFERENCE_ET_RUNTIME_POSTIMAGE_READY_FOR_FAST_FORWARD_DECISION'
