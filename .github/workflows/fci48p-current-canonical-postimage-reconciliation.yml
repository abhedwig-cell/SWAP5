name: F-CI48P current canonical postimage reconciliation

on:
  push:
    branches:
      - qualification/f-ci48p-current-canonical-postimage-reconciliation
  workflow_dispatch:

jobs:
  exact-head-postimage-reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "FCI48P_EXACT_HEAD_START=PASS:${GITHUB_SHA}"
      - name: Fetch pinned canonical
        shell: bash
        run: git fetch --no-tags origin integration/f-ci-canonical
      - name: Reconcile current canonical postimage
        run: python3 tests/fci/run_fci48p_current_canonical_postimage_reconciliation.py
      - name: Exact head end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "FCI48P_EXACT_HEAD_END=PASS:${GITHUB_SHA}"
