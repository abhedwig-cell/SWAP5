name: F-CI50P R1 exact preservation patch applicator

on:
  push:
    branches:
      - qualification/f-ci50p-current-canonical-postimage-reconciliation-r1

permissions:
  contents: write

jobs:
  apply-exact-preregistered-delta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply exact F-CI50P R1 moving-preservation delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fci-canonical.yml')
          s = p.read_text()
          old_auth = '          AUTH=42544af575db522d012db491db801615577048df\n'
          new_auth = '          AUTH=6c04ab07b4535c119157b5c5bce674b626656f07\n'
          dep_anchor = '            src/runtime/mod_coupling_application_accuracy_adapter.f90\n          )\n'
          dep_repl = ('            src/runtime/mod_coupling_application_accuracy_adapter.f90\n'
                      '            src/runtime/mod_groundwater_coupling_contract.f90\n'
                      '            src/runtime/mod_groundwater_coupling_policy.f90\n'
                      '          )\n')
          marker_anchor = "          echo 'FCI49_MOVING_FKT15_SOLVER_SERVICE_TRANSACTION_COMPOSITION_PRESERVATION=PASS'\n"
          marker_repl = marker_anchor + "          echo 'FCI50_MOVING_FGC17_TYPED_GROUNDWATER_INTERFACE_PRESERVATION=PASS'\n"
          assert s.count(old_auth) == 1, 'AUTH anchor count mismatch'
          assert s.count(dep_anchor) == 1, 'dependency anchor count mismatch'
          assert s.count(marker_anchor) == 1, 'marker anchor count mismatch'
          assert 'mod_groundwater_coupling_contract.f90' not in s, 'contract path already present'
          assert 'mod_groundwater_coupling_policy.f90' not in s, 'policy path already present'
          assert 'FCI50_MOVING_FGC17_TYPED_GROUNDWATER_INTERFACE_PRESERVATION=PASS' not in s, 'FCI50 marker already present'
          out = s.replace(old_auth, new_auth, 1).replace(dep_anchor, dep_repl, 1).replace(marker_anchor, marker_repl, 1)
          assert out.count(new_auth) == 1
          assert out.count('src/runtime/mod_groundwater_coupling_contract.f90') == 1
          assert out.count('src/runtime/mod_groundwater_coupling_policy.f90') == 1
          assert out.count('FCI50_MOVING_FGC17_TYPED_GROUNDWATER_INTERFACE_PRESERVATION=PASS') == 1
          p.write_text(out)
          PY
          git diff --check
      - name: Self-remove applicator and publish exact tree delta
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fci50p-r1-apply.yml
          git diff --check
          git config user.name 'abhedwig-cell'
          git config user.email 'abhedwig@gmail.com'
          git add .github/workflows/fci-canonical.yml
          git commit -m 'F-CI50P R1: advance moving preservation to live canonical base'
          git push origin HEAD:qualification/f-ci50p-current-canonical-postimage-reconciliation-r1
