name: F-CI52 PM08D7 fixed-weir current-canonical admission

on:
  push:
    branches:
      - qualification/f-ci52-fpm08d7-fixed-weir-current-canonical-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact head start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "FCI52_EXACT_HEAD_START=PASS:${GITHUB_SHA}"

      - name: Compiler identity
        run: gfortran --version

      - name: F-CI52 canonical admission gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _fci52_evidence
          git rev-parse HEAD | tee _fci52_evidence/tested-head.txt
          printf '%s\n' eba90d79010b095b6556e93bd8b77a8c28d25560 | tee _fci52_evidence/canonical-base.txt
          printf '%s\n' 8c1617021ec935bc862b6cbc9be4ac6bcc94c51a | tee _fci52_evidence/composition-commit.txt
          printf '%s\n' f65f170fc6ec5f1a228ade2def3732cb36942ebd | tee _fci52_evidence/fvq59-authority.txt
          bash tests/fci/run_fci52_fpm08d7_fixed_weir_canonical_admission.sh | tee _fci52_evidence/admission.log

      - name: Exact head end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "FCI52_EXACT_HEAD_END=PASS:${GITHUB_SHA}"

      - name: Upload F-CI52 admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F-CI52-PM08D7-current-canonical-admission-evidence
          path: _fci52_evidence
          if-no-files-found: warn
