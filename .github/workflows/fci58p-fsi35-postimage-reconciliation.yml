name: F-CI58P F-SI35 postimage reconciliation and preservation

on:
  push:
    branches:
      - qualification/f-ci58p-fsi35-current-canonical-postimage-reconciliation
      - integration/f-ci-canonical
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'src/adapter/mod_b110_production_soil_water_task2.f90'
      - 'src/legacy/b1_10_port/soilwater.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'tests/fci/run_fci58p_fsi35_current_canonical_postimage_reconciliation.sh'
      - 'tests/fci/run_fci93_fsi35_semantic_successor_preservation.sh'
      - 'tests/fci/run_fci93_non_m1_fixed_k_qualification.sh'
      - 'integration/f-ci/F-CI58P_*.json'
      - 'integration/f-ci/F-CI93_STATUS.json'
      - 'integration/f-si/F-SI35_FINAL_COMPLETION.json'
      - '.github/workflows/fci58p-fsi35-postimage-reconciliation.yml'

jobs:
  fsi35-permanent-preservation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Recover exact historical F-SI35 authorities
        run: git fetch --no-tags origin 15ccbf4b6bcf6895b824a68c221762bef0bc08b9 5898e6616dbb6871a9f52d489038235ba1172cae fd93e50da5973f3e15c8f1b7fa57d72df6c31b72 19a67f7c398fcadbcbc9729509680a1c0c5424f3 f4f98637e963e07e2bedf7ef6acbcaab36e07e5a 48336cb7f14e9246b03c23e549fe7354a93f9e6b
      - name: Preserve F-SI35 through admitted semantic successor lineage
        shell: bash
        run: bash tests/fci/run_fci93_fsi35_semantic_successor_preservation.sh

  fci58p-postimage-reconciliation:
    if: github.ref_name == 'qualification/f-ci58p-fsi35-current-canonical-postimage-reconciliation' || github.head_ref == 'qualification/f-ci58p-fsi35-current-canonical-postimage-reconciliation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Reconcile admitted F-SI35 source against historical F-CI58 postimage
        shell: bash
        env:
          FCI58P_MODE: reconciliation
          GH_TOKEN: ${{ github.token }}
        run: bash tests/fci/run_fci58p_fsi35_current_canonical_postimage_reconciliation.sh
