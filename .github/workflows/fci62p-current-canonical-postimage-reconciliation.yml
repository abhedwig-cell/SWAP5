name: F-CI62P current-canonical postimage reconciliation

on:
  push:
    branches:
      - qualification/f-ci62p-current-canonical-postimage-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postimage-reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact postimage qualification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run F-CI62P postimage gate
        run: bash tests/fci/run_fci62p_current_canonical_postimage_reconciliation.sh
