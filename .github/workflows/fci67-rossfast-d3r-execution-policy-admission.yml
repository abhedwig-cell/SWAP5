name: F-CI67 RossFast D3R execution-policy admission

on:
  push:
    branches:
      - qualification/f-ci67-rossfast-d3r-execution-policy-admission
    paths:
      - 'src/runtime/mod_rossfast_d3r_execution_policy.f90'
      - 'tests/fci/test_fci67_rossfast_d3r_execution_policy.f90'
      - 'tests/fci/run_fci67_rossfast_d3r_execution_policy_admission.sh'
      - '.github/workflows/fci67-rossfast-d3r-execution-policy-admission.yml'
      - 'integration/f-ci/F-CI67_STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fci67-rossfast-d3r-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock current canonical and immutable generic runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE=96e810cca678449e0611ea9635ae6ac1209fb5db
          LIVE="$(git ls-remote origin refs/heads/integration/f-ci-canonical | awk '{print $1}')"
          test "$LIVE" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:src/transaction/mod_transaction_reference.f90)" = d5a71a526efaebd82054580c3186f8e3545db331
          test "$(git rev-parse HEAD:src/runtime/mod_canonical_contracts.f90)" = 3cbb81b25626e6574ae83416f088dc52882f91fc
          test "$(git rev-parse HEAD:src/runtime/mod_canonical_interval_runtime.f90)" = b12327aa6e77bdbf4586fe0bed82cf0e7704f237
          test ! -e src/runtime/mod_rossfast_d3r_model_adapter.f90

      - name: Enforce exact F-CI67 admission surface
        shell: bash
        run: |
          set -euo pipefail
          BASE=96e810cca678449e0611ea9635ae6ac1209fb5db
          allowed=(
            .github/workflows/fci67-rossfast-d3r-execution-policy-admission.yml
            integration/f-ci/F-CI67_STATUS.json
            src/runtime/mod_rossfast_d3r_execution_policy.f90
            tests/fci/run_fci67_rossfast_d3r_execution_policy_admission.sh
            tests/fci/test_fci67_rossfast_d3r_execution_policy.f90
          )
          mapfile -t changed < <(git diff --name-only "$BASE..HEAD")
          for path in "${changed[@]}"; do
            ok=0
            for candidate in "${allowed[@]}"; do
              [[ "$path" == "$candidate" ]] && ok=1 && break
            done
            [[ "$ok" -eq 1 ]] || { echo "FCI67_UNEXPECTED_PATH $path" >&2; exit 67; }
          done
          test -z "$(git diff --name-only "$BASE..HEAD" -- reference src/transaction src/runtime/mod_canonical_contracts.f90 src/runtime/mod_canonical_interval_runtime.f90)"

      - name: Bind exact D3R K_RUNTIME research authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-ross01-fast-mfp-feasibility
          git show FETCH_HEAD:integration/f-ross/F-ROSS01_K_RUNTIME_REMAINDER_CLOSEOUT.json > "$RUNNER_TEMP/remainder-closeout.json"
          git show FETCH_HEAD:integration/f-ross/F-ROSS01_K_RUNTIME_REMAINDER_SCHEDULER_CONTRACT.json > "$RUNNER_TEMP/remainder-contract.json"
          test "$(git hash-object "$RUNNER_TEMP/remainder-closeout.json")" = bf5ae8a8eb732ff363f0a462a2141b2991670a9f
          test "$(git hash-object "$RUNNER_TEMP/remainder-contract.json")" = 0ac2003c0a287a03b942b51cd4fbe518db70d9d5
          python3 - "$RUNNER_TEMP/remainder-closeout.json" "$RUNNER_TEMP/remainder-contract.json" <<'PY'
          import json, sys
          closeout=json.load(open(sys.argv[1]))
          contract=json.load(open(sys.argv[2]))
          assert closeout['status']=='CLOSED_POSITIVE_RESTRICTED_RESEARCH'
          assert closeout['scope']=='EXACT_D3R_RESTRICTED_DOMAIN_ONLY'
          assert closeout['qualified']['dyadic_remainder_scheduler_algebra_levels_1_to_8'] is True
          assert closeout['qualified']['hard_mass_accounting_complete'] is True
          assert closeout['production_admission'] is False
          assert contract['full_attempt_indices']==list(range(9))
          assert contract['half_only_index']==9
          assert contract['max_full_attempt_index']==8
          assert contract['retry_rule']['segment_retry_cap']=='8 - segment_index'
          assert contract['retry_rule']['smallest_segment_retry_cap']==0
          assert contract['selection_rule']=='GREEDY_LARGEST_QUALIFIED_DYADIC_DURATION_NOT_EXCEEDING_REMAINDER'
          assert contract['integer_grid']['require_exact_grid_membership'] is True
          PY

      - name: Compiler identity
        run: gfortran --version

      - name: Run F-CI67 current-canonical admission gate
        run: bash tests/fci/run_fci67_rossfast_d3r_execution_policy_admission.sh

      - name: Persist F-CI67 evidence payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          def sh(*args): return subprocess.check_output(args, text=True).strip()
          payload={
            'workunit':'F-CI67',
            'status':'PASS',
            'qualification':'ROSSFAST_D3R_EXECUTION_POLICY_ADMISSION_CANDIDATE',
            'tested_head':sh('git','rev-parse','HEAD'),
            'tested_tree':sh('git','rev-parse','HEAD^{tree}'),
            'canonical_preimage':'96e810cca678449e0611ea9635ae6ac1209fb5db',
            'production_blob':sh('git','hash-object','src/runtime/mod_rossfast_d3r_execution_policy.f90'),
            'immutable_generic_blobs':{
              'transaction':'d5a71a526efaebd82054580c3186f8e3545db331',
              'contracts':'3cbb81b25626e6574ae83416f088dc52882f91fc',
              'interval_runtime':'b12327aa6e77bdbf4586fe0bed82cf0e7704f237'
            },
            'research_authorities':{
              'remainder_closeout':'bf5ae8a8eb732ff363f0a462a2141b2991670a9f',
              'remainder_contract':'0ac2003c0a287a03b942b51cd4fbe518db70d9d5'
            },
            'qualified':{
              'full_attempt_indices_0_to_8_only':True,
              'index_9_half_only_not_selectable':True,
              'greedy_grid_remainder_selection':True,
              'segment_retry_cap_8_minus_index':True,
              'single_outer_publication':True,
              'off_grid_and_oversized_fail_before_transaction':True,
              'smallest_segment_failure_has_zero_retry_budget':True,
              'generic_runtime_unchanged':True
            },
            'nonclaims':[
              'NO_CONCRETE_ROSSFAST_HYDRAULIC_MODEL_ADMISSION',
              'NO_NEW_ROSSFAST_PHYSICS',
              'NO_ARBITRARY_DURATION_GENERALIZATION',
              'NO_RUNTIME_PERFORMANCE_QUALIFICATION',
              'NO_A10_HETEROGENEOUS_BOTTOM_GROUNDWATER_MULTISWAP_FULLRICHARDS_GENERALIZATION'
            ]
          }
          open('F-CI67_EVIDENCE.json','w').write(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload F-CI67 evidence
        uses: actions/upload-artifact@v4
        with:
          name: fci67-rossfast-d3r-execution-policy-${{ github.run_id }}
          path: F-CI67_EVIDENCE.json
