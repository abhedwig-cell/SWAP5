name: F-CI68 bootstrap selector propagation

on:
  push:
    branches:
      - work/f-ci68-fmr-selector-propagation
    paths:
      - 'tools/fci68_apply_selector_propagation.py'
      - '.github/workflows/fci68-fmr-selector-propagation.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-ci68-fmr-selector-propagation
          fetch-depth: 0
      - name: Repair temporary patcher quoting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/fci68_apply_selector_propagation.py')
          t = p.read_text()
          a = "runner = r'''#!/usr/bin/env bash"
          b = 'runner = r"""#!/usr/bin/env bash'
          if t.count(a) != 1:
              raise SystemExit('FCI68_RUNNER_OPEN_DELIMITER_MISMATCH')
          t = t.replace(a, b, 1)
          a = "echo 'FCI68_GENERIC_SELECTOR_PROPAGATION_QUALIFICATION=PASS'\n'''\nPath('tests/fci/run_fci68_fmr_selector_propagation.sh').write_text(runner)"
          b = "echo 'FCI68_GENERIC_SELECTOR_PROPAGATION_QUALIFICATION=PASS'\n\"\"\"\nPath('tests/fci/run_fci68_fmr_selector_propagation.sh').write_text(runner)"
          if t.count(a) != 1:
              raise SystemExit('FCI68_RUNNER_CLOSE_DELIMITER_MISMATCH')
          p.write_text(t.replace(a, b, 1))
          PY
      - name: Apply bounded propagation patchset
        shell: bash
        run: |
          set -o pipefail
          python3 tools/fci68_apply_selector_propagation.py 2>&1 | tee fci68-bootstrap.log
      - name: Persist bootstrap diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fci68-bootstrap-diagnostic-${{ github.run_id }}
          path: fci68-bootstrap.log
          if-no-files-found: error
      - name: Qualify candidate before persistence
        run: bash tests/fci/run_fci68_fmr_selector_propagation.sh
      - name: Enforce bounded delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/kernel/mod_kernel_transactions.f90',
              'src/runtime/mod_fmr_checkpoint_orchestrator.f90',
              'src/runtime/mod_fmr_serialized_reference_backend.f90',
              'src/runtime/mod_fmr_serialized_multiswap_runtime.f90',
              'tests/fci/run_fci68_fmr_selector_propagation.sh',
              '.github/workflows/fci68-fmr-selector-propagation.yml',
              'tools/fci68_apply_selector_propagation.py',
          }
          status = subprocess.check_output(['git','status','--porcelain'], text=True)
          seen=[]
          for line in status.splitlines():
              path=line[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              seen.append(path)
          extra=sorted(set(seen)-allowed)
          if extra: raise SystemExit('FCI68_UNEXPECTED_TREE_DELTA ' + ' '.join(extra))
          print('FCI68_BOUNDED_TREE_DELTA=' + ','.join(sorted(seen)))
          PY
      - name: Persist qualified patchset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'F-CI68: propagate canonical selector through serialized FMR seam'
          git push origin HEAD:work/f-ci68-fmr-selector-propagation
