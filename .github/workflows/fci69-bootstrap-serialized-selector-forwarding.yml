name: F-CI69 bootstrap serialized selector forwarding

on:
  push:
    branches:
      - qualification/f-ci69-fmr-serialized-selector-forwarding
    paths:
      - 'tools/fci69_apply_serialized_selector_forwarding.py'
      - '.github/workflows/fci69-bootstrap-serialized-selector-forwarding.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualification/f-ci69-fmr-serialized-selector-forwarding
          fetch-depth: 0

      - name: Apply bounded backend forwarding patch
        run: python3 tools/fci69_apply_serialized_selector_forwarding.py

      - name: Enforce generic forwarding only
        shell: bash
        run: |
          set -euo pipefail
          B=src/runtime/mod_fmr_serialized_reference_backend.f90
          grep -Fq 'use mod_canonical_interval_runtime, only: canonical_subinterval_target_selector' "$B"
          grep -Fq 'procedure(canonical_subinterval_target_selector), optional :: target_selector' "$B"
          grep -Fq 'diagnostics, target_selector)' "$B"
          if grep -Eqi 'ROSSFAST|ROSS01' "$B"; then
            echo 'FCI69_BACKEND_CONTAINS_ROSSFAST_SPECIFIC_POLICY' >&2
            exit 69
          fi
          git diff --check -- "$B"

      - name: Replay current-canonical absent-selector serialized FMR regression
        id: fmr44r
        shell: bash
        run: |
          set +e
          PATCHER=tests/fmr/_apply_fmr44r_serialized_qbot_runtime_patch.py
          RUNNER=tests/fmr/run_fmr44r_serialized_prescribed_qbot_gate.sh
          cp "$PATCHER" "$RUNNER_TEMP/fmr44r-patcher.py"
          cp "$RUNNER" "$RUNNER_TEMP/fmr44r-runner.sh"
          printf '%s\n' "print('FCI69_CURRENT_CANONICAL_FMR44R_PATCH_STEP_SKIPPED=PASS')" > "$PATCHER"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/fmr/run_fmr44r_serialized_prescribed_qbot_gate.sh')
          t=p.read_text()
          old='  src/runtime/mod_fmr_runtime_core.f90\n'
          new='  src/runtime/mod_fmr_runtime_core.f90\n  src/runtime/mod_fmr_bottom_thermal_carrier.f90\n'
          if t.count(old) != 1:
              raise SystemExit('FCI69_FMR44R_RUNNER_ANCHOR_MISMATCH')
          p.write_text(t.replace(old,new,1))
          PY
          bash "$RUNNER" > fci69-fmr44r.log 2>&1
          rc=$?
          cp "$RUNNER_TEMP/fmr44r-patcher.py" "$PATCHER"
          cp "$RUNNER_TEMP/fmr44r-runner.sh" "$RUNNER"
          cat fci69-fmr44r.log
          exit "$rc"

      - name: Upload FMR44R diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fci69-fmr44r-diagnostic-${{ github.run_id }}
          path: fci69-fmr44r.log
          if-no-files-found: error

      - name: Enforce bounded source delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {'src/runtime/mod_fmr_serialized_reference_backend.f90'}
          status = subprocess.check_output(['git','status','--porcelain'], text=True)
          seen=[]
          for line in status.splitlines():
              path=line[3:]
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              seen.append(path)
          extra=sorted(set(seen)-allowed)
          if extra:
              raise SystemExit('FCI69_UNEXPECTED_WORKTREE_DELTA ' + ' '.join(extra))
          if set(seen) != allowed:
              raise SystemExit('FCI69_EXPECTED_BACKEND_DELTA_MISSING ' + ' '.join(seen))
          print('FCI69_BOUNDED_SOURCE_DELTA=PASS')
          PY

      - name: Persist qualified backend patch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/mod_fmr_serialized_reference_backend.f90
          git diff --cached --check
          git commit -m 'F-CI69: forward canonical selector through serialized FMR backend'
          git push origin HEAD:qualification/f-ci69-fmr-serialized-selector-forwarding
