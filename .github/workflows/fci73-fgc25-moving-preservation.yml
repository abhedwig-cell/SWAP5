name: F-CI73 F-GC25 moving preservation

on:
  push:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'src/runtime/mod_groundwater_*.f90'
      - 'tests/fgc/**'
      - 'tests/qualification/fvq87/**'
      - 'qualification/F-VQ87_STATUS.json'
      - 'integration/f-ci/F-CI73_STATUS.json'
      - 'integration/f-ci/F-CI73P_STATUS.json'
      - '.github/workflows/fci73-fgc25-moving-preservation.yml'
  pull_request:
    paths:
      - 'src/runtime/mod_groundwater_*.f90'
      - 'tests/fgc/**'
      - 'tests/qualification/fvq87/**'
      - 'qualification/F-VQ87_STATUS.json'
      - 'integration/f-ci/F-CI73_STATUS.json'
      - 'integration/f-ci/F-CI73P_STATUS.json'
      - '.github/workflows/fci73-fgc25-moving-preservation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-fgc25:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve admitted F-GC25 authority surface
        shell: bash
        run: |
          set -euo pipefail
          ADMISSION=c53b4e4e966a6b0531e1e6224b2f8f1d7e02ece1
          FVQ87=37c02ac3747bfaacdb8b3408b8228f3deb2b9824
          OWNER=43c9f09110dea83928ef7d58990c37575d8ca223
          git merge-base --is-ancestor "$ADMISSION" HEAD
          declare -A BLOBS=(
            [src/runtime/mod_groundwater_tile_aggregation.f90]=d62ecba039d9bef178acde6900b81e9d5b0931eb
            [src/runtime/mod_groundwater_accuracy_binding.f90]=b8ac03e810c73519b433f7851c6fd143ba26676a
            [src/runtime/mod_groundwater_multiswap_types.f90]=35f475228886bf04d64efb13bbd84a42bc2678ad
            [src/runtime/mod_groundwater_multiswap_topology.f90]=2ce4e9f7083c46e7040493d3029abfc233f59f16
            [src/runtime/mod_groundwater_multiswap_swap_phase.f90]=9a69effc9433363e52fcf8d5b40fa2c5d01347a9
            [src/runtime/mod_groundwater_multiswap_transaction.f90]=d7d9fa81d9d3d5e619e51625f202a8e425807eda
            [src/runtime/mod_groundwater_multiswap_publication.f90]=02bc938fac28231c2c1234dd4ac3c3f8ba617983
            [src/runtime/mod_groundwater_multiswap_coupler.f90]=f2bf0e7d144fd3c0b9dc18f24f24eb4ffb7ffa0f
            [src/runtime/mod_coupling_application_accuracy_contract.f90]=c07d573d21e7d013ab962c0a9d28102ab7b5cdfc
            [src/runtime/mod_coupling_application_accuracy_adapter.f90]=9212d600e89c85287e9280832c7e0a94befb642e
            [src/runtime/mod_groundwater_coupling_policy.f90]=5e6fa9db6ddf60d3fc70ed4cec9a33858b0f9976
          )
          for path in "${!BLOBS[@]}"; do
            test "$(git rev-parse "HEAD:$path")" = "${BLOBS[$path]}"
          done
          owner_paths=(
            tests/fgc/mod_fgc25_multiswap_fixture.f90
            tests/fgc/run_fgc25_multiswap_groundwater_composition_gate.sh
            tests/fgc/test_fgc25_corrector_tile_fail_closed.f90
            tests/fgc/test_fgc25_multicell_isolation.f90
            tests/fgc/test_fgc25_multiswap_commit.f90
            tests/fgc/test_fgc25_multiswap_qualification.f90
            tests/fgc/test_fgc25_permutation_determinism.f90
            tests/fgc/test_fgc25_single_tile_equivalence.f90
          )
          for path in "${owner_paths[@]}"; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$OWNER:$path")"
          done
          fvq_paths=(
            qualification/F-VQ87_STATUS.json
            tests/qualification/fvq87/run_fvq87_fgc25_multiswap_independent_gate.sh
            tests/qualification/fvq87/test_fvq87_fgc25_multiswap_independent.f90
          )
          for path in "${fvq_paths[@]}"; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$FVQ87:$path")"
          done
          python3 -m json.tool qualification/F-VQ87_STATUS.json >/dev/null
          python3 -m json.tool integration/f-ci/F-CI73_STATUS.json >/dev/null
          if test -f integration/f-ci/F-CI73P_STATUS.json; then
            python3 -m json.tool integration/f-ci/F-CI73P_STATUS.json >/dev/null
            grep -Fq '"decision": "QUALIFIED_F_CI73P_CURRENT_CANONICAL_POSTIMAGE_RECONCILIATION"' integration/f-ci/F-CI73P_STATUS.json
            grep -Fq '"production_canonical_admitted": true' integration/f-ci/F-CI73P_STATUS.json
            grep -Fq '"postimage_reconciled": true' integration/f-ci/F-CI73P_STATUS.json
            grep -Fq '"moving_preservation_installed": true' integration/f-ci/F-CI73P_STATUS.json
          fi
          if grep -Eq 'use[[:space:]]+mod_reference_richards_temporal_indicator|use[[:space:]]+mod_groundwater_accuracy_binding' src/runtime/mod_groundwater_multiswap_*.f90; then
            echo 'FCI73_MOVING_GC22_DEPENDENCY_BOUNDARY=FAIL' >&2
            exit 21
          fi
          echo 'FCI73_MOVING_FGC25_AUTHORITY_PRESERVATION=PASS'
          echo 'FCI73_MOVING_FGC20_FGC22_INHERITANCE=PASS'
          echo 'FCI73_MOVING_FVQ87_EVIDENCE=PASS'
