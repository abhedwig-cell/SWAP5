name: F-CI96 F-ROSS12 postimage preservation

on:
  push:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_rossfast_solver_selection_binding.f90'
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'src/solver/mod_rossfast_d3r_soil_water_solver.f90'
      - 'tests/ross/**'
      - 'tests/eb/**'
      - 'tests/publication/test_pub_p2e01_solver_seam_paired_pilot.f90'
      - 'tests/fci/run_fci96_fross12_postimage_preservation.sh'
      - 'tests/fci/run_fci96_p2e05_semantic_successor_preservation.sh'
      - 'docs/publication/P2E05_SOLVER_RESIDUAL_CONTRACT_PREREGISTRATION.json'
      - 'docs/publication/P2E05_SOLVER_RESIDUAL_CONTRACT_RESULT.json'
      - 'integration/f-ci/F-CI96_STATUS.json'
      - 'integration/f-ross/F-ROSS12_STATUS.json'
      - '.github/workflows/fci-canonical.yml'
      - '.github/workflows/fci72-eb-i23-moving-preservation.yml'
      - '.github/workflows/fci74-eb-i24-moving-preservation.yml'
      - '.github/workflows/fci79-eb-i25-moving-preservation.yml'
      - '.github/workflows/fci96-fross12-postimage-preservation.yml'
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_rossfast_solver_selection_binding.f90'
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'src/solver/mod_rossfast_d3r_soil_water_solver.f90'
      - 'tests/ross/**'
      - 'tests/eb/**'
      - 'tests/publication/test_pub_p2e01_solver_seam_paired_pilot.f90'
      - 'tests/fci/run_fci96_fross12_postimage_preservation.sh'
      - 'tests/fci/run_fci96_p2e05_semantic_successor_preservation.sh'
      - 'docs/publication/P2E05_SOLVER_RESIDUAL_CONTRACT_PREREGISTRATION.json'
      - 'docs/publication/P2E05_SOLVER_RESIDUAL_CONTRACT_RESULT.json'
      - 'integration/f-ci/F-CI96_STATUS.json'
      - 'integration/f-ross/F-ROSS12_STATUS.json'
      - '.github/workflows/fci-canonical.yml'
      - '.github/workflows/fci72-eb-i23-moving-preservation.yml'
      - '.github/workflows/fci74-eb-i24-moving-preservation.yml'
      - '.github/workflows/fci79-eb-i25-moving-preservation.yml'
      - '.github/workflows/fci96-fross12-postimage-preservation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-fross12-postimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Reconcile exact postimage or qualified P2E05 semantic successor
        run: |
          FROSS12_AUTH=786fe5bf59e616dcfa9a86b16b58c67ac0b3b97d
          if [[ "$(git rev-parse HEAD:src)" == "$(git rev-parse "$FROSS12_AUTH:src")" ]] && \
             [[ "$(git rev-parse HEAD:reference)" == "$(git rev-parse "$FROSS12_AUTH:reference")" ]]; then
            bash tests/fci/run_fci96_fross12_postimage_preservation.sh
          else
            bash tests/fci/run_fci96_p2e05_semantic_successor_preservation.sh
          fi
