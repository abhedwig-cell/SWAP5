name: F-DOC03 RB1 core capability traceability qualification

on:
  push:
    branches:
      - work/f-doc03-rb1-core-capability-traceability

permissions:
  contents: read
  actions: read

jobs:
  rb1-core-traceability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch immutable source and RB1 authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/integration/f-ci-canonical:refs/remotes/origin/integration/f-ci-canonical \
            refs/heads/release/f-rb01-restricted-production-baseline-v1:refs/remotes/origin/release/f-rb01-restricted-production-baseline-v1 \
            refs/heads/release/f-rb02-restricted-production-baseline-v1-final-authority:refs/remotes/origin/release/f-rb02-restricted-production-baseline-v1-final-authority
          git cat-file -e 0aeb0a2ed4096e1f9493d3dabc70962ea5270182^{commit}
          git cat-file -e aeb74560d801c4ac7314df7b8845fcc5daf8bba6^{commit}
          git cat-file -e b52e4dc5ff1c16ccaf11853cc085c7099e17ccc0^{commit}
          git cat-file -e 18942fee83eb385fccc1663230772ae03dcc9ae6^{commit}

      - name: Verify definitive F-RB02 exact-head authority live
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/34586202805" \
            > _fdoc03_frb02_run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('_fdoc03_frb02_run.json').read_text())
          assert x['head_sha'] == 'b52e4dc5ff1c16ccaf11853cc085c7099e17ccc0', x['head_sha']
          assert x['status'] == 'completed', x['status']
          assert x['conclusion'] == 'success', x['conclusion']
          assert x['path'] == '.github/workflows/frb02-final-release-authority.yml', x['path']
          print('FDOC03_FRB02_EXACT_HEAD_LIVE=PASS')
          PY

      - name: Validate bounded core traceability
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/validate_fdoc03_core_traceability.py | tee _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_EXACT_FIVE_CORE_CAPABILITIES=PASS' _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_NONEXISTENT_DIRECT_RUNTIME_TEST_REJECTED=PASS' _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_CORE_MASS_T1_EXPLICIT_GAP=PASS' _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_NO_STATUS_A_READY_CLAIM=PASS' _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_ZERO_PRODUCTION_DELTA=PASS' _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_ZERO_REFERENCE_DELTA=PASS' _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_INVARIANTS_30_OF_30_PASS=PASS' _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_HARD_MASS_UNCHANGED=PASS' _fdoc03_validator_stdout.txt
          grep -Fq 'FDOC03_DECISION_IF_WORKFLOW_GREEN=QUALIFIED_BOUNDED_RB1_CORE_TRACEABILITY_POPULATION_WITH_EXPLICIT_GAPS' _fdoc03_validator_stdout.txt

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdoc03-core-traceability-evidence-${{ github.sha }}
          path: |
            _fdoc03_frb02_run.json
            _fdoc03_validator_stdout.txt
            _fdoc03_core_traceability_evidence.json
            docs/scientific/F-DOC03_RB1_CORE_CAPABILITY_TRACEABILITY.md
            docs/scientific/registries/rb1-core-capability-traceability.json
            integration/f-doc/F-DOC03_INVARIANT_AUDIT.json
            integration/f-doc/F-DOC03_STATUS.json
          if-no-files-found: warn
          retention-days: 90
