name: F-DOC11 RB1 controlled theory formal gap decomposition

on:
  push:
    branches:
      - work/f-doc11-rb1-controlled-theory-formal-gap-decomposition

permissions:
  contents: read
  actions: read

jobs:
  controlled-theory-formal-gap-decomposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact authority lineages
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/work/f-doc10-rb1-post-t11-aggregate-reconciliation:refs/remotes/origin/work/f-doc10-rb1-post-t11-aggregate-reconciliation \
            refs/heads/integration/f-ci-canonical:refs/remotes/origin/integration/f-ci-canonical \
            refs/heads/release/f-rb01-restricted-production-baseline-v1:refs/remotes/origin/release/f-rb01-restricted-production-baseline-v1 \
            refs/heads/release/f-rb02-restricted-production-baseline-v1-final-authority:refs/remotes/origin/release/f-rb02-restricted-production-baseline-v1-final-authority
          for sha in \
            ef34a9f5a01d78ff9c2628315b484c5a8ff4f717 \
            0aeb0a2ed4096e1f9493d3dabc70962ea5270182 \
            aeb74560d801c4ac7314df7b8845fcc5daf8bba6 \
            b52e4dc5ff1c16ccaf11853cc085c7099e17ccc0; do
            git cat-file -e "${sha}^{commit}"
          done
          test "$(git merge-base ef34a9f5a01d78ff9c2628315b484c5a8ff4f717 HEAD)" = "ef34a9f5a01d78ff9c2628315b484c5a8ff4f717"

      - name: Verify immutable upstream workflow evidence live
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            '34643802413 ef34a9f5a01d78ff9c2628315b484c5a8ff4f717 .github/workflows/fdoc10-rb1-post-t11-aggregate-reconciliation.yml' \
            '34586202805 b52e4dc5ff1c16ccaf11853cc085c7099e17ccc0 .github/workflows/frb02-final-release-authority.yml'; do
            set -- $spec
            run="$1"; sha="$2"; path="$3"
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run}" \
              > "_fdoc11_run_${run}.json"
            python3 - "$run" "$sha" "$path" <<'PY'
          import json, pathlib, sys
          run, sha, path = sys.argv[1:]
          x = json.loads(pathlib.Path(f'_fdoc11_run_{run}.json').read_text())
          assert x['head_sha'] == sha, (x['head_sha'], sha)
          assert x['status'] == 'completed', x['status']
          assert x['conclusion'] == 'success', x['conclusion']
          assert x['path'] == path, (x['path'], path)
          print(f'FDOC11_UPSTREAM_RUN_{run}=PASS')
          PY
          done

      - name: Validate bounded theory formal gap decomposition
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/validate_fdoc11_controlled_theory_formal_gap_decomposition.py | tee _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_DENOMINATOR_15=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_CAPABILITIES_EXACT_ONCE=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_NO_T0_T7_RESOLUTION=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_NO_FULLY_TRACED_PROMOTION=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_NO_STATUS_A_PROMOTION=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_BOUNDED_CHANGED_PATHS=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_ZERO_PRODUCTION_DELTA=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_ZERO_REFERENCE_DELTA=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_INVARIANTS_30_OF_30_PASS=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_HARD_MASS_UNCHANGED=PASS' _fdoc11_validator_stdout.txt
          grep -Fq 'FDOC11_DECISION_IF_WORKFLOW_GREEN=QUALIFIED_RB1_CONTROLLED_THEORY_FORMAL_GAP_DECOMPOSITION_WITH_ZERO_TIER_PROMOTION' _fdoc11_validator_stdout.txt

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdoc11-controlled-theory-formal-gap-decomposition-evidence-${{ github.sha }}
          path: |
            _fdoc11_run_34643802413.json
            _fdoc11_run_34586202805.json
            _fdoc11_validator_stdout.txt
            _fdoc11_controlled_theory_formal_gap_decomposition_evidence.json
            docs/scientific/registries/rb1-controlled-theory-formal-gap-decomposition.json
            docs/scientific/F-DOC11_RB1_CONTROLLED_THEORY_FORMAL_GAP_DECOMPOSITION.md
            integration/f-doc/F-DOC11_STATUS.json
            integration/f-doc/F-DOC11_INVARIANT_AUDIT.json
            integration/f-doc/F-DOC11_CLOSEOUT.json
          if-no-files-found: warn
          retention-days: 90
