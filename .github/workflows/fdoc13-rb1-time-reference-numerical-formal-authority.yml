name: F-DOC13 RB1 TIME-REFERENCE numerical/formal authority

on:
  push:
    branches:
      - work/f-doc13-rb1-time-reference-numerical-formal-authority

permissions:
  contents: read
  actions: read

jobs:
  time-reference-numerical-formal-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact authority lineages
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/work/f-doc12-rb1-runtime-architecture-tier-applicability:refs/remotes/origin/work/f-doc12-rb1-runtime-architecture-tier-applicability \
            refs/heads/work/f-doc08-rb1-time-reference-t11-traceability:refs/remotes/origin/work/f-doc08-rb1-time-reference-t11-traceability \
            refs/heads/work/f-si24-bounded-stiffness-aware-temporal-indicator:refs/remotes/origin/work/f-si24-bounded-stiffness-aware-temporal-indicator \
            refs/heads/qualification/f-vq30-bounded-stiffness-aware-temporal-indicator:refs/remotes/origin/qualification/f-vq30-bounded-stiffness-aware-temporal-indicator \
            refs/heads/work/f-si25-accepted-state-operator-indicator-seam:refs/remotes/origin/work/f-si25-accepted-state-operator-indicator-seam \
            refs/heads/work/f-si26-richards-temporal-indicator-scientific-normalization:refs/remotes/origin/work/f-si26-richards-temporal-indicator-scientific-normalization \
            refs/heads/qualification/f-vq34-remediated-richards-head-budget-certificate:refs/remotes/origin/qualification/f-vq34-remediated-richards-head-budget-certificate \
            refs/heads/integration/f-ci-canonical:refs/remotes/origin/integration/f-ci-canonical \
            refs/heads/release/f-rb01-restricted-production-baseline-v1:refs/remotes/origin/release/f-rb01-restricted-production-baseline-v1 \
            refs/heads/release/f-rb02-restricted-production-baseline-v1-final-authority:refs/remotes/origin/release/f-rb02-restricted-production-baseline-v1-final-authority
          for sha in \
            e34caabe225986db3c60551f4168869f3e4cc2a2 \
            8e5863510004ec11ab377b5bc9d3bd5df6d69777 \
            546b16a8dcc12acf7e213ced593668e769ddc870 \
            c83abe23bff2005c6211cf45d0a1c46738e08b7e \
            bb51a0700bcf1484066b2c38d699654e697c007b \
            d487641bee37940085df03bca07d956fc4a017a7 \
            df9b1123ba33ece022ce6649e70dcb538e44837f \
            31e3f85ae83fe8bab9554da5467de0598446c0bd \
            0aeb0a2ed4096e1f9493d3dabc70962ea5270182 \
            aeb74560d801c4ac7314df7b8845fcc5daf8bba6 \
            b52e4dc5ff1c16ccaf11853cc085c7099e17ccc0; do
            git cat-file -e "${sha}^{commit}"
          done
          test "$(git merge-base e34caabe225986db3c60551f4168869f3e4cc2a2 HEAD)" = "e34caabe225986db3c60551f4168869f3e4cc2a2"

      - name: Verify immutable upstream workflow evidence live
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            '34647684223 e34caabe225986db3c60551f4168869f3e4cc2a2 .github/workflows/fdoc12-rb1-runtime-architecture-tier-applicability.yml' \
            '34327204626 546b16a8dcc12acf7e213ced593668e769ddc870 .github/workflows/fsi24-gate-b-exact-manufactured-bound.yml' \
            '34332303346 c83abe23bff2005c6211cf45d0a1c46738e08b7e .github/workflows/fvq30-heldout-stiffness-indicator.yml' \
            '34338272775 bb51a0700bcf1484066b2c38d699654e697c007b .github/workflows/fsi25-reference-indicator-production-seam.yml' \
            '34349176535 d487641bee37940085df03bca07d956fc4a017a7 .github/workflows/fsi26-head-budget-semantics.yml' \
            '34364081068 31e3f85ae83fe8bab9554da5467de0598446c0bd .github/workflows/fvq34-remediated-richards-head-budget-certificate.yml' \
            '34642744759 8e5863510004ec11ab377b5bc9d3bd5df6d69777 .github/workflows/fdoc08-rb1-time-reference-t11-traceability.yml' \
            '34570204719 aeb74560d801c4ac7314df7b8845fcc5daf8bba6 .github/workflows/frb01-release-qualification.yml'; do
            set -- $spec
            run="$1"; sha="$2"; path="$3"
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run}" \
              > "_fdoc13_run_${run}.json"
            python3 - "$run" "$sha" "$path" <<'PY'
          import json, pathlib, sys
          run, sha, path = sys.argv[1:]
          x = json.loads(pathlib.Path(f'_fdoc13_run_{run}.json').read_text())
          assert x['head_sha'] == sha, (run, x['head_sha'], sha)
          assert x['status'] == 'completed', (run, x['status'])
          assert x['conclusion'] == 'success', (run, x['conclusion'])
          assert x['path'] == path, (run, x['path'], path)
          print(f'FDOC13_UPSTREAM_RUN_{run}=PASS')
          PY
          done

      - name: Validate restricted TIME-REFERENCE numerical authority
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/validate_fdoc13_time_reference_numerical_formal_authority.py | tee _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_TIME_REFERENCE_CAPABILITY_EXACT=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_T0_T7_ALL_EXPLICIT=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_EXACT_LINEAR_SCOPE_PRESERVED=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_NO_GENERAL_NONLINEAR_BOUND=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_NO_NUMERIC_OR_UNIVERSAL_H_BUDGET=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_HARD_MASS_PRECEDENCE_PRESERVED=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_SOURCE_PINS_EXACT=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_UPSTREAM_EVIDENCE_PINS_EXACT=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_BOUNDED_CHANGED_PATHS=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_ZERO_PRODUCTION_REFERENCE_DELTA=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_NO_FULLY_TRACED_OR_STATUS_A_PROMOTION=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_INVARIANTS_30_OF_30_PASS=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_HARD_MASS_UNCHANGED=PASS' _fdoc13_validator_stdout.txt
          grep -Fq 'FDOC13_DECISION_IF_WORKFLOW_GREEN=QUALIFIED_RB1_TIME_REFERENCE_RESTRICTED_T0_T7_NUMERICAL_FORMAL_AUTHORITY_WITH_EXPLICIT_APPLICATION_ACCURACY_NONCLAIM' _fdoc13_validator_stdout.txt

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdoc13-time-reference-numerical-formal-evidence-${{ github.sha }}
          path: |
            _fdoc13_run_34647684223.json
            _fdoc13_run_34327204626.json
            _fdoc13_run_34332303346.json
            _fdoc13_run_34338272775.json
            _fdoc13_run_34349176535.json
            _fdoc13_run_34364081068.json
            _fdoc13_run_34642744759.json
            _fdoc13_run_34570204719.json
            _fdoc13_validator_stdout.txt
            _fdoc13_time_reference_evidence.json
            docs/scientific/registries/rb1-time-reference-numerical-formal-authority.json
            docs/scientific/F-DOC13_RB1_TIME_REFERENCE_NUMERICAL_FORMAL_AUTHORITY.md
            integration/f-doc/F-DOC13_STATUS.json
            integration/f-doc/F-DOC13_INVARIANT_AUDIT.json
            integration/f-doc/F-DOC13_CLOSEOUT.json
          if-no-files-found: warn
          retention-days: 90
