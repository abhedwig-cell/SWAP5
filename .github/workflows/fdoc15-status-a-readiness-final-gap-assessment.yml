name: F-DOC15 Status-A readiness final gap assessment

on:
  push:
    branches:
      - work/f-doc15-rb1-current-canonical-status-a-final-gap-assessment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact head start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
          echo "FDOC15_EXACT_HEAD_START=PASS:$GITHUB_SHA"

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          base=1c63aeede05180d3628873083d9351da6e67175f
          git cat-file -e "$base^{commit}"
          bad="$(git diff --name-only "$base"..HEAD | grep -Ev '^(docs/scientific/F-DOC15_STATUS_A_READINESS_FINAL_GAP_ASSESSMENT\.md|integration/f-doc/F-DOC15_(CLOSURE_BACKLOG\.json|STATUS\.json|CLOSEOUT\.md)|\.github/workflows/fdoc15-status-a-readiness-final-gap-assessment\.yml)$' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          test ! -e integration/f-doc/F-DOC14_STATUS.json
          echo "FDOC15_SCOPE_GUARD=PASS"

      - name: Status and finite backlog gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('integration/f-doc/F-DOC15_STATUS.json').read_text())
          backlog = json.loads(Path('integration/f-doc/F-DOC15_CLOSURE_BACKLOG.json').read_text())

          allowed = {'CLOSED','PARTIAL','STATUS-A GAP','OUT OF SCOPE FOR STATUS-A','NOT APPLICABLE'}
          rows = status['requirement_classifications']
          assert status['schema'] == 'swap5.fdoc15_status.v2'
          assert status['executive_verdict'] == 'NOT_READY'
          assert status['formal_status_a_certification'] == 'NOT_PERFORMED_AND_NOT_CLAIMED'
          assert len(rows) == 22
          assert len({r['requirement'] for r in rows}) == 22
          assert all(r['rb1'] in allowed and r['current'] in allowed for r in rows)
          assert {r['requirement'] for r in rows if r['rb1'] == 'CLOSED'} == {'5.1','5.2'}
          assert {r['requirement'] for r in rows if r['current'] == 'CLOSED'} == {'5.1','5.2'}
          assert status['wur_authority']['controlled_full_text_status'] == 'NOT_OBTAINED'
          assert status['wur_authority']['public_requirement_denominator'] == 22
          assert set(status['qualified_documentation_authorities']) == {f'F-DOC{i:02d}' for i in range(1,14)}
          assert status['excluded_or_noncanonical_documentation']['F-DOC14']['state'] == 'NOT_INDEPENDENT_AUTHORITY'
          assert status['excluded_or_noncanonical_documentation']['F-DOC16']['state'].startswith('QUALIFIED_BRANCH_ONLY')
          assert status['excluded_or_noncanonical_documentation']['F-DOC18']['state'] == 'CANDIDATE_ONLY_UNQUALIFIED'
          assert status['rb1']['release_artifact'] == 'release/f-rb02/F-RB02_CLOSEOUT.json'
          assert status['current_canonical']['snapshot_head'] == 'eba90d79010b095b6556e93bd8b77a8c28d25560'
          assert status['hard_findings']['verification_is_validation'] is False
          assert status['hard_findings']['mass_conservation_relaxed'] is False
          assert backlog['schema'] == 'swap5.fdoc15_closure_backlog.v2'
          assert len(backlog['gaps']) == 10
          assert [g['id'] for g in backlog['gaps']] == status['final_gap_ids']
          assert all(g['missing'] and g['minimal_closure'] and g['owner'] for g in backlog['gaps'])
          print('FDOC15_STATUS_AND_FINITE_BACKLOG=PASS')
          PY

      - name: Pinned authority and canonical-lineage gate
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            999d4fa3da6fa08c5d57e23b9949f3920de37fbe \
            18942fee83eb385fccc1663230772ae03dcc9ae6 \
            0c25d97bd180378a916fbb14a1e45768af9ec63a \
            a703747ce1991c5601b76a84f04969b602298268 \
            919f228d8aedc1029b5080bb019fbe61d2e1d7c6 \
            c20c0fd4c53ef65f3c8d375362908a25f0855a4b \
            492b984bca282d6ec11dcaa727227b34c0ff3a84 \
            8e5863510004ec11ab377b5bc9d3bd5df6d69777 \
            2a4a8738496329001a3c3af9b5e50a9f31d0c44f \
            ef34a9f5a01d78ff9c2628315b484c5a8ff4f717 \
            df438f8d0eaa4117e3e6df13a7061985fe233a16 \
            e34caabe225986db3c60551f4168869f3e4cc2a2 \
            1c63aeede05180d3628873083d9351da6e67175f \
            0aeb0a2ed4096e1f9493d3dabc70962ea5270182 \
            aeb74560d801c4ac7314df7b8845fcc5daf8bba6 \
            b52e4dc5ff1c16ccaf11853cc085c7099e17ccc0 \
            eba90d79010b095b6556e93bd8b77a8c28d25560 \
            b0bdf08b5c38771a4ee22c93ed0949f408ceeb2b \
            448265df8b5a4be8941b688bde378a490751c5f1; do
            git cat-file -e "$sha^{commit}"
          done
          test -f release/f-rb02/F-RB02_CLOSEOUT.json || git show b52e4dc5ff1c16ccaf11853cc085c7099e17ccc0:release/f-rb02/F-RB02_CLOSEOUT.json >/dev/null

          git fetch origin refs/heads/integration/f-ci-canonical:refs/remotes/origin/integration/f-ci-canonical
          current="$(git rev-parse refs/remotes/origin/integration/f-ci-canonical)"
          git merge-base --is-ancestor eba90d79010b095b6556e93bd8b77a8c28d25560 "$current"
          echo "FDOC15_CANONICAL_SNAPSHOT_IS_LIVE_OR_ANCESTOR=PASS:$current"

      - name: Required assessment sections and nonclaims
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/scientific/F-DOC15_STATUS_A_READINESS_FINAL_GAP_ASSESSMENT.md
          grep -q '## Executive verdict' "$doc"
          grep -q '## Requirement-by-requirement readiness matrix' "$doc"
          grep -q '## ST.1 layer-by-layer theory-to-evidence traceability' "$doc"
          grep -q '## Representative end-to-end capability audit' "$doc"
          grep -q '## Canonical-authority architecture' "$doc"
          grep -q '## Final gap register' "$doc"
          grep -q '## Minimal closure plan' "$doc"
          grep -q '## Deferred post-Status-A improvements' "$doc"
          grep -q 'never self-certifies Status A' "$doc"
          grep -q 'Verification was not relabelled as validation' integration/f-doc/F-DOC15_CLOSEOUT.md
          grep -q 'QUALIFIED_STATUS_A_READINESS_GAP_ASSESSMENT_AND_CLOSURE_PLAN_ESTABLISHED' integration/f-doc/F-DOC15_CLOSEOUT.md
          echo "FDOC15_REQUIRED_PRODUCTS_AND_NONCLAIMS=PASS"

      - name: Exact head end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
          echo "FDOC15_EXACT_HEAD_END=PASS:$GITHUB_SHA"
