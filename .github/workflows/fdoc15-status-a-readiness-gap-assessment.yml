name: F-DOC15 R1 Status-A readiness reconciliation

on:
  push:
    branches:
      - work/f-doc15-status-a-readiness-final-gap-assessment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact head start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
          echo "FDOC15_R1_EXACT_HEAD_START=PASS:$GITHUB_SHA"

      - name: Qualified lineage and bounded-delta guard
        shell: bash
        run: |
          set -euo pipefail
          prior=1c4d97de16cf6d1eaf6289e920a32c4167536060
          fdoc16=b0bdf08b5c38771a4ee22c93ed0949f408ceeb2b
          fdoc18=bddb43d821fd757a307aad88528464dd0c89a484
          git merge-base --is-ancestor "$prior" HEAD
          git merge-base --is-ancestor "$fdoc16" HEAD
          git merge-base --is-ancestor "$fdoc18" HEAD
          changed="$(git diff --name-only "$fdoc18"..HEAD)"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src|reference)/'; then
            echo "F-DOC15 R1 may not change production source or reference data" >&2
            exit 1
          fi
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(docs/scientific/F-DOC15_STATUS_A_READINESS_FINAL_GAP_ASSESSMENT\.md|docs/scientific/registries/F-DOC15_STATUS\.json|docs/scientific/registries/fdoc15-status-a-readiness-gap-assessment\.json|tools/docs/validate_fdoc15_status_a_readiness\.py|\.github/workflows/fdoc15-status-a-readiness-gap-assessment\.yml)$' || true)"
          test -z "$bad" || { echo "$bad" >&2; exit 1; }
          echo "FDOC15_R1_LINEAGE_AND_SCOPE=PASS"
          echo "FDOC15_R1_ZERO_PRODUCTION_REFERENCE_DELTA=PASS"

      - name: Validate reconciled readiness assessment
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/validate_fdoc15_status_a_readiness.py | tee _fdoc15_r1_validator_stdout.txt
          grep -Fq 'FDOC15_R1_DENOMINATOR_22_EXACT=PASS' _fdoc15_r1_validator_stdout.txt
          grep -Fq 'FDOC15_R1_LINEAGE_RECONCILED=PASS' _fdoc15_r1_validator_stdout.txt
          grep -Fq 'FDOC15_R1_SCI_FOUND_01_CLOSED=PASS' _fdoc15_r1_validator_stdout.txt
          grep -Fq 'FDOC15_R1_PHYSICAL_SCIENCE_T0_T7_CLOSED=PASS' _fdoc15_r1_validator_stdout.txt
          grep -Fq 'FDOC15_R1_HYBRID_T0_T7_REMAINS_EXACTLY_2=PASS' _fdoc15_r1_validator_stdout.txt
          grep -Fq 'FDOC15_R1_NO_STATUS_A_CERTIFICATION=PASS' _fdoc15_r1_validator_stdout.txt
          grep -Fq 'FDOC15_R1_ARCHITECTURE_30_NO_ADVERSE_DELTA=PASS' _fdoc15_r1_validator_stdout.txt

      - name: Verify immutable RB1 release authority object
        shell: bash
        run: |
          set -euo pipefail
          rb1=b52e4dc5ff1c16ccaf11853cc085c7099e17ccc0
          git fetch --no-tags origin "$rb1" >/dev/null 2>&1 || true
          git cat-file -e "$rb1^{commit}"
          git show "$rb1:release/f-rb02/F-RB02_CLOSEOUT.json" >/dev/null
          echo "FDOC15_R1_RB1_RELEASE_AUTHORITY=PASS:$rb1"

      - name: Verify current-canonical snapshot remains in canonical lineage
        shell: bash
        run: |
          set -euo pipefail
          snapshot=eba90d79010b095b6556e93bd8b77a8c28d25560
          git fetch --no-tags origin integration/f-ci-canonical >/dev/null
          live="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "$snapshot^{commit}"
          git merge-base --is-ancestor "$snapshot" "$live"
          echo "FDOC15_R1_CURRENT_SNAPSHOT_LINEAGE=PASS:snapshot=$snapshot:live=$live"

      - name: Exact head end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
          echo "FDOC15_R1_EXACT_HEAD_END=PASS:$GITHUB_SHA"

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdoc15-r1-status-a-readiness-${{ github.sha }}
          path: _fdoc15_r1_validator_stdout.txt
