name: F-GC07 temporal coupling qualification

on:
  push:
    branches:
      - work/f-gc07-coupling-temporal-error-budget
    paths:
      - 'tests/fgc/test_fgc07_temporal_coupling.f90'
      - 'tests/fgc/run_fgc07_temporal_coupling.sh'
      - 'tools/fgc/fgc07_analyze.py'
      - 'tools/fgc/fgc07_decompose.py'
      - 'integration/f-gc/F-GC07_*.json'
      - '.github/workflows/fgc07-temporal-coupling.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Run F-GC07 qualification
        run: bash tests/fgc/run_fgc07_temporal_coupling.sh
      - name: Upload F-GC07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fgc07-temporal-coupling-evidence
          path: .fgc07-artifacts
          if-no-files-found: error
          include-hidden-files: true
