name: F-GC14 external accuracy runtime adapter

on:
  push:
    branches:
      - work/f-gc14-external-accuracy-runtime-contract-adapter-boundary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run F-GC14 adapter gate
        run: python3 tests/fgc/run_fgc14_external_accuracy_adapter.py
