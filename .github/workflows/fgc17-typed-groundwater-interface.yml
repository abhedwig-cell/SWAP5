name: F-GC17 typed direct groundwater interface qualification

on:
  push:
    branches:
      - work/f-gc17-typed-direct-groundwater-interface-convergence-policy
  workflow_dispatch:

jobs:
  qualify-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head start
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-GC17 typed interface qualification
        run: python3 tests/fgc/run_fgc17_typed_groundwater_interface.py
      - name: Exact head end
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
