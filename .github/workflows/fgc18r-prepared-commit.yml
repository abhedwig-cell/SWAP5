name: F-GC18R prepared groundwater commit

on:
  push:
    branches:
      - work/f-gc18r-two-phase-commit-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-prepared-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checked-out run head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-GC18R prepared commit qualification
        run: bash tests/fgc/run_fgc18r_prepared_commit.sh
