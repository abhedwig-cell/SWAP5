name: F-GC19R-R1 prepared ledger provenance remediation

on:
  push:
    branches:
      - work/f-gc19r-r1-prepared-ledger-provenance-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-remediation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-GC19R-R1 provenance remediation qualification
        run: bash tests/fgc/run_fgc19r_r1_prepared_ledger_provenance.sh
      - name: Exact head end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
