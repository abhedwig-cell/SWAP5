name: F-GC21 restricted predictor-corrector owner qualification

on:
  push:
    branches:
      - work/f-gc21-restricted-predictor-corrector-coupling-window-orchestrator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-owner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
      - name: Fetch frozen side authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin \
            regie/f-rg01-post-rb1-program-rebaseline \
            work/f-gc18r-r1-prepared-transaction-remediation \
            work/f-gc19r-r1-prepared-ledger-provenance-remediation \
            work/f-gc21p1-r1-warning-hygiene-remediation \
            qualification/f-vq63-fgc21p1-r1-exact-bottom-interface-independent-qualification
      - name: Reconcile preregistered final prerequisite authorities
        shell: bash
        run: |
          set -euo pipefail
          p1_ref='refs/remotes/origin/work/f-gc21p1-r1-warning-hygiene-remediation'
          p1_final='dcde6360f902081c94927486455e5233b81dfc1b'
          fvq_ref='refs/remotes/origin/qualification/f-vq63-fgc21p1-r1-exact-bottom-interface-independent-qualification'
          fvq_final='a76f338f5fdebed8346ffdbbd04dc7461d15a137'
          stale_p1='15028b926a5bbe9b82086a62168708451d165ecb'
          stale_fvq='0926552c9db8658014920fd6710fac4277bcffe0'

          test "$(git rev-parse "$p1_ref")" = "$p1_final"
          test "$(git rev-parse "$fvq_ref")" = "$fvq_final"
          git cat-file -e "$p1_final^{commit}"
          git cat-file -e "$fvq_final^{commit}"

          src='tests/fgc/run_fgc21_restricted_predictor_corrector_owner_qualification.sh'
          reconciled='tests/fgc/.run_fgc21_owner_reconciled.sh'
          cp "$src" "$reconciled"
          sed -i "s/$stale_p1/$p1_final/g; s/$stale_fvq/$fvq_final/g" "$reconciled"
          test "$(grep -Fc "$p1_final" "$reconciled")" -ge 1
          test "$(grep -Fc "$fvq_final" "$reconciled")" -ge 1
          ! grep -Fq "$stale_p1" "$reconciled"
          ! grep -Fq "$stale_fvq" "$reconciled"
          test "$(git diff --no-index --numstat "$src" "$reconciled" | awk '{print $1+$2}')" = 4
          echo 'FGC21_QUALIFICATION_AUTHORITY_PIN_RECONCILIATION=PASS'
      - name: Compiler identity
        run: gfortran --version
      - name: F-GC21 owner qualification
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fgc/.run_fgc21_owner_reconciled.sh
          rm -f tests/fgc/.run_fgc21_owner_reconciled.sh
      - name: Exact head end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
