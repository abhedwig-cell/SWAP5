name: F-GC21 restricted predictor-corrector owner qualification

on:
  push:
    branches:
      - work/f-gc21-restricted-predictor-corrector-coupling-window-orchestrator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-owner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-GC21 owner qualification
        run: bash tests/fgc/run_fgc21_restricted_predictor_corrector_owner_qualification.sh
      - name: Exact head end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
