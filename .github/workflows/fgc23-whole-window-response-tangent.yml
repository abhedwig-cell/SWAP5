name: F-GC23 whole-window response tangent

on:
  push:
    branches:
      - work/f-gc23-whole-window-response-tangent-one-corrector-composition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-whole-window-response-tangent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checked-out run head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-GC23 owner qualification
        run: bash tests/fgc/run_fgc23_whole_window_response_tangent.sh
