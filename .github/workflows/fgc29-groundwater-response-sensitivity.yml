name: F-GC29 groundwater response sensitivity

on:
  push:
    branches:
      - work/f-gc29-groundwater-response-sensitivity-service-extension
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-groundwater-response-sensitivity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checked-out run head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-GC29 owner qualification
        run: bash tests/fgc/run_fgc29_groundwater_response_sensitivity.sh
