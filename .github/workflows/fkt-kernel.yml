name: F-KT kernel qualification

on:
  push:
    branches:
      - integration/f-kt
    paths:
      - 'src/kernel/**'
      - 'src/transaction/**'
      - 'src/runtime/**'
      - 'src/adapter/**'
      - 'tests/fkt/**'
      - 'tools/fkt/**'
      - 'integration/f-kt/**'
      - '.github/workflows/fkt-kernel.yml'
  pull_request:
    paths:
      - 'src/kernel/**'
      - 'src/transaction/**'
      - 'src/runtime/**'
      - 'src/adapter/**'
      - 'tests/fkt/**'
      - 'tests/fci/**'
      - 'tools/fkt/**'
      - 'integration/f-kt/**'
      - '.github/workflows/fkt-kernel.yml'

jobs:
  fkt08-focused-o0-o2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-KT08 authoritative accepted mass accounting O0/O2 gate
        run: bash tests/fkt/run_fkt08_gate.sh

  historical-fkt-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact qualified F-KT01..07 historical gates
        run: |
          git checkout --detach b91da4fb01e3b0c21d39a5782d36f8eedc55875d
          bash tests/fkt/run_fkt07_gate.sh

  historical-fci-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact qualified F-CI03/F-CI04 historical provenance
        run: |
          git checkout --detach b91da4fb01e3b0c21d39a5782d36f8eedc55875d
          bash tests/fci/run_fci03_gate.sh
          bash tests/fci/run_fci04_gate.sh

  current-fci-regression:
    needs: fkt08-focused-o0-o2
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: F-CI08 attempt-context regression on evolved transaction source
        run: bash tests/fci/run_fci08_gate.sh
      - name: F-CI09 transaction binding forward regression
        run: bash tests/fkt/run_fkt07_fci09_forward_regression.sh
      - name: F-CI10 unrounded physical mass seam regression
        run: bash tests/fci/run_fci10_gate.sh
      - name: F-CI11 controlled interval and mass regression
        run: bash tests/fci/run_fci11_gate.sh
      - name: F-CI13 recoverable trial-status regression
        run: bash tests/fci/run_fci13_gate.sh
      - name: F-CI14 temporal-acceptance contract regression
        run: bash tests/fci/run_fci14_gate.sh
