name: F-KT10 real Richards history binding

on:
  push:
    branches:
      - work/f-kt10-temporal-indicator-history-commit-composition
  workflow_dispatch:

jobs:
  compile-and-source-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run F-KT10 real Richards binding compile gate
        run: bash tests/fkt/run_fkt10_real_richards_binding_compile.sh
