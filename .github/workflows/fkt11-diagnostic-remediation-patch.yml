name: F-KT11 diagnostic remediation patch

on:
  push:
    branches:
      - work/f-kt11-richards-head-budget-certificate-policy
    paths:
      - .github/workflows/fkt11-diagnostic-remediation-patch.yml

permissions:
  contents: write

jobs:
  patch-production-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Make invalid-budget validation NaN-safe and diagnostic-preserving
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/runtime/mod_fmr_serialized_reference_backend.f90')
          s=p.read_text()
          pattern=(r"    self%temporal_indicator_budget_valid = self%temporal_indicator_budget_supplied \.and\. &\n"
                   r"\s+ieee_is_finite\(config%model_temporal_indicator_budget\) \.and\. &\n"
                   r"\s+config%model_temporal_indicator_budget > 0\.0_real64")
          s,n=re.subn(pattern,"    self%temporal_indicator_budget_valid = .false.",s,count=1)
          if n != 1:
              raise SystemExit(f'F-KT11 validity block replacement count={n}')
          old=("    if (self%temporal_indicator_budget_supplied) then\n"
               "      self%temporal_indicator_budget = config%model_temporal_indicator_budget")
          new=("    if (self%temporal_indicator_budget_supplied) then\n"
               "      self%temporal_indicator_budget = config%model_temporal_indicator_budget\n"
               "      if (ieee_is_finite(self%temporal_indicator_budget)) then\n"
               "        self%temporal_indicator_budget_valid = self%temporal_indicator_budget > 0.0_real64\n"
               "      end if")
          if s.count(old) != 1:
              raise SystemExit(f'F-KT11 supplied-budget block count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- src/runtime/mod_fmr_serialized_reference_backend.f90
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/mod_fmr_serialized_reference_backend.f90
          git commit -m "fix(F-KT11): make invalid budget validation NaN-safe"
          git push origin HEAD:work/f-kt11-richards-head-budget-certificate-policy
