name: F-KT15 Production Task-2 Solver-Service Composition

on:
  push:
    branches:
      - work/f-kt15-task2-solver-service-production-composition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-task2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head start
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: Fetch qualification authorities
        run: |
          set -euo pipefail
          for rev in \
            1b3d8ba6cc70d74a124f20f01f0c47a102763ae0 \
            e537baf521e633c432a9f33de495fab9f18e918d; do
            git cat-file -e "$rev^{commit}" 2>/dev/null || git fetch --no-tags origin "$rev"
          done
      - name: Run focused F-KT15 production task-2 gate
        run: bash tests/fkt/run_fkt15_production_task2_gate.sh
      - name: Run accepted-only F-KT14 transport gate
        run: bash tests/fkt/run_fkt15_reference_model_transport_gate.sh
      - name: Exact head end
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
