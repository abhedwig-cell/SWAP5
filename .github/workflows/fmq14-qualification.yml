name: F-MQ14 F-SI02 common solver admission

on:
  push:
    branches:
      - qualification/f-mq14-fsi02-common-solver-admission
    paths:
      - 'tests/multiswap/fmq14_*'
      - 'tests/multiswap/test_fmq14_*'
      - 'tests/multiswap/verify_fmq14_*'
      - 'tests/multiswap/run_fmq14_gate.py'
      - 'docs/qualification/F-MQ14_*'
      - '.github/workflows/fmq14-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmq14-gate:
    name: F-MQ14 F-SI02 admission gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out qualification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run F-MQ14 overlay gate
        run: python3 tests/multiswap/run_fmq14_gate.py

      - name: Fetch exact qualified F-SI02 head
        run: |
          FSI02=da1d5da0d909c5ce55efa17507b805bffd6b82f9
          git fetch --no-tags --depth=1 origin "$FSI02"
          test "$(git rev-parse FETCH_HEAD)" = "$FSI02"
          test "$(git rev-parse FETCH_HEAD:integration/f-si/F-SI02_QUALIFICATION.json)" = "d29e6944cb342c47ab06d61faaa4378d79719c69"
          test "$(git rev-parse FETCH_HEAD:src/solver/mod_soil_water_solver_contract.f90)" = "57b51997d28807fbe2da1b2e5bf654fc4167adb9"
          test "$(git rev-parse FETCH_HEAD:src/solver/mod_reference_richards_workspace.f90)" = "f35fc559aec8462313d9e9b6c95171983b3cf8ef"
          git show FETCH_HEAD:integration/f-si/F-SI02_QUALIFICATION.json > /tmp/fsi02_qualification.json
          git show FETCH_HEAD:src/solver/mod_soil_water_solver_contract.f90 > /tmp/mod_soil_water_solver_contract.f90
          git show FETCH_HEAD:src/solver/mod_reference_richards_workspace.f90 > /tmp/mod_reference_richards_workspace.f90

      - name: Verify source-bound F-SI02 qualification
        run: |
          python3 tests/multiswap/verify_fmq14_fsi02_external.py \
            --qualification /tmp/fsi02_qualification.json \
            --contract-source /tmp/mod_soil_water_solver_contract.f90 \
            --workspace-source /tmp/mod_reference_richards_workspace.f90

      - name: Compile exact common solver sources O0 and O2
        run: |
          for opt in 0 2; do
            out="/tmp/fmq14-o${opt}"
            mkdir -p "$out"
            gfortran -std=f2008 -ffree-line-length-none -O${opt} -J"$out" -I"$out" \
              -c /tmp/mod_soil_water_solver_contract.f90 -o "$out/contract.o"
            gfortran -std=f2008 -ffree-line-length-none -O${opt} -J"$out" -I"$out" \
              -c /tmp/mod_reference_richards_workspace.f90 -o "$out/workspace.o"
          done

      - name: Compile Python gate sources
        run: |
          python3 -m py_compile \
            tests/multiswap/run_fmq14_gate.py \
            tests/multiswap/test_fmq14_fsi02_admission.py \
            tests/multiswap/verify_fmq14_fsi02_external.py
