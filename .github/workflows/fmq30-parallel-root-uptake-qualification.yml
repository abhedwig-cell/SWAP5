name: F-MQ30 independent parallel root-uptake qualification

on:
  push:
    branches:
      - qualification/f-mq30-fmr35-parallel-root-uptake
    paths:
      - 'src/runtime/mod_fmr_parallel_root_uptake_pool.f90'
      - 'integration/f-mq/F-MQ30_*.json'
      - 'tests/fmq/run_fmq30_parallel_root_uptake_qualification.sh'
      - '.github/workflows/fmq30-parallel-root-uptake-qualification.yml'
  workflow_dispatch:

jobs:
  independent-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-MQ30 independent root-active parallel scientific gate
        run: bash tests/fmq/run_fmq30_parallel_root_uptake_qualification.sh
