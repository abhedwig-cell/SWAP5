name: F-MR02 shared F-KT05 + F-SI05 postimage qualification

on:
  push:
    branches:
      - 'integration/f-mr'
  workflow_dispatch:

jobs:
  fmr02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run F-MR02 shared-postimage qualification gate
        run: bash tests/fmr/run_fmr02_gate.sh
