name: F-MR18 materialize Gate C runtime candidate

on:
  push:
    branches:
      - work/f-mr18-generic-accepted-commit-receipt
    paths:
      - 'tools/fmr18_materialize_gate_c.py'
      - '.github/workflows/fmr18-materialize-gate-c.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-mr18-generic-accepted-commit-receipt
      - name: Materialize exact Gate C runtime patch
        run: python3 tools/fmr18_materialize_gate_c.py
      - name: Persist Gate C runtime candidate
        run: |
          test -n "$(git status --porcelain -- src/runtime/mod_fmr_serialized_multiswap_runtime.f90)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/mod_fmr_serialized_multiswap_runtime.f90
          git commit -m "feat(F-MR18): integrate sparse accepted receipts into serialized MultiSWAP"
          git push origin HEAD:work/f-mr18-generic-accepted-commit-receipt
