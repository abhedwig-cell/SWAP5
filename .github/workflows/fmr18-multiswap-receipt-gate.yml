name: F-MR18 sparse MultiSWAP receipt Gate C

on:
  push:
    branches:
      - work/f-mr18-generic-accepted-commit-receipt
    paths:
      - 'src/runtime/mod_fmr_accepted_commit_receipt.f90'
      - 'src/runtime/mod_fmr_serialized_multiswap_runtime.f90'
      - 'integration/f-mr/F-MR18_GATE_C_DESIGN.json'
      - 'tests/fmr/run_fmr18_multiswap_receipt_gate.sh'
      - '.github/workflows/fmr18-multiswap-receipt-gate.yml'
  workflow_dispatch:

jobs:
  qualify-gate-c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run F-MR18 sparse MultiSWAP receipt Gate C
        run: bash tests/fmr/run_fmr18_multiswap_receipt_gate.sh
