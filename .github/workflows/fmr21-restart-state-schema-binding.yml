name: F-MR21 restart state schema binding

on:
  push:
    branches:
      - work/f-mr21-restart-state-schema-binding
  workflow_dispatch:

jobs:
  remediation-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler provenance
        run: gfortran --version
      - name: Run F-MR21 source-bound remediation gate
        run: bash tests/fmr/run_fmr21_restart_state_schema_gate.sh
