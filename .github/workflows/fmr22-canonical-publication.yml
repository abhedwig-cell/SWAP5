name: F-MR22 canonical result publication

on:
  push:
    branches:
      - work/f-mr22-canonical-result-publication
  workflow_dispatch:

jobs:
  remediation-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler provenance
        run: gfortran --version
      - name: Run F-MR22 source-bound remediation gate
        run: bash tests/fmr/run_fmr22_canonical_publication_gate.sh
