name: F-MR24 canonical restart recomposition owner gate

on:
  push:
    branches:
      - work/f-mr24-canonical-restart-recomposition
  workflow_dispatch:

jobs:
  owner-recomposition-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler provenance
        run: gfortran --version
      - name: Run F-MR24 owner canonical recomposition gate
        run: bash tests/fmr/run_fmr24_canonical_restart_recomposition.sh
