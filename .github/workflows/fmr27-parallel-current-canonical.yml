name: F-MR27 current-canonical parallel V1 owner gate

on:
  push:
    branches:
      - work/f-mr27-parallel-current-canonical-recomposition
  workflow_dispatch:

jobs:
  owner-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler provenance
        run: gfortran --version
      - name: Run source-bound parallel, receipt, restart and ET preservation gate
        run: bash tests/fmr/run_fmr27_parallel_current_canonical_gate.sh
