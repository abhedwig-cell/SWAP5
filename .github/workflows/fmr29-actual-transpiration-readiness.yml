name: F-MR29 actual-transpiration attribution readiness

on:
  push:
    branches:
      - work/f-mr29-actual-transpiration-mass-accounting-readiness
    paths:
      - 'integration/f-mr/F-MR29_*'
      - 'tests/fmr/run_fmr29_actual_transpiration_readiness_gate.sh'
      - '.github/workflows/fmr29-actual-transpiration-readiness.yml'
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: F-MR29 source-bound actual-transpiration attribution readiness gate
        run: bash tests/fmr/run_fmr29_actual_transpiration_readiness_gate.sh
