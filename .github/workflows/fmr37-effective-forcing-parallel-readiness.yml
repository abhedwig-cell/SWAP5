name: F-MR37 Effective Forcing Parallel Readiness

on:
  push:
    branches:
      - work/f-mr37-effective-forcing-parallel-readiness
    paths:
      - 'integration/f-mr/F-MR37_*'
      - 'tests/fmr/run_fmr37_effective_forcing_parallel_readiness_gate.sh'
      - '.github/workflows/fmr37-effective-forcing-parallel-readiness.yml'
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run source-bound F-MR37 readiness gate
        run: bash tests/fmr/run_fmr37_effective_forcing_parallel_readiness_gate.sh
