name: F-MR39 restricted soil-temperature runtime composition

on:
  workflow_dispatch:
  push:
    branches:
      - work/f-mr39-restricted-soil-temperature-runtime-composition
    paths:
      - integration/f-mr/materialize_fmr39.py

permissions:
  contents: write

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          python3 --version
          gfortran --version
      - name: Verify exact pre-materialization source authority
        run: |
          test "$(git rev-parse HEAD:src/runtime/mod_fmr_serialized_reference_backend.f90)" = "9af5a494526810324dc00706b444e448e770cba9"
          test "$(git rev-parse HEAD:src/runtime/mod_fmr_restart_state_contract.f90)" = "f1359f97d02408d8b700b0c93fe961a6ba46742c"
      - name: Materialize bounded runtime composition
        run: python3 integration/f-mr/materialize_fmr39.py
      - name: Qualify materialized composition before publication
        run: bash tests/fmr/run_fmr39_soil_temperature_runtime_gate.sh
      - name: Publish only green materialization
        run: |
          test -n "$(git status --porcelain -- src/runtime)"
          git config user.name "SWAP5 qualification bot"
          git config user.email "swap5-qualification@users.noreply.github.com"
          git add src/runtime/mod_fmr_serialized_reference_backend.f90 src/runtime/mod_fmr_restart_state_contract.f90
          git commit -m "materialize(F-MR39): compose restricted soil temperature transactionally [fmr39-materialized]"
          git push origin HEAD:work/f-mr39-restricted-soil-temperature-runtime-composition
