name: F-MR40R current-canonical soil-temperature recomposition

on:
  push:
    branches:
      - work/f-mr40r-soil-temperature-current-canonical-recomposition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-recomposition-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          python3 --version
          gfortran --version
      - name: Qualify F-MR40R candidate
        run: bash tests/fmr/run_fmr40r_current_canonical_recomposition_gate.sh
      - name: Assert source tree clean after qualification
        run: |
          test -z "$(git status --porcelain -- src)"
          echo "FMR40R_CLEAN_SOURCE_TREE=PASS:$(git rev-parse HEAD)"
