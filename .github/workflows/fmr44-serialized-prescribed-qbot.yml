name: F-MR44 serialized prescribed-qbot runtime qualification

on:
  push:
    branches:
      - work/f-mr44-serialized-prescribed-qbot-runtime-binding
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmr44-serialized-prescribed-qbot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tested head identity
        run: |
          echo "FMR44_TESTED_HEAD=$(git rev-parse HEAD)"
          echo "FMR44_TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Compiler identity
        run: gfortran --version
      - name: Qualify serialized prescribed-qbot runtime
        run: bash tests/fmr/run_fmr44_serialized_prescribed_qbot_gate.sh
      - name: Persist production admission after qualification
        run: |
          if git diff --quiet -- src/adapter/mod_b110_serialized_context_binding.f90 src/runtime/mod_fmr_serialized_reference_backend.f90; then
            echo 'FMR44_EXACT_HEAD_PRODUCTION_QUALIFICATION=PASS'
            exit 0
          fi
          git diff --check -- src/adapter/mod_b110_serialized_context_binding.f90 src/runtime/mod_fmr_serialized_reference_backend.f90
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapter/mod_b110_serialized_context_binding.f90 src/runtime/mod_fmr_serialized_reference_backend.f90
          git commit -m 'feat(F-MR44): admit prescribed qbot in serialized runtime'
          git push origin HEAD:work/f-mr44-serialized-prescribed-qbot-runtime-binding
          echo 'FMR44_PRODUCTION_SOURCE_COMMITTED_AFTER_QUALIFICATION=PASS'