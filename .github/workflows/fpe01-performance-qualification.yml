name: F-PE01 performance qualification architecture

on:
  push:
    branches:
      - work/f-pe01-performance-qualification
    paths:
      - 'integration/f-pe/**'
      - 'tools/fpe/**'
      - '.github/workflows/fpe01-performance-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: Source-bound reference and synthetic qualification harness
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Validate fail-closed F-PE01 contracts
        run: python3 tools/fpe/fpe01_reference_probe.py validate-contracts

      - name: Validate F-PE01 closeout scope and artifacts
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          required = [
              'F-PE01_DEPENDENCIES.json',
              'F-PE01_EXECUTION_CLASS_CONTRACT.json',
              'F-PE01_COST_DIAGNOSTICS_CONTRACT.json',
              'F-PE01_MEMORY_MODEL.json',
              'F-PE01_BENCHMARK_MATRIX.json',
              'F-PE01_REFERENCE_BASELINE.json',
              'F-PE01_QUALIFICATION_PROTOCOL.json',
              'F-PE01_QUALIFICATION_EVIDENCE.json',
              'F-PE01_STATUS.json',
          ]
          base = root / 'integration/f-pe'
          for name in required:
              assert (base / name).is_file(), f'missing F-PE01 artifact {name}'
              json.loads((base / name).read_text())

          status = json.loads((base / 'F-PE01_STATUS.json').read_text())
          assert status['status'] == 'QUALIFIED_PERFORMANCE_AND_EXECUTION_POLICY_QUALIFICATION_ARCHITECTURE'
          assert status['IMPLEMENTED'] and status['PERSISTED'] and status['TESTED'] and status['QUALIFIED']
          assert status['parallel_real_physics_admitted'] is False
          assert status['production_source_changed_by_fpe01'] is False
          assert status['physics_changed_by_fpe01'] is False
          assert status['execution_classes']['REFERENCE'] == 'ADMITTED_EXISTING_QUALIFIED_ROUTE'
          for name in ('BALANCED','THROUGHPUT','FALLBACK'):
              assert status['execution_classes'][name] == 'DEFINED_NOT_ADMITTED'

          changed = subprocess.check_output([
              'git','diff','--name-only','ff6c2b4f48dd9e76f5bec41281493f1d35d03d90','HEAD'
          ], text=True).splitlines()
          allowed_exact = {'.github/workflows/fpe01-performance-qualification.yml'}
          for path in changed:
              assert path.startswith('integration/f-pe/') or path.startswith('tools/fpe/') or path in allowed_exact, \
                  f'F-PE01 changed out-of-scope path: {path}'
              assert not path.startswith('src/'), f'F-PE01 production source change: {path}'
          print('FPE01_CLOSEOUT_SCOPE PASS')
          PY

      - name: Instrument qualification-only F-MR05 test checkout
        run: python3 tools/fpe/fpe01_reference_probe.py instrument tests/fmr/test_fmr05_serialized_multiswap.f90

      - name: Execute source-bound serialized real-physics reference gate
        run: |
          set -o pipefail
          bash tests/fmr/run_fmr05_gate.sh | tee /tmp/fpe01-fmr05.log

      - name: Summarize real-physics reference cost matrix
        run: >-
          python3 tools/fpe/fpe01_reference_probe.py summarize
          /tmp/fpe01-fmr05.log
          --output /tmp/fpe01-reference-cost.json

      - name: Build synthetic difficult-tail and scale evidence
        run: >-
          python3 tools/fpe/fpe01_reference_probe.py synthetic
          --output /tmp/fpe01-synthetic.json

      - name: Upload F-PE01 measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: fpe01-performance-qualification-evidence
          path: |
            /tmp/fpe01-reference-cost.json
            /tmp/fpe01-synthetic.json
          if-no-files-found: error
