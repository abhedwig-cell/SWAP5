name: F-PE03 B04 admitted runtime tail screening

on:
  push:
    branches:
      - work/f-pe03-b04-admitted-runtime-screen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Screen scientifically admitted runtime workloads
        run: |
          set -o pipefail
          bash tests/fpe/run_fpe03_b04_admitted_runtime_screen.sh | tee fpe03-admitted-runtime-screen.log
      - name: Preserve screening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpe03-b04-admitted-runtime-screen
          path: fpe03-admitted-runtime-screen.log
          if-no-files-found: warn
