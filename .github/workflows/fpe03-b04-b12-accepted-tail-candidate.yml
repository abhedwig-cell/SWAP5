name: F-PE03 B04 B12 accepted-tail candidate search

on:
  push:
    branches:
      - work/f-pe03-b04-b12-accepted-tail-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: F-PE03 B12 source-bound candidate search
        run: |
          set -o pipefail
          bash tests/fpe/run_fpe03_b04_b12_candidate_search.sh | tee fpe03-b12.log
      - name: Preserve B12 candidate diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpe03-b04-b12-candidate-search
          path: fpe03-b12.log
