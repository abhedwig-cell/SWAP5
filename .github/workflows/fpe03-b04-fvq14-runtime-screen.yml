name: F-PE03 B04 F-VQ14 runtime screen

on:
  push:
    branches:
      - work/f-pe03-b04-fvq14-runtime-screen-fvq27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run source-bound F-VQ14 runtime cost screen
        run: |
          set -o pipefail
          bash tests/fpe/run_fpe03_b04_fvq14_runtime_screen.sh | tee fpe03-b04-fvq14.log
      - name: Preserve screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpe03-b04-fvq14-runtime-screen
          path: fpe03-b04-fvq14.log
          if-no-files-found: error
