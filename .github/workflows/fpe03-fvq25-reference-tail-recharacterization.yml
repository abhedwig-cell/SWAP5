name: F-PE03 F-VQ25 reference tail recharacterization

on:
  push:
    branches:
      - work/f-pe03-reference-tail-recharacterization-fvq25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version

      - name: F-PE03 F-VQ25 aggregate reference-tail characterization gate
        run: |
          set -o pipefail
          bash tests/fpe/run_fpe03_fvq25_reference_tail_recharacterization_gate.sh | tee fpe03-fvq25.log

      - name: Preserve F-PE03 F-VQ25 characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpe03-fvq25-reference-tail-recharacterization
          path: fpe03-fvq25.log
