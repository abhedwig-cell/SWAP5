name: F-PE04 reference failure envelope

on:
  push:
    branches: [work/f-pe04-reference-failure-envelope]
    paths:
      - 'tests/fpe/test_fpe04_reference_failure_envelope.f90'
      - 'tests/fpe/run_fpe04_reference_failure_envelope_gate.sh'
      - 'integration/f-pe/F-PE04_*.json'
      - '.github/workflows/fpe04-reference-failure-envelope.yml'
  workflow_dispatch:

jobs:
  characterize-reference-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Verify F-PE04 persisted contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('integration/f-pe/F-PE04_DEPENDENCIES.json').read_text())
          c=json.loads(Path('integration/f-pe/F-PE04_REFERENCE_FAILURE_CONTRACT.json').read_text())
          m=json.loads(Path('integration/f-pe/F-PE04_PERTURBATION_MATRIX.json').read_text())
          ce=json.loads(Path('integration/f-pe/F-PE04_COST_ENVELOPE.json').read_text())
          tx=json.loads(Path('integration/f-pe/F-PE04_TRANSACTION_EVIDENCE.json').read_text())
          qe=json.loads(Path('integration/f-pe/F-PE04_QUALIFICATION_EVIDENCE.json').read_text())
          st=json.loads(Path('integration/f-pe/F-PE04_STATUS.json').read_text())
          assert d['start_head']=='8f7bab11fd856d7cb2f7bacb8c299cf2b0517061'
          assert d['lineage_constraints']['reference_only'] is True
          assert d['lineage_constraints']['production_source_change_allowed'] is False
          assert d['lineage_constraints']['prescribed_bottom_head_admitted_on_this_lineage'] is False
          assert c['scope']['execution_class']=='REFERENCE'
          for k in ['production_source_change','physics_change','numerical_controls_change','solver_tolerance_change','timestep_policy_change','retry_limit_change','fallback_change','policy_admission']:
              assert c['scope'][k] is False
          assert c['mass']['performance_mass_concession_allowed'] is False
          assert len(m['runs'])==51
          assert m['summary']=={'total':51,'accepted_normal':20,'accepted_higher_cost':0,'rejected_after_retry':30,'fail_closed_pre_solver':1}
          classes=[r[4] for r in m['runs']]
          assert classes.count('ACCEPTED_NORMAL')==20
          assert classes.count('ACCEPTED_HIGHER_COST')==0
          assert classes.count('REJECTED_AFTER_RETRY')==30
          assert classes.count('FAIL_CLOSED_PRE_SOLVER')==1
          assert m['qualification_run']['o0_o2_output_identity'] is True
          assert m['qualification_run']['all_replays_deterministic'] is True
          assert ce['accepted_higher_cost_found'] is False
          assert ce['accepted_nonstationary_higher_cost_fixture_found'] is False
          assert ce['max_abs_mass_residual_among_accepted'] <= ce['hard_mass_gate']
          assert tx['status']=='PASS'
          assert all(tx['checks'].values())
          assert qe['matrix_summary']['accepted_higher_cost']==0
          assert qe['scientific_result']['failure_retry_envelope_characterized'] is True
          assert st['reference_only'] is True
          assert st['BALANCED']=='DEFINED_NOT_ADMITTED'
          assert st['THROUGHPUT']=='DEFINED_NOT_ADMITTED'
          assert st['FALLBACK']=='DEFINED_NOT_ADMITTED'
          print('FPE04_PERSISTED_EVIDENCE_SELF_CHECK=PASS')
          PY
      - name: Run O0/O2 REFERENCE failure envelope
        run: bash tests/fpe/run_fpe04_reference_failure_envelope_gate.sh
