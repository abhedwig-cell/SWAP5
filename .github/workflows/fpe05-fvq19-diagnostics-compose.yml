name: F-PE05 F-VQ19 diagnostics composition

on:
  push:
    branches:
      - work/f-pe05-reference-temporal-acceptance-fvq19
    paths:
      - 'integration/f-pe/F-PE05_RESUME_COMPOSITION_CONTRACT.json'
      - 'tools/fpe/fpe05_fvq19_diagnostics_compose.py'
      - '.github/workflows/fpe05-fvq19-diagnostics-compose.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-pe05-reference-temporal-acceptance-fvq19
      - name: Exact source-bound diagnostics composition
        run: python3 tools/fpe/fpe05_fvq19_diagnostics_compose.py | tee /tmp/fpe05-compose.out
      - name: Verify exact two-file production scope
        run: |
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'src/kernel/mod_kernel_transactions.f90'
          git diff --name-only | grep -Fx 'src/runtime/mod_fmr_serialized_multiswap_runtime.f90'
          grep -Fq 'FPE05_DIAGNOSTICS_COMPOSITION_SCOPE=PASS' /tmp/fpe05-compose.out
          grep -Fq 'FPE05_KERNEL_DIAGNOSTICS_POST_REUSES_QUALIFIED_BLOB=PASS' /tmp/fpe05-compose.out
          grep -Fq 'FPE05_PROTECTED_SNOW_SOURCE_UNCHANGED=PASS' /tmp/fpe05-compose.out
      - name: Persist composed source candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kernel/mod_kernel_transactions.f90 src/runtime/mod_fmr_serialized_multiswap_runtime.f90
          git commit -m 'compose(F-PE05): add qualified cost diagnostics to F-VQ19 lineage'
          git push origin HEAD:work/f-pe05-reference-temporal-acceptance-fvq19
