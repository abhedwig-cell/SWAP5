name: F-PE09 materialize worker cache reuse

on:
  push:
    branches:
      - qualification/f-pe09-worker-cache-reuse
    paths:
      - .github/workflows/fpe09-materialize-worker-cache-reuse.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize bounded source patch
        run: python3 tests/fpe/materialize_fpe09_worker_cache_reuse.py
      - name: Persist production postimage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          changed="$(git status --porcelain -- src/runtime/mod_fmr_serialized_reference_backend.f90 src/solver/mod_b110_default_mvg_provider.f90)"
          test -n "$changed"
          extra="$(git status --porcelain --untracked-files=no | grep -v -E 'src/runtime/mod_fmr_serialized_reference_backend.f90|src/solver/mod_b110_default_mvg_provider.f90' || true)"
          test -z "$extra"
          git add src/runtime/mod_fmr_serialized_reference_backend.f90 src/solver/mod_b110_default_mvg_provider.f90
          git commit -m 'perf(F-PE09): reuse exact-shape worker parameter and forcing caches'
          git push origin HEAD:qualification/f-pe09-worker-cache-reuse
