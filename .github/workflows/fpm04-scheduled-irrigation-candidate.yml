name: F-PM04 scheduled irrigation candidate

on:
  push:
    branches:
      - work/f-pm04-scheduled-irrigation-tcs7-dcs2-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: F-PM04 scheduled irrigation candidate gate
        run: bash tests/fpm/run_fpm04_scheduled_irrigation_candidate_gate.sh
