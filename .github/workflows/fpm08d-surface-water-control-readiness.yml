name: F-PM08D surface-water control readiness

on:
  push:
    branches:
      - work/f-pm08d-surface-water-control-readiness
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run F-PM08D readiness gate
        run: python3 tools/fpm/fpm08d_surface_water_control_readiness_gate.py
