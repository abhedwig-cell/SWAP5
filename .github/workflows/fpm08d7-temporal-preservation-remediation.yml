name: F-PM08D7 one-shot temporal preservation remediation

on:
  push:
    branches:
      - work/f-pm08d7-restricted-fixed-weir-transactional-runtime-candidate
    paths:
      - '.github/workflows/fpm08d7-temporal-preservation-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact remediation trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact preservation-only patch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='work/f-pm08d7-restricted-fixed-weir-transactional-runtime-candidate'
          EXPECTED_PARENT='f5cb20e121f5363efc8bc6d8d34082b8cd18a2e0'
          BACKEND='src/runtime/mod_fmr_serialized_reference_backend.f90'
          EXPECTED_BLOB='3c2f7dac1b808594c5e632bcff950d5863b46cfd'

          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]] || {
            echo 'FPM08D7_REMEDIATION_FAIL unexpected trigger parent' >&2; exit 87;
          }
          [[ "$(git rev-parse HEAD:$BACKEND)" == "$EXPECTED_BLOB" ]] || {
            echo 'FPM08D7_REMEDIATION_FAIL backend blob drift' >&2; exit 87;
          }

          python3 - "$BACKEND" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          start = s.index('  logical function base_physical_states_identical')
          end = s.index('  end function base_physical_states_identical', start)
          end += len('  end function base_physical_states_identical')
          block = s[start:end]
          replacements = {
              'all(same_real_bits(full%pressure_head, half%pressure_head))': 'all(full%pressure_head == half%pressure_head)',
              'all(same_real_bits(full%water_content, half%water_content))': 'all(full%water_content == half%water_content)',
              'same_real_bits(full%ponding_depth, half%ponding_depth)': 'full%ponding_depth == half%ponding_depth',
              'same_real_bits(full%groundwater_level, half%groundwater_level)': 'full%groundwater_level == half%groundwater_level',
              'same_real_bits(full%snow%process%snow_water_storage, half%snow%process%snow_water_storage)': 'full%snow%process%snow_water_storage == half%snow%process%snow_water_storage',
              'same_real_bits(full%snow%process%liquid_water_storage, half%snow%process%liquid_water_storage)': 'full%snow%process%liquid_water_storage == half%snow%process%liquid_water_storage',
              'same_real_bits(full%snow%event_t0, half%snow%event_t0)': 'full%snow%event_t0 == half%snow%event_t0',
          }
          if block.count('same_real_bits(') != 7:
              raise SystemExit(f"FPM08D7_REMEDIATION_FAIL expected 7 base-helper bit comparisons, found {block.count('same_real_bits(')}")
          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'FPM08D7_REMEDIATION_FAIL exact expression count for {old}: {block.count(old)}')
              block = block.replace(old, new, 1)
          if 'same_real_bits(' in block:
              raise SystemExit('FPM08D7_REMEDIATION_FAIL bit comparison remains in base helper')
          out = s[:start] + block + s[end:]
          if 'value = abs(full%surface_water%storage - half%surface_water%storage)' not in out:
              raise SystemExit('FPM08D7_REMEDIATION_FAIL SWST metric drift')
          if 'pure elemental logical function same_real_bits(a, b)' not in out:
              raise SystemExit('FPM08D7_REMEDIATION_FAIL unrelated bit-identity helper removed')
          p.write_text(out)
          print('FPM08D7_EXACT_SEVEN_EXPRESSION_REPLACEMENT=PASS')
          PY

          git diff --check
          [[ "$(git diff --name-only)" == "$BACKEND" ]] || {
            echo 'FPM08D7_REMEDIATION_FAIL production delta not single backend file' >&2; git diff --name-only >&2; exit 87;
          }
          python3 - "$BACKEND" <<'PY'
          from pathlib import Path
          import sys
          s = Path(sys.argv[1]).read_text()
          a = s.index('  logical function base_physical_states_identical')
          b = s.index('  end function base_physical_states_identical', a)
          block = s[a:b]
          required = [
              'all(full%pressure_head == half%pressure_head)',
              'all(full%water_content == half%water_content)',
              'full%ponding_depth == half%ponding_depth',
              'full%groundwater_level == half%groundwater_level',
              'full%snow%process%snow_water_storage == half%snow%process%snow_water_storage',
              'full%snow%process%liquid_water_storage == half%snow%process%liquid_water_storage',
              'full%snow%event_t0 == half%snow%event_t0',
          ]
          if 'same_real_bits(' in block or not all(x in block for x in required):
              raise SystemExit('FPM08D7_REMEDIATION_FAIL canonical numeric-equality pattern incomplete')
          print('FPM08D7_CANONICAL_NUMERIC_EQUALITY_PATTERN=PASS')
          PY

          git config user.name 'abhedwig-cell'
          git config user.email 'abhedwig@gmail.com'
          git add "$BACKEND"
          git commit -m 'fix(F-PM08D7): restore canonical base temporal identity'
          git push origin "HEAD:$BRANCH"
