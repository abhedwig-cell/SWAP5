name: F-PM08D7 transactional runtime owner gate

on:
  push:
    branches:
      - work/f-pm08d7-restricted-fixed-weir-transactional-runtime-candidate
    paths:
      - 'src/process/mod_restricted_fixed_weir_surface_water.f90'
      - 'src/runtime/mod_fmr_optional_state_layouts.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_fixed_weir_serialized_runtime.f90'
      - 'tests/fpm/test_fpm08d7_transactional_runtime.f90'
      - 'tests/fpm/run_fpm08d7_transactional_runtime_owner.sh'
      - '.github/workflows/fpm08d7-transactional-runtime-owner.yml'
  workflow_dispatch:

jobs:
  transactional-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact F-PM08D7 head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run F-PM08D7 transactional runtime owner gate
        env:
          FPM08D7_TX_EVIDENCE_DIR: _fpm08d7_tx_evidence
        run: bash tests/fpm/run_fpm08d7_transactional_runtime_owner.sh
      - name: Upload F-PM08D7 transaction evidence
        uses: actions/upload-artifact@v4
        with:
          name: F-PM08D7-transactional-runtime-owner-evidence
          path: _fpm08d7_tx_evidence
          if-no-files-found: error
