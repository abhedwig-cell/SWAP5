name: F-ROSS02 RossFast D3R production model binding

on:
  push:
    branches:
      - work/f-ross02-production-binding
    paths:
      - 'src/runtime/mod_rossfast_d3r_model_binding.f90'
      - 'tests/fci/test_fross02_rossfast_d3r_model_binding.f90'
      - 'tests/fci/run_fross02_rossfast_d3r_model_binding.sh'
      - '.github/workflows/fross02-rossfast-d3r-model-binding.yml'
  pull_request:
    paths:
      - 'src/runtime/mod_rossfast_d3r_model_binding.f90'
      - 'tests/fci/test_fross02_rossfast_d3r_model_binding.f90'
      - 'tests/fci/run_fross02_rossfast_d3r_model_binding.sh'
      - '.github/workflows/fross02-rossfast-d3r-model-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fross02-rossfast-d3r-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-binding-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock F-CI67P canonical preimage
        shell: bash
        run: |
          set -euo pipefail
          BASE=67b702e983f5104c80c8c16fb5e2570d969cce9e
          LIVE="$(git ls-remote origin refs/heads/integration/f-ci-canonical | awk '{print $1}')"
          test "$LIVE" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:src/transaction/mod_transaction_reference.f90)" = d5a71a526efaebd82054580c3186f8e3545db331
          test "$(git rev-parse HEAD:src/runtime/mod_canonical_contracts.f90)" = 3cbb81b25626e6574ae83416f088dc52882f91fc
          test "$(git rev-parse HEAD:src/runtime/mod_canonical_interval_runtime.f90)" = b12327aa6e77bdbf4586fe0bed82cf0e7704f237
          test "$(git rev-parse HEAD:src/runtime/mod_rossfast_d3r_execution_policy.f90)" = a39a636d01f373ae6ef0dc3ac0e1e25b6522fda9

      - name: Enforce bounded F-ROSS02 surface
        shell: bash
        run: |
          set -euo pipefail
          BASE=67b702e983f5104c80c8c16fb5e2570d969cce9e
          allowed=(
            .github/workflows/fross02-rossfast-d3r-model-binding.yml
            src/runtime/mod_rossfast_d3r_model_binding.f90
            tests/fci/run_fross02_rossfast_d3r_model_binding.sh
            tests/fci/test_fross02_rossfast_d3r_model_binding.f90
          )
          mapfile -t changed < <(git diff --name-only "$BASE..HEAD")
          for path in "${changed[@]}"; do
            ok=0
            for candidate in "${allowed[@]}"; do
              [[ "$path" == "$candidate" ]] && ok=1 && break
            done
            [[ "$ok" -eq 1 ]] || { echo "FROSS02_UNEXPECTED_PATH $path" >&2; exit 68; }
          done
          test -z "$(git diff --name-only "$BASE..HEAD" -- reference src/transaction src/adapter src/runtime/mod_canonical_contracts.f90 src/runtime/mod_canonical_interval_runtime.f90 src/runtime/mod_rossfast_d3r_execution_policy.f90)"

      - name: Compiler identity
        run: gfortran --version

      - name: Re-run admitted F-CI67 policy gate
        run: bash tests/fci/run_fci67_rossfast_d3r_execution_policy_admission.sh

      - name: Run F-ROSS02 model-binding gate
        run: bash tests/fci/run_fross02_rossfast_d3r_model_binding.sh
