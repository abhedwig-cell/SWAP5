name: F-SI05 materialize production seam

on:
  push:
    branches:
      - work/f-si05-production-workspace-seam
    paths:
      - tools/fsi/fsi05_materialize_production_seam.py
      - .github/workflows/fsi05-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact F-SI04 qualified transformation
        run: python3 tools/fsi/fsi05_materialize_production_seam.py
      - name: Validate patch shape
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/adapter/mod_reference_richards_legacy_binding.f90 src/legacy/b1_10_port/headcalc.f90 src/solver/mod_reference_richards_workspace.f90 "
      - name: Persist materialized source before qualification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapter/mod_reference_richards_legacy_binding.f90 src/legacy/b1_10_port/headcalc.f90 src/solver/mod_reference_richards_workspace.f90
          git commit -m "F-SI05: materialize production HeadCalc workspace seam"
          git push origin HEAD:work/f-si05-production-workspace-seam
