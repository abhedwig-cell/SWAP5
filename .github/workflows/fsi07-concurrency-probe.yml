name: F-SI07 real HeadCalc concurrency probe

on:
  push:
    branches:
      - work/f-si07-state-binding
    paths:
      - tests/fsi/test_fsi07_real_concurrency.F90
      - tests/fsi/run_fsi07_concurrency_probe.sh
      - .github/workflows/fsi07-concurrency-probe.yml

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Probe real HeadCalc shared state leakage
        run: bash tests/fsi/run_fsi07_concurrency_probe.sh
