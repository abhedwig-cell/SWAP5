name: F-SI08 fix diagnostic routes

on:
  push:
    branches:
      - work/f-si08-provider-context
    paths:
      - 'tools/fsi/fsi08_fix_diagnostic_routes.py'
      - '.github/workflows/fsi08-fix-diagnostic-routes.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bound F-SI08 route labels to common diagnostics width
        run: python3 tools/fsi/fsi08_fix_diagnostic_routes.py
      - name: Validate scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          [[ ${#changed[@]} -eq 4 ]]
          for p in "${changed[@]}"; do
            case "$p" in
              src/adapter/mod_reference_richards_legacy_binding.f90|tools/fsi/fsi08_materialize_provider_context.py|tests/fsi/test_fsi08_provider_failclosed.f90|tests/fsi/run_fsi08_provider_context_gate.sh) ;;
              *) echo "F-SI08 unexpected route-fix path: $p" >&2; exit 1 ;;
            esac
          done
          [[ -z "$(git diff --name-only -- src/transaction src/runtime src/solver src/legacy/b1_10_port/headcalc.f90)" ]]
      - name: Persist route-label repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapter/mod_reference_richards_legacy_binding.f90 tools/fsi/fsi08_materialize_provider_context.py tests/fsi/test_fsi08_provider_failclosed.f90 tests/fsi/run_fsi08_provider_context_gate.sh
          git commit -m 'F-SI08: bound provider admission diagnostics labels'
          git push origin HEAD:work/f-si08-provider-context
