name: F-SI08 materialize provider context

on:
  push:
    branches:
      - work/f-si08-provider-context
    paths:
      - 'tools/fsi/fsi08_materialize_provider_context.py'
      - 'integration/f-si/F-SI08_PROVIDER_CONTEXT_CONTRACT.json'
      - '.github/workflows/fsi08-materialize-provider-context.yml'

permissions:
  contents: write

concurrency:
  group: fsi08-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize provider-context seam
        run: python3 tools/fsi/fsi08_materialize_provider_context.py
      - name: Validate source scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          [[ ${#changed[@]} -eq 2 ]]
          [[ " ${changed[*]} " == *" src/legacy/b1_10_port/headcalc.f90 "* ]]
          [[ " ${changed[*]} " == *" src/adapter/mod_reference_richards_legacy_binding.f90 "* ]]
          [[ -z "$(git diff --name-only -- src/transaction src/runtime src/solver/mod_soil_water_solver_contract.f90 src/solver/mod_reference_richards_workspace.f90)" ]]
      - name: Persist source checkpoint before qualification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/legacy/b1_10_port/headcalc.f90 src/adapter/mod_reference_richards_legacy_binding.f90
          git commit -m 'F-SI08: materialize explicit provider-context seam'
          git push origin HEAD:work/f-si08-provider-context
