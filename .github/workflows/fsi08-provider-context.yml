name: F-SI08 provider context

# The gate is rerun on the persisted <=32-character provider admission labels.
on:
  push:
    branches:
      - work/f-si08-provider-context
    paths:
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'tests/fsi/mod_fsi08_provider_fixture.f90'
      - 'tests/fsi/test_fsi08_provider_context_parallel.F90'
      - 'tests/fsi/test_fsi08_provider_failclosed.f90'
      - 'tests/fsi/run_fsi08_provider_context_gate.sh'
      - 'integration/f-si/F-SI08_PROVIDER_CONTEXT_CONTRACT.json'
      - 'integration/f-si/F-SI08_QUALIFICATION.json'
      - '.github/workflows/fsi08-provider-context.yml'

jobs:
  fsi08-provider-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-SI08 provider-context gate
        run: bash tests/fsi/run_fsi08_provider_context_gate.sh
