name: F-SI13 materialize explicit bottom boundary

on:
  push:
    branches:
      - work/f-si13-explicit-bottom-boundary
    paths:
      - 'integration/f-si/F-SI13_BOTTOM_BOUNDARY_CONTRACT.json'
      - 'tools/fsi/fsi13_materialize_bottom_boundary.py'
      - '.github/workflows/fsi13-materialize-bottom-boundary.yml'

permissions:
  contents: write

concurrency:
  group: fsi13-materialize-bottom-boundary
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-si13-explicit-bottom-boundary
      - name: Materialize source-bound explicit bottom mode
        run: python3 tools/fsi/fsi13_materialize_bottom_boundary.py
      - name: Commit only HeadCalc and reference adapter
        run: |
          changed="$(git diff --name-only | sort)"
          expected=$'src/adapter/mod_reference_richards_legacy_binding.f90\nsrc/legacy/b1_10_port/headcalc.f90'
          if [ "$changed" != "$expected" ]; then
            echo 'F-SI13 materializer changed unexpected paths:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapter/mod_reference_richards_legacy_binding.f90 src/legacy/b1_10_port/headcalc.f90
          git commit -m 'F-SI13: materialize explicit bottom-boundary mode'
          git push origin HEAD:work/f-si13-explicit-bottom-boundary
