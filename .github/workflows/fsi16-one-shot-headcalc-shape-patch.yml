name: F-SI16 one-shot HeadCalc geometry patch

on:
  push:
    branches:
      - work/f-si16-explicit-prescribed-bottom-head
    paths:
      - '.github/workflows/fsi16-one-shot-headcalc-shape-patch.yml'

permissions:
  contents: write

jobs:
  patch-headcalc-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-si16-explicit-prescribed-bottom-head
      - name: Apply exact F-SI16 geometry-shape patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          headcalc = Path('src/legacy/b1_10_port/headcalc.f90')
          s = headcalc.read_text()
          old = """      if (size(parameter_set%z) /= numnod .or. size(parameter_set%dz) /= numnod .or. &
          size(parameter_set%node_distance) /= numnod) error stop 'HeadCalc: explicit grid geometry shape mismatch'"""
          new = """      if (size(parameter_set%z) /= numnod .or. size(parameter_set%dz) /= numnod .or. &
          (size(parameter_set%node_distance) /= numnod .and. &
           size(parameter_set%node_distance) /= numnod+1)) error stop 'HeadCalc: explicit grid geometry shape mismatch'"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one HeadCalc shape marker, found {s.count(old)}')
          headcalc.write_text(s.replace(old, new, 1))

          new_blob = subprocess.check_output(['git','hash-object',str(headcalc)], text=True).strip()
          gate = Path('tests/fsi/run_fsi16_prescribed_bottom_head_gate.sh')
          g = gate.read_text()
          old_src = "expected_src=$'src/adapter/mod_reference_richards_legacy_binding.f90\\nsrc/solver/mod_soil_water_solver_contract.f90'"
          new_src = "expected_src=$'src/adapter/mod_reference_richards_legacy_binding.f90\\nsrc/legacy/b1_10_port/headcalc.f90\\nsrc/solver/mod_soil_water_solver_contract.f90'"
          if g.count(old_src) != 1:
              raise SystemExit('expected production-delta marker not found exactly once')
          g = g.replace(old_src, new_src, 1)
          old_blob = 'check_blob src/legacy/b1_10_port/headcalc.f90 7ce94a4cfc4634b946f41b01f54d2d7f6efc798f'
          new_blob_line = f'check_blob src/legacy/b1_10_port/headcalc.f90 {new_blob}'
          if g.count(old_blob) != 1:
              raise SystemExit('expected old HeadCalc blob pin not found exactly once')
          g = g.replace(old_blob, new_blob_line, 1)
          anchor = "grep -Fq 'size(request%parameters%node_distance) /= n+1' src/solver/mod_soil_water_solver_contract.f90\n"
          assertion = "grep -Fq 'size(parameter_set%node_distance) /= numnod+1' src/legacy/b1_10_port/headcalc.f90\n"
          if g.count(anchor) != 1:
              raise SystemExit('gate geometry assertion anchor not found exactly once')
          g = g.replace(anchor, anchor + assertion, 1)
          gate.write_text(g)
          PY
          git diff --check
          git rm .github/workflows/fsi16-one-shot-headcalc-shape-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/legacy/b1_10_port/headcalc.f90 tests/fsi/run_fsi16_prescribed_bottom_head_gate.sh
          git commit -m 'F-SI16: admit lower-face geometry in HeadCalc'
          git push origin HEAD:work/f-si16-explicit-prescribed-bottom-head
