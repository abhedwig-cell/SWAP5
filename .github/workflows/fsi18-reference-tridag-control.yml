name: F-SI18 reference TRIDAG control

on:
  push:
    branches:
      - work/f-si18-reference-convergence-cliff
    paths:
      - 'integration/f-si/F-SI18_*.json'
      - 'tests/fsi/test_fsi18_reference_convergence_cliff.F90'
      - 'tests/fsi/fsi18_make_reference_tridag_stubs.py'
      - 'tests/fsi/run_fsi18_reference_tridag_control_gate.sh'
      - '.github/workflows/fsi18-reference-tridag-control.yml'
  workflow_dispatch:

jobs:
  fsi18-reference-tridag-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run F-SI18 test-only reference TRIDAG control
        env:
          FSI18_TRIDAG_EVIDENCE_DIR: ${{ github.workspace }}/fsi18-reference-tridag-evidence
        run: bash tests/fsi/run_fsi18_reference_tridag_control_gate.sh
      - name: Upload F-SI18 reference TRIDAG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsi18-reference-tridag-control-evidence
          path: fsi18-reference-tridag-evidence
          if-no-files-found: error
