name: F-SI20 fixed-horizon tolerance axis

on:
  push:
    branches:
      - work/f-si20-richards-temporal-error-semantics
    paths:
      - 'tests/fsi/test_fsi20_fixed_horizon_tolerance_axis.f90'
      - 'tests/fsi/run_fsi20_fixed_horizon_tolerance_axis.sh'
      - '.github/workflows/fsi20-fixed-horizon-tolerance-axis.yml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run fixed-horizon nonlinear tolerance axis
        run: bash tests/fsi/run_fsi20_fixed_horizon_tolerance_axis.sh
