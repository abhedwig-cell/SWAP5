name: F-SI20 hydraulic-state refinement

on:
  push:
    branches:
      - work/f-si20-richards-temporal-error-semantics
    paths:
      - 'tests/fsi/test_fsi20_hydraulic_state_refinement.f90'
      - 'tests/fsi/run_fsi20_hydraulic_state_refinement.sh'
      - '.github/workflows/fsi20-hydraulic-state-refinement.yml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run hydraulic-state refinement curves
        run: bash tests/fsi/run_fsi20_hydraulic_state_refinement.sh
