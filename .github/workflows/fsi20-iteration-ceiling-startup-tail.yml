name: F-SI20 iteration-ceiling startup tail

on:
  push:
    branches:
      - work/f-si20-richards-temporal-error-semantics
    paths:
      - 'tests/fsi/run_fsi20_iteration_ceiling_startup_tail.sh'
      - '.github/workflows/fsi20-iteration-ceiling-startup-tail.yml'
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run iteration-ceiling startup-tail axis
        run: |
          set -o pipefail
          bash tests/fsi/run_fsi20_iteration_ceiling_startup_tail.sh | tee fsi20-iteration-ceiling-startup-tail.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsi20-iteration-ceiling-startup-tail
          path: fsi20-iteration-ceiling-startup-tail.log
          if-no-files-found: error
