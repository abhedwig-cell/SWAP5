name: F-SI20 prescribed-head startup tail

on:
  push:
    branches:
      - work/f-si20-richards-temporal-error-semantics
    paths:
      - 'tests/fsi/run_fsi20_prescribed_head_startup_tail.sh'
      - '.github/workflows/fsi20-prescribed-head-startup-tail.yml'
      - 'tests/fsi/test_fsi20_prescribed_head_temporal_characterization.f90'
      - 'tests/fsi/run_fsi20_prescribed_head_temporal_characterization.sh'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run exact-control startup-tail characterization
        run: bash tests/fsi/run_fsi20_prescribed_head_startup_tail.sh
