name: F-SI21 dynamic local hydraulic Gate B

on:
  push:
    branches:
      - work/f-si21-hydraulic-timescale-retry-translation
  workflow_dispatch:

jobs:
  gate-b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run frozen dynamic-local hydraulic characterization
        run: |
          set -o pipefail
          bash tests/fsi/run_fsi21_dynamic_local_hydraulics_v2.sh | tee fsi21-gate-b.log
      - name: Preserve Gate B characterization
        uses: actions/upload-artifact@v4
        with:
          name: fsi21-dynamic-local-hydraulic-gate-b
          path: fsi21-gate-b.log
          if-no-files-found: error
