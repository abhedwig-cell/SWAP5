name: F-SI21 same-endpoint temporal characterization

on:
  push:
    branches:
      - work/f-si21-nonstationary-temporal-estimator-policy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run F-SI21 same-endpoint characterization
        run: bash tests/fsi/run_fsi21_same_endpoint_characterization.sh
