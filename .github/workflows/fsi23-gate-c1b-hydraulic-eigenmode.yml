name: F-SI23 Gate C1B hydraulic eigenmode observer

on:
  push:
    branches:
      - work/f-si23-richards-embedded-temporal-estimator
    paths:
      - 'integration/f-si/F-SI23_GATE_C1B_HYDRAULIC_EIGENMODE_PLAN.json'
      - 'integration/f-si/F-SI23_GATE_C1_PLAN_SOURCE_RECONCILIATION.json'
      - 'tests/fsi/mod_fsi23_mms_providers.f90'
      - 'tests/fsi/test_fsi23_gate_c1b_hydraulic_eigenmode.f90'
      - 'tests/fsi/run_fsi23_gate_c1b_hydraulic_eigenmode.sh'
      - '.github/workflows/fsi23-gate-c1b-hydraulic-eigenmode.yml'
  workflow_dispatch:

jobs:
  eigenmode-observer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run frozen F-SI23 Gate C1B eigenmode observer test
        run: bash tests/fsi/run_fsi23_gate_c1b_hydraulic_eigenmode.sh
