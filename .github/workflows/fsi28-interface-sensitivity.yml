name: F-SI28 interface sensitivity production solve

on:
  push:
    branches:
      - work/f-si28-interface-sensitivity-production-solve
    paths:
      - 'integration/f-si/F-SI28_*'
      - 'tests/fsi/run_fsi28_interface_sensitivity_gate.sh'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/solver/mod_reference_linear_solver.f90'
      - 'src/solver/mod_reference_richards_workspace.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - '.github/workflows/fsi28-interface-sensitivity.yml'
  workflow_dispatch:

jobs:
  same-factorization-qbot-tangent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-SI28 pinned F-SI27 same-factorization qbot tangent gate
        run: |
          # Diagnostic-only runner instrumentation: preserve the checked-in gate
          # logic and thresholds, but surface its captured executable output when
          # ERROR STOP makes the shell return before the normal cat step.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/fsi/run_fsi28_interface_sensitivity_gate.sh')
          s = p.read_text()
          old = '  timeout 60s env OMP_NUM_THREADS=1 OMP_DYNAMIC=false "$out/test_fsi28" > "$out/output.txt"\n'
          new = '''  if ! timeout 60s env OMP_NUM_THREADS=1 OMP_DYNAMIC=false "$out/test_fsi28" > "$out/output.txt" 2>&1; then
            cat "$out/output.txt"
            fail "O${opt} executable failed"
          fi
          '''
          if old not in s:
              raise SystemExit('FSI28 diagnostic instrumentation target missing')
          p.write_text(s.replace(old, new, 1))
          PY
          bash tests/fsi/run_fsi28_interface_sensitivity_gate.sh
