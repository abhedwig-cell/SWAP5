name: F-SI30 dynamic top-boundary solver-interface gate

on:
  push:
    branches:
      - work/f-si30-dynamic-top-boundary-solver-interface
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abi-adapter-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Run F-SI30 ABI/adapter compile gate
        run: bash tests/fsi/run_fsi30_abi_adapter_compile_gate.sh

  headcalc-bridge-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Run F-SI30 HeadCalc bridge compile gate
        run: bash tests/fsi/run_fsi30_headcalc_compile_gate.sh

  adapter-identity-9072:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Run F-SI30 9072-case adapter identity gate
        run: bash tests/fsi/run_fsi30_adapter_identity_gate.sh

  dynamic-headcalc-execution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: Run F-SI30 real dynamic HeadCalc execution gate
        run: bash tests/fsi/run_fsi30_dynamic_headcalc_execution_gate.sh
