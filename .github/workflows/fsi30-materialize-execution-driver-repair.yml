name: F-SI30 materialize execution driver repair

on:
  push:
    branches:
      - work/f-si30-dynamic-top-boundary-solver-interface
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-si30-dynamic-top-boundary-solver-interface
          fetch-depth: 0
      - name: Repair exact source-bound execution driver calls
        run: python3 tests/fsi/materialize_fsi30_execution_call_arity.py
      - name: Commit repaired qualification driver
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/fsi/test_fsi30_dynamic_headcalc_execution.f90; then
            echo 'FSI30_EXECUTION_DRIVER_NO_CHANGE=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fsi/test_fsi30_dynamic_headcalc_execution.f90
          git commit -m 'test(F-SI30): repair execution case argument arity'
          git push origin HEAD:work/f-si30-dynamic-top-boundary-solver-interface
