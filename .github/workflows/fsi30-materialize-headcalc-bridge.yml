name: F-SI30 materialize HeadCalc bridge

on:
  push:
    branches:
      - work/f-si30-dynamic-top-boundary-solver-interface
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-si30-dynamic-top-boundary-solver-interface
          fetch-depth: 0
      - name: Materialize exact source-bound bridge
        run: python3 tests/fsi/materialize_fsi30_headcalc_bridge.py
      - name: Commit materialized production source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/legacy/b1_10_port/headcalc.f90; then
            echo 'FSI30_MATERIALIZER_NO_CHANGE=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/legacy/b1_10_port/headcalc.f90
          git commit -m 'feat(F-SI30): route dynamic top-boundary result through HeadCalc'
          git push origin HEAD:work/f-si30-dynamic-top-boundary-solver-interface
