name: F-SI30 materialize typed dynamic top solver admission

on:
  push:
    branches:
      - work/f-si30-dynamic-top-boundary-solver-interface
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f-si30-dynamic-top-boundary-solver-interface
          fetch-depth: 0
      - name: Materialize exact source-bound solver validation
        run: python3 tests/fsi/materialize_fsi30_solver_validation.py
      - name: Commit materialized solver admission
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/adapter/mod_reference_richards_legacy_binding.f90; then
            echo 'FSI30_SOLVER_VALIDATION_NO_CHANGE=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapter/mod_reference_richards_legacy_binding.f90
          git commit -m 'feat(F-SI30): admit typed dynamic top mode in reference solver'
          git push origin HEAD:work/f-si30-dynamic-top-boundary-solver-interface
