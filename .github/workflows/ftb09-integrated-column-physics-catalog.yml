name: F-TB09 integrated column physics catalog

on:
  push:
    branches:
      - work/f-tb09-integrated-column-physics-process-interaction-catalog
  pull_request:
    paths:
      - '.github/workflows/ftb09-integrated-column-physics-catalog.yml'
      - 'docs/testbank/F-TB09_*'
      - 'testbank/manifests/F-TB09_*'
      - 'testbank/runners/validate_ftb09_*'
      - 'integration/f-tb/F-TB09_*'
      - 'integration/f-tb/RUNLOG_F-TB09.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate F-TB09 catalog contract
        run: |
          python testbank/runners/validate_ftb09_integrated_column_physics_catalog.py \
            --manifest testbank/manifests/F-TB09_INTEGRATED_COLUMN_PHYSICS_CASES.json \
            --base 42544af575db522d012db491db801615577048df \
            --repo-root .
