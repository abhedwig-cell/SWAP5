name: F-TB10 blocked drain-bottom assessment

on:
  push:
    branches:
      - work/f-tb10-drain-bottom-integrated-qualification
  workflow_dispatch:

permissions:
  contents: read

env:
  FTB10_CANONICAL_BASE: eba90d79010b095b6556e93bd8b77a8c28d25560
  FTB10_FTB09_AUTHORITY: fe3545c4537b11cefd0186aa401048d4f4b10eb9
  FTB10_FVQ28_AUTHORITY: d8bcb1c90e897812ae8b91295be98e58023e10fb
  FTB10_FVQ34_AUTHORITY: df9b1123ba33ece022ce6649e70dcb538e44837f
  FTB10_FGC22_AUTHORITY: c50f3770ae8e4bee7c276a080be00156218944f1

jobs:
  validate-blocked-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact head and canonical start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BRANCH_REMOTE="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$BRANCH_REMOTE"
          test "$BRANCH_REMOTE" = "$GITHUB_SHA"
          CANONICAL_REMOTE="$(git ls-remote origin refs/heads/integration/f-ci-canonical | awk '{print $1}')"
          test -n "$CANONICAL_REMOTE"
          test "$CANONICAL_REMOTE" = "$FTB10_CANONICAL_BASE"
          echo "FTB10_BLOCKED_EXACT_HEAD_START=$GITHUB_SHA"
          echo "FTB10_BLOCKED_CANONICAL_START=$CANONICAL_REMOTE"

      - name: Materialize pinned authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            "$FTB10_CANONICAL_BASE" \
            "$FTB10_FTB09_AUTHORITY" \
            "$FTB10_FVQ28_AUTHORITY" \
            "$FTB10_FVQ34_AUTHORITY" \
            "$FTB10_FGC22_AUTHORITY"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$sha"
            fi
            git cat-file -e "$sha^{commit}"
          done
          echo 'FTB10_BLOCKED_PINNED_AUTHORITIES_AVAILABLE=PASS'

      - name: Validate blocked authority
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$FTB10_CANONICAL_BASE"..HEAD
          python3 tests/ftb/validate_ftb10_blocked_closeout.py

      - name: Exact head and canonical end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BRANCH_REMOTE="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$BRANCH_REMOTE"
          test "$BRANCH_REMOTE" = "$GITHUB_SHA"
          CANONICAL_REMOTE="$(git ls-remote origin refs/heads/integration/f-ci-canonical | awk '{print $1}')"
          test -n "$CANONICAL_REMOTE"
          test "$CANONICAL_REMOTE" = "$FTB10_CANONICAL_BASE"
          echo "FTB10_BLOCKED_EXACT_HEAD_END=$GITHUB_SHA"
          echo "FTB10_BLOCKED_CANONICAL_END=$CANONICAL_REMOTE"
          echo 'FTB10_BLOCKED_CLOSEOUT_EXACT_HEAD=PASS'
