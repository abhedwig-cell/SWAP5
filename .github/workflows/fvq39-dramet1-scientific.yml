name: F-VQ39 independent DRAMET1 scientific qualification

on:
  push:
    branches:
      - qualification/f-vq39-fpm08c1-tabulated-drainage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-scientific-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run F-VQ39 independent DRAMET1 scientific gate
        run: bash tests/fvq/run_fvq39_dramet1_scientific_gate.sh
