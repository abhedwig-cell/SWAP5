name: F-VQ54 independent F-PM06E surface evaporation capacity qualification

on:
  push:
    branches:
      - qualification/f-vq54-fpm06e-surface-evaporation-capacity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-VQ54 source-bound independent qualification
        run: bash tests/fvq/run_fvq54_surface_evaporation_capacity_requalification.sh
