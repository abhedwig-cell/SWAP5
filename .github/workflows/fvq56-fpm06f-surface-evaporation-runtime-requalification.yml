name: F-VQ56 F-PM06F surface evaporation runtime requalification

on:
  push:
    branches:
      - qualification/f-vq56-fpm06f-surface-evaporation-runtime-requalification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: F-VQ56 independent qualification gate
        run: bash tests/fvq/run_fvq56_surface_evaporation_runtime_requalification.sh
