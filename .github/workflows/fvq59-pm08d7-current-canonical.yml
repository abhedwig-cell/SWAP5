name: F-VQ59 PM08D7 current-canonical independent qualification

on:
  push:
    branches:
      - qualification/f-vq59-fpm08d7-fixed-weir-current-canonical
  workflow_dispatch:

jobs:
  independent-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FPM08D7_TX_EVIDENCE_DIR: _fvq59_evidence/transaction
      FPM08D7_RESTART_EVIDENCE_DIR: _fvq59_evidence/restart
      FPM08D7_CANONICAL_BASE: eba90d79010b095b6556e93bd8b77a8c28d25560
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compiler identity
        run: gfortran --version

      - name: Pin current-canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$FPM08D7_CANONICAL_BASE" HEAD)" = "$FPM08D7_CANONICAL_BASE"
          test "$(git rev-list --count HEAD.."$FPM08D7_CANONICAL_BASE")" = 0
          mkdir -p _fvq59_evidence
          git rev-parse HEAD | tee _fvq59_evidence/tested-head.txt
          printf '%s\n' "$FPM08D7_CANONICAL_BASE" | tee _fvq59_evidence/canonical-base.txt
          git diff --name-status "$FPM08D7_CANONICAL_BASE"..HEAD | tee _fvq59_evidence/current-canonical-diff.txt

      - name: Restricted fixed-weir process qualification
        run: bash tests/fpm/run_fpm08d7_fixed_weir_process_checkpoint.sh

      - name: Current runtime compile qualification
        run: bash tests/fpm/run_fpm08d7_runtime_compile_checkpoint.sh

      - name: Transaction mass rollback qualification
        run: bash tests/fpm/run_fpm08d7_transactional_runtime_owner.sh

      - name: Restart lifecycle qualification
        run: bash tests/fpm/run_fpm08d7_restart_lifecycle_owner.sh

      - name: Current-canonical MultiSWAP and legacy preservation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$FPM08D7_CANONICAL_BASE"..HEAD -- reference
          git diff --quiet "$FPM08D7_CANONICAL_BASE"..HEAD -- src/legacy/b1_10_port/headcalc.f90
          git diff --quiet "$FPM08D7_CANONICAL_BASE"..HEAD -- src/runtime/mod_fmr_serialized_multiswap_runtime.f90
          git diff --quiet "$FPM08D7_CANONICAL_BASE"..HEAD -- src/runtime/mod_fmr_checkpoint_orchestrator.f90
          git rev-parse "$FPM08D7_CANONICAL_BASE":reference > _fvq59_evidence/canonical-reference-tree.txt
          git rev-parse HEAD:reference > _fvq59_evidence/candidate-reference-tree.txt
          git rev-parse "$FPM08D7_CANONICAL_BASE":src/legacy/b1_10_port/headcalc.f90 > _fvq59_evidence/canonical-headcalc-blob.txt
          git rev-parse HEAD:src/legacy/b1_10_port/headcalc.f90 > _fvq59_evidence/candidate-headcalc-blob.txt
          git rev-parse "$FPM08D7_CANONICAL_BASE":src/runtime/mod_fmr_serialized_multiswap_runtime.f90 > _fvq59_evidence/canonical-multiswap-runtime-blob.txt
          git rev-parse HEAD:src/runtime/mod_fmr_serialized_multiswap_runtime.f90 > _fvq59_evidence/candidate-multiswap-runtime-blob.txt
          echo F_VQ59_REFERENCE_LEGACY_MULTISWAP_RUNTIME_BIT_PRESERVED=PASS

      - name: PM08D7 MultiSWAP column-isolation structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          backend = Path('src/runtime/mod_fmr_serialized_reference_backend.f90').read_text().lower()
          wrapper = Path('src/runtime/mod_fmr_fixed_weir_serialized_runtime.f90').read_text().lower()
          process = Path('src/process/mod_restricted_fixed_weir_surface_water.f90').read_text().lower()
          base_start = backend.index('type, extends(canonical_state_t), public :: fmr_b110_physical_state_t')
          base_end = backend.index('end type fmr_b110_physical_state_t', base_start)
          fixed_start = backend.index('type, extends(fmr_b110_physical_state_t), public :: fmr_b110_fixed_weir_surface_water_state_t')
          fixed_end = backend.index('end type fmr_b110_fixed_weir_surface_water_state_t', fixed_start)
          assert 'surface_water' not in backend[base_start:base_end]
          assert 'type(fixed_weir_surface_water_state_t) :: surface_water' in backend[fixed_start:fixed_end]
          assert 'type(kernel_committed_state_t), intent(inout) :: committed' in wrapper
          assert 'type(fmr_logical_column_t), intent(in) :: column' in wrapper
          assert 'call backend%clear_fixed_weir_surface_water()' in wrapper
          for text, label in [(wrapper, 'wrapper'), (process, 'process')]:
              assert ' save' not in text, label
              assert '\ncommon' not in text, label
          print('F_VQ59_PM08D7_PER_COLUMN_OPTIONAL_STATE=PASS')
          print('F_VQ59_PM08D7_EXPLICIT_COMMITTED_COLUMN_OWNERSHIP=PASS')
          print('F_VQ59_PM08D7_BACKEND_CONTEXT_CLEARED_AFTER_COLUMN=PASS')
          PY
          echo F_VQ59_PM08D7_MULTISWAP_COLUMN_ISOLATION=PASS

      - name: No hidden I-O or process-owned persistent scratch
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eni '(^|[^[:alnum:]_])(open|read|write|close)[[:space:]]*\(' src/process/mod_restricted_fixed_weir_surface_water.f90 src/runtime/mod_fmr_fixed_weir_serialized_runtime.f90
          ! grep -Eni '(^|[^[:alnum:]_])(save|common)[^[:alnum:]_]' src/process/mod_restricted_fixed_weir_surface_water.f90 src/runtime/mod_fmr_fixed_weir_serialized_runtime.f90
          echo F_VQ59_NO_HIDDEN_IO_OR_PERSISTENT_SCRATCH=PASS

      - name: Preserve F-MR41 ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/runtime/mod_fmr_optional_state_layouts.f90
          grep -Fq 'FMR_OPTIONAL_STATE_LAYOUT_FIXED_WEIR_SURFACE_WATER' src/runtime/mod_fmr_runtime_core.f90
          grep -Fq 'tests/fpm/mod_fpm08d7_optional_state_compat.f90' tests/fpm/run_fpm08d7_transactional_runtime_owner.sh
          echo F_VQ59_FMR41_OPTIONAL_STATE_OWNER_PRESERVED=PASS

      - name: Diff hygiene
        run: git diff --check "$FPM08D7_CANONICAL_BASE"..HEAD

      - name: Upload independent qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F-VQ59-PM08D7-current-canonical-evidence
          path: _fvq59_evidence
          if-no-files-found: warn
