name: F-VQ61 GC18R R1 independent requalification

on:
  push:
    branches:
      - qualification/f-vq61-gc18r-r1-transactional-groundwater-exchange-independent-requalification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-requalification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checked-out verifier head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-VQ61 independent GC18R R1 qualification
        run: bash tests/fvq/run_fvq61_gc18r_r1_independent_gate.sh
