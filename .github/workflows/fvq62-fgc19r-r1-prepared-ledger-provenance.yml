name: F-VQ62 F-GC19R-R1 prepared ledger provenance independent qualification

on:
  push:
    branches:
      - qualification/f-vq62-fgc19r-r1-prepared-ledger-provenance-independent-qualification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
      - name: Compiler identity
        run: gfortran --version
      - name: F-VQ62 independent qualification
        run: bash tests/fvq/run_fvq62_fgc19r_r1_prepared_ledger_provenance.sh
      - name: Exact head end
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$GITHUB_SHA"
