name: F-VQ68 F-SI35 independent qualification

on:
  push:
    branches:
      - qualification/f-vq68-fsi35-mandatory-solver-seam-independent-qualification

jobs:
  independent-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run independent F-SI35 gate
        run: bash tests/fvq/run_fvq68_fsi35_independent.sh
