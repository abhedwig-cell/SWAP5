name: F-VQ76 drainage post-FCI62 preservation requalification

on:
  push:
    branches:
      - qualification/f-vq76-drainage-post-fci62-preservation-requalification
  workflow_dispatch:

jobs:
  independent-preservation-requalification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Fetch immutable qualification authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            work/f-pm13-drainage-v1-completion-audit \
            work/f-pm14-drainage-response-runtime-closure \
            work/f-pm17-drainage-response-fully-implicit-coupling \
            qualification/f-vq73-fpm14-drainage-response-runtime-independent-qualification \
            qualification/f-vq74-drainage-v1-cross-cutting-independent-closure \
            integration/f-ci-canonical
      - name: Run independent drainage current-postimage requalification
        shell: bash
        run: bash tests/fvq/run_fvq76_drainage_post_fci62_preservation_requalification.sh
