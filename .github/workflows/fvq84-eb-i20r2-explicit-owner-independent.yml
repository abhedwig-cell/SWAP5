name: F-VQ84 EB-I20R2 explicit owner independent qualification

on:
  push:
    branches:
      - qualification/f-vq84-eb-i20r2-explicit-owner-identity-independent-qualification
    paths:
      - 'tests/fvq/mod_fvq84_receipt_model.f90'
      - 'tests/fvq/test_fvq84_explicit_owner_identity_independent.f90'
      - 'tests/fvq/run_fvq84_eb_i20r2_explicit_owner_independent.sh'
      - '.github/workflows/fvq84-eb-i20r2-explicit-owner-independent.yml'
      - 'qualification/F-VQ84_STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tested head identity
        run: |
          echo "FVQ84_TESTED_HEAD=$(git rev-parse HEAD)"
          echo "FVQ84_TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Compiler identity
        run: gfortran --version
      - name: Independent explicit-owner qualification
        run: bash tests/fvq/run_fvq84_eb_i20r2_explicit_owner_independent.sh
