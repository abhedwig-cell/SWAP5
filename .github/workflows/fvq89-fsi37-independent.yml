name: F-VQ89 F-SI37 independent qualification

on:
  push:
    branches:
      - qualification/f-vq89-fsi37-accepted-step-directional-derivative-seam-independent-qualification
  pull_request:
    paths:
      - 'src/solver/mod_soil_water_accepted_step_direction_contract.f90'
      - 'src/solver/mod_b110_default_mvg_directional_provider.f90'
      - 'src/adapter/mod_b110_dynamic_top_boundary_directional_adapter.f90'
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'tests/qualification/fvq89/**'
      - '.github/workflows/fvq89-fsi37-independent.yml'

jobs:
  independent-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run independent F-SI37 qualification
        run: bash tests/qualification/fvq89/run_fvq89_fsi37_independent.sh
