name: F-WOF11 root uptake crop input provider

on:
  push:
    branches:
      - work/f-wof11-root-uptake-crop-input-provider
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: F-WOF11 crop input provider contract gate
        run: bash tests/fwof/run_fwof11_root_uptake_crop_input_gate.sh

      - name: F-MR09 cross-process regression
        run: bash tests/fmr/run_fmr09_root_sink_runtime_gate.sh
