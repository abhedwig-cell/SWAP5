name: F-WOF14 root uptake producer readiness

on:
  push:
    branches:
      - work/f-wof14-root-uptake-producer-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: F-WOF14 producer readiness gate
        run: bash tests/fwof/run_fwof14_root_uptake_producer_readiness_gate.sh
