name: F-WOF31 prepare assimilation

on:
  push:
    branches:
      - work/f-wof31-prepare-assimilation-provider
  workflow_dispatch:

jobs:
  prepare-assimilation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run F-WOF31 gate
        run: bash tests/fwof/run_fwof31_prepare_assimilation_gate.sh
