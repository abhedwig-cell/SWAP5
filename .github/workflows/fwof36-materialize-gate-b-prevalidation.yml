name: F-WOF36 materialize Gate B prevalidation helper

on:
  push:
    branches:
      - work/f-wof36-physical-trial-accepted-integral-binding
    paths:
      - 'tools/fwof36_materialize_gate_b_prevalidation.py'
      - '.github/workflows/fwof36-materialize-gate-b-prevalidation.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/f-wof36-physical-trial-accepted-integral-binding
      - name: Materialize additive accepted-window prevalidation helper
        run: python3 tools/fwof36_materialize_gate_b_prevalidation.py
      - name: Persist Gate B prevalidation helper
        run: |
          test -n "$(git status --porcelain -- src/runtime/mod_fmr_wofost_accepted_window_lineage.f90)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/mod_fmr_wofost_accepted_window_lineage.f90
          git commit -m "feat(F-WOF36): add accepted-window trial prevalidation helper"
          git push origin HEAD:work/f-wof36-physical-trial-accepted-integral-binding
