name: F-WOF37 F-WOF36 preservation

on:
  push:
    branches:
      - work/f-wof37-physical-accepted-window-crop-event-composition
    paths:
      - 'src/crop/mod_wofost_*.f90'
      - 'src/runtime/mod_fmr_wofost_accepted_window_lineage.f90'
      - 'src/runtime/mod_fmr_wofost_physical_trial_binding.f90'
      - 'tests/fwof/run_fwof37_fwo36_preservation_gate.sh'
      - '.github/workflows/fwof37-fwo36-preservation.yml'
  workflow_dispatch:

jobs:
  preserve-fwo36:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run F-WOF37 F-WOF36 preservation gate
        run: bash tests/fwof/run_fwof37_fwo36_preservation_gate.sh
