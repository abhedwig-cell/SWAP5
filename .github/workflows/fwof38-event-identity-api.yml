name: F-WOF38 event identity API

on:
  push:
    branches:
      - work/f-wof38-atomic-crop-owner-delivery-transaction
    paths:
      - 'tests/fwof/run_fwof38_gate_a_event_identity_api.sh'
      - '.github/workflows/fwof38-event-identity-api.yml'
      - 'integration/f-wof/F-WOF38_DESIGN_PRECOMMIT.json'
      - 'src/runtime/mod_fmr_wofost_accepted_window_lineage.f90'
      - 'src/kernel/mod_kernel_transactions.f90'
      - 'src/transaction/mod_transaction_reference.f90'
      - 'src/runtime/mod_canonical_contracts.f90'
      - 'src/runtime/mod_canonical_interval_runtime.f90'
      - 'src/crop/**'
      - 'tests/fwof/test_fwof34_accepted_window_runtime_lineage.f90'
  workflow_dispatch:

jobs:
  qualify-event-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
      - name: Run F-WOF38 event identity API gate
        run: bash tests/fwof/run_fwof38_gate_a_event_identity_api.sh
