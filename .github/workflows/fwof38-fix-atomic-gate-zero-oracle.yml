name: F-WOF38 repair strict atomic gate harness

on:
  push:
    branches:
      - work/f-wof38-atomic-crop-owner-delivery-transaction
    paths:
      - '.github/workflows/fwof38-fix-atomic-gate-zero-oracle.yml'

permissions:
  contents: write

jobs:
  fix-test-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unused generated-test declaration
        shell: bash
        run: |
          set -euo pipefail
          TARGET=tests/fwof/run_fwof38_atomic_crop_transaction_gate.sh
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          src = path.read_text(encoding='utf-8')
          old = '  logical :: crop_initialized, crop_checkpoint_ok, snapshot_available, did_commit\n'
          new = '  logical :: crop_checkpoint_ok, snapshot_available, did_commit\n'
          if src.count(old) != 1:
              raise SystemExit(f'FWOF38 unused-variable anchor count={src.count(old)}')
          path.write_text(src.replace(old, new, 1), encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "$TARGET"
          git diff --check
          grep -Fq 'logical :: crop_checkpoint_ok, snapshot_available, did_commit' "$TARGET"
          ! grep -Fq 'crop_initialized' "$TARGET"
          echo 'FWOF38_TEST_ONLY_UNUSED_VARIABLE_FIX=PASS'
      - name: Commit test-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SWAP5 Qualification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/fwof/run_fwof38_atomic_crop_transaction_gate.sh
          git commit -m 'test(F-WOF38): remove unused generated-test variable'
          git push origin HEAD:${GITHUB_REF_NAME}
