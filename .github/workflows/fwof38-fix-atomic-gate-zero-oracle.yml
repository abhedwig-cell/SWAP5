name: F-WOF38 fix atomic gate zero oracle

on:
  push:
    branches:
      - work/f-wof38-atomic-crop-owner-delivery-transaction
    paths:
      - '.github/workflows/fwof38-fix-atomic-gate-zero-oracle.yml'

permissions:
  contents: write

jobs:
  fix-test-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace direct REAL equality by existing bitwise zero oracle
        shell: bash
        run: |
          set -euo pipefail
          TARGET=tests/fwof/run_fwof38_atomic_crop_transaction_gate.sh
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          src = path.read_text(encoding='utf-8')
          old = 'crop_result1%mass%complete .and. crop_result1%mass%residual == 0.0_real64'
          new = 'crop_result1%mass%complete .and. bitwise_equal(crop_result1%mass%residual, 0.0_real64)'
          if src.count(old) != 1:
              raise SystemExit(f'FWOF38 strict-zero anchor count={src.count(old)}')
          path.write_text(src.replace(old, new, 1), encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "$TARGET"
          git diff --check
          grep -Fq 'bitwise_equal(crop_result1%mass%residual, 0.0_real64)' "$TARGET"
          echo 'FWOF38_TEST_ONLY_BITWISE_ZERO_ORACLE_FIX=PASS'
      - name: Commit test-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SWAP5 Qualification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/fwof/run_fwof38_atomic_crop_transaction_gate.sh
          git commit -m 'test(F-WOF38): use bitwise zero mass oracle'
          git push origin HEAD:${GITHUB_REF_NAME}
