name: F-WOF38 add Gate E retry oracle

on:
  push:
    branches:
      - work/f-wof38-atomic-crop-owner-delivery-transaction
    paths:
      - '.github/workflows/fwof38-fix-atomic-gate-zero-oracle.yml'

permissions:
  contents: write

jobs:
  add-gate-e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Gate E oracle
        shell: bash
        run: |
          set -euo pipefail
          echo '  nKGEpJywgJ0ZXT0YzOF9GQUlMRURfVEhFTl9BQ0NFUFRFRF9SRVRSWV9TQU1FX0NIRUNLUE9JTlRfRVhBQ1RMWV9PTkNF P ' | base64 -d > /tmp/fwof38_gate_e.py
          python3 /tmp/fwof38_gate_e.py
          git diff --check
          grep -Fq 'FWOF38_FAILED_THEN_ACCEPTED_RETRY_SAME_CHECKPOINT_EXACTLY_ONCE=PASS' tests/fwof/run_fwof38_atomic_crop_transaction_gate.sh
      - name: Commit Gate E test oracle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SWAP5 Qualification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/fwof/run_fwof38_atomic_crop_transaction_gate.sh
          git commit -m 'test(F-WOF38): add failed then accepted same-checkpoint retry'
          git push origin HEAD:${GITHUB_REF_NAME}
