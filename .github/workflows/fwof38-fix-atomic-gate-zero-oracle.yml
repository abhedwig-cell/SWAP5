name: F-WOF38 add explicit failed then accepted retry gate

on:
  push:
    branches:
      - work/f-wof38-atomic-crop-owner-delivery-transaction
    paths:
      - '.github/workflows/fwof38-fix-atomic-gate-zero-oracle.yml'

permissions:
  contents: write

jobs:
  add-gate-e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add same-checkpoint failed then accepted retry oracle
        shell: bash
        run: |
          set -euo pipefail
          TARGET=tests/fwof/run_fwof38_atomic_crop_transaction_gate.sh
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          src = path.read_text(encoding='utf-8')
          anchor = """  print '(a)', 'FWOF38_FAILED_CROP_EVOLUTION_ZERO_OWNER_RECEIPT_MUTATION=PASS'

  ! A policy that permits dt shrinking is not admitted for this fixed one-day
"""
          insert = """  print '(a)', 'FWOF38_FAILED_CROP_EVOLUTION_ZERO_OWNER_RECEIPT_MUTATION=PASS'

  ! Retry the same accepted physical event from exactly the same still-committed
  ! crop checkpoint after the failed crop trial. The failure above must have
  ! consumed neither owner state nor event receipt; this retry may publish once.
  call bad_crop_kernel%advance_interval(crop_parameters, bad_crop_committed, crop_event_forcing, crop_config, &
       100.0_real64, 101.0_real64, bad_crop_result, bad_crop_candidate, bad_crop_diag, bad_crop_checkpoint)
  call require(bad_crop_result%status == CANONICAL_STATUS_COMPLETED, &
       'F-WOF38 same-checkpoint accepted retry completes')
  call require(bad_crop_candidate%ready(), 'F-WOF38 same-checkpoint accepted retry candidate ready')
  call require(bad_crop_committed%current_revision() == 0, &
       'F-WOF38 accepted retry remains candidate-only before commit')
  call bad_crop_kernel%commit_candidate(bad_crop_committed, bad_crop_candidate, bad_crop_diag, &
       did_commit, crop_commit_status)
  call require(did_commit, 'F-WOF38 same-checkpoint accepted retry did commit')
  call require(crop_commit_status == KERNEL_COMMIT_STATUS_COMMITTED, &
       'F-WOF38 same-checkpoint accepted retry commit status')
  call require(bad_crop_committed%current_revision() == 1, &
       'F-WOF38 failed then accepted retry publishes exactly one revision')
  call bad_crop_committed%snapshot(crop_snapshot, snapshot_available)
  call require(snapshot_available, 'F-WOF38 retry committed snapshot')
  select type (tx => crop_snapshot)
  type is (fmr_wofost_crop_transaction_state_t)
    call tx%snapshot_owner(crop_snapshot_owner, snapshot_available)
    call require(snapshot_available, 'F-WOF38 retry owner snapshot available')
    call require(same_owner(crop_snapshot_owner, candidate1), &
         'F-WOF38 retry owner equals direct qualified candidate')
    call require(tx%receipt_ready(), 'F-WOF38 retry receipt committed')
    call require(tx%consumed_event(event_identity), 'F-WOF38 retry receipt matches source event')
  class default
    call require(.false., 'F-WOF38 retry committed state type')
  end select
  print '(a)', 'FWOF38_FAILED_THEN_ACCEPTED_RETRY_SAME_CHECKPOINT_EXACTLY_ONCE=PASS'

  ! A policy that permits dt shrinking is not admitted for this fixed one-day
"""
          if src.count(anchor) != 1:
              raise SystemExit(f'FWOF38 Gate E insertion anchor count={src.count(anchor)}')
          src = src.replace(anchor, insert, 1)
          marker_anchor = """    'FWOF38_FAILED_CROP_EVOLUTION_ZERO_OWNER_RECEIPT_MUTATION=PASS' \\
    'FWOF38_FIXED_ONE_DAY_EVENT_FORBIDS_RETRY_DT_SHRINKING=PASS' \\
"""
          marker_insert = """    'FWOF38_FAILED_CROP_EVOLUTION_ZERO_OWNER_RECEIPT_MUTATION=PASS' \\
    'FWOF38_FAILED_THEN_ACCEPTED_RETRY_SAME_CHECKPOINT_EXACTLY_ONCE=PASS' \\
    'FWOF38_FIXED_ONE_DAY_EVENT_FORBIDS_RETRY_DT_SHRINKING=PASS' \\
"""
          if src.count(marker_anchor) != 1:
              raise SystemExit(f'FWOF38 Gate E marker anchor count={src.count(marker_anchor)}')
          src = src.replace(marker_anchor, marker_insert, 1)
          path.write_text(src, encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "$TARGET"
          git diff --check
          grep -Fq 'FWOF38_FAILED_THEN_ACCEPTED_RETRY_SAME_CHECKPOINT_EXACTLY_ONCE=PASS' "$TARGET"
          echo 'FWOF38_GATE_E_TEST_ORACLE_ADDED=PASS'
      - name: Commit Gate E test oracle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SWAP5 Qualification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/fwof/run_fwof38_atomic_crop_transaction_gate.sh
          git commit -m 'test(F-WOF38): add failed then accepted same-checkpoint retry'
          git push origin HEAD:${GITHUB_REF_NAME}
