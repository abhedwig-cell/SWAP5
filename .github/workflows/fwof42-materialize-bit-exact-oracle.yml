name: F-WOF42 materialize bit-exact real oracle

on:
  push:
    branches:
      - work/f-wof42-crop-persistence-layout-completeness
    paths:
      - '.github/workflows/fwof42-materialize-bit-exact-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-bit-exact-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize bit-exact comparison oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fwof42_patch_bit_exact_oracle.py
          git diff --check
          if git diff --quiet; then
            echo 'FWOF42_BIT_EXACT_ORACLE_NO_CHANGE=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fwof/test_fwof42_crop_persistence_layouts.f90
          git commit -m 'fix(F-WOF42): make exact real comparisons bitwise'
          git push origin HEAD:work/f-wof42-crop-persistence-layout-completeness
          echo 'FWOF42_BIT_EXACT_ORACLE_COMMITTED=PASS'
