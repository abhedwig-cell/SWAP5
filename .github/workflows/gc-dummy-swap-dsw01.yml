name: GC dummy-SWAP concept testbank

on:
  push:
    branches:
      - work/f-gc-dummy-swap-shared-storage
    paths:
      - 'docs/research/GC_*.md'
      - 'integration/research/GC_DUMMY_SWAP_DSW*.json'
      - 'tests/research/test_gc_dummy_swap_dsw*.py'
      - 'tests/research/run_gc_dummy_swap_dsw01.sh'
      - '.github/workflows/gc-dummy-swap-dsw01.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/research/GC_*.md'
      - 'integration/research/GC_DUMMY_SWAP_DSW*.json'
      - 'tests/research/test_gc_dummy_swap_dsw*.py'
      - 'tests/research/run_gc_dummy_swap_dsw01.sh'
      - '.github/workflows/gc-dummy-swap-dsw01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concept-testbank:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python dependencies
        run: python3 -m pip install --upgrade pip flopy xmipy numpy
      - name: Run dummy-SWAP coupling concept testbank
        run: bash tests/research/run_gc_dummy_swap_dsw01.sh
