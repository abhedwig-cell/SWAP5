name: GC HLINK LOW01-A research
on:
  push:
    branches:
      - work/f-gc-hlink-low01-research
    paths:
      - 'tests/research/support/mod_gc_hlink_low01_groundwater_level_adapter.f90'
      - 'tests/research/test_gc_hlink_low01a_below_profile.f90'
      - 'tests/research/run_gc_hlink_low01a.sh'
      - 'integration/research/GC_HLINK_LOW01A_*.json'
      - '.github/workflows/gc-hlink-low01a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  low01a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run LOW01-A research gate
        run: bash tests/research/run_gc_hlink_low01a.sh
