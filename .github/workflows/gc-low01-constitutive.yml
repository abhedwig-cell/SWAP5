name: GC LOW01 constitutive bridge

on:
  push:
    branches:
      - work/f-gc-dummy-swap-shared-storage
    paths:
      - 'integration/research/GC_LOW01B_CONSTITUTIVE_OWNERSHIP_AUDIT.json'
      - 'integration/research/GC_LOW01B_PREREGISTRATION_AMENDMENT_V2.json'
      - 'tests/research/support/mod_gc_low01_constitutive_bridge.f90'
      - 'tests/research/test_gc_low01_constitutive_bridge.f90'
      - 'tests/research/run_gc_low01_constitutive_bridge.sh'
      - '.github/workflows/gc-low01-constitutive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low01-constitutive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run provider-owned constitutive bridge qualification
        run: bash tests/research/run_gc_low01_constitutive_bridge.sh
