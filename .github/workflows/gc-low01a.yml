name: GC LOW01-A below-profile equivalence

on:
  push:
    branches:
      - work/f-gc-dummy-swap-shared-storage
    paths:
      - 'integration/research/GC_LOW01A_PREREGISTRATION.json'
      - 'integration/research/GC_LOW01_STATE01_PREREGISTRATION.json'
      - 'tests/research/test_gc_low01a_below_profile_equivalence.f90'
      - 'tests/research/test_gc_low01a_source_branch.py'
      - 'tests/research/test_gc_low01_state_machine.py'
      - 'tests/research/run_gc_low01a.sh'
      - '.github/workflows/gc-low01a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low01a:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run LOW01-A qualification
        run: bash tests/research/run_gc_low01a.sh
