name: GC LOW01-B inside-profile typed research slice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low01b:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Guard qualification prerequisites
        run: |
          test -f integration/research/GC_LOW01_MODE1_CANDIDATE_CARRIER_RESULT.json
          test -f integration/research/GC_LOW01A2_RESULT.json
          test -f integration/research/GC_LOW01_CONSTITUTIVE_BRIDGE_RESULT.json
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run prerequisite-bound LOW01-B qualification
        run: bash tests/research/run_gc_low01b.sh
