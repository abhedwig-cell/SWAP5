name: GC real-SWAP FGC44 semantic scan
on:
  push:
    branches: [work/f-gc-dummy-swap-shared-storage]
    paths:
      - 'integration/research/GC_DUMMY_SWAP_DSW22_PREREGISTRATION.json'
      - 'tests/research/test_gc_real_fgc44_response_storage_scan.py'
      - 'tests/research/run_gc_real_fgc44_response_storage_scan.sh'
      - 'tests/research/test_gc_fixed_interface_fgc44_globalization_g03.py'
      - 'tests/research/test_gc_fixed_interface_fgc44_regime_sweep_g07a.py'
      - 'tests/research/test_gc_fixed_interface_fgc44_safeguarded_newton_g08.py'
      - 'tests/research/test_gc_fixed_interface_fgc44_boundary_tangent_g09.py'
      - 'tests/research/test_gc_fixed_interface_fgc44_tangent_topology_g09a.py'
      - 'tests/research/test_gc_fixed_interface_fgc44_topology_tangent_g09b.py'
      - 'tests/research/test_gc_fixed_interface_fgc44_signature_decomposition_g09c.py'
      - 'tests/research/test_gc_fixed_interface_fgc44_stencil_multiscale_g09d.py'
      - 'integration/research/GC_FIXED_INTERFACE_G09D_PREREGISTRATION.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09C_RESULT.json'
      - 'tests/research/test_gc_fixed_interface_fgc44_multiscale_tangent_g09d.py'
      - 'integration/research/GC_FIXED_INTERFACE_G09D_PREREGISTRATION.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09C_RESULT.json'
      - 'tests/research/test_gc_fixed_interface_fgc44_stencil_class_tangent_g09d.py'
      - 'tests/research/test_gc_fixed_interface_fgc44_nonlinear_b4_g10.py'
      - 'integration/research/GC_FIXED_INTERFACE_G10_PREREGISTRATION.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09D_RESULT.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09D_PREREGISTRATION.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09C_RESULT.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09C_PREREGISTRATION.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09B_FIRST_EXECUTION_RESULT.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09B_PREREGISTRATION.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09A_RESULT.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09A_PREREGISTRATION.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09_FIRST_EXECUTION_RESULT.json'
      - 'integration/research/GC_FIXED_INTERFACE_G09_PREREGISTRATION.json'
      - 'integration/research/GC_FIXED_INTERFACE_G08_PREREGISTRATION.json'
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/fgc/support/fgc44_real_swap_ctypes.py'
      - 'tests/fgc/test_fgc44_real_swap_modflow_end_to_end.py'
      - 'tests/fgc/run_fgc44_real_swap_modflow_end_to_end.sh'
      - '.github/workflows/gc-real-fgc44-semantic-scan.yml'
  workflow_dispatch:

# CI trigger marker: groundwater-response-g03-20260921
permissions: {contents: read}
jobs:
  semantic-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned coupling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run preregistered DSW22 semantic scan
        run: bash tests/research/run_gc_real_fgc44_response_storage_scan.sh
      - name: Run bounded F-GC44 local head-response experiment
        run: bash tests/fgc/run_fgc44_real_swap_modflow_end_to_end.sh
 
