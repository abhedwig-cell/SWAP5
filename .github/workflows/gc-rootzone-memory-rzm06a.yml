name: GC rootzone memory RZM06A real-SWAP observables
on:
  push:
    branches: [work/gc-dummy-swap-rootzone-memory]
    paths:
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/fgc/support/fgc44_real_swap_ctypes.py'
      - 'tests/research/test_gc_rootzone_memory_rzm06a_observables.py'
      - 'tests/research/test_gc_rootzone_memory_rzm06a_sequential.py'
      - 'tests/research/test_gc_rootzone_memory_rzm06a_experiment.py'
      - 'tests/fgc/run_fgc44_real_swap_modflow_end_to_end.sh'
      - '.github/workflows/gc-rootzone-memory-rzm06a.yml'
permissions: {contents: read}
jobs:
  rzm06a:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run F-GC44 baseline plus RZM06A observable gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/fgc/run_fgc44_real_swap_modflow_end_to_end.sh
