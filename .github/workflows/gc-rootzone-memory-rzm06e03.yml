name: GC rootzone memory RZM06E03 root-matched deep memory

on:
  push:
    branches:
      - work/gc-dummy-swap-rootzone-memory
    paths:
      - 'integration/research/GC_ROOTZONE_MEMORY_RZM06E03_PREREGISTRATION.json'
      - 'docs/research/GC_ROOTZONE_MEMORY_RZM06E03_PREREGISTRATION.md'
      - 'tests/research/test_gc_rootzone_memory_rzm06e03_expand.f90'
      - 'tests/research/test_gc_rootzone_memory_rzm06e03_select.py'
      - 'tests/research/run_gc_rootzone_memory_rzm06e03.sh'
      - '.github/workflows/gc-rootzone-memory-rzm06e03.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gc-rootzone-memory-rzm06e03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Generate and select root-matched deep-memory states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p RZM06E03-EVIDENCE
          RZM06E03_EVIDENCE_DIR="$PWD/RZM06E03-EVIDENCE" bash tests/research/run_gc_rootzone_memory_rzm06e03.sh
      - name: Preserve E03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-rzm06e03-${{ github.run_id }}
          path: RZM06E03-EVIDENCE
          if-no-files-found: warn
