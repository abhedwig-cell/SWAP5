name: GC rootzone memory RZM06E04 root-matched interface-memory probe

on:
  push:
    branches:
      - work/gc-dummy-swap-rootzone-memory
    paths:
      - 'integration/research/GC_ROOTZONE_MEMORY_RZM06E04_PREREGISTRATION.json'
      - 'docs/research/GC_ROOTZONE_MEMORY_RZM06E04_PREREGISTRATION.md'
      - 'integration/research/GC_ROOTZONE_MEMORY_RZM06E03E_RESULT.json'
      - 'tests/research/test_gc_rootzone_memory_rzm06e04_extract.py'
      - 'tests/research/test_gc_rootzone_memory_rzm06e04_probe.f90'
      - 'tests/research/analyze_gc_rootzone_memory_rzm06e04.py'
      - 'tests/research/run_gc_rootzone_memory_rzm06e04.sh'
      - '.github/workflows/gc-rootzone-memory-rzm06e04.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gc-rootzone-memory-rzm06e04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify E03E pair authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open("integration/research/GC_ROOTZONE_MEMORY_RZM06E03E_RESULT.json",encoding="utf-8"))
          assert d["decision"]=="QUALIFIED_RESPONSE_BLIND_STORAGE_MATCHED_INTERFACE_STATE_PAIR_SELECTED"
          p=d["selected_pair"]
          assert p["A"]["provenance"]==["E01","CLOSED","1"]
          assert p["B"]["provenance"]==["E03","DRY_RECOVER","RECOVER","19"]
          assert p["abs_delta_profile_water_cm"]<=1e-4
          assert p["abs_delta_root30_water_cm"]<=1e-4
          assert p["abs_delta_bottom_node_pressure_head_cm"]>=1e-2
          print("GC_RZM06E04_PARENT_PAIR_AUTHORITY=PASS")
          PY
      - name: Compiler identity
        run: gfortran --version
      - name: Run fixed-Hc root-matched response probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p RZM06E04-EVIDENCE
          RZM06E04_EVIDENCE_DIR="$PWD/RZM06E04-EVIDENCE" bash tests/research/run_gc_rootzone_memory_rzm06e04.sh
      - name: Preserve E04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-rzm06e04-${{ github.run_id }}
          path: RZM06E04-EVIDENCE
          if-no-files-found: warn
