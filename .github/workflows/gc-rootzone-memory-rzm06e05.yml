name: GC rootzone memory RZM06E05 nested storage-resolution census

on:
  push:
    branches:
      - work/gc-dummy-swap-rootzone-memory
    paths:
      - 'integration/research/GC_ROOTZONE_MEMORY_RZM06E05_PREREGISTRATION.json'
      - 'docs/research/GC_ROOTZONE_MEMORY_RZM06E05_PREREGISTRATION.md'
      - 'integration/research/GC_ROOTZONE_MEMORY_RZM06E04_RESULT.json'
      - 'tests/research/test_gc_rootzone_memory_rzm06e05_census.py'
      - 'tests/research/run_gc_rootzone_memory_rzm06e05.sh'
      - '.github/workflows/gc-rootzone-memory-rzm06e05.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gc-rootzone-memory-rzm06e05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify E04 and immutable state authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open("integration/research/GC_ROOTZONE_MEMORY_RZM06E04_RESULT.json",encoding="utf-8"))
          assert d["decision"]=="SUPPORTED_ROOTMATCHED_INTERFACE_ADJACENT_MEMORY_AT_FROZEN_AGGREGATE_RESOLUTION"
          print("GC_RZM06E05_PARENT_E04_AUTHORITY=PASS")
          PY
          check_artifact() {
            local run="$1" id="$2" name="$3" digest="$4"
            local got expected
            got="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts"               --jq ".artifacts[] | select(.id == ${id}) | [.id,.name,.digest,.expired] | @tsv")"
            expected="$(printf '%s\t%s\t%s\tfalse' "$id" "$name" "$digest")"
            test "$got" = "$expected"
          }
          check_artifact 35740262904 10699533032 gc-rzm06d04-35740262904 sha256:cf53384687ae021befe15497b1a8e1159c0272ce40ff66bb4c0e77ed37f682a1
          check_artifact 35740688388 10698623937 gc-rzm06e01-35740688388 sha256:18d91fbba94dff5fcc377f607470d8f90b32b2ccca02e4767021340771047875
          check_artifact 35743604739 10701002354 gc-rzm06e03-35743604739 sha256:462fa22d1baa03eda51e9a380a2249e581bbee09cf291669c14de456ba310db7
          check_artifact 35744543880 10702396393 gc-rzm06e03b-35744543880 sha256:837326106380f7ffca67e764d5e48058b850afd8f486c538a35d4d08b5d417f5
          check_artifact 35745342749 10701053833 gc-rzm06e03c-35745342749 sha256:823d41a2471f28a938826df19ec07097f4be08c372a2c9a96332258c4189f34f
          echo 'GC_RZM06E05_ARTIFACT_AUTHORITIES=PASS'

      - uses: actions/download-artifact@v4
        with:
          name: gc-rzm06d04-35740262904
          path: STATE-LIB/D04
          github-token: ${{ github.token }}
          repository: abhedwig-cell/SWAP5
          run-id: 35740262904
      - uses: actions/download-artifact@v4
        with:
          name: gc-rzm06e01-35740688388
          path: STATE-LIB/E01
          github-token: ${{ github.token }}
          repository: abhedwig-cell/SWAP5
          run-id: 35740688388
      - uses: actions/download-artifact@v4
        with:
          name: gc-rzm06e03-35743604739
          path: STATE-LIB/E03
          github-token: ${{ github.token }}
          repository: abhedwig-cell/SWAP5
          run-id: 35743604739
      - uses: actions/download-artifact@v4
        with:
          name: gc-rzm06e03b-35744543880
          path: STATE-LIB/E03B
          github-token: ${{ github.token }}
          repository: abhedwig-cell/SWAP5
          run-id: 35744543880
      - uses: actions/download-artifact@v4
        with:
          name: gc-rzm06e03c-35745342749
          path: STATE-LIB/E03C
          github-token: ${{ github.token }}
          repository: abhedwig-cell/SWAP5
          run-id: 35745342749

      - name: Run response-blind nested-resolution census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p RZM06E05-EVIDENCE
          RZM06E05_EVIDENCE_DIR="$PWD/RZM06E05-EVIDENCE"             bash tests/research/run_gc_rootzone_memory_rzm06e05.sh               STATE-LIB/D04 STATE-LIB/E01 STATE-LIB/E03 STATE-LIB/E03B STATE-LIB/E03C

      - name: Preserve E05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-rzm06e05-${{ github.run_id }}
          path: RZM06E05-EVIDENCE
          if-no-files-found: warn
