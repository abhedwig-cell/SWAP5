name: GC rootzone memory RZM06E09A local-interface state census

on:
  push:
    branches:
      - work/gc-dummy-swap-rootzone-memory
    paths:
      - 'integration/research/GC_ROOTZONE_MEMORY_RZM06E09A_PREREGISTRATION.json'
      - 'tests/research/test_gc_rootzone_memory_rzm06e09a_census.py'
      - 'tests/research/run_gc_rootzone_memory_rzm06e09a.sh'
      - '.github/workflows/gc-rootzone-memory-rzm06e09a.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gc-rootzone-memory-rzm06e09a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run response-blind local-interface census
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p RZM06E09A-EVIDENCE
          RZM06E09A_EVIDENCE_DIR="$PWD/RZM06E09A-EVIDENCE" bash tests/research/run_gc_rootzone_memory_rzm06e09a.sh
      - name: Preserve E09A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-rzm06e09a-${{ github.run_id }}
          path: RZM06E09A-EVIDENCE
          if-no-files-found: warn
