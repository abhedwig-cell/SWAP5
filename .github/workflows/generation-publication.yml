name: Private portable generation publication qualification
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - tests/dataqual15_hupsel/generation_publication_*.py
      - tests/nut-output/generation_publication_windows_test.c
      - integration/dataqual15_hupsel/GENERATION_PUBLICATION_*
      - .github/workflows/generation-publication.yml
permissions:
  contents: read
jobs:
  native-posix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - name: Exact deployed postimages, sixteen malformed scope refusals and complete prior admission
        if: ${{ hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_SCOPE_20261106.json') != '' }}
        run: |
          python3 -B tests/dataqual15_hupsel/test_generation_publication_admission.py
          python3 -B tests/dataqual15_hupsel/generation_publication_admission.py --output "$RUNNER_TEMP/publication-current-admission"
      - name: Actual incumbent/candidate native API file states and independent CRC
        if: ${{ hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_SCOPE_20261106.json') == '' }}
        run: python3 -B tests/dataqual15_hupsel/generation_publication_c_probe.py --compiler /usr/bin/gcc --output "$RUNNER_TEMP/publication-c"
      - name: Remeasure retained full Windows source/object/native/fault/termination evidence
        if: ${{ hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_SCOPE_20261106.json') == '' }}
        run: python3 -B tests/dataqual15_hupsel/generation_publication_capsule.py
      - name: Actual private full native output/saved physical and process assertions O0/O2
        if: ${{ hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_POSIX_20261106.json') == '' }}
        # Essential uncovered risk: changed publication boundary in complete real
        # owners. Selected full cold provider/model closure, expected 10-15min;
        # a component probe cannot establish staged owner or fresh-process state.
        run: python3 -B tests/dataqual15_hupsel/generation_publication_models.py --role candidate --compiler /usr/bin/gfortran --output "$RUNNER_TEMP/publication-models"
      - name: Remeasure complete immutable original POSIX native model and process evidence
        if: ${{ hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_POSIX_20261106.json') != '' && hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_SCOPE_20261106.json') == '' }}
        run: python3 -B tests/dataqual15_hupsel/generation_publication_capsule.py --posix
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_POSIX_20261106.json') == '' }}
        with:
          name: private-publication-posix-originals
          path: |
            ${{ runner.temp }}/publication-c
            ${{ runner.temp }}/publication-models
  deployed-models:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - name: Actual current production dependency decisions and complete native build
        if: ${{ hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_SCOPE_20261106.json') != '' }}
        # Essential uncovered risk: delivery through the real compiler/link path,
        # including inherited provider objects. Selected once, expected10-15min.
        run: |
          python3 -B tests/dataqual15_hupsel/test_generation_publication_build.py
          python3 -B tests/dataqual15_hupsel/generation_publication_deployed_models.py --output "$RUNNER_TEMP/publication-deployed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_SCOPE_20261106.json') != '' }}
        with:
          name: actual-current-publication-production-build
          path: ${{ runner.temp }}/publication-deployed
  exact-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - name: Actual exact predecessor diagnostic outcomes, without old PASS claims
        if: ${{ hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_SCOPE_20261106.json') != '' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/publication-exact-before" 8da740df7b106d72045f34fa7cb5f351e129e1d5
          python3 -B tests/dataqual15_hupsel/generation_publication_baseline.py --baseline "$RUNNER_TEMP/publication-exact-before" --output "$RUNNER_TEMP/publication-before-outcomes"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('integration/dataqual15_hupsel/GENERATION_PUBLICATION_SCOPE_20261106.json') != '' }}
        with:
          name: actual-exact-publication-before-outcomes
          path: ${{ runner.temp }}/publication-before-outcomes
