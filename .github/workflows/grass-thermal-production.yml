name: Registered Grassgrowth thermal production profile
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/grass-thermal-production.yml
      - src/runtime/mod_fmr_serialized_reference_backend.f90
      - src/process/macropore/mod_macropore_dynamic_shrinkage.f90
      - tests/fpm/test_ppa_wu05_migmac02_dynamic_shrinkage.f90
      - tests/fpm/test_ppa_wu05_migmac02_provider_geometry.f90
      - tests/fpm/run_ppa_wu05_migmac02_dynamic_shrinkage.sh
      - tests/fpm/run_ppa_wu05_migmac02_provider_geometry.sh
      - app/grass_project/**
      - app/solute_project/main_water.f90
      - app/solute_column/macro_water_restart.f90
      - tests/dataqual15/*thermal*
      - tests/dataqual15/qualify_native_disk_restart.py
      - tests/dataqual15/continue_original_andelst.py
      - tests/dataqual15/verify_current_native_admission.py
      - integration/dataqual15/THERMAL_PROFILE_PRODUCTION*
      - tools/solute/build_grass_startup.py
      - tools/solute/legacy_reader_sources.py
      - tests/dataqual15/qualify_ttutil_numeric_input.py
      - tests/dataqual15_hupsel/build_and_run.py
  workflow_dispatch:
    inputs:
      full_trajectory_assessment:
        description: Reproduce complete preserved scientific comparisons without any model launch
        type: boolean
        default: false
      hybrid_controlled_instances:
        description: Qualify interleaved independent project instances with explicit controlled inputs
        type: boolean
        default: false
      hybrid_cauchy_changed_history:
        description: Qualify actual Cauchy second-day recovery from modified accepted state
        type: boolean
        default: false
      hybrid_hupsel_irrigation:
        description: Qualify original Hupsel water and solute surface event after restored irrigation state
        type: boolean
        default: false
      hybrid_grass_groundwater:
        description: Qualify original Grass groundwater day input and existing original Cauchy preservation
        type: boolean
        default: false
      hybrid_cauchy_forcing:
        description: Qualify explicit original Cauchy daily input and original forcing preservation
        type: boolean
        default: false
      hybrid_thermal_carriers:
        description: Observe accepted original water carriers without donor temperature assumptions
        type: boolean
        default: false
      hybrid_heat_accounting:
        description: Observe original numerical heat against existing sensible energy accounting
        type: boolean
        default: false
      hybrid_daily_coupling:
        description: Qualify external original-forcing daily accept and discard using admitted binaries
        type: boolean
        default: false
      hybrid_waterhost:
        description: Qualify explicit generic hybrid waterhost with bounded original cases
        type: boolean
        default: false
      thermal_subcycle:
        description: Run only the bounded private thermal-subcycling research
        type: boolean
        default: false
      thermal_substep_policy:
        description: Qualify the explicit policy and current default/native preservation
        type: boolean
        default: false
      thermal_sixteen_policy:
        description: Qualify explicit sixteen policy, original one/four preservation and own restarts
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: grass-thermal-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-thermal-carriers:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_thermal_carriers
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_THERMAL_CARRIERS_20261111.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_THERMAL_CARRIERS_20261111.json
            /research/hybrid-water01/qualify_original_heat_accounting.py
            /research/hybrid-water01/check_thermal_carriers.py
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_thermal_carriers
      - name: Six real original-heat observer and production storage-owner cases
        run: python3 -B research/hybrid-water01/qualify_original_heat_accounting.py --base-archive research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz --workspace "$RUNNER_TEMP/heat-original-base" --output "$RUNNER_TEMP/heat-observation" --carrier-inventory --case hupsel-O0 --case hupsel-O2 --case grass-O0 --case grass-O2 --case andelst-O0 --case andelst-O2
      - name: Accepted-only thermal receipts and unchanged numerical energy budget
        run: python3 -B research/hybrid-water01/check_thermal_carriers.py --runs "$RUNNER_TEMP/heat-observation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-thermal-carriers
          path: ${{ runner.temp }}/heat-observation
          retention-days: 14
  original-heat-accounting:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_heat_accounting
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_HEAT_ACCOUNTING_20261111.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_HEAT_ACCOUNTING_20261111.json
            /research/hybrid-water01/qualify_original_heat_accounting.py
            /research/hybrid-water01/check_original_heat_accounting.py
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_heat_accounting
      - name: Six real original-heat observer and production storage-owner cases
        run: python3 -B research/hybrid-water01/qualify_original_heat_accounting.py --base-archive research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz --workspace "$RUNNER_TEMP/heat-original-base" --output "$RUNNER_TEMP/heat-observation" --case hupsel-O0 --case hupsel-O2 --case grass-O0 --case grass-O2 --case andelst-O0 --case andelst-O2
      - name: Accepted-only thermal receipts and unchanged numerical energy budget
        run: python3 -B research/hybrid-water01/check_original_heat_accounting.py --runs "$RUNNER_TEMP/heat-observation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-heat-accounting
          path: ${{ runner.temp }}/heat-observation
          retention-days: 14
  complete-trajectory-scientific-data:
    if: github.event_name == 'workflow_dispatch' && inputs.full_trajectory_assessment
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /integration/dataqual15/GRASS_UNION_FULL_EVIDENCE.tar.xz
            /integration/dataqual15/GRASS_UNION_FULL_MANIFEST.json
            /integration/dataqual15_hupsel/HIGH_PRECISION_REFERENCE.json
            /integration/dataqual15_hupsel/HIGH_PRECISION_REFERENCE.tar.xz
            /integration/dataqual15_hupsel/PRESSURE_FILM_CANONICAL_RECEIPT_20261105.json
            /research/hybrid-water01/FULL_TRAJECTORY_COMPARISON_20261112.json
            /research/hybrid-water01/HYBRID_GRASS_FULL_REFERENCE_20261111.json
            /research/hybrid-water01/HYBRID_HUPSEL_REFERENCE_20261111.json
            /research/hybrid-water01/andelst-481-application-evidence.zip
            /research/hybrid-water01/andelst-481-application-receipt.json
            /research/hybrid-water01/assess_full_trajectories.py
            /research/hybrid-water01/grass-ahl-successor-receipt.json
            /research/hybrid-water01/hybrid-grass-full-windows-20261111.tar.xz
            /research/hybrid-water01/hybrid-hupsel-windows-20261111.tar.xz
            /research/hybrid-water01/whole-period-andelst-groundwater-20261112.csv
            /research/hybrid-water01/whole-period-andelst-reference-lineage-20261112.json
      - name: Reproduce source-bound whole-period comparisons from immutable data only
        run: |
          python3 -B research/hybrid-water01/assess_full_trajectories.py --output "$RUNNER_TEMP/full-trajectory-comparison.json"
          python3 - "$RUNNER_TEMP/full-trajectory-comparison.json" <<'PY'
          import json,sys
          from pathlib import Path
          expected=json.loads(Path('research/hybrid-water01/FULL_TRAJECTORY_COMPARISON_20261112.json').read_text())
          actual=json.loads(Path(sys.argv[1]).read_text())
          assert actual==expected
          assert actual['model_runs']==0 and actual['builds']==0
          print('COMPLETE_DATA_REPRODUCTION_EXACT; SCIENTIFIC_FAILURES_PRESERVED; NO_MODELS_EXECUTED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-trajectory-scientific-data
          path: ${{ runner.temp }}/full-trajectory-comparison.json
          retention-days: 14
  external-controlled-instances:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_controlled_instances
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_CONTROLLED_INSTANCES_20261112.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_CONTROLLED_INSTANCES_20261112.json
            /research/hybrid-water01/qualify_controlled_instances.py
            /research/hybrid-water01/cauchy-history-linux-20261112.tar.xz
            /research/hybrid-water01/irrigation-linux-20261112.tar.xz
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_controlled_instances
      - name: Hash-bound reuse of original binaries, modified-input controls and origins; no model compilation
        run: |
          python3 - <<'PY'
          import hashlib,os,tarfile
          from pathlib import Path
          cases=[('hybrid-hupsel-linux-20261111.tar.xz','feaec2daeada9b5f01f0391352a7b15910f406c4a0034123e65c58418cd67bde','qualified-hybrid'),
                 ('irrigation-linux-20261112.tar.xz','9ddbbefcec649fef7f3c016fe3be65e7d17bd3b2199d5598828ef8bfe21537f4','prior-irrigation-proof'),
                 ('cauchy-history-linux-20261112.tar.xz','cca335421f59b6ada4b602db41c88051b55f4af7b4db05cf90f785b8baaa1bc3','prior-cauchy-history')]
          for name,digest,folder in cases:
              archive=Path('research/hybrid-water01')/name
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
              out=Path(os.environ['RUNNER_TEMP'])/folder
              out.mkdir()
              with tarfile.open(archive,'r|xz') as t:
                  for member in t:
                      if folder!='prior-irrigation-proof' or member.name.startswith(('groundwater/','irrigation/')):
                          t.extract(member,path=out,filter='data')
          PY
      - name: Interleaved independent Cauchy groundwater and irrigation instances O0 O2
        run: python3 -B research/hybrid-water01/qualify_controlled_instances.py --workspace "$RUNNER_TEMP/qualified-hybrid" --cauchy "$RUNNER_TEMP/prior-cauchy-history" --groundwater "$RUNNER_TEMP/prior-irrigation-proof/groundwater" --irrigation "$RUNNER_TEMP/prior-irrigation-proof/irrigation" --output "$RUNNER_TEMP/controlled-instances"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-controlled-instances
          path: ${{ runner.temp }}/controlled-instances
          retention-days: 14
  external-cauchy-changed-history:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_cauchy_changed_history
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_CAUCHY_CHANGED_HISTORY_20261112.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_CAUCHY_CHANGED_HISTORY_20261112.json
            /research/hybrid-water01/qualify_cauchy_changed_history.py
            /research/hybrid-water01/irrigation-linux-20261112.tar.xz
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_cauchy_changed_history
      - name: Verify and reuse admitted original binaries and exact compatible day20; no model rebuild or warm prefix
        run: |
          python3 - <<'PY'
          import hashlib,os,tarfile
          from pathlib import Path
          cases=[('hybrid-hupsel-linux-20261111.tar.xz','feaec2daeada9b5f01f0391352a7b15910f406c4a0034123e65c58418cd67bde','qualified-hybrid'),
                 ('irrigation-linux-20261112.tar.xz','9ddbbefcec649fef7f3c016fe3be65e7d17bd3b2199d5598828ef8bfe21537f4','prior-irrigation-proof')]
          for name,digest,folder in cases:
              archive=Path('research/hybrid-water01')/name
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
              out=Path(os.environ['RUNNER_TEMP'])/folder
              out.mkdir()
              with tarfile.open(archive) as t:
                  if folder=='prior-irrigation-proof':t.extractall(out,members=[m for m in t.getmembers() if m.name.startswith('cauchy/')],filter='data')
                  else:t.extractall(out,filter='data')
          PY
      - name: Actual changed accepted state retry recovery and independent original BBC controls O0 O2
        run: python3 -B research/hybrid-water01/qualify_cauchy_changed_history.py --workspace "$RUNNER_TEMP/qualified-hybrid" --origins "$RUNNER_TEMP/prior-irrigation-proof/cauchy" --output "$RUNNER_TEMP/cauchy-changed-history"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-cauchy-changed-history
          path: ${{ runner.temp }}/cauchy-changed-history
          retention-days: 14
  external-hupsel-irrigation:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_hupsel_irrigation
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_HUPSEL_IRRIGATION_20261112.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_HUPSEL_IRRIGATION_20261112.json
            /research/hybrid-water01/qualify_grass_groundwater.py
            /research/hybrid-water01/qualify_hupsel_irrigation.py
            /research/hybrid-water01/check_irrigation_inputs.py
            /research/hybrid-water01/check_cauchy_recovery_inputs.py
            /research/hybrid-water01/qualify_cauchy_daily_forcing.py
            /research/hybrid-water01/cauchy-linux-20261112.tar.xz
            /research/hybrid-water01/qualify_daily_coupling.py
            /research/hybrid-water01/qualify_daily_coupling_corruption.py
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_hupsel_irrigation
      - name: Install exact original module compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gfortran gcc
      - name: Exact admitted original-object reuse; compile only two irrigation modules
        run: |
          python3 - <<'PY'
          import hashlib,os,tarfile
          from pathlib import Path
          archive=Path('research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='feaec2daeada9b5f01f0391352a7b15910f406c4a0034123e65c58418cd67bde'
          root=Path(os.environ['RUNNER_TEMP'])/'qualified-hybrid'
          root.mkdir()
          with tarfile.open(archive) as t:t.extractall(root,filter='data')
          for project in ['grass','hupsel','andelst']:
              for opt in ['O0','O2']:
                  for name in ['day_donor','day_kernel']:
                      (root/f'generic-{project}-{opt}'/name).chmod(0o755)
          prior=Path(os.environ['RUNNER_TEMP'])/'prior-cauchy-proof'
          prior.mkdir()
          checkpoint_archive=Path('research/hybrid-water01/cauchy-linux-20261112.tar.xz')
          assert hashlib.sha256(checkpoint_archive.read_bytes()).hexdigest()=='1f3b6a2f24feffd94cd8c0930699558f389987658a7c227a7068fa06ce2e160e'
          with tarfile.open(checkpoint_archive) as t:t.extractall(prior,filter='data')
          PY
      - name: Original Hupsel surface water and solute event after restored state O0 O2
        run: python3 -B research/hybrid-water01/qualify_hupsel_irrigation.py --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/hupsel-irrigation"
      - name: Actual consuming-routine and persisted irrigation input refusals
        run: python3 -B research/hybrid-water01/check_irrigation_inputs.py --workspace "$RUNNER_TEMP/qualified-hybrid" --runs "$RUNNER_TEMP/hupsel-irrigation" --output "$RUNNER_TEMP/irrigation-inputs"
      - name: Actual Grass sparse groundwater and changed-history restart O0 O2
        run: python3 -B research/hybrid-water01/qualify_grass_groundwater.py --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/grass-groundwater"
      - name: Real current Cauchy day20-to22 forcing and exact retry recovery
        run: python3 -B research/hybrid-water01/qualify_cauchy_daily_forcing.py --workspace "$RUNNER_TEMP/qualified-hybrid" --reuse-day20 "$RUNNER_TEMP/prior-cauchy-proof/cauchy" --output "$RUNNER_TEMP/cauchy-forcing"
      - name: Malformed persisted input and leap year transformations without model runs
        run: |
          python3 -B research/hybrid-water01/check_cauchy_recovery_inputs.py --groundwater --workspace "$RUNNER_TEMP/qualified-hybrid" --runs "$RUNNER_TEMP/grass-groundwater" --output "$RUNNER_TEMP/groundwater-inputs"
          python3 -B research/hybrid-water01/check_cauchy_recovery_inputs.py --workspace "$RUNNER_TEMP/qualified-hybrid" --runs "$RUNNER_TEMP/cauchy-forcing" --output "$RUNNER_TEMP/cauchy-inputs"
      - name: Real three-project O0/O2 external accept discard and disk recovery
        run: python3 -B research/hybrid-water01/qualify_daily_coupling.py --platform linux --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/external-daily"
      - name: Native corruption and terminal period guards
        run: python3 -B research/hybrid-water01/qualify_daily_coupling_corruption.py --platform linux --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/external-daily-corruption"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-hupsel-irrigation
          path: |
            ${{ runner.temp }}/hupsel-irrigation
            ${{ runner.temp }}/irrigation-inputs
            ${{ runner.temp }}/grass-groundwater
            ${{ runner.temp }}/groundwater-inputs
            ${{ runner.temp }}/cauchy-inputs
            ${{ runner.temp }}/cauchy-forcing
            ${{ runner.temp }}/external-daily*
          retention-days: 14
  external-grass-groundwater:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_grass_groundwater
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_GRASS_GROUNDWATER_20261112.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_GRASS_GROUNDWATER_20261112.json
            /research/hybrid-water01/qualify_grass_groundwater.py
            /research/hybrid-water01/check_cauchy_recovery_inputs.py
            /research/hybrid-water01/qualify_cauchy_daily_forcing.py
            /research/hybrid-water01/cauchy-linux-20261112.tar.xz
            /research/hybrid-water01/qualify_daily_coupling.py
            /research/hybrid-water01/qualify_daily_coupling_corruption.py
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_grass_groundwater
      - name: Exact admitted binary reuse, no repeated full runs or model compilation
        run: |
          python3 - <<'PY'
          import hashlib,os,tarfile
          from pathlib import Path
          archive=Path('research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='feaec2daeada9b5f01f0391352a7b15910f406c4a0034123e65c58418cd67bde'
          root=Path(os.environ['RUNNER_TEMP'])/'qualified-hybrid'
          root.mkdir()
          with tarfile.open(archive) as t:t.extractall(root,filter='data')
          for project in ['grass','hupsel','andelst']:
              for opt in ['O0','O2']:
                  for name in ['day_donor','day_kernel']:
                      (root/f'generic-{project}-{opt}'/name).chmod(0o755)
          prior=Path(os.environ['RUNNER_TEMP'])/'prior-cauchy-proof'
          prior.mkdir()
          checkpoint_archive=Path('research/hybrid-water01/cauchy-linux-20261112.tar.xz')
          assert hashlib.sha256(checkpoint_archive.read_bytes()).hexdigest()=='1f3b6a2f24feffd94cd8c0930699558f389987658a7c227a7068fa06ce2e160e'
          with tarfile.open(checkpoint_archive) as t:t.extractall(prior,filter='data')
          PY
      - name: Actual Grass sparse groundwater and changed-history restart O0 O2
        run: python3 -B research/hybrid-water01/qualify_grass_groundwater.py --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/grass-groundwater"
      - name: Real current Cauchy day20-to22 forcing and exact retry recovery
        run: python3 -B research/hybrid-water01/qualify_cauchy_daily_forcing.py --workspace "$RUNNER_TEMP/qualified-hybrid" --reuse-day20 "$RUNNER_TEMP/prior-cauchy-proof/cauchy" --output "$RUNNER_TEMP/cauchy-forcing"
      - name: Malformed persisted input and leap year transformations without model runs
        run: |
          python3 -B research/hybrid-water01/check_cauchy_recovery_inputs.py --groundwater --workspace "$RUNNER_TEMP/qualified-hybrid" --runs "$RUNNER_TEMP/grass-groundwater" --output "$RUNNER_TEMP/groundwater-inputs"
          python3 -B research/hybrid-water01/check_cauchy_recovery_inputs.py --workspace "$RUNNER_TEMP/qualified-hybrid" --runs "$RUNNER_TEMP/cauchy-forcing" --output "$RUNNER_TEMP/cauchy-inputs"
      - name: Real three-project O0/O2 external accept discard and disk recovery
        run: python3 -B research/hybrid-water01/qualify_daily_coupling.py --platform linux --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/external-daily"
      - name: Native corruption and terminal period guards
        run: python3 -B research/hybrid-water01/qualify_daily_coupling_corruption.py --platform linux --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/external-daily-corruption"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-grass-groundwater
