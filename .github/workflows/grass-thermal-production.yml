name: Standalone no-macro user release
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact checked-out source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: userrelease-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clean-source-user-route:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
      - name: Pin source and confirm no imported build or research provider
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -d research
          gfortran --version
          gcc --version
          python3 --version
      - name: Actual public preparation, O0/O2 build, complete O2 periods and exact day restart
        run: python3 -B tools/solute/check_userrelease.py --output "$RUNNER_TEMP/userrelease-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: userrelease-${{ github.sha }}
          path: ${{ runner.temp }}/userrelease-proof
          retention-days: 14
