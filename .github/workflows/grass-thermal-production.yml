name: Registered Grassgrowth thermal production profile
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/grass-thermal-production.yml
      - src/runtime/mod_fmr_serialized_reference_backend.f90
      - src/process/macropore/mod_macropore_dynamic_shrinkage.f90
      - tests/fpm/test_ppa_wu05_migmac02_dynamic_shrinkage.f90
      - tests/fpm/test_ppa_wu05_migmac02_provider_geometry.f90
      - tests/fpm/run_ppa_wu05_migmac02_dynamic_shrinkage.sh
      - tests/fpm/run_ppa_wu05_migmac02_provider_geometry.sh
      - app/grass_project/**
      - app/solute_project/main_water.f90
      - app/solute_column/macro_water_restart.f90
      - tests/dataqual15/*thermal*
      - tests/dataqual15/qualify_native_disk_restart.py
      - tests/dataqual15/continue_original_andelst.py
      - tests/dataqual15/verify_current_native_admission.py
      - integration/dataqual15/THERMAL_PROFILE_PRODUCTION*
      - tools/solute/build_grass_startup.py
      - tools/solute/legacy_reader_sources.py
      - tests/dataqual15/qualify_ttutil_numeric_input.py
      - tests/dataqual15_hupsel/build_and_run.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grass-thermal-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  kim-shrinkage:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: KIM operator and real provider geometry at O0 and O2
        run: |
          bash tests/fpm/run_ppa_wu05_migmac02_dynamic_shrinkage.sh
          bash tests/fpm/run_ppa_wu05_migmac02_provider_geometry.sh
      - name: Original TTUTIL numeric input at O0 and O2
        run: python3 -B tests/dataqual15/qualify_ttutil_numeric_input.py --compiler /usr/bin/gfortran --output "$RUNNER_TEMP/ttutil-numeric"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-ttutil-numeric-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ttutil-numeric
          retention-days: 14
  native:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran-13
      - name: Verify exact current source and retained native evidence
        run: |
          grass_base=78c8012530b3be14e48edef6fc950e2c09c695ca
          ahl_source=1354f5cad9a4db106db50e4e5d8d6a6ba141bca3
          ahl_exact=false
          cache_source=f0e5d9e1dad0a92e3ecd4ea6f464ab55be7af80e
          kim_source=e145622a9b93aac0eee38a40338f6b452bf16ab8
          reader_source=5902c6b91e8478362a14eec9b22001a36f901769
          if { git merge-base --is-ancestor "$ahl_source" HEAD &&
               git diff --quiet "$ahl_source" HEAD -- src app reference tools tests; } ||
             { git merge-base --is-ancestor "$cache_source" HEAD &&
               git diff --quiet "$cache_source" HEAD -- src app reference tools tests; } ||
             { git merge-base --is-ancestor "$kim_source" HEAD &&
               git diff --quiet "$kim_source" HEAD -- src app reference tools tests; } ||
             { git merge-base --is-ancestor "$reader_source" HEAD &&
               git diff --quiet "$reader_source" HEAD -- src app reference tools tests; }; then
            ahl_exact=true
          fi
          if [[ "$ahl_exact" == true ]] || {
             git merge-base --is-ancestor "$grass_base" HEAD &&
             [[ "$(git diff --name-only --no-renames "$grass_base" HEAD -- src app reference tools)" == app/grass_project/initial_interval.f90 ]];
          }; then
            prior="$RUNNER_TEMP/grass-thermal-predecessor"
            git worktree add --detach "$prior" 77f3736198bdc54caa5d7d5ad2894413c0edb535
            trap 'git worktree remove "$prior"' EXIT
            (cd "$prior" && python3 -B tests/dataqual15/test_thermal_profile_production.py &&
              python3 -B tests/dataqual15/thermal_profile_production.py --verify-only)
          else
            python3 -B tests/dataqual15/test_thermal_profile_production.py
            python3 -B tests/dataqual15/thermal_profile_production.py --verify-only
          fi
      - name: Cold O0/O2 numerical and incumbent runtime contracts
        run: python3 -B tests/dataqual15/qualify_thermal_runtime.py --compiler /usr/bin/gfortran-13 --output "$RUNNER_TEMP/thermal-contract"
      - name: Current original-input application and own disk restart on both optimizations
        shell: bash
        run: |
          set -euo pipefail
          for opt in O0 O2; do
            python3 -B tools/solute/build_grass_startup.py --compiler /usr/bin/gfortran-13 --optimization "$opt" --policy retained --numerical-profile thermal-control-1e-5C --end 1 --output "$RUNNER_TEMP/grass-$opt"
            python3 -B tests/dataqual15/qualify_native_disk_restart.py --bundle "$RUNNER_TEMP/grass-$opt" --output "$RUNNER_TEMP/thermal-disk-$opt" --conductive-budget
          done
      - name: Cold original Andelst numerical input and native macro publication
        shell: bash
        run: |
          set -euo pipefail
          for opt in O0 O2; do
            python3 -B tests/dataqual15_hupsel/build_and_run.py --driver app/solute_project/main_water.f90 --compiler /usr/bin/gfortran-13 --optimization "$opt" --ttutil-archive "$RUNNER_TEMP/grass-$opt/libttutil.a" --output "$RUNNER_TEMP/native-$opt"
            if [[ "$opt" == O0 ]]; then name=day1-O0; else name=original-O2; fi
            python3 -B tests/dataqual15/continue_original_andelst.py --bundle "$RUNNER_TEMP/native-$opt" --quiet-stages --end 1 --output "$RUNNER_TEMP/s5-events-andelst-$name" --seconds 90
            python3 -B tests/dataqual15/continue_original_andelst.py --bundle "$RUNNER_TEMP/native-$opt" --quiet-stages --end '1.0169999999998254' --restart "$RUNNER_TEMP/s5-events-andelst-$name/restart.bin" --output "$RUNNER_TEMP/s5-events-andelst-own-exact-$opt" --seconds 90
            python3 -B tests/dataqual15/continue_original_andelst.py --bundle "$RUNNER_TEMP/native-$opt" --quiet-stages --end '1.0169999999998254' --output "$RUNNER_TEMP/s5-events-andelst-prefix-exact-$opt" --seconds 90
          done
          python3 -B tests/dataqual15/qualify_andelst_codec.py --workspace "$RUNNER_TEMP" --output "$RUNNER_TEMP/andelst-codec"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registered-thermal-native-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/thermal-contract
            ${{ runner.temp }}/grass-O0
            ${{ runner.temp }}/grass-O2
            ${{ runner.temp }}/thermal-disk-O0
            ${{ runner.temp }}/thermal-disk-O2
            ${{ runner.temp }}/native-O0
            ${{ runner.temp }}/native-O2
            ${{ runner.temp }}/s5-events-andelst-*
            ${{ runner.temp }}/andelst-codec
