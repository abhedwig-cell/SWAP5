name: Registered Grassgrowth thermal production profile
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/grass-thermal-production.yml
      - src/runtime/mod_fmr_serialized_reference_backend.f90
      - src/process/macropore/mod_macropore_dynamic_shrinkage.f90
      - tests/fpm/test_ppa_wu05_migmac02_dynamic_shrinkage.f90
      - tests/fpm/test_ppa_wu05_migmac02_provider_geometry.f90
      - tests/fpm/run_ppa_wu05_migmac02_dynamic_shrinkage.sh
      - tests/fpm/run_ppa_wu05_migmac02_provider_geometry.sh
      - app/grass_project/**
      - app/solute_project/main_water.f90
      - app/solute_column/macro_water_restart.f90
      - tests/dataqual15/*thermal*
      - tests/dataqual15/qualify_native_disk_restart.py
      - tests/dataqual15/continue_original_andelst.py
      - tests/dataqual15/verify_current_native_admission.py
      - integration/dataqual15/THERMAL_PROFILE_PRODUCTION*
      - tools/solute/build_grass_startup.py
      - tools/solute/legacy_reader_sources.py
      - tests/dataqual15/qualify_ttutil_numeric_input.py
      - tests/dataqual15_hupsel/build_and_run.py
  workflow_dispatch:
    inputs:
      hybrid_thermal_carriers:
        description: Observe accepted original water carriers without donor temperature assumptions
        type: boolean
        default: false
      hybrid_heat_accounting:
        description: Observe original numerical heat against existing sensible energy accounting
        type: boolean
        default: false
      hybrid_daily_coupling:
        description: Qualify external original-forcing daily accept and discard using admitted binaries
        type: boolean
        default: false
      hybrid_waterhost:
        description: Qualify explicit generic hybrid waterhost with bounded original cases
        type: boolean
        default: false
      thermal_subcycle:
        description: Run only the bounded private thermal-subcycling research
        type: boolean
        default: false
      thermal_substep_policy:
        description: Qualify the explicit policy and current default/native preservation
        type: boolean
        default: false
      thermal_sixteen_policy:
        description: Qualify explicit sixteen policy, original one/four preservation and own restarts
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: grass-thermal-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-thermal-carriers:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_thermal_carriers
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_THERMAL_CARRIERS_20261111.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_THERMAL_CARRIERS_20261111.json
            /research/hybrid-water01/qualify_original_heat_accounting.py
            /research/hybrid-water01/check_thermal_carriers.py
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_thermal_carriers
      - name: Six real original-heat observer and production storage-owner cases
        run: python3 -B research/hybrid-water01/qualify_original_heat_accounting.py --base-archive research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz --workspace "$RUNNER_TEMP/heat-original-base" --output "$RUNNER_TEMP/heat-observation" --carrier-inventory --case hupsel-O0 --case hupsel-O2 --case grass-O0 --case grass-O2 --case andelst-O0 --case andelst-O2
      - name: Accepted-only thermal receipts and unchanged numerical energy budget
        run: python3 -B research/hybrid-water01/check_thermal_carriers.py --runs "$RUNNER_TEMP/heat-observation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-thermal-carriers
          path: ${{ runner.temp }}/heat-observation
          retention-days: 14
  original-heat-accounting:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_heat_accounting
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_HEAT_ACCOUNTING_20261111.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_HEAT_ACCOUNTING_20261111.json
            /research/hybrid-water01/qualify_original_heat_accounting.py
            /research/hybrid-water01/check_original_heat_accounting.py
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_heat_accounting
      - name: Six real original-heat observer and production storage-owner cases
        run: python3 -B research/hybrid-water01/qualify_original_heat_accounting.py --base-archive research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz --workspace "$RUNNER_TEMP/heat-original-base" --output "$RUNNER_TEMP/heat-observation" --case hupsel-O0 --case hupsel-O2 --case grass-O0 --case grass-O2 --case andelst-O0 --case andelst-O2
      - name: Accepted-only thermal receipts and unchanged numerical energy budget
        run: python3 -B research/hybrid-water01/check_original_heat_accounting.py --runs "$RUNNER_TEMP/heat-observation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-heat-accounting
          path: ${{ runner.temp }}/heat-observation
          retention-days: 14
  external-daily:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_daily_coupling
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_DAILY_COUPLING_20261111.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /app/
            /reference/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_DAILY_COUPLING_20261111.json
            /research/hybrid-water01/qualify_daily_coupling.py
            /research/hybrid-water01/qualify_daily_coupling_corruption.py
            /research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_daily_coupling
      - name: Exact admitted binary reuse, no repeated full runs or model compilation
        run: |
          python3 - <<'PY'
          import hashlib,os,tarfile
          from pathlib import Path
          archive=Path('research/hybrid-water01/hybrid-hupsel-linux-20261111.tar.xz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='feaec2daeada9b5f01f0391352a7b15910f406c4a0034123e65c58418cd67bde'
          root=Path(os.environ['RUNNER_TEMP'])/'qualified-hybrid'
          root.mkdir()
          with tarfile.open(archive) as t:t.extractall(root,filter='data')
          for project in ['grass','hupsel','andelst']:
              for opt in ['O0','O2']:
                  for name in ['day_donor','day_kernel']:
                      (root/f'generic-{project}-{opt}'/name).chmod(0o755)
          PY
      - name: Real three-project O0/O2 external accept discard and disk recovery
        run: python3 -B research/hybrid-water01/qualify_daily_coupling.py --platform linux --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/external-daily"
      - name: Native corruption and terminal period guards
        run: python3 -B research/hybrid-water01/qualify_daily_coupling_corruption.py --platform linux --workspace "$RUNNER_TEMP/qualified-hybrid" --output "$RUNNER_TEMP/external-daily-corruption"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-daily-acceptance
          path: ${{ runner.temp }}/external-daily*
          retention-days: 14
  hybrid-waterhost:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_waterhost
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/HYBRID_HUPSEL_20261111.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /src/
            /app/
            /tools/
            /tests/modularity/
            /tests/support/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/HYBRID_HUPSEL_20261111.json
            /integration/audits/evidence/SWAP431_ORIGINAL_SOURCE.zip.b64
            /integration/audits/evidence/SWAP431_TTUTIL_AUTHORITY.zip.b64
            /reference/swap-4.3.1/projects/1.hupselbrook/
            /reference/swap-4.3.1/projects/2.grassgrowth/
            /reference/swap-4.3.1/projects/3.macroporeflow/
            /research/hybrid-water01/*generic_hybrid*
            /research/hybrid-water01/check_hybrid_budget_protocol.py
            /research/hybrid-water01/run_hybrid_grass_full.py
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection hybrid_generic_waterhost
      - name: Cold original source build, no reference trajectory
        run: python3 -B research/hybrid-water01/prepare_generic_hybrid_reference.py --output "$RUNNER_TEMP/generic-reference"
      - name: Actual canonical baseline view and bounded controls
        shell: bash
        run: |
          git diff --exit-code 01a9d29c380645dec880257f360174b5cb5ea5c0 HEAD -- src app/support
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'generic-baseline-root'
          (base/'app/hybrid_water').mkdir(parents=True)
          for name in ['daily_host.py','donor_adapter.f90','donor_sources.py','main.f90','hybrid_step_budget.f90']:
              path='app/hybrid_water/'+name
              (base/path).write_bytes(subprocess.check_output(['git','cat-file','blob','01a9d29c380645dec880257f360174b5cb5ea5c0:'+path]))
          for name in ['src','reference','app/support']:
              target=base/name;target.parent.mkdir(parents=True,exist_ok=True)
              target.symlink_to(Path.cwd()/name,target_is_directory=True)
          PY
          python3 -B research/hybrid-water01/prepare_generic_hybrid_baseline.py --source-root "$RUNNER_TEMP/generic-baseline-root" --reference "$RUNNER_TEMP/generic-reference" --output "$RUNNER_TEMP/generic-baseline"
      - name: Original Grassgrowth and preserved Andelst kernel O0/O2
        shell: bash
        run: |
          for opt in O0 O2; do
            python3 -B research/hybrid-water01/qualify_generic_hybrid_waterhost.py --reference "$RUNNER_TEMP/generic-reference" --output "$RUNNER_TEMP/generic-hupsel-$opt" --project hupsel --optimization "$opt"
            python3 -B research/hybrid-water01/qualify_generic_hybrid_waterhost.py --reference "$RUNNER_TEMP/generic-reference" --output "$RUNNER_TEMP/generic-grass-$opt" --project grass --optimization "$opt"
            python3 -B research/hybrid-water01/qualify_generic_hybrid_waterhost.py --reference "$RUNNER_TEMP/generic-reference" --output "$RUNNER_TEMP/generic-andelst-$opt" --project andelst --optimization "$opt" --andelst-baseline "$RUNNER_TEMP/generic-baseline"
          done
      - name: Complete Hupsel current compiler and own seasonal states
        run: python3 -B research/hybrid-water01/run_hybrid_grass_full.py --project hupsel --reference "$RUNNER_TEMP/generic-reference" --bundle "$RUNNER_TEMP/generic-hupsel-O2" --output "$RUNNER_TEMP/generic-hupsel-full"
      - name: Public explicit water prototype and fresh continuation
        shell: bash
        run: |
          python3 -B tools/solute/run_water.py --model HYBRID_GRASSGROWTH_WATER --reference-work "$RUNNER_TEMP/generic-reference" --output "$RUNNER_TEMP/generic-public" --days 4 --checkpoint-at 2
          python3 -B tools/solute/run_water.py --model HYBRID_GRASSGROWTH_WATER --reference-work "$RUNNER_TEMP/generic-reference" --output "$RUNNER_TEMP/generic-public-resume" --days 4 --restart "$RUNNER_TEMP/generic-public/accepted-column-1-day-2.zip" --restart-day 2 --checkpoint-at 4
      - name: Public Hupsel saline-gift cold and own continuation
        run: |
          python3 -B tools/solute/run_water.py --model HYBRID_HUPSEL_WATER --reference-work "$RUNNER_TEMP/generic-reference" --output "$RUNNER_TEMP/generic-hupsel-public" --days 7 --checkpoint-at 5
          python3 -B tools/solute/run_water.py --model HYBRID_HUPSEL_WATER --reference-work "$RUNNER_TEMP/generic-reference" --output "$RUNNER_TEMP/generic-hupsel-public-resume" --days 7 --restart "$RUNNER_TEMP/generic-hupsel-public/accepted-column-1-day-5.zip" --restart-day 5 --checkpoint-at 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-hybrid-waterhost
          path: ${{ runner.temp }}/generic-*
  thermal-sixteen-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.thermal_sixteen_policy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/THERMAL_SIXTEEN_POLICY_ADMISSION.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /src/
            /app/
            /tools/solute/
            /tests/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/THERMAL_SIXTEEN_POLICY_ADMISSION.json
            /integration/f-ci/THERMAL_SUBCYCLE_RESEARCH_20261111.json
            /integration/audits/evidence/SWAP431_B111_AUTHORITY.tar.gz.b64
            /integration/audits/evidence/SWAP431_TTUTIL_AUTHORITY.zip.b64
            /reference/swap-4.3.1/projects/1.hupselbrook/
            /reference/swap-4.3.1/projects/2.grassgrowth/
            /research/hybrid-water01/thermal-subcycle-ubuntu26-20261111.zip
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection thermal_substep_policy
      - name: Cold owning body and actual runtime contracts O0/O2
        run: |
          python3 -B tests/dataqual15/qualify_thermal_substeps.py --compiler /usr/bin/gfortran --output "$RUNNER_TEMP/sixteen-body"
          python3 -B tests/dataqual15/qualify_thermal_runtime.py --compiler /usr/bin/gfortran --output "$RUNNER_TEMP/sixteen-runtime"
      - name: Current one/four preservation and explicit sixteen application
        run: |
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/sixteen-default" --compiler /usr/bin/gfortran --optimization O2 --profile production --policy retained --numerical-profile thermal-control-1e-5C --end 1
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/sixteen-four" --compiler /usr/bin/gfortran --optimization O2 --profile production --policy retained --numerical-profile thermal-subcycle4-1e-5C --end 1 --input-archive "$RUNNER_TEMP/sixteen-default/libttutil.a" --reuse-build "$RUNNER_TEMP/sixteen-default"
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/sixteen-opt" --compiler /usr/bin/gfortran --optimization O2 --profile production --policy retained --numerical-profile thermal-subcycle16-1e-5C --end 1 --input-archive "$RUNNER_TEMP/sixteen-default/libttutil.a" --reuse-build "$RUNNER_TEMP/sixteen-four"
          python3 -B tests/dataqual15/run_original.py --bundle "$RUNNER_TEMP/sixteen-default" --output "$RUNNER_TEMP/sixteen-default-fourdays" --end 4 --timeout 60
          python3 -B tests/dataqual15/run_original.py --bundle "$RUNNER_TEMP/sixteen-four" --output "$RUNNER_TEMP/sixteen-four-fourdays" --end 4 --timeout 60
          python3 -B tests/dataqual15/check_thermal_policy_preservation.py --default "$RUNNER_TEMP/sixteen-default-fourdays" --four "$RUNNER_TEMP/sixteen-four-fourdays" --platform ubuntu --output "$RUNNER_TEMP/sixteen-preservation.json"
          python3 -B tests/dataqual15/qualify_native_disk_restart.py --bundle "$RUNNER_TEMP/sixteen-opt" --output "$RUNNER_TEMP/sixteen-opt-disk" --conductive-budget
          python3 -B tools/solute/run_water.py --model NATIVE_GRASSGROWTH_WATER --grass-build "$RUNNER_TEMP/sixteen-opt" --output "$RUNNER_TEMP/sixteen-public" --days 3
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/sixteen-opt-O0" --compiler /usr/bin/gfortran --optimization O0 --profile checked --policy retained --numerical-profile thermal-subcycle16-1e-5C --end 1
          python3 -B tests/dataqual15/qualify_native_disk_restart.py --bundle "$RUNNER_TEMP/sixteen-opt-O0" --output "$RUNNER_TEMP/sixteen-opt-O0-disk" --conductive-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sixteen-policy-${{ github.sha }}
          path: ${{ runner.temp }}/sixteen-*
          retention-days: 14
  thermal-substep-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.thermal_substep_policy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/THERMAL_SUBSTEP_POLICY_ADMISSION.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /src/
            /app/
            /tools/solute/
            /tests/
            /docs/development/workstream-execution-protocol.md
            /integration/f-ci/THERMAL_SUBSTEP_POLICY_ADMISSION.json
            /integration/f-ci/THERMAL_SUBCYCLE_RESEARCH_20261111.json
            /integration/audits/evidence/SWAP431_B111_AUTHORITY.tar.gz.b64
            /integration/audits/evidence/SWAP431_TTUTIL_AUTHORITY.zip.b64
            /reference/swap-4.3.1/projects/1.hupselbrook/
            /reference/swap-4.3.1/projects/2.grassgrowth/
            /research/hybrid-water01/thermal-subcycle-ubuntu26-20261111.zip
      - name: Persisted owning selection
        run: python3 tests/modularity/run_modular_tests.py --check-selection thermal_substep_policy
      - name: Actual policy and default coupled applications
        run: |
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/policy-default" --compiler /usr/bin/gfortran --optimization O2 --profile production --policy retained --numerical-profile thermal-control-1e-5C --end 1
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/policy-four" --compiler /usr/bin/gfortran --optimization O2 --profile production --policy retained --numerical-profile thermal-subcycle4-1e-5C --end 1 --input-archive "$RUNNER_TEMP/policy-default/libttutil.a" --reuse-build "$RUNNER_TEMP/policy-default"
          python3 -B tests/dataqual15/qualify_thermal_substeps.py --bundle "$RUNNER_TEMP/policy-four" --output "$RUNNER_TEMP/policy-body"
          python3 -B tests/dataqual15/run_original.py --bundle "$RUNNER_TEMP/policy-default" --output "$RUNNER_TEMP/policy-default-fourdays" --end 4 --timeout 60
          python3 -B tests/dataqual15/run_original.py --bundle "$RUNNER_TEMP/policy-four" --output "$RUNNER_TEMP/policy-four-fourdays" --end 4 --timeout 60
          python3 -B tests/dataqual15/check_thermal_policy_preservation.py --default "$RUNNER_TEMP/policy-default-fourdays" --four "$RUNNER_TEMP/policy-four-fourdays" --platform ubuntu --output "$RUNNER_TEMP/policy-preservation.json"
          python3 -B tests/dataqual15/qualify_native_disk_restart.py --bundle "$RUNNER_TEMP/policy-four" --output "$RUNNER_TEMP/policy-four-disk" --conductive-budget
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/policy-four-O0" --compiler /usr/bin/gfortran --optimization O0 --profile checked --policy retained --numerical-profile thermal-subcycle4-1e-5C --end 1
          python3 -B tests/dataqual15/qualify_native_disk_restart.py --bundle "$RUNNER_TEMP/policy-four-O0" --output "$RUNNER_TEMP/policy-four-O0-disk" --conductive-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explicit-thermal-policy-${{ github.sha }}
          path: ${{ runner.temp }}/policy-*
          retention-days: 14
  thermal-subcycle-research:
    if: github.event_name == 'workflow_dispatch' && inputs.thermal_subcycle
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      SWAP5_TEST_SELECTION_RECORD: integration/f-ci/THERMAL_SUBCYCLE_RESEARCH_20261111.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact production baseline and bounded selection
        run: |
          git diff --exit-code f96c9f23ed2234255c0ceeb64e82c3e87f2e77fe HEAD -- src app tools tests reference
          python3 tests/modularity/run_modular_tests.py --check-selection thermal_subcycle_probe
          gfortran --version
      - name: Original baseline, private postimages, real heat controls and short ABBA
        run: |
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/heat-baseline" --compiler /usr/bin/gfortran --optimization O2 --profile production --policy retained --numerical-profile thermal-control-1e-5C --end .01
          python3 -B research/hybrid-water01/prepare_thermal_subcycle.py --output "$RUNNER_TEMP/heat-postimages" --apply
          python3 -B tools/solute/build_grass_startup.py --output "$RUNNER_TEMP/heat-candidate" --compiler /usr/bin/gfortran --optimization O2 --profile production --policy retained --numerical-profile thermal-control-1e-5C --input-archive "$RUNNER_TEMP/heat-baseline/libttutil.a" --reuse-build "$RUNNER_TEMP/heat-baseline" --end .01
          python3 -B research/hybrid-water01/check_thermal_subcycle.py --bundle "$RUNNER_TEMP/heat-candidate" --output "$RUNNER_TEMP/heat-controls"
          python3 -B research/hybrid-water01/time_thermal_subcycle.py --baseline "$RUNNER_TEMP/heat-baseline" --candidate "$RUNNER_TEMP/heat-candidate" --output "$RUNNER_TEMP/heat-abba"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-thermal-subcycle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/heat-baseline
            ${{ runner.temp }}/heat-postimages
            ${{ runner.temp }}/heat-candidate
            ${{ runner.temp }}/heat-controls
            ${{ runner.temp }}/heat-abba
          retention-days: 14
  kim-shrinkage:
    if: ${{ !inputs.thermal_subcycle && !inputs.thermal_substep_policy && !inputs.thermal_sixteen_policy && !inputs.hybrid_waterhost && !inputs.hybrid_daily_coupling && !inputs.hybrid_heat_accounting && !inputs.hybrid_thermal_carriers }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: KIM operator and real provider geometry at O0 and O2
        run: |
          bash tests/fpm/run_ppa_wu05_migmac02_dynamic_shrinkage.sh
          bash tests/fpm/run_ppa_wu05_migmac02_provider_geometry.sh
      - name: Original TTUTIL numeric input at O0 and O2
        run: python3 -B tests/dataqual15/qualify_ttutil_numeric_input.py --compiler /usr/bin/gfortran --output "$RUNNER_TEMP/ttutil-numeric"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-ttutil-numeric-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ttutil-numeric
          retention-days: 14
  native:
    if: github.event_name == 'pull_request' || inputs.thermal_substep_policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran-13
      - name: Verify exact current source and retained native evidence
        run: |
          grass_base=78c8012530b3be14e48edef6fc950e2c09c695ca
          ahl_source=1354f5cad9a4db106db50e4e5d8d6a6ba141bca3
          ahl_exact=false
          cache_source=f0e5d9e1dad0a92e3ecd4ea6f464ab55be7af80e
          kim_source=e145622a9b93aac0eee38a40338f6b452bf16ab8
          reader_source=5902c6b91e8478362a14eec9b22001a36f901769
          policy_source=1446572b0d90b82a6eff29df39b4eb5280f04ef1
          if { git merge-base --is-ancestor "$ahl_source" HEAD &&
               git diff --quiet "$ahl_source" HEAD -- src app reference tools tests; } ||
             { git merge-base --is-ancestor "$cache_source" HEAD &&
               git diff --quiet "$cache_source" HEAD -- src app reference tools tests; } ||
             { git merge-base --is-ancestor "$kim_source" HEAD &&
               git diff --quiet "$kim_source" HEAD -- src app reference tools tests; } ||
             { git merge-base --is-ancestor "$reader_source" HEAD &&
               git diff --quiet "$reader_source" HEAD -- src app reference tools tests; } ||
             { git merge-base --is-ancestor "$policy_source" HEAD &&
               git diff --quiet "$policy_source" HEAD -- src app reference tools tests; }; then
            ahl_exact=true
          fi
          if [[ "$ahl_exact" == true ]] || {
             git merge-base --is-ancestor "$grass_base" HEAD &&
             [[ "$(git diff --name-only --no-renames "$grass_base" HEAD -- src app reference tools)" == app/grass_project/initial_interval.f90 ]];
          }; then
            prior="$RUNNER_TEMP/grass-thermal-predecessor"
            git worktree add --detach "$prior" 77f3736198bdc54caa5d7d5ad2894413c0edb535
            trap 'git worktree remove "$prior"' EXIT
            (cd "$prior" && python3 -B tests/dataqual15/test_thermal_profile_production.py &&
              python3 -B tests/dataqual15/thermal_profile_production.py --verify-only)
          else
            python3 -B tests/dataqual15/test_thermal_profile_production.py
            python3 -B tests/dataqual15/thermal_profile_production.py --verify-only
          fi
      - name: Cold O0/O2 numerical and incumbent runtime contracts
        run: python3 -B tests/dataqual15/qualify_thermal_runtime.py --compiler /usr/bin/gfortran-13 --output "$RUNNER_TEMP/thermal-contract"
      - name: Current original-input application and own disk restart on both optimizations
        shell: bash
        run: |
          set -euo pipefail
          for opt in O0 O2; do
            python3 -B tools/solute/build_grass_startup.py --compiler /usr/bin/gfortran-13 --optimization "$opt" --policy retained --numerical-profile thermal-control-1e-5C --end 1 --output "$RUNNER_TEMP/grass-$opt"
            python3 -B tests/dataqual15/qualify_native_disk_restart.py --bundle "$RUNNER_TEMP/grass-$opt" --output "$RUNNER_TEMP/thermal-disk-$opt" --conductive-budget
          done
      - name: Cold original Andelst numerical input and native macro publication
        shell: bash
        run: |
          set -euo pipefail
          for opt in O0 O2; do
            python3 -B tests/dataqual15_hupsel/build_and_run.py --driver app/solute_project/main_water.f90 --compiler /usr/bin/gfortran-13 --optimization "$opt" --ttutil-archive "$RUNNER_TEMP/grass-$opt/libttutil.a" --output "$RUNNER_TEMP/native-$opt"
            if [[ "$opt" == O0 ]]; then name=day1-O0; else name=original-O2; fi
            python3 -B tests/dataqual15/continue_original_andelst.py --bundle "$RUNNER_TEMP/native-$opt" --quiet-stages --end 1 --output "$RUNNER_TEMP/s5-events-andelst-$name" --seconds 90
            python3 -B tests/dataqual15/continue_original_andelst.py --bundle "$RUNNER_TEMP/native-$opt" --quiet-stages --end '1.0169999999998254' --restart "$RUNNER_TEMP/s5-events-andelst-$name/restart.bin" --output "$RUNNER_TEMP/s5-events-andelst-own-exact-$opt" --seconds 90
            python3 -B tests/dataqual15/continue_original_andelst.py --bundle "$RUNNER_TEMP/native-$opt" --quiet-stages --end '1.0169999999998254' --output "$RUNNER_TEMP/s5-events-andelst-prefix-exact-$opt" --seconds 90
          done
          python3 -B tests/dataqual15/qualify_andelst_codec.py --workspace "$RUNNER_TEMP" --output "$RUNNER_TEMP/andelst-codec"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registered-thermal-native-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/thermal-contract
            ${{ runner.temp }}/grass-O0
            ${{ runner.temp }}/grass-O2
            ${{ runner.temp }}/thermal-disk-O0
            ${{ runner.temp }}/thermal-disk-O2
            ${{ runner.temp }}/native-O0
            ${{ runner.temp }}/native-O2
            ${{ runner.temp }}/s5-events-andelst-*
            ${{ runner.temp }}/andelst-codec
