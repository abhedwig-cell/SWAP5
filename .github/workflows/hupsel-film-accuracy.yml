name: Hupsel original-state independent film accuracy
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-film-accuracy.yml
      - tests/dataqual15_hupsel/film_accuracy.py
      - tests/dataqual15_hupsel/film_accuracy_evidence.py
      - tests/dataqual15_hupsel/test_film_accuracy.py
      - integration/dataqual15_hupsel/FILM_ACCURACY_*
      - docs/science/HUPSEL_FILM_ACCURACY.md
permissions:
  contents: read
jobs:
  complete-original-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - run: python3 -B tests/dataqual15_hupsel/test_film_accuracy.py
      - run: python3 -B tests/dataqual15_hupsel/film_accuracy_evidence.py
      - name: All3206 accepted original profiles, independent beta and logarithmic witnesses, O0 O2 literal replay
        run: python3 -B tests/dataqual15_hupsel/film_accuracy.py --compiler /usr/bin/gfortran-13 --output "$RUNNER_TEMP/film-accuracy"
      - name: Preserve complete current and unchanged predecessor authority
        run: python3 -B tests/dataqual15/verify_current_native_admission.py --output "$RUNNER_TEMP/film-preservation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-accuracy-${{ github.sha }}
          path: |
            ${{ runner.temp }}/film-accuracy/RESULT.json
            ${{ runner.temp }}/film-accuracy/WITNESSES.json
            ${{ runner.temp }}/film-accuracy/certified-film.dat
            ${{ runner.temp }}/film-accuracy/O*/*.f90
            ${{ runner.temp }}/film-accuracy/O*/*.stdout
            ${{ runner.temp }}/film-accuracy/O*/*.stderr
            ${{ runner.temp }}/film-preservation/RESULT.json
          retention-days: 14
