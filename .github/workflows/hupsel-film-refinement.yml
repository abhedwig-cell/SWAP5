name: Hupsel actual film refinement and private safeguard
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-film-refinement.yml
      - tests/dataqual15_hupsel/film_refinement*.py
      - tests/dataqual15_hupsel/test_film_refinement.py
      - integration/dataqual15_hupsel/FILM_REFINEMENT_*
      - docs/science/HUPSEL_FILM_REFINEMENT.md
permissions:
  contents: read
jobs:
  actual-observer-and-private-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - run: python3 -B tests/dataqual15_hupsel/test_film_refinement.py
      - run: python3 -B tests/dataqual15_hupsel/film_refinement_evidence.py
      - name: Actual O0 O2 refinements and exact complete-corpus unobserved controls
        run: python3 -B tests/dataqual15_hupsel/film_refinement.py --compiler /usr/bin/gfortran-13 --output "$RUNNER_TEMP/film-observation"
      - name: Private O0 O2 safeguard, independent true error and finite/exhaustion controls
        run: python3 -B tests/dataqual15_hupsel/film_refinement_candidate.py --compiler /usr/bin/gfortran-13 --observation "$RUNNER_TEMP/film-observation" --output "$RUNNER_TEMP/film-candidate"
      - name: Complete current and unmodified predecessor preservation
        run: python3 -B tests/dataqual15/verify_current_native_admission.py --output "$RUNNER_TEMP/film-preservation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-refinement-${{ github.sha }}
          path: |
            ${{ runner.temp }}/film-observation/RESULT.json
            ${{ runner.temp }}/film-observation/*/*.stdout
            ${{ runner.temp }}/film-observation/*/*.stderr
            ${{ runner.temp }}/film-observation/*/*.f90
            ${{ runner.temp }}/film-observation/*/*.exe
            ${{ runner.temp }}/film-observation/*/BUILD.json
            ${{ runner.temp }}/film-candidate/RESULT.json
            ${{ runner.temp }}/film-candidate/O*/
            ${{ runner.temp }}/film-preservation/RESULT.json
          retention-days: 14
