name: Hupsel complete private film rotation
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-film-rotation.yml
      - tests/dataqual15_hupsel/film_rotation*.py
      - tests/dataqual15_hupsel/test_film_rotation.py
      - integration/dataqual15_hupsel/FILM_ROTATION_*
      - docs/science/HUPSEL_FILM_ROTATION.md
permissions:
  contents: read
jobs:
  full-default-and-own-wet-cuts:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - name: Retained Windows complete runtime evidence
        run: python3 -B tests/dataqual15_hupsel/film_rotation_evidence.py
      - name: Exact dependency-bound original POSIX proof or new actual execution
        id: native
        run: python3 -B tests/dataqual15_hupsel/film_rotation_evidence.py --native-mode >> "$GITHUB_OUTPUT"
      - name: Actual original-initialized1096 default, observation, strict cuts and native refusals
        if: steps.native.outputs.reused != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/film-rotation"
          python3 -B tests/dataqual15_hupsel/film_rotation.py --optimization ${{ matrix.optimization }} --compiler /usr/bin/gfortran-13 --output "$RUNNER_TEMP/film-rotation/${{ matrix.optimization }}"
      - name: Actual retained closure and provenance defect controls
        if: steps.native.outputs.reused != 'true' && matrix.optimization == 'O0'
        env:
          FILM_ROTATION_TEST_CASE: ${{ runner.temp }}/film-rotation/O0
          FILM_ROTATION_TEST_PLATFORM: posix
        run: python3 -B tests/dataqual15_hupsel/test_film_rotation.py
      - name: Complete independent ledger typed profiles wet cuts and unchanged37 science bounds
        if: steps.native.outputs.reused != 'true'
        run: python3 -B tests/dataqual15_hupsel/film_rotation_audit.py --runtime "$RUNNER_TEMP/film-rotation/${{ matrix.optimization }}" --optimization ${{ matrix.optimization }} --platform posix
      - name: Full raw control and thirteen ledger/profile defect checks
        if: steps.native.outputs.reused != 'true'
        run: |
          python3 -B -c 'import sys;from pathlib import Path;sys.path.insert(0,"tests/dataqual15_hupsel");from film_rotation_evidence import verify;import os;print(verify(Path(os.environ["RUNNER_TEMP"])/"film-rotation","posix",("${{ matrix.optimization }}",))["status"])'
      - name: Complete current and unmodified predecessor preservation
        run: python3 -B tests/dataqual15/verify_current_native_admission.py --output "$RUNNER_TEMP/film-rotation-preservation"
      - uses: actions/upload-artifact@v4
        if: always() && steps.native.outputs.reused != 'true'
        with:
          name: film-rotation-${{ matrix.optimization }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/film-rotation/
            ${{ runner.temp }}/film-rotation-preservation/RESULT.json
          retention-days: 14
