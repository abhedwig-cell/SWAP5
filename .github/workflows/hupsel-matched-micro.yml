name: Hupsel actual original MICRO uptake and attribution
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-matched-micro.yml
      - tests/dataqual15_hupsel/matched_micro_*
      - integration/dataqual15_hupsel/MATCHED_MICRO_*
permissions:
  contents: read
jobs:
  cold-actual-micro-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay original MICRO with actual private tables under checked O0/O2
        run: python3 -B tests/dataqual15_hupsel/matched_micro_evidence.py
