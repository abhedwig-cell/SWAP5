name: Hupsel matched original oxygen factors
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-matched-oxygen.yml
      - tests/dataqual15_hupsel/matched_oxygen_*
      - integration/dataqual15_hupsel/MATCHED_OXYGEN_*
permissions:
  contents: read
jobs:
  cold-literal-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay unchanged B1.11 on actual accepted forcing under checked O0/O2
        run: python3 -B tests/dataqual15_hupsel/matched_oxygen_evidence.py
