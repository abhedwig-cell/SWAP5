name: Hupsel actual matched original transport
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-matched-solute.yml
      - tests/dataqual15_hupsel/matched_solute_*.py
      - integration/dataqual15_hupsel/MATCHED_SOLUTE_*
permissions:
  contents: read
jobs:
  cold-matched-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct literal source and check actual selected process comparisons
        run: python3 -B tests/dataqual15_hupsel/matched_solute_evidence.py
