name: Hupsel controlled MICRO pressure stopping probe
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-micro-pressure-probe.yml
      - tests/dataqual15_hupsel/micro_pressure_probe*
      - integration/dataqual15_hupsel/MICRO_PRESSURE_PROBE_*
permissions:
  contents: read
jobs:
  cold-pressure-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay incumbent and controlled pressure predicate with exact actual coefficients
        run: python3 -B tests/dataqual15_hupsel/micro_pressure_probe.py
