name: Hupsel MICRO pressure runtime research evidence
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-micro-pressure-runtime.yml
      - tests/dataqual15_hupsel/micro_pressure_runtime*
      - integration/dataqual15_hupsel/MICRO_PRESSURE_RUNTIME_*
permissions:
  contents: read
jobs:
  portable-runtime-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remeasure actual Windows coupled data and exact copied-source bindings
        run: python3 -B tests/dataqual15_hupsel/micro_pressure_runtime_evidence.py
