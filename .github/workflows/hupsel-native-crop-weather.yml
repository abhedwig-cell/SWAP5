name: Hupsel generic crop codec actual weather adapter preservation
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-native-crop-weather.yml
      - tests/dataqual15_hupsel/native_crop_adapter*
      - tests/dataqual15_hupsel/native_crop_weather*
      - integration/dataqual15_hupsel/NATIVE_CROP_ADAPTER_*
      - integration/dataqual15_hupsel/NATIVE_CROP_WEATHER_*
permissions:
  contents: read
jobs:
  cold-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - run: python3 -B tests/dataqual15_hupsel/native_crop_weather_evidence.py
      - run: python3 -B tests/dataqual15_hupsel/native_crop_weather_posix.py
      - name: Fresh complete default weather native adapter and schema matrix O0/O2
        shell: bash
        run: |
          for opt in O0 O2; do
            python3 -B tests/dataqual15_hupsel/native_crop_weather_runtime.py --compiler /usr/bin/gfortran --optimization "$opt" --out "$RUNNER_TEMP/weather-adapter-$opt"
          done
      - name: Current and unmodified predecessor preservation
        run: python3 -B tests/dataqual15/verify_current_native_admission.py --output "$RUNNER_TEMP/weather-adapter-preservation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-crop-weather-actual-posix
          path: |
            ${{ runner.temp }}/weather-adapter-O0
            ${{ runner.temp }}/weather-adapter-O2
