name: Hupsel native checkpoint publication
on:
  workflow_dispatch:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-native-publication.yml
      - tests/dataqual15_hupsel/qualify_native_publication.py
permissions:
  contents: read
jobs:
  posix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Real checked O0 and O2 publication and decoder qualification
        shell: bash
        run: |
          set -euo pipefail
          for opt in O0 O2; do
            python3 -B tests/dataqual15_hupsel/build_and_run.py --compiler "$(command -v gfortran-13)" --optimization "$opt" --output "$RUNNER_TEMP/hupsel-$opt"
            python3 -B tests/dataqual15_hupsel/qualify_native_publication.py --bundle "$RUNNER_TEMP/hupsel-$opt" --output "$RUNNER_TEMP/publication-$opt"
          done
          python3 -B tests/dataqual15_hupsel/verify_native_publication_evidence.py
      - name: Exact historical recipes and current native successor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
          python3 -B tests/dataqual15/test_native_restart_admission.py
          python3 -B tests/dataqual15/verify_native_restart_admission.py --output "$RUNNER_TEMP/native-admission"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hupsel-native-publication-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hupsel-*/BUILD.json
            ${{ runner.temp }}/hupsel-*/EVENTS.json
            ${{ runner.temp }}/hupsel-*/*.stderr
            ${{ runner.temp }}/publication-*/
            ${{ runner.temp }}/native-admission/
          retention-days: 14
