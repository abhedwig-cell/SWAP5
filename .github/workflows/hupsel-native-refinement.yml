name: Hupsel actual full native temporal refinement
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-native-refinement.yml
      - tests/dataqual15_hupsel/qualify_native_refinement.py
      - tests/dataqual15_hupsel/native_refinement_evidence.py
      - integration/dataqual15_hupsel/NATIVE_REFINEMENT_*
permissions:
  contents: read
jobs:
  cold-full-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remeasure full ledgers, primitive states and unchanged original limits
        run: python3 -B tests/dataqual15_hupsel/native_refinement_evidence.py
