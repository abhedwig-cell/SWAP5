name: Hupsel coherent pressure-film composition
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-pressure-film.yml
      - tests/dataqual15_hupsel/pressure_film*.py
      - tests/dataqual15_hupsel/test_pressure_film.py
      - integration/dataqual15_hupsel/PRESSURE_FILM_*
      - docs/science/HUPSEL_PRESSURE_FILM.md
permissions:
  contents: read
jobs:
  coherent-original-initialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - name: Exact complete Windows source/object/runtime proof
        run: python3 -B tests/dataqual15_hupsel/pressure_film_evidence.py --windows
      - name: Exact native proof reuse or actual execution required
        id: native
        run: python3 -B tests/dataqual15_hupsel/pressure_film_evidence.py --native-mode >> "$GITHUB_OUTPUT"
      - name: Fresh complete original baseline
        if: steps.native.outputs.reused != 'true'
        run: python3 -B tests/dataqual15_hupsel/build_and_run.py --compiler /usr/bin/gfortran-13 --optimization ${{ matrix.optimization }} --output "$RUNNER_TEMP/pressure-film-baseline-${{ matrix.optimization }}" --end 0
      - name: Coherent two-operator full native trajectory and strict own cuts
        if: steps.native.outputs.reused != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pressure-film"
          python3 -B tests/dataqual15_hupsel/pressure_film.py --baseline "$RUNNER_TEMP/pressure-film-baseline-${{ matrix.optimization }}" --compiler /usr/bin/gfortran-13 --optimization ${{ matrix.optimization }} --output "$RUNNER_TEMP/pressure-film/${{ matrix.optimization }}"
      - name: Actual coherent source object and policy defects
        if: steps.native.outputs.reused != 'true' && matrix.optimization == 'O0'
        env:
          PRESSURE_FILM_TEST_CASE: ${{ runner.temp }}/pressure-film/O0
        run: python3 -B tests/dataqual15_hupsel/test_pressure_film.py
      - name: Complete actual source object native control ledger and science capsule
        if: steps.native.outputs.reused != 'true'
        run: python3 -B tests/dataqual15_hupsel/pressure_film_evidence.py --capture-opt "$RUNNER_TEMP/pressure-film/${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Current and unmodified predecessor preservation
        run: python3 -B tests/dataqual15/verify_current_native_admission.py --output "$RUNNER_TEMP/pressure-film-preservation"
      - uses: actions/upload-artifact@v4
        if: always() && steps.native.outputs.reused != 'true'
        with:
          name: pressure-film-${{ matrix.optimization }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pressure-film/${{ matrix.optimization }}/CAPSULE.json
            ${{ runner.temp }}/pressure-film/${{ matrix.optimization }}/CAPSULE.tar.xz
            ${{ runner.temp }}/pressure-film-preservation/RESULT.json
          retention-days: 14
