name: Native crop logical exact baseline red-check attribution
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - tests/dataqual15_hupsel/production_crop_logical_baseline.py
      - .github/workflows/hupsel-production-crop-logical-baseline.yml
permissions:
  contents: read
jobs:
  unchanged-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python3 -m pip install PyYAML==6.0.2
      - run: git worktree add --detach "$RUNNER_TEMP/pre-codec-baseline" 5a4d47df19de2fa529878a7b92a7925f52daf819
      - name: Reproduce unchanged failures without relaxing or editing gates
        run: python3 -B tests/dataqual15_hupsel/production_crop_logical_baseline.py --baseline "$RUNNER_TEMP/pre-codec-baseline" --output "$RUNNER_TEMP/codec-baseline-attribution"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-exact-baseline-failure-attribution
          path: ${{ runner.temp }}/codec-baseline-attribution
