name: Hupsel production native crop logical successor
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - src/adapter/mod_wofost_crop_native_codec.f90
      - tests/dataqual15/verify_current_native_admission.py
      - tests/dataqual15_hupsel/production_crop_logical*
      - tests/dataqual15_hupsel/test_production_crop_logical.py
      - integration/dataqual15_hupsel/PRODUCTION_CROP_LOGICAL_*
      - .github/workflows/hupsel-production-crop-logical.yml
permissions:
  contents: read
jobs:
  current-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - run: python3 -B tests/dataqual15_hupsel/test_production_crop_logical.py
      - run: python3 -B tests/dataqual15_hupsel/production_crop_logical_evidence.py
      - name: Actual current production source Hupsel and weather O0/O2
        shell: bash
        run: |
          for opt in O0 O2; do
            python3 -B tests/dataqual15_hupsel/production_crop_logical_native.py --compiler /usr/bin/gfortran --optimization "$opt" --output "$RUNNER_TEMP/current-crop-logical-$opt"
          done
      - name: Exact current source, inherited executed postimage and unmodified predecessor
        run: python3 -B tests/dataqual15/verify_current_native_admission.py --output "$RUNNER_TEMP/current-crop-logical-preservation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-crop-logical-actual-posix
          path: |
            ${{ runner.temp }}/current-crop-logical-O0
            ${{ runner.temp }}/current-crop-logical-O2
