name: Actual current WOFOST81 native rotation lifecycle
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - tests/dataqual15_hupsel/rotation_native*
      - tests/dataqual15_hupsel/test_rotation_native.py
      - integration/dataqual15_hupsel/ROTATION_NATIVE_*
      - .github/workflows/hupsel-rotation-native.yml
permissions:
  contents: read
jobs:
  current-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - run: python3 -B tests/dataqual15_hupsel/test_rotation_native.py
      - name: Remeasure retained complete Windows source and native bytes
        run: python3 -B tests/dataqual15_hupsel/rotation_native_evidence.py
      - name: Actual clean current POSIX O0/O2 original failure and admitted-witness lifecycle
        if: ${{ hashFiles('integration/dataqual15_hupsel/ROTATION_NATIVE_POSIX_20261105.json') == '' }}
        run: |
          for opt in O0 O2; do
            python3 -B tests/dataqual15_hupsel/rotation_native_runtime.py --compiler /usr/bin/gfortran --optimization "$opt" --output "$RUNNER_TEMP/rotation-native-$opt"
          done
      - name: Remeasure retained actual POSIX if this is a receipt head
        if: ${{ hashFiles('integration/dataqual15_hupsel/ROTATION_NATIVE_POSIX_20261105.json') != '' }}
        run: python3 -B tests/dataqual15_hupsel/rotation_native_evidence.py --posix
      - name: Preserve current and unmodified predecessor admission
        run: python3 -B tests/dataqual15/verify_current_native_admission.py --output "$RUNNER_TEMP/rotation-native-preservation"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('integration/dataqual15_hupsel/ROTATION_NATIVE_POSIX_20261105.json') == '' }}
        with:
          name: actual-current-rotation-native-posix
          path: |
            ${{ runner.temp }}/rotation-native-O0
            ${{ runner.temp }}/rotation-native-O2
