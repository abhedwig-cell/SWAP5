name: Hupsel retained solute discrepancy attribution
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - .github/workflows/hupsel-solute-attribution.yml
      - tests/dataqual15_hupsel/solute_discrepancy_attribution.py
      - integration/dataqual15_hupsel/SOLUTE_ATTRIBUTION_*
permissions:
  contents: read
jobs:
  cold-solute-identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit both actual ledgers and primitive state contributions
        run: python3 -B tests/dataqual15_hupsel/solute_discrepancy_attribution.py
