name: HYDRO-MEMORY ACC02-F1 live root-active coupling

on:
  push:
    branches:
      - research/hydro-memory-acc02-f1
    paths:
      - 'docs/publication/HYDRO_MEMORY_STAGE0_ACCURACY_GOVERNANCE_V1.md'
      - 'docs/publication/HYDRO_MEMORY_STAGE0_INTERFACE_ACCURACY_GOVERNANCE_V1.md'
      - 'integration/research/HYDRO_MEMORY_ACC01_GOVERNANCE_RESULT.json'
      - 'integration/research/HYDRO_MEMORY_ACC01_F1_RESULT.json'
      - 'integration/research/HYDRO_MEMORY_ACC02_PREREGISTRATION.json'
      - 'integration/research/HYDRO_MEMORY_ACC02_RESULT.json'
      - 'integration/research/HYDRO_MEMORY_ACC02_F1_PREREGISTRATION.json'
      - 'tests/research/support/mod_hydro_memory_acc02_f1_bridge.f90'
      - 'tests/research/test_hydro_memory_acc02_f1_live_modflow.py'
      - 'tests/research/run_hydro_memory_acc02_f1_live_modflow.sh'
      - '.github/workflows/hydro-memory-acc02-f1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-coupling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          gfortran --version
          python3 --version
      - name: Run governed root-active live MODFLOW6 qualification
        run: bash tests/research/run_hydro_memory_acc02_f1_live_modflow.sh
