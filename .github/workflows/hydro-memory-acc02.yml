name: HYDRO-MEMORY ACC02 interface accuracy

on:
  push:
    branches:
      - research/hydro-memory-acc02
    paths:
      - 'docs/publication/HYDRO_MEMORY_STAGE0_INTERFACE_ACCURACY_GOVERNANCE_V1.md'
      - 'integration/research/HYDRO_MEMORY_ACC02_PREREGISTRATION.json'
      - 'tests/research/test_hydro_memory_acc02_interface_accuracy_binding.f90'
      - 'tests/research/run_hydro_memory_acc02_governance.sh'
      - '.github/workflows/hydro-memory-acc02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: gfortran --version
      - name: Run ACC02 governed interface gate
        run: bash tests/research/run_hydro_memory_acc02_governance.sh
