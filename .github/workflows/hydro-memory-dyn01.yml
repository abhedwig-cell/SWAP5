name: HYDRO-MEMORY DYN01 forcing-root composition

on:
  push:
    branches:
      - research/hydro-memory-dyn01
    paths:
      - 'integration/research/HYDRO_MEMORY_DYN01_PREREGISTRATION.json'
      - 'tests/research/test_hydro_memory_dyn01_forcing_root_composition.f90'
      - 'tests/research/run_hydro_memory_dyn01_forcing_root_composition.sh'
      - '.github/workflows/hydro-memory-dyn01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run DYN01 qualification
        run: bash tests/research/run_hydro_memory_dyn01_forcing_root_composition.sh
