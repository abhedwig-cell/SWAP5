name: Local irrigation pulse temporal qualification
on:
  push:
    branches: [codex/irrigation-pulse-time01]
    paths:
      - '.github/workflows/irrigation-pulse-time.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: irrigation-pulse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  affected:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/irrigation_pulse
            tests/nomacro_mixtures
            tests/nomacro_pond_history
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
      - name: Prepare immutable original source and compiler provider
        run: python3 -B tools/solute/run_water.py --no-macro-release --prepare-sources --reference-work "$RUNNER_TEMP/provider"
      - name: Recover completed source-bound component full periods and native windows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44047914474
          name: irrigation-pulse-3b5c682da60e9be18e5f5ac8cb1e1b81116bda87
          path: ${{ runner.temp }}/previous
      - name: Verify unchanged executed dependency surface before continuation
        run: |
          git fetch --no-tags --depth=1 origin 3b5c682da60e9be18e5f5ac8cb1e1b81116bda87
          git diff --exit-code 3b5c682da60e9be18e5f5ac8cb1e1b81116bda87 HEAD -- app src reference tools tests/irrigation_pulse/run.py tests/irrigation_pulse/component.py tests/irrigation_pulse/component.f90 tests/nomacro_mixtures tests/nomacro_pond_history
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"previous/pulse/RESULT.json"; r=json.loads(p.read_text()); assert len(r["cases"])==2; assert all(v[o]["full"]["days"]==1096 and len(v[o]["full"]["own"])==6 for v in r["cases"].values() for o in ("O0","O2"))'
          find "$RUNNER_TEMP/previous" -type f -name '*.exe' -exec chmod u+x {} +
      - name: Literal original comparison transactions and paired model cost
        run: |
          chmod u+x "$RUNNER_TEMP/previous/pulse/"*-build/day_donor "$RUNNER_TEMP/previous/pulse/"*-build/day_kernel
          python3 -B tests/irrigation_pulse/finish.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/previous/pulse"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irrigation-pulse-${{ github.sha }}
          path: |
            ${{ runner.temp }}/previous
          retention-days: 30
