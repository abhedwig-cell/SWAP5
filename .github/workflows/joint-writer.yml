name: Private three-codec native writer publication
on:
  pull_request:
    paths:
      - 'tests/dataqual15_hupsel/joint_writer*'
      - 'tests/dataqual15_hupsel/joint_writer_candidates/**'
      - 'integration/dataqual15_hupsel/JOINT_WRITER_*'
      - '.github/workflows/joint-writer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - name: Actual private modules, original controls and real fault and termination cases
        run: |
          python -B tests/dataqual15_hupsel/joint_writer_frozen.py --output "$RUNNER_TEMP/joint-writer-frozen"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-writer-posix
          path: |
            ${{ runner.temp }}/joint-writer-frozen/*.json
            ${{ runner.temp }}/joint-writer-frozen/*.stdout
            ${{ runner.temp }}/joint-writer-frozen/*.stderr
            integration/dataqual15_hupsel/JOINT_WRITER_POSIX_*
            ${{ runner.temp }}/joint-writer/**/RESULT.json
            ${{ runner.temp }}/joint-writer/**/EVENTS.json
            ${{ runner.temp }}/joint-writer/**/*.stderr
