name: Kalmthout accepted-state export (research only)
on:
  push:
    branches:
      - research/kalmthout-sw5-state-export-20261018
    paths:
      - research/kalmthout_pilot/TRIGGER_STATE_EXPORT
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran
      - name: Validate state-export parser
        run: python3 research/kalmthout_pilot/test_validate_state_dump.py
      - name: Validate backtracking trace parser
        run: python3 research/kalmthout_pilot/test_validate_backtrack_trace.py
      - name: Focused 1700-hour failure state export
        run: bash research/kalmthout_pilot/run_state_export_diagnostic.sh "$RUNNER_TEMP/kalmthout-state"
      - name: Save evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalmthout-full-state-export
          path: ${{ runner.temp }}/kalmthout-state/
          retention-days: 30
