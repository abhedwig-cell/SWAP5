name: Kalmthout SWAP5 pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run Kalmthout pilot
        run: chmod +x research/kalmthout_pilot/run_kalmthout_daily.sh && research/kalmthout_pilot/run_kalmthout_daily.sh "$RUNNER_TEMP/kalmthout-output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalmthout-swap5-pilot
          path: ${{ runner.temp }}/kalmthout-output
