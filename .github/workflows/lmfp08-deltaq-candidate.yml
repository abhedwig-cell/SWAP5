name: F-LMFP08 Constrained Delta-q Candidate

on:
  workflow_dispatch:

# Retained as negative-evidence harness. The delta-q candidate already failed the
# face/sign and transient-stress gates, so it must not make every later F-LMFP08
# branch checkpoint red. Re-run only explicitly when that rejected candidate is
# being investigated.
jobs:
  deltaq:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: |
          gfortran --version
          python3 --version
      - name: Constrained delta-q qualification gate
        run: bash experiments/lmfp/run_lmfp08_deltaq_gate.sh
      - name: Upload delta-q evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-lmfp08-deltaq-evidence
          path: |
            lmfp08-deltaq-artifacts/
            lmfp04-artifacts/
