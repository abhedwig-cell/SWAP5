name: F-LMFP09 Adaptive Ratio Refinement

on:
  push:
    branches:
      - work/f-lmfp09-hydraulic-envelope-geometry
  workflow_dispatch:

jobs:
  adaptive-ratio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Adaptive single-interval ratio refinement gate
        run: bash experiments/lmfp/run_lmfp09_adaptive_ratio_gate.sh
      - name: Upload adaptive ratio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-lmfp09-adaptive-ratio-evidence
          path: lmfp09-adaptive-ratio-artifacts/
