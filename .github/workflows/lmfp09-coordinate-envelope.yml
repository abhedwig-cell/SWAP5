name: F-LMFP09 Coordinate Envelope (Frozen A1)

on:
  workflow_dispatch:

jobs:
  coordinate-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: |
          python3 --version
      - name: Coordinate and hydraulic envelope gate
        run: bash experiments/lmfp/run_lmfp09_coordinate_gate.sh
      - name: Upload F-LMFP09 coordinate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-lmfp09-coordinate-evidence
          path: |
            lmfp09-coordinate-artifacts/
