name: F-LMFP09 Gate C2 Endpoint Pair

on:
  push:
    branches:
      - work/f-lmfp09-hydraulic-envelope-geometry
    paths:
      - .github/workflows/lmfp09-gate-c2-endpoint-pair.yml
      - experiments/lmfp/run_lmfp09_gate_c_endpoint_pair.py
      - experiments/lmfp/run_lmfp09_gate_c_endpoint_pair_persisted.py
      - integration/f-lmfp/F-LMFP09_GATE_C2_ENDPOINT_PAIR_ACCEPTANCE.json
  workflow_dispatch:

jobs:
  synthetic-endpoint-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Run Gate C2 synthetic endpoint-pair qualification
        shell: bash
        run: |
          set -euo pipefail
          out="lmfp09-gate-c2-endpoint-pair"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/lmfp/run_lmfp09_gate_c_endpoint_pair_persisted.py \
            "$out/F-LMFP09_GATE_C2_ENDPOINT_PAIR_RESULT.json" \
            | tee "$out/F-LMFP09_GATE_C2_ENDPOINT_PAIR_STDOUT.json"
      - name: Upload Gate C2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-lmfp09-gate-c2-endpoint-pair
          path: lmfp09-gate-c2-endpoint-pair/
