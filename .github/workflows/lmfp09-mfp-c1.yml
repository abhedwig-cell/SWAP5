name: F-LMFP09 C1 MFP Baseline

on:
  push:
    branches:
      - work/f-lmfp09-hydraulic-envelope-geometry
  workflow_dispatch:

jobs:
  mfp-c1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: C1 MFP baseline representation gate
        run: bash experiments/lmfp/run_lmfp09_mfp_c1_gate.sh
      - name: Upload C1 MFP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-lmfp09-mfp-c1-evidence
          path: lmfp09-mfp-c1-artifacts/
