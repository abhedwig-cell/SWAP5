name: F-LMFP09 Saturation Aligned Ratio Knots

on:
  push:
    branches:
      - work/f-lmfp09-hydraulic-envelope-geometry
  workflow_dispatch:

jobs:
  saturation-aligned:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Saturation aligned ratio knot characterization
        run: bash experiments/lmfp/run_lmfp09_saturation_aligned_ratio_knots_gate.sh
      - name: Upload saturation aligned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-lmfp09-saturation-aligned-ratio-knots
          path: lmfp09-saturation-aligned-artifacts/
