name: Independent original groundwater qualification
on:
  push:
    branches: [codex/local-wetting-time01]
    paths: ['.github/workflows/local-wetting-independent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-original:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/local_wetting
            integration/local-wetting-time01/independent
            reference/swap-4.3.1
      - name: Prepare immutable original source and compiler provider
        run: python3 -B tools/solute/run_water.py --no-macro-release --prepare-sources --reference-work "$RUNNER_TEMP/provider"
      - name: Verify exact scientific fixture and original-format state
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,zipfile,os
          p=pathlib.Path('integration/local-wetting-time01/independent');m=json.loads((p/'INPUT.json').read_text())
          assert hashlib.sha256((p/'INPUT.zip').read_bytes()).hexdigest()==m['zip_sha256']
          with zipfile.ZipFile(p/'INPUT.zip') as z:
              assert set(z.namelist())==set(m['files'])
              for n,v in m['files'].items():
                  assert hashlib.sha256(z.read(n)).hexdigest()==v['sha256']
              z.extractall(pathlib.Path(os.environ['RUNNER_TEMP'])/'fixture')
          PY
      - name: Independent original O0 O2 temporal refinement
        run: python3 -B tests/local_wetting/independent_reference.py --provider "$RUNNER_TEMP/provider" --seed-input "$RUNNER_TEMP/fixture/seed" --output "$RUNNER_TEMP/adaptive"
      - name: Independent original on actual nominal target grid
        run: python3 -B tests/local_wetting/independent_reference.py --provider "$RUNNER_TEMP/provider" --seed-input "$RUNNER_TEMP/fixture/seed" --output "$RUNNER_TEMP/nominal-replay" --caps 0.04 --grid "$RUNNER_TEMP/fixture/nominal-grid.txt"
      - name: Independent original on actual refined target grid
        run: python3 -B tests/local_wetting/independent_reference.py --provider "$RUNNER_TEMP/provider" --seed-input "$RUNNER_TEMP/fixture/seed" --output "$RUNNER_TEMP/fine-replay" --caps 0.000025 --grid "$RUNNER_TEMP/fixture/fine-grid.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-original-${{ github.sha }}
          path: |
            ${{ runner.temp }}/adaptive
            ${{ runner.temp }}/nominal-replay
            ${{ runner.temp }}/fine-replay
            ${{ runner.temp }}/provider/PREPARED.json
          retention-days: 30
