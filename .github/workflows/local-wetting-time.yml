name: Unified local wetting temporal qualification
on:
  push:
    branches: [codex/local-wetting-time01]
    paths: ['.github/workflows/local-wetting-time.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-wetting-${{ github.ref }}
  cancel-in-progress: false
jobs:
  affected:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/local_wetting
            tests/nomacro_mixtures
            tests/nomacro_pond_history
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
      - name: Prepare original source and compiler provider
        run: python3 -B tools/solute/run_water.py --no-macro-release --prepare-sources --reference-work "$RUNNER_TEMP/provider"
      - name: Original limiter O0/O2 component and pulse storm preflight
        run: |
          python3 -B tests/local_wetting/component.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/component"
          python3 -B tests/local_wetting/run.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/wetting" --phase short
      - name: Complete affected O0/O2 runs and exact own restarts
        run: python3 -B tests/local_wetting/run.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/wetting" --phase full
      - name: Literal original reference rollback controls and paired costs
        run: python3 -B tests/local_wetting/finish.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/wetting"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-wetting-${{ github.sha }}
          path: |
            ${{ runner.temp }}/component
            ${{ runner.temp }}/wetting
          retention-days: 30
