name: M1-C3 current canonical bundle

on:
  push:
    branches:
      - work/m1-c3-current-canonical-asset-blocker-20260918
    paths:
      - ".github/workflows/m1-c3-current-canonical-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle exact worktree
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/SWAP5-m1c3-current-canonical.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: swap5-m1c3-current-canonical
          path: /tmp/SWAP5-m1c3-current-canonical.tar.gz
          if-no-files-found: error
          retention-days: 1
