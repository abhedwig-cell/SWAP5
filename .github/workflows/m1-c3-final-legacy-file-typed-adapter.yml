name: M1-C3 final legacy-file typed adapter

on:
  push:
    branches:
      - work/m1-c3-final-legacy-file-typed-adapter
    paths:
      - 'src/solver/mod_b110_dynamic_top_boundary_provider.f90'
      - 'src/adapter/mod_b110_dynamic_top_boundary_solver_adapter.f90'
      - 'src/adapter/mod_b110_production_soil_water_task2.f90'
      - 'tests/m1/**'
      - 'integration/m1/M1_C3_FINAL_WHOLE_HUPSEL_QUALIFICATION.json'
      - '.github/workflows/m1-c3-final-legacy-file-typed-adapter.yml'
  pull_request:
    paths:
      - 'src/solver/mod_b110_dynamic_top_boundary_provider.f90'
      - 'src/adapter/mod_b110_dynamic_top_boundary_solver_adapter.f90'
      - 'src/adapter/mod_b110_production_soil_water_task2.f90'
      - 'tests/m1/**'
      - 'integration/m1/M1_C3_FINAL_WHOLE_HUPSEL_QUALIFICATION.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run M1-C3 final adapter gate
        run: tests/m1/run_m1_c3_final_adapter_gate.sh
