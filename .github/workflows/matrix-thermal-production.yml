name: Exact complete matrix thermal native production admission
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - src/adapter/mod_matrix_thermal_restart_file.f90
      - tests/dataqual15_hupsel/matrix_thermal_production.py
      - tests/dataqual15_hupsel/test_matrix_thermal_production.py
      - integration/dataqual15_hupsel/MATRIX_THERMAL_PRODUCTION_*
      - .github/workflows/matrix-thermal-production.yml
permissions:
  contents: read
jobs:
  complete-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - name: Exact source scope and seventeen malformed admission refusals
        run: python3 -B tests/dataqual15_hupsel/test_matrix_thermal_production.py
      - name: Complete actual Windows/POSIX source-native evidence and exact unmodified predecessor
        run: python3 -B tests/dataqual15_hupsel/matrix_thermal_production.py --output "$RUNNER_TEMP/thermal-production"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-matrix-thermal-production-admission
          path: ${{ runner.temp }}/thermal-production
  exact-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
      - name: Actual exact predecessor broad diagnostics without pass claims
        if: ${{ hashFiles('integration/dataqual15_hupsel/MATRIX_THERMAL_PRODUCTION_DIAGNOSTICS_20261106.json') == '' }}
        run: python3 -B tests/dataqual15_hupsel/matrix_thermal_production_baseline.py --output "$RUNNER_TEMP/thermal-exact-before"
      - name: Remeasure exact before and source failures without repeating immutable diagnostics
        if: ${{ hashFiles('integration/dataqual15_hupsel/MATRIX_THERMAL_PRODUCTION_DIAGNOSTICS_20261106.json') != '' }}
        run: python3 -B tests/dataqual15_hupsel/matrix_thermal_production_diagnostics.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('integration/dataqual15_hupsel/MATRIX_THERMAL_PRODUCTION_DIAGNOSTICS_20261106.json') == '' }}
        with:
          name: actual-exact-pre-S5MT-source-diagnostics
          path: ${{ runner.temp }}/thermal-exact-before
