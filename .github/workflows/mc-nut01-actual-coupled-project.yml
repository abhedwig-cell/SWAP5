name: MC-NUT01 historical actual B112 project startup
on:
  pull_request:
    paths:
      - 'src/crop/mod_crop_soil_n_historical_project_binding.f90'
      - 'tests/nut-crop/test_b112_retained_joint.f90'
      - '.github/workflows/mc-nut01-actual-coupled-project.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gfortran
      - name: B112 actual Richards crop Soil-N opaque restart and old bytes
        env:
          B112_REUSE_STABLE: '1'
        run: python3 -B tests/nut-crop/run_b112_retained_joint.py
