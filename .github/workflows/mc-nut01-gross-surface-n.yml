name: MC-NUT01 gross surface N bounded process
on:
  pull_request:
    paths:
      - 'src/process/mod_b111_surface_n_gross_budget.f90'
      - 'tests/nut-crop/test_surface_n_gross_budget.f90'
      - 'tests/nut-crop/run_surface_n_gross_budget.sh'
      - 'src/runtime/mod_b111_surface_n_reference_bridge.f90'
      - 'src/process/mod_b111_soil_n_mineral_owner.f90'
      - 'src/runtime/mod_b111_n_gross_direct_binding.f90'
      - 'tests/nut-crop/test_n_direct_gross_binding.f90'
      - 'src/runtime/mod_b111_n_reference_mineral_trial.f90'
      - 'src/runtime/mod_b111_n_reference_joint_application.f90'
      - 'tests/nut-crop/test_n_reference_mineral_trial.f90'
      - 'tests/nut-crop/test_mineral_gross_carrier.f90'
      - 'tests/nut-crop/run_mineral_gross_carrier.sh'
      - 'tests/nut-crop/test_surface_n_reference_bridge.f90'
      - 'tests/nut-crop/run_surface_n_reference_bridge.sh'
      - '.github/workflows/mc-nut01-gross-surface-n.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-o0-o2:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Native gross water independent N amount balance
        run: bash tests/nut-crop/run_surface_n_gross_budget.sh

  reference-gross-bridge-o0-o2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Native accepted Reference gross N bridge O0/O2
        run: bash tests/nut-crop/run_surface_n_reference_bridge.sh

  historical-mineral-owner-o0-o2:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify separate gross N source with strict signed net hydraulic carrier
        run: |
          bash tests/nut-crop/run_mineral_gross_carrier.sh
          N_CARRIER_GAP_RESULT_DIR="$RUNNER_TEMP/mc-nut01-old-net-witness-${GITHUB_RUN_ID}" \
            python3 integration/audits/run_nut_hist_carrier_gap.py
