name: MC-SOL01 file-driven Reference column

on:
  pull_request:
    paths:
      - 'app/solute_column/**'
      - 'tools/solute/**'
      - 'examples/solute_column/**'
      - 'tests/nut-sol/test_column_input.py'
      - 'src/runtime/mod_fmr_b111_*.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/process/mod_b111_*.f90'
      - 'src/adapter/mod_matrix_joint_restart_file.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'src/solver/mod_b110*.f90'
      - '.github/workflows/mc-sol01-column-input.yml'
  push:
    branches: [integration/f-ci-canonical]
    paths:
      - 'app/solute_column/**'
      - 'tools/solute/**'
      - 'examples/solute_column/**'
      - 'tests/nut-sol/test_column_input.py'
      - 'src/runtime/mod_fmr_b111_*.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/process/mod_b111_*.f90'
      - 'src/adapter/mod_matrix_joint_restart_file.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'src/solver/mod_b110*.f90'
      - '.github/workflows/mc-sol01-column-input.yml'

permissions:
  contents: read

concurrency:
  group: solute-column-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  column:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FC: gfortran-13
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /src/
            /tools/
            /tests/
            /reference/
            /examples/
            /.github/
            /integration/audits/
            /integration/nomacro-coverage01/*.json
            /integration/f-ci/hupsel51-water-balance/WINDOWS.json
            /integration/f-ci/saltfarm-guard-cost05/
            /integration/f-ci/saltfarm-newton-work01/WINDOWS_CURRENT.zip
            /integration/f-ci/nomacro-complete01/AGE_GROUNDWATER_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/AGE_GROUNDWATER_MERGE_RECEIPT.json
            /integration/f-ci/nomacro-complete01/AGE_GROUNDWATER_WINDOWS_O0_RAW_ARCHIVE.json
            /integration/f-ci/nomacro-complete01/AGE_GROUNDWATER_WINDOWS_O0_RAW.zip
            /integration/f-ci/nomacro-complete01/IMPLICIT_CONDUCTIVITY_*
            /integration/f-ci/nomacro-complete01/GROUNDWATER_WATER_*
            /integration/f-ci/saltfarm-typed07/
            /integration/f-ci/nomacro-complete01/WEATHER_*
            /integration/nomacro-coverage01/BLOCK_H_LAST_TEMPORAL_RAW.tar.xz
            /integration/f-ci/nomacro-complete01/EXTENDED_DRAINAGE_*
            /integration/f-ci/nomacro-complete01/ORDINARY_*
            /integration/f-ci/nomacro-complete01/GROUNDWATER_CDE_CLOCK_*
            /integration/f-ci/nomacro-complete01/GROUNDWATER_CDE_INTERVAL_*
            /integration/f-ci/nomacro-complete01/GROUNDWATER_SNOW_CDE_*
            /integration/f-ci/nomacro-complete01/IMPLICIT_SNOW_COMPOSITION_*
            /integration/f-ci/nomacro-complete01/WATER_SNOW_GROUNDWATER_*
            /integration/f-ci/nomacro-complete01/SNOW_UNDRAINED_*
            /integration/f-ci/nomacro-complete01/FROST_DRAINAGE_*
            /integration/f-ci/nomacro-complete01/FROST_IMPLICIT_*
            /integration/f-ci/nomacro-complete01/*MODEL7*
            /integration/f-ci/nomacro-complete01/*ANALYTICAL*
            /integration/f-ci/nomacro-complete01/*VAPOR*
            /integration/f-ci/nomacro-complete01/*SIGNED_SELECTORS*
            /integration/f-ci/nomacro-complete01/*DEFAULT_MODEL_GRAMMAR*
            /integration/f-ci/nomacro-complete01/*SNOW_VAPOR*
            /integration/f-ci/nomacro-complete01/OUTPUT_THERMAL_WINDOWS_*
      - name: Build both optimizations and run actual file/restart qualification
        run: |
          set -euo pipefail
          python tools/solute/build_column.py --optimization O0 --output "$RUNNER_TEMP/solute-column/O0"
          python tools/solute/build_column.py --optimization O2 --output "$RUNNER_TEMP/solute-column/O2"
          python tests/nut-sol/test_column_input.py --build-O0 "$RUNNER_TEMP/solute-column/O0" --build-O2 "$RUNNER_TEMP/solute-column/O2" --output "$RUNNER_TEMP/solute-column/qualification"
      - name: Preserve existing surface age and accepted source authority
        run: |
          if [[ -f tests/hupsel51/verify_successor.py ]]; then
            # The actual column O0/O2/restart test above still runs unchanged.
            python -B tests/hupsel51/verify_successor.py
          else
            python -B tests/nut-sol/verify_surface_age_successor.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-sol01-file-column-evidence
          path: |
            ${{ runner.temp }}/solute-column/O0/*.json
            ${{ runner.temp }}/solute-column/O0/*.stdout
            ${{ runner.temp }}/solute-column/O0/*.stderr
            ${{ runner.temp }}/solute-column/O2/*.json
            ${{ runner.temp }}/solute-column/O2/*.stdout
            ${{ runner.temp }}/solute-column/O2/*.stderr
            ${{ runner.temp }}/solute-column/qualification/**
