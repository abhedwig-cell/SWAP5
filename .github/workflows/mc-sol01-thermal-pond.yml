name: MC-SOL01 dynamic thermal pond and file application
on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_b111_pond_thermal_application.f90'
      - 'src/adapter/mod_pond_thermal_restart_file.f90'
      - 'app/solute_column/main.f90'
      - 'tests/nut-sol/*pond_thermal*'
      - 'tests/nut-sol/qualify_thermal_pond_application.py'
      - 'integration/audits/*pond_thermal*'
      - '.github/workflows/mc-sol01-thermal-pond.yml'
  push:
    branches: [integration/f-ci-canonical]
    paths:
      - 'src/runtime/mod_fmr_b111_pond_thermal_application.f90'
      - 'src/adapter/mod_pond_thermal_restart_file.f90'
      - 'app/solute_column/main.f90'
      - '.github/workflows/mc-sol01-thermal-pond.yml'
permissions:
  contents: read
concurrency:
  group: solute-thermal-pond-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  thermal-pond:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FC: gfortran-13
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actual six-exponent thermal pond, refinement, rollback and crash restart
        run: |
          if test -f integration/audits/verify_swp_reader.py && git diff --quiet c8b35ac3e9f2a2cf2400033d0225aea8198469ea HEAD -- src; then
            python -B integration/audits/verify_swp_reader.py
          else
            set -euo pipefail
            root="$RUNNER_TEMP/thermal-pond"
            mkdir -p "$root"
            python -B tests/nut-sol/run_pond_thermal.py --output "$root/physical-1" --exponent 1
            python -B integration/audits/qualify_pond_thermal.py --physical "$root/physical-1" --output "$root/qualified-1"
            for exponent in 0.5 0.8 1.0005 1.5 2; do
              python -B tests/nut-sol/run_pond_thermal.py --output "$root/physical-$exponent" --exponent "$exponent" --reuse-build "$root/physical-1"
              python -B integration/audits/qualify_pond_thermal.py --physical "$root/physical-$exponent" --build "$root/physical-1" --output "$root/qualified-$exponent"
            done
          fi
      - name: Current application, original preservation and prescribed annual forcing
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/thermal-pond"
          python -B tools/solute/build_column.py --optimization O0 --output "$root/column-O0"
          python -B tools/solute/build_column.py --optimization O2 --output "$root/column-O2"
          python -B tests/nut-sol/test_column_input.py --build-O0 "$root/column-O0" --build-O2 "$root/column-O2" --output "$root/incumbent"
          python -B tests/nut-sol/qualify_thermal_pond_application.py --build-O0 "$root/column-O0" --build-O2 "$root/column-O2" --output "$root/annual"
      - name: Exact source-bound scientific admission and evidence controls
        run: |
          python -B integration/audits/verify_pond_thermal.py
          python -B integration/audits/verify_pond_thermal.py --self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-sol01-thermal-pond
          path: |
            ${{ runner.temp }}/thermal-pond/**/*.json
            ${{ runner.temp }}/thermal-pond/**/*.stdout
            ${{ runner.temp }}/thermal-pond/**/*.stderr
            ${{ runner.temp }}/thermal-pond/**/*.csv
            ${{ runner.temp }}/thermal-pond/**/*.bin
