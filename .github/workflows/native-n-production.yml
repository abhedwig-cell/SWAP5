name: Current production mineral reactive CRC
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - src/adapter/mod_mineral_joint_restart_file.f90
      - src/adapter/mod_reactive_n_joint_restart_file.f90
      - tests/dataqual15_hupsel/native_n_production*.py
      - tests/dataqual15_hupsel/test_native_n_production.py
      - integration/dataqual15_hupsel/NATIVE_N_PRODUCTION_*
      - .github/workflows/native-n-production.yml
permissions:
  contents: read
jobs:
  current-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/.s5mt-thermal-native-n-production-current-native/predecessor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact unmodified pre-S5MT admission authority
        working-directory: ${{ github.workspace }}
        run: python3 -B tests/dataqual15_hupsel/matrix_thermal_production.py --prepare-only --output "$GITHUB_WORKSPACE/.s5mt-thermal-native-n-production-current-native"
      - name: Exact unmodified pre-publication admission authority
        working-directory: ${{ github.workspace }}/.s5mt-thermal-native-n-production-current-native/predecessor
        run: python3 -B tests/dataqual15_hupsel/generation_publication_admission.py --prepare-only --output "$RUNNER_TEMP/publication-native-n-production-current-native-view"
      - name: Exact unmodified pre-generation source authority
        working-directory: ${{ runner.temp }}/publication-native-n-production-current-native-view/predecessor
        run: python3 -B tests/dataqual15_hupsel/generation_crc_admission.py --prepare-only --output "$RUNNER_TEMP/generation-native-n-view"
      - name: Exact prior NativeN source admission view
        working-directory: ${{ runner.temp }}/generation-native-n-view/predecessor
        run: python3 -B tests/dataqual15_hupsel/matrix_crc_admission.py --prepare-only --output "$RUNNER_TEMP/matrix-native-n-view"
      - name: Require executable GNU Fortran
        working-directory: ${{ runner.temp }}/matrix-native-n-view/predecessor
        run: |
          if ! command -v gfortran >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gfortran
          fi
          test -x /usr/bin/gfortran
          /usr/bin/gfortran --version
      - run: python3 -m pip install -r tests/dataqual15_hupsel/requirements-science.txt
        working-directory: ${{ runner.temp }}/matrix-native-n-view/predecessor
      - run: python3 -B tests/dataqual15_hupsel/test_native_n_production.py
        working-directory: ${{ runner.temp }}/matrix-native-n-view/predecessor
      - name: Independent actual current Windows source proof
        working-directory: ${{ runner.temp }}/matrix-native-n-view/predecessor
        run: python3 -B tests/dataqual15_hupsel/native_n_production_evidence.py
      - name: Actual current POSIX O0 O2 full native module builds
        if: ${{ hashFiles('integration/dataqual15_hupsel/NATIVE_N_PRODUCTION_POSIX_20261105.json') == '' }}
        working-directory: ${{ runner.temp }}/matrix-native-n-view/predecessor
        run: |
          for opt in O0 O2; do
            python3 -B tests/dataqual15_hupsel/native_n_production_runtime.py --compiler /usr/bin/gfortran --optimization "$opt" --output "$RUNNER_TEMP/native-n-current-$opt"
            python3 -B tests/dataqual15_hupsel/native_n_production_evidence.py --audit-directory "$RUNNER_TEMP/native-n-current-$opt"
          done
      - name: Original retained POSIX proof on receipt heads
        if: ${{ hashFiles('integration/dataqual15_hupsel/NATIVE_N_PRODUCTION_POSIX_20261105.json') != '' }}
        working-directory: ${{ runner.temp }}/matrix-native-n-view/predecessor
        run: python3 -B tests/dataqual15_hupsel/native_n_production_evidence.py --posix
      - name: Current source and unmodified predecessor admission
        working-directory: ${{ runner.temp }}/matrix-native-n-view/predecessor
        run: python3 -B tests/dataqual15/verify_current_native_admission.py --output "$RUNNER_TEMP/native-n-current-preservation"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('integration/dataqual15_hupsel/NATIVE_N_PRODUCTION_POSIX_20261105.json') == '' }}
        with:
          name: exact-native-n-current-posix
          path: |
            ${{ runner.temp }}/native-n-current-O0
            ${{ runner.temp }}/native-n-current-O2
