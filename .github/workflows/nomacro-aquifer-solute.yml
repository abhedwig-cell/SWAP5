name: Original corrected mixed aquifer solute qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_mixtures
            tests/nomacro_scheduled_subsurface
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
            reference/swap-4.3.1/patches
      - name: Execute corrected reference and full native host O0/O2
        run: python3 -B tests/nomacro_scheduled_subsurface/aquifer_ci.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nomacro-aquifer-solute-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
