name: Actual groundwater and canonical named transport composition seams
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /src/
            /tools/solute/
            /tools/vq/
            /tests/nomacro_scheduled_subsurface/
            /tests/nomacro_mixtures/
            /tests/saltfarm_newton/
            /reference/swap-4.3.1/
            /integration/f-ci/saltfarm-guard-cost05/COMPOSITION_QUALIFICATION.json
            /integration/f-ci/saltfarm-guard-cost05/COMPOSITION_UBUNTU.zip
      - uses: actions/download-artifact@v4
        with:
          run-id: 44510817921
          name: groundwater-water-${{ matrix.optimization }}
          path: ${{ runner.temp }}/prior-groundwater-${{ matrix.optimization }}
          github-token: ${{ github.token }}
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Two-day actual shared dispatch native seams without repeated full periods
        run: python3 -B tests/nomacro_scheduled_subsurface/groundwater_water_composition_runtime.py --reference-work /tmp/groundwater-composition-provider --output "$RUNNER_TEMP/groundwater-composition-${{ matrix.optimization }}" --prior-root "$RUNNER_TEMP/prior-groundwater-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }} --platform Ubuntu
      - name: Preserve actual compiled producer source bytes
        if: always()
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$RUNNER_TEMP/groundwater-composition-${{ matrix.optimization }}/source-capsule"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groundwater-composition-${{ matrix.optimization }}
          path: ${{ runner.temp }}/groundwater-composition-${{ matrix.optimization }}
          retention-days: 14
