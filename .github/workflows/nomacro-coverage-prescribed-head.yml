name: Selected current CDE interval water clock and original dense state preservation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - name: Prepare compiler and actual old source authorities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/output-hysteresis-provider
          mkdir -p integration/f-ci/nomacro-complete01 "$RUNNER_TEMP/cde-clock-preservation"
          for family in CDE_INTERVAL PERSTEP_DOMAIN OUTPUT_THERMAL; do
            git show "HEAD:integration/f-ci/nomacro-complete01/${family}_QUALIFICATION.json" > "integration/f-ci/nomacro-complete01/${family}_QUALIFICATION.json"
          done
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44411697565
          name: cde-interval-O2
          path: ${{ runner.temp }}/prior-cde-interval-O2
      - name: Four actual current CDE interval native private state source seams
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_clock_interval_preserve.py --reference-work /tmp/output-hysteresis-provider --platform Ubuntu --prior-calendar-root "$RUNNER_TEMP/prior-cde-interval-O2" --evidence-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/cde-clock-preservation/interval" --optimization O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44388289582
          name: perstep-domain-O2
          path: ${{ runner.temp }}/prior-perstep-domain-O2
      - name: Two actual current old water and Snow clock native families
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_clock_water_preserve.py --reference-work /tmp/output-hysteresis-provider --platform Ubuntu --prior-calendar-root "$RUNNER_TEMP/prior-perstep-domain-O2" --evidence-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/cde-clock-preservation/water" --optimization O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44269217155
          name: output-thermal-O2
          path: ${{ runner.temp }}/prior-output-thermal-O2
      - name: Actual original dense CDE v1 Snow state and private provider dispatch
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_clock_dense_preserve.py --reference-work /tmp/output-hysteresis-provider --platform Ubuntu --prior-root "$RUNNER_TEMP/prior-output-thermal-O2" --evidence-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/cde-clock-preservation/dense" --optimization O2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cde-clock-preservation
          path: ${{ runner.temp }}/cde-clock-preservation
          retention-days: 14
