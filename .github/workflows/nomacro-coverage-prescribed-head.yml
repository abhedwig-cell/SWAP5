name: Original Snow FLPRINTDT date gated output and complete native clocks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Actual Snow calendar short native then full periods
        run: python3 -B tests/nomacro_scheduled_subsurface/perstep_domain_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/perstep-domain-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Independent public user commands and original reader refusals
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/perstep_domain_public.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/perstep-domain-${{ matrix.optimization }}" --output "$RUNNER_TEMP/perstep-domain-${{ matrix.optimization }}/public"
          python3 -B tests/nomacro_scheduled_subsurface/perstep_domain_reader.py --reference-work /tmp/output-hysteresis-provider --profile-root "$RUNNER_TEMP/perstep-domain-${{ matrix.optimization }}/short-ordinary-explicit-hys0-binary" --output "$RUNNER_TEMP/perstep-domain-${{ matrix.optimization }}/reader"
      - name: Actual non-January year-reset native and forged counters
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/perstep_domain_epoch.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/perstep-domain-${{ matrix.optimization }}/epoch" --optimization ${{ matrix.optimization }}
          python3 -B tests/nomacro_scheduled_subsurface/perstep_domain_year_controls.py --reference-work /tmp/output-hysteresis-provider --epoch-root "$RUNNER_TEMP/perstep-domain-${{ matrix.optimization }}/epoch" --output "$RUNNER_TEMP/perstep-domain-${{ matrix.optimization }}/year-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perstep-domain-${{ matrix.optimization }}
          path: ${{ runner.temp }}/perstep-domain-${{ matrix.optimization }}
          retention-days: 14
