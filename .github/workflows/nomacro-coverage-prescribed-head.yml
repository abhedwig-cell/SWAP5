name: Original CDE aquifer output and actual native receipt integrity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Actual direct soil age source qualification
        run: python3 -B tests/nomacro_scheduled_subsurface/output_aquifer_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/output-aquifer-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Actual Fortran native aquifer receipt component
        if: matrix.optimization == 'O0'
        run: python3 -B tests/nomacro_scheduled_subsurface/aquifer_receipt_component.py --reference-work /tmp/output-hysteresis-provider --profile-root "$RUNNER_TEMP/output-aquifer-${{ matrix.optimization }}/short-box-csv3" --output "$RUNNER_TEMP/output-aquifer-${{ matrix.optimization }}/receipt-component"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-aquifer-${{ matrix.optimization }}
          path: ${{ runner.temp }}/output-aquifer-${{ matrix.optimization }}
          retention-days: 7
