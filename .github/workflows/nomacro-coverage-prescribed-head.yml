name: Snow calendar inactive original CDE groundwater and age preservation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare literal original providers at their actual qualified paths
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/output-hysteresis-provider
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/groundwater-chemical-provider
          mkdir -p integration/f-ci/nomacro-complete01 "$RUNNER_TEMP/thermal-calendar-preservation"
          git show HEAD:integration/f-ci/nomacro-complete01/GROUNDWATER_HISTORY_QUALIFICATION.json > integration/f-ci/nomacro-complete01/GROUNDWATER_HISTORY_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/GROUNDWATER_CHEMICAL_QUALIFICATION.json > integration/f-ci/nomacro-complete01/GROUNDWATER_CHEMICAL_QUALIFICATION.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44302590106
          name: groundwater-history-O2
          path: ${{ runner.temp }}/prior-groundwater-history-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44287500505
          name: groundwater-chemical-O2
          path: ${{ runner.temp }}/prior-groundwater-ordinary-O2
      - name: Actual admitted groundwater CDE native domains and generated sources
        run: python3 -B tests/nomacro_scheduled_subsurface/thermal_calendar_groundwater_preserve.py --reference-work /tmp/groundwater-chemical-provider --platform Ubuntu --prior-history-root "$RUNNER_TEMP/prior-groundwater-history-O2" --prior-ordinary-root "$RUNNER_TEMP/prior-groundwater-ordinary-O2" --evidence-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/thermal-calendar-preservation/groundwater" --optimization O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44236392888
          name: age-irrigation-source-O2
          path: ${{ runner.temp }}/prior-current-age-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44246149974
          name: direct-soil-age-O2
          path: ${{ runner.temp }}/prior-direct-age-O2
      - name: Literal current fixed irrigation age
        run: python3 -B tests/nomacro_scheduled_subsurface/direct_soil_age_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-current-age-O2" --output "$RUNNER_TEMP/thermal-calendar-preservation/current-age"
      - name: Literal direct soil current age
        run: python3 -B tests/nomacro_scheduled_subsurface/output_aquifer_direct_age_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-direct-age-O2" --output "$RUNNER_TEMP/thermal-calendar-preservation/direct-age"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thermal-calendar-preservation
          path: ${{ runner.temp }}/thermal-calendar-preservation
          retention-days: 14
