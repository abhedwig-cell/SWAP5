name: Original prescribed-head lower boundary receipt
on:
  push:
    branches: [codex/nomacro-coverage12]
    paths: ['.github/workflows/nomacro-coverage-prescribed-head.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        configuration: [water-head-fixed, water-head-table, chemical-head-fixed, chemical-head-table, water-head-bbc, chemical-head-bbc]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
      - name: Execute full original soil-air boundary and native own restarts O0/O2
        run: python3 -B tools/solute/check_nomacro_coverage.py --head-boundary-options --configuration ${{ matrix.configuration }} --output "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nomacro-head-${{ matrix.configuration }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
