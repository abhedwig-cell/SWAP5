name: Original water Snow subdaily soil clock and complete native output state
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Actual Snow calendar short native then full periods
        run: python3 -B tests/nomacro_scheduled_subsurface/thermal_clock_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/thermal-clock-composed-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Independent public user commands and original reader refusals
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/thermal_clock_public.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/thermal-clock-composed-${{ matrix.optimization }}" --output "$RUNNER_TEMP/thermal-clock-composed-${{ matrix.optimization }}/public"
          python3 -B tests/nomacro_scheduled_subsurface/thermal_clock_reader.py --reference-work /tmp/output-hysteresis-provider --profile-root "$RUNNER_TEMP/thermal-clock-composed-${{ matrix.optimization }}/short-explicit-hys1-nprint2-vector" --output "$RUNNER_TEMP/thermal-clock-composed-${{ matrix.optimization }}/reader"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thermal-clock-composed-${{ matrix.optimization }}
          path: ${{ runner.temp }}/thermal-clock-composed-${{ matrix.optimization }}
          retention-days: 14
