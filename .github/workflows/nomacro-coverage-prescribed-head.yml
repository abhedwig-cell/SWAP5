name: Original age current RC3 wetting composition qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /app/
            /src/
            /tools/solute/
            /tools/vq/
            /tests/
            /integration/f-ci/nomacro-complete01/AGE_COMPOSITION_PARENT_RAW.zip
            /integration/f-ci/nomacro-complete01/AGE_COMPOSITION_PARENT_RAW_ARCHIVE.json
            /integration/local-wetting-time01/admission/
            /reference/swap-4.3.1/projects/
            /reference/swap-4.3.1/source-archives/
            /reference/swap-4.3.1/patches/
      - name: Qualify corrected output/native state and exact prior core preservation O0/O2
        run: python3 -B tests/nomacro_scheduled_subsurface/age_composition_ci.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nomacro-age-composition-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
