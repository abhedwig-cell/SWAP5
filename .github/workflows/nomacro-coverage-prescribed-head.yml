name: Original prescribed groundwater hydraulic snow and CDE histories
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Actual corrected groundwater CDE history qualification
        run: python3 -B tests/nomacro_scheduled_subsurface/groundwater_history_ci.py --reference-work /tmp/groundwater-chemical-provider --output "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Actual component input and independent user contracts
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_history_public.py --reference-work /tmp/groundwater-chemical-provider --matrix-root "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}" --output "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/public"
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_history_reader.py --reference-work /tmp/groundwater-chemical-provider --profile-root "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/short-hys2-snow1-original" --output "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/reader"
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_chemical_cde_probe.py --reference-work /tmp/groundwater-chemical-provider --profile-root "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/short-hys2-snow1-original" --input-root "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/short-hys2-snow1-original/input" --output "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/cde-probe"
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_chemical_cde_component.py --diagnostic-root "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/cde-probe" --build-json "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/short-hys2-snow1-original/build/BUILD.json" --output "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/cde-component"
          python3 -c 'import json,os; q=json.load(open(os.environ["RUNNER_TEMP"]+"/groundwater-history-${{ matrix.optimization }}/cde-probe/RESULT.json")); assert q["negative"]["status"]=="REFUSED_BEFORE_EXTERNAL_PREPARED_CANDIDATE"; assert q["negative"]["error"]=="Private CDE native stock differs from candidate receipt"'
      - name: Actual native history wire and duplicate authority witness
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_history_component.py --reference-work /tmp/groundwater-chemical-provider --profile-root "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/short-hys2-snow1-original" --output "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/native-component"
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_history_duplicate_probe.py --reference-work /tmp/groundwater-chemical-provider --profile-root "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/short-hys2-snow1-original" --output "$RUNNER_TEMP/groundwater-history-${{ matrix.optimization }}/witness-probe"
          python3 -c 'import json,os; q=json.load(open(os.environ["RUNNER_TEMP"]+"/groundwater-history-${{ matrix.optimization }}/witness-probe/RESULT.json")); assert q["divergent-original-copy"]["status"]=="REFUSED_INCONSISTENT_HYDRAULIC_WITNESS_BEFORE_READY"; assert q["final_state_overridden_by_appended_copy"] is False'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groundwater-history-${{ matrix.optimization }}
          path: ${{ runner.temp }}/groundwater-history-${{ matrix.optimization }}
          retention-days: 7
