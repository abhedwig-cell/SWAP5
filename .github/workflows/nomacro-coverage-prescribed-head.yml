name: Original output public and omitted-reader contracts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  public_reader:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare exact existing provider domain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/original-output-provider
          mkdir -p "$RUNNER_TEMP/output-contracts"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44212855459
          name: original-output-O2
          path: ${{ runner.temp }}/prior-original-output-O2
      - name: Restore executable file mode only
        run: chmod +x "$RUNNER_TEMP"/prior-original-output-O2/short-*/build/day_donor "$RUNNER_TEMP"/prior-original-output-O2/short-*/build/day_kernel
      - name: Actual public warm and self-contained native continuation
        run: python3 -B tests/nomacro_scheduled_subsurface/original_output_public.py --reference-work /tmp/original-output-provider --short-prefix "$RUNNER_TEMP/prior-original-output-O2/short-" --full-root "$RUNNER_TEMP/prior-original-output-O2" --output "$RUNNER_TEMP/output-contracts/public"
      - name: Omitted inactive monthly controls and invalid-input refusals
        if: always()
        run: python3 -B tests/nomacro_scheduled_subsurface/original_output_reader.py --reference-work /tmp/original-output-provider --output "$RUNNER_TEMP/output-contracts/reader"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-output-public-reader
          path: ${{ runner.temp }}/output-contracts
          retention-days: 30
