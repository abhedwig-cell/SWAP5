name: Thermal output read-only matrix closure public commands and literal prior preservation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare same original provider domain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/output-hysteresis-provider
          mkdir -p "$RUNNER_TEMP/thermal-output-contracts"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44269217155
          name: output-thermal-O0
          path: ${{ runner.temp }}/output-thermal-O0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44269217155
          name: output-thermal-O2
          path: ${{ runner.temp }}/output-thermal-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44259009023
          name: output-aquifer-O2
          path: ${{ runner.temp }}/prior-output-aquifer-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44246149974
          name: direct-soil-age-O2
          path: ${{ runner.temp }}/direct-soil-age-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44226733764
          name: output-hysteresis-O2
          path: ${{ runner.temp }}/prior-output-hysteresis-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44236392888
          name: age-irrigation-source-O2
          path: ${{ runner.temp }}/prior-current-age-O2
      - name: Restore current actual executable mode only
        run: chmod +x "$RUNNER_TEMP"/output-thermal-O*/short-*/build/day_donor "$RUNNER_TEMP"/output-thermal-O*/short-*/build/day_kernel
      - name: Close actual completed O0 O2 matrices without executing any model again
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/output_thermal_revalidate.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/output-thermal-O0" --optimization O0 --output "$RUNNER_TEMP/thermal-output-contracts/revalidation-O0"
          python3 -B tests/nomacro_scheduled_subsurface/output_thermal_revalidate.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/output-thermal-O2" --optimization O2 --output "$RUNNER_TEMP/thermal-output-contracts/revalidation-O2"
      - name: Actual public source commands and self-contained continuation
        run: python3 -B tests/nomacro_scheduled_subsurface/output_thermal_public.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/output-thermal-O2" --output "$RUNNER_TEMP/thermal-output-contracts/public"
      - name: Fresh prior output and hysteresis source-flag-off preservation
        run: python3 -B tests/nomacro_scheduled_subsurface/age_irrigation_source_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-output-hysteresis-O2" --output "$RUNNER_TEMP/thermal-output-contracts/preservation"
      - name: Fresh six admitted current-age source families with direct source disabled
        run: python3 -B tests/nomacro_scheduled_subsurface/direct_soil_age_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-current-age-O2" --output "$RUNNER_TEMP/thermal-output-contracts/current-preservation"
      - name: Real original reader faults and preserved default young guard
        run: python3 -B tests/nomacro_scheduled_subsurface/output_thermal_reader.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/output-thermal-O2" --output "$RUNNER_TEMP/thermal-output-contracts/reader"
      - name: Fresh six admitted direct soil age families
        run: python3 -B tests/nomacro_scheduled_subsurface/output_aquifer_direct_age_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/direct-soil-age-O2" --output "$RUNNER_TEMP/thermal-output-contracts/direct-age-preservation"
      - name: Four fresh actual aquifer source and native prefix families
        run: python3 -B tests/nomacro_scheduled_subsurface/output_thermal_aquifer_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-output-aquifer-O2" --output "$RUNNER_TEMP/thermal-output-contracts/aquifer-preservation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thermal-output-contracts
          path: ${{ runner.temp }}/thermal-output-contracts
          retention-days: 14
