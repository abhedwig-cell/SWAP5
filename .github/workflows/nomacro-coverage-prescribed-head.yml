name: Actual affected AGE CDE and corrected-source seams preserved
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /src/
            /tools/solute/
            /tools/vq/
            /tests/nomacro_scheduled_subsurface/
            /tests/nomacro_mixtures/
            /tests/saltfarm_newton/
            /reference/swap-4.3.1/
            /integration/f-ci/nomacro-complete01/CDE_CLOCK_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/ORIGINAL_OUTPUT_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/OUTPUT_HYSTERESIS_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/DIRECT_SOIL_AGE_QUALIFICATION.json
      - name: Prepare compiler and original provider
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path[:0]=['app/hybrid_water','tools/solute']
          import user_prepare
          root=Path('/tmp/output-hysteresis-provider')
          user_prepare.prepare(root)
          user_prepare.validate(root)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 44426634761
          name: cde-clock-O2
          path: ${{ runner.temp }}/prior-cde
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44212855459
          name: original-output-O2
          path: ${{ runner.temp }}/prior-legacy
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44226733764
          name: output-hysteresis-O2
          path: ${{ runner.temp }}/prior-history
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44246149974
          name: direct-soil-age-O2
          path: ${{ runner.temp }}/prior-direct
          github-token: ${{ github.token }}
      - name: Fresh actual affected seams against immutable original member identities
        run: |
          mkdir -p "$RUNNER_TEMP/age-perstep-preservation"
          for family in cde legacy history direct; do
            python3 -B tests/nomacro_scheduled_subsurface/age_perstep_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-$family" --output "$RUNNER_TEMP/age-perstep-preservation/$family" --platform Ubuntu --optimization O2 --family "$family"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: age-perstep-preservation
          path: ${{ runner.temp }}/age-perstep-preservation
          retention-days: 14
