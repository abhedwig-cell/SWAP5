name: Actual AGE groundwater affected prior source and native preservation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /src/
            /tools/solute/
            /tools/vq/
            /tests/nomacro_scheduled_subsurface/
            /tests/nomacro_mixtures/
            /tests/saltfarm_newton/
            /reference/swap-4.3.1/
            /integration/f-ci/nomacro-complete01/AGE_PERSTEP_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/OUTPUT_HYSTERESIS_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/DIRECT_SOIL_AGE_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/GROUNDWATER_CHEMICAL_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/GROUNDWATER_HISTORY_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/CDE_CLOCK_QUALIFICATION.json
      - name: Prepare compiler and actual original provider
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path[:0]=['app/hybrid_water','tools/solute']
          import user_prepare
          root=Path('/tmp/output-hysteresis-provider')
          user_prepare.prepare(root)
          user_prepare.validate(root)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 44440052103
          name: age-perstep-O2
          path: ${{ runner.temp }}/prior-age
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44226733764
          name: output-hysteresis-O2
          path: ${{ runner.temp }}/prior-nonstep
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44246149974
          name: direct-soil-age-O2
          path: ${{ runner.temp }}/prior-direct
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44287500505
          name: groundwater-chemical-O2
          path: ${{ runner.temp }}/prior-groundwater
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44302590106
          name: groundwater-history-O2
          path: ${{ runner.temp }}/prior-groundwater-history
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44426634761
          name: cde-clock-O2
          path: ${{ runner.temp }}/prior-cde
          github-token: ${{ github.token }}
      - name: Fourteen actual fresh affected prior source and native contexts
        run: |
          mkdir -p "$RUNNER_TEMP/age-groundwater-preservation"
          for family in age nonstep direct groundwater groundwater-history cde; do
            python3 -B tests/nomacro_scheduled_subsurface/age_groundwater_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-$family" --output "$RUNNER_TEMP/age-groundwater-preservation/$family" --platform Ubuntu --optimization O2 --family "$family"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: age-groundwater-preservation
          path: ${{ runner.temp }}/age-groundwater-preservation
          retention-days: 14
