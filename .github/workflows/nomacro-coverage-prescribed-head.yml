name: Continue actual Snow canonical preservation with missing SaltFarm driver present
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44341069500
          name: thermal-clock-composed-preservation
          path: ${{ runner.temp }}/prior-composed-preservation
      - name: Forward exact completed nineteen contexts without running their models again
        run: |
          python3 -B - <<'PY'
          import os,json,shutil,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);prior=root/'prior-composed-preservation';out=root/'thermal-clock-composed-preservation'
          assert not out.exists();out.mkdir();members={}
          for name,count in [('groundwater',3),('current-age',6),('direct-age',6),('calendar',4)]:
              report=json.loads((prior/name/'RESULT.json').read_text());assert len(report['profiles'])==count and any(word in report['status'] for word in ('PASS','PRESERVED'))
              shutil.copytree(prior/name,out/name)
              for path in (prior/name).rglob('*'):
                  if path.is_file():
                      assert path.resolve().is_relative_to(prior.resolve());relative=path.relative_to(prior)
                      digest=hashlib.sha256(path.read_bytes()).hexdigest();assert hashlib.sha256((out/relative).read_bytes()).hexdigest()==digest
                      members[relative.as_posix()]=digest
          (out/'CONTINUATION.json').write_text(json.dumps(dict(status='NINETEEN_ACTUAL_CONTEXTS_BYTES_FORWARDED_NO_MODEL_RERUN',source_run=44341069500,actual_contexts=19,members=members),indent=2))
          PY
      - name: Prepare actual original compiler and same canonical SaltFarm provider path
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work "$RUNNER_TEMP/newton/provider"
          mkdir -p integration/f-ci/saltfarm-newton-work01
          git show HEAD:integration/f-ci/saltfarm-newton-work01/PORTABLE.json > integration/f-ci/saltfarm-newton-work01/PORTABLE.json
          git show HEAD:integration/f-ci/saltfarm-newton-work01/UBUNTU_CURRENT.zip > integration/f-ci/saltfarm-newton-work01/UBUNTU_CURRENT.zip
      - name: Run only the two missing canonical SaltFarm profiles
        run: |
          for opt in O0 O2; do
            python3 -B tests/nomacro_scheduled_subsurface/thermal_clock_composed_saltfarm_preserve.py --platform Ubuntu --reference-work "$RUNNER_TEMP/newton/provider" --output "$RUNNER_TEMP/thermal-clock-composed-preservation/saltfarm-$opt" --optimization "$opt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thermal-clock-composed-preservation
          path: ${{ runner.temp }}/thermal-clock-composed-preservation
          retention-days: 14
