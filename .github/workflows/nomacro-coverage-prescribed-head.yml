name: Current original fixed irrigation age source and native state
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Actual current fixed-age source qualification
        run: python3 -B tests/nomacro_scheduled_subsurface/age_irrigation_source_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/age-irrigation-source-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Actual original capture diagnostic
        if: matrix.optimization == 'O0'
        run: python3 -B tests/nomacro_scheduled_subsurface/age_irrigation_source_original.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/age-irrigation-source-${{ matrix.optimization }}/original-component"
      - name: Plain corrected original comparison
        if: matrix.optimization == 'O0'
        run: python3 -B tests/nomacro_scheduled_subsurface/age_irrigation_source_reference_component.py --reference-work /tmp/output-hysteresis-provider --prior "$RUNNER_TEMP/age-irrigation-source-${{ matrix.optimization }}/original-component" --output "$RUNNER_TEMP/age-irrigation-source-${{ matrix.optimization }}/reference-component"
      - name: Actual original module input-domain component
        if: matrix.optimization == 'O0'
        run: python3 -B tests/nomacro_scheduled_subsurface/age_irrigation_source_domain_component.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/age-irrigation-source-${{ matrix.optimization }}/domain-component"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: age-irrigation-source-${{ matrix.optimization }}
          path: ${{ runner.temp }}/age-irrigation-source-${{ matrix.optimization }}
          retention-days: 7
