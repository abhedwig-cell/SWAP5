name: Exact default output codec preservation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /src/
            /tools/solute/
            /tools/vq/
            /tests/nomacro_scheduled_subsurface/
            /tests/nomacro_mixtures/
            /reference/swap-4.3.1/
            /integration/f-ci/nomacro-complete01/AGE_CLOCK_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/AGE_CLOCK_UBUNTU_O0_RAW.zip
            /integration/f-ci/nomacro-complete01/AGE_CLOCK_UBUNTU_O0_RAW_ARCHIVE.json
            /integration/f-ci/nomacro-complete01/AGE_CLOCK_UBUNTU_O2_RAW.zip
            /integration/f-ci/nomacro-complete01/AGE_CLOCK_UBUNTU_O2_RAW_ARCHIVE.json
            /integration/f-ci/nomacro-complete01/AGE_SCHEDULE_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/AGE_SCHEDULE_UBUNTU_O0_RAW.zip
            /integration/f-ci/nomacro-complete01/AGE_SCHEDULE_UBUNTU_O0_RAW_ARCHIVE.json
            /integration/f-ci/nomacro-complete01/AGE_SCHEDULE_UBUNTU_O2_RAW.zip
            /integration/f-ci/nomacro-complete01/AGE_SCHEDULE_UBUNTU_O2_RAW_ARCHIVE.json
            /integration/f-ci/nomacro-complete01/AGE_CALENDAR_QUALIFICATION.json
            /integration/f-ci/nomacro-complete01/AGE_CALENDAR_UBUNTU_O0_RAW.zip
            /integration/f-ci/nomacro-complete01/AGE_CALENDAR_UBUNTU_O0_RAW_ARCHIVE.json
            /integration/f-ci/nomacro-complete01/AGE_CALENDAR_UBUNTU_O2_RAW.zip
            /integration/f-ci/nomacro-complete01/AGE_CALENDAR_UBUNTU_O2_RAW_ARCHIVE.json
            /integration/f-ci/nomacro-complete01/AGE_FIXED_UBUNTU_RAW.zip
            /integration/f-ci/nomacro-complete01/AGE_FIXED_UBUNTU_RAW_ARCHIVE.json
      - name: Prepare compiler and exact original provider
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --reference-work "$RUNNER_TEMP/provider"
          mkdir -p "$RUNNER_TEMP/original-output-preserve"
      - name: Literal 005 004 003 closures and year-native state
        run: python3 -B tests/nomacro_scheduled_subsurface/original_output_preserve.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/original-output-preserve/default" --platform Ubuntu
      - name: Literal active daily 002 source and native state
        if: always()
        run: python3 -B tests/nomacro_scheduled_subsurface/age_calendar_preserve.py --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/original-output-preserve/daily002" --platform Ubuntu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-output-default-preservation
          path: ${{ runner.temp }}/original-output-preserve
          retention-days: 30
