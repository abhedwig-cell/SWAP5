name: Actual CDE subdaily perstep original clocks and local event source closure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Small actual production local event interface first
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_clock_component.py --output "$RUNNER_TEMP/cde-clock-component-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Actual CDE clock short native dose limit gates before full periods
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_clock_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Preserve original component bytes even if later composition failed
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/cde-clock-component-${{ matrix.optimization }}" ]; then
            mkdir -p "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}"
            mv "$RUNNER_TEMP/cde-clock-component-${{ matrix.optimization }}" "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/component"
          fi
      - name: Actual public commands original reader and private aliases
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/cde_clock_public.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}" --output "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/public"
          python3 -B tests/nomacro_scheduled_subsurface/cde_clock_reader.py --reference-work /tmp/output-hysteresis-provider --profile-root "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/short-ordinary-explicit-hys0-binary" --output "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/reader"
          for profile in ordinary-explicit-hys0-binary snow-monthly-hys2-binary; do
            python3 -B tests/nomacro_scheduled_subsurface/cde_clock_alias_controls.py --reference-work /tmp/output-hysteresis-provider --profile-root "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/short-$profile" --output "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/alias-$profile"
          done
      - name: Representative actual nonJanuary both-clock both-reset native periods and counter forgeries
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/cde_clock_epoch.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/epoch" --optimization ${{ matrix.optimization }}
          python3 -B tests/nomacro_scheduled_subsurface/cde_clock_year_controls.py --reference-work /tmp/output-hysteresis-provider --epoch-root "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/epoch" --output "$RUNNER_TEMP/cde-clock-${{ matrix.optimization }}/year-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cde-clock-${{ matrix.optimization }}
          path: ${{ runner.temp }}/cde-clock-${{ matrix.optimization }}
          retention-days: 14
