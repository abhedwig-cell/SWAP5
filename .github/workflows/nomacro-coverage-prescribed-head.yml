name: Original prescribed groundwater CDE and complete native state
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Actual original groundwater CDE qualification
        run: python3 -B tests/nomacro_scheduled_subsurface/groundwater_chemical_ci.py --reference-work /tmp/groundwater-chemical-provider --output "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Actual component input and independent user contracts
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_reaction_component.py --optimization ${{ matrix.optimization }} --output "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/reaction-component"
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_chemical_public.py --reference-work /tmp/groundwater-chemical-provider --matrix-root "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}" --output "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/public"
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_chemical_reader.py --reference-work /tmp/groundwater-chemical-provider --profile-root "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/short-crossing-csv3" --output "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/reader"
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_chemical_cde_probe.py --reference-work /tmp/groundwater-chemical-provider --profile-root "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/short-crossing-csv3" --input-root "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/short-crossing-csv3/input" --output "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/cde-probe"
          python3 -B tests/nomacro_scheduled_subsurface/groundwater_chemical_cde_component.py --diagnostic-root "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/cde-probe" --build-json "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/short-crossing-csv3/build/BUILD.json" --output "$RUNNER_TEMP/groundwater-chemical-${{ matrix.optimization }}/cde-component"
          python3 -c 'import json,os; q=json.load(open(os.environ["RUNNER_TEMP"]+"/groundwater-chemical-${{ matrix.optimization }}/cde-probe/RESULT.json")); assert q["negative"]["status"]=="REFUSED_BEFORE_EXTERNAL_PREPARED_CANDIDATE"; assert q["negative"]["error"]=="Private CDE native stock differs from candidate receipt"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groundwater-chemical-${{ matrix.optimization }}
          path: ${{ runner.temp }}/groundwater-chemical-${{ matrix.optimization }}
          retention-days: 7
