name: Original CDE interval private state and independent daily mass receipt
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Small actual production receipt O0 and O2
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_interval_component.py --output "$RUNNER_TEMP/cde-component-${{ matrix.optimization }}"
      - name: Actual CDE interval short native then full periods
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_interval_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Include completed component bytes
        run: mv "$RUNNER_TEMP/cde-component-${{ matrix.optimization }}" "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}/component"
      - name: Independent public commands original reader and private aliases
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/cde_interval_public.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}" --output "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}/public"
          python3 -B tests/nomacro_scheduled_subsurface/cde_interval_reader.py --reference-work /tmp/output-hysteresis-provider --profile-root "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}/short-ordinary-explicit-hys0-binary" --output "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}/reader"
          for profile in ordinary-explicit-hys0-binary snow-monthly-hys2-binary; do
            python3 -B tests/nomacro_scheduled_subsurface/cde_interval_alias_controls.py --reference-work /tmp/output-hysteresis-provider --profile-root "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}/short-$profile" --output "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}/alias-$profile"
          done
      - name: Actual non-January both reset native cold intervals
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_interval_epoch.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/cde-interval-${{ matrix.optimization }}/epoch" --optimization ${{ matrix.optimization }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cde-interval-${{ matrix.optimization }}
          path: ${{ runner.temp }}/cde-interval-${{ matrix.optimization }}
          retention-days: 14
