name: Original snow thermal output and complete physical native history
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Actual original snow thermal output qualification
        run: python3 -B tests/nomacro_scheduled_subsurface/output_thermal_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/output-thermal-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-thermal-${{ matrix.optimization }}
          path: ${{ runner.temp }}/output-thermal-${{ matrix.optimization }}
          retention-days: 7
