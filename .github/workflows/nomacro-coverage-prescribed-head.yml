name: Complete remaining thermal aquifer native and terminal contracts without repeated prior runs
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare same original provider domain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/output-hysteresis-provider
          mkdir -p "$RUNNER_TEMP/thermal-output-contracts-continuation"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44271536975
          name: thermal-output-contracts
          path: ${{ runner.temp }}/prior-thermal-output-contracts
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44259009023
          name: output-aquifer-O2
          path: ${{ runner.temp }}/prior-output-aquifer-O2
      - name: Execute only four remaining aquifer source and native preservation contexts
        run: python3 -B tests/nomacro_scheduled_subsurface/output_thermal_aquifer_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-output-aquifer-O2" --optimization O2 --output "$RUNNER_TEMP/thermal-output-contracts-continuation/aquifer-preservation"
      - name: Actual first and true terminal chemical input under active snow O0 O2
        run: python3 -B tests/nomacro_scheduled_subsurface/output_thermal_boundary.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/thermal-output-contracts-continuation/boundary"
      - name: Close preserved actual previous and newly completed contracts
        run: python3 -B tests/nomacro_scheduled_subsurface/output_thermal_contracts_complete.py --prior-root "$RUNNER_TEMP/prior-thermal-output-contracts" --continuation-root "$RUNNER_TEMP/thermal-output-contracts-continuation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thermal-output-contracts-continuation
          path: ${{ runner.temp }}/thermal-output-contracts-continuation
          retention-days: 14
