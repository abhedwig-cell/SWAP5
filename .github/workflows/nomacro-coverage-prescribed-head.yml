name: Actual original AGE perstep native private and calendar qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: All actual AGE short native private and1440limit gates before full periods
        run: python3 -B tests/nomacro_scheduled_subsurface/age_perstep_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/age-perstep-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Actual public run restart and original numeric reader with literal inactive partitions
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/age_perstep_public.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/age-perstep-${{ matrix.optimization }}" --output "$RUNNER_TEMP/age-perstep-${{ matrix.optimization }}/public"
          python3 -B tests/nomacro_scheduled_subsurface/age_perstep_reader.py --reference-work /tmp/output-hysteresis-provider --profile-root "$RUNNER_TEMP/age-perstep-${{ matrix.optimization }}/short-ordinary-explicit-h0-binary" --output "$RUNNER_TEMP/age-perstep-${{ matrix.optimization }}/reader"
      - name: Actual nonJanuary private clock epochs and paired postyear counter forgeries
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/age_perstep_epoch.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/age-perstep-${{ matrix.optimization }}/epoch" --optimization ${{ matrix.optimization }}
          python3 -B tests/nomacro_scheduled_subsurface/age_perstep_year_controls.py --reference-work /tmp/output-hysteresis-provider --epoch-root "$RUNNER_TEMP/age-perstep-${{ matrix.optimization }}/epoch" --output "$RUNNER_TEMP/age-perstep-${{ matrix.optimization }}/year-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: age-perstep-${{ matrix.optimization }}
          path: ${{ runner.temp }}/age-perstep-${{ matrix.optimization }}
          retention-days: 14
