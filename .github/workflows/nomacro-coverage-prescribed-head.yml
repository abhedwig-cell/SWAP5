name: Original detailed weather water receipt and complete native carry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /src/
            /tools/solute/
            /tools/vq/
            /tests/nomacro_scheduled_subsurface/
            /tests/nomacro_mixtures/
            /tests/saltfarm_newton/
            /reference/swap-4.3.1/
            /integration/nomacro-coverage01/BLOCK_H_LAST_TEMPORAL_RAW.tar.xz
            /integration/nomacro-coverage01/BLOCK_H_LAST_TEMPORAL_ARCHIVE.json
            /integration/nomacro-coverage01/BLOCK_H_PULSED_RAIN364_FAILURE.json
            /integration/nomacro-coverage01/BLOCK_H_HOURLY364_FAILURE.json
            /integration/f-ci/saltfarm-guard-cost05/COMPOSITION_QUALIFICATION.json
            /integration/f-ci/saltfarm-guard-cost05/COMPOSITION_UBUNTU.zip
      - name: Prepare original source compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          mkdir -p "$RUNNER_TEMP/proof"
          python3 -B tools/solute/run_water.py --no-macro-release --prepare-sources --reference-work /tmp/weather-provider
          cp /tmp/weather-provider/PREPARED.json "$RUNNER_TEMP/proof/PREPARED.json"
          cp /tmp/weather-provider/compile.log "$RUNNER_TEMP/proof/provider-compile.log"
      - name: Two affected full periods and exact original native continuations
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/weather_surface_runtime.py --reference-work /tmp/weather-provider --build-root "$RUNNER_TEMP/proof/build" --optimization ${{ matrix.optimization }} --case pulsed --days 1096 --output "$RUNNER_TEMP/proof/pulsed"
          python3 -B tests/nomacro_scheduled_subsurface/weather_surface_runtime.py --reference-work /tmp/weather-provider --build-root "$RUNNER_TEMP/proof/build" --optimization ${{ matrix.optimization }} --case hourly --days 1096 --output "$RUNNER_TEMP/proof/hourly"
      - name: Actual public native refusals and active transactions
        run: python3 -B tests/nomacro_scheduled_subsurface/weather_surface_controls.py --reference-work /tmp/weather-provider --profile-root "$RUNNER_TEMP/proof/hourly" --output "$RUNNER_TEMP/proof/controls"
      - name: Actual two-day shared named transport seam only
        run: python3 -B tests/nomacro_scheduled_subsurface/weather_named_seam.py --reference-work /tmp/weather-provider --output "$RUNNER_TEMP/proof/named-seam" --build-root "$RUNNER_TEMP/proof/named-build" --optimization ${{ matrix.optimization }} --platform Ubuntu
      - name: Preserve actual producer source bytes
        if: always()
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$RUNNER_TEMP/proof/source-capsule"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-terminal-${{ matrix.optimization }}
          path: ${{ runner.temp }}/proof
          retention-days: 14
