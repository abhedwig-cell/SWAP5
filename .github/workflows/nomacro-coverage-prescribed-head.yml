name: Actual original implicit conductivity and complete native qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: All actual short native active and numerical-origin gates before selected full periods
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_ci.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Actual public refusals of unqualified compatibility output before compilation
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_compatibility.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/compatibility" --optimization ${{ matrix.optimization }}
      - name: Two actual maximum print cadence transport native limits
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_limits.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/limits" --optimization ${{ matrix.optimization }}
      - name: Real original derivative interface with measured closure and production arithmetic
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_component.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/component" --optimization ${{ matrix.optimization }}
      - name: Actual positive chemical stock source sorption decay and groundwater full native composition
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_positive_cde.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/positive-chemical" --optimization ${{ matrix.optimization }}
      - name: Actual original private mean derivative through complete original HeadCalc
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_mean_component.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/mean-component" --optimization ${{ matrix.optimization }}
      - name: Actual original TimeControl strict retry and consumed pond event
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_retry_component.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/retry-component" --optimization ${{ matrix.optimization }}
      - name: Actual original exported pond event and rejected-only ownership
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_pond_event_component.py --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/pond-event-component" --optimization ${{ matrix.optimization }}
      - name: Actual original microscopic root discontinuity and corrected finalization
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_root_finalization_component.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/root-component" --optimization ${{ matrix.optimization }}
      - name: Actual original exported pond evaporation availability and private cap
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_pond_availability_component.py --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/availability-component" --optimization ${{ matrix.optimization }}
      - name: Actual public original numerical configuration run and complete cold restart
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_public.py --reference-work /tmp/implicit-conductivity-provider --matrix-root "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}" --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/public"
      - name: Actual original small interception loss and exact partition composition
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_interception_partition_component.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/interception-component" --optimization ${{ matrix.optimization }}
      - name: Real original nonhistory dry lookup initialized at the existing qualified endpoints
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_dry_lookup_component.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/dry-lookup-component" --optimization ${{ matrix.optimization }}
      - name: Real original saturation plateau derivative and actual captured constitutive input
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_saturation_derivative_component.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/saturation-component" --optimization ${{ matrix.optimization }}
      - name: Real weighted harmonic water history short native configuration; retained full numerical blocker not rerun
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_weighted_harmonic_runtime.py --reference-work /tmp/implicit-conductivity-provider --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/weighted-harmonic" --optimization ${{ matrix.optimization }} --short-only
      - name: Unqualified implicit AGE refuses at actual public and coupled front doors
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_admission_controls.py --reference-work /tmp/implicit-conductivity-provider --matrix-root "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}" --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/age-refusals"
      - name: Reproduce separate real unchanged retained AGE dryout state blocker without qualifying it
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_age_dryout_component.py --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/age-blocker" --optimization ${{ matrix.optimization }}
      - name: Preserve actual producer source bytes and distinct Git and LF identities
        if: always()
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$RUNNER_TEMP/implicit-conductivity-${{ matrix.optimization }}/source-capsule"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implicit-conductivity-${{ matrix.optimization }}
          path: ${{ runner.temp }}/implicit-conductivity-${{ matrix.optimization }}
          retention-days: 14
