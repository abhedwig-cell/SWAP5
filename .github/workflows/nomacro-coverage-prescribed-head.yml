name: Original output with complete hysteresis carry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Actual hysteresis output qualification
        run: python3 -B tests/nomacro_scheduled_subsurface/output_hysteresis_ci.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/output-hysteresis-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Actual native domain and external transaction controls
        run: python3 -B tests/nomacro_scheduled_subsurface/output_hysteresis_controls.py --reference-work /tmp/output-hysteresis-provider --matrix-root "$RUNNER_TEMP/output-hysteresis-${{ matrix.optimization }}" --output "$RUNNER_TEMP/output-hysteresis-${{ matrix.optimization }}/controls"
      - name: Actual original trial receipt component
        run: python3 -B tests/nomacro_scheduled_subsurface/age_clock_receipt_component.py --reference-work /tmp/output-hysteresis-provider --build "$RUNNER_TEMP/output-hysteresis-${{ matrix.optimization }}/short-water-hys2-csv3-np3/build" --optimization ${{ matrix.optimization }} --output "$RUNNER_TEMP/output-hysteresis-${{ matrix.optimization }}/receipt-component"
      - name: Original process-domain storage component
        if: matrix.optimization == 'O0'
        run: python3 -B tests/nomacro_scheduled_subsurface/output_hysteresis_domain_component.py --reference-work /tmp/output-hysteresis-provider --output "$RUNNER_TEMP/output-hysteresis-${{ matrix.optimization }}/domain-component"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-hysteresis-${{ matrix.optimization }}
          path: ${{ runner.temp }}/output-hysteresis-${{ matrix.optimization }}
          retention-days: 7
