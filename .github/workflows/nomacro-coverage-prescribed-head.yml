name: Selected literal CDE groundwater water and thermal preservation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - name: Prepare literal original providers at their actual qualified paths
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/output-hysteresis-provider
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/groundwater-chemical-provider
          mkdir -p integration/f-ci/nomacro-complete01 "$RUNNER_TEMP/cde-interval-preservation"
          git show HEAD:integration/f-ci/nomacro-complete01/GROUNDWATER_HISTORY_QUALIFICATION.json > integration/f-ci/nomacro-complete01/GROUNDWATER_HISTORY_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/THERMAL_CALENDAR_QUALIFICATION.json > integration/f-ci/nomacro-complete01/THERMAL_CALENDAR_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/THERMAL_CLOCK_COMPOSED_QUALIFICATION.json > integration/f-ci/nomacro-complete01/THERMAL_CLOCK_COMPOSED_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/THERMAL_STEP_QUALIFICATION.json > integration/f-ci/nomacro-complete01/THERMAL_STEP_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/THERMAL_RESET_QUALIFICATION.json > integration/f-ci/nomacro-complete01/THERMAL_RESET_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/ORDINARY_RESET_QUALIFICATION.json > integration/f-ci/nomacro-complete01/ORDINARY_RESET_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/GROUNDWATER_CHEMICAL_QUALIFICATION.json > integration/f-ci/nomacro-complete01/GROUNDWATER_CHEMICAL_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/OUTPUT_THERMAL_QUALIFICATION.json > integration/f-ci/nomacro-complete01/OUTPUT_THERMAL_QUALIFICATION.json
          git show HEAD:integration/f-ci/nomacro-complete01/PERSTEP_DOMAIN_QUALIFICATION.json > integration/f-ci/nomacro-complete01/PERSTEP_DOMAIN_QUALIFICATION.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44302590106
          name: groundwater-history-O2
          path: ${{ runner.temp }}/prior-groundwater-history-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44287500505
          name: groundwater-chemical-O2
          path: ${{ runner.temp }}/prior-groundwater-ordinary-O2
      - name: Actual admitted groundwater CDE native domains and generated sources
        run: python3 -B tests/nomacro_scheduled_subsurface/thermal_clock_composed_groundwater_preserve.py --reference-work /tmp/groundwater-chemical-provider --platform Ubuntu --prior-history-root "$RUNNER_TEMP/prior-groundwater-history-O2" --prior-ordinary-root "$RUNNER_TEMP/prior-groundwater-ordinary-O2" --evidence-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/cde-interval-preservation/groundwater" --optimization O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44269217155
          name: output-thermal-O2
          path: ${{ runner.temp }}/prior-output-thermal-O2
      - name: Literal dense CDE Snow water and frost at changed source seam
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_interval_thermal_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-output-thermal-O2" --output "$RUNNER_TEMP/cde-interval-preservation/thermal"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44388289582
          name: perstep-domain-O2
          path: ${{ runner.temp }}/prior-perstep-domain-O2
      - name: Literal original water three codec domains and Snow projection
        run: python3 -B tests/nomacro_scheduled_subsurface/cde_interval_water_preserve.py --reference-work /tmp/output-hysteresis-provider --platform Ubuntu --prior-calendar-root "$RUNNER_TEMP/prior-perstep-domain-O2" --evidence-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/cde-interval-preservation/water" --optimization O2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cde-interval-preservation
          path: ${{ runner.temp }}/cde-interval-preservation
          retention-days: 14
