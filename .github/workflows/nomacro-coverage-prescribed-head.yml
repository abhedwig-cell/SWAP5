name: Original groundwater water complete state and calendar composition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            tests/saltfarm_newton
            reference/swap-4.3.1
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - name: Six short native public active contexts before three full periods and two maximum cadence contexts
        run: python3 -B tests/nomacro_scheduled_subsurface/groundwater_water_ci.py --reference-work /tmp/groundwater-water-provider --output "$RUNNER_TEMP/groundwater-water-${{ matrix.optimization }}" --optimization ${{ matrix.optimization }}
      - name: Preserve actual compiled producer source bytes
        if: always()
        run: python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$RUNNER_TEMP/groundwater-water-${{ matrix.optimization }}/source-capsule"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groundwater-water-${{ matrix.optimization }}
          path: ${{ runner.temp }}/groundwater-water-${{ matrix.optimization }}
          retention-days: 14
