name: Groundwater history scoped ordinary age and aquifer preservation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_scheduled_subsurface
            tests/nomacro_mixtures
            reference/swap-4.3.1
      - name: Prepare same original provider domain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/output-hysteresis-provider
          mkdir -p "$RUNNER_TEMP/groundwater-history-preservation"
      - name: Prepare unchanged ordinary groundwater provider and authority
        run: |
          python3 -B tools/solute/run_water.py --prepare-sources --no-macro-release --reference-work /tmp/groundwater-chemical-provider
          mkdir -p integration/f-ci/nomacro-complete01
          git show HEAD:integration/f-ci/nomacro-complete01/GROUNDWATER_CHEMICAL_QUALIFICATION.json > integration/f-ci/nomacro-complete01/GROUNDWATER_CHEMICAL_QUALIFICATION.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44287500505
          name: groundwater-chemical-O2
          path: ${{ runner.temp }}/prior-groundwater-O2
      - name: Actual ordinary native and generated source preservation
        run: python3 -B tests/nomacro_scheduled_subsurface/groundwater_history_preserve.py --reference-work /tmp/groundwater-chemical-provider --platform Ubuntu --prior-root "$RUNNER_TEMP/prior-groundwater-O2" --evidence-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/groundwater-history-preservation/ordinary" --optimization O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44259009023
          name: output-aquifer-O2
          path: ${{ runner.temp }}/prior-output-aquifer-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44246149974
          name: direct-soil-age-O2
          path: ${{ runner.temp }}/direct-soil-age-O2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44236392888
          name: age-irrigation-source-O2
          path: ${{ runner.temp }}/prior-current-age-O2
      - name: Current fixed irrigation age
        run: python3 -B tests/nomacro_scheduled_subsurface/direct_soil_age_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-current-age-O2" --output "$RUNNER_TEMP/groundwater-history-preservation/current-age"
      - name: Direct soil current age
        run: python3 -B tests/nomacro_scheduled_subsurface/output_aquifer_direct_age_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/direct-soil-age-O2" --output "$RUNNER_TEMP/groundwater-history-preservation/direct-age"
      - name: Mixed aquifer original and native receipts
        run: python3 -B tests/nomacro_scheduled_subsurface/output_thermal_aquifer_portable_preserve.py --reference-work /tmp/output-hysteresis-provider --prior-root "$RUNNER_TEMP/prior-output-aquifer-O2" --output "$RUNNER_TEMP/groundwater-history-preservation/aquifer" --optimization O2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groundwater-history-preservation
          path: ${{ runner.temp }}/groundwater-history-preservation
          retention-days: 14
