name: Original weather reference ET and rainfall
# Own bounded hosted qualification; no peer model or platform campaign.
on:
  push:
    branches: [codex/nomacro-coverage08]
    paths: ['.github/workflows/nomacro-coverage-weather.yml']
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        default: all
        options: [all, last-temporal, remaining-no-soil-factor, factor-partition, factor-partition-soil, water-factor-soil, reference-et, reference-et-soil, rain-intensity, rain-duration, rain-detailed, rain-detailed-uniform, weather-hourly]
        description: Select only an uncovered configuration after retained prior evidence
permissions:
  contents: read
concurrency:
  group: nomacro-weather-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
      - name: Compile and execute original weather options O0/O2
        env:
          SELECTED: ${{ inputs.configuration }}
        run: |
          if [ -z "$SELECTED" ] || [ "$SELECTED" = all ]; then
            python3 -B tools/solute/check_nomacro_coverage.py --weather-options --output "$RUNNER_TEMP/proof"
          elif [ "$SELECTED" = last-temporal ]; then
            python3 -B tools/solute/check_nomacro_coverage.py --weather-options --configuration rain-detailed-uniform --configuration weather-hourly --output "$RUNNER_TEMP/proof"
          elif [ "$SELECTED" = remaining-no-soil-factor ]; then
            python3 -B tools/solute/check_nomacro_coverage.py --weather-options --configuration reference-et --configuration rain-intensity --configuration rain-duration --configuration rain-detailed --configuration weather-hourly --output "$RUNNER_TEMP/proof"
          else
            python3 -B tools/solute/check_nomacro_coverage.py --weather-options --configuration "$SELECTED" --output "$RUNNER_TEMP/proof"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nomacro-weather-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
