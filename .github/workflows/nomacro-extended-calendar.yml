name: Original extended drainage output and AGE calendar qualification
on:
  push:
    branches: [codex/nomacro-extended-calendar01]
    paths: ['.github/workflows/nomacro-extended-calendar.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nomacro-extended-calendar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_mixtures
            tests/nomacro_scheduled_subsurface
            tests/nomacro_drainage
            tests/saltfarm_newton
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
            reference/swap-4.3.1/patches
      - name: Preserve actual source and prepare original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          python3 -B tests/nomacro_drainage/calendar_runtime.py --help > /dev/null
          python3 -B tests/nomacro_drainage/calendar_forensics.py --help > /dev/null
          python3 -B tests/nomacro_drainage/extended_controls.py --help > /dev/null
          python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$RUNNER_TEMP/proof/source"
          git archive HEAD tests/nomacro_drainage tests/nomacro_scheduled_subsurface tests/nomacro_mixtures .github/workflows/nomacro-extended-calendar.yml > "$RUNNER_TEMP/proof/controller-source.tar"
          python3 -B -c 'import os,user_prepare; user_prepare.prepare(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Qualify selected original calendar and AGE compositions
        run: |
          for label in water cde age; do
            extra=()
            if [[ "$label" == water ]]; then case=water; mode=monthly; fmt=2; fi
            if [[ "$label" == cde ]]; then case=automatic; mode=daily; fmt=3; fi
            if [[ "$label" == age ]]; then case=automatic; mode=combined; fmt=3; extra=(--age); fi
            python3 -B tests/nomacro_drainage/calendar_runtime.py --case "$case" --mode "$mode" --format "$fmt" "${extra[@]}" --days 1096 --optimization ${{ matrix.optimization }} --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds/$label" --output "$RUNNER_TEMP/proof/$label"
            python3 -B tests/nomacro_drainage/calendar_forensics.py "$RUNNER_TEMP/proof/$label" --complete --output "$RUNNER_TEMP/proof/$label/FORENSICS.json"
            python3 -B tests/nomacro_drainage/extended_controls.py --original-output --reference-work "$RUNNER_TEMP/provider" --profile-root "$RUNNER_TEMP/proof/$label" --output "$RUNNER_TEMP/proof/$label/controls"
          done
      - name: Retain exact compiled bytes and original provider identity
        if: always()
        shell: python
        run: |
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);proof=root/'proof';proof.mkdir(exist_ok=True)
          provider=root/'provider/PREPARED.json'
          if provider.is_file():shutil.copyfile(provider,proof/'provider-PREPARED.json')
          for build in sorted((root/'builds').glob('*/*')):
              if not build.is_dir():continue
              target=proof/(build.parent.name+'-build');target.mkdir()
              for path in sorted(build.iterdir()):
                  if path.is_file() and (path.name in ('BUILD.json','day_donor','day_kernel') or path.suffix.lower() in ('.f90','.exe','.dll','.so')):
                      shutil.copyfile(path,target/path.name)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-calendar-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
