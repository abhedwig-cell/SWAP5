name: Original secondary implicit zero-pond qualification
on:
  workflow_dispatch:
    inputs:
      ordinary_pond:
        description: Qualify corrected ordinary pond, weighted history and six representative compositions
        type: boolean
        default: false
      postimage_only:
        description: Validate current read-only source guard and unchanged primary postimages without repeating full periods
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nomacro-secondary-pond-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_mixtures
            tests/nomacro_scheduled_subsurface
            tests/nomacro_drainage
            tests/saltfarm_newton
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
            reference/swap-4.3.1/patches
      - name: Preserve source and prepare original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$RUNNER_TEMP/proof/source"
          git archive HEAD tests/nomacro_drainage tests/nomacro_scheduled_subsurface tests/nomacro_mixtures .github/workflows/nomacro-extended-implicit.yml > "$RUNNER_TEMP/proof/controller-source.tar"
          python3 -B -c 'import os,user_prepare; user_prepare.prepare(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Qualify secondary water and CDE with original failure-crossing native windows
        if: ${{ !inputs.ordinary_pond }}
        run: |
          for label in water cde; do
            extra=(--switch-window); days=1096
            if [[ '${{ inputs.postimage_only }}' == true ]]; then extra=(); days=35; fi
            if [[ "$label" == water ]]; then case=water; mode=monthly; fmt=2; history=0; fi
            if [[ "$label" == cde ]]; then case=fixed; mode=daily; fmt=3; history=2; fi
            python3 -B tests/nomacro_drainage/calendar_runtime.py --case "$case" --mode "$mode" --format "$fmt" --hysteresis "$history" --implicit "${extra[@]}" --days "$days" --optimization ${{ matrix.optimization }} --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds/$label" --output "$RUNNER_TEMP/proof/$label"
            python3 -B tests/nomacro_drainage/secondary_pond_forensics.py "$RUNNER_TEMP/proof/$label" --output "$RUNNER_TEMP/proof/$label/FORENSICS.json"
            python3 -B tests/nomacro_drainage/extended_controls.py --original-output --reference-work "$RUNNER_TEMP/provider" --profile-root "$RUNNER_TEMP/proof/$label" --output "$RUNNER_TEMP/proof/$label/controls"
          done
          python3 -B tests/nomacro_drainage/secondary_pond_probe.py --profile "$RUNNER_TEMP/proof/water" --provider "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/components" --output "$RUNNER_TEMP/proof/components"
          PYTHONPATH=tests/nomacro_drainage python3 -B -c 'import json,os;from pathlib import Path;from secondary_pond_forensics import component;p=Path(os.environ["RUNNER_TEMP"])/"proof/components";(p/"FORENSICS.json").write_text(json.dumps(component(p),indent=2))'
          if [[ '${{ inputs.postimage_only }}' == true ]]; then
            python3 -B tests/nomacro_drainage/secondary_pond_controls.py --profile "$RUNNER_TEMP/proof/water" --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/proof/water/source-controls"
            for label in primary-water primary-cde; do
              extra=(); history=2; mode=daily; fmt=3
              if [[ "$label" == primary-water ]]; then extra=(--water-only); history=0; mode=monthly; fmt=2; fi
              python3 -B tests/nomacro_drainage/calendar_runtime.py --case automatic --mode "$mode" --format "$fmt" --hysteresis "$history" --implicit "${extra[@]}" --days 35 --optimization ${{ matrix.optimization }} --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds/$label" --output "$RUNNER_TEMP/proof/$label"
              python3 -B tests/nomacro_drainage/implicit_forensics.py "$RUNNER_TEMP/proof/$label" --output "$RUNNER_TEMP/proof/$label/FORENSICS.json"
            done
          fi
      - name: Qualify ordinary pond with representative full and composition evidence
        if: ${{ inputs.ordinary_pond }}
        run: |
          python3 -B tests/nomacro_scheduled_subsurface/ordinary_pond_runtime.py --optimization ${{ matrix.optimization }} --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds/ordinary-water" --output "$RUNNER_TEMP/proof/ordinary-water" --full-model-cap 600
          python3 -B tests/nomacro_drainage/ordinary_pond_evidence.py "$RUNNER_TEMP/proof/ordinary-water" --output "$RUNNER_TEMP/proof/ordinary-water/FORENSICS_V1.json"
          python3 -B tests/nomacro_drainage/ordinary_tangent_probe.py --profile "$RUNNER_TEMP/proof/ordinary-water" --provider "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds/ordinary-tangent" --output "$RUNNER_TEMP/proof/ordinary-components"
          python3 -B tests/nomacro_scheduled_subsurface/ordinary_pond_cohort.py --optimization ${{ matrix.optimization }} --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds/ordinary-matrix" --output "$RUNNER_TEMP/proof/ordinary-matrix"
          PYTHONPATH=tests/nomacro_drainage python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          from ordinary_pond_evidence import audit_short
          root=Path(os.environ['RUNNER_TEMP'])/'proof/ordinary-matrix'
          q=json.loads((root/'RESULT.json').read_text())
          assert q['status']=='ACTUAL_SIX_ORDINARY_POND_COMPOSITIONS_SHORT_NATIVE_PASS' and len(q['cases'])==6
          result={name:audit_short(root/name) for name in q['cases']}
          (root/'FORENSICS_V1.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          python3 -B tests/nomacro_scheduled_subsurface/ordinary_pond_cohort.py --phase cde-full --optimization ${{ matrix.optimization }} --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds/ordinary-matrix" --reuse-case "$RUNNER_TEMP/proof/ordinary-matrix/cde-groundwater-history" --output "$RUNNER_TEMP/proof/ordinary-cde"
          python3 -B tests/nomacro_drainage/ordinary_pond_evidence.py "$RUNNER_TEMP/proof/ordinary-cde" --output "$RUNNER_TEMP/proof/ordinary-cde/FORENSICS_V1.json"
      - name: Retain actual compiled bytes and provider identity
        if: always()
        shell: python
        run: |
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);proof=root/'proof';proof.mkdir(exist_ok=True)
          provider=root/'provider/PREPARED.json'
          if provider.is_file():shutil.copyfile(provider,proof/'provider-PREPARED.json')
          if '${{ inputs.ordinary_pond }}' == 'true':
              import json,hashlib
              projection={}
              for manifest in sorted((root/'builds').rglob('BUILD.json')):
                  build=manifest.parent;relative=build.relative_to(root/'builds')
                  target=proof/'compiled'/relative;target.mkdir(parents=True)
                  for path in sorted(build.iterdir()):
                      if path.is_file() and (path.name in ('BUILD.json','day_donor','day_kernel') or path.suffix.lower() in ('.f90','.exe','.dll','.so')):
                          shutil.copyfile(path,target/path.name)
                  projection[str(build)]=dict(archive_prefix=target.relative_to(proof).as_posix(),actual_BUILD_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest())
              (proof/'COMPILED_PROJECTION_V1.json').write_text(json.dumps(projection,indent=2)+'\n')
              raise SystemExit(0)
          for build in sorted((root/'builds').glob('*/*')):
              if not build.is_dir():continue
              target=proof/(build.parent.name+'-build');target.mkdir()
              for path in sorted(build.iterdir()):
                  if path.is_file() and (path.name in ('BUILD.json','day_donor','day_kernel') or path.suffix.lower() in ('.f90','.exe','.dll','.so')):
                      shutil.copyfile(path,target/path.name)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.ordinary_pond && 'ordinary-implicit-pond' || 'secondary-implicit-pond' }}-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
