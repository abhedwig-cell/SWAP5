name: Original analytical free6 and drainage1 Frost model/state/calendar Ubuntu full35 and native state
on:
  push:
    branches: [codex/nomacro-frost-analytical-boundary10]
    paths: ['.github/workflows/nomacro-frost-analytical-boundary10-ubuntu.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nomacro-frost-analytical-boundary10-ubuntu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GFORTRAN_UNBUFFERED_ALL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/**
            /src/**
            /tools/solute/**
            /tools/vq/**
            /tests/nomacro_mixtures/**
            /tests/nomacro_scheduled_subsurface/**
            /tests/nomacro_drainage/**
            /tests/saltfarm_newton/**
            /.github/workflows/**
            /reference/swap-4.3.1/projects/**
            /reference/swap-4.3.1/source-archives/**
            /reference/swap-4.3.1/patches/**
            /reference/swap-4.3.1/frost-corrections/**
            /reference/swap-4.3.1/hydraulic-corrections/**
            /integration/f-ci/nomacro-complete01/*.json
      - name: Preserve real source and prepare original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          proof="$RUNNER_TEMP/proof"
          mkdir -p "$proof"
          git fetch --no-tags --depth=64 --filter=blob:none origin "$GITHUB_SHA"
          python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$proof/source"
          python3 -B tests/nomacro_drainage/controller_source_capsule.py --output "$proof/controller-source.tar"
          cp .github/workflows/nomacro-frost-analytical-boundary10-ubuntu.yml "$proof/actual-workflow.yml"
          git rev-parse HEAD:.github/workflows/nomacro-frost-analytical-boundary10-ubuntu.yml > "$proof/actual-workflow-git-blob.txt"
          cp integration/f-ci/nomacro-complete01/FROST_ANALYTICAL_BOUNDARY10_INPUT_CONTRACT_PROPOSED_V1.json "$proof/actual-input-contract.json"
          python3 -B tests/nomacro_drainage/frost_analytical_boundary_input_contract.py --output "$proof/public-input-contract"
          python3 -B -c 'import os,user_prepare; user_prepare.prepare(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Run selected original boundary state/calendar periods and actual compiled controls
        run: |
          python3 -B -c "import subprocess; assert not subprocess.check_output(['git','diff','b24cebc3993b0f350c7aef7fb773a177d00425ce','HEAD','--','app','src','tools','reference'])"
          python3 -B tests/nomacro_drainage/frost_analytical_boundary_unaffected_postimages.py --platform Ubuntu --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds-inherited" --output "$RUNNER_TEMP/proof/current-unaffected-postimages" --optimization '${{ matrix.optimization }}'
          python3 -B tests/nomacro_drainage/frost_analytical_boundary_portable.py --platform Ubuntu --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds" --output "$RUNNER_TEMP/proof/current" --optimization '${{ matrix.optimization }}' --search-cohort --continue-after-refusal
      - name: Preserve every original generated compiled and provider byte
        if: always()
        run: |
          python3 -B - <<'PY'
          import os,shutil,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);proof=root/'proof';proof.mkdir(exist_ok=True)
          provider=root/'provider/PREPARED.json'
          if provider.is_file():shutil.copyfile(provider,proof/'provider-PREPARED.json')
          projection={}
          for source,stem in ((root/'builds','compiled'),(root/'builds-inherited','compiled-inherited'),(root/'provider/build','original-provider-build')):
              for path in sorted(source.rglob('*')):
                  if not path.is_file():continue
                  target=proof/stem/path.relative_to(source);target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(path,target)
                  if path.name=='BUILD.json':projection[str(path.parent)]=dict(archive_prefix=target.parent.relative_to(proof).as_posix(),actual_BUILD_sha256=hashlib.sha256(path.read_bytes()).hexdigest())
          (proof/'COMPILED_PROJECTION_V1.json').write_text(json.dumps(projection,indent=2)+'\n')
          PY
      - name: Preserve raw inputs native source controls and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frost-analytical-boundary10-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
