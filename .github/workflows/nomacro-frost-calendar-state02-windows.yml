name: Remaining Windows Frost calendar and daily conservation
on:
  push:
    branches: [codex/nomacro-frost-calendar-state02]
    paths: ['.github/workflows/nomacro-frost-calendar-state02-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nomacro-frost-calendar-state02-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Keep actual source text spelling
        run: git config --global core.autocrlf input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc-fortran
      - name: Expose actual UCRT compiler and runtime
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/**
            /src/**
            /tools/solute/**
            /tools/vq/**
            /tests/nomacro_mixtures/**
            /tests/nomacro_scheduled_subsurface/**
            /tests/nomacro_drainage/**
            /tests/saltfarm_newton/**
            /.github/workflows/**
            /reference/swap-4.3.1/projects/**
            /reference/swap-4.3.1/source-archives/**
            /reference/swap-4.3.1/patches/**
            /reference/swap-4.3.1/frost-corrections/**
            /reference/swap-4.3.1/hydraulic-corrections/**
            /integration/f-ci/nomacro-complete01/*.json
      - name: Preserve real source and prepare original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          proof="$RUNNER_TEMP/proof"
          mkdir -p "$proof"
          git fetch --no-tags --depth=64 --filter=blob:none origin "$GITHUB_SHA"
          git fetch --no-tags --depth=1 --filter=blob:none origin 8dbe3db7c7832dd6a1f86c4275cd43f054552df3
          python -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$proof/source"
          python -B tests/nomacro_drainage/controller_source_capsule.py --output "$proof/controller-source.tar"
          cp .github/workflows/nomacro-frost-calendar-state02-windows.yml "$proof/actual-workflow.yml"
          git rev-parse HEAD:.github/workflows/nomacro-frost-calendar-state02-windows.yml > "$proof/actual-workflow-git-blob.txt"
          python -B -c 'import os,user_prepare; user_prepare.prepare(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Validate actual daily provider and run selected calendar controls
        run: |
          extra=()
          if [ '${{ matrix.optimization }}' = 'O0' ]; then extra+=(--exclude-case water-explicit-regular-noreset-year-hys1-initial2); fi
          python -B tests/nomacro_drainage/frost_calendar_state_portable.py --platform Windows --exclude-case water-explicit-monthly-hys0-initial1 --exclude-case cde-implicit-regular-year-hys1-initial2 "${extra[@]}" --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds" --output "$RUNNER_TEMP/proof/current" --optimization '${{ matrix.optimization }}'
      - name: Preserve every original generated compiled and provider byte
        if: always()
        run: |
          python -B - <<'PY'
          import os,shutil,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);proof=root/'proof';proof.mkdir(exist_ok=True)
          provider=root/'provider/PREPARED.json'
          if provider.is_file():shutil.copyfile(provider,proof/'provider-PREPARED.json')
          projection={}
          for source,stem in ((root/'builds','compiled'),(root/'provider/build','original-provider-build')):
              for path in sorted(source.rglob('*')):
                  if not path.is_file():continue
                  target=proof/stem/path.relative_to(source);target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(path,target)
                  if path.name=='BUILD.json':projection[str(path.parent)]=dict(archive_prefix=target.parent.relative_to(proof).as_posix(),actual_BUILD_sha256=hashlib.sha256(path.read_bytes()).hexdigest())
          (proof/'COMPILED_PROJECTION_V1.json').write_text(json.dumps(projection,indent=2)+'\n')
          PY
      - name: Preserve raw inputs native source controls and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frost-calendar-state02-windows-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
