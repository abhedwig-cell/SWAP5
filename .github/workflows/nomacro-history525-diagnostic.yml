name: Current complete crop interface and shaped root state discriminator
on:
  push:
    branches: [codex/nomacro-coverage10]
    paths: ['.github/workflows/nomacro-history525-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/solute
      - uses: actions/checkout@v4
        with:
          ref: 33770602914210e11b50d6bede94838bb4274958
          path: pinned
          sparse-checkout: |
            app
            src
            tools/solute
            reference/swap-4.3.1/projects
      - uses: actions/download-artifact@v4
        with:
          name: nomacro-history-water-history-33770602914210e11b50d6bede94838bb4274958
          run-id: 43836309698
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Reproduce complete original component state at current524-to525
        run: python3 -B tools/solute/probe_current_history525.py --source-root "$GITHUB_WORKSPACE/pinned" --prior "$RUNNER_TEMP/prior" --output "$RUNNER_TEMP/proof" --variables-snapshots --reconnect-wofost-interface
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-history525-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
