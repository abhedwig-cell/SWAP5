name: Original implicit Snow water and CDE composition qualification
on:
  push:
    branches: [codex/nomacro-implicit-snow-composition01]
    paths: ['.github/workflows/nomacro-implicit-snow.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nomacro-implicit-snow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_mixtures
            tests/nomacro_scheduled_subsurface
            tests/nomacro_drainage
            tests/saltfarm_newton
            .github/workflows
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
            reference/swap-4.3.1/patches
      - name: Preserve actual source and prepare immutable original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$RUNNER_TEMP/proof/source"
          python3 -B tests/nomacro_drainage/controller_source_capsule.py --output "$RUNNER_TEMP/proof/controller-source.tar"
          cp .github/workflows/nomacro-implicit-snow.yml "$RUNNER_TEMP/proof/actual-workflow.yml"
          git rev-parse HEAD:.github/workflows/nomacro-implicit-snow.yml > "$RUNNER_TEMP/proof/actual-workflow-git-blob.txt"
          python3 -B -c 'import os,user_prepare; user_prepare.prepare(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Qualify coherent original implicit Snow coupling
        run: |
          python3 -B tests/nomacro_drainage/implicit_snow_portable.py --optimization ${{ matrix.optimization }} --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds" --scratch "$RUNNER_TEMP/source-refusals" --output "$RUNNER_TEMP/proof/implicit-snow"
      - name: Preserve actual compiled bytes and original provider identity
        if: always()
        shell: python
        run: |
          import os,shutil,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);proof=root/'proof';proof.mkdir(exist_ok=True)
          provider=root/'provider/PREPARED.json'
          if provider.is_file():shutil.copyfile(provider,proof/'provider-PREPARED.json')
          projection={}
          for manifest in sorted((root/'builds').rglob('BUILD.json')):
              build=manifest.parent;target=proof/'compiled'/build.relative_to(root/'builds');target.mkdir(parents=True)
              for path in sorted(build.iterdir()):
                  if path.is_file() and (path.name in ('BUILD.json','day_donor','day_kernel') or path.suffix.lower() in ('.f90','.exe','.dll','.so')):
                      shutil.copyfile(path,target/path.name)
              projection[str(build)]=dict(archive_prefix=target.relative_to(proof).as_posix(),actual_BUILD_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest())
          (proof/'COMPILED_PROJECTION_V1.json').write_text(json.dumps(projection,indent=2)+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implicit-snow-composition-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
