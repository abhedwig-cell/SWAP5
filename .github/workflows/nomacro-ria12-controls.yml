name: Original RIA12 remaining native controls
on:
  push:
    branches: [codex/nomacro-ria12-native01]
    paths: ['.github/workflows/nomacro-ria12-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nomacro-ria12-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/**
            /src/**
            /tools/solute/**
            /tools/vq/**
            /tests/nomacro_mixtures/**
            /tests/nomacro_scheduled_subsurface/**
            /tests/nomacro_drainage/**
            /tests/saltfarm_newton/**
            /.github/workflows/**
            /reference/swap-4.3.1/projects/**
            /reference/swap-4.3.1/source-archives/**
            /reference/swap-4.3.1/patches/**
            /reference/swap-4.3.1/frost-corrections/**
            /reference/swap-4.3.1/hydraulic-corrections/**
            /integration/f-ci/nomacro-complete01/INITIAL_PROFILE_GROUNDWATER_CONTRACT_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_NATIVE_DOMAIN_CONTRACT_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_INPUTS_V1.zip
            /integration/f-ci/nomacro-complete01/RIA12_INPUTS_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_UBUNTU_O0_ORIGINAL_V1.zip
            /integration/f-ci/nomacro-complete01/RIA12_UBUNTU_O0_ORIGINAL_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_UBUNTU_O2_ORIGINAL_V1.zip
            /integration/f-ci/nomacro-complete01/RIA12_UBUNTU_O2_ORIGINAL_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_NATIVE_CONTROL_ORIGINS_V1.zip
            /integration/f-ci/nomacro-complete01/RIA12_NATIVE_CONTROL_ORIGINS_V1.json
      - name: Restore genuine finished35 periods and provider at original paths
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin 26497facb174d26af47821171314df05263ff976 1438907b876f91605b0c41af24c73377bab7c7e3 0157d2995e85adce362642918095e871469e4ee1 04dc6b1cf3ddb4570c33b13ae20be746c8bcde54 2a14f2094bfbfb29c169eb6331da1d7829faa70a 262e9cbc3d44244d0e8ca720e0c7147228be3b98 b79a5bc64ec5806252c016185e925d424d65b66b 8e27dd9eb0f633050d2d82d00d28992435c313cb a2039fa529adb74bec571f493bc4c541dddf2a9a dcf509f80e77866b24ca06a021df3e3e53fd3ec0 57bd7fecbbb6c3944b4f28cfc29cb368d371398a 7979888d70950b27c2fc30c92320ff5bb62d9a53 f3fc5705f09e93ab0aa57eceee78bbcfd2014517 d905cad376b42e709c3bf7949dbc8faebf119f24 4d4fb1b8e059f9137ec217e52f262222ead6ce1c 8ae1661391ed35125421290de3fb5d95ec8cd5b5 c0952e394647179d591a855fcaf1a7270871fb2b 99c4d7ca481f703937ed32e63b4af5bf847c3b85 84e815a0ba9f59a2d56fe838a3b13361ad8670a2 4a4053c210ce5bdd8cb2506b79dcf9ad8b42a43f 9694eb2c4cc69f71c2ef90bc64b500fd35cb9924 b285147254b208643423adea88a4fb5f1158b464 e079d1554041c831cd0ab609835e2e79bf3c31a1 9c9e35ca34c5831505425ed7546f58c311ecb8c0 02813169713f103b846ab95657e5c5f830bc77d4 2a42311e6e5eed9a6a2a45cc9f4697a4b4eed584 67d2636672921505ecb47f1c9f4c6ea27a451889 04dadca2bf52027ef9c72360684c86bd98aa77ff 342c5dd92861f67fa90b094f1a63c5a6b53b9c4e 310abf1c99b028a977b0282b6f72ae6181b2cf8f 7283cbba514f5fa2d82d3adde7551d63bff74a26
          python3 -B tests/nomacro_drainage/ria12_reuse_ubuntu.py --runner-root "$RUNNER_TEMP" --optimization '${{ matrix.optimization }}' --output "$RUNNER_TEMP/proof/supplement/RESTORATION.json"
      - name: Preserve current observer and verify restored original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          proof="$RUNNER_TEMP/proof/supplement"
          python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$proof/source"
          python3 -B tests/nomacro_drainage/controller_source_capsule.py --output "$proof/controller-source.tar"
          cp .github/workflows/nomacro-ria12-controls.yml "$proof/actual-workflow.yml"
          git rev-parse HEAD:.github/workflows/nomacro-ria12-controls.yml > "$proof/actual-workflow-git-blob.txt"
          python3 -B -c 'import os,user_prepare; user_prepare.validate(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Check only malformed native and external transactions
        run: |
          for kind in water cde; do
            other=water
            if [ "$kind" = water ]; then other=cde; fi
            python3 -B tests/nomacro_drainage/ria12_controls.py --profile "$RUNNER_TEMP/proof/current/$kind" --reference-work "$RUNNER_TEMP/provider" --model1-origin "$RUNNER_TEMP/origins/model1/accepted-column-1-day-1.zip" --legacy-ria-origin "$RUNNER_TEMP/origins/legacy-ria/accepted-column-1-day-1.zip" --other-kind-origin "$RUNNER_TEMP/proof/current/$other/trajectory/accepted-column-1-day-2.zip" --output "$RUNNER_TEMP/proof/supplement/$kind-native-controls"
            python3 -B tests/nomacro_drainage/ria12_transactions.py --profile "$RUNNER_TEMP/proof/current/$kind" --reference-work "$RUNNER_TEMP/provider" --output "$RUNNER_TEMP/proof/supplement/$kind-transactions"
          done
      - name: Preserve original control raw and failures without full35 copies
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ria12-controls-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof/supplement
          retention-days: 30
