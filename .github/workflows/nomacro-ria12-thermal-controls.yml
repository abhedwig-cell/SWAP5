name: Original RIA12 thermal remaining controls without full replay
on:
  push:
    branches: [codex/nomacro-ria12-thermal-snow01]
    paths: ['.github/workflows/nomacro-ria12-thermal-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nomacro-ria12-thermal-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/**
            /src/**
            /tools/solute/**
            /tools/vq/**
            /tests/nomacro_mixtures/**
            /tests/nomacro_scheduled_subsurface/**
            /tests/nomacro_drainage/**
            /tests/saltfarm_newton/**
            /.github/workflows/**
            /reference/swap-4.3.1/projects/**
            /reference/swap-4.3.1/source-archives/**
            /reference/swap-4.3.1/patches/**
            /reference/swap-4.3.1/frost-corrections/**
            /reference/swap-4.3.1/hydraulic-corrections/**
            /integration/f-ci/nomacro-complete01/INITIAL_PROFILE_GROUNDWATER_CONTRACT_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_THERMAL_SNOW_DOMAIN_CONTRACT_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_THERMAL_SNOW_INPUTS_V1.zip
            /integration/f-ci/nomacro-complete01/RIA12_THERMAL_SNOW_INPUTS_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_THERMAL_UBUNTU_O0_ORIGINAL_V1.zip
            /integration/f-ci/nomacro-complete01/RIA12_THERMAL_UBUNTU_O0_ORIGINAL_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_THERMAL_UBUNTU_O2_ORIGINAL_V1.zip
            /integration/f-ci/nomacro-complete01/RIA12_THERMAL_UBUNTU_O2_ORIGINAL_V1.json
            /integration/f-ci/nomacro-complete01/RIA12_NATIVE_CONTROL_ORIGINS_V1.zip
            /integration/f-ci/nomacro-complete01/RIA12_NATIVE_CONTROL_ORIGINS_V1.json
      - name: Restore genuine finished35 periods and provider at original paths
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin 8e8f2a4c7ff28e4e4845c4b5554894a4bc3c5af1 0ef37c9d733cea90274a0b9a051e72228670a38b
          python3 -B tests/nomacro_drainage/ria12_thermal_reuse_ubuntu.py --runner-root "$RUNNER_TEMP" --optimization '${{ matrix.optimization }}' --output "$RUNNER_TEMP/proof/supplement/RESTORATION.json"
      - name: Preserve current observer and verify restored original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          proof="$RUNNER_TEMP/proof/supplement"
          python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$proof/source"
          python3 -B tests/nomacro_drainage/controller_source_capsule.py --output "$proof/controller-source.tar"
          cp .github/workflows/nomacro-ria12-thermal-controls.yml "$proof/actual-workflow.yml"
          git rev-parse HEAD:.github/workflows/nomacro-ria12-thermal-controls.yml > "$proof/actual-workflow-git-blob.txt"
          python3 -B -c 'import os,user_prepare; user_prepare.validate(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Check only malformed native and external transactions
        run: |
          python3 -B tests/nomacro_drainage/ria12_thermal_supplement.py --runner-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/proof/supplement"
      - name: Preserve original control raw and failures without full35 copies
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ria12-thermal-controls-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof/supplement
          retention-days: 30
