name: Focused original surface solute discriminator
on:
  push:
    branches: [codex/nomacro-coverage06]
    paths: ['.github/workflows/nomacro-surface-solute-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            reference/swap-4.3.1/projects
      - uses: actions/download-artifact@v4
        with:
          name: nomacro-surface-6c79235cfdd7bd6254e9c8ec3cd900fb4fe67eee
          run-id: 43583516947
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Reproduce refused native day and distinguish independent solute time floor
        run: python3 -B tools/solute/probe_surface_solute_substep.py --prior "$RUNNER_TEMP/prior" --output "$RUNNER_TEMP/diagnostic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-solute-discriminator-${{ github.sha }}
          path: ${{ runner.temp }}/diagnostic
          retention-days: 30
