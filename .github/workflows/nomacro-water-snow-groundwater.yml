name: Targeted original pressure and conserved AGE state composition
on:
  push:
    branches: [codex/nomacro-initial-profile-age01]
    paths: ['.github/workflows/nomacro-water-snow-groundwater.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nomacro-initial-profile-age-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/**
            /src/**
            /tools/solute/**
            /tools/vq/**
            /tests/nomacro_mixtures/**
            /tests/nomacro_scheduled_subsurface/**
            /tests/nomacro_drainage/**
            /tests/saltfarm_newton/**
            /.github/workflows/**
            /reference/swap-4.3.1/projects/**
            /reference/swap-4.3.1/source-archives/**
            /reference/swap-4.3.1/patches/**
            /reference/swap-4.3.1/frost-corrections/**
            /reference/swap-4.3.1/hydraulic-corrections/**
            /integration/f-ci/nomacro-complete01/INITIAL_PROFILE_AGE_CONTRACT_V2.json
      - name: Preserve actual source and prepare immutable original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          proof="$RUNNER_TEMP/proof"
          mkdir -p "$proof"
          git fetch --no-tags --depth=1 --filter=blob:none origin 06e980f4bb17e43e4cc61cf4fc2d6ea17204526d 9694eb2c4cc69f71c2ef90bc64b500fd35cb9924 b285147254b208643423adea88a4fb5f1158b464 e079d1554041c831cd0ab609835e2e79bf3c31a1
          python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$proof/source"
          python3 -B tests/nomacro_drainage/controller_source_capsule.py --output "$proof/controller-source.tar"
          cp .github/workflows/nomacro-water-snow-groundwater.yml "$proof/actual-workflow.yml"
          git rev-parse HEAD:.github/workflows/nomacro-water-snow-groundwater.yml > "$proof/actual-workflow-git-blob.txt"
          python3 -B -c 'import os,user_prepare; user_prepare.prepare(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Target only original pressure AGE output and conductivity seams
        run: |
          opt='${{ matrix.optimization }}'
          for case in monthly-subsurface dense-mean6-plain; do
            label="initial-profile-age-$case-$opt-short"
            python3 -B tests/nomacro_drainage/initial_profile_age_inputs.py --case "$case" --initial 1 --output "$RUNNER_TEMP/proof/inputs/$case-initial1"
            python3 -B tests/nomacro_drainage/initial_profile_age_runtime.py --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds/$label" --output "$RUNNER_TEMP/proof/$label" --optimization "$opt" --input "$RUNNER_TEMP/proof/inputs/$case-initial1" --case "$case"
            python3 -B tests/nomacro_drainage/initial_profile_age_science.py --reference-work "$RUNNER_TEMP/provider" --profile "$RUNNER_TEMP/proof/$label" --output "$RUNNER_TEMP/proof/$label-INDEPENDENT.json"
            python3 -B tests/nomacro_drainage/initial_profile_age_inputs.py --case "$case" --initial 2 --output "$RUNNER_TEMP/proof/inputs/$case-initial2"
            python3 -B tests/nomacro_drainage/initial_profile_age_postimage.py --reference-work "$RUNNER_TEMP/provider" --profile "$RUNNER_TEMP/proof/$label" --input "$RUNNER_TEMP/proof/inputs/$case-initial2" --build-root "$RUNNER_TEMP/builds/$label-initial2-postimage" --output "$RUNNER_TEMP/proof/$label-initial2-postimage"
          done
      - name: Preserve actual compiled bytes and original provider identity
        if: always()
        run: |
          python3 -B - <<'PY'
          import os,shutil,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);proof=root/'proof';proof.mkdir(exist_ok=True)
          provider=root/'provider/PREPARED.json'
          if provider.is_file():shutil.copyfile(provider,proof/'provider-PREPARED.json')
          meteo=root/'provider/build/swap-selected/MOD_meteo.f90'
          if meteo.is_file():shutil.copyfile(meteo,proof/'provider-MOD_meteo.f90')
          projection={}
          for stem in ('builds',):
              for path in sorted((root/stem).rglob('*')):
                  if path.is_file():
                      target=proof/'compiled'/stem/path.relative_to(root/stem);target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(path,target)
                      if path.name=='BUILD.json':
                          projection[str(path.parent)]=dict(archive_prefix=target.parent.relative_to(proof).as_posix(),actual_BUILD_sha256=hashlib.sha256(path.read_bytes()).hexdigest())
          # Preserve actual provider link dependencies and every scientific
          # descriptor mutant before the disposable runner disappears.
          for source, stem in ((root/'provider/build','original-provider-build'),
                               (root/'source-refusals','source-refusals')):
              for path in sorted(source.rglob('*')):
                  if not path.is_file():continue
                  if stem=='source-refusals' and not any(part.startswith('input-') for part in path.relative_to(source).parts):continue
                  target=proof/stem/path.relative_to(source);target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(path,target)
          (proof/'COMPILED_PROJECTION_V1.json').write_text(json.dumps(projection,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-profile-age-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
