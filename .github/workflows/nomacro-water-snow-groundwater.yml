name: Original per-layer vapor hydraulic family qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nomacro-vapor-hydraulic-family-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        optimization: [O0, O2]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            tests/nomacro_mixtures
            tests/nomacro_scheduled_subsurface
            tests/nomacro_drainage
            tests/saltfarm_newton
            .github/workflows
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
            reference/swap-4.3.1/patches
            reference/swap-4.3.1/frost-corrections
            reference/swap-4.3.1/hydraulic-corrections
      - name: Preserve actual source and prepare immutable original provider
        env:
          PYTHONPATH: app/hybrid_water
        run: |
          proof="$RUNNER_TEMP/proof"
          mkdir -p "$proof"
          python3 -B tests/nomacro_scheduled_subsurface/implicit_conductivity_source_capsule.py --output "$proof/source"
          python3 -B tests/nomacro_drainage/controller_source_capsule.py --output "$proof/controller-source.tar"
          cp .github/workflows/nomacro-water-snow-groundwater.yml "$proof/actual-workflow.yml"
          git rev-parse HEAD:.github/workflows/nomacro-water-snow-groundwater.yml > "$proof/actual-workflow-git-blob.txt"
          python3 -B -c 'import os,user_prepare; user_prepare.prepare(os.environ["RUNNER_TEMP"]+"/provider")'
      - name: Read permanently preserved original initial periods
        run: |
          previous="$RUNNER_TEMP/vapor-initial-central-archive"
          mkdir -p "$previous"
          stem='HYDRAULIC_VAPOR_UBUNTU_INITIAL_${{ matrix.optimization }}_RAW_V1'
          git show "HEAD:integration/f-ci/nomacro-complete01/$stem.json" > "$previous/$stem.json"
          git show "HEAD:integration/f-ci/nomacro-complete01/$stem.zip" > "$previous/$stem.zip"
      - name: Qualify original vapor with coupled water CDE and complete lookup native contexts
        run: |
          python3 -B tests/nomacro_drainage/vapor_hydraulic_portable.py --reference-work "$RUNNER_TEMP/provider" --build-root "$RUNNER_TEMP/builds" --output "$RUNNER_TEMP/proof/vapor-hydraulic-family" --optimization '${{ matrix.optimization }}' --reuse-initial-archive "$RUNNER_TEMP/vapor-initial-central-archive"
      - name: Preserve actual compiled bytes and original provider identity
        if: always()
        run: |
          python3 -B - <<'PY'
          import os,shutil,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);proof=root/'proof';proof.mkdir(exist_ok=True)
          provider=root/'provider/PREPARED.json'
          if provider.is_file():shutil.copyfile(provider,proof/'provider-PREPARED.json')
          meteo=root/'provider/build/swap-selected/MOD_meteo.f90'
          if meteo.is_file():shutil.copyfile(meteo,proof/'provider-MOD_meteo.f90')
          projection={}
          for stem in ('builds','builds-current'):
              for path in sorted((root/stem).rglob('*')):
                  if path.is_file() and (path.name in ('BUILD.json','day_donor','day_kernel') or path.suffix.lower() in ('.f90','.exe','.dll','.so')):
                      target=proof/'compiled'/stem/path.relative_to(root/stem);target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(path,target)
                      if path.name=='BUILD.json':
                          projection[str(path.parent)]=dict(archive_prefix=target.parent.relative_to(proof).as_posix(),actual_BUILD_sha256=hashlib.sha256(path.read_bytes()).hexdigest())
          # Preserve actual provider link dependencies and every scientific
          # descriptor mutant before the disposable runner disappears.
          for source, stem in ((root/'provider/build','original-provider-build'),
                               (root/'source-refusals','source-refusals')):
              for path in sorted(source.rglob('*')):
                  if not path.is_file():continue
                  if stem=='source-refusals' and not any(part.startswith('input-') for part in path.relative_to(source).parts):continue
                  target=proof/stem/path.relative_to(source);target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(path,target)
          (proof/'COMPILED_PROJECTION_V1.json').write_text(json.dumps(projection,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vapor-hydraulic-family-${{ matrix.optimization }}-${{ github.sha }}
          path: ${{ runner.temp }}/proof
          retention-days: 30
