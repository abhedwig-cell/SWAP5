name: NUM-UNC P0A spatial control

on:
  pull_request:
    paths:
      - 'integration/num-unc/**'
      - 'tests/num_unc/**'
      - '.github/workflows/num-unc-p0a-spatial.yml'
  workflow_dispatch:

jobs:
  p0a-spatial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/num-unc-p0
      - name: Run N0-only P0A spatial-control gate
        run: bash tests/num_unc/run_num_unc_p0a_spatial_control.sh
