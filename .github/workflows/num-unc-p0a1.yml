name: NUM-UNC P0A1 inference test

on:
  pull_request:
    paths:
      - 'integration/num-unc/**'
      - 'tests/num_unc/**'
      - '.github/workflows/num-unc-p0a1.yml'
  workflow_dispatch:

jobs:
  p0a1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/num-unc-p0
      - name: Run preregistered A1 N0-N1 comparison
        run: bash tests/num_unc/run_num_unc_p0a1_stress_inference.sh
