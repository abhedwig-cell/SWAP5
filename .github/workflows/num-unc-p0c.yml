name: NUM-UNC P0C surface locator

on:
  pull_request:
    paths:
      - 'integration/num-unc/**'
      - 'tests/num_unc/**'
      - '.github/workflows/num-unc-p0c.yml'
  workflow_dispatch:

jobs:
  p0c-locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/num-unc-p0
      - name: Run N0-only P0C locator
        run: bash tests/num_unc/run_num_unc_p0c_surface_locator.sh
