name: Performance measurement tools

on:
  push:
    branches:
      - main
    paths:
      - 'tools/performance/**'
      - 'tests/test_mp_*.py'
      - 'benchmarks/performance/**'
      - '.github/workflows/performance-tools.yml'
  pull_request:
    paths:
      - 'tools/performance/**'
      - 'tests/test_mp_*.py'
      - 'benchmarks/performance/**'
      - '.github/workflows/performance-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile measurement tools
        run: python -m py_compile tools/performance/mp_measure.py tools/performance/mp_b0_shadow.py tools/performance/mp_workloads.py tools/performance/mp_repeatability.py

      - name: Validate workload catalog
        run: python tools/performance/mp_workloads.py benchmarks/performance/workload-catalog.json --summary

      - name: Validate repeatability evidence
        run: |
          python tools/performance/mp_repeatability.py \
            benchmarks/performance/evidence/mp-b01-shadow-repeatability.samples.jsonl \
            --baseline off --measured on > /tmp/mp-repeatability-summary.json
          cmp /tmp/mp-repeatability-summary.json \
            benchmarks/performance/evidence/mp-b01-shadow-repeatability.summary.json

      - name: Run measurement tests
        run: python -m unittest discover -s tests -p 'test_mp_*.py' -v
