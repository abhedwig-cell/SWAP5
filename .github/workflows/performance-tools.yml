name: Performance measurement tools

on:
  push:
    branches:
      - main
    paths:
      - 'tools/performance/**'
      - 'tests/test_mp_*.py'
      - 'benchmarks/performance/**'
      - '.github/workflows/performance-tools.yml'
  pull_request:
    paths:
      - 'tools/performance/**'
      - 'tests/test_mp_*.py'
      - 'benchmarks/performance/**'
      - '.github/workflows/performance-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile measurement tools
        run: >-
          python -m py_compile
          tools/performance/mp_measure.py
          tools/performance/mp_b0_shadow.py
          tools/performance/mp_workloads.py
          tools/performance/mp_repeatability.py
          tools/performance/mp_cpu_baseline.py
          tools/performance/mp_cpu_runner.py
          tools/performance/mp_cpu_pairs.py
          tools/performance/mp_host_admission.py

      - name: Validate workload catalog
        run: python tools/performance/mp_workloads.py benchmarks/performance/workload-catalog.json --summary

      - name: Validate repeatability evidence
        run: |
          python tools/performance/mp_repeatability.py \
            benchmarks/performance/evidence/mp-b01-shadow-repeatability.samples.jsonl \
            --baseline off --measured on > /tmp/mp-repeatability-summary.json
          cmp /tmp/mp-repeatability-summary.json \
            benchmarks/performance/evidence/mp-b01-shadow-repeatability.summary.json

      - name: Validate controlled CPU plan
        run: >-
          python -m tools.performance.mp_cpu_baseline validate-plan
          benchmarks/performance/cpu-baseline-protocol.json

      - name: Validate controlled CPU evidence
        run: |
          python -m tools.performance.mp_cpu_pairs \
            benchmarks/performance/evidence/mp-b01-controlled-cpu.pairs.json \
            --target-resolution 0.01 --multiplier 2 \
            > /tmp/mp-cpu-summary.json
          cmp /tmp/mp-cpu-summary.json \
            benchmarks/performance/evidence/mp-b01-controlled-cpu.summary.json

      - name: Validate host-admission evidence
        run: |
          python -m tools.performance.mp_host_admission \
            benchmarks/performance/evidence/mp-b01-host-admission.evidence.json \
            > /tmp/mp-host-admission-summary.json
          cmp /tmp/mp-host-admission-summary.json \
            benchmarks/performance/evidence/mp-b01-host-admission.summary.json

      - name: Run measurement tests
        run: python -m unittest discover -s tests -p 'test_mp_*.py' -v
