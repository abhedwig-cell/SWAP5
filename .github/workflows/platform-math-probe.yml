name: Bounded private platform math discriminator
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: platform-math-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            src
            tools/solute
            tools/vq
            reference/swap-4.3.1/projects
            reference/swap-4.3.1/source-archives
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: fortran-lang/setup-fortran@v1
        if: runner.os == 'Windows'
        with:
          compiler: gcc
          version: '15'
      - name: Exact source
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Foreign source' }
          gfortran --version
      - name: Identical math arguments and five-day native model
        shell: pwsh
        run: python -B tools/solute/run_platform_math_probe.py --output "$env:RUNNER_TEMP/platform-math" --days 5 --no-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-math-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/platform-math/EVENTS.json
            ${{ runner.temp }}/platform-math/RESULT.json
            ${{ runner.temp }}/platform-math/MATH_RUNTIME.json
            ${{ runner.temp }}/platform-math/COMPILER_CALLS.jsonl
            ${{ runner.temp }}/platform-math/*.log
            ${{ runner.temp }}/platform-math/observer
            ${{ runner.temp }}/platform-math/probe
            ${{ runner.temp }}/platform-math/bundle/BUILD.json
            ${{ runner.temp }}/platform-math/provider/PREPARED.json
          retention-days: 14
