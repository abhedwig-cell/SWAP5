name: PPA-LOW01 B1.11 HeadCalc GWL regime oracle

on:
  push:
    paths:
      - '.github/workflows/ppa-low01-gwl-regime.yml'
      - 'src/adapter/mod_ppa_low01_gwl_regime.f90'
      - 'tests/fapp/test_ppa_low01_gwl_regime.f90'
      - 'tests/fapp/run_ppa_low01_gwl_regime.sh'
  pull_request:
    paths:
      - '.github/workflows/ppa-low01-gwl-regime.yml'
      - 'src/adapter/mod_ppa_low01_gwl_regime.f90'
      - 'tests/fapp/test_ppa_low01_gwl_regime.f90'
      - 'tests/fapp/run_ppa_low01_gwl_regime.sh'

jobs:
  headcalc-gwl-regime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13
      - name: Compile and replay source-regime selector
        run: bash tests/fapp/run_ppa_low01_gwl_regime.sh
