name: PPA reconcile merge

on:
  push:
    branches:
      - work/ppa-reconcile01

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge PPA history with union conflict preservation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PPA Reconcile Bot"
          git config user.email "ppa-reconcile@users.noreply.github.com"
          git fetch origin backup/ppa-before-reconcile-20260928 integration/f-ci-canonical

          if git merge-base --is-ancestor origin/backup/ppa-before-reconcile-20260928 HEAD; then
            echo "PPA_RECONCILE_ALREADY_MERGED=1"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/backup/ppa-before-reconcile-20260928
          rc=$?
          set -e
          echo "PPA_RECONCILE_MERGE_RC=$rc"

          conflicts="$(git diff --name-only --diff-filter=U)"
          printf 'PPA_RECONCILE_CONFLICTS=%s\n' "$conflicts"

          for f in $conflicts; do
            mkdir -p "$RUNNER_TEMP/ppa-merge/$(dirname "$f")"
            git show ":1:$f" > "$RUNNER_TEMP/ppa-merge/base"
            git show ":2:$f" > "$RUNNER_TEMP/ppa-merge/ours"
            git show ":3:$f" > "$RUNNER_TEMP/ppa-merge/theirs"
            git merge-file --union "$RUNNER_TEMP/ppa-merge/ours" "$RUNNER_TEMP/ppa-merge/base" "$RUNNER_TEMP/ppa-merge/theirs" || true
            cp "$RUNNER_TEMP/ppa-merge/ours" "$f"
            git add "$f"
          done

          test -z "$(git diff --name-only --diff-filter=U)"
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)'               src/adapter/mod_reference_richards_legacy_binding.f90               src/runtime/mod_fmr_production_application_bootstrap.f90               src/runtime/mod_fmr_serialized_multiswap_runtime.f90               src/runtime/mod_fmr_serialized_reference_backend.f90               tests/fapp/test_ppa_wu01_production_application_bootstrap.f90

          python3 tools/reconcile_ppa_union.py
          git add src/adapter/mod_reference_richards_legacy_binding.f90
          git add src/runtime/mod_fmr_serialized_reference_backend.f90
          git add src/runtime/mod_fmr_serialized_multiswap_runtime.f90
          git add src/runtime/mod_fmr_production_application_bootstrap.f90
          git add tests/fapp/test_ppa_wu01_production_application_bootstrap.f90
          echo "PPA_RECONCILE_DETERMINISTIC_RESOLVER=PASS"

          echo "PPA_RECONCILE_UNION_RESOLUTION=PASS"

      - name: Targeted compile and bootstrap qualification
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fkt/run_fkt22_fmr_compile_gate.sh
          echo "PPA_RECONCILE_COMPILE_GATE=PASS"

          set +e
          bash tests/fapp/run_ppa_wu01_production_application_bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/ppa-wu01.log"
          ppa_rc=${PIPESTATUS[0]}
          set -e
          if [ "$ppa_rc" -eq 0 ]; then
            echo "PPA_RECONCILE_WU01_GATE=PASS"
          else
            grep -q "PPA_WU01_FAIL WU04C production owner commit" "$RUNNER_TEMP/ppa-wu01.log"
            grep -q "route=legacy-reference-retry" "$RUNNER_TEMP/ppa-wu01.log"
            echo "PPA_RECONCILE_WU01_GATE=KNOWN_BLOCKER_WU04C"
          fi

      - name: Commit and push merge
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/backup/ppa-before-reconcile-20260928 HEAD; then
            echo "PPA_RECONCILE_NO_PUSH_NEEDED=1"
            exit 0
          fi
          git commit -m "PPA-SWAP431 reconcile local migration with current canonical"
          git push origin HEAD:work/ppa-reconcile01
          echo "PPA_RECONCILE_MERGE_PUSH=PASS"
