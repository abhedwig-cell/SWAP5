name: PPA-ROOT-HYD02 prescribed root tangent

on:
  push:
    branches:
      - work/hydro-memory-cap02-prescribed-root-tangent
    paths:
      - 'src/solver/mod_soil_water_accepted_step_direction_contract.f90'
      - 'src/adapter/mod_reference_richards_accepted_step_directional_service.f90'
      - 'src/transaction/mod_accepted_trajectory_directional_sensitivity.f90'
      - 'src/transaction/mod_accepted_trajectory_directional_publication.f90'
      - 'src/runtime/mod_modflow6_swap_predictor_tangent_adapter.f90'
      - 'tests/fapp/test_ppa_root_hyd02_prescribed_root_tangent.f90'
      - 'tests/fapp/run_ppa_root_hyd02_prescribed_root_tangent.sh'
      - '.github/workflows/ppa-root-hyd02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Run prescribed-root tangent qualification
        run: bash tests/fapp/run_ppa_root_hyd02_prescribed_root_tangent.sh
