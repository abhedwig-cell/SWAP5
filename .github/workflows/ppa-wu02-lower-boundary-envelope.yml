name: PPA-WU02 lower-boundary prescribed-qbot admission

on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_production_application_bootstrap.f90'
      - 'tests/fapp/test_ppa_wu02_prescribed_qbot_application_admission.f90'
      - 'tests/fapp/run_ppa_wu02_prescribed_qbot_application_admission.sh'
      - 'tests/fvq/run_ppa_wu02_prescribed_qbot_application_independent.sh'
      - 'integration/audits/PPA_WU02_*.json'
      - 'docs/audits/PPA_WU02_*.md'
      - '.github/workflows/ppa-wu02-lower-boundary-envelope.yml'
  workflow_dispatch:

jobs:
  owner-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: PPA-WU02 owner qualification
        run: bash tests/fapp/run_ppa_wu02_prescribed_qbot_application_admission.sh

  independent-qualification:
    needs: owner-qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: PPA-WU02 independent qualification
        run: bash tests/fvq/run_ppa_wu02_prescribed_qbot_application_independent.sh
