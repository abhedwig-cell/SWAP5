name: PPA-WU05 advanced water-process triage

on:
  pull_request:
    paths:
      - 'integration/audits/PPA_WU05_**'
      - 'docs/audits/PPA_WU05_**'
      - 'tests/fvq/validate_ppa_wu05_advanced_water_process_triage.py'
      - '.github/workflows/ppa-wu05-advanced-water-process-triage.yml'
      - 'integration/audits/production_physics_application_envelope_gap_register.json'
  workflow_dispatch:

jobs:
  authority-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PPA-WU05 authority and zero production delta
        run: python3 tests/fvq/validate_ppa_wu05_advanced_water_process_triage.py
