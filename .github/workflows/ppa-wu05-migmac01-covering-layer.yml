name: PPA-WU05-MIGMAC01 covering-layer operator
# Active E2E accepted-head diagnostic ca9e7a92

on:
  push:
    branches:
      - research/ppa-wu05-migmac01-covering-layer
    paths:
      - 'src/process/macropore/mod_macropore_covering_layer_input.f90'
      - 'src/runtime/mod_ppa_wu05a16_inner_macropore_provider.f90'
      - 'src/runtime/mod_macropore_single_column_runtime.f90'
      - 'src/process/macropore/mod_macropore_standard_storage.f90'
      - 'tests/fpm/run_ppa_wu05_perch20_transaction_continuation.sh'
      - 'tests/fpm/test_ppa_wu05_migmac01_covering_layer.f90'
      - 'tests/fpm/run_ppa_wu05_perch20_restart_lifecycle.sh'
      - 'tests/fpm/run_ppa_wu05_migmac01_covering_layer.sh'
      - '.github/workflows/ppa-wu05-migmac01-covering-layer.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify source-faithful covering-layer operator
        run: bash tests/fpm/run_ppa_wu05_migmac01_covering_layer.sh
      - name: Compile composition and preserve PERCH20 transaction semantics
        run: bash tests/fpm/run_ppa_wu05_perch20_transaction_continuation.sh
      - name: Qualify active covered-transfer E2E
        run: bash tests/fpm/run_ppa_wu05_migmac01_active_e2e.sh
      - name: Preserve PERCH20 reject restart lifecycle
        run: bash tests/fpm/run_ppa_wu05_perch20_restart_lifecycle.sh
