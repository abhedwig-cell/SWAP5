name: PPA-WU05-PERCH20 model retry directive

on:
  workflow_dispatch:
  push:
    branches:
      - research/ppa-wu05-perch20-model-retry-directive
    paths:
      - 'src/transaction/mod_transaction_reference.f90'
      - 'tests/fpm/test_ppa_wu05_perch20_model_retry_directive.f90'
      - 'tests/fpm/run_ppa_wu05_perch20_model_retry_directive.sh'
      - '.github/workflows/ppa-wu05-perch20-model-retry.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PERCH20 model retry directive
        run: bash tests/fpm/run_ppa_wu05_perch20_model_retry_directive.sh
      - name: Preserve A23BL transaction gate
        run: bash tests/transaction/run_a23bl_gate.sh
      - name: Preserve transaction attempt context
        run: |
          BUILD="${RUNNER_TEMP}/perch20-context"
          mkdir -p "$BUILD"
          gfortran -std=f2008 -Wall -Wextra -Werror -fcheck=all -O2 -J "$BUILD"             src/transaction/mod_transaction_reference.f90             tests/transaction/test_transaction_attempt_context.f90             -o "$BUILD/test"
          "$BUILD/test"
