name: PPA-WU05-A macropore authority review

on:
  pull_request:
    paths:
      - 'docs/audits/PPA_WU05A_MACROPORE_AUTHORITY.md'
      - 'integration/audits/PPA_WU05A_PREREGISTRATION.json'
      - 'integration/audits/PPA_WU05A_MACROPORE_AUTHORITY_CONTRACT.json'
      - 'integration/audits/PPA_WU05A_STATUS.json'
      - 'integration/audits/production_physics_application_envelope_gap_register.json'
      - 'tests/fvq/validate_ppa_wu05a_macropore_authority.py'
      - '.github/workflows/ppa-wu05a-macropore-authority.yml'
  workflow_dispatch:

jobs:
  authority-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical base
        run: git fetch origin integration/f-ci-canonical
      - name: Validate PPA-WU05-A authority
        run: python3 tests/fvq/validate_ppa_wu05a_macropore_authority.py
