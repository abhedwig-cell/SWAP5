name: PPA-WU05-A10 rapid drainage

on:
  push:
    branches:
      - work/ppa-wu05-a10-fmr-rapid-drainage
    paths:
      - 'src/process/macropore/mod_ppa_wu05a6_rapid_drain_rate.f90'
      - 'src/runtime/mod_macropore_standard_rate_adapter.f90'
      - 'src/runtime/mod_fmr_macropore_configuration.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpm/test_ppa_wu05a10_rapid_source_contract.f90'
      - 'tests/fpm/test_ppa_wu05a10_fmr_rapid_drainage.f90'
      - 'tests/fpm/run_ppa_wu05a10_rapid_drainage.sh'
      - '.github/workflows/ppa-wu05a10-rapid-drainage.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run A10 rapid-drainage qualification
        run: bash tests/fpm/run_ppa_wu05a10_rapid_drainage.sh
