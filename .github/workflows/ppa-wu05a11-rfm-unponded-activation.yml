name: PPA-WU05-A11 RFM unponded activation

on:
  push:
    branches:
      - work/ppa-wu05-a11-rfm-unponded-activation
    paths:
      - 'src/process/macropore/mod_rfm_unponded_activation.f90'
      - 'tests/fpm/test_ppa_wu05a11_rfm_unponded_activation.f90'
      - 'tests/fpm/run_ppa_wu05a11_rfm_unponded_activation.sh'
      - '.github/workflows/ppa-wu05a11-rfm-unponded-activation.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run focused A11 gate
        run: bash tests/fpm/run_ppa_wu05a11_rfm_unponded_activation.sh
