name: PPA-WU05-A12 RFM hydraulic binding

on:
  push:
    branches:
      - work/ppa-wu05-a12-rfm-hydraulic-binding
    paths:
      - 'src/process/macropore/mod_rfm_surface_sorptivity.f90'
      - 'src/runtime/mod_fmr_rfm_activation_binding.f90'
      - 'tests/fpm/test_ppa_wu05a12_rfm_hydraulic_binding.f90'
      - 'tests/fpm/run_ppa_wu05a12_rfm_hydraulic_binding.sh'
      - '.github/workflows/ppa-wu05a12-rfm-hydraulic-binding.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run focused A12 gate
        run: bash tests/fpm/run_ppa_wu05a12_rfm_hydraulic_binding.sh
