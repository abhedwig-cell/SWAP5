name: PPA-WU05-A13 accepted-state seed

on:
  workflow_dispatch:
  push:
    branches:
      - research/ppa-wu05-a13-accepted-state-seed
    paths:
      - 'src/process/macropore/**'
      - 'src/runtime/mod_macropore_single_column_runtime.f90'
      - 'src/runtime/mod_macropore_standard_rate_adapter.f90'
      - 'src/runtime/mod_fmr_macropore_configuration.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpm/test_ppa_wu05a13_accepted_state_seed.f90'
      - 'tests/fpm/run_ppa_wu05a13_accepted_state_seed.sh'
      - '.github/workflows/ppa-wu05a13-accepted-state-seed.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Accepted-state perched seed runtime
        run: bash tests/fpm/run_ppa_wu05a13_accepted_state_seed.sh
      - name: Preserve A11 carrier qualification
        run: bash tests/fpm/run_ppa_wu05a11_perched.sh
      - name: Preserve A7-A10 admitted macropore route
        run: bash tests/fpm/run_ppa_wu05a10_rapid_drain.sh
