name: PPA-WU05-A16 inner callback prototype

on:
  workflow_dispatch:
  push:
    branches:
      - research/ppa-wu05-a16-inner-callback-prototype
    paths:
      - 'src/solver/mod_soil_water_solver_contract.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'tests/fpm/test_ppa_wu05a16_inner_callback.f90'
      - 'tests/fpm/run_ppa_wu05a16_inner_callback.sh'
      - '.github/workflows/ppa-wu05a16-inner-callback.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A16 analytical inner callback
        run: bash tests/fpm/run_ppa_wu05a16_inner_callback.sh
      - name: Preserve A15 derivative
        run: bash tests/fpm/run_ppa_wu05a15_exchange_derivative.sh
      - name: Preserve corrected A11 carrier
        run: bash tests/fpm/run_ppa_wu05a11_perched.sh
      - name: Preserve A7-A10 admitted macropore route
        run: bash tests/fpm/run_ppa_wu05a10_rapid_drain.sh
