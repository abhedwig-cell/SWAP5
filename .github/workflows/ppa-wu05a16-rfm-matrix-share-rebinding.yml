name: PPA-WU05-A16 RFM matrix share rebinding

on:
  push:
    branches:
      - work/ppa-wu05-a16-rfm-matrix-share-rebinding
    paths:
      - 'src/runtime/mod_rfm_matrix_share_dynamic_top_binding.f90'
      - 'tests/fpm/test_ppa_wu05a16_rfm_matrix_share_rebinding.f90'
      - 'tests/fpm/run_ppa_wu05a16_rfm_matrix_share_rebinding.sh'
      - '.github/workflows/ppa-wu05a16-rfm-matrix-share-rebinding.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run focused A16 gate
        run: bash tests/fpm/run_ppa_wu05a16_rfm_matrix_share_rebinding.sh
