name: PPA-WU05-A17 RFM preferential routing

on:
  push:
    branches:
      - work/ppa-wu05-a17-rfm-preferential-routing
    paths:
      - 'src/process/macropore/mod_rfm_preferential_router.f90'
      - 'tests/fpm/test_ppa_wu05a17_rfm_preferential_router.f90'
      - 'tests/fpm/run_ppa_wu05a17_rfm_preferential_router.sh'
      - '.github/workflows/ppa-wu05a17-rfm-preferential-routing.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run focused A17 gate
        run: bash tests/fpm/run_ppa_wu05a17_rfm_preferential_router.sh
