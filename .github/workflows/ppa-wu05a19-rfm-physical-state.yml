name: PPA-WU05-A19 RFM physical state

on:
  push:
    branches:
      - work/ppa-wu05-a19-rfm-physical-state
    paths:
      - 'src/runtime/mod_rfm_physical_state.f90'
      - 'tests/fpm/test_ppa_wu05a19_rfm_physical_state.f90'
      - 'tests/fpm/run_ppa_wu05a19_rfm_physical_state.sh'
      - '.github/workflows/ppa-wu05a19-rfm-physical-state.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run focused A19 gate
        run: bash tests/fpm/run_ppa_wu05a19_rfm_physical_state.sh
