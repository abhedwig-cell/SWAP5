name: PPA-WU05-A20 RFM optional-state layout

on:
  push:
    branches:
      - work/ppa-wu05-a20-rfm-optional-state-layout
    paths:
      - 'src/runtime/mod_fmr_runtime_core.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpm/test_ppa_wu05a20_rfm_optional_state_layout.f90'
      - 'tests/fpm/run_ppa_wu05a20_rfm_optional_state_layout.sh'
      - '.github/workflows/ppa-wu05a20-rfm-optional-state-layout.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run focused A20 gate
        run: bash tests/fpm/run_ppa_wu05a20_rfm_optional_state_layout.sh
