name: PPA-WU05-A22A RFM endpoint release
on:
  push:
    branches: [work/ppa-wu05-a22a-rfm-endpoint-release]
    paths:
      - 'src/process/macropore/mod_rfm_endpoint_release.f90'
      - 'tests/fpm/test_ppa_wu05a22a_rfm_endpoint_release.f90'
      - 'tests/fpm/run_ppa_wu05a22a_rfm_endpoint_release.sh'
      - '.github/workflows/ppa-wu05a22a-rfm-endpoint-release.yml'
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: bash tests/fpm/run_ppa_wu05a22a_rfm_endpoint_release.sh
