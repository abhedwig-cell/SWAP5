name: PPA-WU05-A23 RFM whole column ledger
on:
  push:
    branches: [work/ppa-wu05-a23-rfm-whole-column-candidate-ledger]
    paths:
      - 'src/runtime/mod_rfm_whole_column_candidate_ledger.f90'
      - 'tests/fpm/test_ppa_wu05a23_rfm_whole_column_candidate_ledger.f90'
      - 'tests/fpm/run_ppa_wu05a23_rfm_whole_column_candidate_ledger.sh'
