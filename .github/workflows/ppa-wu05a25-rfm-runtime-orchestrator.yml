name: PPA-WU05-A25 RFM runtime orchestrator
on:
 push:
  branches: [work/ppa-wu05-a25-rfm-runtime-orchestrator]
  paths:
   - 'src/runtime/mod_rfm_runtime_orchestrator.f90'
   - 'tests/fpm/test_ppa_wu05a25_rfm_runtime_orchestrator.f90'
   - 'tests/fpm/run_ppa_wu05a25_rfm_runtime_orchestrator.sh'
   - '.github/workflows/ppa-wu05a25-rfm-runtime-orchestrator.yml'
jobs:
 focused:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - run: sudo apt-get update && sudo apt-get install -y gfortran
   - run: bash tests/fpm/run_ppa_wu05a25_rfm_runtime_orchestrator.sh
