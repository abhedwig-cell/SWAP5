name: PPA-WU05-A25 RFM runtime orchestrator
on:
 push:
  branches: [work/ppa-wu05-a25-rfm-runtime-orchestrator]
  paths:
   - 'src/runtime/mod_rfm_physical_state.f90'
   - 'src/runtime/mod_rfm_runtime_configuration.f90'
   - 'src/runtime/mod_rfm_runtime_orchestrator.f90'
   - 'tests/fpm/test_ppa_wu05a25_rfm_runtime_orchestrator.f90'
   - 'tests/fpm/run_ppa_wu05a25_rfm_runtime_orchestrator.sh'
   - 'tests/fpm/test_ppa_wu05a25_rfm_node_sorptivity.f90'
   - 'tests/fpm/run_ppa_wu05a25_rfm_node_sorptivity.sh'
   - '.github/workflows/ppa-wu05a25-rfm-runtime-orchestrator.yml'
jobs:
 focused:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - run: sudo apt-get update && sudo apt-get install -y gfortran
   - name: Requalify A19 state semantics
     run: bash tests/fpm/run_ppa_wu05a19_rfm_physical_state.sh
   - name: Requalify A20 carrier checkpoint semantics
     run: bash tests/fpm/run_ppa_wu05a20_rfm_optional_state_layout.sh
   - name: Qualify A25 node sorptivity
     run: bash tests/fpm/run_ppa_wu05a25_rfm_node_sorptivity.sh
   - name: Qualify A25 orchestrator
     run: bash tests/fpm/run_ppa_wu05a25_rfm_runtime_orchestrator.sh
