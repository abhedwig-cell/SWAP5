name: PPA-WU05-A27 ABC01 first-dry transition diagnostic
on:
  push:
    branches:
      - work/ppa-wu05-a27-rfm-performance-equivalence
jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: First-dry-step production-C attribution
        run: |
          mkdir -p /tmp/a27-tr01
          bash research/rfm/a27/run_abc01_transition.sh /tmp/a27-tr01
      - name: Upload transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppa-wu05a27-abc01-tr01
          path: /tmp/a27-tr01
