name: PPA-WU05-A27 ABC01 production screen
on:
  workflow_dispatch:
jobs:
  abc01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A26 live trial preparer preservation
        run: bash tests/fpm/run_ppa_wu05a26_live_trial_preparer.sh
      - name: Current serialized backend compile preservation
        run: bash tests/fpm/run_ppa_wu05a26_backend_compile.sh
      - name: Production A/B/C screen
        run: |
          mkdir -p /tmp/a27-abc01
          bash research/rfm/a27/run_production_abc01.sh /tmp/a27-abc01
      - name: Upload A/B/C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppa-wu05a27-abc01
          path: /tmp/a27-abc01
