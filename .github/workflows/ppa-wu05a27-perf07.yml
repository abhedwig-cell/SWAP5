name: PPA-WU05-A27 PERF07 adaptive stage1
on:
  push:
    branches:
      - work/ppa-wu05-a27-rfm-performance-equivalence
jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/a27-perf07
          bash research/rfm/a27/run_perf07_stage1.sh /tmp/a27-perf07
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppa-wu05a27-perf07-stage1
          path: /tmp/a27-perf07
