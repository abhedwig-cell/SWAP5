name: PPA-WU05-A27 reconciled backend requalification
on:
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A26 live trial preparer
        run: bash tests/fpm/run_ppa_wu05a26_live_trial_preparer.sh
      - name: A26 serialized backend compile
        run: bash tests/fpm/run_ppa_wu05a26_backend_compile.sh
      - name: A26 actual Richards binding
        run: bash tests/fpm/run_ppa_wu05a26_real_richards_binding.sh
      - name: A27 column ablation
        run: bash tests/fpm/run_ppa_wu05a27_column_ablation.sh
      - name: A27 finite exchange
        run: bash tests/fpm/run_ppa_wu05a27_finite_exchange.sh
      - name: A27 reverse exchange
        run: bash tests/fpm/run_ppa_wu05a27_reverse_exchange.sh
