name: PPA-WU05-A28 FGC45 RFM coupled
on:
  push:
    branches:
      - admission/ppa-wu05-a28-rfm-approx-candidate
jobs:
  coupled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned coupled-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - run: bash tests/fpe/run_fpe_a28_fgc45_rfm_coupled.sh
