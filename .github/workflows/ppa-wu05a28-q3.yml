name: PPA-WU05-A28 approximate RFM Q3
on:
  workflow_dispatch:
jobs:
  trajectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact versus opt-in approximate ABC
        run: |
          mkdir -p /tmp/a28-q3
          bash research/rfm/a28/run_q3.sh /tmp/a28-q3
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppa-wu05a28-q3
          path: /tmp/a28-q3
