name: PPA-WU05-A28 Q4B Stage A exact threshold
on:
  push:
    branches:
      - qualification/ppa-wu05-a28-q4b-stage-a
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact-only executable threshold trace
        run: |
          mkdir -p /tmp/a28-q4b
          bash research/rfm/a28/run_q4b_stage_a.sh /tmp/a28-q4b
      - name: Upload Stage-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppa-wu05a28-q4b-stage-a
          path: /tmp/a28-q4b
