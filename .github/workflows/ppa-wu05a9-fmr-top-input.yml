name: PPA-WU05-A9 FMR top input

on:
  workflow_dispatch:
  push:
    branches:
      - work/ppa-wu05-a9-fmr-top-input
    paths:
      - 'src/runtime/mod_fmr_macropore_top_input.f90'
      - 'src/runtime/mod_macropore_standard_rate_adapter.f90'
      - 'src/runtime/mod_macropore_single_column_runtime.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpm/test_ppa_wu05a9_top_input.f90'
      - 'tests/fpm/test_ppa_wu05a9_fmr_top_input_trial.f90'
      - 'tests/fpm/run_ppa_wu05a9_fmr_top_input.sh'
      - '.github/workflows/ppa-wu05a9-fmr-top-input.yml'

jobs:
  focused-a9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run focused A9 gate
        run: bash tests/fpm/run_ppa_wu05a9_fmr_top_input.sh
