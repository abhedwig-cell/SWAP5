name: PPA-WU05-A9 surface top input

on:
  push:
    branches:
      - work/ppa-wu05-a9-surface-top-input
    paths:
      - 'src/process/macropore/**'
      - 'src/runtime/mod_macropore_standard_rate_adapter.f90'
      - 'src/runtime/mod_macropore_single_column_runtime.f90'
      - 'src/runtime/mod_fmr_macropore_configuration.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpm/test_ppa_wu05a9_surface_top_input.f90'
      - 'tests/fpm/test_ppa_wu05a9_fmr_surface_top_input.f90'
      - 'tests/fpm/run_ppa_wu05a9_surface_input.sh'
      - '.github/workflows/ppa-wu05a9-surface-input.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run A9 surface-input regression gate
        run: bash tests/fpm/run_ppa_wu05a9_surface_input.sh
