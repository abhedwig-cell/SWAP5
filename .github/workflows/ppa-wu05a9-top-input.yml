name: PPA-WU05-A9 top input

on:
  push:
    branches:
      - work/ppa-wu05-a9-fmr-top-input
      - integration/f-ci-canonical
    paths:
      - 'src/process/macropore/**'
      - 'src/runtime/mod_fmr_macropore_top_input.f90'
      - 'src/runtime/mod_macropore_standard_rate_adapter.f90'
      - 'src/runtime/mod_macropore_single_column_runtime.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fpm/run_ppa_wu05a9_top_input.sh'
      - 'tests/fpm/test_ppa_wu05a9_top_input.f90'
      - 'tests/fpm/test_ppa_wu05a9_fmr_top_input_trial.f90'
      - 'tests/fpm/test_ppa_wu05a9_fmr_top_input_replay.f90'
      - '.github/workflows/ppa-wu05a9-top-input.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused A9 source-faithful top-input gate
        run: bash tests/fpm/run_ppa_wu05a9_top_input.sh
