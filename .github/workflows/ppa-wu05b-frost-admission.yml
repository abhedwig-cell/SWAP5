name: PPA-WU05B bounded frost qualification and admission

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'src/process/mod_frost_hydraulic_effect.f90'
      - 'src/process/mod_root_frost_stress.f90'
      - 'src/process/mod_frost_bottom_boundary_effect.f90'
      - 'src/process/mod_root_uptake_compensation.f90'
      - 'src/runtime/mod_root_uptake_compensation_execution.f90'
      - 'src/runtime/mod_fmr_production_application_bootstrap.f90'
      - 'src/solver/mod_frost_hydraulic_provider.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_committed_restart.f90'
      - 'tests/frost/**'
      - 'reference/swap-4.3.1/frost-corrections/**'
      - 'docs/audits/PPA_WU05B_FROST_SOURCE_RECONSTRUCTION.md'
      - 'integration/audits/PPA_WU05B*.json'
      - '.github/workflows/ppa-wu05b-frost-admission.yml'

permissions:
  contents: read

concurrency:
  group: ppa-wu05b-frost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-frost-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact PR and tested revisions
        run: |
          echo "PPA_WU05B_PR_HEAD=${{ github.event.pull_request.head.sha }}"
          echo "PPA_WU05B_TESTED_MERGE_HEAD=$(git rev-parse HEAD)"
          echo "PPA_WU05B_TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Install Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Frost process, typed provider, runtime, restart and retry qualification
        run: |
          bash tests/frost/run_ppa_wu05b_frost_effect.sh
          bash tests/frost/run_ppa_wu05b_frost_runtime.sh
      - name: Explicit empirical root frost and application composition
        run: |
          if test -f tests/frost/run_ppa_wu05b2_root_frost.sh; then
            bash tests/frost/run_ppa_wu05b2_root_frost.sh
            bash tests/frost/run_ppa_wu05b2_root_frost_runtime.sh
            bash tests/physics/run_ppa_wu05d2_jarvis.sh
            python3 tests/physics/run_ppa_wu05d3_walsum.py
            C3A_RESULT="$RUNNER_TEMP/frost-root-salt.json" python3 tests/physics/run_ppa_wu05e_mixed_salt.py
            WU05E_TRANSPORT_VARIANT=dispersion C3A_RESULT="$RUNNER_TEMP/frost-root-dispersion.json" python3 tests/physics/run_ppa_wu05e_mixed_salt.py
          fi
      - name: Explicit no-drain frozen bottom boundary
        run: |
          if test -f tests/frost/run_ppa_wu05b3_frost_bottom.sh; then
            bash tests/frost/run_ppa_wu05b3_frost_bottom.sh
            bash tests/frost/run_ppa_wu05b3_frost_bottom_runtime.sh
            WU05E_COMPENSATION_METHOD=walsum C3A_RESULT="$RUNNER_TEMP/frost-bottom-walsalt.json" python3 tests/physics/run_ppa_wu05e_mixed_salt.py
            WU05E_COMPENSATION_METHOD=walsum WU05E_TRANSPORT_VARIANT=dispersion C3A_RESULT="$RUNNER_TEMP/frost-bottom-walsalt-dispersion.json" python3 tests/physics/run_ppa_wu05e_mixed_salt.py
          fi
      - name: Joint empirical root and no-drain bottom frost
        run: |
          if test -f tests/frost/run_ppa_wu05b4_root_bottom_runtime.sh; then
            bash tests/frost/run_ppa_wu05b4_root_bottom_runtime.sh
          fi
      - name: Bounded original versus corrected B1 drainage accounting
        run: |
          if test -f tests/frost/run_ppa_wu05b5_corrected_drain_source.sh; then
            bash tests/frost/run_ppa_wu05b5_corrected_drain_source.sh
          fi
      - name: Explicit normal-branch nodal frost drainage
        run: |
          if test -f tests/frost/run_ppa_wu05b6_normal_drain_source.sh; then
            bash tests/frost/run_ppa_wu05b6_normal_drain_source.sh
            bash tests/frost/run_ppa_wu05b6_normal_drain_runtime.sh
          fi
      - name: Guarded corrected B1 frost geometry reference
        run: |
          if test -f tests/frost/run_ppa_wu05b7_geometry_reference.py; then
            python3 tests/frost/run_ppa_wu05b7_geometry_reference.py
          fi
      - name: Explicit bracketed low-air nodal frost drainage
        run: |
          if test -f tests/frost/run_ppa_wu05b8_low_air_source.sh; then
            bash tests/frost/run_ppa_wu05b8_low_air_source.sh
            bash tests/frost/run_ppa_wu05b8_low_air_runtime.sh
          fi
      - name: Explicit normal frost with admitted linear drainage generation
        run: |
          if test -f tests/frost/run_ppa_wu05b9_response_drain_source.sh; then
            bash tests/frost/run_ppa_wu05b9_response_drain_source.sh
            bash tests/frost/run_ppa_wu05b9_response_drain_runtime.sh
          fi
      - name: Explicit low-air frost with admitted linear drainage generation
        run: |
          if test -f tests/frost/run_ppa_wu05b10_low_air_response_source.sh; then
            bash tests/frost/run_ppa_wu05b10_low_air_response_source.sh
            bash tests/frost/run_ppa_wu05b10_low_air_response_runtime.sh
          fi
      - name: Exact current-canonical preservation for the bounded frost successor
        run: bash tests/fci/run_fci_canonical_p2e05_moving_preservation.sh
      - name: Explicit normal and low-air frost with admitted tabulated drainage generation
        run: |
          if test -f tests/frost/run_ppa_wu05b11_tabulated_response_source.sh; then
            bash tests/frost/run_ppa_wu05b11_tabulated_response_source.sh
            bash tests/frost/run_ppa_wu05b11_normal_runtime.sh
            bash tests/frost/run_ppa_wu05b11_low_air_runtime.sh
            python3 tests/frost/run_ppa_wu05b11_activation.py
            python3 tests/frost/run_ppa_wu05b11_refinements.py
          fi
      - name: Analytic drainage scientific and corrected frost-source composition
        run: |
          if test -f tests/frost/run_ppa_wu05b12_scientific.py; then
            python3 tests/frost/run_ppa_wu05b12_scientific.py
            python3 tests/frost/run_ppa_wu05b12_analytic_response_source.py
          fi
      - name: Install documentation dependencies
        run: python3 -m pip install -r requirements-docs.txt
      - name: Validate docs, JSON and whitespace
        run: |
          python3 tools/docs/check_docs.py
          python3 -m mkdocs build --strict --site-dir "$RUNNER_TEMP/ppa-wu05b-site"
          python3 - <<'PY'
          import json
          import pathlib
          for path in pathlib.Path('integration/audits').glob('PPA_WU05B*.json'):
              json.loads(path.read_text())
          print('PPA-WU05B_JSON_PARSE=PASS')
          PY
          git diff --check

  analytic-frost-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        route: [normal, low_air]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: All-family actual runtime and further references
        run: |
          if test -f tests/frost/run_ppa_wu05b12_${{ matrix.route }}_runtime.sh; then
            bash tests/frost/run_ppa_wu05b12_${{ matrix.route }}_runtime.sh
            python3 tests/frost/run_ppa_wu05b12_activation.py --routes ${{ matrix.route }}
            python3 tests/frost/run_ppa_wu05b12_preflight.py --routes ${{ matrix.route }}
            python3 tests/frost/run_ppa_wu05b12_refinements.py --routes ${{ matrix.route }}
          fi
