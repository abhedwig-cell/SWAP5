name: PPA-WU05B bounded frost qualification and admission

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'src/process/mod_frost_hydraulic_effect.f90'
      - 'src/process/mod_root_frost_stress.f90'
      - 'src/process/mod_frost_bottom_boundary_effect.f90'
      - 'src/process/mod_root_uptake_compensation.f90'
      - 'src/runtime/mod_root_uptake_compensation_execution.f90'
      - 'src/runtime/mod_fmr_production_application_bootstrap.f90'
      - 'src/solver/mod_frost_hydraulic_provider.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_committed_restart.f90'
      - 'tests/frost/**'
      - 'docs/audits/PPA_WU05B_FROST_SOURCE_RECONSTRUCTION.md'
      - 'integration/audits/PPA_WU05B*.json'
      - '.github/workflows/ppa-wu05b-frost-admission.yml'

permissions:
  contents: read

concurrency:
  group: ppa-wu05b-frost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-frost-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact PR and tested revisions
        run: |
          echo "PPA_WU05B_PR_HEAD=${{ github.event.pull_request.head.sha }}"
          echo "PPA_WU05B_TESTED_MERGE_HEAD=$(git rev-parse HEAD)"
          echo "PPA_WU05B_TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Install Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Frost process, typed provider, runtime, restart and retry qualification
        run: |
          bash tests/frost/run_ppa_wu05b_frost_effect.sh
          bash tests/frost/run_ppa_wu05b_frost_runtime.sh
      - name: Explicit empirical root frost and application composition
        run: |
          if test -f tests/frost/run_ppa_wu05b2_root_frost.sh; then
            bash tests/frost/run_ppa_wu05b2_root_frost.sh
            bash tests/frost/run_ppa_wu05b2_root_frost_runtime.sh
            bash tests/physics/run_ppa_wu05d2_jarvis.sh
            python3 tests/physics/run_ppa_wu05d3_walsum.py
            C3A_RESULT="$RUNNER_TEMP/frost-root-salt.json" python3 tests/physics/run_ppa_wu05e_mixed_salt.py
            WU05E_TRANSPORT_VARIANT=dispersion C3A_RESULT="$RUNNER_TEMP/frost-root-dispersion.json" python3 tests/physics/run_ppa_wu05e_mixed_salt.py
          fi
      - name: Explicit no-drain frozen bottom boundary
        run: |
          if test -f tests/frost/run_ppa_wu05b3_frost_bottom.sh; then
            bash tests/frost/run_ppa_wu05b3_frost_bottom.sh
            bash tests/frost/run_ppa_wu05b3_frost_bottom_runtime.sh
            WU05E_COMPENSATION_METHOD=walsum C3A_RESULT="$RUNNER_TEMP/frost-bottom-walsalt.json" python3 tests/physics/run_ppa_wu05e_mixed_salt.py
            WU05E_COMPENSATION_METHOD=walsum WU05E_TRANSPORT_VARIANT=dispersion C3A_RESULT="$RUNNER_TEMP/frost-bottom-walsalt-dispersion.json" python3 tests/physics/run_ppa_wu05e_mixed_salt.py
          fi
      - name: Exact current-canonical preservation for the bounded frost successor
        run: bash tests/fci/run_fci_canonical_p2e05_moving_preservation.sh
      - name: Install documentation dependencies
        run: python3 -m pip install -r requirements-docs.txt
      - name: Validate docs, JSON and whitespace
        run: |
          python3 tools/docs/check_docs.py
          python3 -m mkdocs build --strict --site-dir "$RUNNER_TEMP/ppa-wu05b-site"
          python3 - <<'PY'
          import json
          import pathlib
          for path in pathlib.Path('integration/audits').glob('PPA_WU05B*.json'):
              json.loads(path.read_text())
          print('PPA-WU05B_JSON_PARSE=PASS')
          PY
          git diff --check
