name: PPA-WU05-B frost authority

on:
  pull_request:
    paths:
      - '.github/workflows/ppa-wu05b-frost-authority.yml'
      - 'docs/audits/PPA_WU05B_FROST_AUTHORITY.md'
      - 'integration/audits/PPA_WU05B_PREREGISTRATION.json'
      - 'integration/audits/PPA_WU05B_FROST_AUTHORITY_CONTRACT.json'
      - 'integration/audits/PPA_WU05B_STATUS.json'
      - 'tests/fvq/validate_ppa_wu05b_frost_authority.py'
  workflow_dispatch:

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical ref
        run: git fetch origin integration/f-ci-canonical
      - name: Validate frost authority and blocker
        run: python3 tests/fvq/validate_ppa_wu05b_frost_authority.py --mode authority

  independent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate independent frost contract
        run: python3 tests/fvq/validate_ppa_wu05b_frost_authority.py --mode independent
