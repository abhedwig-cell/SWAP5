name: PPA-WU05-C oxygen authority

on:
  pull_request:
    paths:
      - '.github/workflows/ppa-wu05c-oxygen-authority.yml'
      - 'docs/audits/PPA_WU05C_OXYGEN_STRESS_AUTHORITY.md'
      - 'integration/audits/PPA_WU05C_PREREGISTRATION.json'
      - 'integration/audits/PPA_WU05C_OXYGEN_AUTHORITY_CONTRACT.json'
      - 'integration/audits/PPA_WU05C_STATUS.json'
      - 'tests/fvq/validate_ppa_wu05c_oxygen_authority.py'
  workflow_dispatch:

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical ref
        run: git fetch origin integration/f-ci-canonical
      - name: Validate corrected-reference and owner authority
        run: python3 tests/fvq/validate_ppa_wu05c_oxygen_authority.py --mode authority

  independent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate independent scientific contract
        run: python3 tests/fvq/validate_ppa_wu05c_oxygen_authority.py --mode independent
