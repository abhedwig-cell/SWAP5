name: PPA WU05 C3A PERF02 boundary falsification
on:
  push:
    branches: [research/ppa-wu05c3a-oxygen-eligibility-gate]
    paths:
      - 'tests/performance/falsify_bartholomeus_gate_boundary.f90'
      - 'tests/performance/run_bartholomeus_gate_boundary.py'
      - 'src/physics/oxygen/mod_bartholomeus_no_stress_gate.f90'
      - '.github/workflows/ppa-wu05c3a-perf02-boundary.yml'
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'tests/performance/falsify_bartholomeus_gate_boundary.f90'
      - 'tests/performance/run_bartholomeus_gate_boundary.py'
      - 'src/physics/oxygen/mod_bartholomeus_no_stress_gate.f90'
      - '.github/workflows/ppa-wu05c3a-perf02-boundary.yml'
  workflow_dispatch:
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/performance/run_bartholomeus_gate_boundary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3a-perf02-boundary
          path: c3a_perf02_boundary_result.json
