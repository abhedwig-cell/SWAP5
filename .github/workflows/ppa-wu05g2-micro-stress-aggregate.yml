name: PPA-WU05-G2 pure micro stress aggregate

on:
  pull_request:
    paths:
      - '.github/workflows/ppa-wu05g2-micro-stress-aggregate.yml'
      - 'src/process/mod_ppa_wu05g2_micro_stress_aggregate.f90'
      - 'tests/fapp/test_ppa_wu05g2_micro_stress_aggregate.f90'
      - 'tests/fapp/run_ppa_wu05g2_micro_stress_aggregate.sh'
      - 'integration/audits/PPA_WU05G2_SOURCE_CENSUS.json'
      - 'integration/audits/PPA_WU05G2_PREREGISTRATION.json'
      - 'integration/audits/PPA_WU05G2_STATUS.json'
  workflow_dispatch:

jobs:
  micro-stress-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B1.11 SWALPTOT aggregation at O0/O2
        run: bash tests/fapp/run_ppa_wu05g2_micro_stress_aggregate.sh
