name: Publication E0 prospective screening

on:
  push:
    branches:
      - research/pub-e0-screening
    paths:
      - '.github/workflows/pub-e0-screening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc-e0-0002:
    name: PUB-GC-E0-0002
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout preregistered publication contract
        uses: actions/checkout@v4
        with:
          ref: 71b7904a3ddee39c7e3a92c5f1dc23d2feaeaafe
          path: publication-contract
          fetch-depth: 1

      - name: Checkout pinned F-VQ87 authority
        uses: actions/checkout@v4
        with:
          ref: 37c02ac3747bfaacdb8b3408b8228f3deb2b9824
          path: gc-src
          fetch-depth: 0

      - name: Verify preregistered immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f publication-contract/docs/publications/manifests/PUB-GC-E0-0002.yaml
          test "$(git -C publication-contract rev-parse HEAD)" = "71b7904a3ddee39c7e3a92c5f1dc23d2feaeaafe"
          test "$(git -C gc-src rev-parse HEAD)" = "37c02ac3747bfaacdb8b3408b8228f3deb2b9824"
          test "$(git -C gc-src rev-parse HEAD:tests/qualification/fvq87/run_fvq87_fgc25_multiswap_independent_gate.sh)" = "1478b3a880c1d67648182ea2e3afbf9a19c7c93c"
          test "$(git -C gc-src rev-parse HEAD:tests/qualification/fvq87/test_fvq87_fgc25_multiswap_independent.f90)" = "338416575b1583152acc65cd606c4322a20dd94d"
          echo 'PUB_GC_E0_0002_PREREGISTERED_INPUTS=PASS'

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Execute immutable F-VQ87 independent oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/PUB-GC-E0-0002
          (
            cd gc-src
            bash tests/qualification/fvq87/run_fvq87_fgc25_multiswap_independent_gate.sh
          ) 2>&1 | tee artifacts/PUB-GC-E0-0002/fvq87-independent.log

      - name: Write GC-E0-0002 provenance receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/PUB-GC-E0-0002
          {
            echo 'experiment_id=PUB-GC-E0-0002'
            echo "workflow_control_commit=$(git rev-parse HEAD)"
            echo "manifest_declaring_commit=$(git -C publication-contract rev-parse HEAD)"
            echo "manifest_blob=$(git -C publication-contract rev-parse HEAD:docs/publications/manifests/PUB-GC-E0-0002.yaml)"
            echo "code_commit=$(git -C gc-src rev-parse HEAD)"
            echo "runner_blob=$(git -C gc-src rev-parse HEAD:tests/qualification/fvq87/run_fvq87_fgc25_multiswap_independent_gate.sh)"
            echo "test_blob=$(git -C gc-src rev-parse HEAD:tests/qualification/fvq87/test_fvq87_fgc25_multiswap_independent.f90)"
            echo "compiler=$(gfortran --version | head -n 1)"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "github_run_id=${GITHUB_RUN_ID:-unknown}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
          } > artifacts/PUB-GC-E0-0002/runner-receipt.txt

      - name: Upload GC-E0-0002 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PUB-GC-E0-0002
          path: artifacts/PUB-GC-E0-0002
          if-no-files-found: error
