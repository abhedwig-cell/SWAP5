name: PUB-GC E1 transient screening

on:
  push:
    branches:
      - research/pub-gc-e1-screening
    paths:
      - '.github/workflows/pub-gc-e1-screening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-e1-history-sensitivity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact screening head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record compiler
        run: gfortran --version

      - name: Run preregistered E1 screening grid
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/PUB-GC-E1-SCREEN-0001
          bash tests/publication/pub_gc/e1_screening/run_pub_gc_e1_screening.sh \
            | tee artifacts/PUB-GC-E1-SCREEN-0001/screening.log

      - name: Upload screening artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-e1-screening-${{ github.sha }}
          path: artifacts/PUB-GC-E1-SCREEN-0001/
          if-no-files-found: error
          retention-days: 90
