name: PUB-GC E2 terminal comparator qualification

on:
  push:
    branches:
      - research/pub-gc-e2-terminal-comparator
    paths:
      - 'tests/publication/pub_gc/e2_terminal_comparator/**'
      - '.github/workflows/pub-gc-e2-terminal-comparator-qualification.yml'

permissions:
  contents: read

jobs:
  qualify-terminal-comparator:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record compiler
        run: gfortran --version

      - name: Run frozen E2 comparator qualification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/PUB-GC-E2-COMPARATOR-QUAL-0001
          bash tests/publication/pub_gc/e2_terminal_comparator/run_pub_gc_e2_terminal_comparator_qualification.sh \
            | tee artifacts/PUB-GC-E2-COMPARATOR-QUAL-0001/qualification.log

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-e2-comparator-${{ github.sha }}
          path: artifacts/PUB-GC-E2-COMPARATOR-QUAL-0001/qualification.log
          if-no-files-found: error
          retention-days: 90
