name: PUB-GC E3 coupling window feedback
on:
  push:
    branches: [work/pub-gc-e3-coupling-window-feedback]
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/fgc/support/fgc44_real_swap_ctypes.py'
      - 'tests/publication/run_pub_gc_e3.py'
      - 'tests/publication/run_pub_gc_e3.sh'
      - 'docs/publication/PUB_GC_E3_PREREGISTRATION.md'
      - 'docs/publication/PUB_GC_E3_RESULT.md'
      - 'docs/publication/PUB_GC_E3_RESULT.json'
      - 'docs/publication/PUB_GC_E3_MATRIX.csv'
      - '.github/workflows/pub-gc-e3-coupling-window-feedback.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run preregistered E3 matrix
        env:
          PUB_GC_EVIDENCE_DIR: ${{ runner.temp }}/pub-gc-e3
        run: bash tests/publication/run_pub_gc_e3.sh
      - name: Upload E3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-e3-evidence
          path: ${{ runner.temp }}/pub-gc-e3
          if-no-files-found: error
