name: PUB-GC E3 window feedback characterization
on:
  push:
    branches: [work/pub-gc-e3-window-feedback-characterization-r2]
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/fgc/support/fgc44_real_swap_ctypes.py'
      - 'tests/fgc/run_fgc44_real_swap_modflow_end_to_end.sh'
      - 'tests/publication/pub_gc_e3_case.py'
      - 'tests/publication/run_pub_gc_e3.sh'
      - 'docs/publication/PUB_GC_E3_PREREGISTRATION.md'
      - '.github/workflows/pub-gc-e3-window-feedback-characterization.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned coupling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest numpy git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run preregistered E3 matrix
        env:
          PUB_GC_E3_RESULT_DIR: ${{ runner.temp }}/pub-gc-e3
        run: bash tests/publication/run_pub_gc_e3.sh
      - name: Upload E3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-e3-evidence
          path: ${{ runner.temp }}/pub-gc-e3
          if-no-files-found: error
