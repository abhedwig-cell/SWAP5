name: PUB-GC E3R stronger feedback refinement
on:
  push:
    branches: [work/pub-gc-e3-coupling-window-feedback-characterization]
    paths:
      - 'tests/publication/test_pub_gc_e3_case.py'
      - 'tests/publication/run_pub_gc_e3r.sh'
      - 'docs/publication/PUB_GC_E3R_STRONGER_FEEDBACK_PREREGISTRATION.md'
      - '.github/workflows/pub-gc-e3r-stronger-feedback.yml'
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/fgc/support/fgc44_real_swap_ctypes.py'
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'tests/publication/test_pub_gc_e3_case.py'
      - 'tests/publication/run_pub_gc_e3r.sh'
      - 'docs/publication/PUB_GC_E3R_STRONGER_FEEDBACK_PREREGISTRATION.md'
      - '.github/workflows/pub-gc-e3r-stronger-feedback.yml'
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/fgc/support/fgc44_real_swap_ctypes.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned coupling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run preregistered E3-R matrix
        env:
          PUB_GC_EVIDENCE_DIR: ${{ runner.temp }}/pub-gc-e3r
        run: bash tests/publication/run_pub_gc_e3r.sh
      - name: Upload E3-R evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-e3r-evidence
          path: ${{ runner.temp }}/pub-gc-e3r
          if-no-files-found: error
