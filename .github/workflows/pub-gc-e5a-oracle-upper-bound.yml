name: PUB-GC E5a oracle upper-bound
on:
  push:
    branches: [work/pub-gc-e5a-oracle-upper-bound]
    paths:
      - 'docs/publication/PUB_GC_E5A_ORACLE_VALUE_PREREGISTRATION.md'
      - 'tests/publication/test_pub_gc_e5a_case.py'
      - 'tests/publication/run_pub_gc_e5a.sh'
      - '.github/workflows/pub-gc-e5a-oracle-upper-bound.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: pub-gc-e5a-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  oracle-upper-bound:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run preregistered E5a oracle upper-bound matrix
        env:
          PUB_GC_EVIDENCE_DIR: ${{ runner.temp }}/pub-gc-e5a
        run: bash tests/publication/run_pub_gc_e5a.sh
      - name: Upload E5a evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-e5a-evidence
          path: ${{ runner.temp }}/pub-gc-e5a
          if-no-files-found: error
