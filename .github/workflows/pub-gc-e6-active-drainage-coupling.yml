name: PUB-GC E6 active-drainage coupling

on:
  push:
    branches: [work/pub-gc-e6-active-drainage-live-coupling]
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'docs/publication/PUB_GC_E6_ACTIVE_DRAINAGE_PREREGISTRATION.md'
      - 'tests/publication/mod_pub_gc_e6_active_drainage_bridge.f90'
      - 'tests/publication/build_pub_gc_e6_active_drainage.sh'
      - 'tests/publication/pub_gc_e6_ctypes.py'
      - 'tests/publication/test_pub_gc_e6_active_drainage_init.py'
      - 'tests/publication/test_pub_gc_e6_live_case.py'
      - 'tests/publication/run_pub_gc_e6.sh'
      - '.github/workflows/pub-gc-e6-active-drainage-coupling.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and pinned coupling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pytest git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902 git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb
      - name: Run preregistered active-drainage live coupling matrix
        env:
          PUB_GC_E6_RESULT_DIR: ${{ runner.temp }}/pub-gc-e6-results
        run: bash tests/publication/run_pub_gc_e6.sh
      - name: Upload E6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-e6-active-drainage
          path: ${{ runner.temp }}/pub-gc-e6-results
          if-no-files-found: error
