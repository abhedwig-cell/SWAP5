name: PUB-GC GMD qualified figure exports

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/publication/figures/PUB_GC_F*.svg'
      - 'docs/publication/PUB_GC_GMD_FIGURE_EXPORT_PLAN.json'
      - 'docs/publication/PUB_GC_GMD_FIGURE_EXPORT_PLAN.md'
      - 'tools/publication/export_pub_gc_gmd_figures.py'
      - '.github/workflows/pub-gc-gmd-figure-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pinned export dependencies
        run: python -m pip install --disable-pip-version-check "cairosvg==2.8.2" "pypdf==6.1.1"

      - name: Export and validate governed figures
        run: python tools/publication/export_pub_gc_gmd_figures.py

      - name: Verify flat package and total size budget
        run: |
          python -c "import json,pathlib; m=json.loads(pathlib.Path('build/pub_gc_gmd_figure_export_manifest.json').read_text()); assert m['zip']['flat_contents']==[f'f{i:02d}.pdf' for i in range(1,8)]; assert sum(x['size_bytes'] for x in m['figures']) < 30*1024*1024; print('PUB_GC_GMD_FIGURE_FLAT_ZIP=PASS'); print('PUB_GC_GMD_FIGURE_SIZE_BUDGET=PASS')"

      - name: Upload qualified figure package
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-gmd-qualified-figures
          path: |
            build/pub_gc_gmd_figures.zip
            build/pub_gc_gmd_figure_export_manifest.json
          if-no-files-found: error
          retention-days: 90
