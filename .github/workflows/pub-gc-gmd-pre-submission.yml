name: PUB-GC GMD pre-submission gate
on:
  pull_request:
    branches: [integration/f-ci-canonical]
    paths:
      - 'docs/publication/PUB_GC_*'
      - 'tests/publication/validate_pub_gc_gmd_pre_submission.py'
      - '.github/workflows/pub-gc-gmd-pre-submission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tests/publication/validate_pub_gc_gmd_pre_submission.py
