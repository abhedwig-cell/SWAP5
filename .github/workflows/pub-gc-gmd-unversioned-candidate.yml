name: PUB-GC GMD unversioned publication candidate

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'release/pub-gc-gmd/**'
      - '.github/workflows/pub-gc-gmd-unversioned-candidate.yml'
      - 'docs/publication/PUB_GC_GMD_GOVERNANCE_DECISION_REQUEST.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate unversioned GMD publication candidate
        run: python release/pub-gc-gmd/validate_unversioned_candidate.py
