name: PUB-GC macro high-count qualification

on:
  push:
    branches:
      - research/pub-gc-macro-high-count
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-high-count:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record compiler
        run: gfortran --version
      - name: Run frozen high-count qualification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/PUB-GC-MACRO-HIGH-COUNT
          bash tests/publication/pub_gc/macro_window_response/run_pub_gc_macro_high_count_qualification.sh 2>&1 | tee artifacts/PUB-GC-MACRO-HIGH-COUNT/qualification.log
      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-macro-high-count-${{ github.sha }}
          path: artifacts/PUB-GC-MACRO-HIGH-COUNT/qualification.log
          if-no-files-found: error
          retention-days: 90
