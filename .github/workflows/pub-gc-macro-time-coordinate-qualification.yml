name: PUB-GC macro time-coordinate requalification

on:
  push:
    branches:
      - research/pub-gc-macro-time-coordinate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-time-coordinate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record compiler
        run: gfortran --version
      - name: Run frozen macro time-coordinate qualification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/PUB-GC-MACRO-TIME
          bash tests/publication/pub_gc/macro_window_response/run_pub_gc_macro_time_coordinate_qualification.sh 2>&1 | tee artifacts/PUB-GC-MACRO-TIME/qualification.log
      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-macro-time-${{ github.sha }}
          path: artifacts/PUB-GC-MACRO-TIME/qualification.log
          if-no-files-found: error
          retention-days: 90
