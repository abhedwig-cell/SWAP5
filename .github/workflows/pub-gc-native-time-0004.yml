name: PUB-GC native-time refinement 0004

on:
  push:
    branches:
      - research/pub-gc-native-time-0004
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-time-0004:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record compiler
        run: gfortran --version
      - name: Run frozen eight-level native-time study
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/PUB-GC-NATIVE-TIME-0004
          bash tests/publication/pub_gc/native_time_0004/run_pub_gc_native_time_0004.sh 2>&1 | tee artifacts/PUB-GC-NATIVE-TIME-0004/study.log
      - name: Upload study receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-native-time-0004-${{ github.sha }}
          path: artifacts/PUB-GC-NATIVE-TIME-0004/study.log
          if-no-files-found: error
          retention-days: 90
