name: PUB-GC native-time adequacy

on:
  push:
    branches:
      - research/pub-gc-native-time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-time:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record compiler
        run: gfortran --version

      - name: Run preregistered native-time study
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/PUB-GC-NATIVE-TIME
          bash tests/publication/pub_gc/native_time/run_pub_gc_native_time.sh 2>&1 | tee artifacts/PUB-GC-NATIVE-TIME/study.log

      - name: Upload study receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-native-time-${{ github.sha }}
          path: artifacts/PUB-GC-NATIVE-TIME/study.log
          if-no-files-found: error
          retention-days: 90
