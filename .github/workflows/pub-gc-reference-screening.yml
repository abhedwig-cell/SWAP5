name: PUB-GC reference screening

on:
  push:
    branches:
      - research/pub-gc-reference-screening
    paths:
      - 'tests/publication/pub_gc/reference_screening/**'
      - '.github/workflows/pub-gc-reference-screening.yml'

permissions:
  contents: read

jobs:
  screen-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record compiler
        run: gfortran --version

      - name: Run frozen reference screening
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/PUB-GC-GC-REF-A-SCREEN-0001
          bash tests/publication/pub_gc/reference_screening/run_pub_gc_reference_screening.sh \
            | tee artifacts/PUB-GC-GC-REF-A-SCREEN-0001/screening.log

      - name: Upload screening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-gc-reference-screening-${{ github.sha }}
          path: artifacts/PUB-GC-GC-REF-A-SCREEN-0001/screening.log
          if-no-files-found: error
          retention-days: 90
