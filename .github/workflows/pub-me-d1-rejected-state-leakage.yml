name: PUB-ME D1 rejected-state leakage

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/publications/PUB-ME_D1_COMPARATOR_AND_MUTATION_FREEZE.md'
      - 'tests/publication/test_pub_me_d1_rejected_state_leakage.f90'
      - 'tests/publication/run_pub_me_d1_rejected_state_leakage.sh'
      - 'tests/publication/mutants/d1_rejected_candidate_write_through.patch'
      - '.github/workflows/pub-me-d1-rejected-state-leakage.yml'
      - 'src/**'
      - 'tests/fsi/fsi04_real_headcalc_stubs.f90'
      - 'tests/publication/test_pub_p1e02_postsolver_rollback.f90'
  workflow_dispatch:

jobs:
  d1-transition-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run D1 clean/mutant transition-authority experiment
        run: bash tests/publication/run_pub_me_d1_rejected_state_leakage.sh
