name: PUB-ME D1 transition authority

on:
  pull_request:
    paths:
      - 'docs/publications/PUB-ME_D1_EXECUTION_CHECKPOINT.md'
      - 'tests/publication/test_pub_me_d1_clone_isolation.f90'
      - 'tests/publication/test_pub_me_d1_illegal_write_through.f90'
      - 'tests/publication/run_pub_me_d1_transition_authority.sh'
      - '.github/workflows/pub-me-d1-transition-authority.yml'
      - 'src/**'
      - 'reference/**'
      - '!reference/swap-4.3.1/frost-corrections/FROST-DIVDRA-OVERLAP-01/README.md'
      - '!reference/swap-4.3.1/frost-corrections/FROST-DIVDRA-OVERLAP-01/divdra.f90'
      - '!reference/swap-4.3.1/frost-corrections/FROST-DIVDRA-OVERLAP-01/manifest.json'
      - 'tests/nomacro_drainage/frost_publication_scope.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-transition-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select actual publication dependency changes
        id: publication_scope
        run: python3 tests/nomacro_drainage/frost_publication_scope.py
      - name: Install GNU Fortran
        if: steps.publication_scope.outputs.replay == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run preregistered D1 gate
        if: steps.publication_scope.outputs.replay == 'true'
        run: bash tests/publication/run_pub_me_d1_transition_authority.sh
