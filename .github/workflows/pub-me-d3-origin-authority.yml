name: PUB-ME D3 origin authority

on:
  pull_request:
    paths:
      - 'docs/publications/PUB-ME_D3_EXECUTION_CHECKPOINT.md'
      - 'docs/publications/PUB-ME_D3_RESULT.md'
      - 'tests/publication/test_pub_me_d3_origin_authority.f90'
      - 'tests/publication/run_pub_me_d3_origin_authority.sh'
      - '.github/workflows/pub-me-d3-origin-authority.yml'
      - 'src/**'
      - 'reference/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d3-origin-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run preregistered D3 gate
        run: bash tests/publication/run_pub_me_d3_origin_authority.sh
