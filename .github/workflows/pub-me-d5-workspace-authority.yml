name: PUB-ME D5 workspace authority

on:
  pull_request:
    paths:
      - 'docs/publications/PUB-ME_D5_EXECUTION_CHECKPOINT.md'
      - 'docs/publications/PUB-ME_D5_RESULT.md'
      - 'tests/publication/test_pub_me_d5_workspace_authority.f90'
      - 'tests/publication/run_pub_me_d5_workspace_authority.sh'
      - '.github/workflows/pub-me-d5-workspace-authority.yml'
      - 'src/solver/mod_reference_richards_workspace.f90'
      - 'src/solver/mod_reference_richards_state_binding.f90'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
      - 'src/solver/mod_soil_water_solver_contract.f90'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d5-workspace-authority:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run preregistered D5 gate
        run: bash tests/publication/run_pub_me_d5_workspace_authority.sh
