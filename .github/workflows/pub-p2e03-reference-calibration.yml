name: PUB-P2E03 Reference calibration

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/publication/P2_REFERENCE_CALIBRATION_MATRIX_PREREGISTRATION.json'
      - 'tests/publication/test_pub_p2e03_reference_calibration_matrix.f90'
      - 'tests/publication/run_pub_p2e03_reference_calibration_matrix.sh'
      - '.github/workflows/pub-p2e03-reference-calibration.yml'
      - 'src/**'
      - 'tests/fsi/fsi04_real_headcalc_stubs.f90'
  workflow_dispatch:

jobs:
  reference-calibration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run preregistered Reference-only calibration matrix
        run: bash tests/publication/run_pub_p2e03_reference_calibration_matrix.sh
