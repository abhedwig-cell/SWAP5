name: PUB-P2E04 Reference B/C sweeps

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/publication/P2E04_REFERENCE_BALANCE_ADJUDICATION_PREREGISTRATION.json'
      - 'docs/publication/P2E04_STAGE_BC_TARGET_CONSTRUCTION.json'
      - 'tests/publication/test_pub_p2e04_reference_bc_sweeps.f90'
      - 'tests/publication/run_pub_p2e04_reference_bc_sweeps.sh'
      - '.github/workflows/pub-p2e04-reference-bc-sweeps.yml'
      - 'src/**'
      - 'tests/fsi/fsi04_real_headcalc_stubs.f90'
  workflow_dispatch:

jobs:
  reference-bc-sweeps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run preregistered Reference Stage B and C sweeps
        run: bash tests/publication/run_pub_p2e04_reference_bc_sweeps.sh
