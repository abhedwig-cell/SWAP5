name: PUB-P2E08 Reference valid calibration domain

on:
  push:
    branches:
      - work/pub-p2e08-reference-valid-calibration-domain
    paths:
      - 'docs/publication/P2E08_REFERENCE_VALID_CALIBRATION_DOMAIN_PREREGISTRATION.json'
      - 'tests/publication/test_pub_p2e08_reference_valid_calibration_domain.f90'
      - 'tests/publication/run_pub_p2e08_reference_valid_calibration_domain.sh'
      - '.github/workflows/pub-p2e08-reference-valid-calibration-domain.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/publication/P2E08_REFERENCE_VALID_CALIBRATION_DOMAIN_PREREGISTRATION.json'
      - 'docs/publication/P2E08_REFERENCE_VALID_CALIBRATION_DOMAIN_RESULT.json'
      - 'tests/publication/test_pub_p2e08_reference_valid_calibration_domain.f90'
      - 'tests/publication/run_pub_p2e08_reference_valid_calibration_domain.sh'
      - '.github/workflows/pub-p2e08-reference-valid-calibration-domain.yml'
      - 'src/**'
      - 'reference/**'
  workflow_dispatch:

jobs:
  reference-valid-calibration-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Construct Reference-only common calibration domain
        run: bash tests/publication/run_pub_p2e08_reference_valid_calibration_domain.sh
