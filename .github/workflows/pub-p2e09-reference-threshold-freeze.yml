name: PUB-P2E09 Reference-only threshold freeze

on:
  push:
    branches:
      - work/pub-p2e09-reference-threshold-freeze
    paths:
      - 'docs/publication/P2E09_REFERENCE_ONLY_THRESHOLD_FREEZE_PREREGISTRATION.json'
      - 'tests/publication/validate_pub_p2e09_reference_thresholds.py'
      - 'tests/publication/run_pub_p2e09_reference_threshold_freeze.sh'
      - '.github/workflows/pub-p2e09-reference-threshold-freeze.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/publication/P2E09_REFERENCE_ONLY_THRESHOLD_FREEZE_PREREGISTRATION.json'
      - 'docs/publication/P2E09_REFERENCE_ONLY_THRESHOLD_FREEZE_RESULT.json'
      - 'tests/publication/validate_pub_p2e09_reference_thresholds.py'
      - 'tests/publication/run_pub_p2e09_reference_threshold_freeze.sh'
      - '.github/workflows/pub-p2e09-reference-threshold-freeze.yml'
      - 'src/**'
      - 'reference/**'
  workflow_dispatch:

jobs:
  reference-threshold-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Replay Reference calibration and validate frozen thresholds
        run: bash tests/publication/run_pub_p2e09_reference_threshold_freeze.sh
