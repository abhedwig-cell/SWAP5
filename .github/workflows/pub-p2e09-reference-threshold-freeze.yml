name: PUB-P2E09 Reference-only threshold freeze

on:
  push:
    branches:
      - work/pub-p2e09-reference-threshold-freeze
    paths:
      - 'docs/publication/P2E09_REFERENCE_ONLY_THRESHOLD_FREEZE_PREREGISTRATION.json'
      - 'tests/publication/validate_pub_p2e09_reference_thresholds.py'
      - 'tests/publication/run_pub_p2e09_reference_threshold_freeze.sh'
      - '.github/workflows/pub-p2e09-reference-threshold-freeze.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/publication/P2E09_REFERENCE_ONLY_THRESHOLD_FREEZE_PREREGISTRATION.json'
      - 'docs/publication/P2E09_REFERENCE_ONLY_THRESHOLD_FREEZE_RESULT.json'
      - 'tests/publication/validate_pub_p2e09_reference_thresholds.py'
      - 'tests/publication/run_pub_p2e09_reference_threshold_freeze.sh'
      - '.github/workflows/pub-p2e09-reference-threshold-freeze.yml'
      - 'src/**'
      - 'reference/**'
      - '!reference/swap-4.3.1/frost-corrections/FROST-DIVDRA-OVERLAP-01/README.md'
      - '!reference/swap-4.3.1/frost-corrections/FROST-DIVDRA-OVERLAP-01/divdra.f90'
      - '!reference/swap-4.3.1/frost-corrections/FROST-DIVDRA-OVERLAP-01/manifest.json'
      - 'tests/nomacro_drainage/frost_publication_scope.py'
  workflow_dispatch:

jobs:
  reference-threshold-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select actual publication dependency changes
        id: publication_scope
        run: python3 tests/nomacro_drainage/frost_publication_scope.py
      - name: Install gfortran
        if: steps.publication_scope.outputs.replay == 'true'
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Replay Reference calibration and validate frozen thresholds
        if: steps.publication_scope.outputs.replay == 'true'
        run: bash tests/publication/run_pub_p2e09_reference_threshold_freeze.sh
