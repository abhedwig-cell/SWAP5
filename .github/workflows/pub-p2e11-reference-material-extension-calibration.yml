name: PUB-P2E11 Reference material extension calibration

on:
  push:
    branches:
      - work/pub-p2e11-reference-material-extension-calibration
    paths:
      - 'docs/publication/P2E11_MATERIAL_EXTENSION_FREEZE_SNAPSHOT.yaml'
      - 'docs/publication/P2E11_REFERENCE_MATERIAL_EXTENSION_CALIBRATION_PREREGISTRATION.json'
      - 'tests/publication/test_pub_p2e11_reference_material_extension_calibration.f90'
      - 'tests/publication/run_pub_p2e11_reference_material_extension_calibration.sh'
      - '.github/workflows/pub-p2e11-reference-material-extension-calibration.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'docs/publication/P2E11_MATERIAL_EXTENSION_FREEZE_SNAPSHOT.yaml'
      - 'docs/publication/P2E11_REFERENCE_MATERIAL_EXTENSION_CALIBRATION_PREREGISTRATION.json'
      - 'docs/publication/P2E11_REFERENCE_MATERIAL_EXTENSION_CALIBRATION_RESULT.json'
      - 'tests/publication/test_pub_p2e11_reference_material_extension_calibration.f90'
      - 'tests/publication/run_pub_p2e11_reference_material_extension_calibration.sh'
      - '.github/workflows/pub-p2e11-reference-material-extension-calibration.yml'
      - 'src/**'
      - 'reference/**'
  workflow_dispatch:

jobs:
  reference-material-extension-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Execute frozen Reference-only 30-material calibration
        run: bash tests/publication/run_pub_p2e11_reference_material_extension_calibration.sh
