name: PUB-P2E15 material extension primary

on:
  push:
    branches:
      - work/pub-p2e15-material-extension-primary
    paths:
      - 'docs/publication/P2E15_MATERIAL_EXTENSION_PRIMARY_PREREGISTRATION.json'
      - 'tests/publication/test_pub_p2e15_material_extension_primary.f90'
      - 'tests/publication/run_pub_p2e15_material_extension_primary.sh'
      - '.github/workflows/pub-p2e15-material-extension-primary.yml'
  workflow_dispatch:

jobs:
  material-extension-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Execute preregistered 180-case material extension primary
        run: bash tests/publication/run_pub_p2e15_material_extension_primary.sh
