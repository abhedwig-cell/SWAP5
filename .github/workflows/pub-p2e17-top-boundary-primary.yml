name: PUB-P2E17 top-boundary primary

on:
  push:
    branches:
      - work/pub-p2e17-top-boundary-primary
    paths:
      - 'docs/publication/P2E17_TOP_BOUNDARY_PRIMARY_PREREGISTRATION.json'
      - 'tests/publication/test_pub_p2e17_top_boundary_primary.f90'
      - 'tests/publication/run_pub_p2e17_top_boundary_primary.sh'
      - '.github/workflows/pub-p2e17-top-boundary-primary.yml'
  workflow_dispatch:

jobs:
  top-boundary-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Execute preregistered sharp top-boundary matrix
        run: bash tests/publication/run_pub_p2e17_top_boundary_primary.sh
