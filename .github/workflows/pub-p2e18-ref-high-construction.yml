name: PUB-P2E18 REF-HIGH construction

on:
  push:
    branches:
      - work/pub-p2e18-ref-high-construction
    paths:
      - 'docs/publication/P2E18_REF_HIGH_CONSTRUCTION_PREREGISTRATION.json'
      - 'tests/publication/test_pub_p2e18_ref_high_construction.f90'
      - 'tests/publication/run_pub_p2e18_ref_high_construction.sh'
      - '.github/workflows/pub-p2e18-ref-high-construction.yml'
  workflow_dispatch:

jobs:
  ref-high-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Execute preregistered REF-HIGH construction
        run: bash tests/publication/run_pub_p2e18_ref_high_construction.sh
