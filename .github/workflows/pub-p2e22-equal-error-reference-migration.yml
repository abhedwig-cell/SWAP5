name: PUB-P2E22 equal-error reference migration

on:
  push:
    branches:
      - work/pub-p2e22-equal-error-reference-migration
    paths:
      - 'docs/publication/P2E22_EQUAL_ERROR_REFERENCE_MIGRATION_PREREGISTRATION.json'
      - 'tests/publication/test_pub_p2e22_equal_error_reference_migration.f90'
      - 'tests/publication/run_pub_p2e22_equal_error_reference_migration.sh'
      - '.github/workflows/pub-p2e22-equal-error-reference-migration.yml'
  workflow_dispatch:

jobs:
  equal-error-reference-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Execute preregistered 36-case untimed migration
        run: bash tests/publication/run_pub_p2e22_equal_error_reference_migration.sh
