name: PUB-P2E24A untimed benchmark fingerprints

on:
  push:
    branches:
      - work/pub-p2e24a-benchmark-fingerprint
    paths:
      - 'docs/publication/P2E24A_BENCHMARK_FINGERPRINT_PREREGISTRATION.json'
      - 'docs/publication/P2E24_REALIZED_ERROR_TIMING_PREREGISTRATION.json'
      - 'docs/publication/P2E23_MATCHED_CONTROLS.json'
      - 'benchmarks/publication/p2e24_benchmark.f90'
      - 'tests/publication/run_pub_p2e24a_benchmark_fingerprint.sh'
      - '.github/workflows/pub-p2e24a-benchmark-fingerprint.yml'
  workflow_dispatch:

jobs:
  untimed-benchmark-fingerprints:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Qualify untimed benchmark workload
        run: bash tests/publication/run_pub_p2e24a_benchmark_fingerprint.sh
