name: Current Reference drainage build qualification
on:
  pull_request:
    paths:
      - 'tests/publication/reference_drainage_*.py'
      - 'tests/publication/run_pub_p2e04_reference_*.sh'
      - 'integration/dataqual15_hupsel/REFERENCE_DRAINAGE_BUILD_*'
      - '.github/workflows/reference-drainage-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-original-cohorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute both unchanged original cohorts at O0 O2
        run: python -B tests/publication/reference_drainage_build.py --compiler /usr/bin/gfortran-13 --output "$RUNNER_TEMP/reference-drainage-build"
      - name: Independent complete source object command and outcome audit
        if: always()
        run: python -B tests/publication/reference_drainage_evidence.py --output "$RUNNER_TEMP/reference-drainage-build" --stem "$RUNNER_TEMP/REFERENCE_DRAINAGE_BUILD_POSIX_20261107"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-reference-drainage-build
          path: |
            ${{ runner.temp }}/REFERENCE_DRAINAGE_BUILD_POSIX_20261107.*
            ${{ runner.temp }}/reference-drainage-build/RESULT.json
            ${{ runner.temp }}/reference-drainage-build/EVENTS.json
            ${{ runner.temp }}/reference-drainage-build/*.stdout
            ${{ runner.temp }}/reference-drainage-build/*.stderr
