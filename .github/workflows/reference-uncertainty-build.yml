name: Current Reference uncertainty build qualification
on:
  pull_request:
    paths:
      - 'tests/publication/reference_uncertainty_*.py'
      - 'tests/publication/run_pub_p2e02_reference_uncertainty_pilot.sh'
      - 'integration/dataqual15_hupsel/REFERENCE_UNCERTAINTY_BUILD_*'
      - '.github/workflows/reference-uncertainty-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-original-cohorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute unchanged complete original uncertainty pilot at O0 O2
        run: python -B tests/publication/reference_uncertainty_build.py --compiler /usr/bin/gfortran-13 --output "$RUNNER_TEMP/reference-uncertainty-build"
      - name: Independent complete source object command and outcome audit
        if: always()
        run: python -B tests/publication/reference_uncertainty_evidence.py --output "$RUNNER_TEMP/reference-uncertainty-build" --stem "$RUNNER_TEMP/REFERENCE_UNCERTAINTY_BUILD_POSIX_20261107"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-reference-uncertainty-build
          path: |
            ${{ runner.temp }}/REFERENCE_UNCERTAINTY_BUILD_POSIX_20261107.*
            ${{ runner.temp }}/reference-uncertainty-build/RESULT.json
            ${{ runner.temp }}/reference-uncertainty-build/EVENTS.json
            ${{ runner.temp }}/reference-uncertainty-build/*.stdout
            ${{ runner.temp }}/reference-uncertainty-build/*.stderr
