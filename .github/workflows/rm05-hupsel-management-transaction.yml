name: RM05 Hupsel management transaction

on:
  push:
    branches:
      - work/ribasim-management-coupling-closeout
    paths:
      - 'src/runtime/mod_fmr_hupsel_management_transaction.f90'
      - 'tests/ribasim-management/test_rm05_hupsel_management_transaction.f90'
      - 'tests/ribasim-management/run_rm05_hupsel_management_transaction.sh'
      - 'integration/ribasim-management/RM04_*'
      - 'integration/ribasim-management/RM05_*'
      - '.github/workflows/rm05-hupsel-management-transaction.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Run RM05 transaction gate
        run: bash tests/ribasim-management/run_rm05_hupsel_management_transaction.sh
