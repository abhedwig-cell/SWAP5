name: RM07 SWAP management demand receipt

on:
  push:
    branches:
      - work/ribasim-management-coupling-closeout
    paths:
      - 'src/runtime/mod_fmr_hupsel_management_demand_receipt.f90'
      - 'tests/ribasim-management/run_rm07_demand_receipt.sh'
      - 'tests/ribasim-management/test_rm07_demand_receipt.f90'
      - 'integration/ribasim-management/RM07_*'
      - '.github/workflows/rm07-swap-management-demand-receipt.yml'
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_hupsel_management_demand_receipt.f90'
      - 'tests/ribasim-management/run_rm07_demand_receipt.sh'
      - 'tests/ribasim-management/test_rm07_demand_receipt.f90'
      - 'integration/ribasim-management/RM07_*'
      - '.github/workflows/rm07-swap-management-demand-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: RM07 demand receipt qualification
        run: bash tests/ribasim-management/run_rm07_demand_receipt.sh
