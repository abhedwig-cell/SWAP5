name: RM08 real SWAP Ribasim aligned fixture

on:
  workflow_dispatch:

# RM08 is a closed scientific falsification. Its original failing runs are the
# authority for the falsified full-realization assumption. Keep this workflow
# only for explicit reproduction; active admission is RM09/RM10.
permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Ribasim product release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Deltares/Ribasim
          ref: e7fc8ade52a4bedeec10e508d2065577f33eb76a
          path: .ribasim-product-release
          fetch-depth: 1
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: latest
          working-directory: .ribasim-product-release
      - name: Compiler identity
        run: gfortran --version
      - name: RM08 real SWAP to real Ribasim aligned qualification
        run: bash tests/ribasim-management/run_rm08_real_ribasim_aligned.sh
