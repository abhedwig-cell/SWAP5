name: RM13 diagnostic triangle Ubuntu 22.04

on:
  push:
    branches:
      - work/ribasim-management-coupling-closeout
    paths:
      - '.github/workflows/rm13-diagnostic-triangle-2204.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Ribasim product release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Deltares/Ribasim
          ref: e7fc8ade52a4bedeec10e508d2065577f33eb76a
          path: .ribasim-product-release
          fetch-depth: 1
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: latest
          working-directory: .ribasim-product-release
      - name: Install compiler and pinned Python coupling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install             git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902             git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb             netCDF4
      - name: RM13 diagnostic three-model execution
        run: bash tests/ribasim-management/run_rm13_real_three_model_transaction.sh
