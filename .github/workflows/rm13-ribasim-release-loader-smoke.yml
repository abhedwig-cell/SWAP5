name: RM13 Ribasim release loader smoke

on:
  push:
    branches:
      - work/ribasim-management-coupling-closeout
    paths:
      - 'tests/ribasim-management/test_rm13_ribasim_release_loader.py'
      - 'tests/ribasim-management/support/rm13_ribasim_process.py'
      - 'tests/ribasim-management/support/rm13_ribasim_worker.py'
      - 'tests/ribasim-management/generate_rm13_real_ribasim.py'
      - 'tests/ribasim-management/run_rm13_ribasim_release_loader.sh'
      - '.github/workflows/rm13-ribasim-release-loader-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Ribasim product release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Deltares/Ribasim
          ref: e7fc8ade52a4bedeec10e508d2065577f33eb76a
          path: .ribasim-product-release
          fetch-depth: 1
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: latest
          working-directory: .ribasim-product-release
      - name: RM13 Ribasim release-loader smoke
        run: bash tests/ribasim-management/run_rm13_ribasim_release_loader.sh
