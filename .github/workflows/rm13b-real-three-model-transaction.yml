name: RM13B real SWAP MODFLOW Ribasim triangle

on:
  push:
    branches:
      - work/ribasim-management-coupling-closeout
    paths:
      - 'src/runtime/mod_fmr_hupsel_management_transaction.f90'
      - 'src/runtime/mod_fmr_ribasim_management_binding.f90'
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/fgc/support/fgc44_real_swap_ctypes.py'
      - 'tests/ribasim-management/support/mod_rm13_management_c_bridge.f90'
      - 'tests/ribasim-management/support/rm13_management_ctypes.py'
      - 'tests/ribasim-management/generate_rm13b_real_ribasim.py'
      - 'tests/ribasim-management/test_rm13_real_three_model_transaction.py'
      - 'tests/ribasim-management/run_rm13b_real_three_model_transaction.sh'
      - 'integration/ribasim-management/RM13B_*'
      - '.github/workflows/rm13b-real-three-model-transaction.yml'
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_hupsel_management_transaction.f90'
      - 'src/runtime/mod_fmr_ribasim_management_binding.f90'
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/fgc/support/fgc44_real_swap_ctypes.py'
      - 'tests/ribasim-management/support/mod_rm13_management_c_bridge.f90'
      - 'tests/ribasim-management/support/rm13_management_ctypes.py'
      - 'tests/ribasim-management/generate_rm13b_real_ribasim.py'
      - 'tests/ribasim-management/test_rm13_real_three_model_transaction.py'
      - 'tests/ribasim-management/run_rm13b_real_three_model_transaction.sh'
      - 'integration/ribasim-management/RM13B_*'
      - '.github/workflows/rm13b-real-three-model-transaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Ribasim product release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Deltares/Ribasim
          ref: e7fc8ade52a4bedeec10e508d2065577f33eb76a
          path: .ribasim-product-release
          fetch-depth: 1
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: latest
          working-directory: .ribasim-product-release
      - name: Install compiler and pinned Python coupling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip
          python3 -m pip install             git+https://github.com/Deltares/xmipy.git@9769f8cd4bc6153c71bcc360f602a931b102d902             git+https://github.com/modflowpy/flopy.git@1a783da6582f8203190a8d6b1d7a60659022afdb             netCDF4
      - name: RM13B real three-model qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/ribasim-management/run_rm13b_real_three_model_transaction.sh
