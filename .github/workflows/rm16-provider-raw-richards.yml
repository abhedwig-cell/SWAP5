name: RM16 provider raw Richards isolation

on:
  push:
    branches:
      - work/ribasim-management-coupling-closeout
    paths:
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fgc/support/mod_fgc44_real_swap_c_bridge.f90'
      - 'tests/ribasim-management/test_rm16_provider_raw_richards.py'
      - 'tests/ribasim-management/run_rm16_provider_raw_richards.sh'
      - 'integration/ribasim-management/RM16_*'
      - '.github/workflows/rm16-provider-raw-richards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: RM16 provider and raw Richards isolation
        run: bash tests/ribasim-management/run_rm16_provider_raw_richards.sh
