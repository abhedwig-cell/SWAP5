name: RM26 temporal localization diagnostic

on:
  push:
    branches:
      - work/ribasim-management-coupling-closeout
    paths:
      - '.github/workflows/rm26-temporal-localization-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compiler identity
        run: gfortran --version
      - name: RM26 localization diagnostic
        run: bash tests/ribasim-management/run_rm26_temporal_localization.sh
