name: ROM-PURPOSE P1 Reference qualification

on:
  push:
    branches:
      - work/f-rom-purpose
    paths:
      - 'integration/f-rom/ROM_PURPOSE_P1_REFERENCE_EXECUTION_BINDING.json'

concurrency:
  group: rom-purpose-p1-reference-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  reference:
    name: ${{ matrix.kind }}-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        kind: [surface, gw]
        material: [B01, B14]
        route: [R512_T32, R1024_T32, R2048_T32, R2048_T16, R2048_T8]
        opt: [0, 2]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical
          fetch-depth: 0

      - name: Verify frozen P1 authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5"
          python3 -m py_compile             tests/rom/materialize_rom_purpose_p1_surface_reference.py             tests/rom/materialize_rom_purpose_p1_gw_reference.py             tests/rom/analyze_rom_purpose_p1_reference.py
          python3 - <<'PY'
          import json, subprocess
          p=json.load(open('integration/f-rom/ROM_PURPOSE_P1_PREREGISTRATION.json'))
          b=json.load(open('integration/f-rom/ROM_PURPOSE_P1_REFERENCE_EXECUTION_BINDING.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_ANY_P1_REFERENCE_OR_CANDIDATE_RESPONSE'
          assert p['scientific_firewall']['reference_response_generated'] is False
          assert p['scientific_firewall']['candidate_response_generated'] is False
          assert b['status']=='BOUND_BEFORE_FIRST_P1_REFERENCE_RESPONSE'
          assert b['candidate_response_authorized'] is False
          def blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          for path,expected in b['blobs'].items():
              assert blob(path)==expected,(path,blob(path),expected)
          print('ROM_PURPOSE_P1_REFERENCE_AUTHORITY_LOCK=PASS')
          PY

      - name: Resolve route
        id: cfg
        run: |
          set -euo pipefail
          case "${{ matrix.route }}" in
            R512_T32)  echo "nodes=512" >> "$GITHUB_OUTPUT"; echo "dz=0.3125" >> "$GITHUB_OUTPUT"; echo "factor=32" >> "$GITHUB_OUTPUT" ;;
            R1024_T32) echo "nodes=1024" >> "$GITHUB_OUTPUT"; echo "dz=0.15625" >> "$GITHUB_OUTPUT"; echo "factor=32" >> "$GITHUB_OUTPUT" ;;
            R2048_T32) echo "nodes=2048" >> "$GITHUB_OUTPUT"; echo "dz=0.078125" >> "$GITHUB_OUTPUT"; echo "factor=32" >> "$GITHUB_OUTPUT" ;;
            R2048_T16) echo "nodes=2048" >> "$GITHUB_OUTPUT"; echo "dz=0.078125" >> "$GITHUB_OUTPUT"; echo "factor=16" >> "$GITHUB_OUTPUT" ;;
            R2048_T8)  echo "nodes=2048" >> "$GITHUB_OUTPUT"; echo "dz=0.078125" >> "$GITHUB_OUTPUT"; echo "factor=8" >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac

      - name: Materialize fresh Reference workload
        run: |
          set -euo pipefail
          mkdir -p /tmp/romp1
          factor="${{ steps.cfg.outputs.factor }}"
          kind="${{ matrix.kind }}"
          material="${{ matrix.material }}"
          if [[ "$kind" == "surface" ]]; then
            if [[ "$material" == "B01" ]]; then
              source="tests/rom/rom_purpose_p1_surface_b01_source.f90"
            else
              source="tests/rom/rom_purpose_p1_surface_b14_source.f90"
            fi
            python3 tests/rom/materialize_rom_purpose_p1_surface_reference.py               --source "$source" --material "$material" --temporal-factor "$factor"               --output canonical/tests/rom/test_rom_purpose_p1_reference.f90               --manifest /tmp/romp1/manifest.json
          else
            python3 tests/rom/materialize_rom_purpose_p1_gw_reference.py               --c5a-materializer tests/rom/rom_purpose_p1_base_b14_materializer.py               --c4z-materializer tests/rom/rom_purpose_p1_base_c4z_materializer.py               --source tests/rom/rom_purpose_p1_gw_source.f90               --material "$material" --temporal-factor "$factor"               --output canonical/tests/rom/test_rom_purpose_p1_reference.f90               --manifest /tmp/romp1/manifest.json
          fi

      - name: Build and execute canonical Reference
        run: |
          set -euo pipefail
          kind="${{ matrix.kind }}"
          material="${{ matrix.material }}"
          route="${{ matrix.route }}"
          opt="${{ matrix.opt }}"
          n="${{ steps.cfg.outputs.nodes }}"
          dz="${{ steps.cfg.outputs.dz }}"
          factor="${{ steps.cfg.outputs.factor }}"
          stub="canonical/romp1_${kind}_${material}_${route}_o${opt}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes "$n" --dz-cm "$dz"
          build="/tmp/romp1/build_${kind}_${material}_${route}_o${opt}"
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "romp1_${kind}_${material}_${route}_o${opt}_stubs.f90"             --target tests/rom/test_rom_purpose_p1_reference.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt "$opt"
          mkdir -p evidence
          log="evidence/${kind}_${material}_${route}_o${opt}.txt"
          "$build/rom0_test" > "$log" 2>&1
          if [[ "$kind" == "surface" ]]; then
            grep -Fq 'LAREDYN0R_ROMPURP_P1_SURFACE_REFERENCE_GENERATED=TRUE' "$log"
            grep -Fq 'LAREDYN0R_EXECUTION_COMPLETE=PASS' "$log"
            test "$(grep -c '^LAREDYN0R_STATE|' "$log")" -eq $((4*1024*factor))
            test "$(grep -c '^LAREDYN0R_PROFILE|' "$log")" -eq $((4*1024*16))
            test "$(grep -c '^LAREDYN0R_HISTORY_PASS|' "$log")" -eq 4
          else
            grep -Fq 'LAREGW1_ROMPURP_P1_GW_REFERENCE_GENERATED=TRUE' "$log"
            grep -Fq 'LAREGW1_EXECUTION_COMPLETE=PASS' "$log"
            test "$(grep -c '^LAREGW1_STATE|' "$log")" -eq $((4*1024*factor))
            test "$(grep -c '^LAREGW1_PROFILE|' "$log")" -eq $((4*1024*16))
            test "$(grep -c '^LAREGW1_HISTORY_PASS|' "$log")" -eq 4
          fi
          cp /tmp/romp1/manifest.json evidence/
          sha256sum evidence/* > evidence/sha256.txt
          git -C canonical diff --quiet -- src reference

      - uses: actions/upload-artifact@v4
        with:
          name: romp1-ref-${{ matrix.kind }}-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}
          path: evidence/
          if-no-files-found: error

  analyze:
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: python3 -m pip install --disable-pip-version-check numpy

      - uses: actions/download-artifact@v4
        with:
          pattern: romp1-ref-*
          path: /tmp/romp1/download
          merge-multiple: false

      - name: Reconstruct routes and verify O0/O2 identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/romp1/routes ROM_PURPOSE_P1_REFERENCE_EVIDENCE
          for kind in surface gw; do
            for material in B01 B14; do
              for route in R512_T32 R1024_T32 R2048_T32 R2048_T16 R2048_T8; do
                for opt in 0 2; do
                  src="/tmp/romp1/download/romp1-ref-${kind}-${material}-${route}-o${opt}/${kind}_${material}_${route}_o${opt}.txt"
                  test -s "$src"
                  cp "$src" "/tmp/romp1/routes/${kind}_${material}_${route}_o${opt}.txt"
                done
                cmp "/tmp/romp1/routes/${kind}_${material}_${route}_o0.txt"                     "/tmp/romp1/routes/${kind}_${material}_${route}_o2.txt"
              done
            done
          done
          echo ROM_PURPOSE_P1_O0_O2_IDENTITY=PASS

      - name: Execute frozen Reference qualification
        run: |
          set -euo pipefail
          set +e
          python3 tests/rom/analyze_rom_purpose_p1_reference.py             --prereg integration/f-rom/ROM_PURPOSE_P1_PREREGISTRATION.json             --root /tmp/romp1/routes             --output ROM_PURPOSE_P1_REFERENCE_EVIDENCE/ROM_PURPOSE_P1_REFERENCE_RESULT.json             | tee ROM_PURPOSE_P1_REFERENCE_EVIDENCE/runner.txt
          rc=${PIPESTATUS[0]}
          set -e
          test -s ROM_PURPOSE_P1_REFERENCE_EVIDENCE/ROM_PURPOSE_P1_REFERENCE_RESULT.json
          test "$rc" -eq 0 -o "$rc" -eq 3
          cp integration/f-rom/ROM_PURPOSE_P1_PREREGISTRATION.json ROM_PURPOSE_P1_REFERENCE_EVIDENCE/
          cp integration/f-rom/ROM_PURPOSE_P1_REFERENCE_EXECUTION_BINDING.json ROM_PURPOSE_P1_REFERENCE_EVIDENCE/
          sha256sum ROM_PURPOSE_P1_REFERENCE_EVIDENCE/* > ROM_PURPOSE_P1_REFERENCE_EVIDENCE/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rom-purpose-p1-reference
          path: ROM_PURPOSE_P1_REFERENCE_EVIDENCE/
          if-no-files-found: error
