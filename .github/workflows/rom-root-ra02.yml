name: ROM-ROOT RA02 root-active Reference transfer qualification

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/ROM_ROOT_RA02_BINDING.json'
  workflow_dispatch:

concurrency:
  group: rom-root-ra02-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce RA02-D2 hold
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          b=json.load(open('integration/f-rom/ROM_ROOT_RA02_BINDING.json'))
          assert b['state']=='HELD_PENDING_RA02_D2_ADJUDICATION'
          h=b['execution_hold']
          assert h['scientific_semantics_changed'] is False
          assert h['reduced_candidate_response_generated'] is False
          print('ROM_ROOT_RA02_EXECUTION_HOLD=PASS')
          PY
