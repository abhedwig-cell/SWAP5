  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [base, seg4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check numpy

      - name: Download base routes
        uses: actions/download-artifact@v4
        with:
          pattern: ref01-base-*
          path: /tmp/c6r/base
          merge-multiple: false

      - name: Download R2048 T32 segments
        uses: actions/download-artifact@v4
        with:
          pattern: ref01-seg*
          path: /tmp/c6r/segments
          merge-multiple: false

      - name: Reconstruct all routes and require O0 O2 identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/c6r/routes REF01_EVIDENCE
          for material in B01 B14; do
            for route in R512_T32 R1024_T32 R2048_T16 R2048_T8; do
              for opt in 0 2; do
                full="/tmp/c6r/routes/${material}_${route}_o${opt}.txt"; : > "$full"
                for history in V01 V02 V03 V04; do
                  part="/tmp/c6r/base/ref01-base-${material}-${route}-o${opt}-${history}/${material}_${route}_o${opt}_${history}.txt"
                  test -s "$part"; cat "$part" >> "$full"
                done
              done
              cmp "/tmp/c6r/routes/${material}_${route}_o0.txt" "/tmp/c6r/routes/${material}_${route}_o2.txt"
            done

            for opt in 0 2; do
              full="/tmp/c6r/routes/${material}_R2048_T32_o${opt}.txt"; : > "$full"
              for history in V01 V02 V03 V04; do
                for seg in 1 2 3 4; do
                  part="/tmp/c6r/segments/ref01-seg${seg}-${material}-o${opt}-${history}/${material}_R2048_T32_o${opt}_${history}_seg${seg}.txt"
                  test -s "$part"; cat "$part" >> "$full"
                done
              done
            done
            cmp "/tmp/c6r/routes/${material}_R2048_T32_o0.txt" "/tmp/c6r/routes/${material}_R2048_T32_o2.txt"

            for route in R512_T32 R1024_T32 R2048_T32 R2048_T16 R2048_T8; do
              cp "/tmp/c6r/routes/${material}_${route}_o0.txt" "REF01_EVIDENCE/${material}_${route}_o0.txt"
            done
          done
          echo ROM_ROOT_REF01_O0_O2_IDENTITY=PASS

      - name: Execute unchanged C6R numerical uncertainty metrics
        run: |
          set -euo pipefail
          test "$(git hash-object tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py)" = "bf17f616240d4830ea9ef7bed21b3f57ad9b404a"
          python3 tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py             --prereg integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json             --b01-r512-t32 /tmp/c6r/routes/B01_R512_T32_o0.txt             --b01-r1024-t32 /tmp/c6r/routes/B01_R1024_T32_o0.txt             --b01-r2048-t32 /tmp/c6r/routes/B01_R2048_T32_o0.txt             --b01-r2048-t16 /tmp/c6r/routes/B01_R2048_T16_o0.txt             --b01-r2048-t8 /tmp/c6r/routes/B01_R2048_T8_o0.txt             --b14-r512-t32 /tmp/c6r/routes/B14_R512_T32_o0.txt             --b14-r1024-t32 /tmp/c6r/routes/B14_R1024_T32_o0.txt             --b14-r2048-t32 /tmp/c6r/routes/B14_R2048_T32_o0.txt             --b14-r2048-t16 /tmp/c6r/routes/B14_R2048_T16_o0.txt             --b14-r2048-t8 /tmp/c6r/routes/B14_R2048_T8_o0.txt             --output REF01_EVIDENCE/C6R_NUMERICAL_METRICS.json             | tee REF01_EVIDENCE/c6r_metrics_runner.txt
          mapfile -t ref01_routes < <(find /tmp/c6r/routes -maxdepth 1 -type f -name '*_o0.txt' | sort)
          test "${#ref01_routes[@]}" -eq 10
          python3 tests/rom/analyze_rom_root_ref01.py \
            --prereg integration/f-rom/ROM_ROOT_REF01_PREREGISTRATION.json \
            --metric-result REF01_EVIDENCE/C6R_NUMERICAL_METRICS.json \
            --routes "${ref01_routes[@]}" \
            --output REF01_EVIDENCE/ROM_ROOT_REF01_RESULT.json \
            | tee REF01_EVIDENCE/ref01_runner.txt
          cp integration/f-rom/ROM_ROOT_REF01_PREREGISTRATION.json REF01_EVIDENCE/
          cp integration/f-rom/ROM_ROOT_REF01_BINDING.json REF01_EVIDENCE/
          cp integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json REF01_EVIDENCE/

      - name: Validate REF01 firewall
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('REF01_EVIDENCE/ROM_ROOT_REF01_RESULT.json'))
          assert r['status'] in (
            'QUALIFIED_ROOT_ACTIVE_REFERENCE_UNDER_INDEPENDENT_REPRESENTATION_FLOOR_POLICY',
            'REFERENCE_REMAINS_NOT_QUALIFIED_STOP_BEFORE_REDUCED_RESPONSE'
          )
          f=r['scientific_firewall']
          assert f['reduced_candidate_response_generated'] is False
          assert f['dynamic_root_feedback_executed'] is False
          assert f['application_acceptance_adjudicated'] is False
          assert f['performance_comparison_authorized'] is False
          assert f['production_rom_authorized'] is False
          print('ROM_ROOT_REF01_FIREWALL=PASS')
          PY
          sha256sum REF01_EVIDENCE/* > REF01_EVIDENCE/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rom-root-ref01
          path: REF01_EVIDENCE/
          if-no-files-found: error
