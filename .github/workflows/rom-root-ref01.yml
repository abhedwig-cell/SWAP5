      max-parallel: 16
      matrix:
        material: [B01, B14]
        opt: [0, 2]
        history: [V01, V02, V03, V04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Download prior segment checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ref01-seg3-${{ matrix.material }}-o${{ matrix.opt }}-${{ matrix.history }}
          path: /tmp/c6r_prev

      - name: Verify bound REF01 authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/ROM_ROOT_REF01_BINDING.json'))
          p=json.load(open('integration/f-rom/ROM_ROOT_REF01_PREREGISTRATION.json'))
          assert b['state']=='BOUND_BEFORE_REF01_EXECUTION'
          assert b['scientific_semantics_changed'] is False
          assert b['candidate_response_generated'] is False
          assert p['state']=='PREREGISTERED_BEFORE_REF01_ROOT_ACTIVE_RESPONSE'
          assert p['transferred_policy']['safety_factor']==1.0
          assert p['transferred_policy']['observed_c6r_retry_residuals_used_to_choose_policy'] is False
          assert p['numerical_panel']['max_iterations']==16
          assert p['numerical_panel']['max_abs_transaction_mass_cm']==1e-12
          assert p['external_numerical_authority']['total_balance_floor']['result_blob']=='c06193ca08031f24f9f40a1b6713287b2599926d'
          assert p['external_numerical_authority']['ref_high_policy']['result_blob']=='e6586623ec7c9d9f0d34fb741687deb8601f0615'
          for path,expected in b['implementation_blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          c6r=json.load(open('integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json'))
          assert c6r['phase']=='PREREGISTERED_BEFORE_C6R_REFERENCE_RESPONSE'
          assert c6r['scientific_firewall']['reduced_candidate_response_generated'] is False
          PY
          test "$(git hash-object canonical/src/process/mod_root_water_uptake_process.f90)" = "e6134587cf3c0164bbe09f2f4c87aef6886aaeb3"
          test "$(git hash-object canonical/src/solver/mod_b110_root_sink_provider.f90)" = "ef2d2fd883d116c314b98e8f0f14330150b4778a"
      - name: Resolve material source
        id: cfg
        run: |
          if [[ "${{ matrix.material }}" == "B01" ]]; then
            echo "source=tests/rom/test_lare_dyn0a_reference.f90" >> "$GITHUB_OUTPUT"
          else
            echo "source=tests/rom/test_lare_dyn0a_b14_reference.f90" >> "$GITHUB_OUTPUT"
