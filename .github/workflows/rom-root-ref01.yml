          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes 2048 --dz-cm 0.078125
          build="/tmp/c6r_seg4_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}"
          python3 tests/rom/materialize_lare_bc2_c6r_reference_floor_repair.py \
            --path canonical/src/runtime/mod_fmr_serialized_reference_backend.f90 \
            --manifest /tmp/c6r_reference_floor_repair.json
          if [[ -f canonical/tests/rom/test_lare_bc2_c6r_reference.f90 ]]; then
            ref01_target=canonical/tests/rom/test_lare_bc2_c6r_reference.f90
          else
            ref01_target=canonical/tests/rom/test_lare_bc2_c6r_segment.f90
          fi
          python3 tests/rom/materialize_rom_root_ref01_policy.py --path "$ref01_target"
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "c6r_seg4_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"             --target tests/rom/test_lare_bc2_c6r_segment.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt "${{ matrix.opt }}"
          log="seg/${{ matrix.material }}_R2048_T32_o${{ matrix.opt }}_${{ matrix.history }}_seg4.txt"
          set +e
