          fi

      - name: Materialize R2048 T32 segment 1
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c6r_segmented_reference.py             --base-materializer tests/rom/materialize_lare_bc2_c6r_root_active_reference.py             --source "${{ steps.cfg.outputs.source }}"             --material "${{ matrix.material }}"             --segment-start 1 --segment-end 8192             --output canonical/tests/rom/test_lare_bc2_c6r_segment.f90             --manifest /tmp/c6r_manifest.json

      - name: Execute R2048 T32 segment 1
        env:
          LARE_DYN0A_CASE_FILTER: ${{ matrix.history }}
          C6R_CHECKPOINT_OUT: /tmp/c6r_checkpoint.bin
