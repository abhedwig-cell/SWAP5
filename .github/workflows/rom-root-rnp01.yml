name: ROM-ROOT RNP01 reference numerical characterization

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/ROM_ROOT_RNP01_BINDING.json'
  workflow_dispatch:

concurrency:
  group: rom-root-rnp01-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  characterize:
    name: ${{ matrix.material }}-${{ matrix.route }}-${{ matrix.history }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - material: B01
            history: V02
            route: R512_T32
            nodes: 512
            dz: 0.3125
          - material: B01
            history: V02
            route: R1024_T32
            nodes: 1024
            dz: 0.15625
          - material: B01
            history: V02
            route: R2048_T32
            nodes: 2048
            dz: 0.078125
          - material: B14
            history: V01
            route: R512_T32
            nodes: 512
            dz: 0.3125
          - material: B14
            history: V01
            route: R1024_T32
            nodes: 1024
            dz: 0.15625
          - material: B14
            history: V01
            route: R2048_T32
            nodes: 2048
            dz: 0.078125

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Verify bound RNP01 authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          python3 - <<'PY'
          import json, subprocess
          p=json.load(open('integration/f-rom/ROM_ROOT_RNP01_PREREGISTRATION.json'))
          b=json.load(open('integration/f-rom/ROM_ROOT_RNP01_BINDING.json'))
          assert p['state']=='PREREGISTERED_BEFORE_RNP01_DIAGNOSTIC_RESPONSE'
          assert b['state']=='BOUND_BEFORE_RNP01_EXECUTION'
          assert b['scientific_semantics_changed'] is False
          assert b['reduced_candidate_response_generated'] is False
          for path, expected in b['implementation_blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY
          test "$(git hash-object canonical/src/process/mod_root_water_uptake_process.f90)" = "e6134587cf3c0164bbe09f2f4c87aef6886aaeb3"
          test "$(git hash-object canonical/src/solver/mod_b110_root_sink_provider.f90)" = "ef2d2fd883d116c314b98e8f0f14330150b4778a"

      - name: Resolve material source
        id: cfg
        run: |
          if [[ "${{ matrix.material }}" == "B01" ]]; then
            echo "source=tests/rom/test_lare_dyn0a_reference.f90" >> "$GITHUB_OUTPUT"
          else
            echo "source=tests/rom/test_lare_dyn0a_b14_reference.f90" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize RNP01 diagnostic case
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c6r_root_active_reference.py             --source "${{ steps.cfg.outputs.source }}"             --material "${{ matrix.material }}"             --temporal-factor 32             --output /tmp/rnp01_root.f90             --manifest /tmp/root_manifest.json
          python3 tests/rom/diagnose_lare_bc2_c6r_root_active_failure.py             --input /tmp/rnp01_root.f90             --output /tmp/rnp01_diag.f90
          python3 tests/rom/materialize_rom_root_rnp01_diagnostic.py             --input /tmp/rnp01_diag.f90             --output canonical/tests/rom/test_rom_root_rnp01.f90

      - name: Execute exact failed-interval characterization
        env:
          LARE_DYN0A_CASE_FILTER: ${{ matrix.history }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          stub="canonical/rnp01_${{ matrix.material }}_${{ matrix.route }}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes "${{ matrix.nodes }}" --dz-cm "${{ matrix.dz }}"
          python3 tests/rom/materialize_lare_bc2_c6r_reference_floor_repair.py             --path canonical/src/runtime/mod_fmr_serialized_reference_backend.f90             --manifest evidence/reference_floor_repair.json
          build="/tmp/rnp01_${{ matrix.material }}_${{ matrix.route }}_${{ matrix.history }}"
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "rnp01_${{ matrix.material }}_${{ matrix.route }}_stubs.f90"             --target tests/rom/test_rom_root_rnp01.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt 0
          log="evidence/${{ matrix.material }}_${{ matrix.route }}_${{ matrix.history }}.txt"
          set +e
          "$build/rom0_test" > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          test "$rc" -ne 0
          grep -Fq 'RNP01_PRIMARY|' "$log"
          test "$(grep -c '^RNP01_SHADOW|' "$log")" -eq 2
          test "$(grep -c '^RNP01_RESIDUAL|' "$log")" -eq "${{ matrix.nodes }}"
          cp /tmp/root_manifest.json evidence/
          sha256sum evidence/* > evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rnp01-${{ matrix.material }}-${{ matrix.route }}-${{ matrix.history }}
          path: evidence/
          if-no-files-found: error

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: characterize
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: rnp01-*
          path: /tmp/rnp01
          merge-multiple: true

      - name: Analyze frozen RNP01 diagnostics
        run: |
          set -euo pipefail
          mkdir -p RNP01_EVIDENCE
          mapfile -t logs < <(find /tmp/rnp01 -maxdepth 1 -type f -name '*.txt' | sort)
          test "${#logs[@]}" -eq 6
          python3 tests/rom/analyze_rom_root_rnp01.py             --prereg integration/f-rom/ROM_ROOT_RNP01_PREREGISTRATION.json             --logs "${logs[@]}"             --output RNP01_EVIDENCE/ROM_ROOT_RNP01_RESULT.json             | tee RNP01_EVIDENCE/runner.txt
          cp integration/f-rom/ROM_ROOT_RNP01_PREREGISTRATION.json RNP01_EVIDENCE/
          cp integration/f-rom/ROM_ROOT_RNP01_BINDING.json RNP01_EVIDENCE/
          sha256sum RNP01_EVIDENCE/* > RNP01_EVIDENCE/sha256.txt

      - name: Enforce firewall
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('RNP01_EVIDENCE/ROM_ROOT_RNP01_RESULT.json'))
          assert r['status']=='CHARACTERIZATION_COMPLETE_NO_POLICY_DECISION'
          assert r['policy_decision_authorized'] is False
          assert r['c6r_reopened'] is False
          assert r['reduced_candidate_response_generated'] is False
          assert r['production_source_changed'] is False
          print('ROM_ROOT_RNP01_FIREWALL=PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: rom-root-rnp01
          path: RNP01_EVIDENCE/
          if-no-files-found: error
