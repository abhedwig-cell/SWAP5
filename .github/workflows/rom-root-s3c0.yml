          name: s3c0-seg4-${{ matrix.material }}-o${{ matrix.opt }}-${{ matrix.history }}
          path: seg/
          if-no-files-found: error


  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [base, seg4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check numpy

      - name: Download base routes
        uses: actions/download-artifact@v4
        with:
          pattern: s3c0-base-*
          path: /tmp/s3c0/base
          merge-multiple: false

      - name: Download R2048 T32 segments
        uses: actions/download-artifact@v4
        with:
          pattern: s3c0-seg*
          path: /tmp/s3c0/segments
          merge-multiple: false

      - name: Reconstruct all routes and require O0 O2 identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/s3c0/routes S3C0_EVIDENCE
          for material in B01 B14; do
            for route in R512_T32 R1024_T32 R2048_T16 R2048_T8; do
              for opt in 0 2; do
                full="/tmp/s3c0/routes/${material}_${route}_o${opt}.txt"; : > "$full"
                for history in V01 V02 V03 V04; do
                  part="/tmp/s3c0/base/s3c0-base-${material}-${route}-o${opt}-${history}/${material}_${route}_o${opt}_${history}.txt"
                  test -s "$part"; cat "$part" >> "$full"
                done
              done
              cmp "/tmp/s3c0/routes/${material}_${route}_o0.txt" "/tmp/s3c0/routes/${material}_${route}_o2.txt"
            done

            for opt in 0 2; do
              full="/tmp/s3c0/routes/${material}_R2048_T32_o${opt}.txt"; : > "$full"
              for history in V01 V02 V03 V04; do
                for seg in 1 2 3 4; do
                  part="/tmp/s3c0/segments/s3c0-seg${seg}-${material}-o${opt}-${history}/${material}_R2048_T32_o${opt}_${history}_seg${seg}.txt"
                  test -s "$part"; cat "$part" >> "$full"
                done
              done
            done
            cmp "/tmp/s3c0/routes/${material}_R2048_T32_o0.txt" "/tmp/s3c0/routes/${material}_R2048_T32_o2.txt"

            for route in R512_T32 R1024_T32 R2048_T32 R2048_T16 R2048_T8; do
              cp "/tmp/s3c0/routes/${material}_${route}_o0.txt" "S3C0_EVIDENCE/${material}_${route}_o0.txt"
            done
          done
          echo RA02R_O0_O2_IDENTITY=PASS

      - name: Execute frozen uncertainty analysis and RA02R wrapper
        run: |
          set -euo pipefail
          test "$(git hash-object tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py)" = "bf17f616240d4830ea9ef7bed21b3f57ad9b404a"
          python3 tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py             --prereg integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json             --b01-r512-t32 /tmp/s3c0/routes/B01_R512_T32_o0.txt             --b01-r1024-t32 /tmp/s3c0/routes/B01_R1024_T32_o0.txt             --b01-r2048-t32 /tmp/s3c0/routes/B01_R2048_T32_o0.txt             --b01-r2048-t16 /tmp/s3c0/routes/B01_R2048_T16_o0.txt             --b01-r2048-t8 /tmp/s3c0/routes/B01_R2048_T8_o0.txt             --b14-r512-t32 /tmp/s3c0/routes/B14_R512_T32_o0.txt             --b14-r1024-t32 /tmp/s3c0/routes/B14_R1024_T32_o0.txt             --b14-r2048-t32 /tmp/s3c0/routes/B14_R2048_T32_o0.txt             --b14-r2048-t16 /tmp/s3c0/routes/B14_R2048_T16_o0.txt             --b14-r2048-t8 /tmp/s3c0/routes/B14_R2048_T8_o0.txt             --output S3C0_EVIDENCE/RAW_C6R_UNCERTAINTY_RESULT.json             | tee S3C0_EVIDENCE/frozen_analyzer_runner.txt
          python3 tests/rom/analyze_rom_root_s3c0_reference.py --raw S3C0_EVIDENCE/RAW_C6R_UNCERTAINTY_RESULT.json --s3-prereg integration/f-rom/ROM_ROOT_S3_PREREGISTRATION.json --b01-target /tmp/s3c0/routes/B01_R2048_T32_o0.txt --b14-target /tmp/s3c0/routes/B14_R2048_T32_o0.txt --output S3C0_EVIDENCE/ROM_ROOT_S3C0_RESULT.json | tee S3C0_EVIDENCE/s3c0_runner.txt
          cat S3C0_EVIDENCE/ROM_ROOT_S3C0_RESULT.json
          cp integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json S3C0_EVIDENCE/
          cp integration/f-rom/ROM_ROOT_RA02R_PREREGISTRATION.json S3C0_EVIDENCE/
          cp integration/f-rom/ROM_ROOT_RA02R_BINDING.json S3C0_EVIDENCE/
          cp integration/f-rom/ROM_ROOT_S3_PREREGISTRATION.json S3C0_EVIDENCE/
          cp integration/f-rom/ROM_ROOT_S3C0_BINDING.json S3C0_EVIDENCE/

      - name: Validate Stage 3 C0 firewall
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('S3C0_EVIDENCE/ROM_ROOT_S3C0_RESULT.json'))
          assert r['status'] in (
            'S3C0_FULL_POTENTIAL_REFERENCE_QUALIFIED',
            'S3C0_FULL_POTENTIAL_REFERENCE_NOT_QUALIFIED'
          )
          f=r['scientific_firewall']
          assert f['ra02r_reclassified'] is False
          assert f['reduced_dynamic_feedback_response_generated'] is False
          assert f['new_root_specific_state_selected'] is False
          assert f['application_acceptance_adjudicated'] is False
          assert f['performance_comparison_authorized'] is False
          assert f['production_rom_authorized'] is False
          print('ROM_ROOT_S3C0_FIREWALL=PASS')
          PY
          sha256sum S3C0_EVIDENCE/* > S3C0_EVIDENCE/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rom-root-s3c0
          path: S3C0_EVIDENCE/
          if-no-files-found: error
