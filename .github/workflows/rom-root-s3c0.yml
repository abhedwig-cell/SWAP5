name: ROM-ROOT Stage 3 C0 full-potential Reference qualification

on:
  push:
    branches:
      - work/f-rom-lare-rs1
    paths:
      - 'integration/f-rom/ROM_ROOT_S3C0_BINDING.json'
  workflow_dispatch:

concurrency:
  group: rom-root-s3c0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  base:
    name: base-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-${{ matrix.history }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        material: [B01, B14]
        route: [R512_T32, R1024_T32, R2048_T16, R2048_T8]
        opt: [0, 2]
        history: [V01, V02, V03, V04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Verify frozen RA02R authority
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/ROM_ROOT_RA02R_BINDING.json'))
          rp=json.load(open('integration/f-rom/ROM_ROOT_RA02R_PREREGISTRATION.json'))
          assert rp['state']=='PREREGISTERED_BEFORE_RA02R_REFERENCE_RESPONSE'
          assert b['state']=='BOUND_BEFORE_RA02R_EXECUTION'
          assert b['c6r_physics_changed'] is False
          assert b['candidate_response_generated'] is False
          checks={
            'tests/rom/materialize_rom_root_ra02r_reference_policy.py':b['implementation']['policy_materializer_blob'],
            'tests/rom/materialize_rom_root_ra02r_stress_panel.py':b['implementation']['stress_materializer_blob'],
            'tests/rom/analyze_rom_root_ra02r_stress_reference.py':b['implementation']['wrapper_analyzer_blob'],
            '.github/workflows/rom-root-ra02r.yml':b['implementation']['workflow_blob'],
          }
          for path,expected in checks.items():
            got=subprocess.check_output(['git','hash-object',path],text=True).strip()
            assert got==expected,(path,got,expected)
          PY
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_root_active_reference.py)" = "4f1d330a51cf0829816c64e140b0a5fd806b09d1"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_segmented_reference.py)" = "7b0654958b19a071649405da87f300c1fe86a0c7"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py)" = "bf17f616240d4830ea9ef7bed21b3f57ad9b404a"
          test "$(git hash-object canonical/src/process/mod_root_water_uptake_process.f90)" = "e6134587cf3c0164bbe09f2f4c87aef6886aaeb3"
          test "$(git hash-object canonical/src/solver/mod_b110_root_sink_provider.f90)" = "ef2d2fd883d116c314b98e8f0f14330150b4778a"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_reference_floor_repair.py)" = "b20f451c597aa0d24ad4be44e561f58ddb1e7f34"

          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json'))
          q=json.load(open('integration/f-rom/LARE_BC2_C6Q_RECONCILIATION.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C6R_REFERENCE_RESPONSE'
          assert p['implementation_binding']['state']=='BOUND_BEFORE_EXECUTION'
          assert p['implementation_binding']['execution_binding_complete'] is True
          assert q['decision']=='PREREGISTER_ROOT_ACTIVE_REFERENCE_ONLY_BEFORE_ANY_REDUCED_DYNAMIC_ROOT_FEEDBACK_RESPONSE'
          assert p['scientific_firewall']['reduced_candidate_response_generated'] is False
          import subprocess
          blob=subprocess.check_output(['git','hash-object','.github/workflows/f-rom-lare-bc2-c6r.yml'],text=True).strip()
          assert blob==p['implementation_binding']['workflow_blob']
          PY

      - name: Verify Stage 3 C0 binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open('integration/f-rom/ROM_ROOT_S3_PREREGISTRATION.json'))
          b=json.load(open('integration/f-rom/ROM_ROOT_S3C0_BINDING.json'))
          assert p['state']=='PREREGISTERED_BEFORE_ANY_STAGE3_REDUCED_DYNAMIC_FEEDBACK_RESPONSE'
          assert b['state']=='BOUND_BEFORE_S3C0_EXECUTION'
          assert b['reduced_dynamic_feedback_response_generated'] is False
          for path,expected in b['implementation_blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY

      - name: Resolve route and source
        id: cfg
        run: |
          case "${{ matrix.route }}" in
            R512_T32)  echo "nodes=512" >> "$GITHUB_OUTPUT"; echo "dz=0.3125" >> "$GITHUB_OUTPUT"; echo "factor=32" >> "$GITHUB_OUTPUT" ;;
            R1024_T32) echo "nodes=1024" >> "$GITHUB_OUTPUT"; echo "dz=0.15625" >> "$GITHUB_OUTPUT"; echo "factor=32" >> "$GITHUB_OUTPUT" ;;
            R2048_T16) echo "nodes=2048" >> "$GITHUB_OUTPUT"; echo "dz=0.078125" >> "$GITHUB_OUTPUT"; echo "factor=16" >> "$GITHUB_OUTPUT" ;;
            R2048_T8)  echo "nodes=2048" >> "$GITHUB_OUTPUT"; echo "dz=0.078125" >> "$GITHUB_OUTPUT"; echo "factor=8" >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac
          if [[ "${{ matrix.material }}" == "B01" ]]; then
            echo "source=tests/rom/test_lare_dyn0a_reference.f90" >> "$GITHUB_OUTPUT"
          else
            echo "source=tests/rom/test_lare_dyn0a_b14_reference.f90" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize RA02R root-active Reference
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c6r_root_active_reference.py             --source "${{ steps.cfg.outputs.source }}"             --material "${{ matrix.material }}"             --temporal-factor "${{ steps.cfg.outputs.factor }}"             --output canonical/tests/rom/test_lare_bc2_c6r_reference.f90             --manifest /tmp/c6r_manifest.json
          python3 tests/rom/materialize_rom_root_ra02r_stress_panel.py --input canonical/tests/rom/test_lare_bc2_c6r_reference.f90 --output canonical/tests/rom/test_lare_bc2_c6r_reference.f90 --material "${{ matrix.material }}" --manifest /tmp/s3c0_stress.json
          python3 tests/rom/materialize_rom_root_ra02r_reference_policy.py --input canonical/tests/rom/test_lare_bc2_c6r_reference.f90 --output canonical/tests/rom/test_lare_bc2_c6r_reference.f90 --manifest /tmp/s3c0_policy.json
          python3 tests/rom/materialize_rom_root_s3c0_full_potential_reference.py --input canonical/tests/rom/test_lare_bc2_c6r_reference.f90 --output canonical/tests/rom/test_lare_bc2_c6r_reference.f90 --manifest /tmp/s3c0_control.json

      - name: Execute RA02R root-active Reference
        env:
          LARE_DYN0A_CASE_FILTER: ${{ matrix.history }}
        run: |
          set -euo pipefail
          mkdir -p route
          n="${{ steps.cfg.outputs.nodes }}"; dz="${{ steps.cfg.outputs.dz }}"; factor="${{ steps.cfg.outputs.factor }}"
          stub="canonical/c6r_${{ matrix.material }}_${{ matrix.route }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes "$n" --dz-cm "$dz"
          build="/tmp/c6r_${{ matrix.material }}_${{ matrix.route }}_o${{ matrix.opt }}_${{ matrix.history }}"
          python3 tests/rom/materialize_lare_bc2_c6r_reference_floor_repair.py \
            --path canonical/src/runtime/mod_fmr_serialized_reference_backend.f90 \
            --manifest /tmp/c6r_reference_floor_repair.json
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "c6r_${{ matrix.material }}_${{ matrix.route }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"             --target tests/rom/test_lare_bc2_c6r_reference.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt "${{ matrix.opt }}"
          log="route/${{ matrix.material }}_${{ matrix.route }}_o${{ matrix.opt }}_${{ matrix.history }}.txt"
          set +e
          "$build/rom0_test" > "$log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            cat "$log"
            exit "$rc"
          fi
          grep -Fq 'LAREDYN0R_C6R_ROOT_ACTIVE_REFERENCE_GENERATED=TRUE' "$log"
          grep -Fq 'LAREDYN0R_EXECUTION_COMPLETE=PASS' "$log"
          grep -Fq 'ROM_ROOT_RA02R_STRESS_PANEL=TRUE' "$log"
          grep -Fq 'ROM_ROOT_RA02R_P2E20_REPRESENTATION_FLOOR=TRUE' "$log"
          grep -Fq 'ROM_ROOT_S3C0_FULL_POTENTIAL_REFERENCE=TRUE' "$log"
          expected_states=$((1024*factor))
          test "$(grep -c '^LAREDYN0R_STATE|' "$log")" -eq "$expected_states"
          test "$(grep -c '^LAREDYN0R_PROFILE|' "$log")" -eq 16384
          test "$(grep -c '^LAREDYN0R_ROOT|' "$log")" -eq 1024
          test "$(grep -c '^LAREDYN0R_FALLBACK|' "$log")" -eq 0
          python3 - "$log" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREDYN0R_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None and abs(float(m.group(1))) <= 1e-12
          PY
          cp /tmp/c6r_manifest.json route/
          cp /tmp/s3c0_stress.json route/
          cp /tmp/s3c0_policy.json route/
          cp /tmp/s3c0_control.json route/
          sha256sum route/* > route/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: s3c0-base-${{ matrix.material }}-${{ matrix.route }}-o${{ matrix.opt }}-${{ matrix.history }}
          path: route/
          if-no-files-found: error

  seg1:
    name: seg1-${{ matrix.material }}-o${{ matrix.opt }}-${{ matrix.history }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        material: [B01, B14]
        opt: [0, 2]
        history: [V01, V02, V03, V04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Verify RA02R segmented binding
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/ROM_ROOT_RA02R_BINDING.json'))
          rp=json.load(open('integration/f-rom/ROM_ROOT_RA02R_PREREGISTRATION.json'))
          assert rp['state']=='PREREGISTERED_BEFORE_RA02R_REFERENCE_RESPONSE'
          assert b['state']=='BOUND_BEFORE_RA02R_EXECUTION'
          assert b['c6r_physics_changed'] is False
          assert b['candidate_response_generated'] is False
          checks={
            'tests/rom/materialize_rom_root_ra02r_reference_policy.py':b['implementation']['policy_materializer_blob'],
            'tests/rom/materialize_rom_root_ra02r_stress_panel.py':b['implementation']['stress_materializer_blob'],
            'tests/rom/analyze_rom_root_ra02r_stress_reference.py':b['implementation']['wrapper_analyzer_blob'],
            '.github/workflows/rom-root-ra02r.yml':b['implementation']['workflow_blob'],
          }
          for path,expected in checks.items():
            got=subprocess.check_output(['git','hash-object',path],text=True).strip()
            assert got==expected,(path,got,expected)
          PY
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_root_active_reference.py)" = "4f1d330a51cf0829816c64e140b0a5fd806b09d1"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_segmented_reference.py)" = "7b0654958b19a071649405da87f300c1fe86a0c7"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py)" = "bf17f616240d4830ea9ef7bed21b3f57ad9b404a"
          test "$(git hash-object canonical/src/process/mod_root_water_uptake_process.f90)" = "e6134587cf3c0164bbe09f2f4c87aef6886aaeb3"
          test "$(git hash-object canonical/src/solver/mod_b110_root_sink_provider.f90)" = "ef2d2fd883d116c314b98e8f0f14330150b4778a"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_reference_floor_repair.py)" = "b20f451c597aa0d24ad4be44e561f58ddb1e7f34"

          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C6R_REFERENCE_RESPONSE'
          assert p['implementation_binding']['state']=='BOUND_BEFORE_EXECUTION'
          assert p['implementation_binding']['execution_binding_complete'] is True
          assert p['implementation_binding']['response_based_design'] is False
          import subprocess
          blob=subprocess.check_output(['git','hash-object','.github/workflows/f-rom-lare-bc2-c6r.yml'],text=True).strip()
          assert blob==p['implementation_binding']['workflow_blob']
          assert p['scientific_firewall']['reduced_candidate_response_generated'] is False
          PY

      - name: Verify Stage 3 C0 binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open('integration/f-rom/ROM_ROOT_S3_PREREGISTRATION.json'))
          b=json.load(open('integration/f-rom/ROM_ROOT_S3C0_BINDING.json'))
          assert p['state']=='PREREGISTERED_BEFORE_ANY_STAGE3_REDUCED_DYNAMIC_FEEDBACK_RESPONSE'
          assert b['state']=='BOUND_BEFORE_S3C0_EXECUTION'
          assert b['reduced_dynamic_feedback_response_generated'] is False
          for path,expected in b['implementation_blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          PY

      - name: Resolve material source
        id: cfg
        run: |
          if [[ "${{ matrix.material }}" == "B01" ]]; then
            echo "source=tests/rom/test_lare_dyn0a_reference.f90" >> "$GITHUB_OUTPUT"
          else
            echo "source=tests/rom/test_lare_dyn0a_b14_reference.f90" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize R2048 T32 segment 1
        run: |
          set -euo pipefail
          python3 tests/rom/materialize_lare_bc2_c6r_segmented_reference.py             --base-materializer tests/rom/materialize_lare_bc2_c6r_root_active_reference.py             --source "${{ steps.cfg.outputs.source }}"             --material "${{ matrix.material }}"             --segment-start 1 --segment-end 8192             --output canonical/tests/rom/test_lare_bc2_c6r_segment.f90             --manifest /tmp/c6r_manifest.json
          python3 tests/rom/materialize_rom_root_ra02r_stress_panel.py --input canonical/tests/rom/test_lare_bc2_c6r_segment.f90 --output canonical/tests/rom/test_lare_bc2_c6r_segment.f90 --material "${{ matrix.material }}" --manifest /tmp/s3c0_stress.json
          python3 tests/rom/materialize_rom_root_ra02r_reference_policy.py --input canonical/tests/rom/test_lare_bc2_c6r_segment.f90 --output canonical/tests/rom/test_lare_bc2_c6r_segment.f90 --manifest /tmp/s3c0_policy.json
          python3 tests/rom/materialize_rom_root_s3c0_full_potential_reference.py --input canonical/tests/rom/test_lare_bc2_c6r_segment.f90 --output canonical/tests/rom/test_lare_bc2_c6r_segment.f90 --manifest /tmp/s3c0_control.json

      - name: Execute R2048 T32 segment 1
        env:
          LARE_DYN0A_CASE_FILTER: ${{ matrix.history }}
          C6R_CHECKPOINT_OUT: /tmp/c6r_checkpoint.bin
        run: |
          set -euo pipefail
          mkdir -p seg
          stub="canonical/c6r_seg1_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"
          python3 canonical/tests/rom/materialize_f_rom0_headcalc_stubs.py             --source canonical/tests/fsi/fsi04_real_headcalc_stubs.f90             --output "$stub" --nodes 2048 --dz-cm 0.078125
          build="/tmp/c6r_seg1_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}"
          python3 tests/rom/materialize_lare_bc2_c6r_reference_floor_repair.py \
            --path canonical/src/runtime/mod_fmr_serialized_reference_backend.f90 \
            --manifest /tmp/c6r_reference_floor_repair.json
          python3 canonical/tests/rom/compile_f_rom0_fortran_closure.py             --root canonical             --stub "c6r_seg1_${{ matrix.material }}_o${{ matrix.opt }}_${{ matrix.history }}_stubs.f90"             --target tests/rom/test_lare_bc2_c6r_segment.f90             --external-source src/legacy/b1_10_port/headcalc.f90             --build "$build" --opt "${{ matrix.opt }}"
          log="seg/${{ matrix.material }}_R2048_T32_o${{ matrix.opt }}_${{ matrix.history }}_seg1.txt"
          set +e
          "$build/rom0_test" > "$log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            cat "$log"
            exit "$rc"
          fi
          grep -Fq 'LAREDYN0R_C6R_SEGMENTED_ROOT_ACTIVE_REFERENCE_GENERATED=TRUE' "$log"
          grep -Fq 'LAREDYN0R_EXECUTION_COMPLETE=PASS' "$log"
          grep -Fq 'ROM_ROOT_RA02R_STRESS_PANEL=TRUE' "$log"
          grep -Fq 'ROM_ROOT_RA02R_P2E20_REPRESENTATION_FLOOR=TRUE' "$log"
          grep -Fq 'ROM_ROOT_S3C0_FULL_POTENTIAL_REFERENCE=TRUE' "$log"
          test "$(grep -c '^LAREDYN0R_STATE|' "$log")" -eq 8192
          test "$(grep -c '^LAREDYN0R_PROFILE|' "$log")" -eq 4096
          test "$(grep -c '^LAREDYN0R_ROOT|' "$log")" -eq 256
          test "$(grep -c '^LAREDYN0R_FALLBACK|' "$log")" -eq 0
          test -s /tmp/c6r_checkpoint.bin
          python3 - "$log" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'LAREDYN0R_MAX_ABS_MASS=([^\n]+)',raw)
          assert m is not None and abs(float(m.group(1))) <= 1e-12
          PY
          cp /tmp/c6r_checkpoint.bin seg/checkpoint.bin
          cp /tmp/c6r_manifest.json seg/
          cp /tmp/s3c0_stress.json seg/
          cp /tmp/s3c0_policy.json seg/
          cp /tmp/s3c0_control.json seg/
          sha256sum seg/* > seg/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: s3c0-seg1-${{ matrix.material }}-o${{ matrix.opt }}-${{ matrix.history }}
          path: seg/
          if-no-files-found: error


  seg2:
    name: seg2-${{ matrix.material }}-o${{ matrix.opt }}-${{ matrix.history }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: seg1
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        material: [B01, B14]
        opt: [0, 2]
        history: [V01, V02, V03, V04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1caa431002d5c128c73cfcfbd31af4cc39ee9f12
          path: canonical
          fetch-depth: 0

      - name: Download prior segment checkpoint
        uses: actions/download-artifact@v4
        with:
          name: s3c0-seg1-${{ matrix.material }}-o${{ matrix.opt }}-${{ matrix.history }}
          path: /tmp/c6r_prev

      - name: Verify RA02R segmented binding
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "1caa431002d5c128c73cfcfbd31af4cc39ee9f12"
          python3 - <<'PY'
          import json,subprocess
          b=json.load(open('integration/f-rom/ROM_ROOT_RA02R_BINDING.json'))
          rp=json.load(open('integration/f-rom/ROM_ROOT_RA02R_PREREGISTRATION.json'))
          assert rp['state']=='PREREGISTERED_BEFORE_RA02R_REFERENCE_RESPONSE'
          assert b['state']=='BOUND_BEFORE_RA02R_EXECUTION'
          assert b['c6r_physics_changed'] is False
          assert b['candidate_response_generated'] is False
          checks={
            'tests/rom/materialize_rom_root_ra02r_reference_policy.py':b['implementation']['policy_materializer_blob'],
            'tests/rom/materialize_rom_root_ra02r_stress_panel.py':b['implementation']['stress_materializer_blob'],
            'tests/rom/analyze_rom_root_ra02r_stress_reference.py':b['implementation']['wrapper_analyzer_blob'],
            '.github/workflows/rom-root-ra02r.yml':b['implementation']['workflow_blob'],
          }
          for path,expected in checks.items():
            got=subprocess.check_output(['git','hash-object',path],text=True).strip()
            assert got==expected,(path,got,expected)
          PY
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_root_active_reference.py)" = "4f1d330a51cf0829816c64e140b0a5fd806b09d1"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_segmented_reference.py)" = "7b0654958b19a071649405da87f300c1fe86a0c7"
          test "$(git hash-object tests/rom/analyze_lare_bc2_c6r_reference_uncertainty.py)" = "bf17f616240d4830ea9ef7bed21b3f57ad9b404a"
          test "$(git hash-object canonical/src/process/mod_root_water_uptake_process.f90)" = "e6134587cf3c0164bbe09f2f4c87aef6886aaeb3"
          test "$(git hash-object canonical/src/solver/mod_b110_root_sink_provider.f90)" = "ef2d2fd883d116c314b98e8f0f14330150b4778a"
          test "$(git hash-object tests/rom/materialize_lare_bc2_c6r_reference_floor_repair.py)" = "b20f451c597aa0d24ad4be44e561f58ddb1e7f34"

          python3 - <<'PY'
          import json
          p=json.load(open('integration/f-rom/LARE_BC2_C6R_PREREGISTRATION.json'))
          assert p['phase']=='PREREGISTERED_BEFORE_C6R_REFERENCE_RESPONSE'
          assert p['implementation_binding']['response_based_design'] is False
          assert p['scientific_firewall']['reduced_candidate_response_generated'] is False
          PY

      - name: Verify Stage 3 C0 binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open('integration/f-rom/ROM_ROOT_S3_PREREGISTRATION.json'))
          b=json.load(open('integration/f-rom/ROM_ROOT_S3C0_BINDING.json'))
          assert p['state']=='PREREGISTERED_BEFORE_ANY_STAGE3_REDUCED_DYNAMIC_FEEDBACK_RESPONSE'
