name: ROM1A-D1 strict mode2 failure diagnostic

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/ROM1AD1_*'
      - 'docs/science/ROM1AD1_*'
      - 'tests/rom/test_rom1ad1_mode2_failure_diagnostic.f90'
      - 'tests/rom/analyze_rom1ad1_mode2_failure_diagnostic.py'
      - 'tests/rom/run_rom1ad1_mode2_failure_diagnostic.sh'
      - '.github/workflows/rom1ad1-mode2-failure-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom1ad1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gfortran --version
      - name: Execute frozen D01 step21 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ROM1AD1_EVIDENCE
          ROM1AD1_EVIDENCE_DIR="$PWD/ROM1AD1_EVIDENCE"             bash tests/rom/run_rom1ad1_mode2_failure_diagnostic.sh | tee ROM1AD1_EVIDENCE/gate.txt
      - name: Preserve D1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom1ad1-${{ github.run_id }}
          path: ROM1AD1_EVIDENCE
          if-no-files-found: warn
