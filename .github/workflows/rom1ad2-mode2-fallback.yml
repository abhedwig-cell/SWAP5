name: ROM1A-D2 mode2 fail-closed fallback

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/ROM1AD2_*'
      - 'integration/f-rom/ROM1AD1_STATUS.json'
      - 'docs/science/ROM1AD2_*'
      - 'tests/rom/test_rom1ad2_mode2_fallback.f90'
      - 'tests/rom/analyze_rom1ad2_mode2_fallback.py'
      - 'tests/rom/run_rom1ad2_mode2_fallback.sh'
      - '.github/workflows/rom1ad2-mode2-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom1ad2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gfortran --version
      - name: Execute mode2 strict-first fallback qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ROM1AD2_EVIDENCE
          ROM1AD2_EVIDENCE_DIR="$PWD/ROM1AD2_EVIDENCE"             bash tests/rom/run_rom1ad2_mode2_fallback.sh | tee ROM1AD2_EVIDENCE/gate.txt
      - name: Preserve D2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom1ad2-${{ github.run_id }}
          path: ROM1AD2_EVIDENCE
          if-no-files-found: warn
