name: ROM1A-R1-D2 local integrated allowance

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/ROM1AR1D2_*'
      - 'integration/f-rom/ROM1AR1D1_STATUS.json'
      - 'docs/science/ROM1AR1D2_*'
      - 'tests/rom/analyze_rom1ar1d2_local_allowance.py'
      - 'tests/rom/run_rom1ar1d2_local_allowance.sh'
      - '.github/workflows/rom1ar1d2-local-allowance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom1ar1d2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gfortran --version
      - name: Measure D08 local residual against prior integrated allowance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ROM1AR1D2_EVIDENCE
          ROM1AR1D2_EVIDENCE_DIR="$PWD/ROM1AR1D2_EVIDENCE"             bash tests/rom/run_rom1ar1d2_local_allowance.sh | tee ROM1AR1D2_EVIDENCE/gate.txt
      - name: Preserve D2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom1ar1d2-${{ github.run_id }}
          path: ROM1AR1D2_EVIDENCE
          if-no-files-found: warn
