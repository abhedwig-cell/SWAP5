name: ROM1A-R1-D3 discovery local-plus-total fallback

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/ROM1AR1D3_*'
      - 'integration/f-rom/ROM1AR1D2_STATUS.json'
      - 'docs/science/ROM1AR1D3_*'
      - 'tests/rom/test_rom1ar1d3_discovery_fallback.f90'
      - 'tests/rom/analyze_rom1ar1d3_discovery_fallback.py'
      - 'tests/rom/run_rom1ar1d3_discovery_fallback.sh'
      - '.github/workflows/rom1ar1d3-discovery-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom1ar1d3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gfortran --version
      - name: Execute discovery-only policy qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ROM1AR1D3_EVIDENCE
          ROM1AR1D3_EVIDENCE_DIR="$PWD/ROM1AR1D3_EVIDENCE"             bash tests/rom/run_rom1ar1d3_discovery_fallback.sh | tee ROM1AR1D3_EVIDENCE/gate.txt
      - name: Preserve D3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom1ar1d3-${{ github.run_id }}
          path: ROM1AR1D3_EVIDENCE
          if-no-files-found: warn
