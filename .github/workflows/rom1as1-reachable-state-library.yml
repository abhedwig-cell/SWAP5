name: ROM1A-S1 successor reachable-state library

on:
  push:
    branches:
      - work/f-rom0-close-expand-accepted-domain
    paths:
      - 'integration/f-rom/ROM1AS1_*'
      - 'integration/f-rom/ROM1AD2_STATUS.json'
      - 'docs/science/ROM1AS1_*'
      - 'tests/rom/test_rom1as1_reachable_state_library.f90'
      - 'tests/rom/analyze_rom1as1_reachable_state_library.py'
      - 'tests/rom/run_rom1as1_reachable_state_library.sh'
      - '.github/workflows/rom1as1-reachable-state-library.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom1as1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gfortran --version
      - name: Generate frozen successor B01 library twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ROM1AS1_EVIDENCE
          ROM1AS1_EVIDENCE_DIR="$PWD/ROM1AS1_EVIDENCE"             bash tests/rom/run_rom1as1_reachable_state_library.sh | tee ROM1AS1_EVIDENCE/gate.txt
      - name: Preserve successor library and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom1as1-${{ github.run_id }}
          path: ROM1AS1_EVIDENCE
          if-no-files-found: warn
