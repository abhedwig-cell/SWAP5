name: F-ROSS01 Continuity Algebra

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-continuity-algebra.yml
      - experiments/ross/run_ross01_continuity_algebra.py
      - integration/f-ross/F-ROSS01_CONTINUITY_ALGEBRA_ACCEPTANCE.json
  workflow_dispatch:

jobs:
  continuity-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Run F-ROSS01 continuity algebra gate
        shell: bash
        run: |
          set -euo pipefail
          out="ross01-continuity-algebra"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_continuity_algebra.py \
            "$out/F-ROSS01_CONTINUITY_ALGEBRA_RESULT.json" \
            | tee "$out/F-ROSS01_CONTINUITY_ALGEBRA_STDOUT.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-continuity-algebra
          path: ross01-continuity-algebra/
