name: F-ROSS01 D2 F-SI31 v1 Restricted Research Adapter

on:
  push:
    branches:
      - work/f-ross01-d2-fsi31-v1-research-adapter
    paths:
      - .github/workflows/ross01-d2-fsi31-v1-research-adapter.yml
      - experiments/ross/ross01_d2_fsi31_adapter.py
      - experiments/ross/run_ross01_d2_fsi31_qualification.py
      - integration/f-ross/F-ROSS01_D2_FSI31_V1_CAPABILITY_DECLARATION.json
      - integration/f-ross/F-ROSS01_D2_ADAPTER_CONTRACT.json
      - experiments/ross/run_ross01_gate_j1e_d1_local_terminal_coupling_preconditioner.py
      - experiments/ross/run_ross01_gate_f_timestep_convergence.py
      - experiments/ross/run_ross01_gate_d_conservative_physical_unsaturated_column.py
      - experiments/ross/run_ross01_gate_j1a_real_table_face_derivative.py
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executable-fsi31-adapter-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runtime identity
        run: |
          python3 --version
          git rev-parse HEAD

      - name: Install research qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema

      - name: Fetch exact frozen F-SI31 authority without copying it into D2
        run: |
          set -euo pipefail
          authority=4190ede0b17e81abe806430cc9a4c94a21995917
          git fetch --no-tags origin "$authority"
          git show "$authority:integration/f-si/F-SI31_SOIL_WATER_SOLVER_RESEARCH_CAPABILITY_SCHEMA_V1.json" > "$RUNNER_TEMP/F-SI31_SCHEMA.json"
          git show "$authority:integration/f-si/F-SI31_SOIL_WATER_SOLVER_RESEARCH_CONTRACT_V1.md" > "$RUNNER_TEMP/F-SI31_CONTRACT.md"
          test "$(git hash-object "$RUNNER_TEMP/F-SI31_SCHEMA.json")" = "86bfa60468d891e071c735569d944570f75fa205"
          test "$(git hash-object "$RUNNER_TEMP/F-SI31_CONTRACT.md")" = "d5e934df4b3fbaa573e994cbe675257cf6a47304"

      - name: Syntax check D2 adapter and harness
        run: python3 -m py_compile experiments/ross/ross01_d2_fsi31_adapter.py experiments/ross/run_ross01_d2_fsi31_qualification.py

      - name: Run executable D2 qualification
        id: qualification
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 experiments/ross/run_ross01_d2_fsi31_qualification.py \
            --schema "$RUNNER_TEMP/F-SI31_SCHEMA.json" \
            --fsi31-contract "$RUNNER_TEMP/F-SI31_CONTRACT.md" \
            --evidence integration/f-ross/F-ROSS01_D2_EVIDENCE.json \
            --status integration/f-ross/F-ROSS01_D2_STATUS.json \
            | tee F-ROSS01_D2_STDOUT.txt

      - name: Upload D2 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d2-fsi31-v1-research-adapter-${{ github.run_id }}
          path: |
            integration/f-ross/F-ROSS01_D2_EVIDENCE.json
            integration/f-ross/F-ROSS01_D2_STATUS.json
            F-ROSS01_D2_STDOUT.txt

      - name: Persist qualification evidence on research branch
        if: always()
        run: |
          set -euo pipefail
          test -f integration/f-ross/F-ROSS01_D2_EVIDENCE.json
          test -f integration/f-ross/F-ROSS01_D2_STATUS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/f-ross/F-ROSS01_D2_EVIDENCE.json integration/f-ross/F-ROSS01_D2_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(F-ROSS01 D2): persist executable F-SI31 adapter qualification run $GITHUB_RUN_ID"
            git push origin HEAD:work/f-ross01-d2-fsi31-v1-research-adapter
          fi

      - name: Enforce qualification result
        if: always()
        run: |
          if [ "${{ steps.qualification.outcome }}" != "success" ]; then
            echo "D2 qualification failed; persisted evidence contains exact gaps."
            exit 1
          fi
