name: F-ROSS01 D2 R1 Fail-Closed Requalification

on:
  push:
    branches:
      - work/f-ross01-d2-fsi31-v1-research-adapter-r1
    paths:
      - .github/workflows/ross01-d2-r1-additional-fail-closed.yml
      - experiments/ross/ross01_d2_fsi31_adapter.py
      - experiments/ross/ross01_d2_fsi31_adapter_base.py
      - experiments/ross/run_ross01_d2_additional_fail_closed_qualification.py
      - experiments/ross/run_ross01_d2_fsi31_qualification.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-requalification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema
      - name: Syntax check
        run: python3 -m py_compile experiments/ross/ross01_d2_fsi31_adapter.py experiments/ross/ross01_d2_fsi31_adapter_base.py experiments/ross/run_ross01_d2_fsi31_qualification.py experiments/ross/run_ross01_d2_additional_fail_closed_qualification.py
      - name: Run D2 fail-closed requalification
        run: python3 experiments/ross/run_ross01_d2_additional_fail_closed_qualification.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d2-r1-fail-closed-${{ github.run_id }}
          path: integration/f-ross/F-ROSS01_D2_ADDITIONAL_FAIL_CLOSED_EVIDENCE.json
