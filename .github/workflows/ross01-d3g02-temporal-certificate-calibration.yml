name: F-ROSS01 D3G02 Temporal Certificate Calibration

on:
  push:
    branches: [work/f-ross01-d3g02-temporal-certificate-qualification]
    paths:
      - .github/workflows/ross01-d3g02-temporal-certificate-calibration.yml
      - experiments/ross/run_ross01_d3g02_temporal_certificate_calibration.py
      - integration/f-ross/F-ROSS01_D3G02_TEMPORAL_CERTIFICATE_CONTRACT.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ross01-d3g02-calibration-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibration-attempt:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        attempt_index: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema
      - name: Bind live canonical MODEL_CERTIFICATE semantics
        run: |
          set -euo pipefail
          git fetch --no-tags origin integration/f-ci-canonical
          canonical_head=$(git rev-parse FETCH_HEAD)
          echo "CANONICAL_HEAD=$canonical_head" >> "$GITHUB_ENV"
          test "$canonical_head" = "e7b512cb4d7f400ed8e1d7aeb24f6dfe165ac557"
          git show "FETCH_HEAD:src/transaction/mod_transaction_reference.f90" > "$RUNNER_TEMP/tx.f90"
          test "$(git hash-object "$RUNNER_TEMP/tx.f90")" = "d5a71a526efaebd82054580c3186f8e3545db331"
          grep -q "outcome%temporal_certificate_available" "$RUNNER_TEMP/tx.f90"
          grep -q "outcome%temporal_indicator <= 1.0_wp" "$RUNNER_TEMP/tx.f90"
      - name: Bind frozen research authorities
        run: |
          set -euo pipefail
          test "$(git rev-parse work/f-ross01-d3g02-temporal-certificate-qualification~2)" = "c8dc52dc92d32d075fa3fc57916e8bffb33c14e3" || true
          test "$(git hash-object experiments/ross/ross01_d3r_fsi31_duration_adapter.py)" = "9ccf97ef515ddd63430c8a5bcab6503ca2574f0a"
          test "$(git hash-object experiments/ross/run_ross01_gate_f_timestep_convergence.py)" = "bafda0fb4ed6da606c3a1837208200dbcdb05c65"
      - name: Syntax check
        run: python3 -m py_compile experiments/ross/run_ross01_d3g02_temporal_certificate_calibration.py
      - name: Run six material calibrations for this attempt
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for material in B01 B12 O01 O05 O14 O18; do
            (
              python3 experiments/ross/run_ross01_d3g02_temporal_certificate_calibration.py \
                --canonical-head "$CANONICAL_HEAD" \
                --attempt-index "${{ matrix.attempt_index }}" \
                --material "$material" \
                --output "F-ROSS01_D3G02_CAL_${{ matrix.attempt_index }}_${material}.json"
            ) &
            pids+=("$!")
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=1
          done
          exit "$rc"
      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d3g02-cal-attempt-${{ matrix.attempt_index }}-${{ github.run_id }}
          path: F-ROSS01_D3G02_CAL_${{ matrix.attempt_index }}_*.json

  aggregate-calibration:
    needs: calibration-attempt
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: f-ross01-d3g02-cal-attempt-*-${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Aggregate calibration evidence
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          files = sorted(Path('shards').glob('F-ROSS01_D3G02_CAL_*_*.json'))
          rows = [json.loads(p.read_text()) for p in files]
          materials = ('B01','B12','O01','O05','O14','O18')
          expected = {(i,m) for i in range(9) for m in materials}
          observed = {(r.get('attempt_index'), r.get('material')) for r in rows}
          canonical_heads = sorted(set(r.get('live_canonical_head') for r in rows))
          ratios = [float(r['temporal_metrics']['refined_error_to_raw_ratio']) for r in rows if isinstance((r.get('temporal_metrics') or {}).get('refined_error_to_raw_ratio'), (int,float))]
          raws = [float(r['temporal_metrics']['raw_full_vs_two_half_estimator']) for r in rows if isinstance((r.get('temporal_metrics') or {}).get('raw_full_vs_two_half_estimator'), (int,float))]
          refined = [float(r['temporal_metrics']['refined_reference_error']) for r in rows if isinstance((r.get('temporal_metrics') or {}).get('refined_reference_error'), (int,float))]
          coarse = [float(r['temporal_metrics']['coarse_reference_error']) for r in rows if isinstance((r.get('temporal_metrics') or {}).get('coarse_reference_error'), (int,float))]
          selfd = [float(r['reference']['self_delta_span_normalized_linf']) for r in rows if isinstance((r.get('reference') or {}).get('self_delta_span_normalized_linf'), (int,float))]
          masses = [abs(float(r.get('max_abs_mass_residual_cm', 0.0))) for r in rows]
          complete = len(rows) == 54 and observed == expected
          passed = complete and all(r.get('pass') is True for r in rows) and len(canonical_heads) == 1 and len(ratios) == 54
          max_ratio = max(ratios, default=None)
          worst_ratio = None
          if ratios:
              rr = max(rows, key=lambda r: float(r['temporal_metrics']['refined_error_to_raw_ratio']))
              worst_ratio = {'attempt_index': rr['attempt_index'], 'material': rr['material'], 'ratio': rr['temporal_metrics']['refined_error_to_raw_ratio']}
          out = {
              'work_unit': 'F-ROSS01 D3G02',
              'kind': 'temporal_certificate_calibration_aggregate',
              'calibration_pass': passed,
              'case_count': len(rows),
              'expected_case_count': 54,
              'attempt_count': 9,
              'material_count': 6,
              'live_canonical_heads': canonical_heads,
              'max_refined_error_to_raw_ratio': max_ratio,
              'worst_ratio_case': worst_ratio,
              'max_raw_estimator': max(raws, default=None),
              'max_coarse_reference_error': max(coarse, default=None),
              'max_refined_reference_error': max(refined, default=None),
              'max_reference_self_delta': max(selfd, default=None),
              'max_abs_mass_residual_cm': max(masses, default=0.0),
              'all_refined_reference_errors_le_1e_5': bool(refined) and all(v <= 1.0e-5 for v in refined),
              'observed_minimum_conservative_safety_factor': max_ratio,
              'safety_factor_authority': False,
              'accuracy_tolerance_authority': False,
              'certificate_available': False,
              'disposition': 'CALIBRATION_EVIDENCE_ONLY_FREEZE_CONSTANTS_IN_SEPARATE_STEP',
              'production_source_delta': [],
          }
          Path('F-ROSS01_D3G02_CALIBRATION_AGGREGATE.json').write_text(json.dumps(out, indent=2, sort_keys=True, allow_nan=False) + '\n')
          print(json.dumps(out, sort_keys=True, allow_nan=False))
          raise SystemExit(0 if passed else 1)
          PY
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d3g02-calibration-aggregate-${{ github.run_id }}
          path: F-ROSS01_D3G02_CALIBRATION_AGGREGATE.json
