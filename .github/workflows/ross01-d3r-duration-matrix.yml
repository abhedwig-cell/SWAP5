name: F-ROSS01 D3R Duration Matrix

on:
  push:
    branches: [work/f-ross01-d3r-bounded-duration-retry-ladder-qualification]
    paths:
      - .github/workflows/ross01-d3r-duration-matrix.yml
      - experiments/ross/ross01_d3r_fsi31_duration_adapter.py
      - experiments/ross/run_ross01_d3r_duration_matrix.py
      - integration/f-ross/F-ROSS01_D3R_DURATION_SCOPE.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duration-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema
      - name: Bind frozen D2 and live canonical policy
        run: |
          set -euo pipefail
          git fetch --no-tags origin integration/f-ci-canonical
          canonical_head=$(git rev-parse FETCH_HEAD)
          echo "CANONICAL_HEAD=$canonical_head" >> "$GITHUB_ENV"
          test "$(git hash-object experiments/ross/ross01_d2_fsi31_adapter_base.py)" = "3cb579554f0931dc41ce05e92e2e7a5f06bf8888"
          test "$(git hash-object integration/f-ross/F-ROSS01_D2_STATUS.json)" = "ea67fefaa3bce7d7b650416978bb808573e8ca9c"
          test "$(git hash-object integration/f-ross/F-ROSS01_D2_EVIDENCE.json)" = "cc0476c07910392c978a9b394946591efadf08af"
          test "$(git hash-object integration/f-ross/F-ROSS01_D3_STATUS.json)" = "1373a14f4923563da97805063ff8f9171d1b4350"
          git show "FETCH_HEAD:src/transaction/mod_transaction_reference.f90" > "$RUNNER_TEMP/tx.f90"
          test "$(git hash-object "$RUNNER_TEMP/tx.f90")" = "d5a71a526efaebd82054580c3186f8e3545db331"
          grep -q "retry_scale = 0.5_real64" "$RUNNER_TEMP/tx.f90"
          grep -q "max_retries = 8" "$RUNNER_TEMP/tx.f90"
          grep -q "TX_TEMPORAL_EXTERNAL_FULL_HALF" "$RUNNER_TEMP/tx.f90"
      - name: Syntax check
        run: python3 -m py_compile experiments/ross/ross01_d3r_fsi31_duration_adapter.py experiments/ross/run_ross01_d3r_duration_matrix.py
      - name: Run duration qualification
        run: python3 experiments/ross/run_ross01_d3r_duration_matrix.py --canonical-head "$CANONICAL_HEAD" --output F-ROSS01_D3R_DURATION_MATRIX.json | tee F-ROSS01_D3R_DURATION_MATRIX_STDOUT.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d3r-duration-${{ github.run_id }}
          path: |
            F-ROSS01_D3R_DURATION_MATRIX.json
            F-ROSS01_D3R_DURATION_MATRIX_STDOUT.txt
