name: F-ROSS01 D3R Two-Half Probe

on:
  push:
    branches: [work/f-ross01-d3r-bounded-duration-retry-ladder-qualification]
    paths:
      - .github/workflows/ross01-d3r-two-half.yml
      - experiments/ross/ross01_d3r_fsi31_duration_adapter.py
      - experiments/ross/ross01_d3r_duration_worker.py
      - experiments/ross/run_ross01_d3r_two_half_case.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ross01-d3r-two-half-final-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-half-attempt:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        attempt_index: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema
      - name: Bind live canonical transaction semantics
        run: |
          set -euo pipefail
          git fetch --no-tags origin integration/f-ci-canonical
          canonical_head=$(git rev-parse FETCH_HEAD)
          echo "CANONICAL_HEAD=$canonical_head" >> "$GITHUB_ENV"
          test "$canonical_head" = "e7b512cb4d7f400ed8e1d7aeb24f6dfe165ac557"
          git show "FETCH_HEAD:src/transaction/mod_transaction_reference.f90" > "$RUNNER_TEMP/tx.f90"
          test "$(git hash-object "$RUNNER_TEMP/tx.f90")" = "d5a71a526efaebd82054580c3186f8e3545db331"
          grep -q "call model%advance(half_state, t0, midpoint, half1_outcome)" "$RUNNER_TEMP/tx.f90"
          grep -q "call model%advance(half_state, midpoint, attempt_t1, half2_outcome)" "$RUNNER_TEMP/tx.f90"
          grep -q "terr = model%temporal_error(full_state, half_state)" "$RUNNER_TEMP/tx.f90"
      - name: Syntax check
        run: python3 -m py_compile experiments/ross/ross01_d3r_fsi31_duration_adapter.py experiments/ross/ross01_d3r_duration_worker.py experiments/ross/run_ross01_d3r_two_half_case.py
      - name: Run six isolated material chains for this attempt
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for material in B01 B12 O01 O05 O14 O18; do
            (
              python3 experiments/ross/run_ross01_d3r_two_half_case.py \
                --canonical-head "$CANONICAL_HEAD" \
                --attempt-index "${{ matrix.attempt_index }}" \
                --material "$material" \
                --output "F-ROSS01_D3R_TWO_HALF_${{ matrix.attempt_index }}_${material}.json"
            ) &
            pids+=("$!")
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=1
          done
          exit "$rc"
      - name: Upload chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d3r-two-half-attempt-${{ matrix.attempt_index }}-${{ github.run_id }}
          path: F-ROSS01_D3R_TWO_HALF_${{ matrix.attempt_index }}_*.json

  aggregate-two-half:
    needs: two-half-attempt
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: f-ross01-d3r-two-half-attempt-*-${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Aggregate exact two-half chain evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('shards').glob('F-ROSS01_D3R_TWO_HALF_*_*.json'))
          rows = [json.loads(p.read_text()) for p in files]
          expected = {(i,m) for i in range(9) for m in ('B01','B12','O01','O05','O14','O18')}
          observed = {(r.get('attempt_index'), r.get('material')) for r in rows}
          canonical_heads = sorted(set(r.get('live_canonical_head') for r in rows))
          supported = len(rows) == 54 and observed == expected and all(r.get('pass') is True for r in rows) and len(canonical_heads) == 1
          masses = [abs(float(r.get('max_abs_mass_residual_cm', 0.0))) for r in rows]
          heads = [float(r['full_vs_two_half_head_delta_cm']) for r in rows if isinstance(r.get('full_vs_two_half_head_delta_cm'), (int,float))]
          thetas = [float(r['full_vs_two_half_theta_delta']) for r in rows if isinstance(r.get('full_vs_two_half_theta_delta'), (int,float))]
          out = {
              'work_unit': 'F-ROSS01 D3R',
              'kind': 'two_half_aggregate',
              'canonical_two_half_candidate_chain_supported': supported,
              'chain_count': len(rows),
              'attempt_count': 9,
              'material_count': 6,
              'live_canonical_heads': canonical_heads,
              'max_abs_mass_residual_cm': max(masses, default=0.0),
              'max_abs_full_vs_two_half_head_delta_cm': max(heads, default=0.0),
              'max_abs_full_vs_two_half_theta_delta': max(thetas, default=0.0),
              'external_temporal_error_semantics_qualified': false,
              'temporal_error_disposition': 'DIAGNOSTIC_STATE_DELTAS_ONLY_NO_ACCEPTANCE_METRIC_OR_TOLERANCE_CLAIM',
              'production_source_delta': [],
          }
          Path('F-ROSS01_D3R_TWO_HALF_AGGREGATE.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, sort_keys=True))
          raise SystemExit(0 if supported else 1)
          PY
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d3r-two-half-aggregate-${{ github.run_id }}
          path: F-ROSS01_D3R_TWO_HALF_AGGREGATE.json
