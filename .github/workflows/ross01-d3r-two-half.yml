name: F-ROSS01 D3R Two-Half Probe

on:
  push:
    branches: [work/f-ross01-d3r-bounded-duration-retry-ladder-qualification]
    paths:
      - .github/workflows/ross01-d3r-two-half.yml
      - experiments/ross/ross01_d3r_fsi31_duration_adapter.py
      - experiments/ross/ross01_d3r_duration_worker.py
      - experiments/ross/run_ross01_d3r_two_half_probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ross01-d3r-two-half-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-half-probe:
    strategy:
      fail-fast: false
      matrix:
        attempt_index: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema
      - name: Bind live canonical transaction semantics
        run: |
          set -euo pipefail
          git fetch --no-tags origin integration/f-ci-canonical
          canonical_head=$(git rev-parse FETCH_HEAD)
          echo "CANONICAL_HEAD=$canonical_head" >> "$GITHUB_ENV"
          git show "FETCH_HEAD:src/transaction/mod_transaction_reference.f90" > "$RUNNER_TEMP/tx.f90"
          test "$(git hash-object "$RUNNER_TEMP/tx.f90")" = "d5a71a526efaebd82054580c3186f8e3545db331"
          grep -q "call model%advance(half_state, t0, midpoint, half1_outcome)" "$RUNNER_TEMP/tx.f90"
          grep -q "call model%advance(half_state, midpoint, attempt_t1, half2_outcome)" "$RUNNER_TEMP/tx.f90"
          grep -q "terr = model%temporal_error(full_state, half_state)" "$RUNNER_TEMP/tx.f90"
      - name: Syntax check
        run: python3 -m py_compile experiments/ross/ross01_d3r_fsi31_duration_adapter.py experiments/ross/ross01_d3r_duration_worker.py experiments/ross/run_ross01_d3r_two_half_probe.py
      - name: Run two-half shard
        run: |
          python3 experiments/ross/run_ross01_d3r_two_half_probe.py \
            --canonical-head "$CANONICAL_HEAD" \
            --attempt-index "${{ matrix.attempt_index }}" \
            --output "F-ROSS01_D3R_TWO_HALF_${{ matrix.attempt_index }}.json" \
            | tee "F-ROSS01_D3R_TWO_HALF_${{ matrix.attempt_index }}_STDOUT.txt"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d3r-two-half-${{ matrix.attempt_index }}-${{ github.run_id }}
          path: |
            F-ROSS01_D3R_TWO_HALF_${{ matrix.attempt_index }}.json
            F-ROSS01_D3R_TWO_HALF_${{ matrix.attempt_index }}_STDOUT.txt

  aggregate-two-half:
    needs: two-half-probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: f-ross01-d3r-two-half-*-${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Aggregate exact two-half chain evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('shards').glob('F-ROSS01_D3R_TWO_HALF_[0-8].json'))
          rows = [json.loads(p.read_text()) for p in files]
          indices = sorted(r.get('attempt_index') for r in rows)
          supported = len(rows) == 9 and indices == list(range(9)) and all(r.get('canonical_two_half_candidate_chain_supported') is True for r in rows)
          out = {
              'work_unit': 'F-ROSS01 D3R',
              'kind': 'two_half_aggregate',
              'canonical_two_half_candidate_chain_supported': supported,
              'shard_count': len(rows),
              'attempt_indices': indices,
              'chain_count': sum(r.get('chain_count', 0) for r in rows),
              'live_canonical_heads': sorted(set(r.get('live_canonical_head') for r in rows)),
              'max_abs_mass_residual_cm': max((r.get('max_abs_mass_residual_cm', 0.0) for r in rows), default=0.0),
              'max_abs_full_vs_two_half_head_delta_cm': max((r.get('max_abs_full_vs_two_half_head_delta_cm', 0.0) for r in rows), default=0.0),
              'max_abs_full_vs_two_half_theta_delta': max((r.get('max_abs_full_vs_two_half_theta_delta', 0.0) for r in rows), default=0.0),
              'external_temporal_error_semantics_qualified': False,
              'temporal_error_disposition': 'DIAGNOSTIC_STATE_DELTAS_ONLY_NO_ACCEPTANCE_METRIC_OR_TOLERANCE_CLAIM',
              'production_source_delta': [],
          }
          Path('F-ROSS01_D3R_TWO_HALF_AGGREGATE.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, sort_keys=True))
          PY
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-d3r-two-half-aggregate-${{ github.run_id }}
          path: F-ROSS01_D3R_TWO_HALF_AGGREGATE.json
