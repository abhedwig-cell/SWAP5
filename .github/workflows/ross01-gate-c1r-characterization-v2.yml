name: F-ROSS01 Gate C1R Characterization V2

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-c1r-characterization-v2.yml
      - experiments/ross/run_ross01_gate_c1r_characterization_v2.py
      - experiments/ross/run_ross01_gate_c1r_characterization.py
      - experiments/ross/run_ross01_gate_c1.py
      - experiments/ross/run_ross01_face_table_characterization.py
      - integration/f-ross/F-ROSS01_GATE_C1R_REFINEMENT_CONTRACT_V2.json
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

jobs:
  characterize:
    strategy:
      fail-fast: false
      matrix:
        n: [225, 241, 255]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run authoritative frozen C1R characterization candidate
        run: |
          set -o pipefail
          out="ross01-c1r-v2-N${{ matrix.n }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_c1r_characterization_v2.py \
            "${{ matrix.n }}" "$out/F-ROSS01_C1R_V2_N${{ matrix.n }}_RESULT.json" \
            | tee "$out/F-ROSS01_C1R_V2_N${{ matrix.n }}_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-c1r-v2-N${{ matrix.n }}
          path: ross01-c1r-v2-N${{ matrix.n }}/
