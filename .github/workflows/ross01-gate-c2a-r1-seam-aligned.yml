name: F-ROSS01 Gate C2A R1 Seam Aligned

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-c2a-r1-seam-aligned.yml
      - experiments/ross/run_ross01_gate_c2a_r1_seam_aligned.py
      - experiments/ross/run_ross01_gate_c2a_ksatexm_characterization.py
      - experiments/ross/run_ross01_gate_c1r_characterization_v4.py
      - experiments/ross/run_ross01_gate_c1r_characterization.py
      - experiments/ross/run_ross01_gate_c1.py
      - experiments/ross/run_ross01_face_table_characterization.py
      - integration/f-ross/F-ROSS01_GATE_C2A_R1_SEAM_ALIGNED_CONTRACT.json
      - integration/f-ross/F-ROSS01_GATE_C2A_KSATEXM_SOURCE_CONTRACT.json
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

jobs:
  characterize:
    strategy:
      fail-fast: false
      matrix:
        material: [B10, O12, O13, B05, O14, O05]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen seam-aligned R1 material
        run: |
          set -euo pipefail
          out="ross01-c2a-r1-${{ matrix.material }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_c2a_r1_seam_aligned.py \
            "${{ matrix.material }}" "$out/F-ROSS01_C2A_R1_${{ matrix.material }}_RESULT.json" \
            | tee "$out/F-ROSS01_C2A_R1_${{ matrix.material }}_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-c2a-r1-${{ matrix.material }}
          path: ross01-c2a-r1-${{ matrix.material }}/
