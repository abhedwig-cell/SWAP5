name: F-ROSS01 Gate C2B H_ENPR State Inverse

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-c2b-henpr-state-inverse.yml
      - experiments/ross/run_ross01_gate_c2b_henpr_state_inverse.py
      - integration/f-ross/F-ROSS01_GATE_C2B_HENPR_STATE_INVERSE_CONTRACT.json
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependency
        run: python3 -m pip install --disable-pip-version-check --quiet numpy
      - name: Run frozen analytical inverse qualification
        run: |
          set -euo pipefail
          out="ross01-c2b-henpr-state-inverse"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_c2b_henpr_state_inverse.py \
            "$out/F-ROSS01_GATE_C2B_HENPR_STATE_INVERSE_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_C2B_HENPR_STATE_INVERSE_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-c2b-henpr-state-inverse
          path: ross01-c2b-henpr-state-inverse/
