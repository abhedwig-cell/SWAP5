name: F-ROSS01 Gate D Conservative Physical Unsaturated Column

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-d-conservative-physical-unsaturated-column.yml
      - experiments/ross/run_ross01_gate_d_conservative_physical_unsaturated_column.py
      - integration/f-ross/F-ROSS01_GATE_D_CONSERVATIVE_PHYSICAL_UNSATURATED_COLUMN_CONTRACT.json
      - experiments/ross/run_ross01_gate_j1a_real_table_face_derivative.py
      - experiments/ross/run_ross01_gate_c1r_characterization_v4.py
      - experiments/ross/run_ross01_gate_c1r_characterization.py
      - experiments/ross/run_ross01_gate_c1.py
      - experiments/ross/run_ross01_tangent_algebra.py
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

jobs:
  mass:
    strategy:
      fail-fast: false
      matrix:
        material: [B01, B12, O01, O05, O14, O18]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen Gate D conservative physical column qualification
        run: |
          set -euo pipefail
          out="ross01-gate-d-${{ matrix.material }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_d_conservative_physical_unsaturated_column.py \
            "${{ matrix.material }}" "$out/F-ROSS01_GATE_D_${{ matrix.material }}_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_D_${{ matrix.material }}_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-d-${{ matrix.material }}
          path: ross01-gate-d-${{ matrix.material }}/
