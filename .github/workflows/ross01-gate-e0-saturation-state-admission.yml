name: F-ROSS01 Gate E0 Saturation State and Closure Admission

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-e0-saturation-state-admission.yml
      - experiments/ross/run_ross01_gate_e0_saturation_state_and_closure_admission.py
      - integration/f-ross/F-ROSS01_GATE_E0_SATURATION_STATE_AND_CLOSURE_ADMISSION_CONTRACT.json
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
      - experiments/ross/run_ross01_gate_c1.py

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen Gate E0 saturation state and closure admission
        run: |
          set -euo pipefail
          out="ross01-gate-e0"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e0_saturation_state_and_closure_admission.py \
            "$out/F-ROSS01_GATE_E0_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E0_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-e0-saturation-state-admission
          path: ross01-gate-e0/
