name: F-ROSS01 Gate E2A Near-Saturation Face Characterization

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-e2a-near-saturation-face-characterization.yml
      - experiments/ross/run_ross01_gate_e2a_near_saturation_face_characterization.py
      - integration/f-ross/F-ROSS01_GATE_E2A_NEAR_SATURATION_FACE_CHARACTERIZATION_CONTRACT.json
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
      - experiments/ross/run_ross01_gate_c1.py
      - experiments/ross/run_ross01_face_table_characterization.py

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen Gate E2A near-saturation face characterization
        run: |
          set -euo pipefail
          out="ross01-gate-e2a"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e2a_near_saturation_face_characterization.py \
            "$out/F-ROSS01_GATE_E2A_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E2A_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-e2a-near-saturation-face-characterization
          path: ross01-gate-e2a/
