name: F-ROSS01 Gate E2A R1A Ross-Mixed Wet-Axis Characterization

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-e2a-r1a-ross-mixed-wet-axis.yml
      - experiments/ross/run_ross01_gate_e2a_r1a_ross_mixed_wet_axis.py
      - integration/f-ross/F-ROSS01_GATE_E2A_R1A_ROSS_MIXED_WET_AXIS_WET_DRY_CHARACTERIZATION_CONTRACT.json
      - experiments/ross/run_ross01_gate_c1.py
      - experiments/ross/run_ross01_face_table_characterization.py

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install characterization dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen Gate E2A R1A Ross-mixed wet-axis characterization
        run: |
          set -euo pipefail
          out="ross01-gate-e2a-r1a"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e2a_r1a_ross_mixed_wet_axis.py \
            "$out/F-ROSS01_GATE_E2A_R1A_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E2A_R1A_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-e2a-r1a-ross-mixed-wet-axis
          path: ross01-gate-e2a-r1a/
