name: F-ROSS01 Gate E2C-R2B Endpoint Exponent Diagnostic

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-e2c-r2b-endpoint-exponent-diagnostic.yml
      - experiments/ross/run_ross01_gate_e2c_r2b_endpoint_exponent_diagnostic.py
      - integration/f-ross/F-ROSS01_GATE_E2C_R2B_ENDPOINT_CLUSTER_EXPONENT_DIAGNOSTIC_CONTRACT.json
      - experiments/ross/run_ross01_gate_e2c_r2_endpoint_clustered_local_face.py

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install diagnostic dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Execute frozen R2 residual endpoint exponent diagnostic
        run: |
          set -euo pipefail
          out="ross01-gate-e2c-r2b"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e2c_r2b_endpoint_exponent_diagnostic.py \
            "$out/F-ROSS01_GATE_E2C_R2B_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E2C_R2B_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-e2c-r2b-endpoint-exponent-diagnostic
          path: ross01-gate-e2c-r2b/
