name: F-ROSS01 Gate E2C-R3 Endpoint-Limit Independent Holdout

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-e2c-r3-endpoint-limit-holdout.yml
      - experiments/ross/run_ross01_gate_e2c_r3_endpoint_limit_holdout.py
      - integration/f-ross/F-ROSS01_GATE_E2C_R3_ENDPOINT_LIMIT_HOLDOUT_PRECOMMIT.json
      - experiments/ross/run_ross01_gate_e2c_r2_endpoint_clustered_local_face.py

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Execute frozen R3 endpoint-limit holdout gate
        run: |
          set -euo pipefail
          out="ross01-gate-e2c-r3"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e2c_r3_endpoint_limit_holdout.py \
            "$out/F-ROSS01_GATE_E2C_R3_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E2C_R3_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-e2c-r3-endpoint-limit-holdout
          path: ross01-gate-e2c-r3/
