name: F-ROSS01 Gate E3A-R2 Two-Sided K Endpoint Limit

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-e3a-r2-two-sided-k-endpoint-limit.yml
      - experiments/ross/run_ross01_gate_e3a_r2_two_sided_k_endpoint_limit.py
      - integration/f-ross/F-ROSS01_GATE_E3A_R2_TWO_SIDED_K_ENDPOINT_LIMIT_PRECOMMIT.json
      - experiments/ross/run_ross01_gate_e3a_encountered_transition_faces.py
      - experiments/ross/run_ross01_gate_e2c_r3_endpoint_limit_holdout.py

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Execute frozen E3A-R2 face-scope gate
        run: |
          set -euo pipefail
          out="ross01-gate-e3a-r2"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e3a_r2_two_sided_k_endpoint_limit.py \
            "$out/F-ROSS01_GATE_E3A_R2_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E3A_R2_STDOUT.txt"
      - name: Assert frozen E3A-R2 decision
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('ross01-gate-e3a-r2/F-ROSS01_GATE_E3A_R2_RESULT.json'))
          assert r['pass'] is True
          assert r['decision']=='QUALIFIED_E3_ENCOUNTERED_FACE_SCOPE_WITH_TWO_SIDED_K_ENDPOINT_LIMIT_READY_FOR_EVENT_AND_SOLVER_REMEDIATION'
          assert r['new_persistent_state_bytes'] == 0
          assert r['new_constitutive_physics'] is False
          assert r['quadrature_changed'] is False
          assert r['root_iteration_count_changed'] is False
          assert r['metric_tolerances_changed'] is False
          assert r['total_lower_side_endpoint_limit_count'] >= 7
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-e3a-r2-two-sided-k-endpoint-limit
          path: ross01-gate-e3a-r2/
