name: F-ROSS01 Gate E3E-R2 5cm Reference Oracle Validity

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - '.github/workflows/ross01-gate-e3e-r2-5cm-reference-oracle-validity.yml'
      - 'experiments/ross/run_ross01_gate_e3e_r2_5cm_reference_oracle_validity.py'
      - 'integration/f-ross/F-ROSS01_GATE_E3E_R2_5CM_REFERENCE_ORACLE_VALIDITY_PRECOMMIT.json'
      - 'experiments/ross/run_ross01_gate_e3e_5cm_surface_boundary_face.py'
      - 'experiments/ross/run_ross01_face_table_characterization.py'

jobs:
  qualify-oracle:
    strategy:
      fail-fast: false
      matrix:
        material: [B01, B12, O13, O14]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install oracle dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy mpmath
      - name: Execute frozen oracle validity gate
        run: |
          set -euo pipefail
          out="ross01-gate-e3e-r2-${{ matrix.material }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e3e_r2_5cm_reference_oracle_validity.py \
            "${{ matrix.material }}" \
            "$out/F-ROSS01_GATE_E3E_R2_${{ matrix.material }}_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E3E_R2_${{ matrix.material }}_STDOUT.txt"
      - name: Assert oracle-only semantics
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          m=os.environ['MATERIAL']
          p=f'ross01-gate-e3e-r2-{m}/F-ROSS01_GATE_E3E_R2_{m}_RESULT.json'
          r=json.load(open(p))
          assert r['qualification_target']=='REFERENCE_ORACLE_ONLY'
          assert r['production_implementation'] is False
          assert r['pass'] is True
          assert all(r['tests'].values())
          PY
        env:
          MATERIAL: ${{ matrix.material }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-e3e-r2-${{ matrix.material }}
          path: ross01-gate-e3e-r2-${{ matrix.material }}/
