name: F-ROSS01 Gate E3E-R2R1 Endpoint-Limit Oracle Repair Fast Scan

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - 'experiments/ross/run_ross01_gate_e3e_r2r1_endpoint_limit_oracle_repair.py'
      - 'experiments/ross/run_ross01_gate_e3e_r2r1_endpoint_limit_oracle_repair_fastscan.py'
      - 'integration/f-ross/F-ROSS01_GATE_E3E_R2R1_ENDPOINT_LIMIT_AND_INTERIOR_ROOT_ORACLE_REPAIR_PRECOMMIT.json'
      - 'integration/f-ross/F-ROSS01_GATE_E3E_R2R1_STABLE_VGM_ENDPOINT_IDENTITY.json'
      - '.github/workflows/ross01-gate-e3e-r2r1-endpoint-limit-oracle-repair-fastscan.yml'
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        material: [B01, B12, O13, O14]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: |
          python3 --version
          git rev-parse HEAD
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy mpmath
      - name: Execute frozen endpoint-limit oracle gate with bounded-cost scan order
        shell: bash
        run: |
          set -o pipefail
          out="ross01-gate-e3e-r2r1-fast-${{ matrix.material }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e3e_r2r1_endpoint_limit_oracle_repair_fastscan.py \
            "${{ matrix.material }}" \
            "$out/F-ROSS01_GATE_E3E_R2R1_${{ matrix.material }}_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E3E_R2R1_${{ matrix.material }}_STDOUT.txt"
      - name: Assert frozen gate semantics
        if: success()
        env:
          MATERIAL: ${{ matrix.material }}
        run: |
          python3 - <<'PY'
          import json, os
          m=os.environ['MATERIAL']
          p=f'ross01-gate-e3e-r2r1-fast-{m}/F-ROSS01_GATE_E3E_R2R1_{m}_RESULT.json'
          r=json.load(open(p))
          assert r['gate'] == 'E3E_R2R1_ENDPOINT_LIMIT_AND_INTERIOR_ROOT_ORACLE_REPAIR'
          assert r['production_implementation'] is False
          assert r['qualification_target'] == 'REFERENCE_ORACLE_NUMERICS_ONLY'
          assert r['pass'] is True
          assert all(x['pass'] for x in r['results'])
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-e3e-r2r1-fast-${{ matrix.material }}
          path: ross01-gate-e3e-r2r1-fast-${{ matrix.material }}/
          if-no-files-found: warn
