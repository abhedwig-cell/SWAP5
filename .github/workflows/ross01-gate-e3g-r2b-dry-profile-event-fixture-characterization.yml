name: F-ROSS01 Gate E3G-R2B Dry Profile Event Fixture Characterization

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - 'integration/f-ross/F-ROSS01_GATE_E3G_R2B_DRY_INITIAL_PROFILE_EVENT_FIXTURE_CHARACTERIZATION_PRECOMMIT.json'
      - 'experiments/ross/run_ross01_gate_e3g_r2b_dry_profile_event_fixture_characterization.py'
      - '.github/workflows/ross01-gate-e3g-r2b-dry-profile-event-fixture-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    strategy:
      fail-fast: false
      matrix:
        material: [B01, O14]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: |
          python3 --version
          git rev-parse HEAD
      - name: Install characterization dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy mpmath
      - name: Syntax guard
        run: python3 -m py_compile experiments/ross/run_ross01_gate_e3g_r2b_dry_profile_event_fixture_characterization.py
      - name: Execute frozen R2B material characterization
        run: |
          set -o pipefail
          out="ross01-gate-e3g-r2b-${{ matrix.material }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e3g_r2b_dry_profile_event_fixture_characterization.py \
            "${{ matrix.material }}" \
            "$out/F-ROSS01_GATE_E3G_R2B_${{ matrix.material }}_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E3G_R2B_${{ matrix.material }}_STDOUT.txt"
      - name: Assert characterization semantics
        env:
          MATERIAL: ${{ matrix.material }}
        run: |
          python3 - <<'PY'
          import json, os
          m=os.environ['MATERIAL']
          p=f'ross01-gate-e3g-r2b-{m}/F-ROSS01_GATE_E3G_R2B_{m}_RESULT.json'
          r=json.load(open(p)); mr=r['material_result']
          assert r['gate']=='E3G_R2B_DRY_INITIAL_PROFILE_EVENT_FIXTURE_CHARACTERIZATION'
          assert r['production_implementation'] is False
          assert r['qualification_use'] is False
          assert r['pass'] is True
          assert mr['pass'] is True
          assert mr['valid_candidate_count'] >= 1
          s=mr['selected_fixture_candidate']
          assert s is not None
          assert s['q_supply_over_ksat'] > 1.0
          assert s['g_left_cm_per_day'] < 0.0
          assert s['g_right_cm_per_day'] >= 0.0
          assert s['h_top_right_cm'] > s['h_top_left_cm']
          assert mr['tests']['all_trials_preserve_committed_state'] is True
          assert mr['tests']['no_mass_repair_or_clipping'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-ross01-gate-e3g-r2b-${{ matrix.material }}
          path: ross01-gate-e3g-r2b-${{ matrix.material }}/
