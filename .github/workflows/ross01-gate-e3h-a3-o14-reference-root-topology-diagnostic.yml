name: F-ROSS01 Gate E3H-A3 O14 Reference Root Topology Diagnostic

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - 'integration/f-ross/F-ROSS01_GATE_E3H_A3_O14_REFERENCE_ROOT_EXISTENCE_AND_EVENT_TOPOLOGY_DIAGNOSTIC_PRECOMMIT.json'
      - 'experiments/ross/run_ross01_gate_e3h_a3_o14_reference_root_topology_diagnostic.py'
      - '.github/workflows/ross01-gate-e3h-a3-o14-reference-root-topology-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        profile:
          - P0_A1_CONTROL
          - P1_DRIER_SUBSOIL
          - P2_DRIER_TOP_AND_SUBSOIL
          - P3_STRONG_DRY_SEPARATION
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: |
          python3 --version
          git rev-parse HEAD
      - name: Install diagnostic dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy mpmath
      - name: Syntax guard
        run: python3 -m py_compile experiments/ross/run_ross01_gate_e3h_a3_o14_reference_root_topology_diagnostic.py
      - name: Execute frozen reference-only topology diagnostic
        run: |
          set -o pipefail
          out="ross01-gate-e3h-a3-${{ matrix.profile }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e3h_a3_o14_reference_root_topology_diagnostic.py \
            "${{ matrix.profile }}" \
            "$out/F-ROSS01_GATE_E3H_A3_${{ matrix.profile }}_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E3H_A3_${{ matrix.profile }}_STDOUT.txt"
      - name: Assert frozen diagnostic completeness
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PY'
          import json, os
          p=os.environ['PROFILE']
          f=f'ross01-gate-e3h-a3-{p}/F-ROSS01_GATE_E3H_A3_{p}_RESULT.json'
          r=json.load(open(f))
          pr=r['profile_result']
          assert r['gate']=='E3H_A3_O14_REFERENCE_ROOT_EXISTENCE_AND_EVENT_TOPOLOGY_DIAGNOSTIC'
          assert r['production_implementation'] is False
          assert r['qualification_use'] is False
          assert r['candidate_runs']==0
          assert r['diagnostic_complete'] is True
          assert pr['profile_id']==p
          assert pr['case_count']==6
          assert pr['total_reference_solves']==72
          assert all(c['start_count']==12 for c in pr['cases'])
          assert all(a['committed_state_bitwise_unchanged'] is True for c in pr['cases'] for a in c['attempts'])
          assert all(a['mass_repair_or_clipping_used'] is False for c in pr['cases'] for a in c['attempts'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-ross01-gate-e3h-a3-${{ matrix.profile }}
          path: ross01-gate-e3h-a3-${{ matrix.profile }}/
