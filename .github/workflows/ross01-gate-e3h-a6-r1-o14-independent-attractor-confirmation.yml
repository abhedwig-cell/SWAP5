name: F-ROSS01 Gate E3H-A6-R1 O14 Independent Attractor Confirmation

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - 'integration/f-ross/F-ROSS01_GATE_E3H_A6_R1_O14_INDEPENDENT_UNSATURATED_ATTRACTOR_CONFIRMATION_PRECOMMIT.json'
      - 'experiments/ross/run_ross01_gate_e3h_a6_r1_o14_independent_attractor_confirmation.py'
      - '.github/workflows/ross01-gate-e3h-a6-r1-o14-independent-attractor-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    strategy:
      fail-fast: false
      matrix:
        profile:
          - P0_A1_CONTROL
          - P1_DRIER_SUBSOIL
          - P2_DRIER_TOP_AND_SUBSOIL
          - P3_STRONG_DRY_SEPARATION
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: |
          python3 --version
          git rev-parse HEAD
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy mpmath
      - name: Syntax guard
        run: python3 -m py_compile experiments/ross/run_ross01_gate_e3h_a6_r1_o14_independent_attractor_confirmation.py
      - name: Execute frozen independent attractor confirmation
        run: |
          set -o pipefail
          out="ross01-gate-e3h-a6-r1-${{ matrix.profile }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_e3h_a6_r1_o14_independent_attractor_confirmation.py \
            "${{ matrix.profile }}" \
            "$out/F-ROSS01_GATE_E3H_A6_R1_${{ matrix.profile }}_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_E3H_A6_R1_${{ matrix.profile }}_STDOUT.txt"
      - name: Assert frozen confirmation semantics
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PY'
          import json, os
          p=os.environ['PROFILE']
          f=f'ross01-gate-e3h-a6-r1-{p}/F-ROSS01_GATE_E3H_A6_R1_{p}_RESULT.json'
          r=json.load(open(f)); pr=r['profile_result']; rep=pr['steady']['representative']
          assert r['gate']=='E3H_A6_R1_O14_INDEPENDENT_POST_CAP_UNSATURATED_ATTRACTOR_CONFIRMATION'
          assert r['production_implementation'] is False
          assert r['qualification_use'] is True
          assert r['pass'] is True
          assert pr['pass'] is True
          assert pr['initial_top_tendency_sign_is_admission_criterion'] is False
          assert pr['transient_summary']['complete'] is True
          assert pr['transient_summary']['accepted_step_count']==40
          assert abs(pr['transient_summary']['horizon_day']-1.0)<=1e-14
          assert pr['transient_summary']['max_abs_balance_residual_cm']<=1e-9
          assert pr['transient_summary']['max_top_head_cm'] < -0.001
          assert pr['transient_summary']['top_saturation_approach_count']==0
          assert rep is not None
          assert pr['steady']['clusters'][0]['member_count']>=2
          assert rep['heads_cm'][0] < -0.01
          assert pr['final_to_steady_max_abs_head_difference_cm']<=0.005
          assert all(pr['tests'].values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f-ross01-gate-e3h-a6-r1-${{ matrix.profile }}
          path: ross01-gate-e3h-a6-r1-${{ matrix.profile }}/
