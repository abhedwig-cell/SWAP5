name: F-ROSS01 Gate F Timestep Convergence

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-f-timestep-convergence.yml
      - experiments/ross/run_ross01_gate_f_timestep_convergence.py
      - integration/f-ross/F-ROSS01_GATE_F_TIMESTEP_CONVERGENCE_CONTRACT.json
      - experiments/ross/run_ross01_gate_d_conservative_physical_unsaturated_column.py
      - experiments/ross/run_ross01_gate_j1a_real_table_face_derivative.py
      - experiments/ross/run_ross01_gate_j1a_r1_head_coordinate_oracle_repair.py
      - experiments/ross/run_ross01_gate_c1r_characterization_v4.py
      - experiments/ross/run_ross01_gate_c1r_characterization.py
      - experiments/ross/run_ross01_gate_c1.py
      - experiments/ross/run_ross01_tangent_algebra.py
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

jobs:
  timestep:
    strategy:
      fail-fast: false
      matrix:
        material: [B01, B12, O01, O05, O14, O18]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen Gate F timestep convergence qualification
        run: |
          set -euo pipefail
          out="ross01-gate-f-${{ matrix.material }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_f_timestep_convergence.py \
            "${{ matrix.material }}" "$out/F-ROSS01_GATE_F_${{ matrix.material }}_RESULT.json" \
            | tee "$out/F-ROSS01_GATE_F_${{ matrix.material }}_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-gate-f-${{ matrix.material }}
          path: ross01-gate-f-${{ matrix.material }}/
