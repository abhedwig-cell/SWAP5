name: F-ROSS01 Gate J1A-R2 High Precision FD Oracle

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-j1a-r2-high-precision-fd-oracle.yml
      - experiments/ross/run_ross01_gate_j1a_r2_high_precision_fd_oracle.py
      - experiments/ross/run_ross01_gate_j1a_r1_head_coordinate_oracle_repair.py
      - experiments/ross/run_ross01_gate_j1a_real_table_face_derivative.py
      - integration/f-ross/F-ROSS01_GATE_J1A_R2_HIGH_PRECISION_FD_ORACLE_CONTRACT.json
      - experiments/ross/run_ross01_gate_c1r_characterization_v4.py
      - experiments/ross/run_ross01_gate_c1r_characterization.py
      - experiments/ross/run_ross01_gate_c1.py
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

jobs:
  derivative:
    strategy:
      fail-fast: false
      matrix:
        material: [B01, B12, O01, O05, O14, O18]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen J1A-R2 high-precision oracle material characterization
        run: |
          set -euo pipefail
          out="ross01-j1a-r2-${{ matrix.material }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_j1a_r2_high_precision_fd_oracle.py \
            "${{ matrix.material }}" "$out/F-ROSS01_J1A_R2_${{ matrix.material }}_RESULT.json" \
            | tee "$out/F-ROSS01_J1A_R2_${{ matrix.material }}_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-j1a-r2-${{ matrix.material }}
          path: ross01-j1a-r2-${{ matrix.material }}/
