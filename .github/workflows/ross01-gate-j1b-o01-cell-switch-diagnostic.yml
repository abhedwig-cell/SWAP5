name: F-ROSS01 Gate J1B O01 Cell-Switch Diagnostic

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-j1b-o01-cell-switch-diagnostic.yml
      - experiments/ross/run_ross01_gate_j1b_o01_cell_switch_diagnostic.py
      - integration/f-ross/F-ROSS01_GATE_J1B_O01_CELL_SWITCH_DIAGNOSTIC_CONTRACT.json
      - experiments/ross/run_ross01_gate_j1b_same_factorization_column_response.py
      - experiments/ross/run_ross01_gate_j1a_real_table_face_derivative.py
      - experiments/ross/run_ross01_gate_j1a_r1_head_coordinate_oracle_repair.py
      - experiments/ross/run_ross01_gate_c1r_characterization_v4.py
      - experiments/ross/run_ross01_gate_c1r_characterization.py
      - experiments/ross/run_ross01_gate_c1.py
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen O01 J1B cell-switch localization
        run: |
          set -euo pipefail
          out="ross01-j1b-o01-switch-diagnostic"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_j1b_o01_cell_switch_diagnostic.py \
            "$out/F-ROSS01_J1B_O01_CELL_SWITCH_DIAGNOSTIC_RESULT.json" \
            | tee "$out/F-ROSS01_J1B_O01_CELL_SWITCH_DIAGNOSTIC_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-j1b-o01-cell-switch-diagnostic
          path: ross01-j1b-o01-switch-diagnostic/
