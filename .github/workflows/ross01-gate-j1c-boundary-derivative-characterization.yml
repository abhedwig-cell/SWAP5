name: F-ROSS01 Gate J1C Boundary Derivative Characterization

on:
  push:
    branches:
      - work/f-ross01-fast-mfp-feasibility
    paths:
      - .github/workflows/ross01-gate-j1c-boundary-derivative-characterization.yml
      - experiments/ross/run_ross01_gate_j1c_boundary_derivative_characterization.py
      - integration/f-ross/F-ROSS01_GATE_J1C_BOUNDARY_DERIVATIVE_CHARACTERIZATION_CONTRACT.json
      - experiments/ross/run_ross01_gate_j1a_real_table_face_derivative.py
      - experiments/ross/run_ross01_gate_c1r_characterization_v4.py
      - experiments/ross/run_ross01_gate_c1r_characterization.py
      - experiments/ross/run_ross01_gate_c1.py
      - integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json
  workflow_dispatch:

jobs:
  boundary:
    strategy:
      fail-fast: false
      matrix:
        material: [B01, B12, O01, O05, O14, O18]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runtime identity
        run: python3 --version
      - name: Install qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy
      - name: Run frozen J1C material boundary characterization
        run: |
          set -euo pipefail
          out="ross01-j1c-${{ matrix.material }}"
          rm -rf "$out"
          mkdir -p "$out"
          python3 experiments/ross/run_ross01_gate_j1c_boundary_derivative_characterization.py \
            "${{ matrix.material }}" "$out/F-ROSS01_J1C_${{ matrix.material }}_RESULT.json" \
            | tee "$out/F-ROSS01_J1C_${{ matrix.material }}_STDOUT.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross01-j1c-${{ matrix.material }}
          path: ross01-j1c-${{ matrix.material }}/
