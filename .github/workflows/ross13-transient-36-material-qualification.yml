name: F-ROSS13 transient 36-material D3R qualification

on:
  push:
    branches:
      - work/f-ross13-36-material-production-envelope
    paths:
      - 'integration/f-ross/F-ROSS13_TRANSIENT_36_MATERIAL_QUALIFICATION_CONTRACT.json'
      - 'tests/ross/run_ross13_transient_material_qualification.py'
      - 'tests/ross/aggregate_ross13_transient_qualification.py'
      - '.github/workflows/ross13-transient-36-material-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ross13-transient-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_HEAD: 04807fdcf45453a59b7f6c99fe97f1286c172833
  CONTRACT: integration/f-ross/F-ROSS13_TRANSIENT_36_MATERIAL_QUALIFICATION_CONTRACT.json
  FINGERPRINT_AUTHORITY: integration/f-ross/F-ROSS13_36_MATERIAL_N241_FINGERPRINT_AUTHORITY.json

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout F-ROSS13 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen F-ROSS13 and historical authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 95748d047325e74adf6d06eba978dea61bd51a7d HEAD
          test "$(git hash-object "$CONTRACT")" = 382a9f9d153669377e8eba05461594a37d132e4b
          test "$(git hash-object "$FINGERPRINT_AUTHORITY")" = 01fa631a245f3011b1007b2888b0528b111ee17f
          test "$(git hash-object assets/rossfast/d3r/manifest.json)" = 5e2fc1e42fa6c62cd6e570b7d45ce7e6b9089db6
          git fetch --no-tags origin work/f-ross01-fast-mfp-feasibility
          git cat-file -e "$RESEARCH_HEAD^{commit}"
          git worktree add --detach "$RUNNER_TEMP/f-ross01-research" "$RESEARCH_HEAD"
          root="$RUNNER_TEMP/f-ross01-research"
          test "$(git -C "$root" hash-object .github/workflows/ross01-gate-f-r1-piecewise-timestep-route.yml)" = c839e3dda306ce4b06ae825372821cbd2ea1d66f
          test "$(git -C "$root" hash-object integration/f-ross/F-ROSS01_GATE_F_R1_PIECEWISE_TIMESTEP_ROUTE_CONTRACT.json)" = f8d0304d28201133f90332b424da957165af68e7
          test "$(git -C "$root" hash-object integration/f-ross/F-ROSS01_GATE_F_R1_PIECEWISE_TIMESTEP_ROUTE_RESULT.json)" = 1507366822ca3b5ff22f9cc94b92adc732b7ad67
          test "$(git -C "$root" hash-object experiments/ross/run_ross01_gate_f_r1_piecewise_timestep_route.py)" = 29b006e051492b7540f0c5c17ca469cfabc6f2c5
          test "$(git -C "$root" hash-object experiments/ross/run_ross01_gate_f_timestep_convergence.py)" = bafda0fb4ed6da606c3a1837208200dbcdb05c65
          test "$(git -C "$root" hash-object integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json)" = 76596a00296318b871a9109ed6187bb86ccfae32

  anchors:
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        material: [B01, B12, O01, O05, O14, O18]
    steps:
      - name: Checkout F-ROSS13 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize pinned historical research authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-ross01-fast-mfp-feasibility
          git cat-file -e "$RESEARCH_HEAD^{commit}"
          git worktree add --detach "$RUNNER_TEMP/f-ross01-research" "$RESEARCH_HEAD"
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object experiments/ross/run_ross01_gate_f_r1_piecewise_timestep_route.py)" = 29b006e051492b7540f0c5c17ca469cfabc6f2c5
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object experiments/ross/run_ross01_gate_f_timestep_convergence.py)" = bafda0fb4ed6da606c3a1837208200dbcdb05c65

      - name: Install historical qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy

      - name: Replay frozen historical anchor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 tests/ross/run_ross13_transient_material_qualification.py \
            --research-root "$RUNNER_TEMP/f-ross01-research" \
            --contract "$CONTRACT" \
            --fingerprint-authority "$FINGERPRINT_AUTHORITY" \
            --mode anchor \
            --material "${{ matrix.material }}" \
            --output "out/F-ROSS13_ANCHOR_${{ matrix.material }}_RESULT.json"

      - name: Upload anchor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ross13-anchor-${{ matrix.material }}-${{ github.run_id }}
          path: out/
          if-no-files-found: error

  anchor_gate:
    needs: anchors
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download anchor evidence
        uses: actions/download-artifact@v4
        with:
          pattern: ross13-anchor-*-${{ github.run_id }}
          path: anchor-shards
          merge-multiple: true

      - name: Enforce six-anchor semantic replay gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 tests/ross/aggregate_ross13_transient_qualification.py \
            --contract "$CONTRACT" \
            --input-dir anchor-shards \
            --stage anchors \
            --output out/F-ROSS13_TRANSIENT_ANCHOR_REPLAY_RESULT.json

      - name: Upload anchor gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ross13-anchor-gate-${{ github.run_id }}
          path: out/
          if-no-files-found: error

  extensions:
    needs: anchor_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        material: [B02, B03, B04, B05, B06, B07, B08, B09, B10, B11, B13, B14, B15, B16, B17, B18, O02, O03, O04, O06, O07, O08, O09, O10, O11, O12, O13, O15, O16, O17]
    steps:
      - name: Checkout F-ROSS13 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize pinned historical research authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-ross01-fast-mfp-feasibility
          git cat-file -e "$RESEARCH_HEAD^{commit}"
          git worktree add --detach "$RUNNER_TEMP/f-ross01-research" "$RESEARCH_HEAD"
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object experiments/ross/run_ross01_gate_f_r1_piecewise_timestep_route.py)" = 29b006e051492b7540f0c5c17ca469cfabc6f2c5
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object experiments/ross/run_ross01_gate_f_timestep_convergence.py)" = bafda0fb4ed6da606c3a1837208200dbcdb05c65

      - name: Install historical qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy

      - name: Qualify extension material on fixed 16 x 10 cm geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 tests/ross/run_ross13_transient_material_qualification.py \
            --research-root "$RUNNER_TEMP/f-ross01-research" \
            --contract "$CONTRACT" \
            --fingerprint-authority "$FINGERPRINT_AUTHORITY" \
            --mode extension \
            --material "${{ matrix.material }}" \
            --output "out/F-ROSS13_EXTENSION_${{ matrix.material }}_RESULT.json"

      - name: Upload extension evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ross13-extension-${{ matrix.material }}-${{ github.run_id }}
          path: out/
          if-no-files-found: error

  aggregate:
    needs: [anchor_gate, extensions]
    if: ${{ always() && needs.anchor_gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download anchor material evidence
        uses: actions/download-artifact@v4
        with:
          pattern: ross13-anchor-*-${{ github.run_id }}
          path: all-shards
          merge-multiple: true

      - name: Download extension material evidence
        uses: actions/download-artifact@v4
        with:
          pattern: ross13-extension-*-${{ github.run_id }}
          path: all-shards
          merge-multiple: true

      - name: Aggregate fail-closed 36-material result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 tests/ross/aggregate_ross13_transient_qualification.py \
            --contract "$CONTRACT" \
            --input-dir all-shards \
            --stage all \
            --output out/F-ROSS13_TRANSIENT_36_MATERIAL_QUALIFICATION_RESULT.json

      - name: Upload aggregate qualification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross13-transient-36-material-qualification-${{ github.run_id }}
          path: out/
          if-no-files-found: error
