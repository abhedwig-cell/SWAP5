name: F-ROSS14D1 piecewise failure diagnostics

on:
  push:
    branches:
      - work/f-ross14-top-wetting-forcing-envelope
    paths:
      - 'tests/ross/diagnose_ross14_piecewise_routes.py'
      - 'tests/ross/aggregate_ross14_piecewise_diagnostics.py'
      - '.github/workflows/ross14-piecewise-failure-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-material:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        material:
          - B01
          - B02
          - B03
          - B04
          - B05
          - B06
          - B07
          - B08
          - B09
          - B10
          - B11
          - B12
          - B13
          - B14
          - B15
          - B16
          - B17
          - B18
          - O01
          - O02
          - O03
          - O04
          - O05
          - O06
          - O07
          - O08
          - O09
          - O10
          - O11
          - O12
          - O13
          - O14
          - O15
          - O16
          - O17
          - O18
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin F-ROSS01 research authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-ross01-fast-mfp-feasibility
          test "$(git rev-parse FETCH_HEAD)" = 04807fdcf45453a59b7f6c99fe97f1286c172833
          git worktree add --detach "$RUNNER_TEMP/f-ross01-research" FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json)" = 76596a00296318b871a9109ed6187bb86ccfae32
      - name: Install diagnostic dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema
      - name: Classify exact target-forcing piecewise routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ross14d1-${{ matrix.material }}"
          python3 tests/ross/diagnose_ross14_piecewise_routes.py             --research-root "$RUNNER_TEMP/f-ross01-research"             --fingerprint-authority integration/f-ross/F-ROSS13_36_MATERIAL_N241_FINGERPRINT_AUTHORITY.json             --material "${{ matrix.material }}"             --output "$RUNNER_TEMP/ross14d1-${{ matrix.material }}/diagnostic-${{ matrix.material }}.json"
          cat "$RUNNER_TEMP/ross14d1-${{ matrix.material }}/diagnostic-${{ matrix.material }}.json"
      - name: Upload material diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: f-ross14d1-${{ matrix.material }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ross14d1-${{ matrix.material }}/diagnostic-${{ matrix.material }}.json
          if-no-files-found: error

  aggregate:
    needs: diagnose-material
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: f-ross14d1-*-${{ github.run_id }}
          path: ${{ runner.temp }}/ross14d1-all
          merge-multiple: false
      - name: Aggregate failure surface
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ross/aggregate_ross14_piecewise_diagnostics.py             --input-root "$RUNNER_TEMP/ross14d1-all"             --output "$RUNNER_TEMP/F-ROSS14D1_PIECEWISE_FAILURE_DIAGNOSTIC_RESULT.json"
          cat "$RUNNER_TEMP/F-ROSS14D1_PIECEWISE_FAILURE_DIAGNOSTIC_RESULT.json"
      - name: Upload aggregate diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: f-ross14d1-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROSS14D1_PIECEWISE_FAILURE_DIAGNOSTIC_RESULT.json
          if-no-files-found: error
