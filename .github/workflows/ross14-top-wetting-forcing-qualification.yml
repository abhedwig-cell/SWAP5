name: F-ROSS14 top wetting forcing qualification

on:
  push:
    branches:
      - work/f-ross14-top-wetting-forcing-envelope
    paths:
      - 'integration/f-ross/F-ROSS14_TOP_WETTING_FORCING_ENVELOPE_CONTRACT.json'
      - 'tests/ross/generate_ross14_wetting_oracle.py'
      - 'tests/ross/test_ross14_wetting_kernel_equivalence.f90'
      - 'tests/ross/run_ross14_wetting_material_qualification.sh'
      - 'tests/ross/aggregate_ross14_wetting_qualification.py'
      - 'tests/ross/test_ross14_preimage_boundary_proof.f90'
      - 'tests/ross/run_ross14_preimage_boundary_proof.sh'
      - '.github/workflows/ross14-top-wetting-forcing-qualification.yml'
  pull_request:
    branches:
      - integration/f-ci-canonical
    paths:
      - 'integration/f-ross/F-ROSS14_TOP_WETTING_FORCING_ENVELOPE_CONTRACT.json'
      - 'integration/f-ross/F-ROSS14_TOP_WETTING_FORCING_ENVELOPE_QUALIFICATION_RESULT.json'
      - 'tests/ross/generate_ross14_wetting_oracle.py'
      - 'tests/ross/test_ross14_wetting_kernel_equivalence.f90'
      - 'tests/ross/run_ross14_wetting_material_qualification.sh'
      - 'tests/ross/aggregate_ross14_wetting_qualification.py'
      - 'tests/ross/test_ross14_preimage_boundary_proof.f90'
      - 'tests/ross/run_ross14_preimage_boundary_proof.sh'
      - '.github/workflows/ross14-top-wetting-forcing-qualification.yml'
      - 'src/runtime/mod_rossfast_d3r_model_binding.f90'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preimage-boundary-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Prove current binding rejects exact WETTING target
        run: bash tests/ross/run_ross14_preimage_boundary_proof.sh

  qualify-material:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        material:
          - B01
          - B02
          - B03
          - B04
          - B05
          - B06
          - B07
          - B08
          - B09
          - B10
          - B11
          - B12
          - B13
          - B14
          - B15
          - B16
          - B17
          - B18
          - O01
          - O02
          - O03
          - O04
          - O05
          - O06
          - O07
          - O08
          - O09
          - O10
          - O11
          - O12
          - O13
          - O14
          - O15
          - O16
          - O17
          - O18
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout F-ROSS14 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin F-ROSS01 research authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin work/f-ross01-fast-mfp-feasibility
          test "$(git rev-parse FETCH_HEAD)" = 04807fdcf45453a59b7f6c99fe97f1286c172833
          git worktree add --detach "$RUNNER_TEMP/f-ross01-research" FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object integration/f-ross/F-ROSS01_GATE_C1_MATERIAL_CATALOG.json)" = 76596a00296318b871a9109ed6187bb86ccfae32
          test "$(git -C "$RUNNER_TEMP/f-ross01-research" hash-object experiments/ross/run_ross01_gate_f_timestep_convergence.py)" = bafda0fb4ed6da606c3a1837208200dbcdb05c65

      - name: Install research-oracle dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scipy jsonschema

      - name: Generate pinned research science and wetting oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ross14-${{ matrix.material }}"
          python3 tests/ross/generate_ross14_wetting_oracle.py             --research-root "$RUNNER_TEMP/f-ross01-research"             --contract integration/f-ross/F-ROSS14_TOP_WETTING_FORCING_ENVELOPE_CONTRACT.json             --fingerprint-authority integration/f-ross/F-ROSS13_36_MATERIAL_N241_FINGERPRINT_AUTHORITY.json             --material "${{ matrix.material }}"             --fixture-out "$RUNNER_TEMP/ross14-${{ matrix.material }}/fixture-${{ matrix.material }}.txt"             --metadata-out "$RUNNER_TEMP/ross14-${{ matrix.material }}/metadata-${{ matrix.material }}.json"

      - name: Compiler identity
        run: gfortran --version

      - name: Compare current production kernel with pinned research oracle
        shell: bash
        run: |
          set -euo pipefail
          bash tests/ross/run_ross14_wetting_material_qualification.sh             "${{ matrix.material }}"             "$RUNNER_TEMP/ross14-${{ matrix.material }}/fixture-${{ matrix.material }}.txt"             "$RUNNER_TEMP/ross14-${{ matrix.material }}/metadata-${{ matrix.material }}.json"             | tee "$RUNNER_TEMP/ross14-${{ matrix.material }}/fortran-${{ matrix.material }}.txt"

      - name: Upload material qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross14-${{ matrix.material }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ross14-${{ matrix.material }}/metadata-${{ matrix.material }}.json
            ${{ runner.temp }}/ross14-${{ matrix.material }}/fortran-${{ matrix.material }}.txt
          if-no-files-found: warn

  aggregate:
    needs: [preimage-boundary-proof, qualify-material]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require all prerequisite jobs
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.preimage-boundary-proof.result }}' = success
          test '${{ needs.qualify-material.result }}' = success

      - name: Download material evidence
        uses: actions/download-artifact@v4
        with:
          pattern: f-ross14-*-${{ github.run_id }}
          path: ${{ runner.temp }}/ross14-all
          merge-multiple: false

      - name: Aggregate 36-material qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ross/aggregate_ross14_wetting_qualification.py             --input-root "$RUNNER_TEMP/ross14-all"             --contract integration/f-ross/F-ROSS14_TOP_WETTING_FORCING_ENVELOPE_CONTRACT.json             --output "$RUNNER_TEMP/F-ROSS14_TOP_WETTING_FORCING_ENVELOPE_QUALIFICATION_RESULT.json"
          cat "$RUNNER_TEMP/F-ROSS14_TOP_WETTING_FORCING_ENVELOPE_QUALIFICATION_RESULT.json"

      - name: Upload aggregate qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ross14-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/F-ROSS14_TOP_WETTING_FORCING_ENVELOPE_QUALIFICATION_RESULT.json
          if-no-files-found: error
