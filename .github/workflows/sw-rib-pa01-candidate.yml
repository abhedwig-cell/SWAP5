name: SW-RIB-PA01 coupled profile candidate qualification

on:
  push:
    branches:
      - work/sw-rib-pa01-coupled-profile-production-admission
    paths:
      - 'src/process/mod_drainage_extended_exchange.f90'
      - 'src/runtime/mod_fmr_drainage_response_binding.f90'
      - 'src/runtime/mod_ribasim_surface_water_profile_contract.f90'
      - 'tests/sw-rib-pa01/**'
      - 'integration/sw-rib/SW-RIB-PA01_PREREGISTRATION.json'
      - 'integration/sw-rib/SW-RIB-PA01_SCOPE_AMENDMENT_*.json'
      - '.github/workflows/sw-rib-pa01-candidate.yml'
  pull_request:
    paths:
      - 'src/process/mod_drainage_extended_exchange.f90'
      - 'src/runtime/mod_fmr_drainage_response_binding.f90'
      - 'src/runtime/mod_ribasim_surface_water_profile_contract.f90'
      - 'tests/sw-rib-pa01/**'
      - 'integration/sw-rib/SW-RIB-PA01_PREREGISTRATION.json'
      - 'integration/sw-rib/SW-RIB-PA01_SCOPE_AMENDMENT_*.json'
      - '.github/workflows/sw-rib-pa01-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Candidate profile qualification
        run: bash tests/sw-rib-pa01/run_pa01_candidate.sh
