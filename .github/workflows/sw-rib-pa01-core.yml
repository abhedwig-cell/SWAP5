name: SW-RIB-PA01 production candidate core gates

on:
  push:
    branches:
      - work/sw-rib-pa01-production-admission
  pull_request:
    paths:
      - 'src/process/mod_drainage_extended_exchange.f90'
      - 'src/runtime/mod_fmr_drainage_response_binding.f90'
      - 'src/runtime/mod_fmr_surface_water_owner_contract.f90'
      - 'tests/sw-rib-pa01/**'
      - 'integration/sw-rib-pa01/**'
      - '.github/workflows/sw-rib-pa01-core.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiler identity
        run: gfortran --version
      - name: Owner XOR contract
        run: bash tests/sw-rib-pa01/run_owner_contract.sh
      - name: Transactional signed exchange
        run: bash tests/sw-rib-pa01/run_signed_exchange_runtime.sh
