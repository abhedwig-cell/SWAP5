name: SW-RIB-SWM01 Q1A-R2 real Ribasim external-owner equivalence

on:
  push:
    branches:
      - research/sw-rib-swm01-surfacewater-ownership
    paths:
      - 'src/process/mod_restricted_fixed_weir_surface_water.f90'
      - 'tests/sw-rib-swm01/emit_q1a_fixed_weir_oracle.f90'
      - 'tests/sw-rib-swm01/q1a_real_ribasim_equivalence.jl'
      - 'tests/sw-rib-swm01/generate_q1a_r2_real_ribasim.py'
      - 'tests/sw-rib-swm01/run_q1a_r2_real_ribasim_equivalence.sh'
      - 'integration/research/SW_RIB_SWM01_Q1A_R2_PREREGISTRATION.json'
      - '.github/workflows/sw-rib-swm01-q1a-r2.yml'
  pull_request:
    paths:
      - 'src/process/mod_restricted_fixed_weir_surface_water.f90'
      - 'tests/sw-rib-swm01/emit_q1a_fixed_weir_oracle.f90'
      - 'tests/sw-rib-swm01/q1a_real_ribasim_equivalence.jl'
      - 'tests/sw-rib-swm01/generate_q1a_r2_real_ribasim.py'
      - 'tests/sw-rib-swm01/run_q1a_r2_real_ribasim_equivalence.sh'
      - 'integration/research/SW_RIB_SWM01_Q1A_R2_PREREGISTRATION.json'
      - '.github/workflows/sw-rib-swm01-q1a-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Ribasim product release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Deltares/Ribasim
          ref: e7fc8ade52a4bedeec10e508d2065577f33eb76a
          path: .ribasim-product-release
          fetch-depth: 1
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: latest
          working-directory: .ribasim-product-release
      - name: Compiler identity
        run: gfortran --version
      - name: Q1A-R2 exact-release equivalence qualification
        run: bash tests/sw-rib-swm01/run_q1a_r2_real_ribasim_equivalence.sh
