name: SW-RIB-SWM01 Q2B1 real Ribasim managed band

on:
  push:
    branches:
      - research/sw-rib-swm01-surfacewater-ownership
    paths:
      - 'tests/sw-rib-swm01/generate_q2b1_real_ribasim.py'
      - 'tests/sw-rib-swm01/q2b1_real_ribasim_band.jl'
      - 'tests/sw-rib-swm01/run_q2b1_real_ribasim_band.sh'
      - 'integration/research/SW_RIB_SWM01_Q2B1_*'
      - '.github/workflows/sw-rib-swm01-q2b1.yml'
  pull_request:
    paths:
      - 'tests/sw-rib-swm01/generate_q2b1_real_ribasim.py'
      - 'tests/sw-rib-swm01/q2b1_real_ribasim_band.jl'
      - 'tests/sw-rib-swm01/run_q2b1_real_ribasim_band.sh'
      - 'integration/research/SW_RIB_SWM01_Q2B1_*'
      - '.github/workflows/sw-rib-swm01-q2b1.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Ribasim product release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Deltares/Ribasim
          ref: e7fc8ade52a4bedeec10e508d2065577f33eb76a
          path: .ribasim-product-release
          fetch-depth: 1
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: latest
          working-directory: .ribasim-product-release
      - name: Q2B1 managed-band realization
        run: bash tests/sw-rib-swm01/run_q2b1_real_ribasim_band.sh
