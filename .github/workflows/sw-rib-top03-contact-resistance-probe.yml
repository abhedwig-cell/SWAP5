name: SW-RIB-TOP03 contact-resistance probe
on:
  push:
    branches: [work/sw-rib-top03-transactional-top-exchange]
    paths:
      - 'tests/fapp/mod_top03_microrelief_top_provider.f90'
      - 'tests/fapp/test_sw_rib_top03_contact_resistance_probe.f90'
      - 'tests/fapp/run_sw_rib_top03_contact_resistance_probe.sh'
      - 'integration/sw-rib-top03/TOP03_CONTACT_RESISTANCE_PREREGISTRATION.md'
      - '.github/workflows/sw-rib-top03-contact-resistance-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run finite surface-contact resistance probe
        run: bash tests/fapp/run_sw_rib_top03_contact_resistance_probe.sh
