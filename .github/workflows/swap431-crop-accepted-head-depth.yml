name: SW431 crop accepted F-KT head depth binding
on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_crop_accepted_head_depth_binding.f90'
      - 'tests/fmig431/test_crop_accepted_head_depth_binding.f90'
      - 'tests/fmig431/run_crop_accepted_head_depth_binding.sh'
      - '.github/workflows/swap431-crop-accepted-head-depth.yml'
  workflow_dispatch:
jobs:
  source-o0-o2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fmig431/run_crop_accepted_head_depth_binding.sh
