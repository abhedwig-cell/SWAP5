name: SW431 crop accepted hydraulic provenance qualification
on:
  pull_request:
    paths:
      - 'src/runtime/mod_fmr_crop_accepted_hydraulic_provenance.f90'
      - 'tests/fmig431/run_crop_accepted_hydraulic_provenance.sh'
      - 'tests/fmig431/test_crop_accepted_hydraulic_provenance.f90'
      - '.github/workflows/swap431-crop-accepted-hydraulic-provenance.yml'
  workflow_dispatch:
jobs:
  accepted-hydraulic-source-o0-o2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: gfortran --version
      - name: Compile exact source dependencies and reject invalid F-KT
        run: bash tests/fmig431/run_crop_accepted_hydraulic_provenance.sh
