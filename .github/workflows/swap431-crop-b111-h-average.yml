name: SW431 crop B1.11 pressure-head average qualification
on:
  pull_request:
    paths:
      - 'src/crop/mod_crop_b111_pressure_head_average.f90'
      - 'tests/fmig431/test_crop_b111_pressure_head_average.f90'
      - 'tests/fmig431/run_crop_b111_pressure_head_average.sh'
      - '.github/workflows/swap431-crop-b111-h-average.yml'
  workflow_dispatch:
jobs:
  crop-b111-h-average-o0-o2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fmig431/run_crop_b111_pressure_head_average.sh
