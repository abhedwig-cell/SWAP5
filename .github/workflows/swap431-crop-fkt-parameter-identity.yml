name: SW431 crop F-KT immutable B110 parameter identity qualification
on:
  pull_request:
    paths:
      - 'src/kernel/mod_kernel_transactions.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'tests/fmig431/test_crop_fkt_parameter_identity.f90'
      - 'tests/fmig431/run_crop_fkt_parameter_identity.sh'
      - 'src/runtime/mod_fmr_crop_certified_sowing_source.f90'
      - 'src/runtime/mod_fmr_crop_certified_hydrothermal_forcing.f90'
      - 'tests/fmig431/test_crop_certified_hydrothermal_forcing.f90'
      - 'tests/fmig431/run_crop_certified_hydrothermal_forcing.sh'
      - 'tests/fmig431/test_crop_certified_sowing_source.f90'
      - 'tests/fmig431/run_crop_certified_sowing_source.sh'
      - '.github/workflows/swap431-crop-fkt-parameter-identity.yml'
  workflow_dispatch:
jobs:
  crop-fkt-parameter-identity-o0-o2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: gfortran --version
      - run: bash tests/fmig431/run_crop_fkt_parameter_identity.sh
      - run: bash tests/fmig431/run_crop_certified_sowing_source.sh
      - run: bash tests/fmig431/run_crop_certified_hydrothermal_forcing.sh
