name: SWAP431 crop rootgrow biomass qualification
on:
  pull_request:
    branches: [integration/f-ci-canonical]
  push:
    branches: [work/swap431-crop-rootgrow-biomass-20261007]
    paths:
      - 'src/crop/mod_crop_root_depth_biomass.f90'
      - 'src/crop/mod_wofost_crop_owner_state.f90'
      - 'src/runtime/mod_fmr_reference_et_root_uptake_composition.f90'
      - 'tests/fmig431/test_crop_root_depth_biomass.f90'
      - 'tests/fmig431/test_crop_rootgrow_biomass_profile.f90'
      - 'tests/fmig431/test_crop_rootgrow_biomass_runtime.f90'
      - 'tests/fmig431/run_crop_rootgrow_biomass.py'
      - '.github/workflows/swap431-crop-rootgrow-biomass.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran
      - name: SWRD3 component profile and production runtime
        run: python3 tests/fmig431/run_crop_rootgrow_biomass.py
