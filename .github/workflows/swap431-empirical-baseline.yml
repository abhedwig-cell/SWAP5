name: SWAP431 empirical baseline

on:
  push:
    branches:
      - 'research/swap431-empirical-baseline'
    paths:
      - 'research/empirical-baseline/**'
      - 'tests/empirical_baseline/**'
      - '.github/workflows/swap431-empirical-baseline.yml'
      - 'src/process/mod_reference_et_demand_process.f90'
      - 'src/runtime/mod_fmr_reference_et_demand_binding.f90'
      - 'src/runtime/mod_fmr_serialized_reference_backend.f90'
      - 'src/runtime/mod_fmr_serialized_multiswap_runtime.f90'
      - 'src/runtime/mod_fmr_runtime_core.f90'
      - 'src/kernel/mod_kernel_transactions.f90'
      - 'src/runtime/mod_canonical_contracts.f90'
      - 'src/transaction/mod_transaction_reference.f90'
      - 'src/adapter/mod_reference_richards_legacy_binding.f90'
      - 'src/legacy/b1_10_port/headcalc.f90'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eb-r01-restricted-reference-et:
    name: EB-R01 restricted forcing and reference ET observation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out empirical-baseline capability
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run EB-R01 gate
        shell: bash
        run: bash tests/empirical_baseline/run_eb_r01.sh

  eb-r02-forcing-span-runtime:
    name: EB-R02 current-canonical forcing span observation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out empirical-baseline capability
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run EB-R02 gate
        shell: bash
        run: bash tests/empirical_baseline/run_eb_r02.sh

  eb-r03-effective-forcing-selection:
    name: EB-R03 current-canonical effective forcing selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out empirical-baseline capability
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run EB-R03 gate
        shell: bash
        run: bash tests/empirical_baseline/run_eb_r03.sh

  eb-r04-b110-water-balance:
    name: EB-R04 current-canonical B1.10 water balance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out empirical-baseline capability
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run EB-R04 gate
        shell: bash
        run: bash tests/empirical_baseline/run_eb_r04.sh

  eb-r05-transient-richards-response:
    name: EB-R05 current-canonical transient Richards response
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out empirical-baseline capability
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run EB-R05 gate
        shell: bash
        run: bash tests/empirical_baseline/run_eb_r05.sh
