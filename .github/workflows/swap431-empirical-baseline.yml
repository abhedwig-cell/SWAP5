name: SWAP431 empirical baseline

on:
  push:
    branches:
      - 'research/swap431-empirical-baseline'
    paths:
      - 'research/empirical-baseline/**'
      - 'tests/empirical_baseline/**'
      - '.github/workflows/swap431-empirical-baseline.yml'
      - 'src/process/mod_reference_et_demand_process.f90'
      - 'src/runtime/mod_fmr_reference_et_demand_binding.f90'
      - 'src/runtime/mod_fmr_serialized_multiswap_runtime.f90'
      - 'src/runtime/mod_fmr_runtime_core.f90'
      - 'src/kernel/mod_kernel_transactions.f90'
      - 'src/runtime/mod_canonical_contracts.f90'
      - 'src/transaction/mod_transaction_reference.f90'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eb-r01-restricted-reference-et:
    name: EB-R01 restricted forcing and reference ET observation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out empirical-baseline capability
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin inherited authority
        shell: bash
        run: |
          set -euo pipefail
          BASE=d44b2eb48e7187f8ddc622a5f2329d7a24c24aa0
          FPM06A_HEAD=23206aaf996ffb7dde355508fa2379a5efbd3d57
          MODULE=src/process/mod_reference_et_demand_process.f90
          EXPECTED_MODULE_BLOB=f5e88ec5089fd3b57ac111065fab2aa32dde0fae
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$FPM06A_HEAD^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object "$MODULE")" = "$EXPECTED_MODULE_BLOB"
          test "$(git rev-parse "$FPM06A_HEAD:$MODULE")" = "$EXPECTED_MODULE_BLOB"
          echo 'EB_R01_PINNED_CANONICAL_START=PASS'
          echo 'EB_R01_FPM06A_MODULE_IDENTITY_INHERITED=PASS'

      - name: Compile and observe O0 and O2
        shell: bash
        run: |
          set -euo pipefail
          BUILD="${RUNNER_TEMP}/swap431-eb-r01"
          mkdir -p "$BUILD"
          COMMON=(-std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow)
          for opt in 0 2; do
            OUT="$BUILD/o$opt"
            mkdir -p "$OUT"
            gfortran "${COMMON[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              src/process/mod_reference_et_demand_process.f90 -o "$OUT/mod_reference_et_demand_process.o"
            gfortran "${COMMON[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              tests/empirical_baseline/observe_restricted_reference_et.f90 -o "$OUT/observe_restricted_reference_et.o"
            gfortran -O"$opt" \
              "$OUT/mod_reference_et_demand_process.o" "$OUT/observe_restricted_reference_et.o" \
              -o "$OUT/observe_restricted_reference_et"
            "$OUT/observe_restricted_reference_et" > "$OUT/observations.csv"
          done
          cmp "$BUILD/o0/observations.csv" "$BUILD/o2/observations.csv"
          echo 'EB_R01_O0_O2_OBSERVATION_IDENTITY=PASS'
          cat "$BUILD/o0/observations.csv"
          echo "EB_R01_OBSERVATION_SHA256=$(sha256sum "$BUILD/o0/observations.csv" | cut -d' ' -f1)"

      - name: Falsify numerical anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import math
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'swap431-eb-r01' / 'o0' / 'observations.csv'
          with path.open(newline='') as handle:
              rows = {row['case_id']: row for row in csv.DictReader(handle)}

          expected = {
              'zero_forcing_bare': (0.0, 0.0, 0.0),
              'bare_5p2': (0.0, 0.52, 0.624),
              'inactive_cover_0p30': (0.0, 0.364, 0.4368),
              'active_cover_0p25': (0.1, 0.3, 0.3),
              'active_reference': (0.33462, 0.182, 0.2184),
              'active_full_cover': (0.5148, 0.0, 0.0),
              'active_half_variable': (0.1288, 0.115, 0.0805),
              'active_no_pond': (0.26, 0.26, 0.0),
          }
          if set(rows) != set(expected):
              raise SystemExit(f'case set mismatch: {sorted(rows)}')

          fields = ('ptra_cm_per_day', 'peva_cm_per_day', 'epond_cm_per_day')
          for case_id, anchors in expected.items():
              row = rows[case_id]
              if int(row['status']) != 0:
                  raise SystemExit(f'{case_id}: nonzero status {row["status"]}')
              for field, anchor in zip(fields, anchors):
                  observed = float(row[field])
                  if not math.isclose(observed, anchor, rel_tol=0.0, abs_tol=2.0e-14):
                      raise SystemExit(f'{case_id}: {field} observed={observed} expected={anchor}')

          print('EB_R01_NUMERICAL_ANCHORS=PASS')
          print('EB_R01_RESTRICTED_REFERENCE_ET_OBSERVATION PASS')
          PY

  eb-r02-forcing-span-runtime:
    name: EB-R02 current-canonical forcing span observation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out empirical-baseline capability
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin inherited F-MR23 seam
        shell: bash
        run: |
          set -euo pipefail
          FMR23_TESTED=3965b15ad0432b46134513eb13ec02a17f7d6b17
          BINDING=src/runtime/mod_fmr_reference_et_demand_binding.f90
          PROCESS=src/process/mod_reference_et_demand_process.f90
          EXPECTED_BINDING_BLOB=8c679f911c9a82c498258224d83f5fce3cb09163
          EXPECTED_PROCESS_BLOB=f5e88ec5089fd3b57ac111065fab2aa32dde0fae
          git cat-file -e "$FMR23_TESTED^{commit}"
          test "$(git hash-object "$BINDING")" = "$EXPECTED_BINDING_BLOB"
          test "$(git rev-parse "$FMR23_TESTED:$BINDING")" = "$EXPECTED_BINDING_BLOB"
          test "$(git hash-object "$PROCESS")" = "$EXPECTED_PROCESS_BLOB"
          echo 'EB_R02_FMR23_BINDING_IDENTITY_INHERITED=PASS'
          echo 'EB_R02_REFERENCE_ET_PROCESS_IDENTITY_INHERITED=PASS'

      - name: Compile and observe forcing span O0 and O2
        shell: bash
        run: |
          set -euo pipefail
          BUILD="${RUNNER_TEMP}/swap431-eb-r02"
          mkdir -p "$BUILD"
          COMMON=(-std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow)
          for opt in 0 2; do
            OUT="$BUILD/o$opt"
            mkdir -p "$OUT"
            gfortran "${COMMON[@]}" -Wno-error=compare-reals -O"$opt" -J "$OUT" -I "$OUT" -c \
              src/transaction/mod_transaction_reference.f90 -o "$OUT/mod_transaction_reference.o"
            gfortran "${COMMON[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              src/runtime/mod_canonical_contracts.f90 -o "$OUT/mod_canonical_contracts.o"
            gfortran "${COMMON[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              src/process/mod_reference_et_demand_process.f90 -o "$OUT/mod_reference_et_demand_process.o"
            gfortran "${COMMON[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              src/runtime/mod_fmr_reference_et_demand_binding.f90 -o "$OUT/mod_fmr_reference_et_demand_binding.o"
            gfortran "${COMMON[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              tests/empirical_baseline/observe_reference_et_forcing_span.f90 -o "$OUT/observe_reference_et_forcing_span.o"
            gfortran -O"$opt" \
              "$OUT/mod_transaction_reference.o" "$OUT/mod_canonical_contracts.o" \
              "$OUT/mod_reference_et_demand_process.o" "$OUT/mod_fmr_reference_et_demand_binding.o" \
              "$OUT/observe_reference_et_forcing_span.o" -o "$OUT/observe_reference_et_forcing_span"
            "$OUT/observe_reference_et_forcing_span" > "$OUT/observations.csv"

            gfortran "${COMMON[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              tests/fmr/test_fmr23_reference_et_runtime_binding.f90 -o "$OUT/test_fmr23_reference_et_runtime_binding.o"
            gfortran -O"$opt" \
              "$OUT/mod_transaction_reference.o" "$OUT/mod_canonical_contracts.o" \
              "$OUT/mod_reference_et_demand_process.o" "$OUT/mod_fmr_reference_et_demand_binding.o" \
              "$OUT/test_fmr23_reference_et_runtime_binding.o" -o "$OUT/test_fmr23_reference_et_runtime_binding"
            "$OUT/test_fmr23_reference_et_runtime_binding" > "$OUT/fmr23-output.txt"
          done
          cmp "$BUILD/o0/observations.csv" "$BUILD/o2/observations.csv"
          cmp "$BUILD/o0/fmr23-output.txt" "$BUILD/o2/fmr23-output.txt"
          test "$(sha256sum "$BUILD/o0/fmr23-output.txt" | cut -d' ' -f1)" = 443f03b0fcc30a8e669c2db690eb94d2bd095606cbff11f75d82aa9cd88730d5
          echo 'EB_R02_O0_O2_OBSERVATION_IDENTITY=PASS'
          echo 'EB_R02_HISTORICAL_FMR23_OUTPUT_IDENTITY=PASS'
          cat "$BUILD/o0/observations.csv"
          echo "EB_R02_OBSERVATION_SHA256=$(sha256sum "$BUILD/o0/observations.csv" | cut -d' ' -f1)"

      - name: Falsify forcing-span anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import math
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'swap431-eb-r02' / 'o0' / 'observations.csv'
          with path.open(newline='') as handle:
              rows = {row['case_id']: row for row in csv.DictReader(handle)}

          expected = {
              'contained_quarter': (0, 0, 0.25, True, True, 0.33462, 0.182, 0.2184),
              'contained_late': (0, 0, 0.35, True, True, 0.33462, 0.182, 0.2184),
              'left_not_covered': (3, 0, 0.20, False, False, 0.0, 0.0, 0.0),
              'invalid_zero_span': (2, 0, 0.10, False, False, 0.0, 0.0, 0.0),
              'negative_et': (4, 1, 0.10, True, False, 0.0, 0.0, 0.0),
              'nonemerged_cover': (0, 0, 0.20, True, True, 0.0, 0.364, 0.4368),
          }
          if set(rows) != set(expected):
              raise SystemExit(f'case set mismatch: {sorted(rows)}')

          duration_tolerance = 2.0 * math.ulp(2701.0)
          output_tolerance = 2.0e-13

          for case_id, anchor in expected.items():
              row = rows[case_id]
              status, process_status, duration, called, produced, ptra, peva, epond = anchor
              if int(row['status']) != status or int(row['process_status']) != process_status:
                  raise SystemExit(f'{case_id}: status mismatch {row}')
              if (row['process_called'] == 'T') != called or (row['result_produced'] == 'T') != produced:
                  raise SystemExit(f'{case_id}: call/result flags mismatch {row}')
              observed_duration = float(row['duration'])
              if not math.isclose(observed_duration, duration, rel_tol=0.0, abs_tol=duration_tolerance):
                  raise SystemExit(f'{case_id}: duration={observed_duration} target={duration} tol={duration_tolerance}')
              values = [float(row['ptra_cm_per_day']), float(row['peva_cm_per_day']), float(row['epond_cm_per_day'])]
              targets = [ptra, peva, epond]
              for value, target in zip(values, targets):
                  if not math.isclose(value, target, rel_tol=0.0, abs_tol=output_tolerance):
                      raise SystemExit(f'{case_id}: value={value} target={target}')

          print('EB_R02_FORCING_SPAN_ANCHORS=PASS')
          print('EB_R02_CURRENT_CANONICAL_FORCING_SPAN_OBSERVATION PASS')
          PY

  eb-r03-effective-forcing-selection:
    name: EB-R03 current-canonical effective forcing selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out empirical-baseline capability
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin current dispatcher and historical oracle boundary
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=src/runtime/mod_fmr_serialized_multiswap_runtime.f90
          CURRENT_BLOB=1aa2454048d0e480becaee34f596f20f1a7bd66e
          HISTORICAL_FMR38=b2e31bc8993075bc346f80ad7eb9dc4d92ff7ded
          HISTORICAL_BLOB=f06a2eef7b47880e449cf9b201342d7bd1e197e1
          git cat-file -e "$HISTORICAL_FMR38^{commit}"
          test "$(git hash-object "$RUNTIME")" = "$CURRENT_BLOB"
          test "$(git rev-parse "$HISTORICAL_FMR38:$RUNTIME")" = "$HISTORICAL_BLOB"
          test "$CURRENT_BLOB" != "$HISTORICAL_BLOB"
          grep -Fq 'forcing_index = int(column%forcing_handle)' "$RUNTIME"
          grep -Fq 'forcing_registry(forcing_index)' "$RUNTIME"
          grep -Fq 'type(fmr_b110_physical_forcing_t), intent(in) :: effective_forcing' "$RUNTIME"
          echo 'EB_R03_CURRENT_RUNTIME_BLOB_PINNED=PASS'
          echo 'EB_R03_HISTORICAL_FMR38_USED_AS_ORACLE_NOT_INHERITED=PASS'
          echo 'EB_R03_CURRENT_REGISTRY_AND_RESOLVED_FORCING_SEAMS_PRESENT=PASS'

      - name: Compile current dispatcher with forcing probe backend
        shell: bash
        run: |
          set -euo pipefail
          BUILD="${RUNNER_TEMP}/swap431-eb-r03"
          mkdir -p "$BUILD"
          STRICT=(-std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow)
          BASE=(-std=f2008 -ffree-line-length-none -Wall -Wextra -Werror -Wno-error=compare-reals -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow)
          MODULES=(
            src/transaction/mod_transaction_reference.f90
            src/runtime/mod_canonical_contracts.f90
            src/runtime/mod_canonical_interval_runtime.f90
            src/kernel/mod_kernel_transactions.f90
            src/runtime/mod_fmr_runtime_core.f90
            src/runtime/mod_fmr_checkpoint_orchestrator.f90
            src/solver/mod_soil_water_solver_contract.f90
            src/runtime/mod_fmr_bottom_thermal_carrier.f90
            src/process/mod_liquid_water_sensible_enthalpy.f90
            src/runtime/mod_fmr_bottom_external_thermal_binding.f90
            src/runtime/mod_fmr_bottom_external_thermal_provider.f90
            src/runtime/mod_fmr_bottom_sensible_energy.f90
            src/runtime/mod_fmr_accepted_commit_receipt.f90
            src/runtime/mod_fmr_owned_commit_receipt.f90
          )
          for opt in 0 2; do
            OUT="$BUILD/o$opt"
            mkdir -p "$OUT"
            objects=()
            for src in "${MODULES[@]}"; do
              obj="$OUT/$(basename "${src%.*}").o"
              gfortran "${BASE[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c "$src" -o "$obj"
              objects+=("$obj")
            done
            gfortran "${STRICT[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              tests/empirical_baseline/mod_eb_r03_forcing_probe_backend.f90 -o "$OUT/mod_eb_r03_forcing_probe_backend.o"
            objects+=("$OUT/mod_eb_r03_forcing_probe_backend.o")
            gfortran "${STRICT[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              src/runtime/mod_fmr_serialized_multiswap_runtime.f90 -o "$OUT/mod_fmr_serialized_multiswap_runtime.o"
            objects+=("$OUT/mod_fmr_serialized_multiswap_runtime.o")
            gfortran "${STRICT[@]}" -O"$opt" -J "$OUT" -I "$OUT" -c \
              tests/empirical_baseline/observe_effective_forcing_selection.f90 -o "$OUT/observe_effective_forcing_selection.o"
            gfortran -O"$opt" "${objects[@]}" "$OUT/observe_effective_forcing_selection.o" \
              -o "$OUT/observe_effective_forcing_selection"
            "$OUT/observe_effective_forcing_selection" > "$OUT/observations.csv"
          done
          cmp "$BUILD/o0/observations.csv" "$BUILD/o2/observations.csv"
          echo 'EB_R03_O0_O2_OBSERVATION_IDENTITY=PASS'
          cat "$BUILD/o0/observations.csv"
          echo "EB_R03_OBSERVATION_SHA256=$(sha256sum "$BUILD/o0/observations.csv" | cut -d' ' -f1)"

      - name: Falsify forcing selection and statelessness anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import math
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'swap431-eb-r03' / 'o0' / 'observations.csv'
          with path.open(newline='') as handle:
              rows = {row['case_id']: row for row in csv.DictReader(handle)}

          expected = {
              'registry_a': ('registry', 1, 1.0, True, 'ADMITTED', 0.1, 0.1, 1, 0),
              'registry_b': ('registry', 2, 2.5, True, 'ADMITTED', 0.25, 0.25, 1, 0),
              'registry_a_replay': ('registry', 1, 1.0, True, 'ADMITTED', 0.1, 0.1, 1, 0),
              'resolved_b_with_handle_a': ('resolved', 1, 2.5, True, 'ADMITTED', 0.25, 0.25, 1, 0),
              'invalid_handle': ('registry', 3, -1.0, False, 'ROUTING_REJECTED', 0.0, 0.0, 0, 0),
          }
          if set(rows) != set(expected):
              raise SystemExit(f'case set mismatch: {sorted(rows)}')

          for case_id, anchor in expected.items():
              row = rows[case_id]
              route, handle, scale, committed, admission, total_in, storage_change, revision, active = anchor
              if row['route'] != route or int(row['forcing_handle']) != handle:
                  raise SystemExit(f'{case_id}: route/handle mismatch {row}')
              if not math.isclose(float(row['effective_scale']), scale, rel_tol=0.0, abs_tol=1e-15):
                  raise SystemExit(f'{case_id}: effective scale mismatch {row}')
              if (row['committed'] == 'T') != committed or row['admission_status'].strip() != admission:
                  raise SystemExit(f'{case_id}: commit/admission mismatch {row}')
              if not math.isclose(float(row['total_in']), total_in, rel_tol=0.0, abs_tol=2e-13):
                  raise SystemExit(f'{case_id}: total_in mismatch {row}')
              if not math.isclose(float(row['storage_change']), storage_change, rel_tol=0.0, abs_tol=2e-13):
                  raise SystemExit(f'{case_id}: storage_change mismatch {row}')
              if int(row['final_revision']) != revision or int(row['active_calls']) != active:
                  raise SystemExit(f'{case_id}: revision/active mismatch {row}')

          if rows['registry_a']['total_in'] != rows['registry_a_replay']['total_in']:
              raise SystemExit('A-B-A registry forcing replay is not textually identical')
          if rows['registry_b']['total_in'] != rows['resolved_b_with_handle_a']['total_in']:
              raise SystemExit('resolved explicit forcing B does not reproduce registry forcing B')

          print('EB_R03_HANDLE_SELECTS_EFFECTIVE_FORCING=PASS')
          print('EB_R03_A_B_A_FORCING_STATELESS_REPLAY=PASS')
          print('EB_R03_RESOLVED_FORCING_OVERRIDES_REGISTRY_HANDLE=PASS')
          print('EB_R03_INVALID_HANDLE_FAILS_PRETRIAL=PASS')
          print('EB_R03_CURRENT_CANONICAL_EFFECTIVE_FORCING_OBSERVATION PASS')
          PY
