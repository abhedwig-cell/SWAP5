name: SWAP431 nutrient-solute owner qualification

concurrency:
  group: swap431-nut-sol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
      - qualification/swap431-nut-sol-base-20261007
    paths:
      - 'src/crop/mod_b111_crop_n_fixation_policy.f90'
      - 'src/process/mod_soil_n_pool_state.f90'
      - 'src/process/mod_solute_compartment_state.f90'
      - 'tests/fwof/pp02/test_b111_crop_n_fixation_policy.f90'
      - 'tests/fwof/pp02/run_b111_crop_n_fixation_policy.sh'
      - 'tests/physics/test_soil_n_pool_state.f90'
      - 'tests/physics/run_soil_n_pool_state.sh'
      - 'tests/physics/test_solute_compartment_state.f90'
      - 'tests/physics/run_solute_compartment_state.sh'
      - 'docs/decisions/ADR-0006-soil-n-owner.md'
      - 'docs/decisions/ADR-0007-solute-compartment-ownership.md'
      - 'integration/audits/MC_NUT01_ORGANIC_SOURCE_DECISION.md'
      - 'integration/audits/evidence/SWAP431_B111_AUTHORITY.tar.gz.b64'
      - 'tools/audits/probe_b111_nfix_policy.py'
      - 'tools/audits/extract_b111_solute_slices.py'
      - 'tools/audits/probe_b111_nut_sol_exact_source.py'
      - 'src/process/mod_soil_n_reaction_transfer.f90'
      - 'src/process/mod_b111_soil_n_rate_factors.f90'
      - 'src/process/mod_b111_soil_n_addition.f90'
      - 'src/process/mod_b111_soil_n_transport.f90'
      - 'src/process/mod_solute_compartment_state.f90'
      - 'src/process/mod_solute_sorption_transfer.f90'
      - 'src/process/mod_b111_solute_sorption.f90'
      - 'src/process/mod_b111_solute_decay.f90'
      - 'src/process/mod_b111_pond_solute_exchange.f90'
      - 'src/process/mod_b111_age_tracer_production.f90'
      - 'src/runtime/mod_fmr_b111_soil_n_transaction.f90'
      - 'tests/physics/test_soil_n_reaction_transfer.f90'
      - 'tests/physics/test_b111_soil_n_rate_factors.f90'
      - 'tests/physics/test_b111_soil_n_addition.f90'
      - 'tests/physics/test_b111_soil_n_transport.f90'
      - 'tests/physics/test_solute_compartment_state.f90'
      - 'tests/physics/test_solute_sorption_transfer.f90'
      - 'tests/physics/test_b111_solute_sorption_decay.f90'
      - 'tests/physics/test_b111_pond_age.f90'
      - 'tests/physics/run_swap431_nut_sol_owner_components.sh'
      - 'tests/physics/test_fmr_b111_soil_n_transaction.f90'
      - 'tests/physics/run_fmr_b111_soil_n_transaction.sh'
      - 'tools/audits/extract_b111_solute_slices.py'
      - '.github/workflows/swap431-nut-sol.yml'
  workflow_dispatch:

jobs:
  owner-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: B1.11 fixation policy
        run: bash tests/fwof/pp02/run_b111_crop_n_fixation_policy.sh
      - name: Exact B1.11 fixation oracle
        run: python tools/audits/probe_b111_nfix_policy.py
      - name: Materialize exact B1.11 solute source slices
        run: python tools/audits/extract_b111_solute_slices.py
      - name: Soil-N pool owner
        run: bash tests/physics/run_soil_n_pool_state.sh
      - name: SOL01 companion compartment state
        run: bash tests/physics/run_solute_compartment_state.sh
      - name: Inspect exact B1.11 solute source slices
        run: python tools/audits/extract_b111_solute_slices.py
      - name: Exact B1.11 NUT/SOL source gate
        run: python tools/audits/probe_b111_nut_sol_exact_source.py
      - name: NUT/SOL owner and reaction components
        run: bash tests/physics/run_swap431_nut_sol_owner_components.sh
      - name: Soil-N transaction rollback and restart
        run: bash tests/physics/run_fmr_b111_soil_n_transaction.sh
