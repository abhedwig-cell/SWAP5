name: SWAP431 nutrient-solute owner qualification

on:
  pull_request:
    branches:
      - integration/f-ci-canonical
      - qualification/swap431-nut-sol-base-20261007
    paths:
      - 'src/crop/mod_b111_crop_n_fixation_policy.f90'
      - 'src/process/mod_soil_n_pool_state.f90'
      - 'tests/fwof/pp02/test_b111_crop_n_fixation_policy.f90'
      - 'tests/fwof/pp02/run_b111_crop_n_fixation_policy.sh'
      - 'tests/physics/test_soil_n_pool_state.f90'
      - 'tests/physics/run_soil_n_pool_state.sh'
      - 'docs/decisions/ADR-0006-soil-n-owner.md'
      - 'integration/audits/evidence/SWAP431_B111_AUTHORITY.tar.gz.b64'
      - 'tools/audits/probe_b111_nfix_policy.py'
      - 'tools/audits/extract_b111_solute_slices.py'
      - 'tools/audits/extract_b111_solute_slices.py'
      - '.github/workflows/swap431-nut-sol.yml'
  workflow_dispatch:

jobs:
  owner-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: B1.11 fixation policy
        run: bash tests/fwof/pp02/run_b111_crop_n_fixation_policy.sh
      - name: Exact B1.11 fixation oracle
        run: python tools/audits/probe_b111_nfix_policy.py
      - name: Materialize exact B1.11 solute source slices
        run: python tools/audits/extract_b111_solute_slices.py
      - name: Soil-N pool owner
        run: bash tests/physics/run_soil_n_pool_state.sh
      - name: Inspect exact B1.11 solute source slices
        run: python tools/audits/extract_b111_solute_slices.py
