  workflow_dispatch:

jobs:
  owner-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: B1.11 fixation policy
        run: bash tests/fwof/pp02/run_b111_crop_n_fixation_policy.sh
      - name: Exact B1.11 fixation oracle
        run: python tools/audits/probe_b111_nfix_policy.py
      - name: Materialize exact B1.11 solute source slices
        run: python tools/audits/extract_b111_solute_slices.py
      - name: Soil-N pool owner
        run: bash tests/physics/run_soil_n_pool_state.sh
      - name: SOL01 companion compartment state
        run: bash tests/physics/run_solute_compartment_state.sh
      - name: Inspect exact B1.11 solute source slices
        run: python tools/audits/extract_b111_solute_slices.py
      - name: Exact B1.11 NUT/SOL source gate
        run: python tools/audits/probe_b111_nut_sol_exact_source.py
      - name: NUT/SOL owner and reaction components
        run: bash tests/physics/run_swap431_nut_sol_owner_components.sh
      - name: Soil-N transaction rollback and restart
        run: bash tests/physics/run_fmr_b111_soil_n_transaction.sh
      - name: Integrated daily Soil-N transaction
        run: bash tests/physics/run_fmr_b111_soil_n_daily_transaction.sh
      - name: Coupled Soil-Crop N transaction
        run: bash tests/fwof/pp02/run_fmr_b111_soil_crop_n_transaction.sh
      - name: Atomic Soil-N crop-N transaction
        run: bash tests/physics/run_fmr_b111_soil_crop_n_transaction.sh
      - name: Reactive solute transaction rollback and restart
        run: bash tests/physics/run_fmr_b111_solute_transaction.sh
      - name: Nonlinear Freundlich mass-closure O0 O2
        run: bash tests/physics/run_b111_sorption_mass_closure.sh
      - name: Exact-order reactive solute substep
        run: bash tests/physics/run_b111_reactive_solute_substep.sh
      - name: AgeTracer transport and pond continuation
        run: bash tests/physics/run_b111_age_tracer_substep.sh
      - name: Atomic reactive chemistry and AgeTracer transaction
        run: bash tests/physics/run_fmr_b111_reactive_solute_transaction.sh
      - name: Reactive solute layout restart
        run: python tests/physics/run_b111_reactive_solute_restart_layout.py
      - name: Accepted water carrier to reactive transaction
        run: python tests/physics/run_fmr_b111_reactive_water_carrier.py
