name: TAB P3B greedy constitutive-error placement

on:
  push:
    branches: [research/tab-speed-accuracy]
    paths:
      - '.github/workflows/tab-speed-accuracy-greedy-placement.yml'
      - 'research/tabulated_hydraulics/TAB_SPEED_ACCURACY_P3B_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  greedy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        rows: [25, 32, 40]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Generate deterministic greedy-grid research source
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ matrix.rows }}" <<'PY'
          from pathlib import Path
          import re,sys
          n=int(sys.argv[1])
          p=Path('src/solver/mod_b110_generated_mvg_table_state.f90')
          s=p.read_text()
          s,k=re.subn(r'integer, parameter, public :: B110_GENERATED_MVG_TABLE_N = [0-9]+',
                      f'integer, parameter, public :: B110_GENERATED_MVG_TABLE_N = {n}',s,count=1)
          assert k==1
          p.write_text(s)
          PY
          # P3B implementation is intentionally generated in a separate helper
          # source patch so production code is not mutated outside this job.
          python3 research/tabulated_hydraulics/tab_p3b_generate_greedy_source.py             src/solver/mod_b110_generated_mvg_table_state.f90             src/solver/mod_b110_generated_mvg_table_state.f90
      - name: Characterize greedy candidate
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fsi/run_ftab02e_generated_provider_performance.sh | tee TAB-P3B-${{ matrix.rows }}.log
          cp F-TAB02-E_SUMMARY.tsv TAB-P3B-${{ matrix.rows }}.tsv
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-p3b-greedy-${{ matrix.rows }}
          path: |
            TAB-P3B-${{ matrix.rows }}.log
            TAB-P3B-${{ matrix.rows }}.tsv
          if-no-files-found: warn
