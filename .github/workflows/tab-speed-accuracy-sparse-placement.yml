name: TAB sparse placement characterization

on:
  push:
    branches:
      - research/tab-speed-accuracy
    paths:
      - '.github/workflows/tab-speed-accuracy-sparse-placement.yml'
      - 'research/tabulated_hydraulics/TAB_SPEED_ACCURACY_P3_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rows: [25, 32, 40]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Bind sparse candidate
        shell: bash
        run: |
          python3 - "${{ matrix.rows }}" <<'PY'
          from pathlib import Path
          import re,sys
          n=int(sys.argv[1]); p=Path('src/solver/mod_b110_generated_mvg_table_state.f90'); s=p.read_text()
          s,k=re.subn(r'integer, parameter, public :: B110_GENERATED_MVG_TABLE_N = [0-9]+',f'integer, parameter, public :: B110_GENERATED_MVG_TABLE_N = {n}',s,count=1)
          assert k==1 and 'B110_GENERATED_MVG_CURVATURE_GRID = .true.' in s
          p.write_text(s)
          PY
      - name: Characterize
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fsi/run_ftab02e_generated_provider_performance.sh | tee TAB-P3-${{ matrix.rows }}.log
          cp F-TAB02-E_SUMMARY.tsv TAB-P3-${{ matrix.rows }}.tsv
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-p3-sparse-${{ matrix.rows }}
          path: |
            TAB-P3-${{ matrix.rows }}.log
            TAB-P3-${{ matrix.rows }}.tsv
          if-no-files-found: error
