name: TAB-HYD branch-aware constitutive profile

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-constitutive-profile.yml'
      - 'research/tabulated_hydraulics/branch_aware_constitutive_profile.f90'
      - 'research/tabulated_hydraulics/prepare_envelope_cases.py'
      - 'research/tabulated_hydraulics/prepare_envelope_cases_loghead.py'
      - 'research/tabulated_hydraulics/patch_table_ksat_plateau_split.py'
      - 'research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py'

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Checkout current public SWAP source
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: c22bd832ddf3e53e330a552f5e31e74f183362d1
          path: swap-src

      - name: Checkout Staring parameters
        uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Apply derivative-consistent and branch-aware research patches
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py             swap-src/src/utils/soilhydraulicsutils.f90
          python3 research/tabulated_hydraulics/patch_table_ksat_plateau_split.py             swap-src/src/utils/soilhydraulicsutils.f90 swap-src/src/io/readswap.f90

      - name: Generate 250-row log-head branch-aware tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/constitutive-profile/inputs
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util

          p=Path("research/tabulated_hydraulics/prepare_envelope_cases_loghead.py")
          spec=importlib.util.spec_from_file_location("prep_log",p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          prep=mod.prep

          series=prep.read_staring(
              Path("staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv")
          )
          out=Path("build/constitutive-profile/inputs")
          for soil in ("b9","o9","b12","o13"):
              par=series[soil]
              rows=mod.loghead_rows(par,250)
              with (out/f"{soil}.dat").open("w") as fh:
                  fh.write(
                      f"{len(rows)} {par['ores']:.17e} {par['osat']:.17e} "
                      f"{par['alpha']:.17e} {par['n']:.17e} "
                      f"{par['ksat']:.17e} {par['lexp']:.17e}\n"
                  )
                  for h,theta,k in rows:
                      fh.write(f"{h:.17e} {theta:.17e} {k:.17e}\n")
          PY

      - name: Compile actual wrappers and table evaluator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/constitutive-profile/mod
          FLAGS="-O0 -g -std=f2018 -ffree-line-length-none -fcheck=all -fbacktrace"
          gfortran $FLAGS -J build/constitutive-profile/mod             -c research/tabulated_hydraulics/array_dimensions_stub.f90             -o build/constitutive-profile/arrays.o
          gfortran $FLAGS -I build/constitutive-profile/mod -J build/constitutive-profile/mod             -c research/tabulated_hydraulics/current_wrapper_stubs.f90             -o build/constitutive-profile/stubs.o
          gfortran $FLAGS -I build/constitutive-profile/mod -J build/constitutive-profile/mod             -c swap-src/src/soil/sptabulated.f90             -o build/constitutive-profile/sptabulated.o
          gfortran $FLAGS -I build/constitutive-profile/mod -J build/constitutive-profile/mod             -c swap-src/src/utils/soilhydraulicsutils.f90             -o build/constitutive-profile/wrappers.o
          gfortran $FLAGS -I build/constitutive-profile/mod -J build/constitutive-profile/mod             research/tabulated_hydraulics/branch_aware_constitutive_profile.f90             build/constitutive-profile/arrays.o build/constitutive-profile/stubs.o             build/constitutive-profile/sptabulated.o build/constitutive-profile/wrappers.o             -o build/constitutive-profile/profile

      - name: Run four-soil constitutive profiles
        shell: bash
        run: |
          set -euo pipefail
          : > build/constitutive-profile/results.csv
          first=1
          for soil in b9 o9 b12 o13; do
            build/constitutive-profile/profile "$soil"               "build/constitutive-profile/inputs/$soil.dat" > "build/constitutive-profile/$soil.csv"
            if [ "$first" -eq 1 ]; then
              grep -v '^BRANCH_AWARE_' "build/constitutive-profile/$soil.csv" > build/constitutive-profile/results.csv
              first=0
            else
              grep -v -E '^(soil,|BRANCH_AWARE_)' "build/constitutive-profile/$soil.csv" >> build/constitutive-profile/results.csv
            fi
          done

      - name: Summarize error magnitude and location
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, math

          rows=[]
          with Path("build/constitutive-profile/results.csv").open() as fh:
              for r in csv.DictReader(fh):
                  for k in r:
                      if k != "soil":
                          r[k]=float(r[k])
                  rows.append(r)

          by={}
          for r in rows:
              by.setdefault(r["soil"],[]).append(r)

          def maxloc(rr, fn):
              vals=[(fn(r),r) for r in rr]
              v,r=max(vals,key=lambda x:x[0])
              return v,r["h_cm"]

          out=[]
          out.append("soil\tmetric\tmaximum\th_cm")
          for soil,rr in sorted(by.items()):
              metrics={
                  "theta_abs": lambda r: abs(r["theta_table"]-r["theta_analytic"]),
                  "C_abs": lambda r: abs(r["C_table"]-r["C_analytic"]),
                  "C_rel": lambda r: abs(r["C_table"]-r["C_analytic"])/max(abs(r["C_analytic"]),1e-12),
                  "log10K_abs": lambda r: abs(math.log10(max(r["K_table"],1e-300))-math.log10(max(r["K_analytic"],1e-300))),
                  "K_rel": lambda r: abs(r["K_table"]-r["K_analytic"])/max(abs(r["K_analytic"]),1e-12),
                  "dKdh_abs": lambda r: abs(r["dKdh_table"]-r["dKdh_analytic"]),
              }
              for name,fn in metrics.items():
                  v,h=maxloc(rr,fn)
                  out.append(f"{soil}\t{name}\t{v:.17e}\t{h:.17e}")
          Path("build/constitutive-profile/summary.tsv").write_text("\n".join(out)+"\n")
          print(Path("build/constitutive-profile/summary.tsv").read_text(),end="")

          # Also preserve a compact near-saturation subset where clay errors are most likely.
          with Path("build/constitutive-profile/near_saturation.csv").open("w",newline="") as fh:
              w=csv.DictWriter(fh,fieldnames=list(rows[0].keys()))
              w.writeheader()
              for r in rows:
                  if r["soil"] in ("b12","o13") and -0.1 <= r["h_cm"] <= -1e-6:
                      w.writerow(r)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-branch-aware-constitutive-profile
          path: |
            build/constitutive-profile/results.csv
            build/constitutive-profile/summary.tsv
            build/constitutive-profile/near_saturation.csv
