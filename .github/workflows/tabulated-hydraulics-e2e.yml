name: TAB-HYD legacy-runtime end-to-end characterization

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - 'research/tabulated_hydraulics/prepare_hupsel_e2e.py'
      - 'research/tabulated_hydraulics/compare_hupsel_e2e.py'
      - '.github/workflows/tabulated-hydraulics-e2e.yml'

jobs:
  hupsel-analytical-vs-table:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SWAP5 research branch
        uses: actions/checkout@v4

      - name: Checkout pre-strangler SWAP runtime
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: legacy-runtime

      - name: Materialize toml-f dependency required by build
        uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: legacy-runtime/subprojects/toml-f

      - name: Materialize ttutil dependency
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: legacy-runtime/subprojects/ttutil

      - name: Checkout pinned public regression cases
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build pre-strangler executable
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check meson==1.7.0 ninja
          meson setup legacy-runtime/builddir legacy-runtime -Denable_pfunit=false
          meson compile -C legacy-runtime/builddir
          test -x legacy-runtime/builddir/swap
          {
            echo "runtime_source=SWAP-model/SWAP@2a5ace1c06be7a257b64e9ac1896b489533f16e9"
            echo "testcases_source=SWAP-model/swap-testcases@a839e2e905f34dd264ad0c739f638454b3023def"
            echo "table_engine_blob=62a4df82de75f1231fe066351473d140cf2ac31c"
            echo "wrapper_blob=493b9997615c967dcb5555691e447bcfe7b11e1f"
            echo "toml_f_commit=f9ff54793b2d1a3edca7d6890548d18d48c98e36"
            echo "ttutil_ref=v4.2.7"
            gfortran --version | head -1
            meson --version
          } > legacy-runtime-identity.txt

      - name: Prepare paired Hupsel cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python research/tabulated_hydraulics/prepare_hupsel_e2e.py \
            swap-testcases/cases/hupselbrook/legacy build/tab-hyd-e2e \
            | tee build/tab-hyd-e2e-prepare.log
          grep -q '^PREPARE_E2E_COMPLETED$' build/tab-hyd-e2e-prepare.log

      - name: Execute four paired variants
        shell: bash
        run: |
          set -uo pipefail
          BIN="$GITHUB_WORKSPACE/legacy-runtime/builddir/swap"
          OUT="$GITHUB_WORKSPACE/build/tab-hyd-e2e/run-status.tsv"
          printf "variant\treturn_code\truntime_seconds\toutput_csv\n" > "$OUT"
          for name in analytic_k0 table_k0 analytic_k1 table_k1; do
            work="$GITHUB_WORKSPACE/build/tab-hyd-e2e/$name"
            pushd "$work" >/dev/null
            set +e
            /usr/bin/time -f '%e' -o runtime_seconds.txt timeout 300 "$BIN" > run.log 2>&1
            rc=$?
            set -e
            popd >/dev/null
            runtime=$(cat "$work/runtime_seconds.txt" 2>/dev/null || echo NA)
            if [ -f "$work/result_output.csv" ]; then
              csv=yes
            else
              csv=no
            fi
            printf "%s\t%s\t%s\t%s\n" "$name" "$rc" "$runtime" "$csv" | tee -a "$OUT"
            tail -80 "$work/run.log" > "$work/run-tail.log" || true
          done
          cat "$OUT"

      - name: Compare analytical and table outputs
        shell: bash
        run: |
          set -euo pipefail
          for k in 0 1; do
            a="build/tab-hyd-e2e/analytic_k$k"
            t="build/tab-hyd-e2e/table_k$k"
            if [ -f "$a/result_output.csv" ] && [ -f "$t/result_output.csv" ]; then
              python research/tabulated_hydraulics/compare_hupsel_e2e.py \
                "$a" "$t" "build/tab-hyd-e2e/comparison_k$k.json" \
                --label "SWKIMPL=$k" | tee "build/tab-hyd-e2e/comparison_k$k.txt"
            else
              echo "PAIR SWKIMPL=$k incomplete: result_output.csv missing" \
                | tee "build/tab-hyd-e2e/comparison_k$k.txt"
            fi
          done
          echo "E2E_COMPARISON_COMPLETED"

      - name: Write end-to-end summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# TAB-HYD pre-strangler Hupsel end-to-end"
            echo
            cat legacy-runtime-identity.txt
            echo
            echo "## Run status"
            echo '~~~'
            cat build/tab-hyd-e2e/run-status.tsv
            echo '~~~'
            for k in 0 1; do
              echo
              echo "## SWKIMPL=$k"
              echo '~~~'
              cat "build/tab-hyd-e2e/comparison_k$k.txt"
              echo '~~~'
            done
          } > build/tab-hyd-e2e/summary.md
          cat build/tab-hyd-e2e/summary.md

      - name: Upload end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-legacy-runtime-e2e-evidence
          path: |
            legacy-runtime-identity.txt
            build/tab-hyd-e2e-prepare.log
            build/tab-hyd-e2e/run-status.tsv
            build/tab-hyd-e2e/summary.md
            build/tab-hyd-e2e/comparison_k*.json
            build/tab-hyd-e2e/comparison_k*.txt
            build/tab-hyd-e2e/*/run.log
            build/tab-hyd-e2e/*/run-tail.log
            build/tab-hyd-e2e/*/runtime_seconds.txt
            build/tab-hyd-e2e/*/result_output.csv
            build/tab-hyd-e2e/table_k0/topsoil_sand_b2.csv
            build/tab-hyd-e2e/table_k0/subsoil_sand_o2.csv
