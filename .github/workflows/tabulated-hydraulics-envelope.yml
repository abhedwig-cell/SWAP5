name: TAB-HYD broad hydraulic-envelope qualification

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-envelope.yml'
      - 'research/tabulated_hydraulics/prepare_envelope_cases.py'
      - 'research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py'
      - 'research/tabulated_hydraulics/patch_endpoint_dkdh_zero.py'
      - 'research/tabulated_hydraulics/patch_direct_uniform_tspack.py'
      - 'research/tabulated_hydraulics/compare_hupsel_e2e.py'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SWAP5 research branch
        uses: actions/checkout@v4

      - name: Checkout pre-strangler SWAP runtime
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src

      - name: Materialize toml-f dependency
        uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: swap-src/subprojects/toml-f

      - name: Materialize ttutil dependency
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: swap-src/subprojects/ttutil

      - name: Checkout Hupsel application case
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases

      - name: Checkout Staring-series parameter authority
        uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Build derivative-consistent analytical and direct-table binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check meson==1.7.0 ninja

          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py \
            swap-src/src/utils/soilhydraulicsutils.f90
          python3 research/tabulated_hydraulics/patch_endpoint_dkdh_zero.py \
            swap-src/src/utils/soilhydraulicsutils.f90

          meson setup swap-src/build-consistent swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-consistent
          cp swap-src/build-consistent/swap swap-consistent-analytic

          python3 research/tabulated_hydraulics/patch_direct_uniform_tspack.py \
            swap-src/src/soil/sptabulated.f90

          meson setup swap-src/build-direct swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-direct
          cp swap-src/build-direct/swap swap-consistent-direct

      - name: Prepare five-scenario hydraulic envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 research/tabulated_hydraulics/prepare_envelope_cases.py \
            swap-testcases/cases/hupselbrook/legacy \
            staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv \
            build/tab-hyd-envelope \
            | tee build/tab-hyd-envelope-prepare.log
          cat build/tab-hyd-envelope/manifest.json

      - name: Run analytical and table qualification matrix
        shell: bash
        run: |
          set -euo pipefail
          printf 'case\treturn_code\truntime_seconds\n' > build/tab-hyd-envelope/status.tsv

          for work in build/tab-hyd-envelope/*__analytic_k0 \
                      build/tab-hyd-envelope/*__analytic_k1 \
                      build/tab-hyd-envelope/*__table_k0 \
                      build/tab-hyd-envelope/*__table_k1; do
            name=$(basename "$work")
            case "$name" in
              *__table_*) binary="$GITHUB_WORKSPACE/swap-consistent-direct" ;;
              *)          binary="$GITHUB_WORKSPACE/swap-consistent-analytic" ;;
            esac

            pushd "$work" >/dev/null
            set +e
            /usr/bin/time -f '%e' -o qualification_runtime.txt \
              timeout 90 "$binary" > qualification.log 2>&1
            rc=$?
            set -e
            popd >/dev/null
            runtime=$(tail -1 "$work/qualification_runtime.txt" 2>/dev/null || echo NA)
            printf '%s\t%s\t%s\n' "$name" "$rc" "$runtime" \
              | tee -a build/tab-hyd-envelope/status.tsv
            if [ "$rc" -ne 100 ]; then
              echo "QUALIFICATION_FAILURE $name rc=$rc"
              tail -120 "$work/qualification.log" || true
              exit 1
            fi
            test -f "$work/result_output.csv"
          done

      - name: Compare table and analytical trajectories
        shell: bash
        run: |
          set -euo pipefail
          : > build/tab-hyd-envelope/comparisons.txt
          for scenario in coarse_dry_free loam_mid_free clay_wet_free coarse_dry_pulse loam_capillary; do
            for k in 0 1; do
              python3 research/tabulated_hydraulics/compare_hupsel_e2e.py \
                "build/tab-hyd-envelope/\${scenario}__analytic_k\${k}" \
                "build/tab-hyd-envelope/\${scenario}__table_k\${k}" \
                "build/tab-hyd-envelope/\${scenario}__k\${k}-comparison.json" \
                --label "\${scenario},SWKIMPL=\${k},direct-TSPACK-250" \
                | tee -a build/tab-hyd-envelope/comparisons.txt
            done

            python3 research/tabulated_hydraulics/compare_hupsel_e2e.py \
              "build/tab-hyd-envelope/\${scenario}__analytic_k0" \
              "build/tab-hyd-envelope/\${scenario}__analytic_k1" \
              "build/tab-hyd-envelope/\${scenario}__analytic-k0-k1.json" \
              --label "\${scenario},analytic-K0-vs-K1" \
              | tee -a build/tab-hyd-envelope/comparisons.txt
          done

      - name: Apply preregistered fidelity envelope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("build/tab-hyd-envelope")
          limits = {
              "GWL": (0.05, 0.01),
              "DSTOR": (0.02, 0.005),
              "DRAINAGE": (0.02, 0.005),
              "DRN": (0.02, 0.005),
              "QBOTTOM": (0.02, 0.005),
              "TACT": (0.02, 0.005),
          }
          rows = []
          failures = []
          for p in sorted(root.glob("*__k[01]-comparison.json")):
              d = json.loads(p.read_text())
              label = d["label"]
              for metric, (max_limit, rmse_limit) in limits.items():
                  if metric not in d["metrics"]:
                      continue
                  m = d["metrics"][metric]
                  ok = m["max_abs"] <= max_limit and m["rmse"] <= rmse_limit
                  rows.append((label, metric, m["max_abs"], m["rmse"], ok))
                  if not ok:
                      failures.append((label, metric, m["max_abs"], m["rmse"], max_limit, rmse_limit))

          out = root / "fidelity-gate.tsv"
          with out.open("w") as fh:
              fh.write("label\tmetric\tmax_abs\trmse\taccepted\n")
              for row in rows:
                  fh.write("\t".join(map(str, row)) + "\n")
          print(out.read_text(), end="")
          if failures:
              print("FIDELITY_FAILURES")
              for x in failures:
                  print(x)
              raise SystemExit(1)
          print("FIDELITY_ENVELOPE_ACCEPTED")
          PY

      - name: Benchmark corrected SWKIMPL1 route in each scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv
          import statistics
          import subprocess
          import time

          root = Path("build/tab-hyd-envelope").resolve()
          analytic_bin = Path("swap-consistent-analytic").resolve()
          table_bin = Path("swap-consistent-direct").resolve()
          scenarios = [
              "coarse_dry_free",
              "loam_mid_free",
              "clay_wet_free",
              "coarse_dry_pulse",
              "loam_capillary",
          ]

          summary_rows = []
          timing_rows = []

          def one(work, binary):
              for fn in ("result_output.csv", "swap.log"):
                  p = work / fn
                  if p.exists():
                      p.unlink()
              t0 = time.perf_counter()
              proc = subprocess.run(
                  [str(binary)],
                  cwd=work,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=60,
              )
              dt = time.perf_counter() - t0
              if proc.returncode != 100:
                  raise RuntimeError((work.name, proc.returncode))
              return dt

          for scenario in scenarios:
              aw = root / f"{scenario}__analytic_k1"
              tw = root / f"{scenario}__table_k1"

              one(aw, analytic_bin)
              one(tw, table_bin)

              a, t, paired = [], [], []
              for r in range(6):
                  if r % 2 == 0:
                      ar = one(aw, analytic_bin)
                      tr = one(tw, table_bin)
                  else:
                      tr = one(tw, table_bin)
                      ar = one(aw, analytic_bin)
                  a.append(ar)
                  t.append(tr)
                  paired.append(tr / ar)
                  timing_rows.append((scenario, r, "analytic", ar))
                  timing_rows.append((scenario, r, "table", tr))

              am = statistics.median(a)
              tm = statistics.median(t)
              rp = statistics.median(paired)
              wins = sum(1 for x in paired if x < 1.0)
              summary_rows.append((
                  scenario, am, tm, tm / am, rp, 100.0 * (rp - 1.0), wins,
                  min(paired), max(paired),
              ))

          with (root / "benchmark-timings.csv").open("w", newline="") as fh:
              w = csv.writer(fh)
              w.writerow(["scenario", "round", "route", "seconds"])
              w.writerows(timing_rows)

          with (root / "benchmark-summary.tsv").open("w") as fh:
              fh.write(
                  "scenario\tanalytic_median_s\ttable_median_s\tmedian_ratio_of_medians\t"
                  "median_paired_ratio\tpaired_delta_pct\ttable_wins_of_6\tmin_pair_ratio\tmax_pair_ratio\n"
              )
              for row in summary_rows:
                  fh.write("\t".join(map(str, row)) + "\n")

          print((root / "benchmark-summary.tsv").read_text(), end="")
          PY

      - name: Write envelope closeout evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# TAB-HYD broad hydraulic-envelope evidence"
            echo
            echo "## Run status"
            cat build/tab-hyd-envelope/status.tsv
            echo
            echo "## Fidelity gate"
            cat build/tab-hyd-envelope/fidelity-gate.tsv
            echo
            echo "## Corrected SWKIMPL1 performance"
            cat build/tab-hyd-envelope/benchmark-summary.tsv
          } > build/tab-hyd-envelope/summary.md
          cat build/tab-hyd-envelope/summary.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-broad-envelope-evidence
          path: |
            build/tab-hyd-envelope/manifest.json
            build/tab-hyd-envelope/status.tsv
            build/tab-hyd-envelope/comparisons.txt
            build/tab-hyd-envelope/*comparison.json
            build/tab-hyd-envelope/*analytic-k0-k1.json
            build/tab-hyd-envelope/fidelity-gate.tsv
            build/tab-hyd-envelope/benchmark-timings.csv
            build/tab-hyd-envelope/benchmark-summary.tsv
            build/tab-hyd-envelope/summary.md
