name: TAB-HYD fast linear interpolation experiment

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-fast-linear.yml'
      - 'research/tabulated_hydraulics/patch_fast_linear.py'

jobs:
  fast_linear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Checkout SWAP runtime
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src

      - name: Checkout toml-f
        uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: swap-src/subprojects/toml-f

      - name: Checkout ttutil
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: swap-src/subprojects/ttutil

      - name: Checkout Hupsel case
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases

      - name: Build TSPACK control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check meson==1.7.0 ninja
          meson setup swap-src/build-tspack swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-tspack
          cp swap-src/build-tspack/swap swap-tspack

      - name: Build fast-linear variant
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tabulated_hydraulics/patch_fast_linear.py swap-src/src/soil/sptabulated.f90
          meson setup swap-src/build-linear swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-linear
          cp swap-src/build-linear/swap swap-linear

      - name: Prepare cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tab-hyd-linear
          python research/tabulated_hydraulics/prepare_hupsel_e2e.py swap-testcases/cases/hupselbrook/legacy build/tab-hyd-linear/prepared
          cp -a build/tab-hyd-linear/prepared/analytic_k0 build/tab-hyd-linear/analytic
          cp -a build/tab-hyd-linear/prepared/table_k0 build/tab-hyd-linear/tspack
          cp -a build/tab-hyd-linear/prepared/table_k0 build/tab-hyd-linear/linear
          rm -rf build/tab-hyd-linear/prepared
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("analytic","tspack","linear"):
              p=Path("build/tab-hyd-linear")/name/"swap.swp"
              s=p.read_text()
              s,n=re.subn(r"(?m)^(\s*SWMONTH\s*=\s*)1\b",r"\g<1>0",s,count=1)
              if n != 1:
                  raise RuntimeError(name)
              p.write_text(s)
          PY

      - name: Qualify full period
        shell: bash
        run: |
          set -euo pipefail
          run_case () {
            name="$1"
            bin="$2"
            work="$GITHUB_WORKSPACE/build/tab-hyd-linear/$name"
            pushd "$work" >/dev/null
            set +e
            /usr/bin/time -f '%e' -o qualification_runtime.txt timeout 90 "$bin" > qualification.log 2>&1
            rc=$?
            set -e
            popd >/dev/null
            echo "$name rc=$rc runtime=$(cat "$work/qualification_runtime.txt")"
            test "$rc" -eq 100
          }
          run_case analytic "$GITHUB_WORKSPACE/swap-tspack"
          run_case tspack "$GITHUB_WORKSPACE/swap-tspack"
          run_case linear "$GITHUB_WORKSPACE/swap-linear"

          python research/tabulated_hydraulics/compare_hupsel_e2e.py build/tab-hyd-linear/analytic build/tab-hyd-linear/tspack build/tab-hyd-linear/tspack-comparison.json --label tspack-vs-analytic | tee build/tab-hyd-linear/tspack-comparison.txt
          python research/tabulated_hydraulics/compare_hupsel_e2e.py build/tab-hyd-linear/analytic build/tab-hyd-linear/linear build/tab-hyd-linear/linear-comparison.json --label linear-vs-analytic | tee build/tab-hyd-linear/linear-comparison.txt

      - name: Benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import statistics, subprocess, time

          root=Path("build/tab-hyd-linear").resolve()
          routes={
              "analytic":(Path("swap-tspack").resolve(),root/"analytic"),
              "tspack":(Path("swap-tspack").resolve(),root/"tspack"),
              "linear":(Path("swap-linear").resolve(),root/"linear"),
          }
          def run(label):
              binary,work=routes[label]
              for fn in ("result_output.csv","swap.log"):
                  p=work/fn
                  if p.exists(): p.unlink()
              t=time.perf_counter()
              p=subprocess.run([str(binary)],cwd=work,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=30)
              dt=time.perf_counter()-t
              if p.returncode != 100: raise RuntimeError((label,p.returncode))
              return dt
          for label in routes: run(label)
          vals={k:[] for k in routes}
          orders=[("analytic","tspack","linear"),("linear","analytic","tspack"),("tspack","linear","analytic")]
          for i in range(12):
              for label in orders[i%3]:
                  vals[label].append(run(label))
          med={k:statistics.median(v) for k,v in vals.items()}
          lines=[
              f"analytic_median_s={med['analytic']:.9g}",
              f"tspack_median_s={med['tspack']:.9g}",
              f"linear_median_s={med['linear']:.9g}",
              f"tspack_over_analytic={med['tspack']/med['analytic']:.9g}",
              f"linear_over_analytic={med['linear']/med['analytic']:.9g}",
              f"linear_over_tspack={med['linear']/med['tspack']:.9g}",
          ]
          Path("build/tab-hyd-linear/benchmark-summary.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-fast-linear-evidence
          path: |
            build/tab-hyd-linear/*comparison*
            build/tab-hyd-linear/benchmark-summary.txt
            build/tab-hyd-linear/*/qualification_runtime.txt
