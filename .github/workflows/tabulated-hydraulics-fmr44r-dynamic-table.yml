name: TAB-HYD FMR44R dynamic table certificate characterization

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-fmr44r-dynamic-table.yml'
      - 'research/tabulated_hydraulics/mod_tabhyd_raw_typed_provider_research.f90'
      - 'research/tabulated_hydraulics/patch_serialized_backend_typed_table.py'
      - 'research/tabulated_hydraulics/patch_generic_temporal_indicator_inplace.py'
      - 'research/tabulated_hydraulics/patch_fmr44r_provider_consistent_table_fixture.py'

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abhedwig-cell/SWAP5
          ref: b7d9c976e9b474545d54fa79b71ae134c25da156
          path: canonical-src
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: legacy-src

      - name: Prepare exact FMR44R analytical and table source trees
        shell: bash
        run: |
          set -euo pipefail
          cp -a canonical-src analytic-src
          cp -a canonical-src table-src
          ( cd analytic-src && python3 tests/fmr/_apply_fmr44r_serialized_qbot_runtime_patch.py )
          ( cd table-src && python3 tests/fmr/_apply_fmr44r_serialized_qbot_runtime_patch.py )
          python3 research/tabulated_hydraulics/patch_serialized_backend_typed_table.py table-src/src/runtime/mod_fmr_serialized_reference_backend.f90
          python3 research/tabulated_hydraulics/patch_generic_temporal_indicator_inplace.py table-src/src/solver/mod_reference_richards_temporal_indicator.f90
          python3 research/tabulated_hydraulics/patch_fmr44r_provider_consistent_table_fixture.py table-src/tests/fmr/test_fmr44r_serialized_prescribed_qbot_runtime.f90

          # Research characterization isolates the already-qualified positive-qbot
          # temporal-history fixture. The preceding FMR44R equilibrium oracle uses
          # qeq=-K_analytic(h0), which is definitionally not exact equilibrium for
          # an approximate table representation and therefore is not a fair A/B gate.
          python3 - <<'PY'
          from pathlib import Path
          for root in ("analytic-src","table-src"):
              p=Path(root)/"tests/fmr/test_fmr44r_serialized_prescribed_qbot_runtime.f90"
              txt=p.read_text()
              old="  call verify_equilibrium_mode2(qeq)\n"
              if txt.count(old)!=1:
                  raise SystemExit(f"equilibrium-call anchor mismatch {root}: {txt.count(old)}")
              txt=txt.replace(old,
                  "  write(*,'(A)') 'TABHYD_FMR44R_EQUILIBRIUM_PRETEST_SKIPPED=RESEARCH_CHARACTERIZATION'\n",1)
              p.write_text(txt)
          PY
          echo 'TABHYD_FMR44R_SOURCE_PREP=PASS'

      - name: Compile analytical and table FMR44R binaries
        shell: bash
        run: |
          set -euo pipefail
          COMMON=(-std=f2008 -ffree-line-length-none -Wall -Wextra -O2 -fopenmp -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow)
          MODULES=(
            src/solver/mod_soil_water_accepted_step_direction_contract.f90
            src/transaction/mod_accepted_trajectory_directional_sensitivity.f90
            src/transaction/mod_accepted_trajectory_directional_publication.f90
            src/runtime/mod_a23bu_worker_execution_context.f90
            src/transaction/mod_transaction_reference.f90
            src/transaction/mod_fkt_temporal_indicator_history.f90
            src/runtime/mod_canonical_contracts.f90
            src/runtime/mod_canonical_interval_runtime.f90
            src/kernel/mod_kernel_transactions.f90
            src/runtime/mod_fmr_accepted_commit_receipt.f90
            src/runtime/mod_fmr_owned_commit_receipt.f90
            src/runtime/mod_fmr_runtime_core.f90
            src/runtime/mod_fmr_bottom_thermal_carrier.f90
            src/process/mod_liquid_water_sensible_enthalpy.f90
            src/runtime/mod_fmr_bottom_external_thermal_binding.f90
            src/runtime/mod_fmr_bottom_external_thermal_provider.f90
            src/runtime/mod_fmr_bottom_sensible_energy.f90
            src/runtime/mod_fmr_top_sensible_boundary_carrier.f90
            src/runtime/mod_fmr_checkpoint_orchestrator.f90
            src/solver/mod_soil_water_solver_contract.f90
            src/solver/mod_process_hydraulic_view.f90
            src/process/mod_drainage_process.f90
            src/process/mod_drainage_tabulated_response.f90
            src/process/mod_drainage_hooghoudt_equivalent_depth.f90
            src/process/mod_drainage_hooghoudt_ipos1_response.f90
            src/process/mod_drainage_hooghoudt_ipos23_response.f90
            src/process/mod_drainage_ernst_ipos45_preparation.f90
            src/process/mod_drainage_ernst_ipos45_response.f90
            src/process/mod_drainage_empirical_interflow_response.f90
            src/process/mod_drainage_multilevel_aggregation.f90
            src/runtime/mod_fmr_drainage_response_binding.f90
            src/solver/mod_b110_smooth_freatic_projection.f90
            src/runtime/mod_fmr_drainage_qbot_directional_binding.f90
            src/process/mod_soil_temperature_contract.f90
            src/process/mod_restricted_soil_temperature.f90
            src/solver/mod_reference_richards_workspace.f90
            src/solver/mod_reference_richards_state_binding.f90
            src/solver/mod_reference_linear_solver.f90
            src/solver/mod_b110_default_mvg_provider.f90
            src/solver/mod_b110_default_mvg_directional_provider.f90
            src/solver/mod_b110_source_sink_provider.f90
            src/solver/mod_b110_root_sink_provider.f90
            src/solver/mod_fixed_flux_top_boundary_provider.f90
            src/process/mod_restricted_surface_evaporation.f90
            src/solver/mod_b110_dynamic_top_boundary_provider.f90
            src/adapter/mod_b110_dynamic_top_boundary_solver_adapter.f90
            src/adapter/mod_b110_dynamic_top_boundary_directional_adapter.f90
            src/solver/mod_reference_richards_temporal_indicator.f90
            src/legacy/b1_10_port/headcalc.f90
            src/adapter/mod_reference_richards_legacy_binding.f90
            src/adapter/mod_b110_serialized_context_binding.f90
            src/adapter/mod_reference_richards_accepted_step_directional_service.f90
            src/process/mod_snow_process.f90
            src/process/mod_restricted_fixed_weir_surface_water.f90
            src/runtime/mod_fmr_soil_water_application_host.f90
            src/runtime/mod_rossfast_d3r_execution_policy.f90
            src/runtime/mod_rossfast_d3r_model_binding.f90
            src/solver/mod_rossfast_d3r_table_kernel.f90
            src/solver/mod_rossfast_d3r_table_provider.f90
            src/solver/mod_rossfast_d3r_soil_water_solver.f90
            src/runtime/mod_fmr_rossfast_solver_selection_binding.f90
            src/runtime/mod_fmr_serialized_reference_backend.f90
            src/runtime/mod_fmr_serialized_multiswap_runtime.f90
          )

          build_variant () {
            root="$1"; tag="$2"
            out="build/$tag"; mkdir -p "$out"
            objs=()

            gfortran "${COMMON[@]}" -J "$out" -I "$out" -c "$root/tests/fsi/fsi04_real_headcalc_stubs.f90" -o "$out/stubs.o"
            test -f "$out/mod_swap_base.mod"
            objs+=("$out/stubs.o")
            gfortran "${COMMON[@]}" -J "$out" -I "$out" -c research/tabulated_hydraulics/array_dimensions_stub.f90 -o "$out/tabarrays.o"
            objs+=("$out/tabarrays.o")
            gfortran "${COMMON[@]}" -J "$out" -I "$out" -c legacy-src/src/soil/sptabulated.f90 -o "$out/sptabulated.o"
            objs+=("$out/sptabulated.o")

            for source in "${MODULES[@]}"; do
              obj="$out/$(basename "${source%.*}").o"
              gfortran "${COMMON[@]}" -J "$out" -I "$out" -c "$root/$source" -o "$obj"
              objs+=("$obj")
              if [ "$source" = "src/solver/mod_b110_default_mvg_provider.f90" ]; then
                gfortran "${COMMON[@]}" -J "$out" -I "$out" -c research/tabulated_hydraulics/mod_tabhyd_raw_typed_provider_research.f90 -o "$out/table-provider.o"
                objs+=("$out/table-provider.o")
              fi
            done
            gfortran "${COMMON[@]}" -J "$out" -I "$out" -c "$root/tests/fmr/test_fmr44r_serialized_prescribed_qbot_runtime.f90" -o "$out/test.o"
            gfortran -O2 -fopenmp "${objs[@]}" "$out/test.o" -o "$out/test"
          }

          build_variant analytic-src analytic
          build_variant table-src table

      - name: Run identical FMR44R dynamic fixture
        shell: bash
        run: |
          set -euo pipefail
          build/analytic/test > build/analytic/output.txt 2>&1
          build/table/test > build/table/output.txt 2>&1
          for route in analytic table; do
            for marker in 'TABHYD_FMR44R_EQUILIBRIUM_PRETEST_SKIPPED=RESEARCH_CHARACTERIZATION' 'FMR44R_POSITIVE_QBOT_ACCEPTED_INFLOW=PASS' 'FMR44R_NEARBY_BOTTOM_MODE_FAIL_CLOSED=PASS' 'FMR44R_SERIALIZED_PRESCRIBED_QBOT_RUNTIME_GATE=PASS'; do
              grep -Fq "$marker" "build/$route/output.txt"
            done
            echo "=== $route ==="
            grep -E '^(FMR44R_MODE2_EQUILIBRIUM_MASS_RESIDUAL|FMR44R_POSITIVE_QBOT_MASS|FMR44R_POSITIVE_QBOT_CERTIFICATE|FMR44R_QUALIFICATION_HEAD_BUDGET_CM|FMR44R_.*PASS)' "build/$route/output.txt"
          done

      - name: Compare analytical and table certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,math
          def parse(path):
              txt=Path(path).read_text()
              m=re.search(r'FMR44R_POSITIVE_QBOT_MASS residual=\s*([+\-0-9.Ee]+) total_in=\s*([+\-0-9.Ee]+) total_out=\s*([+\-0-9.Ee]+)',txt)
              c=re.search(r'FMR44R_POSITIVE_QBOT_CERTIFICATE Binf=\s*([+\-0-9.Ee]+) Ch=\s*([+\-0-9.Ee]+)',txt)
              b=re.search(r'FMR44R_QUALIFICATION_HEAD_BUDGET_CM=\s*([+\-0-9.Ee]+)',txt)
              if not (m and c and b): raise SystemExit(f"parse fail {path}")
              return dict(res=float(m.group(1)),tin=float(m.group(2)),tout=float(m.group(3)),binf=float(c.group(1)),ch=float(c.group(2)),budget=float(b.group(1)))
          a=parse("build/analytic/output.txt"); t=parse("build/table/output.txt")
          if not all(math.isfinite(x) for d in (a,t) for x in d.values()): raise SystemExit("nonfinite")
          if abs(a["res"])>1e-12 or abs(t["res"])>1e-12: raise SystemExit("mass gate")
          if not (0<a["binf"]<=a["budget"] and 0<t["binf"]<=t["budget"]): raise SystemExit("certificate unavailable")
          if not (0<a["ch"]<1 and 0<t["ch"]<1): raise SystemExit("normalized certificate")
          lines=["metric\tanalytic\ttable\tabs_difference",
            f"mass_residual\t{a['res']:.17e}\t{t['res']:.17e}\t{abs(t['res']-a['res']):.17e}",
            f"Binf_cm\t{a['binf']:.17e}\t{t['binf']:.17e}\t{abs(t['binf']-a['binf']):.17e}",
            f"normalized_Ch\t{a['ch']:.17e}\t{t['ch']:.17e}\t{abs(t['ch']-a['ch']):.17e}",
            f"total_in\t{a['tin']:.17e}\t{t['tin']:.17e}\t{abs(t['tin']-a['tin']):.17e}",
            f"total_out\t{a['tout']:.17e}\t{t['tout']:.17e}\t{abs(t['tout']-a['tout']):.17e}"]
          Path("build/comparison.tsv").write_text("\n".join(lines)+"\n")
          print(Path("build/comparison.tsv").read_text(),end="")
          print("TABHYD_FMR44R_DYNAMIC_TABLE_CHARACTERIZATION=PASS")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-fmr44r-dynamic-table
          path: |
            build/analytic/output.txt
            build/table/output.txt
            build/comparison.tsv
