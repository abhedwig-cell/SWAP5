name: TAB-HYD generated-provider break-even

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-generated-provider-break-even.yml'
      - 'research/tabulated_hydraulics/mod_tabhyd_raw_typed_provider_research.f90'
      - 'research/tabulated_hydraulics/tabhyd_generated_provider_break_even.f90'
      - 'research/tabulated_hydraulics/TYPED_PROVIDER_BENCHMARK_PREREGISTRATION.md'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: abhedwig-cell/SWAP5
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical-src

      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: legacy-src

      - uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Generate Staring parameter input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/breakeven
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          p=Path("research/tabulated_hydraulics/prepare_envelope_cases.py")
          sp=importlib.util.spec_from_file_location("prep",p)
          mod=importlib.util.module_from_spec(sp); sp.loader.exec_module(mod)
          series=mod.read_staring(Path("staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv"))
          names=sorted(series)
          out=Path("build/breakeven/input.dat")
          with out.open("w") as fh:
              fh.write(f"{len(names)} 4.0e-2\n")
              for soil in names:
                  par=series[soil]
                  fh.write(
                      f"{soil} {par['ores']:.17e} {par['osat']:.17e} "
                      f"{par['alpha']:.17e} {par['n']:.17e} {par['ksat']:.17e} "
                      f"{par['lexp']:.17e} {par['h_enpr']:.17e}\n")
          print(f"BREAKEVEN_SOILS={len(names)}")
          PY

      - name: Compile generated-provider break-even harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/breakeven/mod
          F="-O3 -std=f2018 -ffree-line-length-none"
          gfortran $F -J build/breakeven/mod             -c research/tabulated_hydraulics/array_dimensions_stub.f90             -o build/breakeven/arrays.o
          gfortran $F -I build/breakeven/mod -J build/breakeven/mod             -c legacy-src/src/soil/sptabulated.f90             -o build/breakeven/sptabulated.o
          gfortran $F -I build/breakeven/mod -J build/breakeven/mod             -c canonical-src/src/solver/mod_soil_water_solver_contract.f90             -o build/breakeven/contract.o
          gfortran $F -I build/breakeven/mod -J build/breakeven/mod             -c canonical-src/src/solver/mod_b110_default_mvg_provider.f90             -o build/breakeven/mvg.o
          gfortran $F -I build/breakeven/mod -J build/breakeven/mod             -c research/tabulated_hydraulics/mod_tabhyd_raw_typed_provider_research.f90             -o build/breakeven/table-provider.o
          gfortran $F -I build/breakeven/mod -J build/breakeven/mod             research/tabulated_hydraulics/tabhyd_generated_provider_break_even.f90             build/breakeven/arrays.o build/breakeven/sptabulated.o             build/breakeven/contract.o build/breakeven/mvg.o             build/breakeven/table-provider.o             -o build/breakeven/benchmark

      - name: Run break-even benchmark
        shell: bash
        run: |
          set -euo pipefail
          build/breakeven/benchmark build/breakeven/input.dat | tee build/breakeven/result.txt
          grep -E '^BREAKEVEN_' build/breakeven/result.txt | tee build/breakeven/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-generated-provider-break-even
          path: |
            build/breakeven/result.txt
            build/breakeven/summary.txt
