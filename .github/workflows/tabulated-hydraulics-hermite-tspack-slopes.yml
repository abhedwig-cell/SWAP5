name: TAB-HYD TSPACK-slope Hermite qualification

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-hermite-tspack-slopes.yml'
      - 'research/tabulated_hydraulics/patch_hermite_tspack_slopes.py'
      - 'research/tabulated_hydraulics/patch_piecewise_xmap_lookup.py'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src
      - uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: swap-src/subprojects/toml-f
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: swap-src/subprojects/ttutil
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases
      - uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Prepare sources and build four binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check meson==1.7.0 ninja
          cp -a swap-src swap-analytic-src
          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py swap-analytic-src/src/utils/soilhydraulicsutils.f90
          meson setup swap-analytic-src/build swap-analytic-src -Denable_pfunit=false
          meson compile -C swap-analytic-src/build
          cp swap-analytic-src/build/swap swap-analytic

          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py swap-src/src/utils/soilhydraulicsutils.f90
          python3 research/tabulated_hydraulics/patch_table_ksat_plateau_split.py swap-src/src/utils/soilhydraulicsutils.f90 swap-src/src/io/readswap.f90
          python3 research/tabulated_hydraulics/patch_table_theta_wet_linear.py swap-src/src/utils/soilhydraulicsutils.f90
          python3 research/tabulated_hydraulics/patch_piecewise_xmap_lookup.py swap-src/src/soil/sptabulated.f90 swap-src/src/io/readswap.f90
          cp -a swap-src swap-thetaH-src
          cp -a swap-src swap-allH-src

          meson setup swap-src/build swap-src -Denable_pfunit=false
          meson compile -C swap-src/build
          cp swap-src/build/swap swap-fullT

          python3 research/tabulated_hydraulics/patch_hermite_tspack_slopes.py swap-thetaH-src/src/soil/sptabulated.f90 theta
          meson setup swap-thetaH-src/build swap-thetaH-src -Denable_pfunit=false
          meson compile -C swap-thetaH-src/build
          cp swap-thetaH-src/build/swap swap-thetaH

          python3 research/tabulated_hydraulics/patch_hermite_tspack_slopes.py swap-allH-src/src/soil/sptabulated.f90 all
          meson setup swap-allH-src/build swap-allH-src -Denable_pfunit=false
          meson compile -C swap-allH-src/build
          cp swap-allH-src/build/swap swap-allH

      - name: Prepare unchanged log-head400 matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/hsl/envelope
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, shutil
          lp=Path("research/tabulated_hydraulics/prepare_envelope_cases_loghead.py")
          ls=importlib.util.spec_from_file_location("logprep",lp)
          logprep=importlib.util.module_from_spec(ls); ls.loader.exec_module(logprep)
          prep=logprep.prep; prep.uniform_rows=lambda p: logprep.loghead_rows(p,400)
          src=Path("swap-testcases/cases/hupselbrook/legacy")
          series=prep.read_staring(Path("staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv"))
          root=Path("build/hsl/envelope")
          for scenario,sc in prep.SCENARIOS.items():
              params=[series[sc["top"]],series[sc["sub"]]]
              prep.prepare_case(src,root/f"{scenario}__analytic_k0",params,sc,False,0)
              base=root/f"{scenario}__base_k0"; prep.prepare_case(src,base,params,sc,True,0)
              for route in ("thetaH","allH"): shutil.copytree(base,root/f"{scenario}__{route}_k0")
          for scenario in ("coarse_dry_free","coarse_dry_pulse"):
              sc=prep.SCENARIOS[scenario]; params=[series[sc["top"]],series[sc["sub"]]]
              prep.prepare_case(src,root/f"{scenario}__analytic_k1",params,sc,False,1)
              base=root/f"{scenario}__base_k1"; prep.prepare_case(src,base,params,sc,True,1)
              for route in ("thetaH","allH"): shutil.copytree(base,root/f"{scenario}__{route}_k1")

          hp=Path("research/tabulated_hydraulics/prepare_hupsel_e2e.py")
          hs=importlib.util.spec_from_file_location("hprep",hp)
          hprep=importlib.util.module_from_spec(hs); hs.loader.exec_module(hprep)
          hroot=Path("build/hsl/hupsel"); hroot.mkdir(parents=True)
          psets=[dict(ores=p[0],osat=p[1],alpha=p[2],n=p[3],ksat=p[4],lexp=p[5],h_enpr=0.0,comment=f"hupsel_{i}") for i,p in enumerate(hprep.PARAMS)]
          def overwrite(dst):
              for name,p in zip(hprep.TABLE_NAMES,psets):
                  rows=logprep.loghead_rows(p,400)
                  with (dst/name).open("w",newline="\n") as fh:
                      fh.write("* TAB-HYD proven log-head400 table\nheadtab,thetatab,conductab\n")
                      for h,t,k in rows: fh.write(f"{h:.16e},{t:.16e},{k:.16e}\n")
          for kval in (0,1):
              a=hroot/f"analytic_k{kval}"; shutil.copytree(src,a); hprep.edit_case(a,False,kval)
              t=hroot/f"fullT_k{kval}"; shutil.copytree(src,t); hprep.edit_case(t,True,kval); overwrite(t)
              for route in ("thetaH","allH"): shutil.copytree(t,hroot/f"{route}_k{kval}")
          PY

      - name: Run and classify both Hermite candidates
        shell: bash
        run: |
          set -euo pipefail
          run_case () {
            work="$1"; bin="$2"
            pushd "$work" >/dev/null; set +e; timeout 30 "$bin" >/dev/null 2>&1; rc=$?; set -e; popd >/dev/null
            test "$rc" -eq 100
          }
          for scenario in coarse_dry_free loam_mid_free clay_wet_free coarse_dry_pulse loam_capillary; do
            run_case "build/hsl/envelope/${scenario}__analytic_k0" "$GITHUB_WORKSPACE/swap-analytic"
            for route in thetaH allH; do
              if [ "$route" = thetaH ]; then bin="$GITHUB_WORKSPACE/swap-thetaH"; else bin="$GITHUB_WORKSPACE/swap-allH"; fi
              run_case "build/hsl/envelope/${scenario}__${route}_k0" "$bin"
              python3 research/tabulated_hydraulics/compare_hupsel_e2e.py \
                "build/hsl/envelope/${scenario}__analytic_k0" "build/hsl/envelope/${scenario}__${route}_k0" \
                "build/hsl/${scenario}__${route}_k0.json" --label "${scenario},K0,${route}"
            done
          done
          for scenario in coarse_dry_free coarse_dry_pulse; do
            run_case "build/hsl/envelope/${scenario}__analytic_k1" "$GITHUB_WORKSPACE/swap-analytic"
            for route in thetaH allH; do
              if [ "$route" = thetaH ]; then bin="$GITHUB_WORKSPACE/swap-thetaH"; else bin="$GITHUB_WORKSPACE/swap-allH"; fi
              run_case "build/hsl/envelope/${scenario}__${route}_k1" "$bin"
              python3 research/tabulated_hydraulics/compare_hupsel_e2e.py \
                "build/hsl/envelope/${scenario}__analytic_k1" "build/hsl/envelope/${scenario}__${route}_k1" \
                "build/hsl/${scenario}__${route}_k1.json" --label "${scenario},K1,${route}"
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          limits={"GWL":(0.05,0.01),"DSTOR":(0.02,0.005),"DRAINAGE":(0.02,0.005),"DRN":(0.02,0.005),"QBOTTOM":(0.02,0.005),"TACT":(0.02,0.005)}
          byroute={"thetaH":[],"allH":[]}; lines=["route\tlabel\tmetric\tmax_abs\trmse\tpass"]
          for p in sorted(Path("build/hsl").glob("*__*H_k[01].json")):
              d=json.loads(p.read_text()); route=d["label"].split(",")[-1]
              for metric,(ma,rm) in limits.items():
                  if metric not in d["metrics"]: continue
                  m=d["metrics"][metric]; ok=m["max_abs"]<=ma and m["rmse"]<=rm
                  lines.append(f"{route}\t{d['label']}\t{metric}\t{m['max_abs']}\t{m['rmse']}\t{ok}")
                  if not ok: byroute[route].append((d["label"],metric,m))
          Path("build/hsl/fidelity.tsv").write_text("\n".join(lines)+"\n")
          print(Path("build/hsl/fidelity.tsv").read_text(),end="")
          for route in ("thetaH","allH"): print(f"{route}_fidelity_failures={len(byroute[route])}")
          PY

      - name: Benchmark full TSPACK and Hermite candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv,statistics,subprocess,time
          root=Path("build/hsl").resolve()
          bins={"analytic":Path("swap-analytic").resolve(),"fullT":Path("swap-fullT").resolve(),"thetaH":Path("swap-thetaH").resolve(),"allH":Path("swap-allH").resolve()}
          routes={}
          for kval in (0,1):
              for route in ("analytic","fullT","thetaH","allH"):
                  routes[f"{route}_k{kval}"]=(bins[route],root/f"hupsel/{route}_k{kval}")
          def one(label):
              binary,work=routes[label]
              for fn in ("result_output.csv","swap.log"):
                  p=work/fn
                  if p.exists(): p.unlink()
              t=time.perf_counter(); proc=subprocess.run([str(binary)],cwd=work,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=30); dt=time.perf_counter()-t
              if proc.returncode!=100: raise RuntimeError((label,proc.returncode))
              return dt
          for label in routes: one(label)
          vals={x:[] for x in routes}; rows=[]; labels=list(routes)
          for rnd in range(14):
              order=labels[rnd%len(labels):]+labels[:rnd%len(labels)]
              if rnd%2: order=list(reversed(order))
              for label in order:
                  dt=one(label); vals[label].append(dt); rows.append((rnd,label,dt))
          med={k:statistics.median(v) for k,v in vals.items()}
          with (root/"benchmark.csv").open("w",newline="") as fh:
              w=csv.writer(fh); w.writerow(["round","route","seconds"]); w.writerows(rows)
          lines=[f"{key}_median_s={med[key]:.9g}" for key in labels]
          for kval in (0,1):
              for route in ("fullT","thetaH","allH"):
                  lines.append(f"{route}_k{kval}_delta_vs_analytic_pct={100*(med[f'{route}_k{kval}']/med[f'analytic_k{kval}']-1):.9g}")
                  if route!="fullT": lines.append(f"{route}_vs_fullT_k{kval}_pct={100*(med[f'{route}_k{kval}']/med[f'fullT_k{kval}']-1):.9g}")
          (root/"benchmark-summary.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-hermite-tspack-slopes
          path: |
            build/hsl/fidelity.tsv
            build/hsl/*__*H_k*.json
            build/hsl/benchmark.csv
            build/hsl/benchmark-summary.txt
