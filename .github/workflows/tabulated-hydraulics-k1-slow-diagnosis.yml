name: TAB-HYD K1 slow-scenario diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-k1-slow-diagnosis.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src
      - uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: swap-src/subprojects/toml-f
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: swap-src/subprojects/ttutil
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases
      - uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Build K1 routes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check meson==1.7.0 ninja
          cp -a swap-src swap-a
          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py swap-a/src/utils/soilhydraulicsutils.f90
          meson setup swap-a/build swap-a -Denable_pfunit=false
          meson compile -C swap-a/build
          cp swap-a/build/swap swap-analytic

          cp -a swap-src swap-r
          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py swap-r/src/utils/soilhydraulicsutils.f90
          python3 research/tabulated_hydraulics/patch_table_ksat_plateau_split.py swap-r/src/utils/soilhydraulicsutils.f90 swap-r/src/io/readswap.f90
          python3 research/tabulated_hydraulics/patch_table_theta_wet_linear.py swap-r/src/utils/soilhydraulicsutils.f90
          python3 research/tabulated_hydraulics/patch_raw_head_logk_lookup.py swap-r/src/soil/sptabulated.f90 swap-r/src/io/readswap.f90 swap-r/src/utils/soilhydraulicsutils.f90
          cp -a swap-r swap-c
          meson setup swap-r/build swap-r -Denable_pfunit=false
          meson compile -C swap-r/build
          cp swap-r/build/swap swap-raw
          python3 research/tabulated_hydraulics/patch_raw_head_capacity_reuse.py swap-c/src/soil/sptabulated.f90 swap-c/src/utils/soilhydraulicsutils.f90
          meson setup swap-c/build swap-c -Denable_pfunit=false
          meson compile -C swap-c/build
          cp swap-c/build/swap swap-rawcap

      - name: Prepare slow K1 scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, shutil
          lp=Path("research/tabulated_hydraulics/prepare_envelope_cases_loghead.py")
          sp=importlib.util.spec_from_file_location("logprep",lp)
          mod=importlib.util.module_from_spec(sp); sp.loader.exec_module(mod)
          prep=mod.prep; prep.uniform_rows=lambda p: mod.loghead_rows(p,400)
          src=Path("swap-testcases/cases/hupselbrook/legacy")
          series=prep.read_staring(Path("staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv"))
          root=Path("build/k1slow"); root.mkdir(parents=True)
          for scenario in ("loam_mid_free","clay_wet_free","loam_capillary"):
              sc=prep.SCENARIOS[scenario]; params=[series[sc["top"]],series[sc["sub"]]]
              prep.prepare_case(src,root/f"{scenario}__analytic",params,sc,False,1)
              prep.prepare_case(src,root/f"{scenario}__raw",params,sc,True,1)
              shutil.copytree(root/f"{scenario}__raw",root/f"{scenario}__rawcap")
          PY

      - name: Diagnose route completion and fidelity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,csv
          root=Path("build/k1slow").resolve()
          bins={"analytic":Path("swap-analytic").resolve(),"raw":Path("swap-raw").resolve(),"rawcap":Path("swap-rawcap").resolve()}
          rows=[]
          for scenario in ("loam_mid_free","clay_wet_free","loam_capillary"):
              for route,binary in bins.items():
                  work=root/f"{scenario}__{route}"
                  t=time.perf_counter()
                  try:
                      p=subprocess.run([str(binary)],cwd=work,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=240)
                      rc=p.returncode; timed_out=False
                  except subprocess.TimeoutExpired:
                      rc=124; timed_out=True
                  dt=time.perf_counter()-t
                  rows.append((scenario,route,rc,timed_out,dt))
                  print(f"K1_ROUTE scenario={scenario} route={route} rc={rc} timeout={timed_out} seconds={dt:.6f}")
              # Compare only routes that completed normally.
              status={r[1]:r for r in rows if r[0]==scenario}
              if status["analytic"][2]==100 and status["raw"][2]==100:
                  subprocess.run(["python3","research/tabulated_hydraulics/compare_hupsel_e2e.py",
                      str(root/f"{scenario}__analytic"),str(root/f"{scenario}__raw"),
                      str(root/f"{scenario}__raw.json"),"--label",f"{scenario},K1,raw"],check=True)
              if status["analytic"][2]==100 and status["rawcap"][2]==100:
                  subprocess.run(["python3","research/tabulated_hydraulics/compare_hupsel_e2e.py",
                      str(root/f"{scenario}__analytic"),str(root/f"{scenario}__rawcap"),
                      str(root/f"{scenario}__rawcap.json"),"--label",f"{scenario},K1,rawcap"],check=True)
          with (root/"route-times.csv").open("w",newline="") as fh:
              w=csv.writer(fh); w.writerow(["scenario","route","returncode","timed_out","seconds"]); w.writerows(rows)
          PY

      - name: Summarize available fidelity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          for p in sorted(Path("build/k1slow").glob("*.json")):
              d=json.loads(p.read_text())
              m=d["metrics"]
              g=m.get("GWL",{})
              print(f"K1_FIDELITY label={d['label']} GWL_max={g.get('max_abs')} GWL_rmse={g.get('rmse')}")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-k1-slow-diagnosis
          path: |
            build/k1slow/route-times.csv
            build/k1slow/*.json
