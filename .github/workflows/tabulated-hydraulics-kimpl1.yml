name: TAB-HYD SWKIMPL1 equivalence and runtime

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-kimpl1.yml'
      - 'research/tabulated_hydraulics/patch_endpoint_dkdh_zero.py'
      - 'research/tabulated_hydraulics/patch_direct_uniform_tspack.py'
      - 'research/tabulated_hydraulics/generate_uniform_x_hupsel_tables.py'

jobs:
  kimpl1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Checkout SWAP runtime
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src

      - name: Checkout toml-f
        uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: swap-src/subprojects/toml-f

      - name: Checkout ttutil
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: swap-src/subprojects/ttutil

      - name: Checkout Hupsel case
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases

      - name: Build endpoint-corrected legacy and direct table binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check meson==1.7.0 ninja

          python3 research/tabulated_hydraulics/patch_endpoint_dkdh_zero.py \
            swap-src/src/utils/soilhydraulicsutils.f90
          meson setup swap-src/build-legacy swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-legacy
          cp swap-src/build-legacy/swap swap-kimpl1-legacy

          python3 research/tabulated_hydraulics/patch_direct_uniform_tspack.py \
            swap-src/src/soil/sptabulated.f90
          meson setup swap-src/build-direct swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-direct
          cp swap-src/build-direct/swap swap-kimpl1-direct

      - name: Prepare analytical, dense and direct table cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tab-hyd-kimpl1
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,re,shutil,subprocess
          spec=importlib.util.spec_from_file_location("prep","research/tabulated_hydraulics/prepare_hupsel_e2e.py")
          prep=importlib.util.module_from_spec(spec); spec.loader.exec_module(prep)
          src=Path("swap-testcases/cases/hupselbrook/legacy")
          root=Path("build/tab-hyd-kimpl1")

          analytical=root/"analytic_k1"
          shutil.copytree(src,analytical)
          prep.edit_case(analytical,False,1)

          dense=root/"legacy_tspack_k1"
          shutil.copytree(src,dense)
          prep.NCANDIDATE=900
          prep.edit_case(dense,True,1)

          for n in (100,150,250,400):
              dst=root/f"direct_tspack_{n:03d}_k1"
              shutil.copytree(src,dst)
              prep.edit_case(dst,True,1)
              subprocess.run([
                  "python3","research/tabulated_hydraulics/generate_uniform_x_hupsel_tables.py",
                  str(dst),str(n)
              ],check=True)

          for d in root.iterdir():
              if not d.is_dir(): continue
              p=d/"swap.swp"; s=p.read_text()
              s,k=re.subn(r"(?m)^(\s*SWMONTH\s*=\s*)1\b",r"\g<1>0",s,count=1)
              if k!=1: raise RuntimeError(f"SWMONTH edit failed for {d.name}")
              p.write_text(s)
          PY

      - name: Run full-period SWKIMPL1 qualification
        shell: bash
        run: |
          set -euo pipefail
          printf 'variant\treturn_code\truntime_seconds\n' > build/tab-hyd-kimpl1/status.tsv
          run_case () {
            variant="$1"; binary="$2"
            work="$GITHUB_WORKSPACE/build/tab-hyd-kimpl1/$variant"
            pushd "$work" >/dev/null
            set +e
            /usr/bin/time -f '%e' -o qualification_runtime.txt timeout 90 "$binary" > qualification.log 2>&1
            rc=$?
            set -e
            popd >/dev/null
            runtime=$(tail -1 "$work/qualification_runtime.txt" 2>/dev/null || echo NA)
            printf '%s\t%s\t%s\n' "$variant" "$rc" "$runtime" | tee -a build/tab-hyd-kimpl1/status.tsv
            test "$rc" -eq 100
          }

          run_case analytic_k1 "$GITHUB_WORKSPACE/swap-kimpl1-legacy"
          run_case legacy_tspack_k1 "$GITHUB_WORKSPACE/swap-kimpl1-legacy"
          for work in build/tab-hyd-kimpl1/direct_tspack_*_k1; do
            run_case "$(basename "$work")" "$GITHUB_WORKSPACE/swap-kimpl1-direct"
          done

          : > build/tab-hyd-kimpl1/comparisons.txt
          for work in build/tab-hyd-kimpl1/legacy_tspack_k1 build/tab-hyd-kimpl1/direct_tspack_*_k1; do
            name=$(basename "$work")
            python research/tabulated_hydraulics/compare_hupsel_e2e.py \
              build/tab-hyd-kimpl1/analytic_k1 "$work" \
              "build/tab-hyd-kimpl1/$name-comparison.json" \
              --label "$name-vs-analytic-k1" \
              | tee -a build/tab-hyd-kimpl1/comparisons.txt
          done

      - name: Repeated SWKIMPL1 benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv,statistics,subprocess,time
          root=Path("build/tab-hyd-kimpl1").resolve()
          routes={
              "analytic_k1":(Path("swap-kimpl1-legacy").resolve(),root/"analytic_k1"),
              "legacy_tspack_k1":(Path("swap-kimpl1-legacy").resolve(),root/"legacy_tspack_k1"),
              "direct_tspack_150_k1":(Path("swap-kimpl1-direct").resolve(),root/"direct_tspack_150_k1"),
              "direct_tspack_250_k1":(Path("swap-kimpl1-direct").resolve(),root/"direct_tspack_250_k1"),
          }
          def one(label):
              binary,work=routes[label]
              for fn in ("result_output.csv","swap.log"):
                  p=work/fn
                  if p.exists(): p.unlink()
              t0=time.perf_counter()
              p=subprocess.run([str(binary)],cwd=work,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=30)
              dt=time.perf_counter()-t0
              if p.returncode!=100: raise RuntimeError((label,p.returncode))
              return dt
          for label in routes: one(label)
          labels=list(routes); vals={k:[] for k in labels}; rows=[]
          for r in range(8):
              order=labels[r%len(labels):]+labels[:r%len(labels)]
              if r%2: order=list(reversed(order))
              for label in order:
                  dt=one(label); vals[label].append(dt); rows.append((r,label,dt))
          with (root/"benchmark.csv").open("w",newline="") as fh:
              w=csv.writer(fh); w.writerow(["round","route","seconds"]); w.writerows(rows)
          med={k:statistics.median(v) for k,v in vals.items()}
          lines=[f"{k}_median_s={med[k]:.9g}" for k in labels]
          lines += [f"{k}_over_analytic_k1={med[k]/med['analytic_k1']:.9g}" for k in labels[1:]]
          (root/"benchmark-summary.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Summarize fidelity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("build/tab-hyd-kimpl1")
          rows=[]
          for p in sorted(root.glob("*-comparison.json")):
              name=p.name.replace("-comparison.json","")
              m=json.loads(p.read_text())["metrics"]
              rows.append((name,m["GWL"]["max_abs"],m["GWL"]["rmse"],m["DSTOR"]["max_abs"],
                           m["DRAINAGE"]["max_abs"],m["TACT"]["max_abs"]))
          with (root/"fidelity-summary.tsv").open("w") as fh:
              fh.write("variant\tgwl_max_abs\tgwl_rmse\tdstor_max_abs\tdrainage_max_abs\ttact_max_abs\n")
              for row in rows: fh.write("\t".join(map(str,row))+"\n")
          print((root/"fidelity-summary.tsv").read_text())
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-kimpl1-equivalence-runtime
          path: |
            build/tab-hyd-kimpl1/status.tsv
            build/tab-hyd-kimpl1/comparisons.txt
            build/tab-hyd-kimpl1/*-comparison.json
            build/tab-hyd-kimpl1/fidelity-summary.tsv
            build/tab-hyd-kimpl1/benchmark.csv
            build/tab-hyd-kimpl1/benchmark-summary.txt
