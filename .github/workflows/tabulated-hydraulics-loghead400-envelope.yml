name: TAB-HYD log-head 400 transfer gate

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-loghead400-envelope.yml'

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Checkout pre-strangler SWAP runtime
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src

      - name: Materialize toml-f
        uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: swap-src/subprojects/toml-f

      - name: Materialize ttutil
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: swap-src/subprojects/ttutil

      - name: Checkout Hupsel application
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases

      - name: Checkout Staring authority
        uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Build analytical and table binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check meson==1.7.0 ninja
          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py             swap-src/src/utils/soilhydraulicsutils.f90
          meson setup swap-src/build-analytic swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-analytic
          cp swap-src/build-analytic/swap swap-analytic

          python3 research/tabulated_hydraulics/patch_table_ksat_plateau_split.py             swap-src/src/utils/soilhydraulicsutils.f90 swap-src/src/io/readswap.f90
          python3 research/tabulated_hydraulics/patch_table_theta_wet_linear.py             swap-src/src/utils/soilhydraulicsutils.f90
          meson setup swap-src/build-table swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-table
          cp swap-src/build-table/swap swap-table

      - name: Prepare 400-row envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/loghead400/cases
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, json

          lp=Path("research/tabulated_hydraulics/prepare_envelope_cases_loghead.py")
          spec=importlib.util.spec_from_file_location("logprep",lp)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          prep=mod.prep
          prep.uniform_rows=lambda p: mod.loghead_rows(p,400)

          src=Path("swap-testcases/cases/hupselbrook/legacy")
          series=prep.read_staring(Path("staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv"))
          root=Path("build/loghead400/cases")
          for scenario,sc in prep.SCENARIOS.items():
              params=[series[sc["top"]],series[sc["sub"]]]
              for k in (0,1):
                  prep.prepare_case(src,root/f"${scenario}__analytic_k${k}",params,sc,table=False,kimpl=k)
                  prep.prepare_case(src,root/f"${scenario}__table_k${k}",params,sc,table=True,kimpl=k)
          PY

      - name: Run five K0 pairs and two bounded K1 pairs
        shell: bash
        run: |
          set -euo pipefail
          printf 'case\troute\tswkimpl\treturn_code\truntime_seconds\trows\n' > build/loghead400/status.tsv
          run_one () {
            scenario="$1"; route="$2"; k="$3"
            work="build/loghead400/cases/${scenario}__${route}_k${k}"
            if [ "$route" = analytic ]; then bin="$GITHUB_WORKSPACE/swap-analytic"; else bin="$GITHUB_WORKSPACE/swap-table"; fi
            pushd "$work" >/dev/null
            set +e
            /usr/bin/time -f '%e' -o runtime.txt timeout 30 "$bin" > run.log 2>&1
            rc=$?
            set -e
            popd >/dev/null
            runtime=$(tail -1 "$work/runtime.txt" 2>/dev/null || echo NA)
            rows=$(grep -v '^[[:space:]]*\*' "$work/result_output.csv" 2>/dev/null | grep -c . || true)
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$scenario" "$route" "$k" "$rc" "$runtime" "$rows" | tee -a build/loghead400/status.tsv
            test "$rc" -eq 100
          }
          for scenario in coarse_dry_free loam_mid_free clay_wet_free coarse_dry_pulse loam_capillary; do
            run_one "$scenario" analytic 0
            run_one "$scenario" table 0
          done
          for scenario in coarse_dry_free coarse_dry_pulse; do
            run_one "$scenario" analytic 1
            run_one "$scenario" table 1
          done

      - name: Compare and gate
        shell: bash
        run: |
          set -euo pipefail
          : > build/loghead400/comparisons.txt
          for scenario in coarse_dry_free loam_mid_free clay_wet_free coarse_dry_pulse loam_capillary; do
            python3 research/tabulated_hydraulics/compare_hupsel_e2e.py               "build/loghead400/cases/${scenario}__analytic_k0"               "build/loghead400/cases/${scenario}__table_k0"               "build/loghead400/${scenario}__k0.json"               --label "${scenario},K0,loghead400" | tee -a build/loghead400/comparisons.txt
          done
          for scenario in coarse_dry_free coarse_dry_pulse; do
            python3 research/tabulated_hydraulics/compare_hupsel_e2e.py               "build/loghead400/cases/${scenario}__analytic_k1"               "build/loghead400/cases/${scenario}__table_k1"               "build/loghead400/${scenario}__k1.json"               --label "${scenario},K1,loghead400" | tee -a build/loghead400/comparisons.txt
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          limits={"GWL":(0.05,0.01),"DSTOR":(0.02,0.005),"DRAINAGE":(0.02,0.005),"DRN":(0.02,0.005),"QBOTTOM":(0.02,0.005),"TACT":(0.02,0.005)}
          failed=[]
          lines=["label\tmetric\tmax_abs\trmse\tpass"]
          for p in sorted(Path("build/loghead400").glob("*__k[01].json")):
              d=json.loads(p.read_text())
              for metric,(ma,rm) in limits.items():
                  if metric not in d["metrics"]: continue
                  m=d["metrics"][metric]
                  ok=m["max_abs"]<=ma and m["rmse"]<=rm
                  lines.append(f"{d['label']}\t{metric}\t{m['max_abs']}\t{m['rmse']}\t{ok}")
                  if not ok: failed.append((d["label"],metric,m["max_abs"],m["rmse"]))
          Path("build/loghead400/fidelity.tsv").write_text("\n".join(lines)+"\n")
          print(Path("build/loghead400/fidelity.tsv").read_text(),end="")
          print(f"fidelity_failures={len(failed)}")
          if failed:
              raise SystemExit("loghead400 transfer candidate exceeds original fidelity limits")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-loghead400-transfer
          path: |
            build/loghead400/status.tsv
            build/loghead400/comparisons.txt
            build/loghead400/fidelity.tsv
            build/loghead400/*.json
