name: TAB-HYD piecewise-x 400 qualification

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-piecewise-x400.yml'
      - 'research/tabulated_hydraulics/prepare_envelope_cases_piecewise_x.py'
      - 'research/tabulated_hydraulics/patch_direct_piecewise_x_tspack.py'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src
      - uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: swap-src/subprojects/toml-f
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: swap-src/subprojects/ttutil
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases
      - uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Build analytical, legacy-lookup and direct-piecewise binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check meson==1.7.0 ninja
          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py swap-src/src/utils/soilhydraulicsutils.f90
          meson setup swap-src/build-a swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-a
          cp swap-src/build-a/swap swap-analytic

          python3 research/tabulated_hydraulics/patch_table_ksat_plateau_split.py swap-src/src/utils/soilhydraulicsutils.f90 swap-src/src/io/readswap.f90
          python3 research/tabulated_hydraulics/patch_table_theta_wet_linear.py swap-src/src/utils/soilhydraulicsutils.f90
          meson setup swap-src/build-l swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-l
          cp swap-src/build-l/swap swap-table-legacy

          python3 research/tabulated_hydraulics/patch_direct_piecewise_x_tspack.py swap-src/src/soil/sptabulated.f90
          meson setup swap-src/build-d swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-d
          cp swap-src/build-d/swap swap-table-direct

      - name: Prepare piecewise-x transfer and Hupsel cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pwx/envelope
          python3 research/tabulated_hydraulics/prepare_envelope_cases_piecewise_x.py             swap-testcases/cases/hupselbrook/legacy             staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv             build/pwx/envelope

          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, shutil
          gp=Path("research/tabulated_hydraulics/prepare_envelope_cases_piecewise_x.py")
          gs=importlib.util.spec_from_file_location("pwx",gp); pwx=importlib.util.module_from_spec(gs); gs.loader.exec_module(pwx)
          hp=Path("research/tabulated_hydraulics/prepare_hupsel_e2e.py")
          hs=importlib.util.spec_from_file_location("hprep",hp); hprep=importlib.util.module_from_spec(hs); hs.loader.exec_module(hprep)
          src=Path("swap-testcases/cases/hupselbrook/legacy")
          root=Path("build/pwx/hupsel"); root.mkdir(parents=True)
          psets=[dict(ores=p[0],osat=p[1],alpha=p[2],n=p[3],ksat=p[4],lexp=p[5],h_enpr=0.0,comment=f"hupsel_{i}") for i,p in enumerate(hprep.PARAMS)]
          def overwrite(dst):
              for name,p in zip(hprep.TABLE_NAMES,psets):
                  rows=pwx.piecewise_x_rows(p)
                  with (dst/name).open("w",newline="\n") as fh:
                      fh.write("* TAB-HYD piecewise-x benchmark table\nheadtab,thetatab,conductab\n")
                      for h,t,k in rows: fh.write(f"{h:.16e},{t:.16e},{k:.16e}\n")
          for kval in (0,1):
              a=root/f"analytic_k{kval}"; shutil.copytree(src,a); hprep.edit_case(a,False,kval)
              t=root/f"table_k{kval}"; shutil.copytree(src,t); hprep.edit_case(t,True,kval); overwrite(t)
              l=root/f"legacy_k{kval}"; shutil.copytree(t,l)
          PY

      - name: Run transfer envelope
        shell: bash
        run: |
          set -euo pipefail
          for scenario in coarse_dry_free loam_mid_free clay_wet_free coarse_dry_pulse loam_capillary; do
            for route in analytic table; do
              work="build/pwx/envelope/${scenario}__${route}_k0"
              if [ "$route" = analytic ]; then bin="$GITHUB_WORKSPACE/swap-analytic"; else bin="$GITHUB_WORKSPACE/swap-table-direct"; fi
              pushd "$work" >/dev/null; set +e; timeout 30 "$bin" > run.log 2>&1; rc=$?; set -e; popd >/dev/null
              test "$rc" -eq 100
            done
            python3 research/tabulated_hydraulics/compare_hupsel_e2e.py               "build/pwx/envelope/${scenario}__analytic_k0" "build/pwx/envelope/${scenario}__table_k0"               "build/pwx/${scenario}__k0.json" --label "${scenario},K0,piecewise-x400"
          done
          for scenario in coarse_dry_free coarse_dry_pulse; do
            for route in analytic table; do
              work="build/pwx/envelope/${scenario}__${route}_k1"
              if [ "$route" = analytic ]; then bin="$GITHUB_WORKSPACE/swap-analytic"; else bin="$GITHUB_WORKSPACE/swap-table-direct"; fi
              pushd "$work" >/dev/null; set +e; timeout 30 "$bin" > run.log 2>&1; rc=$?; set -e; popd >/dev/null
              test "$rc" -eq 100
            done
            python3 research/tabulated_hydraulics/compare_hupsel_e2e.py               "build/pwx/envelope/${scenario}__analytic_k1" "build/pwx/envelope/${scenario}__table_k1"               "build/pwx/${scenario}__k1.json" --label "${scenario},K1,piecewise-x400"
          done

      - name: Isolate clay representation from lookup
        shell: bash
        run: |
          set -euo pipefail
          cp -a build/pwx/envelope/clay_wet_free__table_k0 build/pwx/envelope/clay_wet_free__legacy_k0
          pushd build/pwx/envelope/clay_wet_free__legacy_k0 >/dev/null
          set +e
          timeout 30 "$GITHUB_WORKSPACE/swap-table-legacy" > legacy.log 2>&1
          rc=$?
          set -e
          popd >/dev/null
          test "$rc" -eq 100
          python3 research/tabulated_hydraulics/compare_hupsel_e2e.py \
            build/pwx/envelope/clay_wet_free__analytic_k0 \
            build/pwx/envelope/clay_wet_free__legacy_k0 \
            build/pwx/clay_legacy_vs_analytic.json --label "clay,K0,piecewise-legacy"
          python3 research/tabulated_hydraulics/compare_hupsel_e2e.py \
            build/pwx/envelope/clay_wet_free__legacy_k0 \
            build/pwx/envelope/clay_wet_free__table_k0 \
            build/pwx/clay_legacy_vs_direct.json --label "clay,K0,legacy-vs-direct"

      - name: Gate fidelity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          limits={"GWL":(0.05,0.01),"DSTOR":(0.02,0.005),"DRAINAGE":(0.02,0.005),"DRN":(0.02,0.005),"QBOTTOM":(0.02,0.005),"TACT":(0.02,0.005)}
          failed=[]; lines=["label\tmetric\tmax_abs\trmse\tpass"]
          for p in sorted(Path("build/pwx").glob("*__k[01].json")):
              d=json.loads(p.read_text())
              for metric,(ma,rm) in limits.items():
                  if metric not in d["metrics"]: continue
                  m=d["metrics"][metric]; ok=m["max_abs"]<=ma and m["rmse"]<=rm
                  lines.append(f"{d['label']}\t{metric}\t{m['max_abs']}\t{m['rmse']}\t{ok}")
                  if not ok: failed.append((d["label"],metric,m))
          Path("build/pwx/fidelity.tsv").write_text("\n".join(lines)+"\n")
          print(Path("build/pwx/fidelity.tsv").read_text(),end="")
          if failed: raise SystemExit(str(failed))
          PY

      - name: Lookup equivalence and repeated benchmark
        shell: bash
        run: |
          set -euo pipefail
          for kval in 0 1; do
            for route in analytic legacy direct; do
              if [ "$route" = analytic ]; then work="build/pwx/hupsel/analytic_k"$kval; bin="$GITHUB_WORKSPACE/swap-analytic";
              elif [ "$route" = legacy ]; then work="build/pwx/hupsel/legacy_k"$kval; bin="$GITHUB_WORKSPACE/swap-table-legacy";
              else work="build/pwx/hupsel/table_k"$kval; bin="$GITHUB_WORKSPACE/swap-table-direct"; fi
              pushd "$work" >/dev/null; set +e; timeout 30 "$bin" >/dev/null 2>&1; rc=$?; set -e; popd >/dev/null
              test "$rc" -eq 100
            done
            python3 research/tabulated_hydraulics/compare_hupsel_e2e.py               "build/pwx/hupsel/legacy_k"$kval "build/pwx/hupsel/table_k"$kval               "build/pwx/lookup-k"$kval".json" --label "legacy-vs-direct-piecewise,K"$kval
          done
          python3 - <<'PY'
          from pathlib import Path
          import csv,statistics,subprocess,time
          root=Path("build/pwx").resolve()
          routes={
            "analytic_k0":(Path("swap-analytic").resolve(),root/"hupsel/analytic_k0"),
            "legacy_k0":(Path("swap-table-legacy").resolve(),root/"hupsel/legacy_k0"),
            "direct_k0":(Path("swap-table-direct").resolve(),root/"hupsel/table_k0"),
            "analytic_k1":(Path("swap-analytic").resolve(),root/"hupsel/analytic_k1"),
            "legacy_k1":(Path("swap-table-legacy").resolve(),root/"hupsel/legacy_k1"),
            "direct_k1":(Path("swap-table-direct").resolve(),root/"hupsel/table_k1")}
          def one(label):
              binary,work=routes[label]
              for fn in ("result_output.csv","swap.log"):
                  p=work/fn
                  if p.exists(): p.unlink()
              t=time.perf_counter(); proc=subprocess.run([str(binary)],cwd=work,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=30); dt=time.perf_counter()-t
              if proc.returncode!=100: raise RuntimeError((label,proc.returncode))
              return dt
          for label in routes: one(label)
          vals={x:[] for x in routes}; rows=[]; labels=list(routes)
          for rnd in range(12):
              order=labels[rnd%6:]+labels[:rnd%6]
              if rnd%2: order=list(reversed(order))
              for label in order:
                  dt=one(label); vals[label].append(dt); rows.append((rnd,label,dt))
          med={k:statistics.median(v) for k,v in vals.items()}
          with (root/"benchmark.csv").open("w",newline="") as fh:
              w=csv.writer(fh); w.writerow(["round","route","seconds"]); w.writerows(rows)
          lines=[f"{key}_median_s={med[key]:.9g}" for key in labels]
          for kval in (0,1):
              lines.append(f"direct_k{kval}_delta_vs_analytic_pct={100*(med[f'direct_k{kval}']/med[f'analytic_k{kval}']-1):.9g}")
              lines.append(f"direct_vs_legacy_k{kval}_pct={100*(med[f'direct_k{kval}']/med[f'legacy_k{kval}']-1):.9g}")
          (root/"benchmark-summary.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-piecewise-x400
          path: |
            build/pwx/fidelity.tsv
            build/pwx/*__k*.json
            build/pwx/clay_legacy_vs_analytic.json
            build/pwx/clay_legacy_vs_direct.json
            build/pwx/lookup-k*.json
            build/pwx/benchmark.csv
            build/pwx/benchmark-summary.txt
