name: TAB-HYD raw-head Staring constitutive profile

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-raw-head-constitutive.yml'
      - 'research/tabulated_hydraulics/raw_head_constitutive_profile.f90'
      - 'research/tabulated_hydraulics/patch_raw_head_logk_lookup.py'

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src

      - uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Apply derivative-consistent raw-head research patches
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py swap-src/src/utils/soilhydraulicsutils.f90
          python3 research/tabulated_hydraulics/patch_table_ksat_plateau_split.py swap-src/src/utils/soilhydraulicsutils.f90 swap-src/src/io/readswap.f90
          python3 research/tabulated_hydraulics/patch_table_theta_wet_linear.py swap-src/src/utils/soilhydraulicsutils.f90
          python3 research/tabulated_hydraulics/patch_raw_head_logk_lookup.py swap-src/src/soil/sptabulated.f90 swap-src/src/io/readswap.f90 swap-src/src/utils/soilhydraulicsutils.f90

      - name: Generate 400-row tables for all Staring parameter rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/raw-profile/inputs
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util

          p=Path("research/tabulated_hydraulics/prepare_envelope_cases_loghead.py")
          spec=importlib.util.spec_from_file_location("prep_log",p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          prep=mod.prep
          series=prep.read_staring(Path("staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv"))
          out=Path("build/raw-profile/inputs")
          names=[]
          for soil in sorted(series):
              par=series[soil]
              rows=mod.loghead_rows(par,400)
              if len(rows)<4:
                  continue
              names.append(soil)
              with (out/f"{soil}.dat").open("w") as fh:
                  fh.write(
                      f"{len(rows)} {par['ores']:.17e} {par['osat']:.17e} "
                      f"{par['alpha']:.17e} {par['n']:.17e} "
                      f"{par['ksat']:.17e} {par['lexp']:.17e}\n"
                  )
                  for h,theta,k in rows:
                      fh.write(f"{h:.17e} {theta:.17e} {k:.17e}\n")
          (out/"soils.txt").write_text("\n".join(names)+"\n")
          print(f"SOIL_COUNT={len(names)}")
          print("SOILS="+" ".join(names))
          PY

      - name: Compile actual wrappers and raw-head evaluator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/raw-profile/mod
          FLAGS="-O2 -std=f2018 -ffree-line-length-none -fcheck=all -fbacktrace"
          gfortran $FLAGS -J build/raw-profile/mod             -c research/tabulated_hydraulics/array_dimensions_stub.f90             -o build/raw-profile/arrays.o
          gfortran $FLAGS -I build/raw-profile/mod -J build/raw-profile/mod             -c research/tabulated_hydraulics/current_wrapper_stubs.f90             -o build/raw-profile/stubs.o
          gfortran $FLAGS -I build/raw-profile/mod -J build/raw-profile/mod             -c swap-src/src/soil/sptabulated.f90             -o build/raw-profile/sptabulated.o
          gfortran $FLAGS -I build/raw-profile/mod -J build/raw-profile/mod             -c swap-src/src/utils/soilhydraulicsutils.f90             -o build/raw-profile/wrappers.o
          gfortran $FLAGS -I build/raw-profile/mod -J build/raw-profile/mod             research/tabulated_hydraulics/raw_head_constitutive_profile.f90             build/raw-profile/arrays.o build/raw-profile/stubs.o             build/raw-profile/sptabulated.o build/raw-profile/wrappers.o             -o build/raw-profile/profile

      - name: Run all constitutive profiles
        shell: bash
        run: |
          set -euo pipefail
          : > build/raw-profile/results.csv
          first=1
          while read -r soil; do
            build/raw-profile/profile "$soil" "build/raw-profile/inputs/$soil.dat" > "build/raw-profile/$soil.csv"
            if [ "$first" -eq 1 ]; then
              grep -v '^RAW_HEAD_' "build/raw-profile/$soil.csv" > build/raw-profile/results.csv
              first=0
            else
              grep -v -E '^(soil,|RAW_HEAD_)' "build/raw-profile/$soil.csv" >> build/raw-profile/results.csv
            fi
          done < build/raw-profile/inputs/soils.txt

      - name: Summarize constitutive errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv,math

          rows=[]
          with Path("build/raw-profile/results.csv").open() as fh:
              for r in csv.DictReader(fh):
                  for k in r:
                      if k!="soil":
                          r[k]=float(r[k])
                  rows.append(r)
          by={}
          for r in rows:
              by.setdefault(r["soil"],[]).append(r)

          metrics={
              "theta_abs": lambda r: abs(r["theta_table"]-r["theta_analytic"]),
              "C_abs": lambda r: abs(r["C_table"]-r["C_analytic"]),
              "log10K_abs": lambda r: abs(math.log10(max(r["K_table"],1e-300))-math.log10(max(r["K_analytic"],1e-300))),
              "K_rel": lambda r: abs(r["K_table"]-r["K_analytic"])/max(abs(r["K_analytic"]),1e-12),
              "dKdh_abs": lambda r: abs(r["dKdh_table"]-r["dKdh_analytic"]),
          }
          lines=["soil\tmetric\tmaximum\th_cm"]
          global_best={k:(-1.0,None,None) for k in metrics}
          for soil,rr in sorted(by.items()):
              for name,fn in metrics.items():
                  vals=[(fn(r),r["h_cm"]) for r in rr if math.isfinite(fn(r))]
                  v,h=max(vals,key=lambda x:x[0])
                  lines.append(f"{soil}\t{name}\t{v:.17e}\t{h:.17e}")
                  if v>global_best[name][0]:
                      global_best[name]=(v,soil,h)
          Path("build/raw-profile/summary.tsv").write_text("\n".join(lines)+"\n")
          gl=["metric\tmaximum\tsoil\th_cm"]
          for name,(v,soil,h) in global_best.items():
              gl.append(f"{name}\t{v:.17e}\t{soil}\t{h:.17e}")
          Path("build/raw-profile/global-summary.tsv").write_text("\n".join(gl)+"\n")
          print(Path("build/raw-profile/global-summary.tsv").read_text(),end="")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-raw-head-staring-constitutive
          path: |
            build/raw-profile/summary.tsv
            build/raw-profile/global-summary.tsv
            build/raw-profile/inputs/soils.txt
