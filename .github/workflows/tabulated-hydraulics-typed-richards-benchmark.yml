name: TAB-HYD typed Reference Richards benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-typed-richards-benchmark.yml'
      - 'research/tabulated_hydraulics/tabhyd_typed_richards_benchmark.f90'
      - 'research/tabulated_hydraulics/make_tabhyd_richards_stubs.py'
      - 'research/tabulated_hydraulics/mod_tabhyd_raw_typed_provider_research.f90'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abhedwig-cell/SWAP5
          ref: bcef9debe56d14ce9b7d75ddbfe5c60c1323d8a5
          path: canonical-src
      - uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: legacy-src
      - uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Generate 32-node transfer-envelope inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/typed-richards
          python3 research/tabulated_hydraulics/make_tabhyd_richards_stubs.py             canonical-src/tests/fsi/fsi04_real_headcalc_stubs.f90 build/typed-richards/stubs.f90
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          p=Path("research/tabulated_hydraulics/prepare_envelope_cases_loghead.py")
          spec=importlib.util.spec_from_file_location("prep_log",p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          prep=mod.prep
          series=prep.read_staring(Path("staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv"))
          out=Path("build/typed-richards")
          for scenario,sc in prep.SCENARIOS.items():
              # 16 topsoil + 16 subsoil nodes; forcing state uses the preregistered initial groundwater-head scale.
              names=[sc["top"]]*16+[sc["sub"]]*16
              hbase=float(sc["gwli"])
              with (out/f"{scenario}.dat").open("w") as fh:
                  fh.write(f"32 400 4.0e-2 {hbase:.17e} 2.0\n")
                  for name in names:
                      par=series[name]
                      if par["h_enpr"] != 0.0:
                          raise SystemExit(f"typed benchmark only admits H_ENPR=0, got {name}")
                      rows=mod.loghead_rows(par,400)
                      fh.write(
                          f"{name} {par['ores']:.17e} {par['osat']:.17e} "
                          f"{par['alpha']:.17e} {par['n']:.17e} "
                          f"{par['ksat']:.17e} {par['lexp']:.17e} {par['h_enpr']:.17e}\n")
                      for h,t,k in rows:
                          fh.write(f"{h:.17e} {t:.17e} {k:.17e}\n")
          PY

      - name: Compile canonical Reference Richards with both providers
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/typed-richards/mod
          mkdir -p "$OUT"
          F="-O3 -std=f2008 -ffree-line-length-none -fcheck=bounds -fbacktrace"
          compile () { gfortran $F -J "$OUT" -I "$OUT" -c "$1" -o "$OUT/$2.o"; }

          compile build/typed-richards/stubs.f90 stubs
          compile research/tabulated_hydraulics/array_dimensions_stub.f90 tabarrays
          compile legacy-src/src/soil/sptabulated.f90 sptabulated
          compile canonical-src/src/solver/mod_soil_water_accepted_step_direction_contract.f90 stepdir
          compile canonical-src/src/transaction/mod_accepted_trajectory_directional_sensitivity.f90 trajdir
          compile canonical-src/src/runtime/mod_a23bu_worker_execution_context.f90 worker
          compile canonical-src/src/solver/mod_soil_water_solver_contract.f90 contract
          compile canonical-src/src/solver/mod_reference_linear_solver.f90 linear
          compile canonical-src/src/solver/mod_reference_richards_workspace.f90 workspace
          compile canonical-src/src/solver/mod_reference_richards_state_binding.f90 state
          compile canonical-src/src/solver/mod_b110_default_mvg_provider.f90 mvg
          compile research/tabulated_hydraulics/mod_tabhyd_raw_typed_provider_research.f90 table
          compile canonical-src/src/solver/mod_b110_source_sink_provider.f90 source
          compile canonical-src/src/solver/mod_b110_root_sink_provider.f90 root
          compile canonical-src/src/solver/mod_fixed_flux_top_boundary_provider.f90 top
          compile canonical-src/src/solver/mod_reference_richards_temporal_indicator.f90 temporal
          compile canonical-src/src/legacy/b1_10_port/headcalc.f90 headcalc
          compile canonical-src/src/adapter/mod_reference_richards_legacy_binding.f90 binding
          compile research/tabulated_hydraulics/tabhyd_typed_richards_benchmark.f90 benchmark

          gfortran -O3 "$OUT"/*.o -o build/typed-richards/benchmark

      - name: Run five typed Reference Richards cases
        shell: bash
        run: |
          set -euo pipefail
          : > build/typed-richards/results.txt
          for scenario in coarse_dry_free loam_mid_free clay_wet_free coarse_dry_pulse loam_capillary; do
            echo "SCENARIO=$scenario" | tee -a build/typed-richards/results.txt
            build/typed-richards/benchmark "build/typed-richards/$scenario.dat"               | tee "build/typed-richards/$scenario.txt" | tee -a build/typed-richards/results.txt
          done

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          scenarios=["coarse_dry_free","loam_mid_free","clay_wet_free","coarse_dry_pulse","loam_capillary"]
          rows=[]
          for scenario in scenarios:
              vals={}
              for line in Path(f"build/typed-richards/{scenario}.txt").read_text().splitlines():
                  if "=" in line and line.startswith("RICHARDS_") and "BLOCK" not in line:
                      k,v=line.split("=",1)
                      try: vals[k]=float(v)
                      except ValueError: pass
              required=["RICHARDS_HEAD_MAX_DIFF","RICHARDS_THETA_MAX_DIFF","RICHARDS_FLUX_MAX_DIFF",
                        "RICHARDS_ANALYTIC_MEDIAN_S","RICHARDS_TABLE_MEDIAN_S","RICHARDS_TABLE_DELTA_PCT"]
              miss=[k for k in required if k not in vals]
              if miss: raise SystemExit(f"{scenario} missing {miss}")
              rows.append((scenario,)+tuple(vals[k] for k in required))
          lines=["scenario\thead_max_diff\ttheta_max_diff\tflux_max_diff\tanalytic_median_s\ttable_median_s\ttable_delta_pct"]
          for row in rows: lines.append("\t".join(str(x) for x in row))
          Path("build/typed-richards/summary.tsv").write_text("\n".join(lines)+"\n")
          print(Path("build/typed-richards/summary.tsv").read_text(),end="")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-typed-reference-richards
          path: |
            build/typed-richards/results.txt
            build/typed-richards/summary.tsv
            build/typed-richards/*.txt
