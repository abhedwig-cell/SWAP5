name: TAB-HYD wet theta branch diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - research/tabulated-hydraulics-characterization
    paths:
      - '.github/workflows/tabulated-hydraulics-wet-theta.yml'
      - 'research/tabulated_hydraulics/patch_table_theta_wet_linear.py'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Checkout pre-strangler SWAP runtime
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/SWAP
          ref: 2a5ace1c06be7a257b64e9ac1896b489533f16e9
          path: swap-src

      - name: Materialize toml-f
        uses: actions/checkout@v4
        with:
          repository: toml-f/toml-f
          ref: f9ff54793b2d1a3edca7d6890548d18d48c98e36
          path: swap-src/subprojects/toml-f

      - name: Materialize ttutil
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/ttutil
          ref: v4.2.7
          path: swap-src/subprojects/ttutil

      - name: Checkout Hupsel application
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: a839e2e905f34dd264ad0c739f638454b3023def
          path: swap-testcases

      - name: Checkout Staring authority
        uses: actions/checkout@v4
        with:
          repository: Murilodsv/SWAP-SAMUCA
          ref: main
          path: staring-source

      - name: Build analytical control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check meson==1.7.0 ninja
          python3 research/tabulated_hydraulics/patch_mvg_ksat_dkdh_consistency.py             swap-src/src/utils/soilhydraulicsutils.f90
          meson setup swap-src/build-analytic swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-analytic
          cp swap-src/build-analytic/swap swap-analytic

      - name: Build branch-aware table candidate with wet theta branch
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tabulated_hydraulics/patch_table_ksat_plateau_split.py             swap-src/src/utils/soilhydraulicsutils.f90 swap-src/src/io/readswap.f90
          python3 research/tabulated_hydraulics/patch_table_theta_wet_linear.py             swap-src/src/utils/soilhydraulicsutils.f90
          meson setup swap-src/build-table swap-src -Denable_pfunit=false
          meson compile -C swap-src/build-table
          cp swap-src/build-table/swap swap-table

      - name: Prepare log-head envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wet-theta
          python3 research/tabulated_hydraulics/prepare_envelope_cases_loghead.py             swap-testcases/cases/hupselbrook/legacy             staring-source/xdata/soils/StaringSeries1994/staringreeks1994.csv             build/wet-theta/cases

      - name: Run five K0 analytical-table pairs
        shell: bash
        run: |
          set -euo pipefail
          printf 'case\troute\treturn_code\truntime_seconds\trows\n' > build/wet-theta/status.tsv
          for scenario in coarse_dry_free loam_mid_free clay_wet_free coarse_dry_pulse loam_capillary; do
            for route in analytic table; do
              work="build/wet-theta/cases/${scenario}__${route}_k0"
              if [ "$route" = analytic ]; then bin="$GITHUB_WORKSPACE/swap-analytic"; else bin="$GITHUB_WORKSPACE/swap-table"; fi
              pushd "$work" >/dev/null
              set +e
              /usr/bin/time -f '%e' -o runtime.txt timeout 30 "$bin" > run.log 2>&1
              rc=$?
              set -e
              popd >/dev/null
              runtime=$(tail -1 "$work/runtime.txt" 2>/dev/null || echo NA)
              rows=$(grep -v '^[[:space:]]*\*' "$work/result_output.csv" 2>/dev/null | grep -c . || true)
              printf '%s\t%s\t%s\t%s\t%s\n' "$scenario" "$route" "$rc" "$runtime" "$rows" | tee -a build/wet-theta/status.tsv
              test "$rc" -eq 100
            done
          done

      - name: Compare and apply original K0 fidelity limits
        shell: bash
        run: |
          set -euo pipefail
          : > build/wet-theta/comparisons.txt
          for scenario in coarse_dry_free loam_mid_free clay_wet_free coarse_dry_pulse loam_capillary; do
            python3 research/tabulated_hydraulics/compare_hupsel_e2e.py               "build/wet-theta/cases/${scenario}__analytic_k0"               "build/wet-theta/cases/${scenario}__table_k0"               "build/wet-theta/${scenario}.json"               --label "${scenario},K0,wet-theta" | tee -a build/wet-theta/comparisons.txt
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          limits={"GWL":(0.05,0.01),"DSTOR":(0.02,0.005),"DRAINAGE":(0.02,0.005),"DRN":(0.02,0.005),"QBOTTOM":(0.02,0.005),"TACT":(0.02,0.005)}
          failed=[]
          lines=["label\tmetric\tmax_abs\trmse\tpass"]
          for p in sorted(Path("build/wet-theta").glob("*.json")):
              d=json.loads(p.read_text())
              for metric,(ma,rm) in limits.items():
                  if metric not in d["metrics"]: continue
                  m=d["metrics"][metric]
                  ok=m["max_abs"]<=ma and m["rmse"]<=rm
                  lines.append(f"{d['label']}\t{metric}\t{m['max_abs']}\t{m['rmse']}\t{ok}")
                  if not ok: failed.append((d["label"],metric,m["max_abs"],m["rmse"]))
          Path("build/wet-theta/fidelity.tsv").write_text("\n".join(lines)+"\n")
          print(Path("build/wet-theta/fidelity.tsv").read_text(),end="")
          print(f"fidelity_failures={len(failed)}")
          if failed:
              raise SystemExit("wet-theta candidate exceeds original fidelity limits")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-hyd-wet-theta-diagnostic
          path: |
            build/wet-theta/status.tsv
            build/wet-theta/comparisons.txt
            build/wet-theta/fidelity.tsv
            build/wet-theta/*.json
