name: VQ reference qualification

on:
  pull_request:
    paths:
      - 'reference/swap-4.3.1/**'
      - 'tools/vq/**'
      - 'docs/verification/**'
      - '.github/workflows/vq-reference.yml'
  push:
    branches:
      - main
    paths:
      - 'reference/swap-4.3.1/**'
      - 'tools/vq/**'
      - 'docs/verification/**'
      - '.github/workflows/vq-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-reference:
    name: Verify current corrected reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gate dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Check B1.8 predecessor identity
        run: python tools/vq/b1_snapshot_identity.py --pin tools/vq/cases/b1-8-reference-pin.json

      - name: Check B1.9 admission identity and ordered preimage
        run: python tools/vq/b1_9_admission_gate.py

      - name: Recheck SWAP-013 predecessor guard
        run: |
          gfortran --version
          python reference/swap-4.3.1/patches/SWAP-013/tests/run_guard_gate.py

      - name: Check SWAP-012 actual-source evidence binding
        run: python reference/swap-4.3.1/patches/SWAP-012/tests/run_inverse_evidence_gate.py

      - name: Check VQ gate unit tests
        run: |
          python -m unittest \
            tools.vq.test_b1_snapshot_identity \
            tools.vq.test_b2_reference_gate

      - name: Check deterministic B1.9 reconstructor syntax
        run: python -m py_compile tools/vq/b1_9_reconstruct.py
