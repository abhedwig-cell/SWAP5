name: VQ reference qualification

on:
  pull_request:
    paths:
      - 'reference/swap-4.3.1/**'
      - 'tools/vq/**'
      - 'docs/verification/**'
      - '.github/workflows/vq-reference.yml'
  push:
    branches:
      - main
    paths:
      - 'reference/swap-4.3.1/**'
      - 'tools/vq/**'
      - 'docs/verification/**'
      - '.github/workflows/vq-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-reference:
    name: Verify current corrected reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gate dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Check B1.7 predecessor identity
        run: python tools/vq/b1_snapshot_identity.py --pin tools/vq/cases/b1-7-reference-pin.json

      - name: Check B1.8 admission identity and ordered preimage
        run: python tools/vq/b1_8_admission_gate.py

      - name: Check SWAP-013 source-bound Fortran guard gate
        run: |
          gfortran --version
          python reference/swap-4.3.1/patches/SWAP-013/tests/run_guard_gate.py

      - name: Check VQ gate unit tests
        run: |
          python -m unittest \
            tools.vq.test_b1_snapshot_identity \
            tools.vq.test_b2_result_contract \
            tools.vq.test_b2_result_record \
            tools.vq.test_b2_seam_contract \
            tools.vq.test_b2_reference_gate \
            tools.vq.test_tx_time_harness

      - name: Check blocked B2 handoff evidence is current
        run: |
          python tools/vq/b2_reference_gate.py \
            --candidate tools/vq/cases/b2-reference-candidate.json \
            --evidence tools/vq/cases/b2-reference-gate-2026-09-06.json \
            --allow-expected-blocked

      - name: Check VQ-1e1 verifier harness evidence
        run: |
          python tools/vq/tx_time_harness.py \
            --fixture-suite \
            --evidence tools/vq/cases/vq-1e1-tx-time-harness-2026-09-06.json

      - name: Check deterministic B1.8 reconstructor syntax
        run: python -m py_compile tools/vq/b1_8_reconstruct.py
