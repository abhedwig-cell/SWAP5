name: VQ reference qualification

on:
  pull_request:
    paths:
      - 'reference/swap-4.3.1/**'
      - 'tools/vq/**'
      - 'docs/verification/**'
      - '.github/workflows/vq-reference.yml'
  push:
    branches:
      - main
    paths:
      - 'reference/swap-4.3.1/**'
      - 'tools/vq/**'
      - 'docs/verification/**'
      - '.github/workflows/vq-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-reference:
    name: Verify current corrected reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gate dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Check B1.9 predecessor identity
        run: python tools/vq/b1_snapshot_identity.py --pin tools/vq/cases/b1-9-reference-pin.json

      - name: Check B1.10 admission identity and ordered preimage
        run: python tools/vq/b1_10_admission_gate.py

      - name: Recheck SWAP-012 predecessor inverse evidence
        run: python reference/swap-4.3.1/patches/SWAP-012/tests/run_inverse_evidence_gate.py

      - name: Check SWAP-002 source-bound compiled tillage-start gate
        run: |
          gfortran --version
          python reference/swap-4.3.1/patches/SWAP-002/tests/run_tillage_start_gate.py

      - name: Check VQ contract, harness and admission unit tests
        run: |
          python -m unittest \
            tools.vq.test_b1_snapshot_identity \
            tools.vq.test_b2_result_contract \
            tools.vq.test_b2_result_record \
            tools.vq.test_b2_seam_contract \
            tools.vq.test_b2_reference_gate \
            tools.vq.test_tx_time_harness \
            tools.vq.test_production_adapter_binding \
            tools.vq.test_production_adapter_gate \
            tools.vq.test_production_execution_gate

      - name: Check blocked B2 handoff evidence is current
        run: |
          python tools/vq/b2_reference_gate.py \
            --candidate tools/vq/cases/b2-reference-candidate.json \
            --evidence tools/vq/cases/b2-reference-gate-2026-09-06.json \
            --allow-expected-blocked

      - name: Check VQ-1e1 verifier harness evidence
        run: |
          python tools/vq/tx_time_harness.py \
            --fixture-suite \
            --evidence tools/vq/cases/vq-1e1-tx-time-harness-2026-09-06.json

      - name: Check VQ-1e2 production-adapter evidence
        run: |
          python tools/vq/production_adapter_gate.py \
            --candidate tools/vq/cases/b2-production-adapter-candidate.json \
            --evidence tools/vq/cases/vq-1e2-production-adapter-gate-2026-09-06.json \
            --allow-expected-blocked

      - name: Check VQ-1e3 production-execution evidence
        run: |
          python tools/vq/production_execution_gate.py \
            --candidate tools/vq/cases/b2-production-execution-candidate.json \
            --evidence tools/vq/cases/vq-1e3-production-execution-gate-2026-09-06.json \
            --allow-expected-blocked

      - name: Check deterministic B1.10 reconstructor syntax
        run: python -m py_compile tools/vq/b1_10_reconstruct.py
