<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111} .title{font-size:28px;font-weight:700}.panel{font-size:21px;font-weight:700}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f2f2f2;stroke:#333;stroke-width:1.5}.dark{fill:#d9d9d9;stroke:#222;stroke-width:1.5}.line{stroke:#222;stroke-width:2;fill:none}.dash{stroke:#555;stroke-width:2;stroke-dasharray:7 5;fill:none}.grid{stroke:#ddd;stroke-width:1}.axis{stroke:#222;stroke-width:1.5}.note{font-size:14px;fill:#333}
</style><text x="40" y="42" class="title">F1. Solver ownership, trial authority and publication boundary</text><text x="45" y="88" class="panel" text-anchor="start">A  Component ownership</text><rect x="60" y="115" width="330" height="180" rx="10" class="soft"/><text x="225" y="150" class="label" text-anchor="middle"><tspan x="225" dy="0">SWAP5</tspan><tspan x="225" dy="25">committed hydrological state</tspan><tspan x="225" dy="25">Richards solve + adaptive timesteps</tspan><tspan x="225" dy="25">candidate discard / commit</tspan></text><rect x="535" y="115" width="330" height="180" rx="10" class="soft"/><text x="700" y="150" class="label" text-anchor="middle"><tspan x="700" dy="0">Coupling service</tspan><tspan x="700" dy="25">window identity</tspan><tspan x="700" dy="25">predictor/corrector sequencing</tspan><tspan x="700" dy="25">coupled residual + acceptance</tspan></text><rect x="1010" y="115" width="330" height="180" rx="10" class="soft"/><text x="1175" y="150" class="label" text-anchor="middle"><tspan x="1175" dy="0">MODFLOW6</tspan><tspan x="1175" dy="25">groundwater state</tspan><tspan x="1175" dy="25">prepared nonlinear solve</tspan><tspan x="1175" dy="25">nonlinear iterate state</tspan></text><line x1="535" y1="205" x2="395" y2="205" class="line" marker-end="url(#arrow)"/><line x1="865" y1="205" x2="1005" y2="205" class="line" marker-end="url(#arrow)"/><text x="45" y="345" class="panel" text-anchor="start">B  One finite-window SWAP trial family</text><rect x="65" y="380" width="220" height="70" rx="10" class="dark"/><text x="175" y="408" class="label" text-anchor="middle"><tspan x="175" dy="0">accepted origin</tspan><tspan x="175" dy="20">at t_n</tspan></text><rect x="370" y="380" width="190" height="70" rx="10" class="soft"/><text x="465" y="408" class="label" text-anchor="middle"><tspan x="465" dy="0">predictor</tspan><tspan x="465" dy="20">trial</tspan></text><line x1="285" y1="415" x2="362" y2="415" class="line" marker-end="url(#arrow)"/><rect x="620" y="380" width="190" height="70" rx="10" class="soft"/><text x="715" y="408" class="label" text-anchor="middle"><tspan x="715" dy="0">corrector 1</tspan><tspan x="715" dy="20">trial</tspan></text><line x1="560" y1="415" x2="612" y2="415" class="line" marker-end="url(#arrow)"/><rect x="870" y="380" width="190" height="70" rx="10" class="soft"/><text x="965" y="408" class="label" text-anchor="middle"><tspan x="965" dy="0">corrector 2</tspan><tspan x="965" dy="20">trial</tspan></text><line x1="810" y1="415" x2="862" y2="415" class="line" marker-end="url(#arrow)"/><rect x="1120" y="380" width="190" height="70" rx="10" class="dark"/><text x="1215" y="408" class="label" text-anchor="middle"><tspan x="1215" dy="0">final retained</tspan><tspan x="1215" dy="20">candidate</tspan></text><line x1="1060" y1="415" x2="1112" y2="415" class="line" marker-end="url(#arrow)"/><text x="370" y="475" class="small" text-anchor="start">Every trial replays the same accepted origin; rejected trajectories do not become history.</text><text x="45" y="540" class="panel" text-anchor="start">C  Publication after coupled acceptance</text><rect x="70" y="580" width="210" height="82" rx="10" class="soft"/><text x="175" y="610" class="label" text-anchor="middle"><tspan x="175" dy="0">preflight</tspan><tspan x="175" dy="22">reversible</tspan></text><line x1="280" y1="621" x2="322" y2="621" class="line" marker-end="url(#arrow)"/><rect x="330" y="580" width="210" height="82" rx="10" class="soft"/><text x="435" y="610" class="label" text-anchor="middle"><tspan x="435" dy="0">MODFLOW</tspan><tspan x="435" dy="22">finalize timestep</tspan></text><line x1="540" y1="621" x2="582" y2="621" class="line" marker-end="url(#arrow)"/><rect x="590" y="580" width="210" height="82" rx="10" class="soft"/><text x="695" y="610" class="label" text-anchor="middle"><tspan x="695" dy="0">SWAP</tspan><tspan x="695" dy="22">commit candidate</tspan></text><line x1="800" y1="621" x2="842" y2="621" class="line" marker-end="url(#arrow)"/><rect x="850" y="580" width="210" height="82" rx="10" class="soft"/><text x="955" y="610" class="label" text-anchor="middle"><tspan x="955" dy="0">interface ledger</tspan><tspan x="955" dy="22">commit transfer</tspan></text><line x1="1060" y1="621" x2="1102" y2="621" class="line" marker-end="url(#arrow)"/><rect x="1110" y="580" width="210" height="82" rx="10" class="dark"/><text x="1215" y="610" class="label" text-anchor="middle"><tspan x="1215" dy="0">authoritative</tspan><tspan x="1215" dy="22">new boundary</tspan></text><text x="700" y="720" class="small" text-anchor="middle"><tspan x="700" dy="0">Rejected predictor/corrector: zero committed SWAP revision and zero authoritative interface mass.</tspan><tspan x="700" dy="22">Accepted transfer is published once, after all preflights pass.</tspan></text></svg>