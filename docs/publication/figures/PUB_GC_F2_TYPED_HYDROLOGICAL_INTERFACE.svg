</style><text x="40" y="42" class="title">F2. Typed hydrological interface at the fixed SWAP lower boundary</text><text x="45" y="88" class="small" text-anchor="start">Physical quantities are distinct even when they share one coupling plane.</text><rect x="115" y="135" width="620" height="470" rx="0" class="soft"/><text x="145" y="175" class="panel" text-anchor="start">SWAP vadose-zone column</text><line x1="165" y1="220" x2="685" y2="220" class="grid"/><line x1="165" y1="290" x2="685" y2="290" class="grid"/><line x1="165" y1="360" x2="685" y2="360" class="grid"/><line x1="165" y1="430" x2="685" y2="430" class="grid"/><line x1="165" y1="500" x2="685" y2="500" class="grid"/><text x="180" y="245" class="label" text-anchor="start">profile storage S(t)</text><line x1="95" y1="565" x2="765" y2="565" stroke="#111" stroke-width="5"/><text x="440" y="550" class="label" text-anchor="middle">fixed coupling plane z_bottom</text><rect x="115" y="610" width="620" height="135" rx="0" class="dark"/><text x="145" y="650" class="panel" text-anchor="start">MODFLOW6 groundwater cell</text><text x="145" y="690" class="label" text-anchor="start">hydraulic head H_mf6 at the coupling plane</text><line x1="330" y1="500" x2="330" y2="555" class="line" marker-end="url(#arrow)"/><text x="345" y="525" class="small" text-anchor="start">q_bot  native SWAP lower-boundary flux</text><line x1="555" y1="555" x2="555" y2="625" class="line" marker-end="url(#arrow)"/><text x="570" y="595" class="small" text-anchor="start">q_u  groundwater-facing exchange</text><rect x="830" y="135" width="500" height="165" rx="10" class="box"/><text x="1080" y="175" class="label" text-anchor="middle"><tspan x="1080" dy="0">Head transformation</tspan><tspan x="1080" dy="30">H_interface = z_bottom + psi_bottom</tspan><tspan x="1080" dy="30">explicit datum + cm↔m conversion</tspan></text><rect x="830" y="335" width="500" height="175" rx="10" class="box"/><text x="1080" y="375" class="label" text-anchor="middle"><tspan x="1080" dy="0">Whole-window authority</tspan><tspan x="1080" dy="30">V_u = ∫_W Q_u(t) dt</tspan><tspan x="1080" dy="30">terminal instantaneous flux ≠ V_u</tspan><tspan x="1080" dy="30">rejected trials: V_authoritative = 0</tspan></text><rect x="830" y="545" width="500" height="200" rx="10" class="box"/><text x="1080" y="585" class="small" text-anchor="middle"><tspan x="1080" dy="0">E1 restricted evidence</tspan><tspan x="1080" dy="27">q_bot = 1.00e-6 cm/day</tspan><tspan x="1080" dy="27">q_u = -9.659e-7 cm/day</tspan><tspan x="1080" dy="27">ledger = -1.098e-12 m</tspan><tspan x="1080" dy="27">public accepted rate integrates to the same amount</tspan></text></svg>