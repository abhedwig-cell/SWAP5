<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.panel{font-size:21px;font-weight:700}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f2f2f2;stroke:#333;stroke-width:1.5}.dark{fill:#d9d9d9;stroke:#222;stroke-width:1.5}.line{stroke:#222;stroke-width:2;fill:none}.dash{stroke:#555;stroke-width:2;stroke-dasharray:7 5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
