<text x="690" y="720" text-anchor="middle" class="small">0 loose windows • 0 strong windows • 0 E7 MODFLOW windows</text>
<text x="690" y="748" text-anchor="middle" class="small">No process disabling, tolerance change, date replacement, groundwater calibration or post-hoc window rescue</text>
</svg>