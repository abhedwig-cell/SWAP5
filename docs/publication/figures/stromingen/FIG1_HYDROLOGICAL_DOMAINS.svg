<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#39424e"/>
    </marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#1f2933}
      .label{font:600 25px Arial,sans-serif;fill:#1f2933}
      .small{font:400 21px Arial,sans-serif;fill:#39424e}
      .model{font:700 24px Arial,sans-serif;fill:#102a43}
      .arrow{stroke:#39424e;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="80" y="65" class="title">Eén watersysteem, verschillende modeldomeinen</text>

  <rect x="80" y="110" width="1440" height="155" rx="28" fill="#eef6ff"/>
  <text x="110" y="155" class="label">Atmosfeer en vegetatie</text>
  <g>
    <line x1="350" y1="180" x2="350" y2="245" class="arrow"/>
    <text x="250" y="175" class="small">neerslag</text>
    <line x1="570" y1="245" x2="570" y2="180" class="arrow"/>
    <text x="610" y="205" class="small">verdamping</text>
    <path d="M930 225 q25 -70 50 0 q25 -70 50 0 q25 -70 50 0" stroke="#5d7f46" stroke-width="10" fill="none"/>
    <text x="900" y="165" class="small">vegetatie</text>
  </g>

  <rect x="80" y="285" width="930" height="245" rx="28" fill="#f7f1e8" stroke="#c8b79d" stroke-width="2"/>
  <text x="110" y="330" class="label">Onverzadigde zone en wortelzone</text>
  <rect x="690" y="325" width="260" height="76" rx="18" fill="#ffffff" stroke="#7b8794" stroke-width="2"/>
  <text x="743" y="373" class="model">SWAP / SWAP5</text>
  <line x1="425" y1="350" x2="425" y2="485" class="arrow"/>
  <line x1="525" y1="485" x2="525" y2="355" class="arrow"/>
  <text x="185" y="430" class="small">infiltratie, opslag,</text>
  <text x="185" y="458" class="small">wortelopname, drainage</text>

  <rect x="80" y="555" width="930" height="220" rx="28" fill="#e7f2f7" stroke="#9bb8c7" stroke-width="2"/>
  <text x="110" y="600" class="label">Grondwater</text>
  <rect x="690" y="595" width="260" height="76" rx="18" fill="#ffffff" stroke="#7b8794" stroke-width="2"/>
  <text x="748" y="643" class="model">MODFLOW 6</text>
  <line x1="440" y1="530" x2="440" y2="575" class="arrow"/>
  <line x1="555" y1="575" x2="555" y2="530" class="arrow"/>
  <path d="M170 700 C350 635 530 760 720 690 C810 655 880 670 930 690" stroke="#547b91" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="190" y="740" class="small">grondwaterstroming</text>

  <rect x="1050" y="285" width="470" height="490" rx="28" fill="#eef4ec" stroke="#a8bea0" stroke-width="2"/>
  <text x="1080" y="330" class="label">Oppervlaktewater en waterverdeling</text>
  <rect x="1155" y="370" width="260" height="76" rx="18" fill="#ffffff" stroke="#7b8794" stroke-width="2"/>
  <text x="1238" y="418" class="model">Ribasim</text>
  <path d="M1115 540 C1210 485 1295 620 1390 555 C1435 525 1470 545 1490 560" stroke="#4d849c" stroke-width="10" fill="none"/>
  <circle cx="1160" cy="625" r="27" fill="#ffffff" stroke="#7b8794" stroke-width="3"/>
  <circle cx="1300" cy="650" r="27" fill="#ffffff" stroke="#7b8794" stroke-width="3"/>
  <circle cx="1430" cy="615" r="27" fill="#ffffff" stroke="#7b8794" stroke-width="3"/>
  <line x1="1185" y1="630" x2="1272" y2="645" class="arrow"/>
  <line x1="1327" y1="643" x2="1400" y2="622" class="arrow"/>
  <text x="1130" y="710" class="small">berging, netwerk, allocatie</text>

  <line x1="1010" y1="645" x2="1050" y2="645" class="arrow"/>
  <line x1="1050" y1="690" x2="1010" y2="690" class="arrow"/>
  <text x="80" y="845" class="small">Conceptuele figuur. De feitelijke koppeling, tijdstappen en ruimtelijke discretisatie verschillen per toepassing.</text>
