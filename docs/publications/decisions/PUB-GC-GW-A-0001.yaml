observations:
  - dummy_gw_trial records q_groundwater_m_per_s but does not calculate groundwater head from that exchange.
  - returned groundwater head is scripted from trial count and response_mode as 0.5 m or 0.7 m.
  - dummy_gw_capture provides service, lineage, revision, time and a token but does not snapshot an explicit physical groundwater head/storage state.
  - groundwater commit advances time and revision but does not publish a storage-derived head state.

verdict:
  reuse_fgc21_dummy_as_gw_a: false
  classification: TRANSACTIONAL_QUALIFICATION_TEST_DOUBLE_ONLY
  reason: The fixture is appropriate for fail-closed transaction and conservation-oracle testing, but it does not implement the dynamic storage-to-head response required for the PUB-GC controlled groundwater model.

