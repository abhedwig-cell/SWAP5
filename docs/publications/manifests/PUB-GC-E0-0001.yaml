publication:
  primary_owner: PUB-GC
  doctoral_rq: RQ3
  thesis_synthesis_relevance: [TS1, TS3]
  excluded_primary_owners: [PUB-ME, PUB-SQ, PUB-RC, PUB-SG]

chronology:
