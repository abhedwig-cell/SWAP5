qualified_dependencies:
  GW_A:
    authority_head: 8a090fc9228574525e599817771aadb8ae176047
    module_blob: ac725a64ffa96f4f08998e9aac7537af5ca76ba0
  E1_origin_harness:
    blob: 687525b578eb0a28692dd666a87ddefe18b37c96
