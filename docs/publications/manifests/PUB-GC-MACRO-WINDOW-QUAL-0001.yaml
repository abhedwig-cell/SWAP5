interpretation:
  pass_means: >
    The research-only macro-window SWAP response preserves qualified one-step
    behavior, composes multiple native contributions without mutating the
    authoritative macro origin, preserves continuation state through public
    snapshot/initialize contracts, and exposes whole-window and terminal
    quantities distinctly when the qualification forcing produces a varying
    native response.
  nonclaims:
    - no H2 support or falsification
    - no H3 support or falsification
    - no practical coupling-window threshold
    - no MODFLOW6 result
    - no production admission
    - no response/tangent acceleration result
    - no reuse of observed Q2 or Q3 values for primary-case tuning

