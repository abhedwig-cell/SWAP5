  macro_window_qualification_receipt_commit: 2b20b016a9512676f66f20c134521a381d3d13c7
  native_time_spec_commit: 9d8528af50bfa8450e5ec731bfdd47f7cd6c83d1
  native_time_spec_blob: 5f563ca26d602a56fdd82419265fa1bfea63399e
  frozen_before_implementation_and_execution: true

