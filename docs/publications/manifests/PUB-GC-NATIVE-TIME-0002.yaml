    - all_other_previously_qualified_publication_components

reuse_guard:
  native_ladder_identical_to_0001: true
  five_cases_identical_to_0001: true
  four_adequacy_tolerances_identical_to_0001: true
  coarsest_passing_selection_rule_identical_to_0001: true
  terminal_surrogate_mismatch_as_selection_metric: prohibited
  observed_0001_N0_N1_values_may_not_change_selection_rule: true

common_fixture:
  initial_time_day: 4200.125
  total_macro_duration_day: 0.04
  initial_pressure_head_cm: -80.0
  bottom_mode: 5
  temporal_mode: TX_TEMPORAL_MODEL_CERTIFICATE
  model_temporal_indicator_budget: 100.0
  transaction_hard_mass_tolerance: 1.0e-10
  top_flux_scale: initial_state_positive_K0
  forcing_switch_day_from_macro_start: [0.0, 0.01, 0.02, 0.03, 0.04]

native_ladder:
  N0: {native_dt_day: 0.01, interval_count: 4}
  N1: {native_dt_day: 0.005, interval_count: 8}
  N2: {native_dt_day: 0.0025, interval_count: 16}
  N3: {native_dt_day: 0.00125, interval_count: 32, role: selection_reference_conditional_on_N2_N3_stability}

cases:
  - {case_id: NT-C0, prescribed_bottom_head_cm: -80.0, top_flux_factor_by_0p01_day_segment: [-1.0, -1.0, -1.0, -1.0]}
  - {case_id: NT-W3, prescribed_bottom_head_cm: -80.0, top_flux_factor_by_0p01_day_segment: [-3.0, -1.0, -1.0, -1.0]}
  - {case_id: NT-D05, prescribed_bottom_head_cm: -80.0, top_flux_factor_by_0p01_day_segment: [0.5, -1.0, -1.0, -1.0]}
  - {case_id: NT-R3, prescribed_bottom_head_cm: -80.0, top_flux_factor_by_0p01_day_segment: [-3.0, 0.5, -1.0, -1.0]}
  - {case_id: NT-H60, prescribed_bottom_head_cm: -60.0, top_flux_factor_by_0p01_day_segment: [-1.0, -1.0, -1.0, -1.0]}

frozen_tolerances:
  absolute_cumulative_Q_whole_difference_cm: 1.0e-4
  final_max_pressure_head_difference_cm: 1.0e-2
  final_max_water_content_difference: 1.0e-5
  final_total_water_storage_difference_cm: 1.0e-4

fine_level_guard:
  comparison: N2_vs_N3
  must_pass_all_metrics_in_all_cases: true
  failure_result: NO_POLICY_SELECTED_FINE_LEVEL_UNSTABLE
  postrun_threshold_relaxation: prohibited
  postrun_case_removal: prohibited

policy_selection:
  comparison_reference: N3
  ordering: [N0, N1, N2]
  rule: select_coarsest_level_passing_all_metrics_in_all_cases
  allowed_results:
    - SELECT_N0_0P01000_DAY
    - SELECT_N1_0P00500_DAY
    - SELECT_N2_0P00250_DAY
    - NO_POLICY_SELECTED
    - NO_POLICY_SELECTED_FINE_LEVEL_UNSTABLE
  universal_SWAP_timestep_claim_allowed: false

optimization:
  modes: [O0, O2]
  require_exact_scientific_output_identity: true

nonclaims:
  - no H2 support or falsification
  - no H3 support or falsification
  - no practical coupling-window threshold
  - no MODFLOW6 result
  - no universal SWAP timestep recommendation
  - no PUB-SQ solver-performance inference

next_permitted_action:
  - create research/pub-gc-native-time-0002 from requalified macro-time head
  - copy the 0001 test oracle byte-for-byte
  - use a new runner only to bind the new authority and manifest
  - execute once under O0/O2
  - accept the mechanical selection without retuning
