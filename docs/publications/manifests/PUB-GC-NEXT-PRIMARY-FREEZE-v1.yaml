next_primary_tranche:
  id: GC-E2E3-PRIMARY-A
  scientific_questions:
    - Does whole-window integrated exchange outperform a terminal-flux surrogate on new transient stress cases at matched subsystem physics?
    - Does the accepted coupled solution approach GC-REF as the coupling window is refined?
  required_new_case_classes:
    - recharge_or_wetting_pulse_with_intra_window_flux_evolution
    - capillary_or_drying_transition_with_sign_or_magnitude_change_in_lower_boundary_exchange
  case_selection_rule: >-
    Materialize exactly one case from each class using the existing qualified Reference SWAP
    response surface. Case selection may use forcing shape, groundwater depth and expected
    qualitative mechanism, but may not use observed M0/M1/M2/M3 ranking or terminal-versus-whole
    error because those are the primary outcomes.
  minimum_methods:
    - GC-M0 loose sequential baseline
    - GC-M1 terminal-flux exchange comparator
    - GC-M2 restricted same-origin predictor/corrector
  add_when_qualified:
    - GC-M3 converged same-origin fixed point
    - GC-M4 fair literature-aligned relaxed comparator
  prohibited:
    - response_or_tangent_acceleration
    - RossFast_specific_solver_claim
    - N_to_1_hydrologic_value_claim

window_design:
  rule: >-
    For each newly materialized case, freeze a four-level coupling-window ladder before primary
    execution. Levels must span one clearly fine/reference-like window, two intermediate windows
    and one deliberately stressful but still executable window.
  selection_firewall: >-
    Screening may establish executability only. It may not inspect comparative primary errors
    and then move a window level to improve a preferred method.

GC_REF:
  construction: >-
    Same accepted origin, analytic GW-A, strict same-origin outer solve and a fine window.
    Repeat with one further window refinement. Reference is stable only if groundwater head,
    whole-window exchange and selected SWAP state metrics change below their separately frozen
    reference-stability limits.
  current_oracle: GC-REF-A qualifies the root/reconstruction machinery, not the final stress-case references.

primary_endpoints:
  - groundwater_head_error_vs_GC_REF
  - cumulative_whole_window_exchange_error_vs_GC_REF
  - selected_SWAPP_state_or_storage_error_vs_GC_REF
  - hard_action_reaction_residual
  - failure_or_window_reduction_count
  aggregation: Conjunctive accuracy classification; no weighted score may hide a failed component.

