screening_metrics:
  per_accepted_reference_window:
    - Q_whole_cm
    - q_terminal_cm_per_day
    - Q_terminal_cm
    - signed_Q_whole_minus_Q_terminal_cm
    - abs_Q_whole_minus_Q_terminal_cm
    - GW_A_head_from_Q_whole_m
    - GW_A_head_from_Q_terminal_m
    - abs_paired_GW_head_difference_m
    - reconstructed_reference_residual_m
    - bisection_evaluations
  per_level:
    - cumulative_Q_whole_cm
    - gross_Q_whole_cm
    - sum_abs_terminal_surrogate_mismatch_cm
    - max_abs_terminal_surrogate_mismatch_cm
    - terminal_GW_head_m
    - final_SWAPPresureHead_profile
    - final_water_content_profile
    - final_total_water_storage_cm
  reference_refinement:
    - L1_to_L2_max_matched_GW_head_difference_m
    - L1_to_L2_cumulative_exchange_difference_cm
    - L1_to_L2_final_max_pressure_head_difference_cm
    - L1_to_L2_final_max_water_content_difference
    - L1_to_L2_final_storage_difference_cm

screening_resolution_floor:
  abs_terminal_surrogate_mismatch_cm: 1.0e-8
  meaning: numerical_detectability_only
  practical_materiality_claim_allowed: false

case_adjudication:
  VALID_STABLE_RESOLVED:
    - all three reference levels complete
    - L1_to_L2_reference_stability_passes
    - max_abs_terminal_surrogate_mismatch_cm > 1.0e-8
  VALID_STABLE_UNRESOLVED:
    - all three reference levels complete
    - L1_to_L2_reference_stability_passes
    - max_abs_terminal_surrogate_mismatch_cm <= 1.0e-8
  VALID_UNSTABLE:
    - all three levels execute but L1_to_L2 stability fails
  INVALID:
    - root bracket failure
    - subsystem trial failure
    - accepted publication failure
    - authority drift
    - nonfinite required telemetry

heldout_promotion_rule:
  - Screening cases are permanently ineligible for primary H2/H3 inference.
  - A family may be considered for held-out primary work only if its screening case is VALID_STABLE_RESOLVED.
  - The corresponding heldout_primary_candidate values above are already frozen and may not be changed after screening to increase an observed effect.
  - If more than three families are eligible, retain the three with the largest max_abs_terminal_surrogate_mismatch_cm; ties are resolved by manifest order.
  - If fewer than three are eligible, do not invent replacement amplitudes from the observed data. Freeze a separate scientific design decision before adding another family.
  - Eligibility/ranking is a stress-test selection device, not evidence of population frequency or practical importance.

nonclaims:
  - screening outcomes do not establish H2
  - screening outcomes do not establish H3
  - numerical detectability is not practical materiality
  - fixed-flux wetting/drying labels are controlled boundary experiments, not complete meteorological scenarios
  - no MODFLOW6 transferability is tested
  - no selected screening case can later be called held-out

next_permitted_action:
  - create research/pub-gc-transient-screening from the frozen stable reference-screening head
  - implement case/schedule parameterization without modifying qualified dependencies
  - execute all six cases under O0 and O2
  - persist every valid, invalid, stable, unstable, resolved and unresolved result
  - apply the frozen heldout promotion rule without post-hoc amplitude tuning
