sign_contract:
  native_top_flux_unit: cm_per_day
  negative_top_flux: downward_into_soil
  positive_top_flux: upward_out_of_soil
  authority:
    - >
      src/legacy/b1_10_port/headcalc.f90: the flux-boundary contribution enters
      the top-compartment residual as +qtop while the Darcy head-boundary
      expression is -K*((hsurf-h1)/dz+1); the pond balance contains
      -qtop*dt, so a negative qtop removes water from the surface layer into
      the soil.
    - >
      In the specified-groundwater special case, positive rainfall produces a
      negative vertical_flux(1), confirming the downward-negative convention.
  interpretation:
    baseline_minus_K: unit-gradient downward drainage/infiltration flux
    wetting_more_negative: stronger downward surface input
    drying_positive: upward surface extraction
  note: >
    These labels describe controlled boundary-flux direction only; they do
    not claim that the fixed-flux research boundary is a complete atmospheric
    surface-energy or evaporation model.

