        stability-unresolved case. Each qualified case uses the 32-substep endpoint under the
        integrated-invariant Reference policy, after passing both 8-vs-16 and 16-vs-32
        frozen stability comparisons.
      candidate_firewall: RossFast and timing remained unexecuted; the three unresolved cases are excluded from equal-error performance.
      next_permitted_action: >-
        Freeze the exact 33-case REF-HIGH-qualified performance population and preregister
        solver controls, equal-error matching, work accounting and timing hygiene before any
        RossFast performance execution. No speedup claim is yet authorized.
