research_question: >-
  Under what operating conditions can a numerically distinct Richards-equation solver
  be admitted as scientifically interchangeable within an established process-based model,
  when admissibility is defined prospectively by trajectory, conservation, robustness and
  computational criteria?

novelty_boundary:
  not_claimed:
    - The Ross algorithm.
    - A generic Ross-versus-Newton performance comparison.
    - The existence of a typed dual-solver API.
  candidate_contribution: >-
    A prospective, model-level solver-admission method that defines validity independently
    of the candidate solver, maps the admissible operating domain and compares cost only at
    matched scientific error.
  literature_anchors:
    - doi: 10.2134/agronj2003.1352
      relevance: Original fast Ross soil-water solution.
    - doi: 10.5194/hess-21-2667-2017
      relevance: Ross, Newton-Raphson and time-stepping comparison.
    - doi: 10.1016/j.advwatres.2026.105327
      relevance: Current mass-conservative Richards time-integration literature.
    - doi: 10.5194/gmd-19-8233-2026
      relevance: Recent dual-solver unsaturated-zone model behind a unified API.

hypotheses:
  H1: >-
    Solver interchangeability is conditional and can be represented as a reproducible
    admissibility domain rather than a global equivalence statement.
  H2: >-
    Candidate-independent criteria derived from Reference behaviour, conservation and
    temporal requirements predict RossFast acceptance or rejection on untouched holdout regimes.
  H3: >-
    On a non-empty subset of the common admissible domain, RossFast achieves lower total
    computational cost than Reference at matched scientific error.
  H4: >-
    Outside its admitted domain the selected RossFast route fails closed without silent
    substitution by the Reference solver and without accepted-state contamination.

design:
  design_or_calibration_set:
    role: threshold_and_case_design_only
    content:
      - Existing F-ROSS13 36-material transient qualification.
      - Existing Reference-only boundary-condition sweeps and failure census.
      - Existing Reference local-balance scaling and residual-contract work.
    restriction: >-
      These data may define strata, reference controls and candidate-independent thresholds,
      but may not be presented as untouched confirmation of thresholds tuned with their outcomes.
  holdout_set:
    selection_rule: >-
      Freeze a stratified set before candidate-result inspection. Reuse the qualified materials,
      but hold out combinations of initial hydraulic state, forcing intensity, duration and
      boundary regime not used to tune the publication thresholds. Include dry, intermediate,
      wet and boundary-sensitive cases, and retain predefined failure cases.
    prohibition: No post-result replacement of an inconvenient holdout case by a nearby easier case.

numerical_reference:
  id: REF-HIGH
  construction: >-
    P2E21 final authority: Reference-only REPRESENTATION_BOUNDED_TOTAL policy. Compartment
    balance retains the 1.6e-15 cm integrated allowance per substep. The total-column
    convergence bound is computed before each solve as max(1.6e-15 cm,
    0.5 * sum_i((spacing(theta_s_material)+spacing(theta_base_i))*dz_i)), without an empirical
    safety factor. All 36 frozen cases are valid at 8, 16 and 32 equal substeps and pass both
    unchanged P2E18 stability comparisons. The qualified endpoint is the 32-substep result.
  current_qualified_population: 36
  current_unresolved_population: 0
  performance_reference_population: all 36 frozen E3 cases
  failure_rule: >-
    The representation-bounded policy is research Reference infrastructure only and must not
    be silently promoted into the production Reference tolerance policy. Future performance
    work must retain all 36 frozen cases and may classify a matched-error case as unresolved
    rather than retuning the reference or dropping the case.

primary_endpoint:
  name: holdout_admissibility
  definition: >-
    A method is admissible for a case only when all predeclared primary scientific metrics
    satisfy their solver-independent tolerance relative to REF-HIGH and all hard mass,
    temporal, domain and transaction gates pass.
  primary_metrics:
    - pressure_head_trajectory_or_profile_error
    - water_content_or_storage_error
    - integrated_top_transfer_error
    - integrated_bottom_transfer_error
    - total_water_balance_residual
    - accepted_or_rejected_status
  aggregation_rule: >-
    Admission is conjunctive. A failure in any hard metric is a case failure and may narrow
    the claimed domain; it may not be averaged away.

secondary_endpoints:
  - retry_and_rejection_count
  - reference_nonlinear_work
  - ross_internal_work
  - solver_cpu_time
  - total_model_cpu_and_wall_time
  - temporal_certificate_diagnostics

equal_error_cost_endpoint:
  definition: >-
    Primary realized-error comparator is frozen by P2E23. RossFast uses N=1. Reference uses
    the casewise N_hi, defined prospectively as the smallest representation-bounded integer
    refinement N in 1..32 whose realized normalized head/theta error is less than or equal to
    RossFast N=1 against the same REF-HIGH endpoint, with unchanged storage, mass and route
    gates. Thirty-four cases are bracketed by N_lo/N_hi; two are left-censored at N=1.
  timing_rule: >-
    Timing must reuse the admitted SWAP5 performance-measurement architecture, execute on an
    MP-8 contract-ready and MP-7 host-admitted isolated runner, use repeated paired
    order-balanced measurements, preserve exact scientific outputs, and report CPU and wall
    metrics separately together with solver work counters.
  speed_claim_rule: >-
    No speedup claim is permitted before the host-resolution gate passes, and no claim may
    extend outside the frozen 36-case common admissible domain or reinterpret the two
    left-censored cases as strict equality.

thresholds:
  scientific_tolerances:
    authority: >-
      Freeze from Reference-only preregistration, reference-stability analysis and existing
      model-level conservation/temporal authorities before viewing confirmatory RossFast outcomes.
    rule: No RossFast-dependent widening.
  hard_failures:
    - out_of_domain_without_fail_closed_behavior
    - silent_solver_fallback
    - accepted_mass_or_temporal_gate_failure
    - accepted_state_contamination_after_rejection
  domain_rule: >-
    Any valid holdout failure narrows the domain. The paper may report a conditional domain;
    it must not preserve a broad envelope by averaging across failures.

kill_or_redirect:
  standalone_claim_fails_if:
    - Thresholds require material post-hoc widening after confirmatory RossFast results.
    - Holdout failures show no reproducible operating-domain structure.
    - REF-HIGH is unstable for too much of the intended domain to support scientific comparison.
    - Equal-error cost advantage is absent and the remaining result is only a routine solver benchmark.
  redirect: >-
    Publish or document a narrower SWAP-specific solver evaluation and keep the qualified
    production capability without a general admission-framework claim.

publication_firewall:
  excludes_primary_claims_from: [PUB-ME, PUB-GC, PUB-RC, PUB-SG]
  may_share_raw_inputs_with: [PUB-GC, PUB-RC]
