      timing_boundary: >-
        Timing has not been executed. A future primary timing comparison may use RossFast N=1
        versus casewise Reference N_hi. The two left-censored N1/N1 cases must be labelled
        conservative Reference-more-accurate comparisons. N_lo may be a bracket sensitivity
        comparator; runtime interpolation is not authorized.
      next_permitted_action: >-
