predeclared_interpretation:
  result: >
    Both frozen primary history discriminants exceed their frozen numerical
    discrimination floors while all validity checks pass. Under the
    preregistered rule, the held-out experiment supports H1 at the
    operator-definition level: candidate response is reproducible when
    evaluated from the same accepted origin, whereas the deliberately
    history-contaminated diagnostic produces order-dependent response.
  scope: >
    This is evidence for the need to define subsystem candidate response from
    a common accepted origin in this controlled real-SWAP/GW-A held-out case.
  practical_materiality: NOT_ESTABLISHED
  generality_beyond_this_case: NOT_ESTABLISHED
