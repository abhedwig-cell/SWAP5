admitted_scope:
  - The research comparator isolates whole-window versus endpoint-terminal exchange accounting without rerunning SWAP.
  - Both groundwater arms are evaluated from the same accepted GW-A checkpoint and remain nonpublishing.
  - The terminal surrogate is exactly q_terminal times coupling-window duration.
  - Synthetic selectivity controls show that changing only one exchange representation changes only its corresponding comparator arm.
  - The frozen real E1-B row is reproduced analytically by GW-A using only already frozen observables.
  - O0 and O2 qualification output is identical.

nonclaims:
  - H2 is not established by this qualification.
  - No practical hydrologic materiality is established.
  - No coupling-window threshold or convergence order is established.
  - The near-zero difference in the frozen E1-B qualification row is not an H2 effect estimate.
  - No MODFLOW 6 transferability is established.
  - This comparator is not production groundwater science.

