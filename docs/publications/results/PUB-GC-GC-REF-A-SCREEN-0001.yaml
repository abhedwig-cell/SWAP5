admitted_scope:
  - A full multi-window GC-REF-A trajectory can advance real B1.10 SWAP and qualified GW-A through accepted revisions while retaining same-origin root evaluation within each window.
  - The controlled constant-forcing screening case has a stable finest L2 trajectory under all prospectively frozen L1-to-L2 criteria.
  - The accepted-state trajectory machinery is suitable for designing stronger transient reference-screening cases.
  - The numerical differences decreased from the coarser L0-to-L1 step to the final L1-to-L2 step for groundwater head and cumulative exchange in this screening case.

nonclaims:
  - H2 is not tested.
