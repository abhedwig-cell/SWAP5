admitted_scope:
  - GW-A implements the frozen linear-storage finite-window head update on the research branch.
  - A captured checkpoint contains the groundwater state/configuration required to reconstruct a trial from one accepted origin.
  - Trials and prepare/abort do not publish accepted groundwater state.
  - Prepared commit publishes head, time and revision once.
  - Stale checkpoint reuse is rejected fail-closed in the qualified oracle cases.
  - O0 and O2 produce identical scientific-oracle output for the qualification harness.

nonclaims:
