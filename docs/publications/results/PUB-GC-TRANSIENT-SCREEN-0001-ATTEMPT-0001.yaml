invalidity:
  classification: HARNESS_FORCING_RECONSTRUCTION_MISMATCH
  defect: >
    evaluate_active_residual() evaluated each frozen transient candidate with
    forcing%top_flux = current_top_flux(), but reconstruct_prepare_commit()
    reconstructed the selected root using active_forcing_template without
    reapplying current_top_flux(). For every window whose frozen top-flux factor
    differed from the baseline -1 factor, the reconstruction therefore used a
    different forcing from the root search.
  direct_code_evidence:
    root_evaluation: "forcing%top_flux = current_top_flux()"
    reconstruction_missing_operation: "forcing%top_flux = current_top_flux()"
    reconstruction_default: active_forcing_template
  observed_signature:
    cases_with_nonbaseline_top_flux:
      TS-WET-5: {L0: 2, L1: 2, L2: 2}
      TS-DRY-1: {L0: 2, L1: 2, L2: 2}
      TS-REV: {L0: 2, L1: 2, L2: 2}
      TS-LOW-SY-WET: {L0: 2, L1: 2, L2: 2}
    baseline_top_flux_only_cases:
      TS-GW-UP: VALID_STABLE_UNRESOLVED
      TS-GW-DOWN: VALID_STABLE_UNRESOLVED
  status_2_meaning: PUB_GC_REF_TRAJECTORY_RECONSTRUCTION_FAILED
  scientific_conclusion: NONE
  screening_selection_conclusion: NONE
  note: >
    Even outputs from the two baseline-only cases are retained only as debugging
    telemetry. The attempt is globally non-authoritative for family selection
    because the screening implementation did not faithfully implement the
    preregistered forcing schedule across root evaluation and reconstruction.

permitted_repair:
  scope: >
    Add the missing forcing%top_flux = current_top_flux() assignment to
    reconstruct_prepare_commit() so root evaluation and reconstruction use the
    same frozen forcing.
  prohibited:
    - changing any of the six preregistered cases
    - changing top-flux factors
    - changing coupling-window ladder
    - changing root bracket or tolerances
    - changing stability or resolution thresholds
    - changing heldout candidates
    - changing the heldout promotion rule
    - modifying src/**
  rerun_policy: >
    After the surgical harness repair, execute the same frozen manifest as a
    new attempt and preserve this invalid attempt permanently.

