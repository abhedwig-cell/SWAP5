terminal_surrogate_observation:
  all_levels_all_cases_max_abs_mismatch_cm: 0.0
  classification: STRUCTURAL_ZERO_REQUIRES_SEMANTIC_ADJUDICATION
  source_semantics_checked_after_run:
    serialized_reference_step_exchange: >
      bottom_outward_exchange_native = -bottom_flux * step_duration
    serialized_reference_terminal_flux: >
      terminal_bottom_outward_flux_native = -bottom_flux
    implication: >
      For an accepted coupling window represented by one accepted full SWAP
      step, q_terminal * window_duration equals the reported whole-window
      exchange by construction. A nonzero H2 discriminant therefore requires a
      window composed of multiple accepted internal exchange contributions (or
      another independently justified time integration of interface flux);
      simply adding stronger one-step stress amplitudes would not solve this
      identifiability problem.

scientific_interpretation:
  - The screen is valid supporting evidence about reference refinement and E2 identifiability under the frozen one-step-per-window design.
  - Four forcing-transition families require finer reference construction before they can satisfy the frozen L1-to-L2 stability thresholds.
  - The two groundwater-only families are stable at the frozen ladder but cannot resolve whole-window versus terminal exchange because the one-step representation makes the two quantities identical.
  - No H2 or H3 primary inference follows from this screening.
  - The absence of an eligible family is a design result and must not be bypassed by selecting a visually interesting invalid or unresolved case.

nonclaims:
  - no H2 support or falsification
  - no H3 support or falsification
  - no practical-materiality estimate
  - no MODFLOW6 transferability
  - no statement that terminal flux is generally equivalent to whole-window exchange
  - no permission to reuse these screening cases as held-out primary cases

next_permitted_action:
  - freeze a separate scientific design decision responding to zero promotion-eligible families
  - distinguish reference-refinement needs from the structural one-step H2 identifiability issue
  - do not change frozen amplitudes or promote screening values
  - define any multi-contribution coupling-window experiment prospectively before implementation
