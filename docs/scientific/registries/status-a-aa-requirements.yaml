  - {id: '4.3', theme: ST.4, perspective: Science & Technology, heading: Model/dataset validated, a: 'external-information validation; method; unvalidated components; interpretation consequences', aa: 'version-aware validation protocol; periodic breadth review'}
  - {id: '4.4', theme: ST.4, perspective: Science & Technology, heading: Use monitored, a: 'uses and example studies monitored and referenced', aa: 'use/user experience tracked evaluated documented and fed to development plan'}
  - {id: '4.5', theme: ST.4, perspective: Science & Technology, heading: General quality assessment, a: 'fitness for purpose relates tests sensitivity uncertainty validation and use to purpose/domain', aa: 'data reliability/accuracy/precision; external scientific review'}
  - {id: '5.1', theme: DO.5, perspective: Development & Organisation, heading: Development plan, a: 'planned development and progress informed by evaluation', aa: 'timeline; further evaluation; periodic plan update'}
  - {id: '5.2', theme: DO.5, perspective: Development & Organisation, heading: Version control system, a: 'development/release versioning; acceptance criteria; version differences; central archiving', aa: 'documentation and code-commenting protocol'}
  - {id: '6.1', theme: DO.6, perspective: Development & Organisation, heading: Metadata available, a: 'domain-appropriate metadata including required WR model metadata', aa: 'up-to-date public FAIR metadata'}
  - {id: '6.2', theme: DO.6, perspective: Development & Organisation, heading: Management plan, a: 'scientific/content; technical; succession; ownership; financial-cover responsibilities', aa: 'future-use/development vision; opportunities/threats; periodic update'}
  - {id: '6.3', theme: DO.6, perspective: Development & Organisation, heading: Dependencies discussed, a: 'input/output and third-party dependencies relevant to continuity', aa: 'dependency availability/demand risks obligations liabilities tracked'}
  - {id: '6.4', theme: DO.6, perspective: Development & Organisation, heading: External use formalised, a: 'conditions for external use and named support responsibility', aa: 'legally checked ownership-aligned user agreement including financial arrangements'}
  - {id: '7.1', theme: IU.7, perspective: Interpretation & Use, heading: Interpretation guidance, a: 'purpose; domain; theory/assumptions; evaluation summary; when not to use', aa: 'reflection on purpose/domain versus complexity implementation limits data quality/availability and performance'}
  - {id: '7.2', theme: IU.7, perspective: Interpretation & Use, heading: User manual, a: 'operation; installation; technical summary; minimum requirements; user I/O; support contact', aa: NO_PUBLIC_ADDITIONAL_AA_TEXT_IDENTIFIED}
