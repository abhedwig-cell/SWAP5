  - {id: '2.1', theme: ST.2, perspective: Science & Technology, heading: Implementation documented, a: 'implementation structure and flow mapped to technical design', aa: 'code commenting; motivated modular design; code review external to development team'}
  - {id: '2.2', theme: ST.2, perspective: Science & Technology, heading: Technical environment documented, a: 'language; environment; versions; critical settings; implementation limitations', aa: NO_PUBLIC_ADDITIONAL_AA_TEXT_IDENTIFIED}
