  - id: TB-ROOT-FKT
    path: tests/fkt
    kind: capability_test_family
    registration_status: partial
  - id: TB-ROOT-FMQ
    path: tests/fmq
    kind: capability_test_family
    registration_status: partial
  - id: TB-ROOT-FMR
    path: tests/fmr
    kind: capability_test_family
    registration_status: partial
  - id: TB-ROOT-FPE
    path: tests/fpe
    kind: capability_test_family
    registration_status: partial
  - id: TB-ROOT-FPM
    path: tests/fpm
    kind: capability_test_family
    registration_status: partial
  - id: TB-ROOT-FSI
    path: tests/fsi
