schema_version: 1

inventory_base:
  branch: integration/f-ci-canonical
  commit: 95d24660b51257119d5ee5fd25f2011e20b1dfa6
  purpose: >-
    Repository test-surface inventory used to establish the F-TA01 test-bank
    authority boundary. Later catalog changes must state the repository state
    on which their inventory was checked.

authorities:
  test_bank: docs/verification/test-bank.md
  verification_principles: docs/verification/principles.md
  reference_baselines: docs/verification/reference-baselines.md
  status_a_traceability: docs/status-a/TRACEABILITY.md

registration_status:
  complete: >-
    Claim or invariant, executable locator, fixture/input, oracle, acceptance,
    runner, provenance where applicable, and evidence relation are centrally
    reconstructable on the pinned state.
  partial: >-
    The test surface exists and is registered, but one or more required
    traceability fields remain local, implicit, or not centrally linked.
  unregistered: >-
    A repository test surface exists outside the registered inventory or no
    bounded registration record can be found.

required_traceability_fields:
  - stable_id
  - claim_or_invariant
  - test_locator
  - fixture_or_input
  - oracle
  - acceptance
  - runner
  - baseline_or_provenance
  - evidence_link
  - registration_status

registered_test_roots:
  - id: TB-ROOT-EB
    path: tests/eb
    kind: capability_test_family
    registration_status: partial
  - id: TB-ROOT-FCI
    path: tests/fci
    kind: capability_test_family
    registration_status: partial
  - id: TB-ROOT-FGC
    path: tests/fgc
