theme:
  name: material
  language: en
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  - search.suggest
  - search.highlight
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.superfences
strict: true
