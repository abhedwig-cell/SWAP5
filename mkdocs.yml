site_name: SWAP Documentation
site_description: Technical documentation for SWAP and the target modular SWAP architecture
site_author: SWAP development team
docs_dir: docs
nav:
- Home: index.md
- Architecture:
  - Overview: architecture/overview.md
  - Implementation status: architecture/implementation-status.md
  - Component ownership map: architecture/component-map.md
  - Legacy migration:
    - Migration map: architecture/legacy-migration.md
    - Migration slices and gates: architecture/migration-slices.md
    - M3 gate evidence: architecture/m3-gate-evidence.md
    - Control, I/O and accounting: architecture/legacy-migration-control.md
    - State, solver and hydraulics: architecture/legacy-migration-hydraulic.md
    - Process physics: architecture/legacy-migration-processes.md
    - Crop, solute and WOFOST-soil: architecture/legacy-migration-biophysics.md
  - Core invariants: architecture/invariants.md
  - Data ownership: architecture/data-ownership.md
- Architecture decisions:
  - Decision log: decisions/index.md
  - ADR-0001 One kernel, I/O outside: decisions/ADR-0001-one-kernel-io-outside.md
  - ADR-0002 Transactional time stepping: decisions/ADR-0002-transactional-time-stepping.md
  - ADR-0003 Worker-owned scratch: decisions/ADR-0003-worker-owned-scratch.md
  - ADR-0004 MultiSWAP execution templates: decisions/ADR-0004-multiswap-execution-templates.md
  - ADR-0005 Reference baseline chain: decisions/ADR-0005-reference-baseline-chain.md
- Verification:
  - Verification principles: verification/principles.md
  - Reference baselines: verification/reference-baselines.md
  - B0 source integrity: verification/b0-source-integrity.md
  - B1 snapshot history: verification/b1-snapshots.md
  - Legacy difference ledger: verification/legacy-differences.md
  - Expected difference registry: verification/expected-differences.json
  - VQ-1 integration: verification/vq-1-integration.md
  - VQ-1b B0 hardening rerun: verification/vq-1b-rerun-evidence.md
  - VQ-1c B1.4 provenance: verification/vq-1c-b1.4-evidence.md
  - Mass-accounting contract: verification/mass-accounting-contract.md
  - SWAP-011 B1 candidate: verification/swap-011-b1-candidate.md
- Performance:
  - MultiSWAP measurement architecture: performance/multiswap-measurement-architecture.md
  - MP-2 measurement collector: performance/mp-2-measurement-collector.md
  - MP-3 B0 shadow observation: performance/mp-3-b0-shadow-observation.md
  - MP-4 workload catalog: performance/mp-4-workload-catalog.md
- Legacy:
  - SWAP 4.3.1 baseline: legacy/swap-4.3.1-baseline.md
- Development:
  - Parallel workstreams: development/workstreams.md
  - Documentation workflow: development/documentation.md
  - Online publication: development/publication.md
theme:
  name: material
  language: en
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  - search.suggest
  - search.highlight
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.superfences
strict: true
