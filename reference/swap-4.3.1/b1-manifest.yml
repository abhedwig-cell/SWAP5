admission_rule:
  requires:
    - stable_audit_id
    - reproduced_b0_defect
    - intended_formulation_or_rule
    - minimal_legacy_patch
    - exact_stored_patch_identity
    - canonical_b0_preimage_identity
    - ordered_preimage_identity_when_patches_share_a_target
    - regression_or_qualification_evidence
    - documented_expected_difference
  excludes:
    - unqualified_fix
    - model_development
    - performance_change_without_confirmed_defect
    - legacy_bug_compatibility_in_swap5

immutability:
